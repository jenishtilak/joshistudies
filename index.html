}\">${sc}%<\u002Fdiv>`:\"\";\n    // Count mastered (80%+ twice) and tried questions in this lesson\n    var masteredCount = 0, triedCount = 0;\n    if(_answeredKeysLoaded){\n      Object.entries(lesson.questions).forEach(function(pair){\n        var qt=pair[0], arr=pair[1];\n        for(var k=0;k<arr.length;k++){\n          var key = lesson.id+\"_\"+qt+\"_\"+k;\n          if(_masteredQuestionKeys.has(key)) masteredCount++;\n          if(_answeredQuestionKeys.has(key)) triedCount++;\n        }\n      });\n    }\n    const coveragePct = totalQ>0 ? Math.round(masteredCount/totalQ*100) : 0;\n    const triedPct    = totalQ>0 ? Math.round(triedCount/totalQ*100) : 0;\n    const isLessonComplete = !!_completeLessons[lesson.id];\n    const allMastered = isLessonComplete && totalQ>0 && masteredCount>=totalQ;\n    const masteryLabel = allMastered\n      ? '<span style=\"font-size:10px;color:var(--green);font-weight:800;white-space:nowrap\">\ud83c\udfc6 Mastered! +200<\u002Fspan>'\n      : isLessonComplete\n        ? '<span style=\"font-size:10px;color:var(--gold);font-weight:700;white-space:nowrap\">'+masteredCount+'/'+totalQ+' \u00b7 \ud83c\udfc6 master all for +200<\u002Fspan>'\n      : '<span style=\"font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap\">'+masteredCount+'/'+totalQ+' mastered<\u002Fspan>';\n    const completeBadge = isLessonComplete && !allMastered\n      ? '<div style=\"font-size:9px;background:var(--gold-light);color:#7d5c1e;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px\">\ud83c\udfc6 Master all '+totalQ+' questions to earn +200 pts<\u002Fdiv>' : '';\n    const coverageBar = totalQ>0 ? `<div style=\"margin-top:6px;display:flex;align-items:center;gap:6px\">\n      <div style=\"flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;position:relative\">\n        <div style=\"position:absolute;height:100%;width:${triedPct}%;background:var(--gold);border-radius:2px;opacity:.35\"><\u002Fdiv>\n        <div style=\"position:absolute;height:100%;width:${coveragePct}%;background:var(--green);border-radius:2px\"><\u002Fdiv>\n      <\u002Fdiv>\n      ${masteryLabel}\n    <\u002Fdiv>` : \"\";\n    card.innerHTML=`\n      <div class=\"lesson-num\">${i+1}<\u002Fdiv>\n      <div class=\"lesson-info\">\n        <div class=\"lesson-name\">${lesson.title}<\u002Fdiv>\n        <div class=\"lesson-meta\">${lesson.unit} \u00b7 ${totalQ} question${totalQ!==1?\"s\":\"\"} \u00b7 ${lesson.month}<\u002Fdiv>\n        ${coverageBar}\n        ${completeBadge}\n        <div class=\"lesson-card-modes\">\n          <button class=\"btn-revise\" onclick=\"event.stopPropagation();openRevise(${JSON.stringify(lesson.id)})\">\ud83d\udcd6 Revise<\u002Fbutton>\n          <button class=\"btn-practice\" onclick=\"event.stopPropagation();openLesson(lessons_${i})\">\u270f\ufe0f Practice<\u002Fbutton>\n          <button class=\"btn-test\" onclick=\"event.stopPropagation();startLessonTest(${JSON.stringify(lesson.id)})\"\n            style=\"${isLessonComplete?'':'opacity:.4;cursor:not-allowed;'}\"\n            title=\"${isLessonComplete?'Take the lesson test':'Test not available yet \u2014 lesson still being completed'}\">\n            ${isLessonComplete?'\ud83e\uddea Test':'\ud83d\udd12 Test'}\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>${badge}`;\n    // Store lesson ref for onclick\n    card.dataset.idx = i;\n    card.onclick = ()=>openLesson(lesson);\n    // Fix practice button to use correct lesson ref\n    card.querySelector(\".btn-practice\").onclick = (e)=>{ e.stopPropagation(); openLesson(lesson); };\n    card.querySelector(\".btn-revise\").onclick  = (e)=>{ e.stopPropagation(); openRevise(lesson); };\n    card.querySelector(\".btn-test\").onclick    = (e)=>{ e.stopPropagation(); startLessonTest(lesson.id); };\n    grid.appendChild(card);\n  });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  REVISE MODE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction openRevise(lesson){\n  // If already revising this exact lesson, just toggle the buttons \u2014 no need to re-render\n  if(currentMode===\"revise\" && currentLesson?.id===lesson.id && document.getElementById(\"quizOverlay\")?.classList.contains(\"visible\")){\n    document.getElementById(\"toggleRevise\")?.classList.add(\"active\");\n    document.getElementById(\"togglePractice\")?.classList.remove(\"active\");\n    return;\n  }\n  currentLesson = lesson;\n  currentMode = \"revise\"; // prevent renderCurrentQuestion from overwriting\n  const ov = document.getElementById(\"quizOverlay\");\n  ov.classList.add(\"visible\");\n  ov.scrollTo(0,0);\n  document.getElementById(\"quizLessonTitle\").textContent = lesson.title;\n  document.getElementById(\"quizPartLabel\").textContent = `${currentSubject} \u203a ${currentPart} \u203a ${lesson.unit}`;\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  const mas=document.getElementById(\"mockAnswerSheet\");\n  if(mas){ mas.classList.remove(\"visible\"); mas.innerHTML=\"\"; }\n  document.getElementById(\"qNavBar\").style.display = \"none\";\n  document.getElementById(\"qtypeTabs\").innerHTML = `<div style=\"padding:8px 14px;font-size:12px;font-weight:700;color:var(--sage)\">\ud83d\udcd6 Revision Notes \u2014 all questions &amp; answers<\u002Fdiv>`;\n  document.getElementById(\"toggleRevise\")?.classList.add(\"active\");\n  document.getElementById(\"togglePractice\")?.classList.remove(\"active\");\n  document.getElementById(\"modeToggle\").style.display=\"flex\";\n  const _msb2=document.getElementById(\"mockSubmitBar\");\n  if(_msb2) _msb2.style.display=\"none\"; // only ever meant for mock exam mode\n  const _qt2=document.getElementById(\"quizTimer\"); if(_qt2) _qt2.textContent=\"\";\n  initLiveGrowthBadge();\n  fbLiveState({ mode:\"revise\", lessonTitle: lesson.title });\n  renderRevise(lesson);\n}\n\nfunction renderRevise(lesson){\n  const body = document.getElementById(\"quizBody\");\n  body.style.display = \"block\";\n  body.scrollTo(0,0);\n  document.getElementById(\"quizOverlay\").scrollTo(0,0);\n\n  let html = `<div class=\"revise-body\">`;\n  _reviseSpellPool = []; // reset per-question spelling word pool for this render\n  _reviseRecitePool = []; // reset per-question recite pool for this render\n\n  QTYPES.forEach(qt=>{\n    const qs = lesson.questions[qt.id]||[];\n    if(!qs.length) return;\n\n    html += `<div class=\"revise-qtype-section\">\n      <div class=\"revise-qtype-heading\">${qt.icon} ${qt.label}<\u002Fdiv>`;\n\n    qs.forEach((q,i)=>{\n      html += `<div class=\"revise-card\"><div class=\"revise-q-num\">Q${i+1}<\u002Fdiv>`;\n\n      if(qt.id===\"mcq\"){\n        // shuffle deterministically \u2014 show correct highlighted\n        html += `<div class=\"revise-q\">${q.q}<\u002Fdiv>`;\n        q.options.forEach((opt,oi)=>{\n          html += `<div class=\"revise-mcq-opt${oi===q.correct?\" correct\":\"\"}\">${String.fromCharCode(65+oi)}. ${opt}<\u002Fdiv>`;\n        });\n\n      } else if(qt.id===\"fill\"){\n        let idx=0;\n        const filled = q.sentence.replace(/___/g,()=>{\n          const ans = q.answers[idx++]||\"\";\n          // Show slash-alternatives as \"word or word\" for clarity\n          const display = ans.split(\"/\").map(s=>s.trim()).join(\" or \");\n          return `<span class=\"revise-blank\">${display}<\u002Fspan>`;\n        });\n        html += `<div class=\"revise-fill-sentence\">${filled}<\u002Fdiv>`;\n\n      } else if(qt.id===\"match\"){\n        html += `<div class=\"revise-q\">${q.q||\"Match the following\"}<\u002Fdiv>\n          <table class=\"revise-match-table\">\n            <thead><tr><th>Column A<\u002Fth><th>Column B<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>${q.left.map((l,li)=>`<tr><td>${l}<\u002Ftd><td>${q.right[q.correct[li]]}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody>\n          <\u002Ftable>`;\n\n      } else if(qt.id===\"distinguish\"){\n        const qText = q.q || `Distinguish between ${q.termA} and ${q.termB}`;\n        const reciteIdx = registerRecite(q, qt, i);\n        html += `<div class=\"revise-q\">${qText}<\u002Fdiv>\n          <div id=\"${reciteIdx>=0?`revise-dist-table-${reciteIdx}`:\"\"}\">${buildDistTable(q)}<\u002Fdiv>\n          ${buildReviseReciteButton(reciteIdx, q)}\n          ${buildReviseSpellButton(getAnswerSpellingWords((q.answerA||\"\")+\" \"+(q.answerB||\"\")), lesson, qt, i)}`;\n\n      } else if(qt.id===\"truefalse\"){\n        html += `<div class=\"revise-q\">${q.statement||q.q}<\u002Fdiv>\n          <div class=\"revise-mcq-opt correct\">Answer: ${q.answer===\"true\"?\"True \u2713\":\"False \u2717\"}<\u002Fdiv>\n          ${q.reason?`<div class=\"revise-answer\" style=\"margin-top:8px\">${q.reason}<\u002Fdiv>`:\"\"}`;\n\n      } else if(qt.id===\"memorise\"){\n        const reciteIdx = registerRecite(q, qt, i);\n        html += `<div class=\"revise-q\">${q.q}<\u002Fdiv>\n          <div class=\"revise-answer\" id=\"${reciteIdx>=0?`revise-answer-${reciteIdx}`:\"\"}\" style=\"font-family:Georgia,serif;font-size:14px;line-height:1.9;white-space:pre-line\">${(q.lines||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n          ${buildReviseReciteButton(reciteIdx, q)}\n          ${buildReviseSpellButton(getAnswerSpellingWords(q.answer||\"\"), lesson, qt, i)}`;\n      } else {\n        // brief, reasons, paragraph\n        const reciteIdx = registerRecite(q, qt, i);\n        html += `<div class=\"revise-q\">${q.q}<\u002Fdiv>\n          <div class=\"revise-answer\" id=\"${reciteIdx>=0?`revise-answer-${reciteIdx}`:\"\"}\">${(q.answer||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n          ${buildReviseReciteButton(reciteIdx, q)}\n          ${buildReviseSpellButton(getAnswerSpellingWords(q.answer||\"\"), lesson, qt, i)}`;\n      }\n\n      html += `<\u002Fdiv>`;\n    });\n\n    html += `<\u002Fdiv>`;\n  });\n\n  html += `<\u002Fdiv>`;\n  body.innerHTML = html;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LESSON START (direct \u2014 no mode picker)\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction openLesson(lesson){\n  // If already viewing this lesson in practice mode, don't reset \u2014 just switch toggle state\n  if(currentMode===\"study\" && currentLesson?.id===lesson.id && document.getElementById(\"quizOverlay\")?.classList.contains(\"visible\")){\n    document.getElementById(\"togglePractice\")?.classList.add(\"active\");\n    document.getElementById(\"toggleRevise\")?.classList.remove(\"active\");\n    return;\n  }\n  currentMode=\"study\";\n  showPracticeBonusPopup(lesson, function(){ startLesson(lesson); });\n}\n\nfunction closePracticeBonusPopup(){\n  var el = document.getElementById(\"practiceBonusPopup\");\n  if(el) el.remove();\n}\n\nfunction showPracticeBonusPopup(lesson, onStart){\n  var briefCount   = (lesson.questions.brief||[]).length + (lesson.questions.reasons||[]).length;\n  var paraCount    = (lesson.questions.paragraph||[]).length + (lesson.questions.distinguish||[]).length;\n  if(briefCount===0 && paraCount===0){ onStart(); return; }\n  var rows = \"\";\n  if(briefCount>0) rows += '<div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)\">'\n    +'<div><div style=\"font-size:13px;color:#fff\">\ud83d\udcdd Brief + Reasons<\u002Fdiv>'\n    +'<div style=\"font-size:10px;color:rgba(255,255,255,.45);margin-top:1px\">All '+briefCount+' question'+(briefCount!==1?'s':'')+' \u00b7 80%+ score each<\u002Fdiv><\u002Fdiv>'\n    +'<div style=\"font-size:14px;font-weight:800;color:var(--gold)\">+100 pts<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  if(paraCount>0) rows += '<div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0\">'\n    +'<div><div style=\"font-size:13px;color:#fff\">\ud83d\udcc4 Detail + Distinguish<\u002Fdiv>'\n    +'<div style=\"font-size:10px;color:rgba(255,255,255,.45);margin-top:1px\">All '+paraCount+' question'+(paraCount!==1?'s':'')+' \u00b7 80%+ score each<\u002Fdiv><\u002Fdiv>'\n    +'<div style=\"font-size:14px;font-weight:800;color:var(--gold)\">+200 pts<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  var ov = document.createElement(\"div\");\n  ov.id = \"practiceBonusPopup\";\n  ov.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  ov.innerHTML = '<div style=\"background:var(--navy,#202a3d);border-radius:16px;padding:22px 20px;max-width:320px;width:100%\">'\n    +'<div style=\"font-size:15px;font-weight:800;color:#fff;margin-bottom:2px\">'+lesson.title+'<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:rgba(255,255,255,.45);margin-bottom:16px\">Practice Mode<\u002Fdiv>'\n    +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px\">\ud83c\udfaf Session Bonuses<\u002Fdiv>'\n    +rows\n    +'<div style=\"font-size:10px;color:rgba(255,255,255,.35);margin-top:10px;margin-bottom:16px\">Score 80%+ on ALL questions of that type in one session to earn the bonus<\u002Fdiv>'\n    +'<div style=\"display:flex;gap:8px\">'\n      +'<button onclick=\"closePracticeBonusPopup()\" style=\"flex:1;padding:10px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-weight:700;font-size:13px;cursor:pointer\">Cancel<\u002Fbutton>'\n      +'<button id=\"practiceBonusStartBtn\" style=\"flex:2;padding:10px;background:var(--gold,#d1983f);color:var(--navy);border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer\">Start! \u2192<\u002Fbutton>'\n    +'<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  document.body.appendChild(ov);\n  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };\n  document.getElementById(\"practiceBonusStartBtn\").onclick = function(){\n    ov.remove(); onStart();\n  };\n}\nfunction startLesson(lesson){\n  currentLesson = lesson;\n  resetSessionTypeBonus(); // fresh session, bonuses not yet awarded\n  // Open on a heading he's actually allowed into, or the tabs would show one\n  // set and the questions underneath would come from another.\n  const openable=allowedQTypes();\n  const firstWithQ=openable.find(qt=>lesson.questions[qt.id]&&lesson.questions[qt.id].length>0);\n  currentQType=firstWithQ?firstWithQ.id:(openable[0]?openable[0].id:QTYPES[0].id);\n\n  const ov=document.getElementById(\"quizOverlay\");\n  ov.classList.add(\"visible\");\n  ov.scrollTo(0,0);\n  document.getElementById(\"quizLessonTitle\").textContent=lesson.title;\n  document.getElementById(\"quizPartLabel\").textContent=`${currentSubject} \u203a ${currentPart} \u203a ${lesson.unit}`;\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n  const _mas=document.getElementById(\"mockAnswerSheet\");\n  if(_mas){ _mas.classList.remove(\"visible\"); _mas.innerHTML=\"\"; }\n\n  renderQTypeTabs();\n  document.getElementById(\"togglePractice\")?.classList.add(\"active\");\n  document.getElementById(\"toggleRevise\")?.classList.remove(\"active\");\n  document.getElementById(\"modeToggle\").style.display=\"flex\";\n  const _msb=document.getElementById(\"mockSubmitBar\");\n  if(_msb) _msb.style.display=\"none\"; // only ever meant for mock exam mode \u2014 leftover from a previous test otherwise\n  initLiveGrowthBadge();\n  fbLiveState({ mode:\"practice\", lessonTitle: lesson.title });\n  startQTypeSession();\n}\n\nfunction renderQTypeTabs(){\n  const wrap=document.getElementById(\"qtypeTabs\");\n  // Hide tabs entirely in practice test \u2014 questions span many lessons/types\n  if(currentLesson && currentLesson.id===\"__mock__\"){\n    wrap.innerHTML=\"\"; return;\n  }\n  wrap.innerHTML=\"\";\n  QTYPES.forEach(qt=>{\n    if(!isQTypeAllowed(qt.id)) return; // Focus Mode is restricted to other headings\n    const count=reachableQuestionCount(currentLesson, qt.id);\n    if(!count) return; // nothing left to reach under this heading\n    const t=document.createElement(\"div\");\n    t.className=\"qtype-tab\"+(qt.id===currentQType?\" active\":\"\");\n    t.innerHTML=`${qt.icon} ${qt.label}<span class=\"qt-count\">${count}<\u002Fspan>`;\n    if(count) t.onclick=()=>{\n      if(qt.id===currentQType) return; // already on this tab, no-op\n      saveCurrentQTypeSession();\n      currentQType=qt.id;\n      renderQTypeTabs();\n      startQTypeSession();\n    };\n    wrap.appendChild(t);\n    // Auto-scroll active tab into view\n    if(qt.id===currentQType) setTimeout(()=>t.scrollIntoView({behavior:\"smooth\",block:\"nearest\",inline:\"center\"}),50);\n  });\n}\n\n// \u2500\u2500 TIMER FUNCTIONS \u2500\u2500\nfunction fmtMs(ms){\n  const s=Math.floor(ms/1000), m=Math.floor(s/60);\n  return m>0?`${m}:${String(s%60).padStart(2,\"0\")}`:`0:${String(s).padStart(2,\"0\")}`;\n}\nfunction startTimer(){\n  stopTimer();\n  _sessionStart=Date.now();\n  _questionStart=Date.now();\n  _questionTimes=[];\n  _timerInterval=setInterval(()=>{\n    const totalEl=document.getElementById(\"quizTimer\");\n    const qEl=document.getElementById(\"qTimer\");\n    if(totalEl) totalEl.textContent=fmtMs(Date.now()-_sessionStart);\n    if(qEl)     qEl.textContent=\"Q: \"+fmtMs(Date.now()-_questionStart);\n  },1000);\n}\nfunction stopTimer(){\n  if(_timerInterval){ clearInterval(_timerInterval); _timerInterval=null; }\n  const qEl=document.getElementById(\"qTimer\");\n  if(qEl) qEl.textContent=\"\";\n}\nfunction stampQuestion(){\n  stopSpeedTimer();\n  const elapsed=Date.now()-_questionStart;\n  _questionTimes.push(elapsed);\n  _questionStart=Date.now();\n  return elapsed;\n}\n// Quick, unobtrusive \"+N points\" toast \u2014 fires every time Growth Points goes\n// up. Stacks if several fire in quick succession (e.g. answering MCQs fast)\n// instead of overlapping, and each one clears itself automatically. Never\n// blocks input, never requires dismissing, just a small confirming nudge.\nfunction showPointsToast(amount, label){\n  let stack = document.getElementById(\"pointsToastStack\");\n  if(!stack){\n    stack = document.createElement(\"div\");\n    stack.id = \"pointsToastStack\";\n    stack.style.cssText = \"position:fixed;top:14px;right:14px;z-index:99997;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none\";\n    document.body.appendChild(stack);\n  }\n  const toast = document.createElement(\"div\");\n  toast.style.cssText = \"background:var(--navy);color:var(--gold,#d1983f);font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;white-space:nowrap\";\n  toast.textContent = `+${amount} ${label || \"Growth Points\"} \ud83c\udfc6`;\n  stack.appendChild(toast);\n  requestAnimationFrame(()=>{\n    toast.style.opacity = \"1\";\n    toast.style.transform = \"translateY(0) scale(1)\";\n  });\n  setTimeout(()=>{\n    toast.style.opacity = \"0\";\n    toast.style.transform = \"translateY(-8px) scale(.9)\";\n    setTimeout(()=>toast.remove(), 250);\n  }, 1800);\n}\n\nfunction logQuestion(pct, elapsed, feedbackHTML, isCorrect, isSkip=false){\n  const origIdx = getOriginalQIndex(currentQIndex);\n  // clientId lets us reliably tell \"this exact attempt\" apart from every\n  // other attempt, and match it up later between the live session and\n  // Firestore \u2014 comparing timestamps for this doesn't work, since the\n  // session uses Date.now() (a plain number) while Firestore stores\n  // serverTimestamp() (a Timestamp object); those can never be equal even\n  // for the very same entry, which was silently causing every answer from\n  // the current session to be counted TWICE in the Growth Points total\n  // (once from the session, once from Firestore) until the next reload\n  // dropped the session's copy \u2014 which looked exactly like points had been\n  // taken away, when really the inflated number was just correcting itself.\n  const clientId = currentSessionId+\"-\"+Date.now()+\"-\"+Math.random().toString(36).slice(2,8);\n\n  // Work out the REAL point value BEFORE logging anything, and store that\n  // exact number on the entry itself. This used to be computed twice \u2014\n  // once here (to show the toast) and again later when the Scoreboard\n  // recalculated the total from history \u2014 and those two calculations kept\n  // drifting apart (this is exactly what happened to the first-attempt\n  // doubling, the Recite bonus, and the Speed Bonus, independently, at\n  // different points in this app's life). Storing the true value once, at\n  // the moment it's earned, means the toast and the permanent total can\n  // never disagree again \u2014 there's only one number, not two copies of it.\n  const qKey = (currentLesson?.id||\"\")+\"_\"+(currentQType||\"\")+\"_\"+origIdx;\n  const isFirstAttempt = pct >= MIN_SCORE_FOR_GOAL_CREDIT && !_answeredQuestionKeys.has(qKey);\n  const baseMarks = getMarks(currentQType);\n  const marks = pct >= MIN_SCORE_FOR_GOAL_CREDIT ? (isFirstAttempt ? baseMarks*2 : baseMarks) : 0;\n  const sb = pct >= MIN_SCORE_FOR_GOAL_CREDIT ? getSpeedBonus(currentQType, elapsed) : null;\n  // Practice bonus is unconditional (unlike marks/sb above, which require\n  // pct >= MIN_SCORE_FOR_GOAL_CREDIT) -- it's the whole point of it.\n  const practiceBonus = isSkip ? 0 : PRACTICE_BONUS_MARKS;\n  const totalEarned = marks + (sb ? sb.points : 0) + practiceBonus;\n\n  const entry = {\n    subject: currentSubject||'',\n    part: currentPart||'',\n    lessonId: currentLesson?.id||'',\n    lessonTitle: currentLesson?.title||'',\n    qtype: currentQType||'',\n    qIndex: origIdx,\n    pct, timeMs: elapsed, clientId, marks: totalEarned,\n    peeked: (hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)]||0) > 0\n  };\n  sessionLog.push({...entry, ts: Date.now()});\n  fbLogEntry(\"logs\", entry);\n  // Forward the SAME feedback the student is looking at \u2014 not just a number \u2014\n  // so the admin's live view genuinely mirrors what the student sees on screen.\n  fbLiveState({ answered:true, lastScore: pct, isCorrect: !!isCorrect, feedbackHTML: feedbackHTML||\"\", currentAnswer: document.getElementById(\"answerInput\")?.value||\"\" });\n  const btn=document.getElementById('reportBtn');\n  if(btn) btn.classList.add('visible');\n  // Recorded unconditionally (not gated by MIN_SCORE_FOR_GOAL_CREDIT below) so\n  // the \"Why not mastered?\" admin detail stays accurate live, in the current\n  // session, even for a sub-50% attempt -- matching what a full reload would\n  // rebuild from Firestore anyway, just without waiting for the reload.\n  const wasPeeked = (hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)]||0) > 0;\n  recordQuestionScoreInfo(qKey, pct, wasPeeked);\n  // Growth Points go up by +1 for every well-answered question (50%+) \u2014 show\n  // a quick, unobtrusive toast right away so he sees the number move every\n  // single time, without waiting for the Scoreboard to reload. Kept small and\n  // auto-dismissing on purpose: this happens often, so it should never feel\n  // like an interruption, just a quiet \"yes, that counted.\"\n  if(pct >= MIN_SCORE_FOR_GOAL_CREDIT){\n    bumpGrowthPointsBadge(totalEarned); // instant, persistent update \u2014 not just a toast\n    if(isFirstAttempt){\n      _answeredQuestionKeys.add(qKey); // mark as answered now\n      showPointsToast(marks, \"\ud83c\udd95 New question! 2\u00d7 points\");\n    } else {\n      showPointsToast(marks);\n    }\n    // Update mastery keys live so lesson cards update without reload\n    _answeredQuestionKeys.add(qKey);\n    // Parts mode = student saw each part split up, don't award mastery.\n    // Same reasoning applies to peeking: a score reached by looking at the\n    // model answer isn't proof he actually knows it unaided, so it shouldn't\n    // count as \"mastered\" either \u2014 otherwise peeking would quietly become a\n    // way to mark hard questions as done without ever really learning them.\n    if(pct >= 80 && !_answeredInPartsMode && !wasPeeked){\n      _masteredQuestionKeys.add(qKey);\n      checkMilestonesAfterMastery(); // fire-and-forget \u2014 checks if this update just completed a Social Science milestone\n      checkLessonMasteryBonus(currentLesson?.id); // fire-and-forget \u2014 checks if this update just fully mastered the whole lesson\n    }\n    if(_answeredInPartsMode && pct >= 80) console.log(\"Parts mode: score=\"+pct+\"% but mastery not awarded \u2014 student must answer all at once\");\n    if(wasPeeked && pct >= 80) console.log(\"Peeked at the answer: score=\"+pct+\"% but mastery not awarded \u2014 needs an unaided attempt\");\n\n    // Speed bonus \u2014 only for written types where fast = good recall. Now\n    // genuinely counted (see totalEarned/marks above), not just a toast.\n    if(sb) setTimeout(()=>showSpeedBonusToast(sb.points, sb.label), 600);\n\n    // Show points breakdown after a short delay\n    var inParts = _answeredInPartsMode;\n    setTimeout(function(){\n      var panel = document.getElementById(\"resultPanel\");\n      if(panel){\n        var breakdown = '<div style=\"background:var(--parchment);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:11px\">'\n          +'<div style=\"display:flex;justify-content:space-between;font-weight:700;color:var(--navy)\">'\n            +'<span>Points earned this question<\u002Fspan>'\n            +'<span style=\"color:var(--green)\">+'+totalEarned+'<\u002Fspan>'\n          +'<\u002Fdiv>';\n        if(isFirstAttempt) breakdown += '<div style=\"color:var(--muted);margin-top:2px\">\ud83c\udd95 New question bonus: \u00d72<\u002Fdiv>';\n        if(sb) breakdown += '<div style=\"color:var(--muted);margin-top:2px\">\u26a1 Speed bonus: +'+sb.points+'<\u002Fdiv>';\n        if(practiceBonus) breakdown += '<div style=\"color:var(--muted);margin-top:2px\">\u270d\ufe0f Practice bonus: +'+practiceBonus+'<\u002Fdiv>';\n        if(inParts) breakdown += '<div style=\"color:#cf8f2e;margin-top:4px;font-weight:700\">\u270d\ufe0f Answered in parts \u2014 not counted as mastered. Try answering all at once to master this question!<\u002Fdiv>';\n        breakdown += '<\u002Fdiv>';\n        panel.insertAdjacentHTML(\"beforeend\", breakdown);\n      }\n    }, 300);\n  } else {\n    // Even below 50%, track that the question was attempted\n    _answeredQuestionKeys.add(qKey);\n    // A wrong or low-scoring answer still earns the small practice bonus --\n    // repeating a question he hasn't gotten right yet is worth encouraging,\n    // not just the eventual correct attempt. Skips earn nothing (practiceBonus\n    // is 0 for those), so the messaging below falls back to the original text.\n    if(practiceBonus > 0){\n      bumpGrowthPointsBadge(practiceBonus);\n      showPointsToast(practiceBonus, \"\u270d\ufe0f Practice bonus\");\n    }\n    // Show points/no-points message\n    setTimeout(function(){\n      var panel = document.getElementById(\"resultPanel\");\n      if(panel){\n        var msg = practiceBonus > 0\n          ? \"Score below 50% \u2014 but +\"+practiceBonus+\" practice points just for trying! Keep going.\"\n          : \"Score below 50% \u2014 no points this time. Try again!\";\n        panel.insertAdjacentHTML(\"beforeend\", '<div style=\"background:var(--parchment);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:11px;color:var(--muted)\">'+msg+'<\u002Fdiv>');\n      }\n    }, 300);\n  }\n}\n\n// Checks if all questions of a type in this session scored 80%+ and awards bonus\nvar _sessionTypeBonusAwarded = {}; // qtype -> true once awarded per session\n\nfunction checkSessionTypeBonus(qtype){\n  // Only applies to brief and paragraph/distinguish types\n  // Group: brief+reasons = +100, paragraph+distinguish = +200\n  var group = (qtype===\"brief\"||qtype===\"reasons\") ? \"brief_reasons\"\n            : (qtype===\"paragraph\"||qtype===\"distinguish\") ? \"para_dist\" : null;\n  if(!group) return;\n  if(_sessionTypeBonusAwarded[group]) return;\n\n  var bonus = group===\"brief_reasons\" ? 100 : 200;\n  var groupTypes = group===\"brief_reasons\" ? [\"brief\",\"reasons\"] : [\"paragraph\",\"distinguish\"];\n\n  // All questions of all types in this group must be answered at 80%+\n  var totalNeeded = 0, allDone = true;\n  groupTypes.forEach(function(t){\n    var qs = currentLesson && currentLesson.questions[t] ? currentLesson.questions[t] : [];\n    totalNeeded += qs.length;\n    if(!qs.length) return;\n    var results = sessionResults.filter(function(r){ return r.qtype===t; });\n    if(results.length < qs.length) allDone = false;\n    else if(results.some(function(r){ return r.pct<80; })) allDone = false;\n  });\n  if(totalNeeded===0) return;\n\n  if(allDone){\n    _sessionTypeBonusAwarded[group] = true;\n    var label = group===\"brief_reasons\" ? \"\ud83d\udcdd All Brief & Reasons done!\" : \"\ud83d\udcc4 All Detail & Distinguish done!\";\n    setTimeout(function(){\n      showSpeedBonusToast(bonus, label+\" Session Bonus!\");\n      // Session bonus is a one-time toast only \u2014 not persisted to Firebase\n      // (These bonuses are motivational rewards, not part of the permanent score)\n    }, 1200);\n  }\n}\n\nfunction resetSessionTypeBonus(){\n  _sessionTypeBonusAwarded = {};\n}\n\nfunction showSpeedBonusToast(points, label){\n  let stack = document.getElementById(\"pointsToastStack\");\n  if(!stack){\n    stack = document.createElement(\"div\");\n    stack.id = \"pointsToastStack\";\n    stack.style.cssText = \"position:fixed;top:14px;right:14px;z-index:99997;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none\";\n    document.body.appendChild(stack);\n  }\n  const toast = document.createElement(\"div\");\n  toast.style.cssText = \"background:#c45000;color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;white-space:nowrap\";\n  toast.textContent = `+${points} Speed Bonus ${label}`;\n  stack.appendChild(toast);\n  requestAnimationFrame(()=>{ toast.style.opacity=\"1\"; toast.style.transform=\"translateY(0) scale(1)\"; });\n  setTimeout(()=>{\n    toast.style.opacity=\"0\"; toast.style.transform=\"translateY(-8px) scale(.9)\";\n    setTimeout(()=>toast.remove(), 250);\n  }, 2200);\n}\nfunction timeChip(ms){\n  const s=Math.round(ms/1000);\n  const cls=s<=15?\"fast\":s>=60?\"slow\":\"\";\n  return `<span class=\"time-chip ${cls}\">\u23f1 ${fmtMs(ms)}<\u002Fspan>`;\n}\n\n// \u2500\u2500 SPEED TIMER \u2500\u2500\nlet _speedTimerInterval = null;\n\nfunction startSpeedTimer(qtype){\n  stopSpeedTimer();\n  const wrap = document.getElementById(\"speedTimerWrap\");\n  if(!wrap) return;\n  const thresholds = SPEED_BONUS[qtype];\n  if(!thresholds) return;\n\n  const fastMs  = thresholds.fast[0];\n  const goodMs  = thresholds.good[0];\n  const fastPts = thresholds.fast[1];\n  const goodPts = thresholds.good[1];\n  const startMs = Date.now();\n\n  // Set challenge text\n  var fastMins = Math.round(fastMs/60000);\n  var challenge = document.getElementById(\"speedChallenge\");\n  var challenges = [\n    \"\u26a1 Can you nail this in \"+fastMins+\" min? +\"+fastPts+\" bonus!\",\n    \"\ud83c\udfc3 Race the clock \u2014 \"+fastMins+\" min for +\"+fastPts+\" pts!\",\n    \"\ud83d\udd25 Quick fire! Finish in \"+fastMins+\" min = +\"+fastPts+\"!\",\n    \"\ud83d\udcaa Challenge: beat \"+fastMins+\" min for +\"+fastPts+\" bonus!\",\n    \"\ud83c\udfaf Speed round \u2014 \"+fastMins+\" min target!\",\n  ];\n  if(challenge) challenge.textContent = challenges[Math.floor(Math.random()*challenges.length)];\n\n  function fmtCountdown(ms){\n    if(ms<=0) return \"0s\";\n    const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);\n    return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}s`;\n  }\n\n  const nudge15x = Math.round(goodMs * 1.5);\n  const nudge2x  = goodMs * 2;\n  const nudge3x  = goodMs * 3;\n\n  function tick(){\n    const elapsed = Date.now() - startMs;\n    const bar = document.getElementById(\"speedTimerBar\");\n    const pts = document.getElementById(\"speedTimerPts\");\n    const nudge = document.getElementById(\"speedNudge\");\n    if(!bar) return;\n\n    if(elapsed <= fastMs){\n      const rem = fastMs - elapsed;\n      bar.style.width = Math.max(0,(rem/fastMs)*100)+\"%\";\n      bar.style.background = \"#4a9873\";\n      if(pts){ pts.style.background=\"#4a9873\"; pts.textContent=\"\u26a1 +\"+fastPts+\" pts if done in \"+fmtCountdown(rem); }\n      if(nudge) nudge.textContent = \"\";\n    } else if(elapsed <= goodMs){\n      const rem = goodMs - elapsed;\n      bar.style.width = Math.max(0,(rem/(goodMs-fastMs))*100)+\"%\";\n      bar.style.background = \"#cf8f2e\";\n      if(pts){ pts.style.background=\"#cf8f2e\"; pts.textContent=\"\ud83d\udd50 +\"+goodPts+\" pts if done in \"+fmtCountdown(rem); }\n      if(nudge) nudge.textContent = \"\";\n    } else {\n      bar.style.width = \"0%\";\n      bar.style.background = \"#ccc\";\n      if(pts){ pts.style.background=\"#aaa\"; pts.textContent=\"No speed bonus\"; }\n      // Nudge messages \u2014 escalate over time\n      if(nudge){\n        if(elapsed >= nudge3x){\n          nudge.textContent = \"\ud83d\ude80 Skip this one and come back later!\";\n          nudge.style.color = \"#d15f5a\";\n        } else if(elapsed >= nudge2x){\n          nudge.textContent = \"\u23f0 Too long on this one \u2014 move on and retry later\";\n          nudge.style.color = \"#cf8f2e\";\n        } else if(elapsed >= nudge15x){\n          nudge.textContent = \"\ud83d\udca1 Write what you know \u2014 you can always retry!\";\n          nudge.style.color = \"var(--muted)\";\n        }\n      }\n    }\n  }\n\n  tick();\n  _speedTimerInterval = setInterval(tick, 500);\n}\n\nfunction stopSpeedTimer(){\n  if(_speedTimerInterval){ clearInterval(_speedTimerInterval); _speedTimerInterval=null; }\n}\n\n// Speed bonus thresholds (ms) per question type.\n// Only applies to written types where time reflects genuine recall speed.\n// Returns { points, label } or null if no bonus.\nconst SPEED_BONUS = {\n  brief:      { fast:[2*60000, 5, \"\u26a1 Quick recall!\"],   good:[4*60000,  2, \"\ud83d\udd50 Good pace!\"] },\n  reasons:    { fast:[3*60000, 5, \"\u26a1 Quick recall!\"],   good:[5*60000,  2, \"\ud83d\udd50 Good pace!\"] },\n  paragraph:  { fast:[5*60000, 5, \"\u26a1 Fast writer!\"],    good:[8*60000,  2, \"\ud83d\udd50 Good pace!\"] },\n  distinguish:{ fast:[4*60000, 5, \"\u26a1 Quick recall!\"],   good:[6*60000,  2, \"\ud83d\udd50 Good pace!\"] },\n  memorise:   { fast:[3*60000, 5, \"\u26a1 Well memorised!\"], good:[5*60000,  2, \"\ud83d\udd50 Good pace!\"] },\n};\n\nfunction getSpeedBonus(qtype, ms){\n  const thresholds = SPEED_BONUS[qtype];\n  if(!thresholds) return null;\n  if(ms <= thresholds.fast[0]) return { points: thresholds.fast[1], label: thresholds.fast[2] };\n  if(ms <= thresholds.good[0]) return { points: thresholds.good[1], label: thresholds.good[2] };\n  return null;\n}\n\n// Count unique questions actually learnt (deduped by lesson+qtype+qIndex),\n// as opposed to sessionLog.length which counts every attempt including retries.\nfunction countUniqueQuestions(log){\n  const seen = new Set();\n  log.forEach(e=>{\n    seen.add(`${e.lessonId}|${e.qtype}|${e.qIndex}`);\n  });\n  return seen.size;\n}\n\nlet studyAnswerCache = []; // cached {bodyHTML, resultHTML, answered, pct} per question index\nlet qtypeSessionState = {}; // key: lessonId+\":\"+qtype \u2192 {currentQIndex, sessionResults, questionStates, studyAnswerCache, mcqSelected, matchAnswers}\n\nfunction getQTypeSessionKey(){\n  return (currentLesson?.id||\"\")+\":\"+currentQType;\n}\n\nfunction saveCurrentQTypeSession(){\n  if(!currentLesson || currentLesson.id===\"__mock__\") return;\n  const key=getQTypeSessionKey();\n  qtypeSessionState[key]={\n    currentQIndex, sessionResults: [...sessionResults],\n    questionStates: questionStates.map(s=>({...s})),\n    studyAnswerCache: studyAnswerCache.map(c=>c?{...c}:null),\n    questionIndexMap: _questionIndexMap ? [..._questionIndexMap] : null\n  };\n}\n\nfunction loadQTypeSession(qtypeId){\n  const key=currentLesson.id+\":\"+qtypeId;\n  return qtypeSessionState[key]||null;\n}\n\nfunction startQTypeSession(){\n  const qs = currentLesson.questions[currentQType]||[];\n  const total = qs.length;\n  const existing=loadQTypeSession(currentQType);\n\n  // REMOVED: this used to reorder unanswered questions to the front of the\n  // list (\"show what you haven't answered yet first\"). It kept causing the\n  // same recurring bug \u2014 Practice mode's \"Question 1\" silently showing a\n  // DIFFERENT question's text than Revise mode's \"Question 1,\" because the\n  // display position no longer matched the question's real position in the\n  // lesson data. A narrower patch tried to stop a stale map leaking between\n  // tabs, but the reordering itself was still the underlying cause. Questions\n  // now always display in the lesson's fixed, natural order \u2014 identical to\n  // Revise mode \u2014 so \"Question 1\" always means the same thing everywhere.\n  _questionIndexMap = null;\n\n  if(existing){\n    // Restore previous progress for this qtype\n    currentQIndex=existing.currentQIndex;\n    sessionResults=[...existing.sessionResults];\n    questionStates=existing.questionStates.map(s=>({...s}));\n    studyAnswerCache=existing.studyAnswerCache.map(c=>c?{...c}:null);\n  } else {\n    currentQIndex=0;\n    sessionResults=[];\n    questionStates=Array.from({length:total},()=>({answered:false,skipped:false,pct:null}));\n    studyAnswerCache=Array.from({length:total},()=>null);\n  }\n  matchAnswers={};\n  mcqSelected=null;\n  startTimer();\n  const qTimerBar = document.querySelector(\".q-timer-bar\");\n  if(qTimerBar) qTimerBar.style.display = \"flex\";\n  renderNavBar();\n  // If this qtype was already answered fully, jump to its last position; else render current\n  const firstReachable = nextReachableIndex(currentQIndex, 1, total);\n  jumpToQuestion(firstReachable===-1 ? (nextReachableIndex(0, 1, total)===-1 ? currentQIndex : nextReachableIndex(0,1,total)) : firstReachable);\n}\n\nfunction saveStudyAnswer(pct){\n  if(!studyAnswerCache || currentLesson?.id===\"__mock__\") return;\n  const body=document.getElementById(\"quizBody\");\n  if(body && studyAnswerCache[currentQIndex]===null){\n    studyAnswerCache[currentQIndex]={bodyHTML:body.innerHTML, pct};\n  }\n}\n\n// \u2500\u2500 NAVIGATION BAR \u2500\u2500\nfunction renderNavBar(){\n  const qs=currentLesson.questions[currentQType]||[];\n  const bar=document.getElementById(\"qNavBar\");\n  if(!qs.length){ bar.style.display=\"none\"; return; }\n  bar.style.display=\"flex\";\n  bar.innerHTML=\"\";\n  if(!qs.length) { bar.style.display=\"none\"; return; }\n\n  // Prev button\n  const prev=document.createElement(\"button\");\n  prev.className=\"q-nav-prev\"; prev.textContent=\"\u2190 Prev\";\n  prev.disabled=nextReachableIndex(currentQIndex-1, -1, qs.length)===-1;\n  prev.onclick=()=>{ const t=nextReachableIndex(currentQIndex-1, -1, qs.length); if(t!==-1) jumpToQuestion(t); };\n  bar.appendChild(prev);\n\n  // Dot per question\n  qs.forEach((_,i)=>{\n    if(isQuestionHiddenByFocus(currentLesson?.id, currentQType, i)) return; // mastered, and Focus Mode is set to what's left\n    const dot=document.createElement(\"div\");\n    dot.className=\"q-nav-dot\";\n    const origI = getOriginalQIndex(i);\n    const qMasteryKey = (currentLesson?.id||\"\")+\"_\"+(currentQType||\"\")+\"_\"+origI;\n    const isMastered = _masteredQuestionKeys.has(qMasteryKey);\n    dot.textContent = isMastered ? \"\u2713\" : (i+1);\n    if(isMastered) dot.title = \"Mastered \u2014 try a new one!\";\n    if(i===currentQIndex) dot.classList.add(\"current\");\n    else if(questionStates[i]?.answered){\n      const p=questionStates[i].pct;\n      dot.classList.add(p>=80?\"answered-good\":p>=50?\"answered-mid\":\"answered-poor\");\n    } else if(questionStates[i]?.skipped) dot.classList.add(\"skipped\");\n    else if(isMastered) dot.classList.add(\"answered-good\");\n    dot.onclick=()=>jumpToQuestion(i);\n    bar.appendChild(dot);\n  });\n\n  // Next button\n  const next=document.createElement(\"button\");\n  next.className=\"q-nav-next\"; next.textContent=\"Next \u2192\";\n  next.disabled=currentQIndex>=qs.length-1;\n  next.onclick=()=>jumpToQuestion(currentQIndex+1);\n  bar.appendChild(next);\n}\n\nfunction jumpToQuestion(idx){\n  const total=(currentLesson.questions[currentQType]||[]).length;\n  if(idx<0||idx>=total) return;\n  // Landing on a hidden question means step past it rather than filter it out\n  if(isQuestionHiddenByFocus(currentLesson?.id, currentQType, idx)){\n    const fwd = nextReachableIndex(idx, 1, total);\n    const back = fwd===-1 ? nextReachableIndex(idx, -1, total) : -1;\n    const target = fwd!==-1 ? fwd : back;\n    if(target===-1 || target===idx) return;\n    idx = target;\n  }\n  const body=document.getElementById(\"quizBody\");\n  currentQIndex=idx;\n  mcqSelected=null;\n  matchAnswers={};\n  renderNavBar();\n  // Restore cached state if this question was already answered\n  if(studyAnswerCache && studyAnswerCache[idx]){\n    const cached=studyAnswerCache[idx];\n    body.innerHTML=cached.bodyHTML;\n    document.getElementById(\"resultPanel\")?.classList.add(\"visible\");\n    const br=document.getElementById(\"btnRow\");\n    if(br) br.style.display=\"flex\";\n  } else {\n    renderCurrentQuestion();\n  }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  RENDER CURRENT QUESTION\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Load answered + mastered question keys from Firebase on login (not just on scoreboard open)\nasync function loadMasteryKeys(){\n  if(!window._fb || !currentUserPhone){ console.log(\"loadMasteryKeys: skipped, no fb or phone\"); return; }\n  if(_answeredKeysLoaded){ console.log(\"loadMasteryKeys: already loaded\"); return; }\n  try{\n    console.log(\"loadMasteryKeys: fetching logs...\");\n    // Used to run its own full collection scan independent of getLogsBundle\n    // \u2014 meaning every single login paid for a second full re-read of the\n    // entire logs history on top of whatever the Scoreboard/welcome popup\n    // already fetched. Reusing the shared (now incremental) bundle removes\n    // that entirely redundant read.\n    await loadContentEditMarkers();\n    const { logsSnap } = await getLogsBundle();\n    console.log(\"loadMasteryKeys: got\", logsSnap.size, \"log entries\");\n    logsSnap.forEach(function(d){\n      var e = d.data();\n      // Skip entries that no longer refer to the question actually at this\n      // position -- e.g. a delete elsewhere in the array shifted it.\n      if(!isMasteryKeyStillValid(e.lessonId||\"\", e.qtype||\"\", e.qIndex||0, e.ts)) return;\n      var key = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n      _answeredQuestionKeys.add(key);\n      if((e.pct||0) >= 80 && !e.peeked) _masteredQuestionKeys.add(key);\n      recordQuestionScoreInfo(key, e.pct||0, !!e.peeked);\n    });\n    _answeredKeysLoaded = true;\n    console.log(\"loadMasteryKeys: answered=\", _answeredQuestionKeys.size, \"mastered=\", _masteredQuestionKeys.size);\n    // Re-render lesson cards with updated mastery info\n    try{ renderLessons(); console.log(\"loadMasteryKeys: renderLessons OK\"); }catch(e2){ console.log(\"loadMasteryKeys: renderLessons skipped -\", e2.message); }\n  }catch(e){ console.error(\"loadMasteryKeys error:\", e); }\n}\n\n// Maps display index to original DATA index (accounts for weighted reordering)\nfunction getOriginalQIndex(displayIdx){\n  return _questionIndexMap ? (_questionIndexMap[displayIdx]||displayIdx) : displayIdx;\n}\n// Gets the actual question object at the current display index\nfunction getCurrentQuestion(){\n  var qs = currentLesson.questions[currentQType]||[];\n  return qs[getOriginalQIndex(currentQIndex)];\n}\n\n// Returns a small badge showing whether this question is mastered, tried, or new\nfunction getQuestionStatusBadge(lessonId, qtype, qIndex){\n  var realIdx = getOriginalQIndex(qIndex||0);\n  var key = (lessonId||\"\")+\"_\"+(qtype||\"\")+\"_\"+realIdx;\n  if(_masteredQuestionKeys.has(key)) return '<span style=\"display:inline-block;font-size:9px;font-weight:700;background:var(--green-light);color:var(--green);padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle\">\u2705 Mastered<\u002Fspan>';\n  if(_answeredQuestionKeys.has(key)) return '<span style=\"display:inline-block;font-size:9px;font-weight:700;background:var(--gold-light);color:#7d5c1e;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle\">\ud83d\udcdd Attempted<\u002Fspan>';\n  return '<span style=\"display:inline-block;font-size:9px;font-weight:700;background:rgba(100,149,237,.15);color:#4169e1;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle\">\ud83c\udd95 New<\u002Fspan>';\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  IDLE NUDGE -- a gentle \"still there?\" banner if he's been sitting on the\n//  SAME question for a while with zero activity (no typing, no clicking).\n//  Not a penalty, not tied to points either way -- just a nudge so time\n//  doesn't quietly slip by on one question without him noticing.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst IDLE_NUDGE_MS = 90000; // 90 seconds of no activity on the same question\nlet _idleNudgeTimer = null;\n\nfunction resetIdleNudgeTimer(){\n  clearTimeout(_idleNudgeTimer);\n  hideIdleNudge();\n  if(currentMode===\"exam\") return; // no nudges during a timed mock exam\n  _idleNudgeTimer = setTimeout(showIdleNudge, IDLE_NUDGE_MS);\n}\n\nfunction showIdleNudge(){\n  const body = document.getElementById(\"quizBody\");\n  if(!body || document.getElementById(\"idleNudgeBanner\")) return;\n  const card = body.querySelector(\".question-card\");\n  if(!card || !card.parentNode) return;\n  const banner = document.createElement(\"div\");\n  banner.id = \"idleNudgeBanner\";\n  banner.style.cssText = \"margin:0 0 12px;padding:10px 14px;background:#fff6e6;border:1.5px dashed #d1983f;border-radius:10px;font-size:12.5px;color:#7a5a1e;line-height:1.5\";\n  banner.textContent = \"\u23f3 Been a little while on this one \u2014 take your time, or use Skip if you'd rather come back to it later.\";\n  card.parentNode.insertBefore(banner, card.nextSibling);\n}\n\nfunction hideIdleNudge(){\n  document.getElementById(\"idleNudgeBanner\")?.remove();\n}\n\n// One listener on the whole quiz body covers every question type (typing,\n// clicking an MCQ option, ticking a checkbox, speaking into the mic, etc.)\n// instead of wiring a reset call into every individual render function.\n(function initIdleNudgeListeners(){\n  const body = document.getElementById(\"quizBody\");\n  if(!body) return;\n  [\"input\",\"click\",\"keydown\"].forEach(evt=>body.addEventListener(evt, resetIdleNudgeTimer));\n})();\n\nfunction renderCurrentQuestion(){\n  if(currentMode===\"revise\") return;\n  if(currentLesson?.id===\"__mock__\") return; // practice test uses renderMockQuestion directly\n  // Reset per-question timer\n  _questionStart=Date.now();\n  resetIdleNudgeTimer(); // fresh question -- restart the idle clock too\n  const qEl=document.getElementById(\"qTimer\");\n  if(qEl) qEl.textContent=\"0:00\";\n  const qs=currentLesson.questions[currentQType]||[];\n  const body=document.getElementById(\"quizBody\");\n  body.style.display=\"block\";\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  body.scrollTo(0,0);\n  document.getElementById(\"quizOverlay\").scrollTo(0,0);\n  // Keep active tab highlight in sync\n  renderQTypeTabs();\n\n  // update progress\n  const total=qs.length;\n  const _qcr=document.getElementById(\"qCounter\"); if(_qcr) _qcr.textContent=total?`${currentQIndex+1} / ${total}`:\"\";\n  document.getElementById(\"progressFill\").style.width=total?`${(currentQIndex/total)*100}%`:\"0%\";\n\n  // Tell the admin mirror what the student is currently looking at\n  fbLiveState({\n    mode: \"study\",\n    lessonId: currentLesson?.id||\"\",\n    lessonTitle: currentLesson?.title||\"\",\n    qtype: currentQType,\n    qIndex: currentQIndex,\n    qTotal: total,\n    questionText: (qs[getOriginalQIndex(currentQIndex)]?.q || qs[getOriginalQIndex(currentQIndex)]?.sentence || qs[getOriginalQIndex(currentQIndex)]?.statement || \"\"),\n    correctAnswer: (qs[getOriginalQIndex(currentQIndex)]?.answer || (qs[getOriginalQIndex(currentQIndex)]?.answers||[]).join(\" / \") || \"\"),\n    currentAnswer: \"\",\n    answered: false,\n    isCorrect: false,\n    peeksUsedThisQuestion: 0 // fresh question \u2014 clear any peek flag left over from the previous one\n  });\n\n  if(!total){\n    body.innerHTML=`<div class=\"no-questions\">\n      <div class=\"nq-icon\">\ud83d\udced<\u002Fdiv>\n      <p>No questions added yet for this section.<br>Questions will appear here once added.<\u002Fp>\n    <\u002Fdiv>`;\n    return;\n  }\n\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const isLast=currentQIndex>=total-1;\n  const qnum=`Question ${currentQIndex+1} of ${total}`;\n\n  switch(currentQType){\n    case \"mcq\":        renderMCQ(q, qnum, isLast); break;\n    case \"fill\":       renderFill(q, qnum, isLast); break;\n    case \"match\":      renderMatch(q, qnum, isLast); break;\n    case \"brief\":      renderTextAnswer(q, qnum, isLast, false); break;\n    case \"truefalse\":  renderTrueFalse(q, qnum, isLast); break;\n    case \"reasons\":    renderTextAnswer(q, qnum, isLast, false); break;\n    case \"distinguish\":renderDistinguish(q, qnum, isLast); break;\n    case \"paragraph\":  renderTextAnswer(q, qnum, isLast, true); break;\n    case \"memorise\":   renderMemorise(q, qnum, isLast); break;\n  }\n  maybeShowNewTryBanner(currentQType, getOriginalQIndex(currentQIndex));\n}\n\n\n// \u2500\u2500 MEMORISE (Quote from Memory) \u2500\u2500\n// Shows the full poem/passage first. Student reads it, hides it,\n// then types it from memory. Score is based on word-level accuracy.\nfunction renderMemorise(q, qnum, isLast){\n  const peekBtn = currentMode!==\"exam\" ? `\n    <button class=\"btn-peek\" id=\"mainPeekBtn\" onclick=\"togglePeekMem()\" style=\"margin-bottom:10px\">\n      \ud83d\udcd6 Show / Hide the poem to study\n    <\u002Fbutton>\n    <div class=\"peek-panel\" id=\"peekPanel\" style=\"font-family:Georgia,serif;white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--text)\">\n${q.lines.replace(/<\u002Fg,\"&lt;\")}\n    <\u002Fdiv>` : \"\";\n  const actionBtns = currentMode===\"exam\"\n    ? `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"examNextText(${isLast})\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>`\n    : `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkTextAnswer()\">Check Recitation<\u002Fbutton>\n       <button class=\"btn-skip\" onclick=\"skipQuestion(${isLast})\">Skip<\u002Fbutton>`;\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">\ud83c\udfa4 Quote from Memory<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text\">${q.q}<\u002Fdiv>\n    <\u002Fdiv>\n    ${peekBtn}\n    <div id=\"speedTimerWrap\" style=\"margin:0 0 10px;padding:8px 10px;background:var(--parchment);border-radius:8px\">\n      <div style=\"font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center\" id=\"speedChallenge\">\u26a1 Challenge: Can you finish this one fast?<\u002Fdiv>\n      <div style=\"background:#e0e0e0;border-radius:3px;overflow:hidden;height:5px;margin-bottom:5px\">\n        <div id=\"speedTimerBar\" style=\"height:100%;width:100%;background:#4a9873;border-radius:3px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:10px;color:var(--muted)\">Speed Bonus<\u002Fspan>\n        <span id=\"speedTimerPts\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#4a9873;color:#fff;transition:background .5s\">\u26a1 calculating\u2026<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"speedNudge\" style=\"font-size:11px;font-weight:600;margin-top:6px;text-align:center;min-height:16px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"answer-area\" id=\"answerArea\" style=\"margin-top:10px\">\n      <textarea class=\"answer-textarea\" id=\"answerInput\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\"\n        placeholder=\"Study the poem above, then hide it and type it from memory here\u2026\"\n        style=\"min-height:180px;font-family:Georgia,serif;line-height:1.8\"\n        oninput=\"fbLiveState({currentAnswer:this.value, typing:true})\"\n        onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\"><\u002Ftextarea>\n      <div class=\"answer-actions\">${actionBtns}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n  setTimeout(()=>startSpeedTimer(\"memorise\"), 50);\n}\n\nfunction togglePeekMem(){\n  const panel = document.getElementById(\"peekPanel\");\n  const btn = document.getElementById(\"mainPeekBtn\");\n  const ta = document.getElementById(\"answerInput\");\n  if(!panel) return;\n  const showing = panel.classList.toggle(\"visible\");\n  if(showing){\n    btn.textContent = \"\ud83d\udcd5 Hide poem \u2014 now type from memory!\";\n    if(ta) ta.disabled = true; // lock textarea while poem is visible\n  } else {\n    const unlockForWriting = ()=>{\n      btn.textContent = \"\ud83d\udcd6 Show poem again\";\n      if(ta) ta.disabled = false;\n    };\n    // Same mandatory spelling warm-up as the other writing question types \u2014\n    // triggers right when he hides the poem and is about to start typing\n    // from memory. If it triggers, the textarea stays locked until the\n    // warm-up finishes; if not, it unlocks immediately as before.\n    if(!maybeShowSpellingGate(currentQType, getOriginalQIndex(currentQIndex), unlockForWriting)){\n      unlockForWriting();\n    }\n  }\n}\n\n// \u2500\u2500 SHUFFLE helper \u2500\u2500\nfunction shuffle(arr){\n  const a=[...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [a[i],a[j]]=[a[j],a[i]];\n  }\n  return a;\n}\n\n// \u2500\u2500 MCQ \u2500\u2500\nfunction renderMCQ(q, qnum, isLast){\n  mcqSelected=null;\n\n  // Shuffle options, track where the correct answer lands\n  const indexed = q.options.map((text,i)=>({text,orig:i}));\n  const shuffled = shuffle(indexed);\n  const newCorrect = shuffled.findIndex(o=>o.orig===q.correct);\n\n  const opts=shuffled.map((o,i)=>`\n    <div class=\"mcq-option\" id=\"mcqopt${i}\" onclick=\"selectMCQ(${i},${newCorrect},${isLast})\">\n      <span class=\"mcq-opt-letter\">${String.fromCharCode(65+i)}<\u002Fspan>\n      <span>${o.text}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\");\n\n  const actionBtn = currentMode===\"exam\"\n    ? `<button class=\"btn-next\" id=\"examNextBtn\" onclick=\"examNextMCQ(${newCorrect},${isLast})\" disabled style=\"margin-bottom:24px\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>`\n    : ``;\n\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">Choose the Correct Answer<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text\">${q.q}<\u002Fdiv>\n      <div class=\"mcq-options\">${opts}<\u002Fdiv>\n    <\u002Fdiv>\n    ${actionBtn}\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n}\nfunction selectMCQ(idx, correctIdx, isLast){\n  if(currentMode!==\"exam\" && document.getElementById(\"btnRow\")?.style.display===\"flex\") return;\n  mcqSelected=idx;\n  const opts = document.querySelectorAll(\".mcq-option\");\n  const selText = opts[idx]?.querySelector(\"span:last-child\")?.textContent || opts[idx]?.textContent || \"\";\n  const correctText = opts[correctIdx]?.querySelector(\"span:last-child\")?.textContent || opts[correctIdx]?.textContent || \"\";\n  fbLiveState({ currentAnswer: selText, correctAnswer: correctText, isCorrect: idx===correctIdx, typing:false });\n\n  if(currentMode===\"exam\"){\n    // Exam mode: just highlight selected, enable Next button\n    document.querySelectorAll(\".mcq-option\").forEach((el,i)=>el.classList.toggle(\"selected\",i===idx));\n    const eb=document.getElementById(\"examNextBtn\");\n    if(eb) eb.disabled=false;\n    return;\n  }\n\n  // Study mode: instant green/red\n  document.querySelectorAll(\".mcq-option\").forEach((el,i)=>{\n    el.onclick=null;\n    if(i===correctIdx) el.classList.add(\"correct\");\n    else if(i===idx)   el.classList.add(\"wrong\");\n  });\n  const pct = idx===correctIdx ? 100 : 0;\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  const elapsed=stampQuestion();\n  logQuestion(pct,elapsed);\n  showSimpleResult(pct,\n    (idx===correctIdx?\"Correct! Well done \ud83c\udf89\":\"Incorrect. The correct answer is highlighted in green.\")\n    +` ${timeChip(elapsed)}`);\n  const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n}\nfunction examNextMCQ(correctIdx, isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const pct=mcqSelected===correctIdx?100:0;\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  // Read displayed text from the DOM (shuffled order)\n  const selectedText = mcqSelected!==null\n    ? document.querySelector(`#mcqopt${mcqSelected} span:last-child`)?.textContent || \"(not answered)\"\n    : \"(not answered)\";\n  const correctText = document.querySelector(`#mcqopt${correctIdx} span:last-child`)?.textContent || \"\";\n  examAnswers.push({\n    q: q.q,\n    userText: selectedText,\n    modelText: correctText,\n    pct,\n    qtype: currentQType,\n    lessonTitle: currentLesson.title,\n    lessonId: currentLesson.id,\n    mockIdx: mockQIndex\n  });\n  if(isLast){ showMockResults(); return; }\n  mcqSelected=null; nextQuestion();\n}\n// checkMCQ is now handled directly inside selectMCQ for study mode\n\n// \u2500\u2500 FILL IN BLANKS \u2500\u2500\nfunction renderFill(q, qnum, isLast){\n  let idx=0;\n  const html=q.sentence.replace(/___/g,()=>\n    `<input class=\"blank-input\" id=\"blank${idx++}\" placeholder=\"type answer...\" autocomplete=\"off\" spellcheck=\"false\" onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\" oninput=\"fbLiveState({currentAnswer:[...document.querySelectorAll('.blank-input')].map(i=>i.value).join(' / '), typing:true})\">`\n  );\n\n  const peekBtn = currentMode!==\"exam\" ? `<button class=\"btn-peek\" onclick=\"toggleFillPeek()\">\ud83d\udc41 View Answer before filling<\u002Fbutton>\n       <div class=\"peek-panel\" id=\"peekPanel\">\n         <div class=\"peek-label\">Answer<\u002Fdiv>\n         <div class=\"peek-text\">${q.answers.map(a=>a.split(\"/\").map(s=>s.trim()).join(\" or \")).join(\"  |  \")}<\u002Fdiv>\n       <\u002Fdiv>` : \"\";\n\n  const actionBar = currentMode===\"exam\"\n    ? `<div class=\"answer-actions\">\n        <button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkFillFromDOM(${isLast})\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>\n       <\u002Fdiv>`\n    : `<div class=\"answer-actions\">\n        <button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkFillFromDOM(${isLast})\">Check Answer<\u002Fbutton>\n        <button class=\"btn-skip\" onclick=\"skipQuestion(${isLast})\">Skip<\u002Fbutton>\n       <\u002Fdiv>`;\n\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">Fill in the Blanks<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"fill-sentence\">${html}<\u002Fdiv>\n    <\u002Fdiv>\n    ${peekBtn}\n    ${actionBar}\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n}\n\nfunction toggleFillPeek(){\n  const p=document.getElementById(\"peekPanel\");\n  const b=document.querySelector(\".btn-peek\");\n  const opening=!p.classList.contains(\"visible\");\n  p.classList.toggle(\"visible\",opening);\n  // Disable all blank inputs while peeking, re-enable on hide \u2014 keep whatever was typed\n  document.querySelectorAll(\".blank-input\").forEach(inp=>{\n    inp.disabled = opening;\n  });\n  if(!opening) document.querySelector(\".blank-input\")?.focus();\n  if(b){\n    b.textContent = opening ? \"\ud83d\ude48 Close to start filling\" : \"\ud83d\udc41 View Answer before filling\";\n    b.classList.toggle(\"peeking\", opening);\n  }\n}\n\nfunction checkFillFromDOM(isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  // isLast is passed in from render time (correct for both study mode and practice test).\n  // Recalculating it here from qs.length is wrong in practice test, since the mock\n  // wrapper array always has length 1 regardless of position in the overall exam.\n  if(isLast===undefined) isLast = currentQIndex>=qs.length-1; // fallback for any old callers\n  if(currentMode===\"exam\") examNextFill(q.answers, isLast);\n  else checkFill(q.answers);\n}\n\nfunction checkFill(answers){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const isLast=currentQIndex>=qs.length-1;\n  let correct=0;\n  answers.forEach((ans,i)=>{\n    const inp=document.getElementById(\"blank\"+i);\n    if(!inp) return;\n    const userVal=inp.value.trim().toLowerCase();\n    // Accept any slash-separated alternative (e.g. \"forest / wood\" means forest OR wood)\n    const alternatives = ans.split(\"/\").map(a=>a.trim().toLowerCase()).filter(Boolean);\n    const ok = alternatives.some(alt => userVal===alt || levenshtein(userVal,alt)<=1);\n    inp.disabled=true;\n    if(ok){\n      inp.style.borderColor=\"var(--green)\";\n      inp.style.color=\"var(--green)\";\n      inp.style.background=\"var(--green-light)\";\n      correct++;\n    } else {\n      inp.style.borderColor=\"var(--red)\";\n      inp.style.color=\"var(--red)\";\n      inp.style.background=\"var(--red-light)\";\n      // Show accepted answers cleanly \u2014 \"forest or wood\" instead of \"forest / wood\"\n      const span=document.createElement(\"span\");\n      span.className=\"word-correction\";\n      span.textContent=\"\u2192 \"+alternatives.join(\" or \");\n      inp.insertAdjacentElement(\"afterend\",span);\n    }\n  });\n  const pct=Math.round(100*correct/answers.length);\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  document.getElementById(\"checkBtn\").disabled=true;\n  hidePeek();\n  const fillElapsed=stampQuestion();\n  logQuestion(pct,fillElapsed);\n  renderNavBar();\n  showSimpleResult(pct,`${correct} / ${answers.length} correct ${timeChip(fillElapsed)}`);\n  const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n}\n\nfunction examNextFill(answers, isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const userVals=answers.map((_,i)=>{ const el=document.getElementById(\"blank\"+i); return el?el.value.trim():\"\"; });\n  let correct=0;\n  answers.forEach((ans,i)=>{\n    const alts = ans.split(\"/\").map(a=>a.trim().toLowerCase()).filter(Boolean);\n    if(alts.some(alt=>levenshtein(userVals[i].toLowerCase(),alt)<=1)) correct++;\n  });\n  const pct=Math.round(100*correct/answers.length);\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  examAnswers.push({q:q.sentence,userText:userVals.join(\" / \"),modelText:answers.join(\" / \"),pct,qtype:currentQType,lessonTitle:currentLesson.title,lessonId:currentLesson.id,mockIdx:mockQIndex});\n  if(isLast){ showMockResults(); return; }\n  nextQuestion();\n}\n\n// \u2500\u2500 MATCH THE FOLLOWING \u2500\u2500\nfunction renderMatch(q, qnum, isLast){\n  matchAnswers={};\n  const rightOpts=q.right.map(r=>`<option value=\"${r}\">${r}<\u002Foption>`).join(\"\");\n  const leftRows=q.left.map((l,i)=>`\n    <div><div class=\"match-left-item\">${l}<\u002Fdiv><\u002Fdiv>\n    <div><select class=\"match-right-select\" id=\"match${i}\">\n      <option value=\"\">\u2014 Select \u2014<\u002Foption>${rightOpts}\n    <\u002Fselect><\u002Fdiv>`).join(\"\");\n  const actionBar = currentMode===\"exam\"\n    ? `<div class=\"answer-actions\" style=\"background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px\">\n        <button class=\"btn-check\" id=\"checkBtn\" onclick=\"examNextMatchFromDOM(${isLast})\" style=\"border-radius:0\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>\n       <\u002Fdiv>`\n    : `<div class=\"answer-actions\" style=\"background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px\">\n        <button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkMatchFromDOM()\" style=\"border-radius:0\">Check Answer<\u002Fbutton>\n        <button class=\"btn-skip\" onclick=\"skipQuestion(${isLast})\">Skip<\u002Fbutton>\n       <\u002Fdiv>`;\n  const peekBtn = currentMode!==\"exam\" ? `<button class=\"btn-peek\" id=\"matchPeekBtn\" onclick=\"toggleMatchPeek()\">\ud83d\udc41 View Answers before matching<\u002Fbutton>\n       <div class=\"peek-panel\" id=\"peekPanel\">\n         <div class=\"peek-label\">Correct Matches<\u002Fdiv>\n         ${q.left.map((l,i)=>`<div class=\"peek-text\" style=\"margin-bottom:4px\"><strong>${l}<\u002Fstrong> \u2192 ${q.right[q.correct[i]]}<\u002Fdiv>`).join(\"\")}\n       <\u002Fdiv>` : \"\";\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">Match the Following<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"match-grid\">${leftRows}<\u002Fdiv>\n    <\u002Fdiv>\n    ${peekBtn}\n    ${actionBar}\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n}\nfunction toggleMatchPeek(){\n  const p=document.getElementById(\"peekPanel\");\n  const b=document.getElementById(\"matchPeekBtn\");\n  if(!p) return;\n  const opening=!p.classList.contains(\"visible\");\n  p.classList.toggle(\"visible\",opening);\n  // Disable all selects while peeking, re-enable on hide \u2014 keep whatever was already chosen\n  document.querySelectorAll(\".match-right-select\").forEach(sel=>{\n    sel.disabled = opening;\n  });\n  if(b){\n    b.textContent = opening ? \"\ud83d\ude48 Close to start matching\" : \"\ud83d\udc41 View Answers before matching\";\n    b.classList.toggle(\"peeking\", opening);\n  }\n}\nfunction checkMatchFromDOM(){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const isLast=currentQIndex>=qs.length-1;\n  let correct=0;\n  q.left.forEach((_,i)=>{\n    const sel=document.getElementById(\"match\"+i);\n    const ok=sel.value===q.right[q.correct[i]];\n    sel.disabled=true;\n    sel.style.borderColor=ok?\"var(--green)\":\"var(--red)\";\n    sel.style.color=ok?\"var(--green)\":\"var(--red)\";\n    if(!ok){\n      // Show correct answer after select\n      const span=document.createElement(\"span\");\n      span.className=\"word-correction\";\n      span.textContent=\"\u2192 \"+q.right[q.correct[i]];\n      sel.insertAdjacentElement(\"afterend\",span);\n    }\n    if(ok) correct++;\n  });\n  const count=q.left.length;\n  const pct=Math.round(100*correct/count);\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  const matchElapsed=stampQuestion();\n  logQuestion(pct,matchElapsed);\n  maybeAwardNewTryBonus(currentQType, getOriginalQIndex(currentQIndex));\n  hidePeek();\n  document.getElementById(\"checkBtn\").disabled=true;\n  showSimpleResult(pct,`${correct} / ${count} matched correctly ${timeChip(matchElapsed)}`);\n  const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n}\nfunction examNextMatchFromDOM(isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const correctMap={};\n  q.left.forEach((_,i)=>{ correctMap[i]=q.right[q.correct[i]]; });\n  examNextMatch(correctMap, q.left, isLast);\n}\nfunction examNextMatch(correctMap, leftLabels, isLast){\n  const count=leftLabels.length;\n  let correct=0;\n  const pairs=leftLabels.map((l,i)=>{\n    const sel=document.getElementById(\"match\"+i);\n    const val=sel?sel.value:\"\";\n    if(val===correctMap[i]) correct++;\n    return `${l} \u2192 ${val||\"(blank)\"}`;\n  });\n  const modelPairs=leftLabels.map((l,i)=>`${l} \u2192 ${correctMap[i]}`);\n  const pct=Math.round(100*correct/count);\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  examAnswers.push({q:\"Match: \"+leftLabels.join(\", \"),userText:pairs.join(\"\\n\"),modelText:modelPairs.join(\"\\n\"),pct,qtype:currentQType,lessonTitle:currentLesson.title,lessonId:currentLesson.id,mockIdx:mockQIndex});\n  if(isLast){ showMockResults(); return; }\n  nextQuestion();\n}\n// \u2500\u2500 TEXT ANSWER (brief / reasons / paragraph / detail) \u2500\u2500\n// Detects whether a long answer (typically Paragraph type) has natural sub-points\n// separated by blank lines \u2014 most already do, e.g. \"(i) ... \\n\\n(ii) ... \\n\\n(iii) ...\".\n// Used to offer \"Write it in parts\" instead of one intimidating blank textarea,\n// since facing a big wall of empty space is what discourages a student from\n// even starting, or makes them give up partway through.\nfunction splitAnswerIntoParts(answerText){\n  if(!answerText) return null;\n  // Split into sentences. Keeps numbered list markers like \"(i)\" attached to the\n  // sentence that follows them, rather than splitting on every period (so \"e.g.\"\n  // and abbreviations don't create false sentence breaks).\n  const sentences = answerText\n    .replace(/\\n+/g, \" \")\n    .split(/(?<=[.!?])\\s+(?=[A-Z(])/)\n    .map(s=>s.trim())\n    .filter(Boolean);\n  // Only worth offering \"in parts\" mode if there are at least 2 real sentences\n  // and the whole answer is long enough that writing it in one go is daunting.\n  if(sentences.length < 2 || answerText.length < 220) return null;\n  return sentences;\n}\n\nfunction renderTextAnswer(q, qnum, isLast, isParagraph){\n  const labelMap = { brief:\"Answer in Brief\", reasons:\"Give Reasons\", paragraph:\"Answer in Paragraph / Detail\" };\n  const label = labelMap[currentQType] || (isParagraph?\"Answer in Paragraph / Detail\":\"Answer in Brief\");\n  const placeholder = currentMode===\"exam\" ? (isParagraph ? \"Write a detailed answer\u2026\" : \"Write your answer\u2026\") : \"Tap \ud83d\udc41 above, then close it to start writing\u2026\";\n  const minH = isParagraph ? 180 : 120;\n  const prevAttempt = previousAttempts[getPrevAttemptKey(currentQIndex)];\n  const peekState = peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0);\n  const peekBtn = currentMode!==\"exam\" ? `<button class=\"btn-peek\" id=\"mainPeekBtn\" onclick=\"togglePeek()\" ${peekState.disabled&&!prevAttempt?\"disabled\":\"\"}>${peekState.label}<\u002Fbutton>\n       <div class=\"peek-panel\" id=\"peekPanel\">\n         ${prevAttempt && prevAttempt.type===\"text\" ? `\n           <div class=\"peek-label\" style=\"color:var(--red)\">Your Previous Attempt<\u002Fdiv>\n           ${buildAnnotatedDiff(prevAttempt.userText, q.answer)}\n         ` : `\n           <div class=\"peek-label\">Model Answer<\u002Fdiv>\n           <div class=\"peek-text\">${q.answer.replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n         `}\n       <\u002Fdiv>` : \"\";\n  const actionBtns = currentMode===\"exam\"\n    ? `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"examNextText(${isLast})\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>`\n    : `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkTextAnswer()\">Check Answer<\u002Fbutton>\n       <button class=\"btn-skip\" onclick=\"skipQuestion(${isLast})\">Skip<\u002Fbutton>`;\n\n  // Offer to write a long answer in smaller guided parts instead of one big\n  // blank textarea \u2014 only when the answer is genuinely long and has natural\n  // sub-points to split on, and only in study mode (not during a timed exam).\n  const parts = currentMode!==\"exam\" ? splitAnswerIntoParts(q.answer) : null;\n  const partsOfferHTML = parts ? `\n    <div class=\"parts-offer\" id=\"partsOffer\" style=\"margin-bottom:10px;padding:10px 12px;background:var(--parchment);border:1.5px dashed var(--border);border-radius:10px;font-size:12.5px;color:var(--muted)\">\n      \ud83d\udcc4 This is a long answer with ${parts.length} parts. Feeling overwhelmed?\n      <button onclick=\"startPartsMode()\" style=\"margin-left:6px;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer\">Write it in parts<\u002Fbutton>\n    <\u002Fdiv>` : \"\";\n\n  const speedTimerHTML = SPEED_BONUS[currentQType] ? `\n    <div id=\"speedTimerWrap\" style=\"margin:0 0 10px;padding:8px 10px;background:var(--parchment);border-radius:8px\">\n      <div style=\"font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center\" id=\"speedChallenge\">\u26a1 Challenge: Can you finish this one fast?<\u002Fdiv>\n      <div style=\"background:#e0e0e0;border-radius:3px;overflow:hidden;height:5px;margin-bottom:5px\">\n        <div id=\"speedTimerBar\" style=\"height:100%;width:100%;background:#4a9873;border-radius:3px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:10px;color:var(--muted)\">Speed Bonus<\u002Fspan>\n        <span id=\"speedTimerPts\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#4a9873;color:#fff;transition:background .5s\">\u26a1 calculating\u2026<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"speedNudge\" style=\"font-size:11px;font-weight:600;margin-top:6px;text-align:center;min-height:16px\"><\u002Fdiv>\n    <\u002Fdiv>` : \"\";\n\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">${label}<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text\">${q.q}<\u002Fdiv>\n    <\u002Fdiv>\n    ${peekBtn}\n    ${partsOfferHTML}\n    ${speedTimerHTML}\n    <div class=\"answer-area\" id=\"answerArea\">\n      <textarea class=\"answer-textarea\" id=\"answerInput\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"${placeholder}\" style=\"min-height:${minH}px\" disabled onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\" oninput=\"fbLiveState({currentAnswer:this.value, typing:true})\"><\u002Ftextarea>\n      <div class=\"answer-actions\">${actionBtns}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"
