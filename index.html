<div style=\"display:flex;gap:8px;margin-bottom:12px\">\n    <div style=\"flex:1;background:${c.boxBg};border-radius:10px;padding:10px 6px;text-align:center\">\n      <div style=\"font-size:20px;font-weight:900;color:${c.text}\">${ins.streak}<\u002Fdiv>\n      <div style=\"font-size:9.5px;color:${c.dim}\">day streak<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:${c.boxBg};border-radius:10px;padding:10px 6px;text-align:center\">\n      <div style=\"font-size:20px;font-weight:900;color:${c.text}\">${ins.last7}/7<\u002Fdiv>\n      <div style=\"font-size:9.5px;color:${c.dim}\">days this week<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:${c.boxBg};border-radius:10px;padding:10px 6px;text-align:center\">\n      <div style=\"font-size:20px;font-weight:900;color:${c.text}\">${ins.last30}/30<\u002Fdiv>\n      <div style=\"font-size:9.5px;color:${c.dim}\">days this month<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n\n  if(ins.trend){\n    const arrow = ins.trend.delta>2 ? \"\ud83d\udcc8\" : ins.trend.delta<-2 ? \"\ud83d\udcc9\" : \"\u27a1\ufe0f\";\n    const dColor = ins.trend.delta>2 ? c.up : ins.trend.delta<-2 ? c.down : c.flat;\n    html += `<div style=\"background:${c.boxBg};border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:${c.text}\">\n      ${arrow} This week's avg: <strong>${ins.trend.last7Avg}%<\u002Fstrong> vs ${ins.trend.prior7Avg}% last week\n      <span style=\"color:${dColor};font-weight:700\"> (${ins.trend.delta>=0?\"+\":\"\"}${ins.trend.delta}%)<\u002Fspan>\n    <\u002Fdiv>`;\n  }\n\n  html += `<div style=\"font-size:10.5px;font-weight:700;color:${c.dim};text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px\">Could use more practice<\u002Fdiv>`;\n  if(ins.weakSubjects.length || ins.weakQtypes.length){\n    ins.weakSubjects.forEach(s=>{\n      html += `<div style=\"font-size:12.5px;padding:5px 0;border-bottom:1px solid ${c.divider};color:${c.text}\">${s.subject}: <strong>${s.avg}%<\u002Fstrong> avg <span style=\"color:${c.faint}\">(${s.count} questions)<\u002Fspan><\u002Fdiv>`;\n    });\n    ins.weakQtypes.forEach(s=>{\n      html += `<div style=\"font-size:12.5px;padding:5px 0;border-bottom:1px solid ${c.divider};color:${c.text}\">${s.icon} ${s.label}: <strong>${s.avg}%<\u002Fstrong> avg <span style=\"color:${c.faint}\">(${s.count} questions)<\u002Fspan><\u002Fdiv>`;\n    });\n  } else {\n    html += `<div style=\"font-size:12.5px;padding:5px 0;color:${c.dim}\">\u2705 No clear weak spots right now \u2014 solid across the board.<\u002Fdiv>`;\n  }\n\n  if(ins.qtypeCoverage && ins.qtypeCoverage.length){\n    html += `<div style=\"font-size:10.5px;font-weight:700;color:${c.dim};text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px\">Unique questions studied \u2014 by heading<\u002Fdiv>`;\n    ins.qtypeCoverage.forEach(s=>{\n      const barColor = s.coverage>=80 ? c.up : s.coverage>=40 ? (isDark?\"#ffd76e\":\"var(--gold,#9c7519)\") : c.down;\n      html += `<div style=\"margin-bottom:10px\">\n        <div style=\"display:flex;justify-content:space-between;font-size:12px;color:${c.text};margin-bottom:3px\">\n          <span>${s.icon} ${s.label}<\u002Fspan>\n          <span style=\"color:${c.faint}\">${s.uniqueCount}/${s.totalAvailable} all-time<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:6px;border-radius:3px;background:${c.divider};overflow:hidden;margin-bottom:4px\">\n          <div style=\"height:100%;width:${s.coverage}%;background:${barColor}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:${c.faint}\">${s.todayCount} today \u00b7 ${s.weekCount} this week<\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n  }\n\n  html += `<div style=\"font-size:10.5px;font-weight:700;color:${c.dim};text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px\">\ud83d\udc41 Peeked before answering<\u002Fdiv>`;\n  html += `<div style=\"font-size:12.5px;padding:5px 0;color:${c.text}\">${ins.peekRate}% of all answered questions<\u002Fdiv>`;\n  ins.peekBySubject.forEach(s=>{\n    html += `<div style=\"font-size:12px;padding:3px 0;color:${c.dim}\">${s.subject}: ${s.peekRate}% peeked <span style=\"color:${c.faint}\">(${s.count} questions)<\u002Fspan><\u002Fdiv>`;\n  });\n\n  if(ins.spellStats && ins.spellStats.total>0){\n    html += `<div style=\"font-size:10.5px;font-weight:700;color:${c.dim};text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px\">\u270f\ufe0f Spelling mistakes<\u002Fdiv>`;\n    html += `<div style=\"display:flex;gap:8px;margin-bottom:8px\">\n      <div style=\"flex:1;background:${c.boxBg};border-radius:10px;padding:8px 6px;text-align:center\">\n        <div style=\"font-size:17px;font-weight:900;color:${c.text}\">${ins.spellStats.today}<\u002Fdiv>\n        <div style=\"font-size:9px;color:${c.dim}\">today<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:${c.boxBg};border-radius:10px;padding:8px 6px;text-align:center\">\n        <div style=\"font-size:17px;font-weight:900;color:${c.text}\">${ins.spellStats.last7}<\u002Fdiv>\n        <div style=\"font-size:9px;color:${c.dim}\">this week<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:${c.boxBg};border-radius:10px;padding:8px 6px;text-align:center\">\n        <div style=\"font-size:17px;font-weight:900;color:${c.text}\">${ins.spellStats.total}<\u002Fdiv>\n        <div style=\"font-size:9px;color:${c.dim}\">all-time<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n    if(ins.spellStats.topWords.length){\n      html += `<div style=\"font-size:11px;color:${c.faint};margin-bottom:2px\">Repeated misses:<\u002Fdiv>`;\n      html += `<div style=\"font-size:12px;color:${c.text};margin-bottom:8px\">` +\n        ins.spellStats.topWords.map(w=>`${w.word} <span style=\"color:${c.faint}\">(${w.count}\u00d7)<\u002Fspan>`).join(\", \") +\n        `<\u002Fdiv>`;\n    }\n    html += `<button onclick=\"openSpellingReportModal()\" style=\"width:100%;padding:8px;background:transparent;border:1.5px dashed ${c.divider};border-radius:8px;color:${c.text};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit\">\ud83d\udccb View full spelling report \u2192<\u002Fbutton>`;\n  }\n\n  html += `<\u002Fdiv>`;\n  return html;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  DETAILED SPELLING REPORT \u2014 every word ever missed, how many times,\n//  and when it was last missed. The Study Insights summary above only\n//  surfaces the top handful of repeat offenders; this is the full list,\n//  for whenever the student or parent wants to see everything at once.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction buildSpellingReportRows(spellEntries){\n  const byWord = {};\n  (spellEntries||[]).forEach(e=>{\n    const key = (e.correct||e.wrong||\"\").toLowerCase().trim();\n    if(!key) return;\n    if(!byWord[key]){\n      byWord[key] = { word: e.correct||e.wrong, count: 0, lastTs: 0, wrongTries: new Set(), subjects: new Set() };\n    }\n    const w = byWord[key];\n    w.count++;\n    if(e.ts > w.lastTs) w.lastTs = e.ts;\n    if(e.wrong && e.wrong.toLowerCase() !== key) w.wrongTries.add(e.wrong);\n    if(e.subject) w.subjects.add(e.subject);\n  });\n  return Object.values(byWord)\n    .map(w=>({ word:w.word, count:w.count, lastTs:w.lastTs, wrongTries:[...w.wrongTries], subjects:[...w.subjects] }))\n    .sort((a,b)=> b.count - a.count || b.lastTs - a.lastTs);\n}\n\nfunction renderSpellingReportHTML(spellEntries){\n  const rows = buildSpellingReportRows(spellEntries);\n  if(!rows.length){\n    return `<div style=\"text-align:center;color:var(--muted);font-size:13px;padding:20px 0\">No spelling mistakes logged yet.<\u002Fdiv>`;\n  }\n  const totalMistakes = (spellEntries||[]).length;\n  let html = `<div style=\"font-size:12px;color:var(--muted);margin-bottom:12px\">${rows.length} distinct word${rows.length!==1?\"s\":\"\"} \u00b7 ${totalMistakes} mistake${totalMistakes!==1?\"s\":\"\"} total<\u002Fdiv>`;\n  html += rows.map(r=>{\n    const dateLabel = r.lastTs ? new Date(r.lastTs).toLocaleDateString(\"en-IN\",{day:\"2-digit\",month:\"short\"}) : \"\u2014\";\n    const triedLabel = r.wrongTries.length ? `tried: ${r.wrongTries.slice(0,3).join(\", \")}` : \"\";\n    return `<div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-weight:700;color:var(--navy);font-size:14px\">${r.word}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted)\">${triedLabel}${triedLabel&&r.subjects.length?\" \u00b7 \":\"\"}${r.subjects.slice(0,2).join(\", \")}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;flex-shrink:0\">\n        <div style=\"font-weight:800;color:${r.count>=3?'var(--red,#c0392b)':'var(--navy)'};font-size:14px\">${r.count}\u00d7<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--muted)\">last ${dateLabel}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join(\"\");\n  return html;\n}\n\nasync function openSpellingReportModal(){\n  const panel = document.getElementById(\"spellingReportPanel\");\n  const list = document.getElementById(\"spellingReportList\");\n  if(!panel || !list) return;\n  panel.classList.add(\"visible\");\n  list.innerHTML = \"Loading\u2026\";\n  if(!window._fb || !currentUserPhone){ list.innerHTML = \"\"; return; }\n  try{\n    const { spellSnap } = await getLogsBundle();\n    list.innerHTML = renderSpellingReportHTML(snapToArray(spellSnap));\n  }catch(e){ list.innerHTML = \"<div style='color:var(--muted);text-align:center'>Couldn't load right now.<\u002Fdiv>\"; }\n}\n\nfunction closeSpellingReportPanel(){\n  document.getElementById(\"spellingReportPanel\").classList.remove(\"visible\");\n}\n\nasync function renderScoreboardTotalHTML(bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries, totalTestPoints){\n  const sessionCount = Object.keys(bySession).length;\n  const raw = calcGrowthScore(allUnique, allScoredEntries||[], totalTestPoints||0);\n  const { masteryScore, coverage, mastery, trend, totalAvailable, dailyGoal, sessionGoals, practiceGoal, cumulative, dailyTimeBonus, breakdown } = raw;\n  const growthPoints = await applyGrowthPointsFloor(raw.growthPoints);\n\n  const trendArrow = trend>60?\"\u2197\":trend<40?\"\u2198\":\"\u2192\";\n  const trendColor = trend>60?\"#7ee787\":trend<40?\"#ffa07a\":\"rgba(255,255,255,.5)\";\n  const W = \"rgba(255,255,255,\";\n\n  // \u2500\u2500 HERO \u2500\u2500\n  var hero = '<div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px\">'\n    +'<div>'\n      +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:'+W+'.5);margin-bottom:3px\">Growth Points<\u002Fdiv>'\n      +'<div style=\"font-size:44px;font-weight:900;color:var(--gold,#d1983f);letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums\">'+growthPoints.toLocaleString()+'<\u002Fdiv>'\n      +'<div style=\"font-size:10px;color:'+W+'.35);margin-top:4px\">never resets \u00b7 keeps climbing<\u002Fdiv>'\n    +'<\u002Fdiv>'\n    +'<div style=\"text-align:right;padding-bottom:4px\">'\n      +'<div style=\"font-size:11px;color:'+trendColor+';font-weight:700\">'+trendArrow+' '+coverage+'% covered<\u002Fdiv>'\n      +'<div style=\"font-size:10px;color:'+W+'.4);margin-top:3px\">'+allUnique.size+'/'+totalAvailable+' questions tried<\u002Fdiv>'\n    +'<\u002Fdiv>'\n  +'<\u002Fdiv>'\n  // Stats pill row\n  +'<div style=\"display:flex;justify-content:space-between;background:'+W+'.07);border-radius:10px;padding:9px 12px;margin-bottom:16px\">'\n    +[\n      [allUnique.size, 'unique Qs'],\n      [grandAttempts, 'attempts'],\n      [fmtMs(grandTimeMs), 'time'],\n      [sessionCount, 'sessions'],\n    ].map(function(p){ return '<div style=\"text-align:center\"><div style=\"font-size:13px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums\">'+p[0]+'<\u002Fdiv><div style=\"font-size:9px;color:'+W+'.4);margin-top:1px\">'+p[1]+'<\u002Fdiv><\u002Fdiv>'; }).join('')\n  +'<\u002Fdiv>'\n  +'<div style=\"height:1px;background:'+W+'.1);margin:14px 0\"><\u002Fdiv>';\n\n  // \u2500\u2500 SESSION TILES + TIME BONUS (merged per subject) \u2500\u2500\n  var sLabel = '<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">\u23f0 Today\\'s Sessions<\u002Fdiv>';\n  var sRows = Object.entries(sessionGoals.bySubject||{}).map(function(e){\n    var subj=e[0], sg=e[1];\n    var icon=(DATA[subj]&&DATA[subj].icon)||'\ud83d\udcda';\n    function dot(done, started, emoji, pts){\n      var bg  = done?W+'.25)':started?'rgba(255,140,0,.2)':W+'.06)';\n      var brd = done?W+'.55)':started?'rgba(255,140,0,.45)':W+'.12)';\n      var ptsDiv = (done||started)?('<div style=\"font-size:8px;font-weight:800;color:'+(done?'#7ee787':'#cf8f2e')+';margin-top:2px\">'+pts+'<\u002Fdiv>'):'';\n      return '<div style=\"width:44px;text-align:center;background:'+bg+';border:1px solid '+brd+';border-radius:9px;padding:6px 4px\">'\n        +'<div style=\"font-size:17px\">'+emoji+'<\u002Fdiv>'+ptsDiv+'<\u002Fdiv>';\n    }\n    var mPts=sg.morningDone?(sg.earlyDone?'+70':'+50'):'+10';\n    var ePts=sg.eveningDone?'+50':'+10';\n    // 30-min time bonus for this subject\n    var tb = (dailyTimeBonus.bySubject||{})[subj] || {ms:0, done:false, pct:0};\n    var mins = Math.floor(tb.ms/60000);\n    var timeBarCol = tb.done?'#7ee787':tb.pct>0?'#cf8f2e':W+'.15)';\n    var timeLabel = tb.done?'\u2705 +100':mins+'/30m';\n    var timeLabelCol = tb.done?'#7ee787':W+'.45)';\n    return '<div style=\"margin-bottom:10px\">'\n      +'<div style=\"display:flex;align-items:center;gap:10px\">'\n        +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n        +'<div style=\"display:flex;gap:6px\">'+dot(sg.morningDone,sg.mornStarted,'\ud83c\udf05',mPts)+dot(sg.eveningDone,sg.eveStarted,'\ud83c\udf19',ePts)+'<\u002Fdiv>'\n        +(sg.bothDone?'<div style=\"font-size:10px;color:#7ee787;font-weight:700\">+50 \ud83c\udf89<\u002Fdiv>':'')\n      +'<\u002Fdiv>'\n      // Time bar below the dots\n      +'<div style=\"display:flex;align-items:center;gap:6px;margin:4px 0 0 86px\">'\n        +'<div style=\"flex:1;height:4px;background:'+W+'.1);border-radius:2px;overflow:hidden\">'\n          +'<div style=\"height:100%;width:'+tb.pct+'%;background:'+timeBarCol+';border-radius:2px\"><\u002Fdiv>'\n        +'<\u002Fdiv>'\n        +'<div style=\"font-size:9px;font-weight:700;color:'+timeLabelCol+';min-width:42px;text-align:right\">'+timeLabel+'<\u002Fdiv>'\n      +'<\u002Fdiv>'\n    +'<\u002Fdiv>';\n  }).join('');\n  var streakLine = sessionGoals.morningStreak>0?'<div style=\"font-size:11px;color:var(--gold);font-weight:700;margin-top:2px;margin-bottom:4px\">\ud83d\udd25 '+sessionGoals.morningStreak+' day morning streak<\u002Fdiv>':'';\n  var tLabel = '', tBars = '', tFooter = '';\n\n  // \u2500\u2500 DAILY GOAL bars (tap to expand types) \u2500\u2500\n  var gLabel = '<div style=\"height:1px;background:'+W+'.1);margin:14px 0\"><\u002Fdiv>'\n    +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">\ud83d\udccb Daily Goal \u2014 tap to see types<\u002Fdiv>';\n  var gBars = Object.entries(dailyGoal.subjectChecklists||{}).map(function(e){\n    var subj=e[0], list=e[1];\n    if(!list.length) return '';\n    var icon=(DATA[subj]&&DATA[subj].icon)||'\ud83d\udcda';\n    var done=list.filter(function(c){return c.done;}).length;\n    var total=list.length;\n    var pct=Math.round(done/total*100);\n    var allDone=done===total;\n    var barCol=allDone?'#7ee787':done>0?'#cf8f2e':W+'.15)';\n    var chips=list.map(function(c){\n      var bg=c.done?W+'.18)':W+'.06)';\n      var brd=c.done?'rgba(126,231,135,.4)':W+'.1)';\n      var txt=c.done?'text-decoration:line-through;opacity:.5':'color:'+W+'.85)';\n      return '<div style=\"display:inline-flex;align-items:center;gap:3px;background:'+bg+';border:1px solid '+brd+';border-radius:5px;padding:3px 7px;margin:2px\">'\n        +'<span style=\"font-size:10px\">'+(c.done?'\u2705':c.icon)+'<\u002Fspan>'\n        +'<span style=\"font-size:9px;'+txt+'\">'+c.label+'<\u002Fspan>'\n        +'<\u002Fdiv>';\n    }).join('');\n    return '<details style=\"margin-bottom:8px\">'\n      +'<summary style=\"list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none\">'\n        +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n        +'<div style=\"flex:1;height:7px;background:'+W+'.1);border-radius:4px;overflow:hidden\">'\n          +'<div style=\"height:100%;width:'+pct+'%;background:'+barCol+';border-radius:4px\"><\u002Fdiv>'\n        +'<\u002Fdiv>'\n        +'<div style=\"font-size:10px;font-weight:700;min-width:30px;text-align:right;color:'+(allDone?'#7ee787':W+'.45)')+'\">'+done+'/'+total+'<\u002Fdiv>'\n      +'<\u002Fsummary>'\n      +'<div style=\"padding:8px 0 2px;display:flex;flex-wrap:wrap;gap:2px\">'+chips+'<\u002Fdiv>'\n      +'<\u002Fdetails>';\n  }).join('');\n  var gFooter=dailyGoal.completedToday?'<div style=\"font-size:11px;color:#7ee787;font-weight:700;margin-top:4px\">\ud83c\udf89 Goal complete!'+(dailyGoal.streak>1?' \u00b7 \ud83d\udd25 '+dailyGoal.streak+' day streak':'')+'<\u002Fdiv>':dailyGoal.streak>0?'<div style=\"font-size:11px;color:var(--gold);font-weight:700;margin-top:4px\">\ud83d\udd25 '+dailyGoal.streak+' day streak<\u002Fdiv>':'';\n\n  \n\n  var pTopTier=DAILY_PRACTICE_TIERS[DAILY_PRACTICE_TIERS.length-1].count;\n  var pGoalPct=Math.min(100, Math.round((practiceGoal.count/pTopTier)*100));\n  var pGoalBarCol=practiceGoal.completedToday?'#7ee787':practiceGoal.count>0?'#cf8f2e':W+'.15)';\n  var pTierChips=practiceGoal.tiers.map(function(t){\n    var reached=practiceGoal.count>=t.count;\n    var bg=reached?'rgba(126,231,135,.18)':W+'.06)';\n    var brd=reached?'rgba(126,231,135,.4)':W+'.12)';\n    var txt=reached?'color:#7ee787':'color:'+W+'.5)';\n    return '<div style=\"display:inline-flex;align-items:center;gap:3px;background:'+bg+';border:1px solid '+brd+';border-radius:5px;padding:3px 7px;margin:2px 4px 2px 0\">'\n      +'<span style=\"font-size:9px;font-weight:800;'+txt+'\">'+(reached?'\u2705':'\u2b1c')+' '+t.count+'<\u002Fspan>'\n      +'<span style=\"font-size:8px;'+txt+'\">+'+t.points+'<\u002Fspan>'\n      +'<\u002Fdiv>';\n  }).join('');\n  var pGoalNextLine=practiceGoal.nextTier\n    ? '<div style=\"font-size:10px;color:'+W+'.4);margin-top:6px\">Practice '+(practiceGoal.nextTier.count-practiceGoal.count)+' more unique question'+((practiceGoal.nextTier.count-practiceGoal.count)!==1?'s':'')+' today to earn +'+practiceGoal.nextTier.points+' pts<\u002Fdiv>'\n    : '<div style=\"font-size:11px;color:#7ee787;font-weight:700;margin-top:6px\">\ud83c\udf89 All practice tiers complete today!'+(practiceGoal.streak>1?' \u00b7 \ud83d\udd25 '+practiceGoal.streak+' day streak':'')+'<\u002Fdiv>';\n  var pGoalHTML='<div style=\"height:1px;background:'+W+'.1);margin:14px 0\"><\u002Fdiv>'\n    +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">\ud83c\udfaf Daily Practice Goal<\u002Fdiv>'\n t(()=>inp.classList.remove(\"error\"), 400);\n    inp.focus();\n  }\n}\n\n// Shown once right after the student logs in \u2014 a quick, motivating snapshot of\n// their Growth Score and today's goal, so progress is the first thing they see\n// rather than something they have to go dig for.\nasync function showWelcomeBackPopup(){\n  if(!window._fb || !currentUserPhone) return;\n\n  let overlay = document.getElementById(\"welcomeBackPopup\");\n  if(!overlay){\n    overlay = document.createElement(\"div\");\n    overlay.id = \"welcomeBackPopup\";\n    overlay.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px\";\n    document.body.appendChild(overlay);\n  }\n  overlay.innerHTML = `<div style=\"background:#fff;border-radius:18px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25)\">\n    <div style=\"font-size:32px;margin-bottom:8px\">\ud83d\udc4b<\u002Fdiv>\n    <div style=\"font-size:13px;color:var(--muted)\">Loading your progress\u2026<\u002Fdiv>\n  <\u002Fdiv>`;\n\n  let logsSnap, examSnap, totalTestPoints;\n  try{\n    ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  } catch(err){\n    overlay.remove();\n    return;\n  }\n\n  if(logsSnap.empty && examSnap.empty){\n    // First-ever session \u2014 a simple welcome instead of stats that don't exist yet.\n    overlay.innerHTML = `<div style=\"background:#fff;border-radius:18px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25)\">\n      <div style=\"font-size:40px;margin-bottom:10px\">\ud83d\ude80<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px\">Welcome, ${STUDENT_NAME}!<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--muted);margin-bottom:18px\">Let's get started \u2014 try one question from each topic type today to hit your first daily goal.<\u002 Started,'\ud83c\udf05',mPts)+pDot(sg.eveningDone,sg.eveStarted,'\ud83c\udf19',ePts)+'<\u002Fdiv>'\n      +(sg.bothDone?'<div style=\"font-size:10px;color:#7ee787;font-weight:700\">+50 \ud83c\udf89<\u002Fdiv>':'')\n    +'<\u002Fdiv>';\n  }).join('');\n\n  // Goal bars \u2014 same as scoreboard\n  var goalBars = Object.entries(dailyGoal.subjectChecklists||{}).map(function(e){\n    var subj=e[0], list=e[1];\n    if(!list.length) return '';\n    var icon=(DATA[subj]&&DATA[subj].icon)||\"\ud83d\udcda\";\n    var done=list.filter(function(c){return c.done;}).length;\n    var total=list.length;\n    var pct=Math.round(done/total*100);\n    var allDone=done===total;\n    var barCol=allDone?\"#7ee787\":done>0?\"#cf8f2e\":W+\".15)\";\n    return '<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:7px\">'\n      +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n      +'<div style=\"flex:1;height:7px;background:'+W+'.1);border-radius:4px;overflow:hidden\">'\n        +'<div style=\"height:100%;width:'+pct+'%;background:'+barCol+';border-radius:4px\"><\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<div style=\"font-size:10px;font-weight:700;min-width:28px;text-align:right;color:'+(allDone?'#7ee787':W+'.45)')+'\">'+done+'/'+total+'<\u002Fdiv>'\n    +'<\u002Fdiv>';\n  }).join('');\n\n  // Morning nudge (6\u20138am only)\n  var currentHour = new Date().getHours();\n  var nudge = (currentHour===6||currentHour===7)&&!sessionGoals.morningDone\n    ? '<div style=\"background:rgba(209,152,63,.18);border:1px solid rgba(209,152,63,.4);border-radius:10px;padding:10px;margin-bottom:14px\">'\n        +'<div style=\"font-size:12px;font-weight:700;color:'+gold+'\">'+(currentHour===6?\"\ud83c\udf05 You're up early \u2014 nice!\":\"\ud83c\udf24\ufe0f Still counts as morning!\")+'<\u002Fdiv>'\n        +'<div style=\"font-size:11px;color:rgba(209,152,63,.9);margin-top:3px\">Cover all types in any subject before 8am to earn the morning bonus.<\u002Fdiv>'\n      +'<\u002Fdiv>' : '';\n\n  var streakLine = sessionGoals.morningStreak>0\n    ?'<div style=\"font-size:11px;color:'+gold+';font-weight:700;margin-top:2px;margin-bottom:8px\">\ud83d\udd25 '+sessionGoals.morningStreak+' day morning streak<\u002Fdiv>':'' ;\n\n  var goalFooter = dailyGoal.completedToday\n    ?'<div style=\"font-size:11px;color:#7ee787;font-weight:700;margin-top:6px\">\ud83c\udf89 Goal complete!'+(dailyGoal.streak>1?' \u00b7 \ud83d\udd25 '+dailyGoal.streak+' day streak':'')+'<\u002Fdiv>'\n    :dailyGoal.streak>0?'<div style=\"font-size:11px;color:'+gold+';font-weight:700;margin-top:4px\">\ud83d\udd25 '+dailyGoal.streak+' day streak<\u002Fdiv>':'';\n\n  var divider = '<div style=\"height:1px;background:'+W+'.12);margin:12px 0\"><\u002Fdiv>';\n  var lbl = function(t){ return '<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">'+t+'<\u002Fdiv>'; };\n\n  overlay.innerHTML = '<div style=\"background:var(--navy,#202a3d);border-radius:20px;padding:22px 20px 20px;max-width:340px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.4);color:#fff\">'\n    // Hero\n    +'<div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px\">'\n      +'<div>'\n        +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:'+W+'.5);margin-bottom:3px\">Growth Points<\u002Fdiv>'\n        +'<div style=\"font-size:42px;font-weight:900;color:'+gold+';letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums\">'+growthPoints.toLocaleString()+'<\u002Fdiv>'\n      +'<\u002Fdiv>'\n    +'<\u002Fdiv>'\n    +divider\n    +nudge\n    +lbl(\"\u23f0 Today's Sessions\")\n    +sessionRows\n    +streakLine\n    +divider\n    +lbl('\ud83d\udccb Daily Goal')\n    +goalBars\n    +goalFooter\n    +'<button onclick=\"document.getElementById(\\'welcomeBackPopup\\').remove()\" style=\"width:100%;margin-top:18px;padding:12px;background:'+W+'.12);color:#fff;border:1px solid '+W+'.25);border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Start studying \u2192<\u002Fbutton>'\n  +'<\u002Fdiv>';\n}\n\n// Write one log entry to Firestore under the student's phone number,\n// regardless of whether the student or admin is the one currently driving the session.\nfunction fbLogEntry(kind, data){\n  if(!window._fb || !currentUserPhone) return Promise.resolve();\n  const { db, addDoc, collection, serverTimestamp } = window._fb;\n  if(kind===\"logs\" || kind===\"testPoints\" || kind===\"spellErrors\") invalidateLogsBundleCache();\n  // Returns the write promise now (previously fire-and-forget) \u2014 most call\n  // sites still don't await it, which is fine, but anything that logs and\n  // then immediately re-reads (like the retroactive sweeps) NEEDS to be\n  // able to wait for the write to actually land first, or it can re-fetch\n  // before Firestore has committed the new entry \u2014 showing up later in\n  // Points History but not in the Growth Points total computed right then.\n  return addDoc(collection(db, \"sessions\", currentUserPhone, kind), {\n    ...data,\n    sessionId: currentSessionId,\n    ts: serverTimestamp(),\n    loggedBy: isAdminUser ? \"admin\" : \"student\"\n  }).catch(err => console.warn(\"Firestore write failed:\", err));\n}\n\n// Same as fbLogEntry, but with an explicit historical timestamp instead of\n// \"now\" \u2014 used only for backfilling achievement records (Daily Goal,\n// session bonuses, daily time bonus) under the date they were ACTUALLY\n// earned, so Points History shows them on the right day rather than all\n// bunched up as if freshly earned the moment this feature was deployed.\nasync function fbLogEntryWithTs(kind, data, tsMillis){\n  if(!window._fb || !currentUserPhone) return;\n  const { db, addDoc, collection } = window._fb;\n  if(kind===\"logs\" || kind===\"testPoints\") forceFullLogsResync();\n  try{\n    await addDoc(collection(db, \"sessions\", currentUserPhone, kind), {\n      ...data,\n      sessionId: currentSessionId,\n      ts: new Date(tsMillis),\n      loggedBy: isAdminUser ? \"admin\" : \"student\"\n    });\n  }catch(err){ console.warn(\"Firestore write failed:\", err); }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  POINT ACHIEVEMENT SYNC \u2014 Daily Goal / Session Bonuses / Daily Time\n//  Bonus were always correctly counted in the Growth Points total, but\n//  ONLY as recalculated aggregates \u2014 never as discrete logged events. That\n//  meant Points History had nothing to show for them, the exact same gap\n//  Lesson Mastery had. This logs each one exactly once, under the actual\n//  date it was earned (not \"now\"), so the full picture finally shows up.\nlet _pointAchievementsLoggedCache = null;\n\nasync function loadPointAchievementsLogged(){\n  if(_pointAchievementsLoggedCache) return _pointAchievementsLoggedCache;\n  if(!window._fb || !currentUserPhone){ _pointAchievementsLoggedCache = {}; return _pointAchievementsLoggedCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"pointAchievementsLogged\"));\n    _pointAchievementsLoggedCache = snap.exists() ? snap.data() : {};\n  }catch(e){ _pointAchievementsLoggedCache = {}; }\n  return _pointAchievementsLoggedCache;\n}\n\nasync function syncPointAchievementsToHistory(allScoredEntries){\n  if(!window._fb || !currentUserPhone) return;\n  const logged = await loadPointAchievementsLogged();\n  const cumulative = calcCumulativeTotals(allScoredEntries);\n  const dailyTime = calcDailyTimeBonus(allScoredEntries);\n  const allAchievements = [...(cumulative.achievements||[]), ...(dailyTime.achievements||[])];\n  const newlyLogged = allAchievements.filter(a => !logged[a.key]);\n  if(!newlyLogged.length) return;\n\n  for(const a of newlyLogged){\n    logged[a.key] = true;\n    // Achievement records are marked-only entries for Points History display \u2014\n    // NOT counted a second time in growthPoints, since the aggregate\n    // calculation already accounts for them (see the \"achievement record\"\n    // branch in calcGrowthScore). Stamped with the REAL moment the bonus was\n    // actually earned (earnedAt), falling back to noon of that day only if\n    // a precise timestamp couldn't be determined for some reason.\n    await fbLogEntryWithTs(\"logs\", {\n      subject: a.subject||\"\", part:\"\", lessonId:\"achievement\", lessonTitle: a.label,\n      qtype: a.qtype, qIndex: a.dayMs, pct:100, timeMs:0, marks: a.points\n    }, a.earnedAt ?? (a.dayMs + 12*60*60*1000));\n  }\n  const { db, doc, setDoc } = window._fb;\n  try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"pointAchievementsLogged\"), logged); }catch(e){}\n}\n\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  GOODWILL POINTS \u2014 admin-awarded encouragement bonuses\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Two distinct things live here, deliberately kept separate:\n//  1. A routine \"Goodwill Points\" award the admin can give any time for\n//     good behavior \u2014 kept small (5-50 pts) and rate-limited (max 3/day)\n//     so it stays a genuine, meaningful nudge rather than becoming a\n//     casual, overused button that quietly inflates the whole point system.\n//  2. A ONE-TIME 500pt \"Compensation Bonus\" \u2014 a distinct, larger, single-use\n//     apology for the Growth Points display bug that made his score\n//     appear to shrink for reasons he couldn't see. Deliberately exempt\n//     from the routine cap since it's a one-off correction, not a pattern.\n// Both use the SAME delivery mechanism: written to a small \"live\" doc the\n// student's own open tab is already listening to, so the celebratory\n// popup appears INSTANTLY \u2014 no reload needed \u2014 the moment the admin awards it.\nconst GOODWILL_MIN = 5;\nconst GOODWILL_MAX = 50;\nconst GOODWILL_DAILY_CAP = 3;\nconst COMPENSATION_BONUS_AMOUNT = 500;\n\nconst GOODWILL_MESSAGES = [\n  \"You didn't waste any time today!\",\n  \"You finished so fast \u2014 great focus!\",\n  \"Excellent effort today!\",\n  \"You've been really consistent lately!\",\n  \"Great attitude, keep it up!\",\n  \"You worked really hard on that!\",\n  \"Proud of how you handled that!\",\n  \"You showed real patience today!\",\n];\n\nfunction pickGoodwillMessage(){\n  return GOODWILL_MESSAGES[Math.floor(Math.random()*GOODWILL_MESSAGES.length)];\n}\n\n// \u2500\u2500 Student side: listens for an admin award and celebrates instantly \u2500\u2500\nfunction startGoodwillListener(){\n  if(!window._fb || !currentUserPhone || isAdminUser) return; // admin's own tab never celebrates its own award\n  const { db, doc, onSnapshot } = window._fb;\n  onSnapshot(doc(db, \"sessions\", currentUserPhone, \"live\", \"goodwillEvent\"), snap => {\n    if(!snap.exists()) return;\n    const data = snap.data();\n    if(!data.id) return;\n    const lastSeenId = localStorage.getItem(\"lastGoodwillEventId\");\n    if(data.id === lastSeenId) return; // already celebrated this one \u2014 don't re-show on reload\n    localStorage.setItem(\"lastGoodwillEventId\", data.id);\n    bumpGrowthPointsBadge(data.amount||0);\n    showGoodwillCelebration(data.amount||0, data.message||pickGoodwillMessage());\n  });\n}\n\n// Big, animated, unmissable congratulation \u2014 deliberately more festive than\n// the small in-line point toasts, since this represents the admin noticing\n// and calling out something specific, not just routine progress.\nfunction showGoodwillCelebration(amount, message){\n  const overlayId = \"goodwillCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.55);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:52px;margin-bottom:6px;animation:goodwillBounce 1s ease-in-out infinite\">\ud83c\udf89<\u002Fdiv>\n      <div style=\"font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px\">Congrats, ${STUDENT_NAME}!<\u002Fdiv>\n      <div style=\"font-size:15px;color:var(--text);margin-bottom:16px;line-height:1.5\">${message.replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:800;font-size:22px;padding:10px 20px;border-radius:14px;display:inline-block;margin-bottom:18px\">+${amount} Growth Points \ud83c\udf81<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Awesome, thanks! \u2192<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  if(!document.getElementById(\"goodwillAnimStyle\")){\n    const s = document.createElement(\"style\");\n    s.id = \"goodwillAnimStyle\";\n    s.textContent = \"@keyframes goodwillBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\";\n    document.head.appendChild(s);\n  }\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// \u2500\u2500 Admin side: reads/updates the daily cap, one-time compensation flag \u2500\u2500\nasync function getGoodwillDailyState(){\n  const { db, doc, getDoc } = window._fb;\n  const today = new Date().toISOString().slice(0,10);\n  const snap = await getDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"goodwillDaily\"));\n  const data = snap.exists() ? snap.data() : null;\n  if(!data || data.date !== today) return { date: today, count: 0 };\n  return data;\n}\n\nasync function checkCompensationAwarded(){\n  const { db, doc, getDoc } = window._fb;\n  const snap = await getDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"compensationAwarded\"));\n  return snap.exists() && snap.data().awarded === true;\n}\n\n// The routine, capped, rate-limited award \u2014 the one meant for everyday use.\nasync function awardGoodwillPoints(amount, reason){\n  amount = Math.round(Number(amount)||0);\n  if(amount < GOODWILL_MIN || amount > GOODWILL_MAX){\n    alert(`Goodwill Points must be between ${GOODWILL_MIN} and ${GOODWILL_MAX} \u2014 keeping it small keeps it meaningful.`);\n    return false;\n  }\n  const state = await getGoodwillDailyState();\n  if(state.count >= GOODWILL_DAILY_CAP){\n    alert(`Already given ${GOODWILL_DAILY_CAP} Goodwill Point awards today \u2014 that cap is there on purpose, so it stays a genuine \"I noticed that\" rather than routine currency. Try again tomorrow!`);\n    return false;\n  }\n  const message = (reason && reason.trim()) || pickGoodwillMessage();\n  const { db, doc, setDoc } = window._fb;\n  fbLogEntry(\"logs\", {\n    subject:\"\", part:\"\", lessonId:\"goodwill\", lessonTitle: message,\n    qtype:\"goodwill\", qIndex: Date.now(), pct:100, timeMs:0, marks: amount\n  });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"goodwillDaily\"), { date: state.date, count: state.count+1 });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"live\", \"goodwillEvent\"), {\n    id: \"gw_\"+Date.now(), amount, message, ts: Date.now()\n  });\n  return true;\n}\n\n// The one-time, larger, exempt-from-the-cap apology bonus for the Growth\n// Points display bug \u2014 usable exactly once, ever.\nasync function awardCompensationBonus(){\n  const already = await checkCompensationAwarded();\n  if(already){\n    alert(\"The one-time compensation bonus has already been given.\");\n    return false;\n  }\n  const { db, doc, setDoc } = window._fb;\n  fbLogEntry(\"logs\", {\n    subject:\"\", part:\"\", lessonId:\"compensation\", lessonTitle:\"Thanks for your patience while we fixed a scoring glitch!\",\n    qtype:\"compensation\", qIndex: Date.now(), pct:100, timeMs:0, marks: COMPENSATION_BONUS_AMOUNT\n  });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"compensationAwarded\"), { awarded:true, ts:Date.now() });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"live\", \"goodwillEvent\"), {\n    id: \"comp_\"+Date.now(), amount: COMPENSATION_BONUS_AMOUNT,\n    message: \"We found and fixed a glitch that was making your points look smaller than they should sometimes. Your progress was always safe \u2014 enjoy this bonus for your patience! \ud83c\udf89\",\n    ts: Date.now()\n  });\n  return true;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MILESTONES \u2014 big, rare, motivating rewards for finishing\n//  a whole batch of lessons across Social Science\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Milestones 1-5: matching lesson number across Civics/Economics/Geography/\n// History (Milestone 3 = c3+e3+g3+h3, etc.) \u2014 built dynamically from the\n// actual lesson lists, not hardcoded, so it stays correct if lessons are\n// ever added. Economics only has 5 lessons total, so once it runs out,\n// remaining lessons from the other three subjects get grouped into batches\n// of 4 for Milestone 6 onward (the very last batch may have fewer than 4,\n// since it's just whatever's left). Social Science only for now.\nconst MILESTONE_POINTS = 1000;\nconst MILESTONE_SUBJECT_ORDER = [\"Civics\",\"Economics\",\"Geography\",\"History\"];\n\nfunction buildSocialMilestones(){\n  const ss = DATA[\"Social Science\"];\n  if(!ss) return [];\n  const lessonLists = MILESTONE_SUBJECT_ORDER.map(p => (ss.parts[p]?.lessons)||[]);\n  if(lessonLists.some(l=>!l.length)) return [];\n  const minLen = Math.min(...lessonLists.map(l=>l.length));\n  const milestones = [];\n  for(let i=0;i<minLen;i++){\n    milestones.push({ num: milestones.length+1, lessons: lessonLists.map(l=>l[i]) });\n  }\n  const remaining = [];\n  lessonLists.forEach(list=>{\n    for(let i=minLen;i<list.length;i++) remaining.push(list[i]);\n  });\n  for(let i=0;i<remaining.length;i+=4){\n    milestones.push({ num: milestones.length+1, lessons: remaining.slice(i,i+4) });\n  }\n  return milestones;\n}\n\n// A lesson counts as \"mastered\" for milestone purposes only if it has at\n// least one question AND every question across every type has been\n// genuinely mastered (80%+, unaided \u2014 same _masteredQuestionKeys set used\n// everywhere else, so a peeked-to-80% score correctly does NOT count here).\nfunction isLessonFullyMastered(lesson){\n  if(!lesson) return false;\n  let hasAny = false;\n  for(const qt of QTYPES){\n    const qs = lesson.questions[qt.id]||[];\n    for(let i=0;i<qs.length;i++){\n      hasAny = true;\n      const key = `${lesson.id}_${qt.id}_${i}`;\n      if(!_masteredQuestionKeys.has(key)) return false;\n    }\n  }\n  return hasAny;\n}\n\nlet _milestonesAwardedCache = null; // {1:true, 2:true, ...} \u2014 which milestones have already been paid out, loaded once\nlet _milestoneAwardInFlight = new Set(); // milestone keys whose payout write is currently in flight\n\n// Milestone numbers restart at 1 for each class, so they need namespacing or\n// Class 10's Milestone 1 would read as already-awarded off the back of Class\n// 9's. Class 9 deliberately keeps the original bare-number key shape so his\n// existing awards still match and are never re-paid or re-celebrated.\nfunction milestoneAwardKey(num){\n  return currentClass === \"9\" ? String(num) : currentClass + \":\" + num;\n}\n\nasync function loadMilestonesAwarded(){\n  if(_milestonesAwardedCache) return _milestonesAwardedCache;\n  if(!window._fb || !currentUserPhone){ _milestonesAwardedCache = {}; return _milestonesAwardedCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"milestonesAwarded\"));\n    _milestonesAwardedCache = snap.exists() ? snap.data() : {};\n  }catch(e){ _milestonesAwardedCache = {}; }\n  return _milestonesAwardedCache;\n}\n\n// Called after every mastery update \u2014 checks whether that update just\n// completed a milestone, and if so, awards it exactly once, ever.\nasync function checkMilestonesAfterMastery(){\n  // Note: fires for admin too (see checkLessonMasteryBonus for the same\n  // reasoning) \u2014 this used to skip entirely for admin, which meant the\n  // retroactive sweep silently did nothing when admin was the one viewing\n  // the Scoreboard, producing a different (stale) total than the student's\n  // own view of the exact same account.\n  if(!window._fb || !currentUserPhone) return;\n  const milestones = buildSocialMilestones();\n  if(!milestones.length) return;\n  const awarded = await loadMilestonesAwarded();\n  for(const m of milestones){\n    const mKey = milestoneAwardKey(m.num);\n    if(awarded[mKey]) continue; // already earned \u2014 move on to check the next one in sequence\n    // Milestones unlock strictly in order. If this is the first not-yet-\n    // earned milestone and its lessons aren't ALL mastered yet, nothing\n    // after it can be legitimately checked either \u2014 even if he's jumped\n    // ahead and happens to have mastered a later milestone's lessons\n    // already (e.g. studied History out of order), it still can't be\n    // awarded until everything before it is genuinely done.\n    if(!m.lessons.every(l => isLessonFullyMastered(l))) break;\n    // Same ordering fix as the lesson mastery bonus above: log the points\n    // first, persist the \"awarded\" flag only once that write has landed.\n    if(_milestoneAwardInFlight.has(mKey)) break;\n    _milestoneAwardInFlight.add(mKey);\n    const milestoneRef = await fbLogEntry(\"logs\", {\n      subject:\"Social Science\", part:\"\", lessonId:\"milestone\", lessonTitle:`Milestone ${m.num}: ${m.lessons.map(l=>l.title).join(\", \")}`,\n      qtype:\"milestone\", qIndex: Date.now(), pct:100, timeMs:0, marks: MILESTONE_POINTS\n    });\n    _milestoneAwardInFlight.delete(mKey);\n    if(!milestoneRef) break; // write failed \u2014 leave unclaimed; milestones unlock in order, so stop here and retry next sweep\n    awarded[mKey] = true;\n    const { db, doc, setDoc } = window._fb;\n    try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"milestonesAwarded\"), awarded); }catch(e){}\n    bumpGrowthPointsBadge(MILESTONE_POINTS);\n    showMilestoneCelebration(m.num, m.lessons);\n    // Deliberately no break here \u2014 if completing this milestone means the\n    // NEXT one's lessons also happen to already be fully mastered (e.g.\n    // catching up several at once), the loop naturally checks it next,\n    // still awarding strictly in order rather than all at once regardless.\n  }\n}\n\nfunction showMilestoneCelebration(num, lessons){\n  const overlayId = \"milestoneCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.7);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:34px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 60px rgba(0,0,0,.4);transform:scale(.8);transition:transform .45s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:58px;margin-bottom:8px;animation:goodwillBounce 1s ease-in-out infinite\">\ud83c\udfc5<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px\">Milestone ${num} Complete!<\u002Fdiv>\n      <div style=\"font-size:15px;color:var(--text);margin-bottom:14px;line-height:1.6\">${lessons.map(l=>l.title).join(\" \u00b7 \")}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:900;font-size:26px;padding:12px 24px;border-radius:14px;display:inline-block;margin-bottom:20px\">+${MILESTONE_POINTS} Growth Points \ud83c\udf89<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Amazing! \u2192<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LESSON MASTERY BONUS \u2014 +200 for fully mastering a lesson\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Previously this was recalculated fresh from current state every time the\n// Scoreboard loaded, rather than logged as a one-time event like every other\n// bonus (Goodwill, Milestones, New Question, etc.). That meant it could\n// silently affect the total but never show up in Points History, since\n// Points History reads discrete logged events \u2014 there simply wasn't one to\n// show. This fixes it properly: the first time a lesson is BOTH marked\n// \"complete\" (by admin) AND has every question genuinely mastered, it's\n// logged exactly once, same as everything else.\nconst LESSON_MASTERY_POINTS = 200;\nlet _lessonMasteryAwardedCache = null; // {lessonId: true, ...} \u2014 loaded once per session\nlet _masteryAwardInFlight = new Set(); // lessonIds whose payout write is currently in flight\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  BANKED LESSON-TEST POINTS\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Lesson test points are gated on the admin marking a lesson \"complete\".\n// That gate is fine, but it used to mean a test sat before that flag was set\n// earned nothing, ever \u2014 the run was scored, shown, and thrown away. Mastery\n// bonuses never had this problem because the sweep re-checks them forever.\n// These functions give test points the same second chance: bank the result,\n// pay it out when the lesson is finally marked complete.\nlet _pendingTestPointsCache = null; // {lessonId: {points, pct, ...}} \u2014 best banked run per lesson\nlet _pendingPayoutInFlight = new Set();\n\nasync function loadPendingTestPoints(){\n  if(_pendingTestPointsCache) return _pendingTestPointsCache;\n  if(!window._fb || !currentUserPhone){ _pendingTestPointsCache = {}; return _pendingTestPointsCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"pendingTestPoints\"));\n    _pendingTestPointsCache = snap.exists() ? (snap.data()||{}) : {};\n  }catch(e){ _pendingTestPointsCache = {}; }\n  return _pendingTestPointsCache;\n}\n\nasync function savePendingTestPoints(pending){\n  if(!window._fb || !currentUserPhone) return false;\n  try{\n    const { db, doc, setDoc } = window._fb;\n    await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"pendingTestPoints\"), pending);\n    return true;\n  }catch(e){ return false; }\n}\n\n// Only the BEST run per lesson is kept \u2014 retaking a lesson test before it's\n// marked complete should improve the banked figure, never reduce it, and\n// certainly never stack into several payouts for the same lesson.\nasync function recordPendingTestPoints(lessonId, entry){\n  if(!lessonId || !entry || !(entry.points > 0)) return;\n  const pending = await loadPendingTestPoints();\n  const prev = pending[lessonId];\n  if(prev && (prev.points||0) >= entry.points) return; // already banked something at least as good\n  pending[lessonId] = { ...entry, lessonId, bankedAt: Date.now() };\n  await savePendingTestPoints(pending);\n}\n\n// Pays out a banked lesson test the moment its lesson is marked complete.\n// Logged as a normal testPoints entry so it shows up in Points History and in\n// the total exactly like a test sat after the fact would have.\nasync function awardPendingTestPoints(lessonId){\n  if(!window._fb || !currentUserPhone || !lessonId) return;\n  if(!_completeLessons[lessonId]) return; // still not complete \u2014 keep it banked\n  if(_pendingPayoutInFlight.has(lessonId)) return;\n  const pending = await loadPendingTestPoints();\n  const entry = pending[lessonId];\n  if(!entry || !(entry.points > 0)) return;\n  _pendingPayoutInFlight.add(lessonId);\n  const ref = await fbLogEntry(\"testPoints\", {\n    lessonId,\n    lessonTitle: entry.lessonTitle || \"\",\n    pct: entry.pct || 0,\n    points: entry.points,\n    rawPoints: entry.rawPoints || entry.points,\n    difficultyMultiplier: entry.difficultyMultiplier || 1,\n    isMockExam: false,\n    bankedAt: entry.bankedAt || null\n  });\n  _pendingPayoutInFlight.delete(lessonId);\n  if(!ref) return; // write failed \u2014 stays banked, next sweep retries\n  delete pending[lessonId];\n  await savePendingTestPoints(pending);\n  showPointsToast(entry.points, \"Test Points (banked)\");\n}\n\nasync function loadLessonMasteryAwarded(){\n  if(_lessonMasteryAwardedCache) return _lessonMasteryAwardedCache;\n  if(!window._fb || !currentUserPhone){ _lessonMasteryAwardedCache = {}; return _lessonMasteryAwardedCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"lessonMasteryAwarded\"));\n    _lessonMasteryAwardedCache = snap.exists() ? snap.data() : {};\n  }catch(e){ _lessonMasteryAwardedCache = {}; }\n  return _lessonMasteryAwardedCache;\n}\n\n// Checks ONE specific lesson (the one just touched, or just marked complete)\n// rather than re-scanning the whole syllabus every time \u2014 cheap enough to\n// call after every mastery update and every admin \"mark complete\" toggle.\nasync function checkLessonMasteryBonus(lessonId){\n  // Note: unlike student-experience-only checks (New Try Bonus, spelling\n  // gate), this deliberately fires for admin too \u2014 marking a lesson\n  // \"complete\" is an admin-only action, so if that admin action is what\n  // completes the bonus (all questions already mastered beforehand), it\n  // needs to fire right there, not only from the student's own side.\n  if(!window._fb || !currentUserPhone || !lessonId) return;\n  const awarded = await loadLessonMasteryAwarded();\n  if(awarded[lessonId]) return; // already earned, ever\n  if(!_completeLessons[lessonId]) return; // admin hasn't marked it complete yet\n\n  // Find the actual lesson object AND which subject/part it lives under \u2014\n  // this used to fall back to the global currentSubject/currentPart, which\n  // is only correct while actively inside that lesson's own session. When\n  // this check runs from a sweep (checking every lesson, not just the one\n  // just answered), that global state could belong to a completely\n  // different lesson, silently mislabeling the log entry.\n  let lesson = null, foundSubject = \"\", foundPart = \"\";\n  outer: for(const [subjName, subj] of Object.entries(DATA)){\n    for(const [partName, part] of Object.entries(subj.parts)){\n      const found = part.lessons.find(l=>l.id===lessonId);\n      if(found){ lesson = found; foundSubject = subjName; foundPart = partName; break outer; }\n    }\n  }\n  if(!lesson || !isLessonFullyMastered(lesson)) return;\n\n  // Log the points FIRST, and only then persist the \"awarded\" flag. The old\n  // order was the reverse \u2014 flag saved, then logged \u2014 and because fbLogEntry\n  // swallows write failures, a failed log left the lesson permanently marked\n  // as awarded with no points ever recorded anywhere. The `if(awarded[...])\n  // return` guard at the top then blocked every future retry, so the bonus\n  // was gone for good. Logging first means a failed write simply leaves the\n  // bonus unclaimed, and the next sweep picks it up and tries again.\n  if(_masteryAwardInFlight.has(lessonId)) return; // a rapid double-trigger while the write is in flight would otherwise double-pay\n  _masteryAwardInFlight.add(lessonId);\n  const masteryRef = await fbLogEntry(\"logs\", {\n    subject: foundSubject, part: foundPart, lessonId:\"lessonmastery\",\n    lessonTitle: `${lesson.title}`, qtype:\"lessonmastery\", qIndex: Date.now(), pct:100, timeMs:0, marks: LESSON_MASTERY_POINTS\n  });\n  _masteryAwardInFlight.delete(lessonId);\n  if(!masteryRef) return; // write failed \u2014 stay unclaimed so a later sweep retries\n  awarded[lessonId] = true;\n  const { db, doc, setDoc } = window._fb;\n  try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"lessonMasteryAwarded\"), awarded); }catch(e){}\n  bumpGrowthPointsBadge(LESSON_MASTERY_POINTS);\n  showLessonMasteryCelebration(lesson);\n}\n\n// Catches anything that was ALREADY true but never got a live trigger to\n// check it \u2014 e.g. a lesson fully mastered and marked complete before this\n// feature existed, or between sessions with no new answer to fire the\n// per-question check. Safe to call as often as needed: both underlying\n// checks are already idempotent (a persisted \"awarded\" flag prevents any\n// double-payout), this just makes sure they're actually CALLED regularly,\n// not only from live events that might never happen again for an\n// already-finished lesson.\nasync function sweepAllPendingBonuses(){\n  if(!window._fb || !currentUserPhone) return;\n  await checkMilestonesAfterMastery(); // already checks every milestone from scratch each time\n  for(const subj of Object.values(DATA)){\n    for(const part of Object.values(subj.parts)){\n      for(const lesson of part.lessons){\n        await checkLessonMasteryBonus(lesson.id);\n        await awardPendingTestPoints(lesson.id);\n      }\n    }\n  }\n}\n\nfunction showLessonMasteryCelebration(lesson){\n  const overlayId = \"lessonMasteryCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.65);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:32px 26px;max-width:370px;width:100%;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:52px;margin-bottom:8px;animation:goodwillBounce 1s ease-in-out infinite\">\ud83c\udfc6<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px\">Lesson Mastered!<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:700;color:var(--navy);margin-bottom:14px\">${lesson.title}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:900;font-size:24px;padding:11px 22px;border-radius:14px;display:inline-block;margin-bottom:18px\">+${LESSON_MASTERY_POINTS} Growth Points \ud83c\udf89<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Great work! \u2192<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  ONE-TIME SCORE CORRECTION NOTICE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// A handful of bugs (a permanently-inflating evening-session bonus, a\n// doubled speed bonus) had been over-counting Growth Points for a while.\n// Fixing them means the true, correctly-calculated total is lower than\n// what was showing before \u2014 a real, honest correction, not new points\n// disappearing. Shown exactly once, ever, so it doesn't feel like the\n// score is being explained away every time it's opened.\nlet _scoreCorrectionNoticeShownCache = null;\n\nasync function maybeShowScoreCorrectionNotice(){\n  if(!window._fb || !currentUserPhone) return;\n  if(_scoreCorrectionNoticeShownCache === null){\n    try{\n      const { db, doc, getDoc } = window._fb;\n      const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"scoreCorrectionNoticeShown\"));\n      _scoreCorrectionNoticeShownCache = snap.exists();\n    }catch(e){ return; } // if we can't check, better to stay quiet than risk showing it repeatedly\n  }\n  if(_scoreCorrectionNoticeShownCache) return;\n  _scoreCorrectionNoticeShownCache = true;\n  const { db, doc, setDoc } = window._fb;\n  try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"scoreCorrectionNoticeShown\"), { shown:true, ts:Date.now() }); }catch(e){}\n\n  const overlayId = \"scoreCorrectionNotice_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.6);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:left;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.92);transition:transform .35s ease\">\n      <div style=\"font-size:34px;margin-bottom:10px\">\ud83d\udcd0<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:800;color:var(--navy);margin-bottom:10px\">A quick note about your Growth Points<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:var(--text);line-height:1.6;margin-bottom:16px\">\n        We found and fixed a few scoring bugs that had been quietly adding extra points by accident \u2014 nothing you did wrong, just mistakes in how a couple of bonuses were calculated behind the scenes.<br><br>\n        Your total may look a little different than before because of this \u2014 that's the fix working correctly, not points disappearing. Everything is fully accurate now, and every point you earn from here on counts exactly right and keeps climbing, same as always.\n      <\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Got it \u2192<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  \"TRY SOMETHING NEW\" \u2014 every brand-new question, first attempt\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Targets a specific moment: the dread that shows up BEFORE even attempting\n// a question he's never seen, on the harder multi-mark types (1-mark\n// MCQ/Fill/True-False are quick guesses, not the \"can I even learn this\"\n// problem this is meant to address). Every genuinely new question of a\n// qualifying type gets a calm reassurance banner beforehand, and \u2014\n// regardless of score \u2014 a celebratory bonus afterward for having tried,\n// not for having gotten it right. No daily cap: the \"never attempted\n// before\" check is itself the safeguard \u2014 a given question can only ever\n// be \"new\" once, so the total is naturally bounded by the size of the\n// syllabus, not farmable by repeating anything.\nconst NEW_TRY_EXCLUDED_QTYPES = new Set([\"mcq\",\"fill\",\"truefalse\"]);\nconst NEW_TRY_BONUS_MARKS = 10;\nconst NEW_TRY_MESSAGES_BEFORE = [\n  \"New territory! First tries are just about getting something down \u2014 not getting it right.\",\n  \"You haven't seen this one before \u2014 most people need 2\u20133 tries before it clicks.\",\n  \"This is brand new for you. Whatever you write is a fine start.\",\n];\nconst NEW_TRY_MESSAGES_AFTER = [\n  \"That's how learning something new always starts.\",\n  \"First attempts are for finding out what you don't know yet. That's exactly what just happened.\",\n  \"You tried something brand new today \u2014 that's the hard part, and you did it.\",\n];\n\nlet _pendingNewTryBonus = null; // {lessonId, qtype, qIndex} \u2014 the exact question the banner was shown for\n\nfunction pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }\n\n// Called after every question renders \u2014 shows the banner for any genuinely\n// new (never-attempted) qualifying question, every time, not just once/day.\nfunction maybeShowNewTryBanner(qtype, qIndex){\n  _pendingNewTryBonus = null;\n  if(isAdminUser) return; // admin browsing the mirror never triggers this\n  if(NEW_TRY_EXCLUDED_QTYPES.has(qtype)) return;\n  if(!currentLesson || currentLesson.id===\"__mock__\") return;\n  const key = `${currentLesson.id}_${qtype}_${qIndex}`;\n  if(_answeredQuestionKeys.has(key)) return; // he's attempted this one before \u2014 not actually new\n\n  const card = document.querySelector(\"#quizBody .question-card\");\n  if(!card || !card.parentNode) return;\n  const banner = document.createElement(\"div\");\n  banner.style.cssText = \"margin:0 0 12px;padding:10px 14px;background:#eef4ff;border:1.5px dashed #7fa8e0;border-radius:10px;font-size:12.5px;color:#2a4a7a;line-height:1.5\";\n  banner.textContent = \"\ud83c\udf31 \" + pickRandom(NEW_TRY_MESSAGES_BEFORE);\n  card.parentNode.insertBefore(banner, card.nextSibling);\n\n  _pendingNewTryBonus = { lessonId: currentLesson.id, qtype, qIndex };\n}\n\n// Called from each check* function after scoring \u2014 awards the bonus only if\n// THIS exact question is the one the banner was shown for, regardless of\n// how well it went, since the point is rewarding the attempt itself.\nfunction maybeAwardNewTryBonus(qtype, qIndex){\n  if(!_pendingNewTryBonus) return;\n  if(!currentLesson || _pendingNewTryBonus.lessonId!==currentLesson.id || _pendingNewTryBonus.qtype!==qtype || _pendingNewTryBonus.qIndex!==qIndex) return;\n  _pendingNewTryBonus = null; // consume immediately \u2014 a Try Again on this same question can't re-trigger it\n\n  fbLogEntry(\"logs\", {\n    subject: currentSubject||\"\", part: currentPart||\"\", lessonId: currentLesson?.id||\"\",\n    lessonTitle: currentLesson?.title||\"\", qtype:\"newtry\", qIndex: Date.now(), pct:100, timeMs:0, marks: NEW_TRY_BONUS_MARKS\n  });\n  bumpGrowthPointsBadge(NEW_TRY_BONUS_MARKS);\n  showNewTryCelebration();\n}\n\nfunction showNewTryCelebration(){\n  const overlayId = \"newTryCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.55);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:48px;margin-bottom:6px\">\ud83c\udf31<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px\">You tried something new!<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:var(--text);margin-bottom:16px;line-height:1.5\">${pickRandom(NEW_TRY_MESSAGES_AFTER)}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:800;font-size:20px;padding:9px 18px;border-radius:14px;display:inline-block;margin-bottom:18px\">+${NEW_TRY_BONUS_MARKS} Growth Points \ud83c\udf31<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Keep going \u2192<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// Continuously overwrite a single \"live\" document with whatever the student is\n// currently doing \u2014 current question, what's selected/typed so far, navigation.\n// This is what makes the admin view feel like watching over their shoulder.\nlet _liveStateTimer = null;\nfunction fbLiveState(patch){\n  if(!window._fb || !currentUserPhone || isAdminUser) return; // admin never overwrites the student's live state\n  clearTimeout(_liveStateTimer);\n  _liveStateTimer = setTimeout(()=>{\n    const { db, doc, setDoc, serverTimestamp } = window._fb;\n    setDoc(doc(db, \"sessions\", currentUserPhone, \"live\", \"current\"), {\n      ...patch,\n      updatedAt: serverTimestamp()\n    }, { merge: true }).catch(err => console.warn(\"Live state write failed:\", err));\n  }, 250); // debounce so fast typing doesn't spam writes\n}\n\n// Admin-only: show a small floating bar with a live mirror + download button\nfunction showAdminBar(){\n  if(!window._fb) return;\n  const bar = document.createElement(\"div\");\n  bar.id = \"adminBar\";\n  bar.style.cssText = \"position:fixed;top:0;left:0;right:0;background:#202a3d;color:#fff;padding:8px 14px;font-size:12px;font-weight:700;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:10px\";\n  bar.innerHTML = `\n    <span>\ud83d\udc41 Admin Mode \u2014 mirroring ${STUDENT_NAME} <span style=\"opacity:.55;font-weight:400\">\u00b7 v${APP_VERSION}<\u002Fspan><\u002Fspan>\n    <button onclick=\"openAdminMirror()\" style=\"background:#fff;color:#202a3d;border:none;border-radius:6px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer\">Open Live Report<\u002Fbutton>`;\n  document.body.appendChild(bar);\n  document.body.style.paddingTop = \"36px\";\n}\n\nfunction closeAdminMirror(){\n  const panel = document.getElementById(\"adminMirrorPanel\");\n  if(panel) panel.classList.remove(\"visible\");\n}\n\n// Opens a live-updating panel showing the student's session logs and exam answers in real time.\nfunction openAdminMirror(){\n  if(!window._fb || !currentUserPhone) return;\n  const { db, doc, collection, onSnapshot, query, orderBy } = window._fb;\n\n  let panel = document.getElementById(\"adminMirrorPanel\");\n  if(panel){ panel.classList.add(\"visible\"); return; }\n\n  panel = document.createElement(\"div\");\n  panel.id = \"adminMirrorPanel\";\n  panel.style.cssText = \"position:fixed;inset:0;background:#fff;z-index:200000;overflow-y:auto;padding:60px 16px 24px\";\n  panel.innerHTML = `\n    <button onclick=\"closeAdminMirror()\"\n      style=\"position:fixed;top:46px;right:12px;background:#d15f5a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:200001\">\u2715 Close<\u002Fbutton>\n    <h2 style=\"font-family:Georgia,serif;color:#202a3d\">\ud83d\udcca Live Mirror \u2014 ${STUDENT_NAME}<\u002Fh2>\n    <div style=\"display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap\">\n      <button onclick=\"showAdminTab('live')\" id=\"tabBtnLive\" class=\"admin-tab-btn active\">\ud83d\udd34 Live<\u002Fbutton>\n      <button onclick=\"showAdminTab('scoreboard')\" id=\"tabBtnScoreboard\" class=\"admin-tab-btn\">\ud83c\udfc6 Scoreboard<\u002Fbutton>\n      <button onclick=\"showAdminTab('lessons')\" id=\"tabBtnLessons\" class=\"admin-tab-btn\">\ud83d\udcda Lessons<\u002Fbutton>\n      <button onclick=\"showAdminTab('goodwill')\" id=\"tabBtnGoodwill\" class=\"admin-tab-btn\">\ud83c\udf81 Goodwill<\u002Fbutton>\n      <button onclick=\"showAdminTab('content')\" id=\"tabBtnContent\" class=\"admin-tab-btn\">\ud83d\udee0\ufe0f Manage Content<\u002Fbutton>\n      <button onclick=\"showAdminTab('focus')\" id=\"tabBtnFocus\" class=\"admin-tab-btn\">\ud83c\udfaf Focus Mode<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"adminTabLive\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#d15f5a;display:inline-block;animation:pulseLive 1.5s infinite\"><\u002Fspan>\n        <span style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px\">Right now \u2014 what ${STUDENT_NAME} sees<\u002Fspan>\n      <\u002Fdiv>\n      <style>@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.3}}<\u002Fstyle>\n      <div id=\"adminLiveNow\" style=\"background:var(--parchment,#faf6ee);border:1.5px solid var(--border,#e8e0d0);border-radius:14px;padding:16px;margin-bottom:20px\">\n        <div id=\"adminLiveNowBody\"><p style=\"opacity:.7;margin:0\">Waiting for activity\u2026<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"font-family:Georgia,serif;color:#202a3d\">\ud83d\udd58 Recent Activity (Today)<\u002Fh3>\n      <div id=\"adminLogList\" style=\"font-size:13px\"><\u002Fdiv>\n      <h3 style=\"margin-top:24px;font-family:Georgia,serif;color:#202a3d\">\ud83d\udcdd Practice Test Answers (Today)<\u002Fh3>\n      <div id=\"adminExamList\" style=\"font-size:13px\"><\u002Fdiv>\n      <button onclick=\"downloadAdminMirror()\" style=\"margin-top:20px;padding:10px 20px;background:#202a3d;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">\u2b07 Download Full Report<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"adminTabScoreboard\" style=\"display:none\">\n      <div id=\"scoreboardTotal\" style=\"background:#202a3d;color:#fff;border-radius:12px;padding:16px;margin-bottom:20px\"><\u002Fdiv>\n      <div id=\"adminHowToEarn\" style=\"margin-bottom:20px\"><\u002Fdiv>\n      <div id=\"scoreboardSessions\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabLessons\" style=\"display:none\">\n      <p style=\"font-size:12px;color:var(--muted);margin-bottom:14px\">Toggle lessons as \"Complete\" once all questions are added. Only complete lessons qualify for the \ud83c\udfc6 Lesson Mastery bonus (+200 pts).<\u002Fp>\n      <div id=\"adminClassBarLessons\" style=\"margin-bottom:14px\"><\u002Fdiv>\n      <div id=\"adminLessonsList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabContent\" style=\"display:none\">\n      <p style=\"font-size:12px;color:var(--muted);margin-bottom:14px\">Add, edit, or remove lessons and questions \u2014 changes save straight to the database and ${STUDENT_NAME} sees them the next time the app loads (or immediately if already open, once reloaded). Lessons can only be added under an existing subject/part \u2014 creating a whole new subject or part still needs a code change. Click a lesson to expand it \u2014 every question type (Match, Fill Up, Brief, etc.) is listed there with its own \u201c+ Add\u201d button, even before any questions exist yet.<\u002Fp>\n      <div id=\"adminClassBarContent\" style=\"margin-bottom:14px\"><\u002Fdiv>\n      <div id=\"manageContentList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabFocus\" style=\"display:none\">\n      <p style=\"font-size:12px;color:var(--muted);margin-bottom:14px\">Restrict ${STUDENT_NAME} to specific lessons for a study session \u2014 everything else disappears from his sidebar, subject/part tabs, lesson list, and Practice Test picker until you turn it off. Your own view (this screen, Manage Content, Scoreboard, etc.) always shows everything regardless.<\u002Fp>\n      <div id=\"focusModeList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabGoodwill\" style=\"display:none\">\n      <div id=\"compensationBox\" style=\"background:#fff8e6;border:1.5px solid #d1983f;border-radius:12px;padding:16px;margin-bottom:20px\">\n        <div style=\"font-weight:800;color:#202a3d;margin-bottom:6px\">\ud83c\udf81 One-Time Compensation Bonus<\u002Fdiv>\n        <p style=\"font-size:12.5px;color:var(--muted);margin:0 0 12px\">For the Growth Points display bug that made his score look smaller than it really was. This is a separate, one-off apology bonus \u2014 usable exactly once, and not part of the routine cap below.<\u002Fp>\n        <div id=\"compensationBtnWrap\">Loading\u2026<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--parchment,#faf6ee);border:1.5px solid var(--border,#e8e0d0);border-radius:12px;padding:16px\">\n        <div style=\"font-weight:800;color:#202a3d;margin-bottom:6px\">\ud83c\udf81 Award Goodwill Points<\u002Fdiv>\n        <p style=\"font-size:12.5px;color:var(--muted);margin:0 0 12px\">For genuinely noticing good behavior or effort \u2014 kept small (${GOODWILL_MIN}\u2013${GOODWILL_MAX} pts) and capped at ${GOODWILL_DAILY_CAP} awards a day, so it stays meaningful instead of routine.<\u002Fp>\n        <div id=\"goodwillDailyStatus\" style=\"font-size:12px;font-weight:700;color:#202a3d;margin-bottom:10px\">Loading today's usage\u2026<\u002Fdiv>\n        <label style=\"display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px\">Points (${GOODWILL_MIN}\u2013${GOODWILL_MAX})<\u002Flabel>\n        <input type=\"number\" id=\"goodwillAmountInput\" min=\"${GOODWILL_MIN}\" max=\"${GOODWILL_MAX}\" value=\"20\" style=\"width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:10px;font-family:inherit\">\n        <label style=\"display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px\">Reason (shown to ${STUDENT_NAME}, optional \u2014 a nice default is picked if left blank)<\u002Flabel>\n        <select id=\"goodwillReasonSelect\" onchange=\"document.getElementById('goodwillReasonCustom').value=this.value==='custom'?'':this.value\" style=\"width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:8px;font-family:inherit\">\n          <option value=\"\">\u2014 Pick a message or write your own below \u2014<\u002Foption>\n          ${GOODWILL_MESSAGES.map(m=>`<option value=\"${m.replace(/\"/g,\"&quot;\")}\">${m}<\u002Foption>`).join(\"\")}\n          <optio
