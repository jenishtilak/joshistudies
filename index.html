GROWTH POINTS FLOOR — locked in at today's corrected total\n// ═══════════════════════════════════════════════════════\n// An earlier version of this floor was anchored to an old, inflated\n// number (from before several over-counting bugs were fixed) — which\n// meant the true corrected total could sit far below it, making the\n// score look frozen. This version doesn't hardcode any old number: the\n// FIRST time it ever runs for this account, it simply seeds itself at\n// whatever the current, already-corrected calculation gives — today's\n// real total, nothing else. From that exact point on, it can only ever\n// climb, permanently, no matter what future fixes change about how new\n// points are calculated. The goal is the same as it always was — a\n// number that never goes backwards — just anchored at an honest starting\n// line instead of a number that was never accurate to begin with.\nlet _growthPointsFloorCache = null;\n\nasync function applyGrowthPointsFloor(freshTotal){\n  if(!window._fb || !currentUserPhone) return freshTotal; // no account context — nothing to floor against\n  if(_growthPointsFloorCache === null){\n    try{\n      const { db, doc, getDoc } = window._fb;\n      const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"));\n      // No floor recorded yet — seed it at today's fresh total, not any\n      // old hardcoded number. This is the one and only place a fresh\n      // total is ever treated as the new baseline going forward.\n      _growthPointsFloorCache = snap.exists() ? (snap.data().value||0) : freshTotal;\n      if(!snap.exists()){\n        const { setDoc } = window._fb;\n        setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"), { value: freshTotal }).catch(()=>{});\n      }\n    }catch(e){ _growthPointsFloorCache = freshTotal; }\n  }\n  const effective = Math.max(freshTotal, _growthPointsFloorCache);\n  if(effective > _growthPointsFloorCache){\n    _growthPointsFloorCache = effective;\n    if(window._fb && currentUserPhone){\n      const { db, doc, setDoc } = window._fb;\n      setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"), { value: effective }).catch(()=>{});\n    }\n  }\n  return effective;\n}\n\nasync function initLiveGrowthBadge(){\n  const badge = document.getElementById(\"quizGrowthBadge\");\n  if(!badge) return;\n  if(_liveGrowthPoints !== null){ badge.textContent = \"🌱 \"+_liveGrowthPoints; return; } // already loaded this session — reuse it\n  if(!window._fb || !currentUserPhone){ badge.textContent = \"\"; return; }\n  try{\n    const { logsSnap, examSnap, totalTestPoints } = await getLogsBundle();\n    const { allUnique, allScoredEntries } = aggregateScoreboardData(logsSnap, examSnap);\n    const { growthPoints } = calcGrowthScore(allUnique, allScoredEntries, totalTestPoints);\n    _liveGrowthPoints = await applyGrowthPointsFloor(growthPoints);\n    badge.textContent = \"🌱 \"+_liveGrowthPoints;\n  }catch(e){ badge.textContent = \"\"; }\n}\n\n// Call this anywhere points are actually earned — bumps the header badge\n// immediately instead of only showing a toast that disappears.\nfunction bumpGrowthPointsBadge(amount){\n  if(!amount || _liveGrowthPoints===null) return; // badge hasn't loaded yet — toast still shows regardless, this just skips the live bump this one time\n  _liveGrowthPoints += amount;\n  if(_growthPointsFloorCache !== null && _liveGrowthPoints > _growthPointsFloorCache){\n    _growthPointsFloorCache = _liveGrowthPoints; // keep the floor caught up to what's already been shown live\n    if(window._fb && currentUserPhone){\n      const { db, doc, setDoc } = window._fb;\n      setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"), { value: _liveGrowthPoints }).catch(()=>{});\n    }\n  }\n  const badge = document.getElementById(\"quizGrowthBadge\");\n  if(!badge) return;\n  badge.textContent = \"🌱 \"+_liveGrowthPoints;\n  badge.classList.add(\"bump\");\n  setTimeout(()=>badge.classList.remove(\"bump\"), 200);\n}\n\n// Same logic as the admin's scoreboard, but scoped to the logged-in student\n// viewing their own all-time stats (no live-mirroring UI needed here).\nasync function buildStudentScoreboard(){\n  const totalBox = document.getElementById(\"studentScoreboardTotal\");\n  if(!totalBox) return;\n\n  if(!window._fb || !currentUserPhone){\n    totalBox.innerHTML = \"<p style='margin:0'>Scoreboard needs an internet connection.<\u002Fp>\";\n    return;\n  }\n\n  totalBox.innerHTML = \"Loading…\";\n\n  let logsSnap, examSnap, totalTestPoints;\n  try{\n    ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  } catch(err){\n    totalBox.innerHTML = \"<p style='margin:0'>Couldn't load scoreboard right now.<\u002Fp>\";\n    return;\n  }\n\n  if(logsSnap.empty && examSnap.empty){\n    totalBox.innerHTML = \"<p style='margin:0'>No sessions recorded yet — keep studying!<\u002Fp>\";\n    return;\n  }\n\n  // Catch up on anything already true but never actually logged as a real\n  // event — a lesson mastered before this feature existed, or a Daily\n  // Goal/session/time bonus that was always correctly counted in the total\n  // but never had a Points History entry to show for it. If any of this\n  // logs something new, re-fetch once so THIS render reflects it, instead\n  // of only the next one.\n  const firstPassEntries = aggregateScoreboardData(logsSnap, examSnap).allScoredEntries;\n  await sweepAllPendingBonuses();\n  await syncPointAchievementsToHistory(firstPassEntries);\n  ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  maybeShowScoreCorrectionNotice();\n\n  const agg = aggregateScoreboardData(logsSnap, examSnap);\n  const allScoredEntries = agg.allScoredEntries;\n  let grandTimeMs = agg.grandTimeMs;\n\n  // Build set of previously-answered question keys for first-attempt bonus + mastery tracking\n  if(!_answeredKeysLoaded){\n    allScoredEntries.forEach(function(e){\n      var key = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n      _answeredQuestionKeys.add(key);\n      // Mastered = scored 80%+ at least once WITHOUT peeking — a score reached\n      // by looking at the model answer isn't proof he knows it unaided.\n      if((e.pct||0) >= 80 && !e.peeked) _masteredQuestionKeys.add(key);\n    });\n    _answeredKeysLoaded = true;\n  }\n\n  // Merge current session entries that may not yet be in Firebase, so the\n  // 30-min time bonus and stats update immediately — matched by clientId\n  // (a stable ID stored in both places) rather than timestamp, since a\n  // session's local Date.now() and Firestore's serverTimestamp() can never\n  // be made to match even for the exact same entry. Older entries logged\n  // before clientId existed won't have one on either side, so they simply\n  // never match here and fall back to showing only once they've synced —\n  // no different from how every entry already behaved before this fix.\n  const existingClientIds = new Set(allScoredEntries.map(e=>e.clientId).filter(Boolean));\n  sessionLog.forEach(function(e){\n    if(e.clientId && !existingClientIds.has(e.clientId)){\n      allScoredEntries.push(e);\n      grandTimeMs += e.timeMs || 0;\n    }\n  });\n\n  totalBox.innerHTML = (await renderScoreboardTotalHTML(agg.bySession, agg.allUnique, agg.grandAttempts, grandTimeMs, agg.mockStats, allScoredEntries, totalTestPoints)) + renderMilestonesHTML();\n  celebrateDailyGoalIfJustCompleted(agg.allUnique, allScoredEntries, totalTestPoints);\n}\n\n// A card showing progress toward each Social Science milestone — which\n// lessons are genuinely mastered (not peeked-through) toward each batch,\n// and how many milestones are complete overall.\n// A real, category-by-category audit of exactly where the total comes from —\n// dark-theme styled to sit inside the Scoreboard's navy sheet, collapsed by\n// default like the other detail sections. Only shows categories that have\n// actually contributed something, so it stays short for a student who's\n// only earned points a few ways so far.\nfunction renderScoreBreakdownHTML(breakdown, rawTotal, flooredTotal){\n  const rows = [\n    [\"📝\", \"Practice answers (incl. first-attempt & speed bonus)\", breakdown.practice],\n    [\"📋\", \"Daily Goal completions\", breakdown.dailyGoal],\n    [\"⏰\", \"Morning/Evening session bonuses\", breakdown.sessionBonuses],\n    [\"⚡\", \"Speed Bonus (older entries)\", breakdown.speedBonusLegacy],\n    [\"📝\", \"Practice Test scores\", breakdown.testPoints],\n    [\"⏱\", \"Daily time bonus (30+ min/subject)\", breakdown.dailyTime],\n    [\"📖\", \"Read & Memorise bonus\", breakdown.reciteReadMemorise],\n    [\"🌱\", \"New Question bonus\", breakdown.newTry],\n    [\"🏆\", \"Lesson Mastery bonus\", breakdown.lessonMastery],\n    [\"🏅\", \"Milestones\", breakdown.milestones],\n    [\"🎁\", \"Goodwill Points\", breakdown.goodwill],\n    [\"🎁\", \"Compensation bonus\", breakdown.compensation],\n  ].filter(r => r[2] > 0);\n  if(!rows.length) return \"\";\n  const rowsHTML = rows.map(r=>\n    `<div style=\"display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px\">\n      <div style=\"color:rgba(255,255,255,.8)\">${r[0]} ${r[1]}<\u002Fdiv>\n      <div style=\"font-weight:800;color:#7ee787\">+${r[2].toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>`\n  ).join(\"\");\n  // The header describes the number these rows actually sum to (today's\n  // fresh calculation). If the floor is currently protecting a HIGHER\n  // number than that (shouldn't normally happen now that it's seeded at an\n  // honest baseline, but could if a future fix genuinely reduces the raw\n  // math again), that gap is shown as its own explicit line rather than\n  // silently mixed into the same figure.\n  const floorNote = flooredTotal > rawTotal\n    ? `<div style=\"margin-top:10px;padding:8px 10px;background:rgba(209,152,63,.12);border:1px solid rgba(209,152,63,.3);border-radius:8px;font-size:11.5px;color:rgba(255,255,255,.75)\">\n        🛡️ Your displayed total is protected at <b style=\"color:#d1983f\">${flooredTotal.toLocaleString()}<\u002Fb> — the highest it's ever reached — even though today's fresh calculation below currently comes to ${rawTotal.toLocaleString()}. It can only go up from here, never down.\n      <\u002Fdiv>`\n    : \"\";\n  return `<div style=\"margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)\">\n    <details>\n      <summary style=\"list-style:none;cursor:pointer;font-weight:800;color:#fff;font-size:13px;user-select:none\">🔍 Score Breakdown — why is it ${rawTotal.toLocaleString()}?<\u002Fsummary>\n      <div style=\"margin-top:8px\">${rowsHTML}<\u002Fdiv>\n      ${floorNote}\n    <\u002Fdetails>\n  <\u002Fdiv>`;\n}\n\nfunction renderMilestonesHTML(){\n  const milestones = buildSocialMilestones();\n  if(!milestones.length) return \"\";\n  let stillInOrder = true; // flips false at the first milestone whose lessons aren't all mastered yet\n  let completeCount = 0;\n  const rows = milestones.map(m=>{\n    const doneLessons = m.lessons.filter(l=>isLessonFullyMastered(l)).length;\n    const lessonsMastered = doneLessons === m.lessons.length;\n    const isComplete = stillInOrder && lessonsMastered; // only counts as \"done\" if everything before it is genuinely done too, in order\n    const locked = !stillInOrder;\n    if(!lessonsMastered) stillInOrder = false; // this and everything after is gated behind finishing this one first\n    if(isComplete) completeCount++;\n    const icon = isComplete ? \"🏅\" : locked ? \"🔒\" : \"⬜\";\n    return `<div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);${locked?'opacity:.5':''}\">\n      <div style=\"flex:1;padding-right:10px\">\n        <div style=\"font-weight:700;color:var(--navy);font-size:12.5px\">${icon} Milestone ${m.num}${locked?` <span style=\"font-weight:400;color:var(--muted)\">(unlocks after Milestone ${m.num-1})<\u002Fspan>`:\"\"}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted);margin-top:1px\">${m.lessons.map(l=>l.title).join(\" · \")}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-weight:800;font-size:13px;color:${isComplete?\"var(--green)\":\"var(--muted)\"};white-space:nowrap\">${doneLessons}/${m.lessons.length}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join(\"\");\n  return `<div style=\"margin-top:16px;background:var(--parchment);border-radius:12px;padding:12px 14px;color:var(--text)\">\n    <details>\n      <summary style=\"list-style:none;cursor:pointer;font-weight:800;color:var(--navy);font-size:13px;user-select:none\">🏅 Milestones (${completeCount}/${milestones.length}) — +${MILESTONE_POINTS} pts each<\u002Fsummary>\n      <div style=\"margin-top:8px\">${rows}<\u002Fdiv>\n    <\u002Fdetails>\n  <\u002Fdiv>`;\n}\n\n// Fires a fireworks burst the first time the daily goal is seen as complete\n// for a given date — never repeats for the same day, even if the scoreboard\n// is reopened many times after it's already done. Uses localStorage purely\n// as a \"have I already celebrated today\" flag, scoped by date so it resets\n// naturally every day.\n// Checks for newly-completed milestones (daily goal, morning/evening sessions)\n// and celebrates each one exactly once per day — fireworks plus a clear\n// \"+N points\" announcement, separate from the small per-question toast.\n// Each milestone gets its own dated flag so completing several in one day\n// (e.g. daily goal AND both sessions) celebrates all of them, just once each.\nfunction celebrateDailyGoalIfJustCompleted(allUnique, allScoredEntries, totalTestPoints){\n  try{\n    const { dailyGoal, sessionGoals } = calcGrowthScore(allUnique, allScoredEntries, totalTestPoints||0);\n    const todayKey = new Date().toISOString().slice(0,10); // YYYY-MM-DD\n\n    const milestones = [\n      { done: dailyGoal.completedToday, flag:\"goal\", points:10, label:\"Daily Goal complete!\" },\n    ];\n    // Per-subject session milestones — full completion and partial \"started\"\n    Object.entries(sessionGoals.bySubject||{}).forEach(([subj,sg])=>{\n      const abbr = subj.split(\" \")[0]; // e.g. \"Social\" from \"Social Science\"\n      if(sg.earlyDone)       milestones.push({ done:true, flag:\"early_\"+subj,      points:70, label:`Early Morning — ${abbr}! 🌅` });\n      else if(sg.lateDone)   milestones.push({ done:true, flag:\"late_\"+subj,       points:50, label:`Morning Session — ${abbr}! 🌅` });\n      else if(sg.mornStarted)milestones.push({ done:true, flag:\"mornstart_\"+subj,  points:10, label:`${abbr} Morning started! 🟠 Keep going!` });\n      if(sg.eveningDone)     milestones.push({ done:true, flag:\"evening_\"+subj,    points:50, label:`Evening Session — ${abbr}! 🌙` });\n      else if(sg.eveStarted) milestones.push({ done:true, flag:\"evestart_\"+subj,   points:10, label:`${abbr} Evening started! 🟠 Keep going!` });\n      if(sg.bothDone)        milestones.push({ done:true, flag:\"both_\"+subj,       points:50, label:`Both sessions — ${abbr}! 🎉` });\n    });\n\n    let anyNewMilestone = false;\n    milestones.forEach(ms=>{\n      if(!ms.done) return;\n      const storageKey = `studybuddy_celebrated_${ms.flag}_${todayKey}`;\n      if(localStorage.getItem(storageKey)) return; // already celebrated this one today\n      localStorage.setItem(storageKey, \"1\");\n      showPointsToast(ms.points, ms.label);\n      anyNewMilestone = true;\n    });\n\n    if(anyNewMilestone) launchFireworks();\n  } catch(err){\n    // localStorage can throw in some restricted contexts — celebration is a\n    // nice-to-have, never worth breaking the scoreboard over.\n  }\n}\n\n// Shared aggregation logic used by both the student's and admin's scoreboard views.\nfunction aggregateScoreboardData(logsSnap, examSnap){\n  const bySession = {};\n  const allUnique = new Set();\n  let grandAttempts = 0, grandTimeMs = 0;\n\n  // Resolves a Firestore timestamp field to a real millisecond number, or null\n  // if it genuinely isn't available yet. Never falls back to \"now\" — doing so\n  // previously caused entries with an unresolved/missing timestamp to silently\n  // look like they happened today, every single time the page reloaded, which\n  // is exactly what made the daily goal appear permanently \"complete\" and never\n  // reset at midnight.\n  function resolveTs(e){\n    if(e.ts?.toDate) return e.ts.toDate().getTime();\n    if(typeof e.ts === \"number\") return e.ts; // already a millisecond number\n    return null;\n  }\n\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = { entries:[], mockEntries:[], firstTs:null, lastTs:null };\n    bySession[sid].entries.push(e);\n    const tsMs = resolveTs(e);\n    if(tsMs!==null){\n      if(!bySession[sid].firstTs || tsMs < bySession[sid].firstTs) bySession[sid].firstTs = tsMs;\n      if(!bySession[sid].lastTs  || tsMs > bySession[sid].lastTs)  bySession[sid].lastTs  = tsMs;\n    }\n\n    // Admin-awarded goodwill/compensation bonuses (and milestone bonuses)\n    // aren't a real answered question — they still show up in the session's\n    // activity list above, and still count toward Growth Points further\n    // down, but shouldn't inflate \"unique questions covered\" or the attempt count.\n    if(e.qtype!==\"goodwill\" && e.qtype!==\"compensation\" && e.qtype!==\"milestone\" && e.qtype!==\"lessonmastery\"){\n      allUnique.add(`${e.lessonId}|${e.qtype}|${e.qIndex}`);\n      grandAttempts++;\n      grandTimeMs += e.timeMs || 0;\n    }\n  });\n\n  // Practice test answers — counted separately for the \"Practice Test\" stat row,\n  // and also folded into unique-questions / attempts / time so the grand total reflects everything.\n  let mockAttempts = 0, mockTimeMs = 0, mockScoreSum = 0, mockScoreCount = 0;\n  const mockUnique = new Set();\n  examSnap.forEach(d=>{\n    const e = d.data();\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = { entries:[], mockEntries:[], firstTs:null, lastTs:null };\n    bySession[sid].mockEntries.push(e);\n    const tsMs = resolveTs(e);\n    if(tsMs!==null){\n      if(!bySession[sid].firstTs || tsMs < bySession[sid].firstTs) bySession[sid].firstTs = tsMs;\n      if(!bySession[sid].lastTs  || tsMs > bySession[sid].lastTs)  bySession[sid].lastTs  = tsMs;\n    }\n\n    const uniqueKey = `mock|${e.lessonId}|${e.qtype}|${e.mockIdx}`;\n    mockUnique.add(uniqueKey);\n    allUnique.add(uniqueKey);\n    mockAttempts++;\n    grandAttempts++;\n    if(typeof e.pct === \"number\"){ mockScoreSum += e.pct; mockScoreCount++; }\n  });\n\n  const mockStats = {\n    attempts: mockAttempts,\n    uniqueCount: mockUnique.size,\n    avgScore: mockScoreCount ? Math.round(mockScoreSum/mockScoreCount) : null\n  };\n\n  // Flat list of every scored entry (study + mock combined) — used by the Growth Score\n  // calculation for mastery-weighting and the improvement trend, independent of how\n  // sessions/practice tests happen to be grouped. Entries with no resolvable timestamp\n  // are skipped entirely here, rather than guessed, since the daily goal and session\n  // goals both depend on knowing exactly which calendar day each entry belongs to.\n  const allScoredEntries = [];\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    const tsMs = resolveTs(e);\n    if(typeof e.pct === \"number\" && tsMs!==null){\n      allScoredEntries.push({ pct:e.pct, qtype:e.qtype, ts: tsMs, subject:e.subject||\"\", lessonId:e.lessonId||\"\", qIndex:e.qIndex, timeMs:e.timeMs||0, clientId:e.clientId, marks:e.marks, peeked:e.peeked });\n    }\n  });\n  examSnap.forEach(d=>{\n    const e = d.data();\n    const tsMs = resolveTs(e);\n    if(typeof e.pct === \"number\" && tsMs!==null){\n      // Practice test answers don't carry a `subject` field directly — fall back\n      // to looking up the lesson, since practice tests can span multiple lessons\n      // that may belong to different subjects.\n      const lesson = findLessonById(e.lessonId);\n      allScoredEntries.push({ pct:e.pct, qtype:e.qtype, ts: tsMs, subject: lesson ? findSubjectForLesson(e.lessonId) : \"\", lessonId:e.lessonId||\"\", qIndex:e.mockIdx, timeMs:e.timeMs||0, clientId:e.clientId });\n    }\n  });\n  allScoredEntries.sort((a,b)=>a.ts-b.ts);\n\n  return { bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries };\n}\n\n// ═══════════════════════════════════════════════════════\n//  GROWTH SCORE — rewards breadth + harder questions + improving, not just being \"good\"\n// ═══════════════════════════════════════════════════════\n//\n// Three components, each 0-100, combined with weights:\n//   1. Coverage (40%)  — % of the ENTIRE syllabus ever attempted at least once.\n//                         Directly rewards trying new material over re-doing known questions.\n//   2. Mastery   (40%)  — accuracy weighted by question difficulty (using the same marks\n//                         weightage already used for exam scoring — Paragraph/Distinguish\n//                         count for more than MCQ). Rewards tackling harder question types well,\n//                         not just racking up easy correct answers.\n//   3. Trend     (20%)  — average score in the most recent half of attempts vs the earlier half.\n//                         Rewards genuinely improving over time, not just staying comfortable.\n//\n// The result is a single 0-100 \"Growth Score\" that a student can't inflate just by\n// repeating questions they already know.\n// ═══════════════════════════════════════════════════════\n//  DAILY GOAL — answer at least one question from each of the 8 question\n//  types, every day. Rewards well-rounded daily practice (a bit of everything)\n//  rather than grinding only the question types that feel easiest.\n// ═══════════════════════════════════════════════════════\n// Minimum score for an answer to count toward the daily goal / streaks. A\n// guess that happens to touch every question type shouldn't satisfy the goal —\n// it should reflect genuine attempts, not just clicking through.\nconst MIN_SCORE_FOR_GOAL_CREDIT = 50;\n\nfunction calcDailyGoal(allScoredEntries){\n  const startOfToday = new Date();\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n\n  // Only require types that actually have questions in the syllabus.\n  // This means students aren't blocked from completing the daily goal just\n  // because e.g. English Grammar has no True/False questions.\n  const activeTypes = getActiveQTypes();\n  const activeCount = activeTypes.length;\n\n  const doneToday = new Set();\n  // Per-subject: which qtypes done today in each subject\n  const subjectNames = Object.keys(DATA);\n  const doneBySubject = {};\n  subjectNames.forEach(s=>{ doneBySubject[s] = new Set(); });\n\n  allScoredEntries.forEach(e=>{\n    if(e.ts >= todayMs && e.qtype && (e.pct??0) >= MIN_SCORE_FOR_GOAL_CREDIT){\n      doneToday.add(e.qtype);\n      const subj = e.subject||'';\n      if(doneBySubject[subj]) doneBySubject[subj].add(e.qtype);\n    }\n  });\n\n  const checklist = activeTypes.map(qt=>({ id:qt.id, label:qt.label, icon:qt.icon, done:doneToday.has(qt.id) }));\n  const doneCount = checklist.filter(c=>c.done).length;\n  const completedToday = doneCount >= activeCount;\n\n  // Per-subject checklist: only types that exist in that subject\n  const subjectChecklists = {};\n  subjectNames.forEach(s=>{\n    const subjTypes = getActiveQTypesForSubject(s);\n    subjectChecklists[s] = subjTypes.map(qt=>({\n      id:qt.id, label:qt.label, icon:qt.icon,\n      done: doneBySubject[s].has(qt.id)\n    }));\n  });\n\n  const byDay = {};\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    const d = new Date(e.ts);\n    d.setHours(0,0,0,0);\n    const key = d.getTime();\n    if(!byDay[key]) byDay[key] = new Set();\n    if(e.qtype) byDay[key].add(e.qtype);\n  });\n  let streak = 0;\n  let cursor = todayMs;\n  if(!completedToday) cursor -= 86400000;\n  // Streak: each past day must have covered all active types\n  while(byDay[cursor] && activeTypes.every(qt=>byDay[cursor].has(qt.id))){\n    streak++;\n    cursor -= 86400000;\n  }\n\n  return { checklist, doneCount, total:activeCount, completedToday, streak, subjectChecklists };\n}\n\n\n// Returns the question types that actually have questions within one specific subject.\n// Used so per-subject session bonuses only require types that subject has content for.\nfunction getActiveQTypesForSubject(subjectName){\n  const subj = DATA[subjectName];\n  if(!subj) return [];\n  const present = new Set();\n  for(const part of Object.values(subj.parts))\n    for(const lesson of part.lessons)\n      for(const qt of QTYPES)\n        if((lesson.questions[qt.id]||[]).length > 0) present.add(qt.id);\n  return QTYPES.filter(qt => present.has(qt.id));\n}\n\n// ═══════════════════════════════════════════════════════\n//  SESSION GOALS — encourages showing up twice a day, with the strongest\n//  nudge reserved for studying early (6-7am specifically). Independent of the\n//  8-type daily goal above: this is about WHEN and HOW OFTEN he studies, not\n//  WHAT he studies.\n//\n//  A \"session\" here just means at least MIN_QUESTIONS_FOR_SESSION questions\n//  answered within that time window — low bar so it's achievable, high enough\n//  that opening and immediately closing the app doesn't count.\n// ═══════════════════════════════════════════════════════\nfunction calcSessionGoals(allScoredEntries){\n  const now = new Date();\n  const startOfToday = new Date(now);\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n\n  const subjectNames = Object.keys(DATA);\n\n  // Track which qtypes were answered per subject per time-bucket today.\n  // A subject session is complete only when ALL active qtypes for that subject\n  // are covered in that bucket — not just a count of questions.\n  // subjQtypes[subj][bucket] = Set of qtype ids answered\n  const subjQtypes = {};\n  subjectNames.forEach(s=>{ subjQtypes[s] = { early:new Set(), late:new Set(), evening:new Set() }; });\n\n  // Also track global early/late/evening any-subject coverage for the morning streak\n  const globalQtypes = { early:new Set(), late:new Set(), evening:new Set() };\n\n  allScoredEntries.forEach(e=>{\n    if(e.ts < todayMs || !e.qtype) return;\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    const hour = new Date(e.ts).getHours();\n    // Morning: 6am (early) or 7am (late)\n    // Evening: 5pm-9pm (17-21)\n    // Anything else (8am-5pm, after 10pm) does NOT count toward session bonuses —\n    // this used to say hour>=8, which incorrectly treated ALL of 8am-11pm as\n    // \"evening,\" so studying right after the morning window (e.g. 9am, 2pm)\n    // was already being credited toward evening completion, well before\n    // evening — which looked exactly like the evening goal wasn't resetting.\n    const bucket = hour===6 ? 'early' : hour===7 ? 'late' : (hour>=17 && hour<=21) ? 'evening' : null;\n    if(!bucket) return;\n    globalQtypes[bucket].add(e.qtype);\n    const subj = e.subject || '';\n    if(subjQtypes[subj]) subjQtypes[subj][bucket].add(e.qtype);\n  });\n\n  // A subject session is done when all of that subject's active types are covered\n  function subjSessionDone(subj, bucket){\n    const required = getActiveQTypesForSubject(subj);\n    if(!required.length) return false;\n    return required.every(qt => subjQtypes[subj][bucket].has(qt.id));\n  }\n\n  // Global morning done = any subject covered all its types in 6-8am\n  // (used only for morning streak — per-subject has its own earlyDone/lateDone)\n  const anyEarlyDone = subjectNames.some(s => subjSessionDone(s, 'early'));\n  const anyLateDone  = subjectNames.some(s => subjSessionDone(s, 'late'));\n  const morningDone  = anyEarlyDone || anyLateDone;\n  const eveningDone  = subjectNames.some(s => subjSessionDone(s, 'evening'));\n  const bothDone     = morningDone && eveningDone;\n\n  // Per-subject status\n  const bySubject = {};\n  subjectNames.forEach(s=>{\n    const sEarly   = subjSessionDone(s, 'early');\n    const sLate    = subjSessionDone(s, 'late');\n    const sMorning = sEarly || sLate;\n    const sEvening = subjSessionDone(s, 'evening');\n    // Progress: how many types done vs required, per bucket\n    const required = getActiveQTypesForSubject(s);\n    const progEarly   = required.filter(qt=>subjQtypes[s].early.has(qt.id)).length;\n    const progLate    = required.filter(qt=>subjQtypes[s].late.has(qt.id)).length;\n    const progEvening = required.filter(qt=>subjQtypes[s].evening.has(qt.id)).length;\n    const progMorning = Math.max(progEarly, progLate);\n    const mornStarted = !sMorning && progMorning > 0;\n    const eveStarted  = !sEvening && progEvening > 0;\n    bySubject[s] = {\n      earlyDone:sEarly, lateDone:sLate, morningDone:sMorning, eveningDone:sEvening, bothDone:sMorning&&sEvening,\n      mornStarted, eveStarted,\n      required: required.length,\n      progMorning, progEvening,\n    };\n  });\n\n  // Morning streak: consecutive days where any subject had a complete morning session\n  const byDayMorning = {};\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT || !e.qtype) return;\n    const hour = new Date(e.ts).getHours();\n    if(hour!==6 && hour!==7) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const key = d.getTime();\n    if(!byDayMorning[key]) byDayMorning[key] = {};\n    const subj = e.subject||'';\n    if(!byDayMorning[key][subj]) byDayMorning[key][subj] = new Set();\n    byDayMorning[key][subj].add(e.qtype);\n  });\n  let morningStreak = 0;\n  let cursor = todayMs;\n  if(!morningDone) cursor -= 86400000;\n  function dayHadMorningSession(dayData){\n    if(!dayData) return false;\n    return subjectNames.some(s=>{\n      const required = getActiveQTypesForSubject(s);\n      return required.length && required.every(qt=>(dayData[s]||new Set()).has(qt.id));\n    });\n  }\n  while(dayHadMorningSession(byDayMorning[cursor])){\n    morningStreak++;\n    cursor -= 86400000;\n  }\n\n  return { morningDone, eveningDone, bothDone, morningStreak, bySubject };\n}\n\n// ═══════════════════════════════════════════════════════\n//  CUMULATIVE TOTALS — unlike \"today's\" goal status above, these never reset.\n//  Every day the daily goal or a session was completed adds permanently to the\n//  Growth Score, the same way Coverage/Mastery do. This is what makes the score\n//  genuinely cumulative: progress earned yesterday stays earned forever, it\n//  doesn't evaporate at midnight just because \"today\" started fresh.\n// ═══════════════════════════════════════════════════════\nfunction calcCumulativeTotals(allScoredEntries){\n  const subjectNames = Object.keys(DATA);\n\n  // byDay[dayKey] = { qtypes:Set }  — for the global daily goal\n  // byDaySubjBucket[dayKey][subj][bucket] = Set of qtype ids\n  const byDay = {};\n  const byDaySubjBucket = {};\n\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT || !e.qtype) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const dayKey = d.getTime();\n    const hour = new Date(e.ts).getHours();\n    // Same bug as the one fixed in calcSessionGoals — this used to say\n    // hour>=8, treating ALL of 8am-11pm as \"evening\" instead of the actual\n    // intended 5pm-9pm window. This copy feeds PERMANENT, never-reset\n    // cumulative totals (+50/+70 points per subject per qualifying day),\n    // so this specific copy of the bug was likely a meaningfully larger\n    // source of inflation than the display-only one — every midday study\n    // session was silently banking a permanent \"evening session complete\"\n    // bonus it was never supposed to earn.\n    const bucket = hour===6 ? 'early' : hour===7 ? 'late' : (hour>=17 && hour<=21) ? 'evening' : null;\n    if(!bucket) {\n      // Still counts for the global daily goal (answered anytime counts for goal)\n      if(!byDay[dayKey]) byDay[dayKey] = { qtypes:new Set() };\n      byDay[dayKey].qtypes.add(e.qtype);\n      return;\n    }\n\n    // Global daily goal tracking\n    if(!byDay[dayKey]) byDay[dayKey] = { qtypes:new Set() };\n    byDay[dayKey].qtypes.add(e.qtype);\n\n    // Per-subject per-bucket qtype tracking\n    const subj = e.subject || '';\n    if(subj){\n      if(!byDaySubjBucket[dayKey]) byDaySubjBucket[dayKey] = {};\n      if(!byDaySubjBucket[dayKey][subj]) byDaySubjBucket[dayKey][subj] = { early:new Set(), late:new Set(), evening:new Set() };\n      byDaySubjBucket[dayKey][subj][bucket].add(e.qtype);\n    }\n  });\n\n  let daysGoalCompleted = 0;\n  const subjectSessions = {};\n  subjectNames.forEach(s=>{ subjectSessions[s] = { earlyMorning:0, lateMorning:0, evening:0, both:0, mornStarted:0, eveStarted:0 }; });\n  const achievements = []; // {key, dayMs, qtype, subject, label, points} — one entry per day/subject/type actually earned, used to sync into real logged Points History events\n\n  // Global daily goal\n  Object.entries(byDay).forEach(([dayKey, day])=>{\n    const activeTypes = getActiveQTypes();\n    if(activeTypes.every(qt=>day.qtypes.has(qt.id))){\n      daysGoalCompleted++;\n      achievements.push({ key:`dailygoal_${dayKey}`, dayMs:Number(dayKey), qtype:\"dailygoal\", subject:\"\", label:\"Daily Goal complete\", points:10 });\n    }\n  });\n\n  // Per-subject session days: a session counts only when all of that\n  // subject's active types were covered in that bucket on that day.\n  // \"started\" = at least 1 type covered but not all.\n  Object.entries(byDaySubjBucket).forEach(([dayKey, subjMap])=>{\n    subjectNames.forEach(subj=>{\n      const buckets = subjMap[subj];\n      if(!buckets) return;\n      const required = getActiveQTypesForSubject(subj);\n      if(!required.length) return;\n      const early = required.every(qt=>buckets.early.has(qt.id));\n      const late  = required.every(qt=>buckets.late.has(qt.id));\n      const eve   = required.every(qt=>buckets.evening.has(qt.id));\n      const earlyStarted   = !early  && buckets.early.size   > 0;\n      const lateStarted    = !late   && buckets.late.size    > 0;\n      const eveStarted     = !eve    && buckets.evening.size > 0;\n      const dayMs = Number(dayKey);\n      if(early){ subjectSessions[subj].earlyMorning++; achievements.push({ key:`session_early_${subj}_${dayKey}`, dayMs, qtype:\"session_early\", subject:subj, label:`Early Morning session — ${subj}`, points:70 }); }\n      else if(late){ subjectSessions[subj].lateMorning++; achievements.push({ key:`session_late_${subj}_${dayKey}`, dayMs, qtype:\"session_late\", subject:subj, label:`Morning session — ${subj}`, points:50 }); }\n      else if(earlyStarted || lateStarted){ subjectSessions[subj].mornStarted++; achievements.push({ key:`session_mornstart_${subj}_${dayKey}`, dayMs, qtype:\"session_mornstart\", subject:subj, label:`Morning session started — ${subj}`, points:10 }); }\n      if(eve){ subjectSessions[subj].evening++; achievements.push({ key:`session_evening_${subj}_${dayKey}`, dayMs, qtype:\"session_evening\", subject:subj, label:`Evening session — ${subj}`, points:50 }); }\n      else if(eveStarted){ subjectSessions[subj].eveStarted++; achievements.push({ key:`session_evestart_${subj}_${dayKey}`, dayMs, qtype:\"session_evestart\", subject:subj, label:`Evening session started — ${subj}`, points:10 }); }\n      if((early||late) && eve){ subjectSessions[subj].both++; achievements.push({ key:`session_both_${subj}_${dayKey}`, dayMs, qtype:\"session_both\", subject:subj, label:`Both sessions — ${subj}`, points:50 }); }\n    });\n  });\n\n  return { daysGoalCompleted, subjectSessions, achievements };\n}\n\n// Fetches every Lesson Test attempt ever logged and sums the points earned —\n// used to fold Test points into the main Growth Points total, since they're\n// stored in their own collection (tagged per-lesson) rather than alongside\n// regular question logs.\nasync function fetchTotalTestPoints(){\n  if(!window._fb || !currentUserPhone) return 0;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  try{\n    const snap = await getDocs(query(collection(db,\"sessions\",currentUserPhone,\"testPoints\"), orderBy(\"ts\",\"asc\")));\n    let total = 0;\n    snap.forEach(d=>{ total += d.data().points || 0; });\n    return total;\n  } catch(err){\n    return 0;\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n//  DAILY TIME BONUS — +100 points for each subject the student spends at\n//  least 30 minutes on today. Counts ALL time (any score), since this is\n//  about genuine time invested studying, not correctness — a separate signal\n//  from the type-coverage session bonus above.\n// ═══════════════════════════════════════════════════════\nconst DAILY_TIME_BONUS_MS = 30 * 60 * 1000; // 30 minutes\nconst DAILY_TIME_BONUS_POINTS = 100;\n\nfunction calcDailyTimeBonus(allScoredEntries){\n  const startOfToday = new Date();\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n\n  const subjectNames = Object.keys(DATA);\n\n  // ── ALL-TIME: count bonus points for every past day where 30+ min was spent ──\n  // Group time by day × subject\n  const timeByDaySubject = {}; // \"YYYY-MM-DD:subject\" -> ms\n  allScoredEntries.forEach(e=>{\n    const subj = e.subject || '';\n    if(!subj) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const key = d.getTime()+\":\"+subj;\n    timeByDaySubject[key] = (timeByDaySubject[key]||0) + (e.timeMs||0);\n  });\n\n  // Count how many day×subject combos crossed 30 min (excluding today — today shown live)\n  let totalHistoricalPoints = 0;\n  const achievements = []; // {key, dayMs, subject, points} — for syncing into real logged Points History events\n  Object.entries(timeByDaySubject).forEach(function(pair){\n    const parts = pair[0].split(\":\");\n    const dayMs = parseInt(parts[0]);\n    const subj = parts[1];\n    const ms    = pair[1];\n    if(dayMs < todayMs && ms >= DAILY_TIME_BONUS_MS){\n      totalHistoricalPoints += DAILY_TIME_BONUS_POINTS;\n      achievements.push({ key:`dailytime_${subj}_${dayMs}`, dayMs, qtype:\"dailytime\", subject:subj, label:`30+ min studied — ${subj}`, points:DAILY_TIME_BONUS_POINTS });\n    }\n  });\n\n  // ── TODAY: show live progress per subject ──\n  const timeToday = {};\n  subjectNames.forEach(s=>{ timeToday[s] = 0; });\n  allScoredEntries.forEach(e=>{\n    if(e.ts < todayMs) return;\n    const subj = e.subject || '';\n    if(timeToday[subj] !== undefined) timeToday[subj] += (e.timeMs || 0);\n  });\n\n  const bySubject = {};\n  let todayPoints = 0;\n  subjectNames.forEach(s=>{\n    const ms = timeToday[s];\n    const done = ms >= DAILY_TIME_BONUS_MS;\n    if(done){\n      todayPoints += DAILY_TIME_BONUS_POINTS;\n      achievements.push({ key:`dailytime_${s}_${todayMs}`, dayMs:todayMs, qtype:\"dailytime\", subject:s, label:`30+ min studied — ${s}`, points:DAILY_TIME_BONUS_POINTS });\n    }\n    bySubject[s] = { ms, done, pct: Math.min(100, Math.round((ms/DAILY_TIME_BONUS_MS)*100)) };\n  });\n\n  return { bySubject, pointsEarned: totalHistoricalPoints + todayPoints, achievements };\n}\n\nfunction calcGrowthScore(allUnique, allScoredEntries, totalTestPoints){\n  const totalAvailable = countTotalAvailableQuestions();\n  const coverage = totalAvailable>0 ? Math.min(100, Math.round((allUnique.size/totalAvailable)*100)) : 0;\n\n  let mastery = 0;\n  if(allScoredEntries.length){\n    let earned=0, possible=0;\n    allScoredEntries.forEach(e=>{\n      if(e.qtype===\"goodwill\" || e.qtype===\"compensation\" || e.qtype===\"milestone\" || e.qtype===\"lessonmastery\") return; // bonuses aren't a measure of academic quality\n      const m = getMarks(e.qtype||\"mcq\");\n      possible += m;\n      earned += m*(e.pct/100);\n    });\n    mastery = possible>0 ? Math.round((earned/possible)*100) : 0;\n  }\n\n  let trend = 50; // neutral default until there's enough data to compare\n  if(allScoredEntries.length >= 6){\n    const mid = Math.floor(allScoredEntries.length/2);\n    const earlier = allScoredEntries.slice(0, mid);\n    const recent  = allScoredEntries.slice(mid);\n    const avg = arr => arr.reduce((a,e)=>a+e.pct,0)/arr.length;\n    const earlierAvg = avg(earlier), recentAvg = avg(recent);\n    // Map the improvement delta onto a 0-100 trend score: no change = 50,\n    // +20 points of improvement or more = 100, -20 or worse = 0.\n    const delta = recentAvg - earlierAvg;\n    trend = Math.max(0, Math.min(100, Math.round(50 + delta*2.5)));\n  }\n\n  // Mastery Score: a capped 0-100 quality measure — \"how good is he right now.\"\n  // A cap makes sense here since it's a percentage-style measure, the same way\n  // a test score caps at 100%.\n  const masteryScore = Math.round(coverage*0.4 + mastery*0.4 + trend*0.2);\n\n  // Growth Points: a completely different kind of number — it never caps and\n  // never goes down. Every genuine answer, every completed daily goal, every\n  // session, every lesson test adds points permanently. This is the number\n  // that should always visibly be climbing, the one that actually motivates\n  // showing up again tomorrow — unlike a 0-100 score that has nowhere left to\n  // go once it's near the ceiling, which is exactly what made finishing the\n  // evening goal feel like it \"did nothing\" once the old score was near 100.\n  const cumulative = calcCumulativeTotals(allScoredEntries);\n  const dailyGoal = calcDailyGoal(allScoredEntries);       // still used for \"today's\" checklist display\n  const sessionGoals = calcSessionGoals(allScoredEntries); // still used for \"today's\" session card display\n\n  let growthPoints = 0;\n  // Tracks WHERE the total actually comes from, category by category — so a\n  // question like \"why is the score 9767\" can be answered directly, by\n  // looking at a real breakdown, instead of re-deriving the whole thing from\n  // scratch or just trusting the single final number.\n  const breakdown = {\n    practice: 0,       // regular question answers (base marks, first-attempt doubling, speed bonus baked into marks)\n    dailyGoal: 0,       // +10 per day every active question type was covered\n    sessionBonuses: 0,  // per-subject morning/evening session completions\n    speedBonusLegacy: 0,// speed bonus for older entries logged before it was baked into marks\n    testPoints: 0,      // Lesson Test / Practice Test scores\n    dailyTime: 0,       // +100 per subject with 30+ min studied today\n    goodwill: 0,\n    compensation: 0,\n    milestones: 0,\n    lessonMastery: 0,\n    newTry: 0,\n    reciteReadMemorise: 0,\n  };\n  // BUG FIX: this used to add getMarks(e.qtype) for every single qualifying\n  // attempt, first time or the 50th, with no distinction. That quietly broke\n  // two things: (1) the \"🆕 New question! 2× points\" toast shown right after\n  // a first-ever correct answer promised double points that never actually\n  // landed in this total, and (2) because repeats were never discounted,\n  // simply re-answering an already-mastered question over and over kept\n  // adding full marks forever — an unintended way to inflate Growth Points\n  // that had nothing to do with the \"harder types are worth more\" protection\n  // the comment below describes. This now mirrors logQuestion's real\n  // behavior: first qualifying attempt at a given question = double marks,\n  // every attempt after that = base marks — so the number shown in the toast\n  // is always the same number that ends up permanently counted.\n  const _seenGrowthKeys = new Set();\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    // Admin-awarded goodwill/one-time compensation bonuses use whatever exact\n    // amount the admin chose at the time (stored directly on the entry as\n    // `marks`) — there's no static per-qtype value for these since the\n    // amount is deliberately chosen per-award, not looked up from a table.\n    if(e.qtype===\"goodwill\"){ growthPoints += (e.marks||0); breakdown.goodwill += (e.marks||0); return; }\n    if(e.qtype===\"compensation\"){ growthPoints += (e.marks||0); breakdown.compensation += (e.marks||0); return; }\n    if(e.qtype===\"milestone\"){ growthPoints += (e.marks||0); breakdown.milestones += (e.marks||0); return; }\n    if(e.qtype===\"lessonmastery\"){ growthPoints += (e.marks||0); breakdown.lessonMastery += (e.marks||0); return; }\n    if(e.qtype===\"newtry\"){ growthPoints += (e.marks||0); breakdown.newTry += (e.marks||0); return; }\n    if((e.qtype||\"\").startsWith(\"recite_\")){ const m=getMarks(e.qtype); growthPoints += m; breakdown.reciteReadMemorise += m; return; }\n    // Achievement records (Daily Goal, session bonuses, daily time bonus) —\n    // these are backfilled purely so Points History has something to show.\n    // The actual points, AND their breakdown contribution, are already\n    // counted once via cumulative/dailyTimeBonus further down this\n    // function — adding to breakdown here too was double-counting these\n    // three categories specifically (confirmed: a 9,981 total with a\n    // breakdown that summed to 12,028 — the exact gap these three\n    // categories being counted twice would produce).\n    if(e.qtype===\"dailygoal\") return;\n    if((e.qtype||\"\").startsWith(\"session_\")) return;\n    if(e.qtype===\"dailytime\") return;\n    const isRealQType = QTYPES.some(q=>q.id===e.qtype);\n    const key = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n    // If this entry stored its own exact point value at the moment it was\n    // earned (base marks, already doubled if it was a first attempt, PLUS\n    // any Speed Bonus — see logQuestion), use that directly. This used to\n    // be recomputed from scratch here instead, which silently dropped the\n    // Speed Bonus every time — the toast said \"+5 Speed Bonus\" but this loop\n    // only ever added the base marks, never that +5, no matter what the\n    // stored entry actually said. Trusting the stored number is what makes\n    // the toast and the permanent total finally guaranteed to agree.\n    if(typeof e.marks === \"number\" && isRealQType){\n      growthPoints += e.marks;\n      breakdown.practice += e.marks;\n      _seenGrowthKeys.add(key);\n      return;\n    }\n    if(!isRealQType){ growthPoints += getMarks(e.qtype); breakdown.practice += getMarks(e.qtype); return; }\n    // Fallback ONLY for entries logged before the `marks` field existed —\n    // recomputes the old way (no Speed Bonus available for these older rows).\n    const base = getMarks(e.qtype);\n    const isFirst = !_seenGrowthKeys.has(key);\n    _seenGrowthKeys.add(key);\n    const amt = isFirst ? base*2 : base;\n    growthPoints += amt;\n    breakdown.practice += amt;\n  });\n  growthPoints += cumulative.daysGoalCompleted * 10;   // full 8-type goal, any day — big, permanent\n  breakdown.dailyGoal += cumulative.daysGoalCompleted * 10;\n  // Per-subject morning/evening sessions — each subject earns its own bonus\n  Object.values(cumulative.subjectSessions||{}).forEach(ss=>{\n    const subtotal = ss.earlyMorning*70 + ss.lateMorning*50 + ss.evening*50 + ss.both*50 + ss.mornStarted*10 + ss.eveStarted*10;\n    growthPoints += subtotal;\n    breakdown.sessionBonuses += subtotal;\n  });\n  // Speed bonus: only recompute for OLDER entries that don't already have it\n  // baked into their stored `marks` value (see the marks-based branch above).\n  // This used to recompute and add speed bonus for EVERY entry regardless,\n  // which double-counted it for any entry that already had it included in\n  // `.marks` — quietly inflating the real total beyond what any single\n  // toast ever promised.\n  let speedBonusTotal = 0;\n  allScoredEntries.forEach(e=>{\n    if(typeof e.marks === \"number\") return; // already included, don't add it again\n    if((e.pct||0) >= MIN_SCORE_FOR_GOAL_CREDIT && e.timeMs){\n      const sb = getSpeedBonus(e.qtype, e.timeMs);\n      if(sb) speedBonusTotal += sb.points;\n    }\n  });\n  growthPoints += speedBonusTotal;\n  breakdown.speedBonusLegacy += speedBonusTotal;\n  growthPoints += totalTestPoints || 0;                // every Lesson Test ever taken — 30/40/50/100 per test based on score tier\n  breakdown.testPoints += totalTestPoints || 0;\n\n  // Daily time bonus: +100 per subject with 30+ minutes spent today\n  const dailyTimeBonus = calcDailyTimeBonus(allScoredEntries);\n  growthPoints += dailyTimeBonus.pointsEarned;\n  breakdown.dailyTime += dailyTimeBonus.pointsEarned;\n\n  growthPoints = Math.round(growthPoints);\n\n  return { masteryScore, coverage, mastery, trend, totalAvailable, dailyGoal, sessionGoals, cumulative, growthPoints, dailyTimeBonus, breakdown };\n}\n\nasync function renderScoreboardTotalHTML(bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries, totalTestPoints){\n  const sessionCount = Object.keys(bySession).length;\n  const raw = calcGrowthScore(allUnique, allScoredEntries||[], totalTestPoints||0);\n  const { masteryScore, coverage, mastery, trend, totalAvailable, dailyGoal, sessionGoals, cumulative, dailyTimeBonus, breakdown } = raw;\n  const growthPoints = await applyGrowthPointsFloor(raw.growthPoints);\n\n  const trendArrow = trend>60?\"↗\":trend<40?\"↘\":\"→\";\n  const trendColor = trend>60?\"#7ee787\":trend<40?\"#ffa07a\":\"rgba(255,255,255,.5)\";\n  const W = \"rgba(255,255,255,\";\n\n  // ── HERO ──\n  var hero = '<div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px\">'\n    +'<div>'\n      +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:'+W+'.5);margin-bottom:3px\">Growth Points<\u002Fdiv>'\n      +'<div style=\"font-size:44px;font-weight:900;color:var(--gold,#d1983f);letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums\">'+growthPoints.toLocaleString()+'<\u002Fdiv>'\n      +'<div style=\"font-size:10px;color:'+W+'.35);margin-top:4px\">never resets · keeps climbing<\u002Fdiv>'\n    +'<\u002Fdiv>'\n    +'<div style=\"text-align:right;padding-bottom:4px\">'\n      +'<div style=\"font-size:11px;color:'+trendColor+';font-weight:700\">'+trendArrow+' '+coverage+'% covered<\u002Fdiv>'\n      +'<div style=\"font-size:10px;color:'+W+'.4);margin-top:3px\">'+allUnique.size+'/'+totalAvailable+' questions tried<\u002Fdiv>'\n    +'<\u002Fdiv>'\n  +'<\u002Fdiv>'\n  // Stats pill row\n  +'<div style=\"display:flex;justify-content:space-between;background:'+W+'.07);border-radius:10px;padding:9px 12px;margin-bottom:16px\">'\n    +[\n      [allUnique.size, 'unique Qs'],\n      [grandAttempts, 'attempts'],\n      [fmtMs(grandTimeMs), 'time'],\n      [sessionCount, 'sessions'],\n    ].map(function(p){ return '<div style=\"text-align:center\"><div style=\"font-size:13px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums\">'+p[0]+'<\u002Fdiv><div style=\"font-size:9px;color:'+W+'.4);margin-top:1px\">'+p[1]+'<\u002Fdiv><\u002Fdiv>'; }).join('')\n  +'<\u002Fdiv>'\n  +'<div style=\"height:1px;background:'+W+'.1);margin:14px 0\"><\u002Fdiv>';\n\n  // ── SESSION TILES + TIME BONUS (merged per subject) ──\n  var sLabel = '<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">⏰ Today\\'s Sessions<\u002Fdiv>';\n  var sRows = Object.entries(sessionGoals.bySubject||{}).map(function(e){\n    var subj=e[0], sg=e[1];\n    var icon=(DATA[subj]&&DATA[subj].icon)||'📚';\n    function dot(done, started, emoji, pts){\n      var bg  = done?W+'.25)':started?'rgba(255,140,0,.2)':W+'.06)';\n      var brd = done?W+'.55)':started?'rgba(255,140,0,.45)':W+'.12)';\n      var ptsDiv = (done||started)?('<div style=\"font-size:8px;font-weight:800;color:'+(done?'#7ee787':'#cf8f2e')+';margin-top:2px\">'+pts+'<\u002Fdiv>'):'';\n      return '<div style=\"width:44px;text-align:center;background:'+bg+';border:1px solid '+brd+';border-radius:9px;padding:6px 4px\">'\n        +'<div style=\"font-size:17px\">'+emoji+'<\u002Fdiv>'+ptsDiv+'<\u002Fdiv>';\n    }\n    var mPts=sg.morningDone?(sg.earlyDone?'+70':'+50'):'+10';\n    var ePts=sg.eveningDone?'+50':'+10';\n    // 30-min time bonus for this subject\n    var tb = (dailyTimeBonus.bySubject||{})[subj] || {ms:0, done:false, pct:0};\n    var mins = Math.floor(tb.ms/60000);\n    var timeBarCol = tb.done?'#7ee787':tb.pct>0?'#cf8f2e':W+'.15)';\n    var timeLabel = tb.done?'✅ +100':mins+'/30m';\n    var timeLabelCol = tb.done?'#7ee787':W+'.45)';\n    return '<div style=\"margin-bottom:10px\">'\n      +'<div style=\"display:flex;align-items:center;gap:10px\">'\n        +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n        +'<div style=\"display:flex;gap:6px\">'+dot(sg.morningDone,sg.mornStarted,'🌅',mPts)+dot(sg.eveningDone,sg.eveStarted,'🌙',ePts)+'<\u002Fdiv>'\n        +(sg.bothDone?'<div style=\"font-size:10px;color:#7ee787;font-weight:700\">+50 🎉<\u002Fdiv>':'')\n      +'<\u002Fdiv>'\n      // Time bar below the dots\n      +'<div style=\"display:flex;align-items:center;gap:6px;margin:4px 0 0 86px\">'\n        +'<div style=\"flex:1;height:4px;background:'+W+'.1);border-radius:2px;overflow:hidden\">'\n          +'<div style=\"height:100%;width:'+tb.pct+'%;background:'+timeBarCol+';border-radius:2px\"><\u002Fdiv>'\n        +'<\u002Fdiv>'\n        +'<div style=\"font-size:9px;font-weight:700;color:'+timeLabelCol+';min-width:42px;text-align:right\">'+timeLabel+'<\u002Fdiv>'\n      +'<\u002Fdiv>'\n    +'<\u002Fdiv>';\n  }).join('');\n  var streakLine = sessionGoals.morningStreak>0?'<div style=\"font-size:11px;color:var(--gold);font-weight:700;margin-top:2px;margin-bottom:4px\">🔥 '+sessionGoals.morningStreak+' day morning streak<\u002Fdiv>':'';\n  var tLabel = '', tBars = '', tFooter = '';\n\n  // ── DAILY GOAL bars (tap to expand types) ──\n  var gLabel = '<div style=\"height:1px;background:'+W+'.1);margin:14px 0\"><\u002Fdiv>'\n    +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">📋 Daily Goal — tap to see types<\u002Fdiv>';\n  var gBars = Object.entries(dailyGoal.subjectChecklists||{}).map(function(e){\n    var subj=e[0], list=e[1];\n    if(!list.length) return '';\n    var icon=(DATA[subj]&&DATA[subj].icon)||'📚';\n    var done=list.filter(function(c){return c.done;}).length;\n    var total=list.length;\n    var pct=Math.round(done/total*100);\n    var allDone=done===total;\n    var barCol=allDone?'#7ee787':done>0?'#cf8f2e':W+'.15)';\n    var chips=list.map(function(c){\n      var bg=c.done?W+'.18)':W+'.06)';\n      var brd=c.done?'rgba(126,231,135,.4)':W+'.1)';\n      var txt=c.done?'text-decoration:line-through;opacity:.5':'color:'+W+'.85)';\n      return '<div style=\"display:inline-flex;align-items:center;gap:3px;background:'+bg+';border:1px solid '+brd+';border-radius:5px;padding:3px 7px;margin:2px\">'\n        +'<span style=\"font-size:10px\">'+(c.done?'✅':c.icon)+'<\u002Fspan>'\n        +'<span style=\"font-size:9px;'+txt+'\">'+c.label+'<\u002Fspan>'\n        +'<\u002Fdiv>';\n    }).join('');\n    return '<details style=\"margin-bottom:8px\">'\n      +'<summary style=\"list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none\">'\n        +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n        +'<div style=\"flex:1;height:7px;background:'+W+'.1);border-radius:4px;overflow:hidden\">'\n          +'<div style=\"height:100%;width:'+pct+'%;background:'+barCol+';border-radius:4px\"><\u002Fdiv>'\n        +'<\u002Fdiv>'\n        +'<div style=\"font-size:10px;font-weight:700;min-width:30px;text-align:right;color:'+(allDone?'#7ee787':W+'.45)')+'\">'+done+'/'+total+'<\u002Fdiv>'\n      +'<\u002Fsummary>'\n      +'<div style=\"padding:8px 0 2px;display:flex;flex-wrap:wrap;gap:2px\">'+chips+'<\u002Fdiv>'\n      +'<\u002Fdetails>';\n  }).join('');\n  var gFooter=dailyGoal.completedToday?'<div style=\"font-size:11px;color:#7ee787;font-weight:700;margin-top:4px\">🎉 Goal complete!'+(dailyGoal.streak>1?' · 🔥 '+dailyGoal.streak+' day streak':'')+'<\u002Fdiv>':dailyGoal.streak>0?'<div style=\"font-size:11px;color:var(--gold);font-weight:700;margin-top:4px\">🔥 '+dailyGoal.streak+' day streak<\u002Fdiv>':'';\n\n  var bySubj=\"\"; // removed\n\n  // ── HOW TO EARN (collapsed) ──\n  function earnRow(ic,t,d){ return '<div style=\"border-bottom:1px solid '+W+'.08);padding:9px 0\"><div style=\"font-size:11px;font-weight:700;color:#fff\">'+ic+' '+t+'<\u002Fdiv><div style=\"font-size:10px;color:'+W+'.55);margin-top:2px;line-height:1.5\">'+d+'<\u002Fdiv><\u002Fdiv>'; }\n  var howToEarn='<div style=\"height:1px;background:'+W+'.1);margin:14px 0\"><\u002Fdiv>'\n    +'<details><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;user-select:none;padding:2px 0\">'\n      +'<span style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5)\">💡 How do I earn points?<\u002Fspan>'\n      +'<span style=\"font-size:10px;color:'+W+'.35)\">tap to expand<\u002Fspan>'\n    +'<\u002Fsummary>'\n    +'<div style=\"margin-top:10px\">'\n      +earnRow('✏️','Each question (50%+)','+1 MCQ/Fill/TF · +2 Brief/Reasons · +3 Distinguish · +5 Match/Para')\n      +earnRow('🆕','New Question Bonus — 2× points','First time answering a question earns double points!')\n      +earnRow('📝','All Brief Bonus — +100','Score 80%+ on ALL Answer in Brief questions in one session')\n      +earnRow('📄','All Detail Bonus — +200','Score 80%+ on ALL Paragraph/Distinguish questions in one session')\n      +earnRow('⚡','Speed Bonus','+5 fast rationMs)}<\u002Fdiv>\n        <div style=\"display:flex;gap:18px;margin-top:8px;font-size:12px;flex-wrap:wrap\">\n          <div><b>${uniqueInSession.size}<\u002Fb> unique<\u002Fdiv>\n          <div><b>${attemptsInSession}<\u002Fb> attempts<\u002Fdiv>\n          <div><b>${fmtMs(timeInSession)}<\u002Fb> spent<\u002Fdiv>\n          ${mockInSession ? `<div>🎯 <b>${mockInSession}<\u002Fb> mock answers<\u002Fdiv>` : \"\"}\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n}\nfunction downloadReport(){\n  if(!sessionLog.length){ alert(\"No activity to download yet.\"); return; }\n\n  const now = new Date();\n  const dateStr = now.toLocaleDateString(\"en-IN\",{day:\"2-digit\",month:\"short\",year:\"numeric\"});\n  const timeStr = now.toLocaleTimeString(\"en-IN\",{hour:\"2-digit\",minute:\"2-digit\"});\n  const totalQ = sessionLog.length;\n  const uniqueQ = countUniqueQuestions(sessionLog);\n  const avgPct = Math.round(sessionLog.reduce((a,e)=>a+e.pct,0)/totalQ);\n  const totalMs = sessionLog.reduce((a,e)=>a+e.timeMs,0);\n\n  const qtLabels={mcq:\"Choose Correct\",fill:\"Fill in the Blanks\",match:\"Match the Following\",\n    brief:\"Answer in Brief\",truefalse:\"True or False\",reasons:\"Give Reasons\",\n    distinguish:\"Distinguish Between\",paragraph:\"Answer in Paragraph/Detail\"};\n\n  // Group same as report\n  const grouped={};\n  sessionLog.forEach(e=>{\n    const sk=e.subject||\"General\";\n    const lk=e.lessonId+\"|\"+e.lessonTitle;\n    if(!grouped[sk]) grouped[sk]={};\n    if(!grouped[sk][lk]) grouped[sk][lk]={};\n    const qtk=e.qtype;\n    if(!grouped[sk][lk][qtk]) grouped[sk][lk][qtk]={pcts:[],times:[]};\n    grouped[sk][lk][qtk].pcts.push(e.pct);\n    grouped[sk][lk][qtk].times.push(e.timeMs);\n  });\n\n  let html = `<!DOCTYPE html><html><head><meta charset=\"utf-8\">\n<title>Study Buddy — Session Report ${dateStr}<\u002Ftitle>\n<style>\n  body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:0 20px;color:#202a3d;line-height:1. le]=lk.split(\"|\");\n      Object.entries(qtypes).forEach(([qt,data])=>{\n        const avg=Math.round(data.pcts.reduce((a,b)=>a+b,0)/data.pcts.length);\n        const avgT=Math.round(data.times.reduce((a,b)=>a+b,0)/data.times.length);\n        const cls=avg>=80?\"pct-good\":avg>=50?\"pct-mid\":\"pct-poor\";\n        const barColor=avg>=80?\"#4a9873\":avg>=50?\"#d1983f\":\"#d15f5a\";\n        html+=`<tr><td>${title||\"—\"}<\u002Ftd><td>${qtLabels[qt]||qt}<\u002Ftd><td style=\"text-align:center\">${data.pcts.length}<\u002Ftd>\n          <td><span class=\"${cls}\">${avg}%<\u002Fspan><span class=\"bar\" style=\"width:${avg*0.5}px;background:${barColor}\"><\u002Fspan><\u002Ftd>\n          <td>⏱ ${fmtMs(avgT)}<\u002Ftd><\u002Ftr>`;\n      });\n    });\n    html+=`<\u002Ftable>`;\n  });\n\n  // Spelling errors section\n  if(sessionSpellErrors.length){\n    const spellRows = sessionSpellErrors.map(e=>`\n      <tr><td><span style=\"text-decoration:line-through;color:#d15f5a\">${e.wrong}<\u002Fspan><\u002Ftd>\n          <td style=\"color:#4a9873;font-weight:700\">→ ${e.correct}<\u002Ftd>\n          <td>${e.lessonTitle||\"—\"}<\u002Ftd><\u002Ftr>`).join(\"\");\n    html += `<h2>✏️ Spelling to Learn (${sessionSpellErrors.length})<\u002Fh2>\n      <table><tr><th>You wrote<\u002Fth><th>Correct spelling<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>${spellRows}<\u002Ftable>`;\n  }\n  // Concepts that needed a hint this session\n  if(hintConceptsNeeded.length){\n    const conceptRows = hintConceptsNeeded.map(c=>`\n      <tr><td>${c.questionText||\"\"}<\u002Ftd><td>${c.qtype||\"\"}<\u002Ftd><td>${c.lessonTitle||\"—\"}<\u002Ftd><\u002Ftr>`).join(\"\");\n    html += `<h2>🤔 Concepts to Revisit (${hintConceptsNeeded.length})<\u002Fh2>\n      <table><tr><th>Question<\u002Fth><th>Type<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>${conceptRows}<\u002Ftable>`;\n  }\n\n  html+=`<p style=\"font-size:11px;color:#999;margin-top:32px;text-align:center\">Generated by Study Buddy · joshistudies.in<\u002Fp><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url  = URL.createObjectURL(blob);\n  const a    = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_Report_${dateStr.replace(/ /g,\"_\")}.html`;\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  setTimeout(()=>URL.revokeObjectURL(url), 1000);\n}\n\nfunction closeReport(){\n  document.getElementById(\"reportPanel\").classList.remove(\"visible\");\n}\nfunction renderReport(){\n  const body=document.getElementById(\"reportBody\");\n  if(!sessionLog.length){\n    body.innerHTML=`<div class=\"report-empty\">No activity yet this session.<br>Start studying to see your stats here!<\u002Fdiv>`;\n    document.getElementById(\"reportSubtitle\").textContent=\"Topics studied this session\";\n    return;\n  }\n\n  // Group by subject → part → lesson → qtype\n  const grouped={};\n  sessionLog.forEach(e=>{\n    const sk=e.subject||\"General\";\n    const pk=e.part||\"—\";\n    const lk=e.lessonId+\"|\"+e.lessonTitle;\n    const qtk=e.qtype;\n    if(!grouped[sk]) grouped[sk]={};\n    if(!grouped[sk][pk]) grouped[sk][pk]={};\n    if(!grouped[sk][pk][lk]) grouped[sk][pk][lk]={};\n    if(!grouped[sk][pk][lk][qtk]) grouped[sk][pk][lk][qtk]={pcts:[],times:[]};\n    grouped[sk][pk][lk][qtk].pcts.push(e.pct);\n    grouped[sk][pk][lk][qtk].times.push(e.timeMs);\n  });\n\n  const totalQ=sessionLog.length;\n  const uniqueQ=countUniqueQuestions(sessionLog);\n  const avgPct=Math.round(sessionLog.reduce((a,e)=>a+e.pct,0)/totalQ); // simple avg for report overview\n  document.getElementById(\"reportSubtitle\").textContent=\n    `${uniqueQ} unique question${uniqueQ!==1?\"s\":\"\"} learnt (${totalQ} attempt${totalQ!==1?\"s\":\"\"} total) · avg ${avgPct}% this session`;\n\n  const qtLabels={mcq:\"MCQ\",fill:\"Fill\",match:\"Match\",brief:\"Brief\",truefalse:\"T/F\",reasons:\"Reasons\",distinguish:\"Distinguish\",paragraph:\"Paragraph\"};\n  const barColor=p=>p>=80?\"var(--green)\":p>=50?\"var(--gold)\":\"var(--red)\";\n\n  let html=\"\";\n  Object.entries(grouped).forEach(([subj,parts])=>{\n    html+=`<div class=\"report-subject\"><div class=\"report-subject-name\">${subj}<\u002Fdiv>`;\n    Object.entries(parts).forEach(([part,lessons])=>{\n      if(part&&part!==\"—\") html+=`<div style=\"font-size:11px;color:var(--muted);font-weight:600;margin:8px 0 4px;padding-left:4px\">${part}<\u002Fdiv>`;\n      Object.entries(lessons).forEach(([lk, qtypes])=>{\n        const [,lessonTitle]=lk.split(\"|\");\n        Object.entries(qtypes).forEach(([qt,data])=>{\n          const marks=getMarks(qt); const avg=Math.round(data.pcts.reduce((a,b)=>a+b,0)/data.pcts.length);\n          const avgTime=Math.round(data.times.reduce((a,b)=>a+b,0)/data.times.length);\n          const n=data.pcts.length;\n          html+=`<div class=\"report-row\">\n            <div style=\"flex:1;min-width:0\">\n              <div class=\"report-lesson\">${lessonTitle||\"—\"}<\u002Fdiv>\n              <div class=\"report-qtype\">${qtLabels[qt]||qt} · ${n} q${n!==1?\"s\":\"\"}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"report-bar-wrap\"><div class=\"report-bar\" style=\"width:${avg}%;background:${barColor(avg)}\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"report-pct\" style=\"color:${barColor(avg)}\">${avg}%<\u002Fdiv>\n            <div class=\"report-time\">⏱${fmtMs(avgTime)}<\u002Fdiv>\n          <\u002Fdiv>`;\n        });\n      });\n    });\n    html+=\"<\u002Fdiv>\";\n  });\n  // Spelling errors section\n  if(sessionSpellErrors.length){\n    const spellRows = sessionSpellErrors.map(e=>`\n      <div class=\"report-row\">\n        <div style=\"flex:1\"><span class=\"spell-wrong\">${e.wrong}<\u002Fspan><span class=\"spell-right\">→ ${e.correct}<\u002Fspan><\u002Fdiv>\n        <div class=\"report-qtype\">${e.lessonTitle}<\u002Fdiv>\n      <\u002Fdiv>`).join(\"\");\n    html += `<div class=\"report-subject\">\n      <div class=\"report-subject-name\">✏️ Spelling to Learn (${sessionSpellErrors.length})<\u002Fdiv>\n      ${spellRows}\n    <\u002Fdiv>`;\n  }\n  // Concepts that needed a hint this session — surfaces struggling areas instead\n  // of letting them disappear once the question is answered.\n  if(hintConceptsNeeded.length){\n    const conceptRows = hintConceptsNeeded.map(c=>`\n      <div class=\"report-row\">\n        <div style=\"flex:1\">${(c.questionText||\"\").slice(0,80)}<\u002Fdiv>\n        <div class=\"report-qtype\">${c.lessonTitle}<\u002Fdiv>\n      <\u002Fdiv>`).join(\"\");\n    html += `<div class=\"report-subject\">\n      <div class=\"report-subject-name\">🤔 Concepts to Revisit (${hintConceptsNeeded.length})<\u002Fdiv>\n      ${conceptRows}\n    <\u002Fdiv>`;\n  }\n\n  body.innerHTML=html;\n}\n\nfunction closeQuiz(){\n  stopTimer();\n  document.getElementById(\"quizOverlay\").classList.remove(\"visible\");\n  fbLiveState({ mode:\"browsing\", lessonTitle:\"\" });\n  renderSidebar(); renderLessons(); // lesson cards now reflect live mastery updates\n}\nfunction setNav(el){\n  document.querySelectorAll(\".nav-item\").forEach(n=>n.classList.remove(\"active\"));\n  el.classList.add(\"active\");\n}\n\nfunction scrollToLessons(){\n  // On mobile, scroll the lesson grid into view smoothly\n  const el=document.getElementById(\"lessonGrid\");\n  if(el) el.scrollIntoView({behavior:\"smooth\", block:\"start\"});\n}\n\n// ═══════════════════════════════════════════════════════\n//  PASSCODE GATE\n// ═══════════════════════════════════════════════════════\nlet currentUserPhone = null;\nlet isAdminUser = false;\n\nfunction checkPasscode(){\n  const val = document.getElementById(\"passcodeInput\").value.trim();\n  if(val === STUDENT_PHONE || val === ADMIN_PHONE){\n    currentUserPhone = (val === ADMIN_PHONE) ? STUDENT_PHONE : STUDENT_PHONE; // admin always mirrors the student's data path\n    isAdminUser = (val === ADMIN_PHONE);\n    const ws = document.getElementById(\"welcomeScreen\");\n    ws.classList.add(\"fade-out\");\n    setTimeout(()=>ws.classList.add(\"gone\"), 420);\n    loadCompleteLessons(); loadMasteryKeys(); // load for both admin and student\n    if(isAdminUser) showAdminBar();\n    else{ startGoodwillListener(); setTimeout(()=>showWelcomeBackPopup(), 550); } // let the welcome screen fade out first\n  } else {\n    const inp = document.getElementById(\"passcodeInput\");\n    const err = document.getElementById(\"wlError\");\n    err.textContent = \"Incorrect passcode. Please try again.\";\n    inp.classList.add(\"error\");\n    inp.value = \"\";\n    setTimeout(()=>inp.classList.remove(\"error\"), 400);\n    inp.focus();\n  }\n}\n\n// Shown once right after the student logs in — a quick, motivating snapshot of\n// their Growth Score and today's goal, so progress is the first thing they see\n// rather than something they have to go dig for.\nasync function showWelcomeBackPopup(){\n  if(!window._fb || !currentUserPhone) return;\n\n  let overlay = document.getElementById(\"welcomeBackPopup\");\n  if(!overlay){\n    overlay = document.createElement(\"div\");\n    overlay.id = \"welcomeBackPopup\";\n    overlay.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px\";\n    document.body.appendChild(overlay);\n  }\n  overlay.innerHTML = `<div style=\"background:#fff;border-radius:18px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25)\">\n    <div style=\"font-size:32px;margin-bottom:8px\">👋<\u002Fdiv>\n    <div style=\"font-size:13px;color:var(--muted)\">Loading your progress…<\u002Fdiv>\n  <\u002Fdiv>`;\n\n  let logsSnap, examSnap, totalTestPoints;\n  try{\n    ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  } catch(err){\n    overlay.remove();\n    return;\n  }\n\n  if(logsSnap.empty && examSnap.empty){\n    // First-ever session — a simple welcome instead of stats that don't exist yet.\n    overlay.innerHTML = `<div style=\"background:#fff;border-radius:18px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25)\">\n      <div style=\"font-size:40px;margin-bottom:10px\">🚀<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px\">Welcome, ${STUDENT_NAME}!<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--muted);margin-bottom:18px\">Let's get started — try one question from each topic type today to hit your first daily goal.<\u002Fdiv>\n      <button onclick=\"document.getElementById('welcomeBackPopup').remove()\" style=\"width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Let's go! →<\u002Fbutton>\n    <\u002Fdiv>`;\n    return;\n  }\n\n  const { allUnique, allScoredEntries } = aggregateScoreboardData(logsSnap, examSnap);\n  const rawScore = calcGrowthScore(allUnique, allScoredEntries, totalTestPoints);\n  const { masteryScore, dailyGoal, sessionGoals } = rawScore;\n  const growthPoints = await applyGrowthPointsFloor(rawScore.growthPoints);\n  celebrateDailyGoalIfJustCompleted(allUnique, allScoredEntries, totalTestPoints);\n\n  var W = \"rgba(255,255,255,\";\n  var gold = \"var(--gold,#d1983f)\";\n\n  // Session dot tiles — same pattern as scoreboard\n  function pDot(done, started, emoji, pts){\n    var bg  = done?W+\".25)\":started?\"rgba(255,140,0,.2)\":W+\".06)\";\n    var brd = done?W+\".55)\":started?\"rgba(255,140,0,.45)\":W+\".12)\";\n    var ptsDiv = (done||started)?('<div style=\"font-size:8px;font-weight:800;color:'+(done?'#7ee787':'#cf8f2e')+';margin-top:2px\">'+pts+'<\u002Fdiv>'):'';\n    return '<div style=\"width:44px;text-align:center;background:'+bg+';border:1px solid '+brd+';border-radius:9px;padding:6px 4px\">'\n      +'<div style=\"font-size:17px\">'+emoji+'<\u002Fdiv>'+ptsDiv+'<\u002Fdiv>';\n  }\n\n  var sessionRows = Object.entries(sessionGoals.bySubject||{}).map(function(e){\n    var subj=e[0], sg=e[1];\n    var icon=(DATA[subj]&&DATA[subj].icon)||\"📚\";\n    var mPts=sg.morningDone?(sg.earlyDone?\"+70\":\"+50\"):\"+10\";\n    var ePts=sg.eveningDone?\"+50\":\"+10\";\n    return '<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">'\n      +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n      +'<div style=\"display:flex;gap:6px\">'+pDot(sg.morningDone,sg.mornStarted,'🌅',mPts)+pDot(sg.eveningDone,sg.eveStarted,'🌙',ePts)+'<\u002Fdiv>'\n      +(sg.bothDone?'<div style=\"font-size:10px;color:#7ee787;font-weight:700\">+50 🎉<\u002Fdiv>':'')\n    +'<\u002Fdiv>';\n  }).join('');\n\n  // Goal bars — same as scoreboard\n  var goalBars = Object.entries(dailyGoal.subjectChecklists||{}).map(function(e){\n    var subj=e[0], list=e[1];\n    if(!list.length) return '';\n    var icon=(DATA[subj]&&DATA[subj].icon)||\"📚\";\n    var done=list.filter(function(c){return c.done;}).length;\n    var total=list.length;\n    var pct=Math.round(done/total*100);\n    var allDone=done===total;\n    var barCol=allDone?\"#7ee787\":done>0?\"#cf8f2e\":W+\".15)\";\n    return '<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:7px\">'\n      +'<div style=\"font-size:11px;font-weight:600;color:'+W+'.85);width:76px;flex-shrink:0\">'+icon+' '+subj.split(' ')[0]+'<\u002Fdiv>'\n      +'<div style=\"flex:1;height:7px;background:'+W+'.1);border-radius:4px;overflow:hidden\">'\n        +'<div style=\"height:100%;width:'+pct+'%;background:'+barCol+';border-radius:4px\"><\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<div style=\"font-size:10px;font-weight:700;min-width:28px;text-align:right;color:'+(allDone?'#7ee787':W+'.45)')+'\">'+done+'/'+total+'<\u002Fdiv>'\n    +'<\u002Fdiv>';\n  }).join('');\n\n  // Morning nudge (6–8am only)\n  var currentHour = new Date().getHours();\n  var nudge = (currentHour===6||currentHour===7)&&!sessionGoals.morningDone\n    ? '<div style=\"background:rgba(209,152,63,.18);border:1px solid rgba(209,152,63,.4);border-radius:10px;padding:10px;margin-bottom:14px\">'\n        +'<div style=\"font-size:12px;font-weight:700;color:'+gold+'\">'+(currentHour===6?\"🌅 You're up early — nice!\":\"🌤️ Still counts as morning!\")+'<\u002Fdiv>'\n        +'<div style=\"font-size:11px;color:rgba(209,152,63,.9);margin-top:3px\">Cover all types in any subject before 8am to earn the morning bonus.<\u002Fdiv>'\n      +'<\u002Fdiv>' : '';\n\n  var streakLine = sessionGoals.morningStreak>0\n    ?'<div style=\"font-size:11px;color:'+gold+';font-weight:700;margin-top:2px;margin-bottom:8px\">🔥 '+sessionGoals.morningStreak+' day morning streak<\u002Fdiv>':'' ;\n\n  var goalFooter = dailyGoal.completedToday\n    ?'<div style=\"font-size:11px;color:#7ee787;font-weight:700;margin-top:6px\">🎉 Goal complete!'+(dailyGoal.streak>1?' · 🔥 '+dailyGoal.streak+' day streak':'')+'<\u002Fdiv>'\n    :dailyGoal.streak>0?'<div style=\"font-size:11px;color:'+gold+';font-weight:700;margin-top:4px\">🔥 '+dailyGoal.streak+' day streak<\u002Fdiv>':'';\n\n  var divider = '<div style=\"height:1px;background:'+W+'.12);margin:12px 0\"><\u002Fdiv>';\n  var lbl = function(t){ return '<div style=\"font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:'+W+'.5);margin-bottom:10px\">'+t+'<\u002Fdiv>'; };\n\n  overlay.innerHTML = '<div style=\"background:var(--navy,#202a3d);border-radius:20px;padding:22px 20px 20px;max-width:340px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.4);color:#fff\">'\n    // Hero\n    +'<div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px\">'\n      +'<div>'\n        +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:'+W+'.5);margin-bottom:3px\">Growth Points<\u002Fdiv>'\n        +'<div style=\"font-size:42px;font-weight:900;color:'+gold+';letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums\">'+growthPoints.toLocaleString()+'<\u002Fdiv>'\n      +'<\u002Fdiv>'\n    +'<\u002Fdiv>'\n    +divider\n    +nudge\n    +lbl(\"⏰ Today's Sessions\")\n    +sessionRows\n    +streakLine\n    +divider\n    +lbl('📋 Daily Goal')\n    +goalBars\n    +goalFooter\n    +'<button onclick=\"document.getElementById(\\'welcomeBackPopup\\').remove()\" style=\"width:100%;margin-top:18px;padding:12px;background:'+W+'.12);color:#fff;border:1px solid '+W+'.25);border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Start studying →<\u002Fbutton>'\n  +'<\u002Fdiv>';\n}\n\n// Write one log entry to Firestore under the student's phone number,\n// regardless of whether the student or admin is the one currently driving the session.\nfunction fbLogEntry(kind, data){\n  if(!window._fb || !currentUserPhone) return Promise.resolve();\n  const { db, addDoc, collection, serverTimestamp } = window._fb;\n  if(kind===\"logs\" || kind===\"testPoints\") invalidateLogsBundleCache();\n  // Returns the write promise now (previously fire-and-forget) — most call\n  // sites still don't await it, which is fine, but anything that logs and\n  // then immediately re-reads (like the retroactive sweeps) NEEDS to be\n  // able to wait for the write to actually land first, or it can re-fetch\n  // before Firestore has committed the new entry — showing up later in\n  // Points History but not in the Growth Points total computed right then.\n  return addDoc(collection(db, \"sessions\", currentUserPhone, kind), {\n    ...data,\n    sessionId: currentSessionId,\n    ts: serverTimestamp(),\n    loggedBy: isAdminUser ? \"admin\" : \"student\"\n  }).catch(err => console.warn(\"Firestore write failed:\", err));\n}\n\n// Same as fbLogEntry, but with an explicit historical timestamp instead of\n// \"now\" — used only for backfilling achievement records (Daily Goal,\n// session bonuses, daily time bonus) under the date they were ACTUALLY\n// earned, so Points History shows them on the right day rather than all\n// bunched up as if freshly earned the moment this feature was deployed.\nasync function fbLogEntryWithTs(kind, data, tsMillis){\n  if(!window._fb || !currentUserPhone) return;\n  const { db, addDoc, collection } = window._fb;\n  if(kind===\"logs\" || kind===\"testPoints\") invalidateLogsBundleCache();\n  try{\n    await addDoc(collection(db, \"sessions\", currentUserPhone, kind), {\n      ...data,\n      sessionId: currentSessionId,\n      ts: new Date(tsMillis),\n      loggedBy: isAdminUser ? \"admin\" : \"student\"\n    });\n  }catch(err){ console.warn(\"Firestore write failed:\", err); }\n}\n\n// ═══════════════════════════════════════════════════════\n//  POINT ACHIEVEMENT SYNC — Daily Goal / Session Bonuses / Daily Time\n//  Bonus were always correctly counted in the Growth Points total, but\n//  ONLY as recalculated aggregates — never as discrete logged events. That\n//  meant Points History had nothing to show for them, the exact same gap\n//  Lesson Mastery had. This logs each one exactly once, under the actual\n//  date it was earned (not \"now\"), so the full picture finally shows up.\nlet _pointAchievementsLoggedCache = null;\n\nasync function loadPointAchievementsLogged(){\n  if(_pointAchievementsLoggedCache) return _pointAchievementsLoggedCache;\n  if(!window._fb || !currentUserPhone){ _pointAchievementsLoggedCache = {}; return _pointAchievementsLoggedCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"pointAchievementsLogged\"));\n    _pointAchievementsLoggedCache = snap.exists() ? snap.data() : {};\n  }catch(e){ _pointAchievementsLoggedCache = {}; }\n  return _pointAchievementsLoggedCache;\n}\n\nasync function syncPointAchievementsToHistory(allScoredEntries){\n  if(!window._fb || !currentUserPhone) return;\n  const logged = await loadPointAchievementsLogged();\n  const cumulative = calcCumulativeTotals(allScor
