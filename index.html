n value=\"custom\">Write my own\u2026<\u002Foption>\n        <\u002Fselect>\n        <textarea id=\"goodwillReasonCustom\" placeholder=\"Or type a custom message\u2026\" style=\"width:100%;min-height:50px;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:12px;font-family:inherit\"><\u002Ftextarea>\n        <button onclick=\"submitGoodwillAward()\" style=\"width:100%;padding:12px;background:#202a3d;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">\ud83c\udf81 Give Goodwill Points<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  document.body.appendChild(panel);\n  panel.classList.add(\"visible\");\n\n  const styleTag = document.createElement(\"style\");\n  styleTag.textContent = `.admin-tab-btn{padding:8px 16px;border:1.5px solid #ddd;border-radius:8px;background:#fff;font-weight:700;font-size:13px;cursor:pointer}\n    .admin-tab-btn.active{background:#202a3d;color:#fff;border-color:#202a3d}`;\n  panel.appendChild(styleTag);\n\n  // Live listener \u2014 what the student is doing RIGHT NOW\n  onSnapshot(doc(db, \"sessions\", currentUserPhone, \"live\", \"current\"), snap => {\n    const box = document.getElementById(\"adminLiveNowBody\");\n    if(!box) return;\n    if(!snap.exists()){ box.innerHTML = \"<p style='opacity:.7;margin:0'>Waiting for activity\u2026<\u002Fp>\"; return; }\n    const s = snap.data();\n    const modeLabel = s.mode===\"mock\" ? \"\ud83d\udcdd Practice Test\"\n      : s.mode===\"revise\" ? \"\ud83d\udcd6 Revise Mode\"\n      : s.mode===\"browsing\" ? \"\ud83c\udfe0 Browsing lessons\"\n      : \"\u270f\ufe0f Practice Mode\";\n\n    // Build an options list that looks like the real .mcq-option cards when we can tell\n    // the student's answer apart from the correct one (MCQ / True-False style answers).\n    let answerBlockHTML = \"\";\n    if(s.currentAnswer || s.typing){\n      const cls = s.answered ? (s.isCorrect ? \"correct\" : \"wrong\") : \"selected\";\n      answerBlockHTML = `\n        <div class=\"mcq-option ${cls}\" style=\"margin-bottom:8px;cursor:default\">\n          <span class=\"mcq-opt-letter\" style=\"width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0\">${STUDENT_NAME[0]}<\u002Fspan>\n          <span style=\"white-space:pre-wrap;word-break:break-word\">${s.typing?\"\u270d\ufe0f \":\"\"}${s.currentAnswer||\"\"}${s.typing?\" \u2026\":\"\"}<\u002Fspan>\n        <\u002Fdiv>`;\n    } else {\n      answerBlockHTML = `<div style=\"font-size:13px;color:var(--muted);font-style:italic;padding:8px 0\">\u2026not answered yet<\u002Fdiv>`;\n    }\n\n    // Model answer, shown exactly like the real peek panel the student can open themselves.\n    const peekHTML = s.correctAnswer ? `\n      <div class=\"peek-panel visible\" style=\"margin-top:6px\">\n        <div class=\"peek-label\">\u2713 Model / Correct Answer<\u002Fdiv>\n        <div class=\"peek-text\" style=\"white-space:pre-wrap\">${s.correctAnswer||\"\"}<\u002Fdiv>\n      <\u002Fdiv>` : \"\";\n\n    // Flag clearly when the student has used a peek/clue on this question \u2014\n    // worth seeing live, not just buried in the score breakdown afterward.\n    const peekUsedHTML = s.peeksUsedThisQuestion>0 ? `\n      <div style=\"margin-top:8px;padding:8px 10px;background:rgba(209,152,63,.15);border-left:3px solid var(--gold,#d1983f);border-radius:0 8px 8px 0;font-size:12px;color:#7d5c1e;font-weight:700\">\n        \ud83d\udc41 Used ${s.peeksUsedThisQuestion} peek${s.peeksUsedThisQuestion>1?\"s\":\"\"} on this question\n      <\u002Fdiv>` : \"\";\n\n    box.innerHTML = `\n      <div style=\"font-size:11px;color:var(--muted);margin-bottom:6px\">${modeLabel} \u00b7 ${s.lessonTitle||\"\"} \u00b7 ${s.qtype||\"\"} \u00b7 Q${(s.qIndex??0)+1}/${s.qTotal||\"?\"}<\u002Fdiv>\n      <div class=\"q-text\" style=\"margin-bottom:10px;white-space:pre-wrap\">${s.questionText||\"\"}<\u002Fdiv>\n      ${s.answered && s.feedbackHTML ? `\n        ${s.currentAnswer ? `\n          <div style=\"font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px\">\u270d\ufe0f ${STUDENT_NAME}'s answer:<\u002Fdiv>\n          <div style=\"background:var(--parchment);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;border-left:3px solid var(--navy)\">${s.currentAnswer}<\u002Fdiv>\n        ` : \"\"}\n        <div style=\"font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px\">\ud83d\udccb ${STUDENT_NAME}'s result (same view they see):<\u002Fdiv>\n        ${s.feedbackHTML}\n      ` : `\n        ${answerBlockHTML}\n        ${peekHTML}\n        ${peekUsedHTML}\n      `}\n    `;\n  });\n\n  // Live listener \u2014 logs (today only \u2014 this is \"recent activity,\" not full history;\n  // use Past Sessions or Practice Tests tabs for anything older).\n  const logsQ = query(collection(db, \"sessions\", currentUserPhone, \"logs\"), orderBy(\"ts\", \"desc\"));\n  onSnapshot(logsQ, snap => {\n    const list = document.getElementById(\"adminLogList\");\n    if(!list) return;\n    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);\n    const todayDocs = snap.docs.filter(d=>{\n      const e = d.data();\n      const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : null;\n      return tsMs!==null && tsMs >= startOfToday.getTime();\n    });\n    if(!todayDocs.length){ list.innerHTML = \"<p style='color:#999'>No activity today yet.<\u002Fp>\"; return; }\n    list.innerHTML = todayDocs.map(d=>{\n      const e = d.data();\n      return `<div style=\"padding:8px 10px;border-bottom:1px solid #eee\">\n        <b>${e.lessonTitle||\"\u2014\"}<\u002Fb> \u00b7 ${e.qtype||\"\"} \u00b7 ${e.pct!==undefined?e.pct+\"%\":\"\"}\n        <span style=\"color:#999;float:right\">${e.ts?.toDate?e.ts.toDate().toLocaleString():\"...\"}<\u002Fspan>\n      <\u002Fdiv>`;\n    }).join(\"\");\n  });\n\n  // Live listener \u2014 exam answers\n  const examQ = query(collection(db, \"sessions\", currentUserPhone, \"examAnswers\"), orderBy(\"ts\", \"desc\"));\n  onSnapshot(examQ, snap => {\n    const list = document.getElementById(\"adminExamList\");\n    if(!list) return;\n    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);\n    const todayDocs = snap.docs.filter(d=>{\n      const e = d.data();\n      const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : null;\n      return tsMs!==null && tsMs >= startOfToday.getTime();\n    });\n    if(!todayDocs.length){ list.innerHTML = \"<p style='color:#999'>No practice test activity today. See the Practice Tests tab for past attempts.<\u002Fp>\"; return; }\n    list.innerHTML = todayDocs.map(d=>{\n      const e = d.data();\n      const isOk = (e.pct||0) >= 80;\n      return `<div style=\"padding:8px 10px;border-bottom:1px solid #eee\">\n        <b>${(e.q||\"\").slice(0,80)}<\u002Fb><br>\n        <span style=\"color:#666\">Student's answer: ${(e.userText||\"\").slice(0,100)}<\u002Fspan><br>\n        <span style=\"color:#2a9d5c\">Correct answer: ${(e.modelText||\"\").slice(0,100)}<\u002Fspan>\n        <span style=\"color:${isOk?'#2a9d5c':'#c0392b'};float:right;font-weight:700\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fspan>\n      <\u002Fdiv>`;\n    }).join(\"\");\n  });\n}\n\nfunction showAdminTab(tab){\n  document.getElementById(\"adminTabLive\").style.display = tab===\"live\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabScoreboard\").style.display = tab===\"scoreboard\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabLessons\").style.display = tab===\"lessons\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabGoodwill\").style.display = tab===\"goodwill\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabContent\").style.display = tab===\"content\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabFocus\").style.display = tab===\"focus\" ? \"block\" : \"none\";\n  if(tab===\"lessons\") renderAdminLessons();\n  document.getElementById(\"tabBtnLive\").classList.toggle(\"active\", tab===\"live\");\n  document.getElementById(\"tabBtnScoreboard\").classList.toggle(\"active\", tab===\"scoreboard\");\n  document.getElementById(\"tabBtnLessons\").classList.toggle(\"active\", tab===\"lessons\");\n  document.getElementById(\"tabBtnGoodwill\").classList.toggle(\"active\", tab===\"goodwill\");\n  document.getElementById(\"tabBtnContent\").classList.toggle(\"active\", tab===\"content\");\n  document.getElementById(\"tabBtnFocus\").classList.toggle(\"active\", tab===\"focus\");\n  if(tab===\"scoreboard\"){ buildScoreboard(); renderHowToEarnPoints(\"adminHowToEarn\"); }\n  if(tab===\"goodwill\") renderGoodwillTab();\n  if(tab===\"content\") renderManageContent();\n  if(tab===\"focus\") renderFocusModeTab();\n}\n\nasync function renderGoodwillTab(){\n  const compBox = document.getElementById(\"compensationBtnWrap\");\n  const dailyBox = document.getElementById(\"goodwillDailyStatus\");\n  if(compBox){\n    const already = await checkCompensationAwarded();\n    compBox.innerHTML = already\n      ? `<div style=\"padding:10px;background:#eafaf0;color:var(--green);border-radius:8px;font-weight:700;font-size:13px;text-align:center\">\u2713 Already given<\u002Fdiv>`\n      : `<button onclick=\"submitCompensationBonus()\" style=\"width:100%;padding:12px;background:#d1983f;color:#202a3d;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer\">\ud83c\udf81 Give One-Time ${COMPENSATION_BONUS_AMOUNT}pt Bonus<\u002Fbutton>`;\n  }\n  if(dailyBox){\n    const state = await getGoodwillDailyState();\n    const left = GOODWILL_DAILY_CAP - state.count;\n    dailyBox.textContent = left>0\n      ? `${left} of ${GOODWILL_DAILY_CAP} awards left today`\n      : `No awards left today \u2014 resets tomorrow`;\n  }\n}\n\nasync function submitCompensationBonus(){\n  const ok = await awardCompensationBonus();\n  if(ok){\n    alert(`${COMPENSATION_BONUS_AMOUNT} points sent! ${STUDENT_NAME} will see the celebration instantly if the app is open.`);\n    renderGoodwillTab();\n  }\n}\n\nasync function submitGoodwillAward(){\n  const amount = document.getElementById(\"goodwillAmountInput\")?.value;\n  const custom = document.getElementById(\"goodwillReasonCustom\")?.value || \"\";\n  const select = document.getElementById(\"goodwillReasonSelect\")?.value || \"\";\n  const reason = custom.trim() || (select && select!==\"custom\" ? select : \"\");\n  const ok = await awardGoodwillPoints(amount, reason);\n  if(ok){\n    alert(`Sent! ${STUDENT_NAME} will see the celebration instantly if the app is open.`);\n    document.getElementById(\"goodwillReasonCustom\").value = \"\";\n    document.getElementById(\"goodwillReasonSelect\").value = \"\";\n    renderGoodwillTab();\n  }\n}\n\nasync function buildScoreboard(){\n  if(!window._fb || !currentUserPhone) return;\n  const totalBox = document.getElementById(\"scoreboardTotal\");\n  const sessBox = document.getElementById(\"scoreboardSessions\");\n  totalBox.innerHTML = \"Loading\u2026\";\n  sessBox.innerHTML = \"\";\n\n  let { logsSnap, examSnap, totalTestPoints } = await getLogsBundle();\n\n  if(logsSnap.empty && examSnap.empty){\n    totalBox.innerHTML = \"<p style='margin:0'>No sessions recorded yet.<\u002Fp>\";\n    return;\n  }\n\n  // Same catch-up sweep as the student's own Scoreboard \u2014 without this,\n  // admin and student could show two different totals for the exact same\n  // account, since this is what catches a lesson mastered (or a milestone\n  // completed) before it had a chance to fire from a live event.\n  const firstPassEntries = aggregateScoreboardData(logsSnap, examSnap).allScoredEntries;\n  await sweepAllPendingBonuses();\n  await syncPointAchievementsToHistory(firstPassEntries);\n  ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  maybeShowScoreCorrectionNotice();\n\n  const { bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries } = aggregateScoreboardData(logsSnap, examSnap);\n  totalBox.innerHTML = await renderScoreboardTotalHTML(bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries, totalTestPoints);\n  sessBox.innerHTML = renderScoreboardSessionsHTML(bySession);\n}\n\n// Cache of the last-fetched session groups, so View/Download buttons don't have\n// to re-query Firestore every click.\nlet _pastSessionsCache = null;\n\n// Student-facing wrapper \u2014 same data and rendering, just targets the report panel's element.\nfunction buildStudentPastSessionsList(){\n  buildPastSessionsList(\"studentPastSessionsList\");\n}\n\nasync function buildPastSessionsList(targetId){\n  targetId = targetId || \"pastSessionsList\";\n  if(!window._fb || !currentUserPhone) return;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  const list = document.getElementById(targetId);\n  if(!list) return;\n  list.innerHTML = \"Loading\u2026\";\n\n  const [{ logsSnap, examSnap }, spellSnap] = await Promise.all([\n    getLogsBundle(),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"spellErrors\"), orderBy(\"ts\",\"asc\")))\n  ]);\n\n  if(logsSnap.empty && examSnap.empty){\n    list.innerHTML = \"<p style='color:var(--muted)'>No sessions recorded yet.<\u002Fp>\";\n    return;\n  }\n\n  const { bySession } = aggregateScoreboardData(logsSnap, examSnap);\n  // Fold spelling errors into their matching session group by sessionId\n  spellSnap.forEach(d=>{\n    const e = d.data();\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = { entries:[], mockEntries:[], spellEntries:[], firstTs:null, lastTs:null };\n    if(!bySession[sid].spellEntries) bySession[sid].spellEntries = [];\n    bySession[sid].spellEntries.push(e);\n  });\n\n  const sessionIds = Object.keys(bySession).sort((a,b)=>bySession[b].firstTs - bySession[a].firstTs).slice(0,5);\n  _pastSessionsCache = bySession;\n\n  list.innerHTML = sessionIds.map(sid=>{\n    const s = bySession[sid];\n    const uniqueInSession = new Set(s.entries.map(e=>`${e.lessonId}|${e.qtype}|${e.qIndex}`));\n    const attemptsInSession = s.entries.length;\n    const timeInSession = s.entries.reduce((a,e)=>a+(e.timeMs||0),0);\n    const mockInSession = s.mockEntries.length;\n    const dateLabel = new Date(s.firstTs).toLocaleString();\n    return `\n      <div style=\"border:1.5px solid var(--border,#eee);border-radius:10px;padding:14px;margin-bottom:12px\">\n        <div style=\"font-weight:700;font-size:13px;color:var(--navy,#202a3d)\">${dateLabel}<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-top:8px;font-size:12px;flex-wrap:wrap;color:var(--muted,#666)\">\n          <div><b style=\"color:var(--navy,#202a3d)\">${uniqueInSession.size}<\u002Fb> unique<\u002Fdiv>\n          <div><b style=\"color:var(--navy,#202a3d)\">${attemptsInSession}<\u002Fb> attempts<\u002Fdiv>\n          <div><b style=\"color:var(--navy,#202a3d)\">${fmtMs(timeInSession)}<\u002Fb> spent<\u002Fdiv>\n          ${mockInSession ? `<div>\ud83c\udfaf <b style=\"color:var(--navy,#202a3d)\">${mockInSession}<\u002Fb> mock answers<\u002Fdiv>` : \"\"}\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button onclick=\"viewPastSession('${sid}')\" style=\"flex:1;padding:8px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">\ud83d\udc41 View<\u002Fbutton>\n          <button onclick=\"downloadPastSession('${sid}')\" style=\"flex:1;padding:8px;background:#fff;color:var(--navy,#202a3d);border:1.5px solid var(--navy,#202a3d);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">\u2b07 Download<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n}\n\n// Opens an in-page detail view for one specific past session \u2014\n// every question answered, the student's answer, and the correct answer.\nfunction viewPastSession(sid){\n  const s = _pastSessionsCache?.[sid];\n  if(!s) return;\n\n  let detail = document.getElementById(\"pastSessionDetail\");\n  if(!detail){\n    detail = document.createElement(\"div\");\n    detail.id = \"pastSessionDetail\";\n    detail.style.cssText = \"position:fixed;inset:0;background:#fff;z-index:300000;overflow-y:auto;padding:50px 16px 24px\";\n    document.body.appendChild(detail);\n  }\n\n  const dateLabel = new Date(s.firstTs).toLocaleString();\n  const studyRows = s.entries.map(e=>`\n    <div style=\"padding:8px 10px;border-bottom:1px solid #eee;font-size:13px\">\n      <b>${e.lessonTitle||\"\u2014\"}<\u002Fb> \u00b7 ${e.qtype||\"\"}\n      <span style=\"float:right;font-weight:700;color:${(e.pct||0)>=80?'var(--green,#2a9d5c)':'var(--red,#c0392b)'}\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\") || \"<p style='color:var(--muted)'>No study activity in this session.<\u002Fp>\";\n\n  const mockRows = s.mockEntries.map(e=>`\n    <div style=\"padding:10px;border-bottom:1px solid #eee;font-size:13px\">\n      <b>${(e.q||\"\").slice(0,100)}<\u002Fb><br>\n      <span style=\"color:var(--muted,#666)\">Student's answer: ${(e.userText||\"\").slice(0,150)}<\u002Fspan><br>\n      <span style=\"color:var(--green,#2a9d5c)\">Correct answer: ${(e.modelText||\"\").slice(0,150)}<\u002Fspan>\n      <span style=\"float:right;font-weight:700;color:${(e.pct||0)>=80?'var(--green,#2a9d5c)':'var(--red,#c0392b)'}\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\") || \"<p style='color:var(--muted)'>No practice test in this session.<\u002Fp>\";\n\n  const spellRows = (s.spellEntries||[]).map(e=>`\n    <div style=\"padding:6px 10px;border-bottom:1px solid #eee;font-size:13px\">\n      <span style=\"text-decoration:line-through;color:var(--red,#c0392b)\">${e.wrong||\"\"}<\u002Fspan>\n      \u2192 <span style=\"color:var(--green,#2a9d5c);font-weight:700\">${e.correct||\"\"}<\u002Fspan>\n      <span style=\"float:right;color:var(--muted,#888)\">${e.lessonTitle||\"\"}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\") || \"<p style='color:var(--muted)'>No spelling corrections in this session.<\u002Fp>\";\n\n  detail.innerHTML = `\n    <button onclick=\"document.getElementById('pastSessionDetail').remove()\"\n      style=\"position:fixed;top:8px;right:12px;background:#d15f5a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:300001\">\u2715 Close<\u002Fbutton>\n    <h2 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d)\">${dateLabel}<\u002Fh2>\n    <h3 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d);margin-top:20px\">\ud83d\udcd6 Study Activity<\u002Fh3>\n    ${studyRows}\n    <h3 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d);margin-top:20px\">\ud83d\udcdd Practice Test<\u002Fh3>\n    ${mockRows}\n    <h3 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d);margin-top:20px\">\u270f\ufe0f Spelling to Learn<\u002Fh3>\n    ${spellRows}\n    <button onclick=\"downloadPastSession('${sid}')\" style=\"margin-top:20px;padding:10px 20px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">\u2b07 Download This Session<\u002Fbutton>\n  `;\n}\n\n// Downloads a single past session as a standalone HTML report.\nfunction downloadPastSession(sid){\n  const s = _pastSessionsCache?.[sid];\n  if(!s) return;\n  const dateLabel = new Date(s.firstTs).toLocaleString();\n\n  let html = `<html><head><meta charset=\"utf-8\"><title>Study Buddy Session Report<\u002Ftitle>\n    <style>body{font-family:Georgia,serif;padding:24px;color:#222}h2{color:#202a3d}\n    table{width:100%;border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;text-align:left}<\u002Fstyle>\n    <\u002Fhead><body>\n    <h1>\ud83d\udcca Study Buddy \u2014 Session Report<\u002Fh1>\n    <p>Student: ${STUDENT_NAME} \u00b7 Session: ${dateLabel}<\u002Fp>\n    <h2>Study Activity (${s.entries.length})<\u002Fh2>\n    <table><tr><th>Lesson<\u002Fth><th>Type<\u002Fth><th>Score<\u002Fth><th>Time taken<\u002Fth><\u002Ftr>`;\n  s.entries.forEach(e=>{\n    html += `<tr><td>${e.lessonTitle||\"\u2014\"}<\u002Ftd><td>${e.qtype||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><td>${e.timeMs?fmtMs(e.timeMs):\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><h2>Practice Test (${s.mockEntries.length})<\u002Fh2>\n    <table><tr><th>Question<\u002Fth><th>Student's Answer<\u002Fth><th>Correct Answer<\u002Fth><th>Score<\u002Fth><\u002Ftr>`;\n  s.mockEntries.forEach(e=>{\n    html += `<tr><td>${e.q||\"\"}<\u002Ftd><td>${e.userText||\"\"}<\u002Ftd><td>${e.modelText||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><h2>\u270f\ufe0f Spelling to Learn (${(s.spellEntries||[]).length})<\u002Fh2>\n    <table><tr><th>You wrote<\u002Fth><th>Correct spelling<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>`;\n  (s.spellEntries||[]).forEach(e=>{\n    html += `<tr><td>${e.wrong||\"\"}<\u002Ftd><td>${e.correct||\"\"}<\u002Ftd><td>${e.lessonTitle||\"\u2014\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_Session_${s.firstTs}.html`;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n\n// Cache of mock-exam attempts (grouped by sessionId, since one practice test = one session's worth of examAnswers).\nlet _mockExamsCache = null;\nlet _mockExamsAllIds = [];   // all exam IDs, newest first, fully loaded once per call\nlet _mockExamsShown = 0;     // how many are currently rendered\nconst MOCK_EXAMS_PAGE_SIZE = 15;\n\n// Student-facing wrapper\nfunction buildStudentMockExamsList(){\n  buildMockExamsList(\"studentMockExamsList\", \"studentMockExamsLoadMore\");\n}\n\nasync function buildMockExamsList(targetId, loadMoreBtnId){\n  targetId = targetId || \"mockExamsList\";\n  loadMoreBtnId = loadMoreBtnId || \"mockExamsLoadMore\";\n  if(!window._fb || !currentUserPhone) return;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  const list = document.getElementById(targetId);\n  if(!list) return;\n  list.innerHTML = \"Loading\u2026\";\n\n  const examSnap = await getDocs(query(collection(db,\"sessions\",currentUserPhone,\"examAnswers\"), orderBy(\"ts\",\"asc\")));\n  if(examSnap.empty){\n    list.innerHTML = \"<p style='color:var(--muted)'>No practice tests taken yet.<\u002Fp>\";\n    const lm = document.getElementById(loadMoreBtnId); if(lm) lm.style.display = \"none\";\n    return;\n  }\n\n  // Group by mockExamId (one group = one full exam attempt). Older entries written\n  // before this field existed fall back to sessionId so they still show up.\n  const byExam = {};\n  examSnap.forEach(d=>{\n    const e = d.data();\n    const eid = e.mockExamId || e.sessionId || \"unknown\";\n    if(!byExam[eid]) byExam[eid] = { answers:[], firstTs:null, lastTs:null };\n    byExam[eid].answers.push(e);\n    const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : Date.now();\n    if(!byExam[eid].firstTs || tsMs < byExam[eid].firstTs) byExam[eid].firstTs = tsMs;\n    if(!byExam[eid].lastTs  || tsMs > byExam[eid].lastTs)  byExam[eid].lastTs  = tsMs;\n  });\n  _mockExamsCache = byExam;\n  _mockExamsAllIds = Object.keys(byExam).sort((a,b)=>byExam[b].firstTs - byExam[a].firstTs);\n  _mockExamsShown = Math.min(MOCK_EXAMS_PAGE_SIZE, _mockExamsAllIds.length);\n\n  renderMockExamsPage(targetId, loadMoreBtnId);\n}\n\nfunction renderMockExamsPage(targetId, loadMoreBtnId){\n  const list = document.getElementById(targetId);\n  const byExam = _mockExamsCache;\n  const visibleIds = _mockExamsAllIds.slice(0, _mockExamsShown);\n\n  list.innerHTML = visibleIds.map(eid=>{\n    const ex = byExam[eid];\n    const total = ex.answers.length;\n    const avgScore = Math.round(ex.answers.reduce((a,e)=>a+(e.pct||0),0)/total);\n    const correct = ex.answers.filter(e=>(e.pct||0)>=80).length;\n    const dateLabel = new Date(ex.firstTs).toLocaleString();\n    const durationMs = ex.lastTs - ex.firstTs;\n    return `\n      <div style=\"border:1.5px solid var(--border,#eee);border-radius:10px;padding:14px;margin-bottom:12px\">\n        <div style=\"font-weight:700;font-size:13px;color:var(--navy,#202a3d)\">${dateLabel}<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-top:8px;font-size:12px;flex-wrap:wrap;color:var(--muted,#666)\">\n          <div><b style=\"color:var(--navy,#202a3d)\">${total}<\u002Fb> questions<\u002Fdiv>\n          <div><b style=\"color:${avgScore>=80?'var(--green,#2a9d5c)':avgScore>=50?'#9c7519':'var(--red,#c0392b)'}\">${avgScore}%<\u002Fb> avg score<\u002Fdiv>\n          <div><b style=\"color:var(--navy,#202a3d)\">${correct}<\u002Fb>/${total} correct<\u002Fdiv>\n          <div>\u23f1 <b style=\"color:var(--navy,#202a3d)\">${fmtMs(durationMs)}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button onclick=\"viewMockExam('${eid}')\" style=\"flex:1;padding:8px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">\ud83d\udc41 View Answers<\u002Fbutton>\n          <button onclick=\"downloadMockExamAttempt('${eid}')\" style=\"flex:1;padding:8px;background:#fff;color:var(--navy,#202a3d);border:1.5px solid var(--navy,#202a3d);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">\u2b07 Download<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n\n  // Show/hide and wire the \"Load older exams\" button\n  const lm = document.getElementById(loadMoreBtnId);\n  if(lm){\n    if(_mockExamsShown < _mockExamsAllIds.length){\n      lm.style.display = \"block\";\n      lm.textContent = `Load older exams \u2193 (${_mockExamsAllIds.length - _mockExamsShown} more)`;\n      lm.onclick = ()=>{\n        _mockExamsShown = Math.min(_mockExamsShown + MOCK_EXAMS_PAGE_SIZE, _mockExamsAllIds.length);\n        renderMockExamsPage(targetId, loadMoreBtnId);\n      };\n    } else {\n      lm.style.display = \"none\";\n    }\n  }\n}\n\n// Full answer-by-answer view for one practice test attempt \u2014 selected vs correct answer for every question.\nfunction viewMockExam(eid){\n  const ex = _mockExamsCache?.[eid];\n  if(!ex) return;\n\n  let detail = document.getElementById(\"mockExamDetail\");\n  if(!detail){\n    detail = document.createElement(\"div\");\n    detail.id = \"mockExamDetail\";\n    detail.style.cssText = \"position:fixed;inset:0;background:#fff;z-index:300000;overflow-y:auto;padding:50px 16px 24px\";\n    document.body.appendChild(detail);\n  }\n\n  const dateLabel = new Date(ex.firstTs).toLocaleString();\n  const rows = ex.answers.map((e,i)=>{\n    const isOk = (e.pct||0) >= 80;\n    return `\n      <div style=\"border:1.5px solid var(--border,#eee);border-radius:10px;padding:12px 14px;margin-bottom:10px\">\n        <div style=\"font-size:12px;color:var(--muted,#888);margin-bottom:4px\">Q${i+1} \u00b7 ${e.qtype||\"\"} \u00b7 ${e.lessonTitle||\"\"}<\u002Fdiv>\n        <div class=\"q-text\" style=\"margin-bottom:8px;font-size:14px\">${e.q||\"\"}<\u002Fdiv>\n        <div class=\"mcq-option ${isOk?'correct':'wrong'}\" style=\"margin-bottom:6px;cursor:default\">\n          <span>${STUDENT_NAME}'s answer: ${e.userText||\"(no answer)\"}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"peek-panel visible\">\n          <div class=\"peek-label\">\u2713 Correct Answer<\u002Fdiv>\n          <div class=\"peek-text\">${e.modelText||\"\"}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:6px;font-size:12px;font-weight:700;color:${isOk?'var(--green,#2a9d5c)':'var(--red,#c0392b)'}\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n\n  detail.innerHTML = `\n    <button onclick=\"document.getElementById('mockExamDetail').remove()\"\n      style=\"position:fixed;top:8px;right:12px;background:#d15f5a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:300001\">\u2715 Close<\u002Fbutton>\n    <h2 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d)\">\ud83d\udcdd Practice Test \u2014 ${dateLabel}<\u002Fh2>\n    ${rows}\n    <button onclick=\"downloadMockExamAttempt('${eid}')\" style=\"margin-top:10px;padding:10px 20px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">\u2b07 Download This Exam<\u002Fbutton>\n  `;\n}\n\n// Downloads one practice test attempt as a standalone HTML report.\nfunction downloadMockExamAttempt(eid){\n  const ex = _mockExamsCache?.[eid];\n  if(!ex) return;\n  const dateLabel = new Date(ex.firstTs).toLocaleString();\n  const total = ex.answers.length;\n  const avgScore = Math.round(ex.answers.reduce((a,e)=>a+(e.pct||0),0)/total);\n\n  let html = `<html><head><meta charset=\"utf-8\"><title>Study Buddy Practice Test Report<\u002Ftitle>\n    <style>body{font-family:Georgia,serif;padding:24px;color:#222}h2{color:#202a3d}\n    table{width:100%;border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;text-align:left}<\u002Fstyle>\n    <\u002Fhead><body>\n    <h1>\ud83c\udfaf Study Buddy \u2014 Practice Test Report<\u002Fh1>\n    <p>Student: ${STUDENT_NAME} \u00b7 Taken: ${dateLabel} \u00b7 Average score: ${avgScore}%<\u002Fp>\n    <table><tr><th>#<\u002Fth><th>Question<\u002Fth><th>Student's Answer<\u002Fth><th>Correct Answer<\u002Fth><th>Score<\u002Fth><\u002Ftr>`;\n  ex.answers.forEach((e,i)=>{\n    html += `<tr><td>${i+1}<\u002Ftd><td>${e.q||\"\"}<\u002Ftd><td>${e.userText||\"\"}<\u002Ftd><td>${e.modelText||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_MockExam_${ex.firstTs}.html`;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SPELLING GAME \u2014 built from real past mistakes\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _spellingWords = [];   // deduped {word, lessonTitle, missCount} pulled from Firestore\nlet _spellingIdx = 0;\nlet _spellingScore = 0;\nlet _spellingRoundSize = 0;\nlet _spellingSubject = \"\";\nlet _answeredQuestionKeys = new Set(); // tracks lessonId|qtype|qIndex keys already answered (loaded from Firebase on scoreboard open)\nlet _answeredKeysLoaded = false;\nlet _masteredQuestionKeys = new Set();\n// Per-question detail behind _masteredQuestionKeys' plain yes/no -- the best\n// score ever reached WITHOUT peeking, and whether an 80%+ score was ever\n// reached only WHILE peeking. Powers the \"Why not mastered?\" admin detail\n// with a precise reason (never tried / scored too low / peeked) instead of\n// just \"not mastered yet\". key -> { bestUnaidedPct, everPeekedAt80Plus, attempted }\nlet _questionScoreInfo = {};\nfunction recordQuestionScoreInfo(key, pct, peeked){\n  if(!_questionScoreInfo[key]) _questionScoreInfo[key] = { bestUnaidedPct: -1, everPeekedAt80Plus: false, attempted: false };\n  var info = _questionScoreInfo[key];\n  info.attempted = true;\n  if(!peeked && pct > info.bestUnaidedPct) info.bestUnaidedPct = pct;\n  if(peeked && pct >= 80) info.everPeekedAt80Plus = true;\n}\nlet _questionIndexMap = null; // maps display index -> original DATA index for weighted ordering // questions scored 80%+ at least twice\nlet _completeLessons = {}; // lessonId -> true/false, loaded from Firebase\n\nlet _spellingAllBySubject = {}; // subject -> [{word, lessonTitle, missCount}]\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  REVISE MODE \u2014 PRACTICE SPELLINGS FOR THIS QUESTION\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// For long-answer types (Answer in Brief, Give Reasons, Distinguish Between,\n// Answer in Paragraph/Detail), pull the harder/key vocabulary words straight\n// out of THIS question's model answer so a student can drill spelling for\n// exactly the answer they're revising, right where they're revising it.\nconst SPELL_STOPWORDS = new Set([\"the\",\"about\",\"after\",\"again\",\"against\",\"all\",\"also\",\n  \"although\",\"among\",\"and\",\"another\",\"any\",\"are\",\"around\",\"because\",\"been\",\n  \"before\",\"being\",\"between\",\"both\",\"but\",\"cannot\",\"could\",\"did\",\"does\",\"doing\",\n  \"down\",\"during\",\"each\",\"either\",\"enough\",\"even\",\"every\",\"for\",\"from\",\"further\",\n  \"had\",\"has\",\"have\",\"having\",\"here\",\"however\",\"into\",\"itself\",\"just\",\"like\",\n  \"made\",\"make\",\"many\",\"might\",\"more\",\"most\",\"much\",\"must\",\"never\",\"not\",\n  \"nowhere\",\"off\",\"once\",\"only\",\"onto\",\"other\",\"others\",\"otherwise\",\"ought\",\n  \"our\",\"ours\",\"out\",\"over\",\"own\",\"people\",\"public\",\"rather\",\"same\",\"shall\",\n  \"should\",\"since\",\"some\",\"still\",\"such\",\"than\",\"that\",\"their\",\"theirs\",\"them\",\n  \"themselves\",\"then\",\"there\",\"therefore\",\"these\",\"they\",\"this\",\"those\",\"though\",\n  \"through\",\"throughout\",\"thus\",\"under\",\"unless\",\"until\",\"upon\",\"very\",\"was\",\n  \"well\",\"were\",\"what\",\"whatever\",\"when\",\"whenever\",\"where\",\"whereas\",\"wherever\",\n  \"whether\",\"which\",\"while\",\"who\",\"whom\",\"whose\",\"why\",\"will\",\"with\",\"within\",\n  \"without\",\"would\",\"yet\",\"your\",\"yours\",\"yourself\"]);\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MANDATORY SPELLING WARM-UP \u2014 before writing questions\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// A short, unskippable spelling round on this specific question's key\n// vocabulary, required before the answer box becomes usable. Scoped to the\n// writing types (Brief, Reasons, Distinguish, Paragraph, Quote from Memory)\n// where getting the right words down actually matters \u2014 not MCQ/Fill/\n// True-False/Match, where this wouldn't make sense. Resets each fresh visit\n// to the app (session-local), so it recurs regularly without becoming\n// absurdly repetitive on every single Try Again within one sitting.\nconst SPELLING_GATE_QTYPES = new Set([\"brief\",\"reasons\",\"distinguish\",\"paragraph\",\"memorise\"]);\nlet _spellingIsGate = false;\nlet _spellingIsWarmDown = false; // true specifically for the post-submit \"fix what you missed\" round below \u2014 distinct from the pre-write warm-up gate, which requires a perfect round to proceed; the warm-down only requires going through it once.\nlet _spellingGateKey = null;\nlet _spellingGateResumeFn = null; // what to run once the warm-up finishes \u2014 set by whichever peek-close triggered it\nlet _spellingGateAnswerHTML = \"\"; // the model answer text, stashed so it can be viewed again on demand during the gate\nconst _spellingGateDoneKeys = new Set();\n\nfunction maybeShowSpellingGate(qtype, qIndex, onDone){\n  // Note: this now also triggers for admin logins, deliberately \u2014 it's a\n  // purely in-memory, session-local flag (_spellingGateDoneKeys), never\n  // written to Firestore, so admin triggering it for testing has zero\n  // effect on the student's actual saved progress either way.\n  if(currentMode!==\"study\" || !currentLesson || currentLesson.id===\"__mock__\") return false;\n  if(!SPELLING_GATE_QTYPES.has(qtype)) return false;\n  const key = `${currentLesson.id}_${qtype}_${qIndex}`;\n  if(_spellingGateDoneKeys.has(key)) return false;\n\n  const qs = currentLesson.questions[qtype]||[];\n  const q = qs[qIndex];\n  if(!q) return false;\n  // Pulled from THIS question's own answer -- that's the vocabulary he\n  // actually needs to spell correctly when writing it -- but never a word\n  // the question's own PROMPT already gives away (e.g. \"What is apple?\"\n  // shouldn't warm him up on spelling \"apple\"; that's not real recall).\n  const answerText = qtype===\"distinguish\" ? ((q.answerA||\"\")+\" \"+(q.answerB||\"\")) : ((q.answer||\"\")+\" \"+(q.lines||\"\"));\n  const promptWords = new Set(getAnswerSpellingWords(q.q||\"\").map(w=>w.toLowerCase()));\n  const words = getAnswerSpellingWords(answerText).filter(w=>!promptWords.has(w.toLowerCase()));\n  if(!words.length){ _spellingGateDoneKeys.add(key); return false; } // nothing left to warm up on \u2014 don't block for no reason\n\n  _spellingIsGate = true;\n  _spellingGateKey = key;\n  _spellingGateResumeFn = onDone || null; // what to do once the warm-up finishes \u2014 set by whoever triggered it (always the peek-close moment now)\n  _spellingGateAnswerHTML = qtype===\"distinguish\"\n    ? `<div style=\"margin-bottom:8px\"><b>${(q.termA||\"Term A\").replace(/<\u002Fg,\"&lt;\")}:<\u002Fb> ${(q.answerA||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv><div><b>${(q.termB||\"Term B\").replace(/<\u002Fg,\"&lt;\")}:<\u002Fb> ${(q.answerB||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>`\n    : (q.answer||\"\").replace(/<\u002Fg,\"&lt;\");\n  _spellingWords = words.map(w=>({ word:w, lessonTitle: currentLesson.title }));\n  _spellingSubject = \"Warm-Up\";\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(6, _spellingWords.length); // shorter than a full round \u2014 a quick warm-up, not the whole game\n\n  const panel = document.getElementById(\"spellingPanel\");\n  const titleEl = document.getElementById(\"spellingPanelTitle\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(titleEl) titleEl.textContent = \"\ud83d\udd24 Quick Spelling Warm-Up\";\n  if(doneBtn) doneBtn.style.display = \"none\"; // no early exit into the actual question \u2014 only \"Continue to Question\" at the end gets you there\n  if(skipBtn) skipBtn.style.display = \"block\"; // but moving PAST this question entirely is always allowed \u2014 the gate only blocks answering it\n  // \"View Model Answer Again\" is deliberately kept hidden during the gate \u2014\n  // the spelling words are pulled straight from this same answer text, so\n  // revealing it here would just let him copy the very words the round is\n  // testing instead of recalling them. The peek button is disabled for the\n  // same reason; this button used to undermine that on its own.\n  if(viewAnswerBtn) viewAnswerBtn.style.display = \"none\";\n  if(answerBox) answerBox.style.display = \"none\";\n  panel?.classList.add(\"visible\");\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n\n  // The answer box is already locked at this point \u2014 the gate now triggers\n  // right when peek closes, BEFORE the textarea would have unlocked, so\n  // there's nothing extra to lock here. The peek button itself still gets\n  // disabled, so it can't be reopened mid-warm-up.\n  const peekBtn = document.getElementById(\"mainPeekBtn\");\n  if(peekBtn) peekBtn.disabled = true;\n  return true;\n}\n\n// Called from the \"Continue to Question \u2192\" button at the end of a gate round\n// Lets him look at the model answer again mid-warm-up, in case he closed\n// peek too fast or wants to double-check something before continuing \u2014\n// shown inline in the same panel, no need to leave the gate to see it.\nfunction toggleSpellingGateAnswer(){\n  const box = document.getElementById(\"spellingGateAnswerBox\");\n  const btn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  if(!box) return;\n  const showing = box.style.display !== \"none\";\n  if(showing){\n    box.style.display = \"none\";\n    if(btn) btn.textContent = \"\ud83d\udc41 View Model Answer Again\";\n  } else {\n    box.innerHTML = _spellingGateAnswerHTML;\n    box.style.display = \"block\";\n    if(btn) btn.textContent = \"\ud83d\ude48 Hide Model Answer\";\n  }\n}\n\nfunction finishSpellingGate(){\n  if(_spellingGateKey) _spellingGateDoneKeys.add(_spellingGateKey);\n  _spellingIsGate = false;\n  _spellingGateKey = null;\n  document.getElementById(\"spellingPanel\")?.classList.remove(\"visible\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  if(doneBtn) doneBtn.style.display = \"\"; // restore for normal (non-gate) spelling game use\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  if(skipBtn) skipBtn.style.display = \"none\";\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  if(viewAnswerBtn) viewAnswerBtn.style.display = \"none\";\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(answerBox) answerBox.style.display = \"none\";\n  // Resume exactly where the peek-close left off \u2014 unlock the textarea(s)\n  // directly, rather than a full re-render, which would otherwise wipe out\n  // the fact that he already viewed the peek and reset things back to\n  // \"disabled, awaiting peek\" again.\n  const resume = _spellingGateResumeFn;\n  _spellingGateResumeFn = null;\n  if(resume) resume(); else renderCurrentQuestion();\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MANDATORY SPELLING WARM-DOWN \u2014 after answering, before the score shows\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// The warm-up above drills vocabulary BEFORE writing, pulled from the model\n// answer in general. This drills the SPECIFIC words he actually got wrong\n// (misspelled, or never written at all) in the answer he just submitted \u2014\n// triggered right after scoring, before the score/feedback panel is shown,\n// so reviewing what he just missed happens while it's still fresh instead\n// of being an easy-to-skip button sitting below the score. Replaces the old\n// optional \"Practice Spellings for this Answer\" button in the writing-type\n// feedback for exactly this reason \u2014 this makes it happen every time\n// instead of only when he chooses to click it.\n//\n// Deliberately NOT a \"must get them all correct\" gate like the warm-up \u2014\n// the score is already locked in by this point, so the goal is reinforcing\n// what he missed, not blocking him. Going through the round once (right or\n// wrong on each word) is enough to unlock the score.\nfunction maybeShowSpellingWarmDown(diff, onReveal){\n  if(currentMode!==\"study\" || !currentLesson || currentLesson.id===\"__mock__\") return false;\n  const words = getWrongSpellingWords(diff);\n  if(!words.length) return false; // nothing missed this time -- nothing to warm down on, show the score right away\n\n  _spellingIsGate = true;\n  _spellingIsWarmDown = true;\n  _spellingGateKey = null; // no \"done forever\" key -- unlike the warm-up, this should recur every time there's a fresh mistake to fix, not just once per question\n  _spellingGateResumeFn = onReveal || null;\n  _spellingWords = words.map(w=>({ word:w, lessonTitle: currentLesson.title }));\n  _spellingSubject = \"Warm-Down\";\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(6, _spellingWords.length);\n\n  const panel = document.getElementById(\"spellingPanel\");\n  const titleEl = document.getElementById(\"spellingPanelTitle\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(titleEl) titleEl.textContent = \"\ud83d\udd24 Fix What You Missed\";\n  if(doneBtn) doneBtn.style.display = \"none\";\n  if(skipBtn) skipBtn.style.display = \"none\"; // no skipping -- his score is already computed, this just has to be gone through once before it's revealed\n  if(viewAnswerBtn) viewAnswerBtn.style.display = \"none\";\n  if(answerBox) answerBox.style.display = \"none\";\n  panel?.classList.add(\"visible\");\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n  return true;\n}\n\nfunction finishSpellingWarmDown(){\n  _spellingIsGate = false;\n  _spellingIsWarmDown = false;\n  document.getElementById(\"spellingPanel\")?.classList.remove(\"visible\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  if(doneBtn) doneBtn.style.display = \"\";\n  const resume = _spellingGateResumeFn;\n  _spellingGateResumeFn = null;\n  if(resume) resume();\n}\n\n// Lets him move past this question entirely without doing the warm-up \u2014\n// the gate only blocks actually ANSWERING it, not navigating on. Doesn't\n// mark the warm-up as done, so if he comes back to genuinely answer this\n// question later, the gate applies fresh, same as any other new attempt.\nfunction skipQuestionFromSpellingGate(){\n  const isLast = currentQIndex >= (currentLesson?.questions[currentQType]||[]).length - 1;\n  _spellingIsGate = false;\n  _spellingGateKey = null;\n  _spellingGateResumeFn = null;\n  document.getElementById(\"spellingPanel\")?.classList.remove(\"visible\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  if(doneBtn) doneBtn.style.display = \"\";\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  if(skipBtn) skipBtn.style.display = \"none\";\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  if(viewAnswerBtn) viewAnswerBtn.style.display = \"none\";\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(answerBox) answerBox.style.display = \"none\";\n  skipQuestion(isLast);\n}\n\n\nfunction getAnswerSpellingWords(answerText, maxWords){\n  if(!answerText) return [];\n  const seen = new Set();\n  const words = [];\n  // Deliberately inclusive: any real word 3+ letters that isn't a basic\n  // function word (the, and, of, etc.) qualifies \u2014 not just long or\n  // capitalized ones. For a student whose spelling needs broad practice,\n  // narrowing this down to only \"hard-looking\" words would leave out plenty\n  // of perfectly ordinary words (like \"unit,\" \"law,\" \"acts\") that are still\n  // genuinely worth drilling. The round itself stays short regardless\n  // (capped at 6 words), so a longer candidate pool just means more variety\n  // across repeat visits, not a longer single round.\n  const tokens = String(answerText).split(/[^A-Za-z]+/).filter(Boolean);\n  tokens.forEach(tok=>{\n    if(tok.length<3) return; // skip single/double-letter words \u2014 too trivial to be worth spelling practice\n    const lower = tok.toLowerCase();\n    if(SPELL_STOPWORDS.has(lower)) return;\n    if(seen.has(lower)) return;\n    seen.add(lower);\n    words.push(tok);\n  });\n  return maxWords ? words.slice(0, maxWords) : words;\n}\n\n// Practice mode's post-check spelling button uses THIS instead of the generic\n// lesson-vocabulary extractor above \u2014 it only pulls words from what the\n// student actually got wrong in THIS attempt: words the diff marked\n// \"missing\" (never written) or \"misspelled\" (attempted but wrong), using the\n// correct spelling in both cases. \"wrong\"-type words are deliberately\n// excluded \u2014 those are extra content the student wrote that doesn't match\n// anything in the model answer, so they're not a real vocabulary target.\n\n// Pulls spelling words from the REST of the lesson's writing-type questions\n// (Brief, Reasons, Distinguish, Paragraph, Quote from Memory) -- deliberately\n// excluding the one question this gate is warming up for. The whole point of\n// a warm-up is broader vocabulary confidence before writing, not re-drilling\n// the exact words he's about to lift from the model answer he just peeked\n// at -- that would make it copying, not spelling practice.\nfunction getWrongSpellingWords(diff){\n  if(!diff || !diff.length) return [];\n  const seen = new Set();\n  const words = [];\n  diff.forEach(d=>{\n    let candidate = null, forceInclude = false;\n    if(d.type===\"missing\"){ candidate = d.word; }\n    else if(d.type===\"misspelled\"){ candidate = d.correct; forceInclude = true; } // they clearly tried this word \u2014 always worth drilling regardless of length\n    if(!candidate) return;\n    const tok = String(candidate).trim();\n    if(!tok) return;\n    const isAcronym = tok.length>=2 && tok===tok.toUpperCase();\n    if(!forceInclude && !isAcronym && tok.length<6) return;\n    const lower = tok.toLowerCase();\n    if(!forceInclude && !isAcronym && SPELL_STOPWORDS.has(lower)) return;\n    if(seen.has(lower)) return;\n    seen.add(lower);\n    words.push(tok);\n  });\n  return words;\n}\n\n// Pool of {words, label} built fresh each time renderRevise runs \u2014 buttons\n// reference it by index instead of inlining data into onclick attributes.\nlet _reviseSpellPool = [];\n\nfunction buildReviseSpellButton(words, lesson, qt, qIndex){\n  if(!words || !words.length) return \"\";\n  const label = `${qt.label} \u00b7 Q${qIndex+1}`;\n  _reviseSpellPool.push({ words, label, lessonTitle: lesson.title });\n  const idx = _reviseSpellPool.length-1;\n  return `<button class=\"revise-spelling-cta\" style=\"margin-top:12px\" onclick=\"openQuestionSpellingGame(${idx})\">\n    <div>\n      <div class=\"rsc-title\">\ud83d\udd24 Practice Spellings for this Answer<\u002Fdiv>\n      <div class=\"rsc-sub\">${words.length} key word${words.length!==1?\"s\":\"\"} from this answer<\u002Fdiv>\n    <\u002Fdiv>\n    <span class=\"rsc-arrow\">\u2192<\u002Fspan>\n  <\u002Fbutton>`;\n}\n\nfunction openQuestionSpellingGame(poolIndex){\n  const entry = _reviseSpellPool[poolIndex];\n  if(!entry || !entry.words.length) return;\n  _spellingWords = entry.words.map(w=>({ word:w, lessonTitle: `${entry.lessonTitle} \u2014 ${entry.label}` }));\n  _spellingSubject = entry.label;\n  _spellingAllBySubject = { [entry.label]: _spellingWords };\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(10, _spellingWords.length);\n\n  const panel = document.getElementById(\"spellingPanel\");\n  const titleEl = panel?.querySelector(\".report-title\");\n  if(titleEl) titleEl.textContent = `\ud83d\udd24 Spelling \u2014 ${entry.label}`;\n  panel?.classList.add(\"visible\");\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  REVISE MODE \u2014 READ & MEMORISE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Unlike a blind recall test, the model answer stays fully visible the\n// whole time \u2014 the student reads it aloud (or types it out) to help it\n// stick through repetition, the same way reading something aloud a few\n// times helps memorise it. No peek/hide mechanic needed since nothing is\n// ever hidden. Scoring rewards PACE, mirroring Practice mode's own speed\n// bonus: read it accurately (70%+ match to the model answer) and quickly\n// relative to its length, and it earns a small Growth Points bonus \u2014\n// faster = more points, exactly like Practice mode's timer. Logged under\n// \"recite_fast_\"/\"recite_good_\" qtype prefixes (legacy \"recite_\" is still\n// recognised for entries earned under the old one-time bonus system) so\n// it never touches Practice mode's own mastery tracking for the question.\nlet _reviseRecitePool = [];\nconst _reciteAttemptCounts = {}; // poolIndex -> count, in-memory only, resets on reload \u2014 purely a friendly nudge, never persisted\nconst READ_WPM = 100; // slower, more forgiving pace for reading aloud (not silent reading) \u2014 technical vocabulary takes longer to say than to skim\nconst READ_START_BUFFER_MS = 6000; // extra flat time for opening the mic, taking a breath, and actually starting to speak, before the clock effectively starts costing points\n\n// Pre-registers a question for reading aloud and returns its pool index\n// (or -1 if there's nothing to read).\nfunction registerRecite(q, qt, qIndexInType){\n  const isDist = qt.id===\"distinguish\";\n  if(isDist && !((q.answerA||\"\").trim() || (q.answerB||\"\").trim())) return -1;\n  if(!isDist && !(q.answer||\"\").trim()) return -1;\n  _reviseRecitePool.push({\n    qtype:qt.id, qIndexInType, answer:q.answer||\"\", answerA:q.answerA||\"\", answerB:q.answerB||\"\",\n    termA:q.termA||\"Term A\", termB:q.termB||\"Term B\"\n  });\n  return _reviseRecitePool.length-1;\n}\n\nfunction buildReviseReciteButton(idx, q){\n  if(idx<0) return \"\";\n  const entry = _reviseRecitePool[idx];\n  const isDist = entry.qtype===\"distinguish\";\n  const panelInner = isDist ? `\n      <div class=\"dist-input-grid\">\n        <div>\n          <div class=\"dist-input-label\">${entry.termA}<\u002Fdiv>\n          <div class=\"voice-input-row\">\n            <button type=\"button\" class=\"btn-mic\" id=\"reciteMicA-${idx}\" onclick=\"toggleVoiceInput('reciteInputA-${idx}', this)\">\ud83c\udfa4 Speak<\u002Fbutton>\n            <button type=\"button\" class=\"btn-recite-clear\" onclick=\"clearReciteInput('reciteInputA-${idx}')\">\ud83d\uddd1 Clear<\u002Fbutton>\n          <\u002Fdiv>\n          <textarea class=\"answer-textarea\" id=\"reciteInputA-${idx}\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" style=\"min-height:70px\" placeholder=\"Read ${entry.termA} aloud, or type it\u2026\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div class=\"dist-input-label\">${entry.termB}<\u002Fdiv>\n          <div class=\"voice-input-row\">\n            <button type=\"button\" class=\"btn-mic\" id=\"reciteMicB-${idx}\" onclick=\"toggleVoiceInput('reciteInputB-${idx}', this)\">\ud83c\udfa4 Speak<\u002Fbutton>\n            <button type=\"button\" class=\"btn-recite-clear\" onclick=\"clearReciteInput('reciteInputB-${idx}')\">\ud83d\uddd1 Clear<\u002Fbutton>\n          <\u002Fdiv>\n          <textarea class=\"answer-textarea\" id=\"reciteInputB-${idx}\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" style=\"min-height:70px\" placeholder=\"Read ${entry.termB} aloud, or type it\u2026\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>`\n    : `\n      <div class=\"voice-input-row\">\n        <button type=\"button\" class=\"btn-mic\" id=\"reciteMic-${idx}\" onclick=\"toggleVoiceInput('reciteInput-${idx}', this)\">\ud83c\udfa4 Speak<\u002Fbutton>\n        <button type=\"button\" class=\"btn-recite-clear\" onclick=\"clearReciteInput('reciteInput-${idx}')\">\ud83d\uddd1 Clear<\u002Fbutton>\n      <\u002Fdiv>\n      <textarea class=\"answer-textarea\" id=\"reciteInput-${idx}\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" style=\"min-height:90px\" placeholder=\"Read the answer above aloud, or type it\u2026\"><\u002Ftextarea>`;\n  return `<button class=\"revise-spelling-cta\" style=\"margin-top:12px\" onclick=\"toggleRecitePanel(${idx})\">\n      <div>\n        <div class=\"rsc-title\">\ud83d\udcd6 Read &amp; Memorise<\u002Fdiv>\n        <div class=\"rsc-sub\">Read it aloud \u2014 the faster and more accurate, the more points<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"rsc-arrow\">\u2192<\u002Fspan>\n    <\u002Fbutton>\n    <div class=\"recite-panel\" id=\"recitePanel-${idx}\" style=\"display:none\">\n      <div style=\"display:flex;justify-content:flex-end;margin-bottom:6px\">\n        <button type=\"button\" onclick=\"closeRecitePanel(${idx})\" style=\"background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;padding:4px 8px\">\u2715 Close &amp; back to revising<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"reciteTimerWrap-${idx}\" style=\"margin:0 0 10px;padding:8px 10px;background:var(--parchment);border-radius:8px\">\n        <div style=\"font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center\" id=\"reciteChallenge-${idx}\">\ud83d\udcd6 Read it \u2014 the faster and clearer, the more points<\u002Fdiv>\n        <div style=\"background:#e0e0e0;border-radius:3px;overflow:hidden;height:5px;margin-bottom:5px\">\n          <div id=\"reciteTimerBar-${idx}\" style=\"height:100%;width:100%;background:#4a9873;border-radius:3px;transition:width .5s linear,background .5s\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"font-size:10px;color:var(--muted)\">Reading Speed Bonus<\u002Fspan>\n          <span id=\"reciteTimerPts-${idx}\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#4a9873;color:#fff;transition:background .5s\">\u26a1 calculating\u2026<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${panelInner}\n      <button class=\"btn-check\" id=\"reciteCheckBtn-${idx}\" style=\"margin-top:10px;padding:9px 18px;font-size:13px\" onclick=\"checkRecite(${idx})\">Check<\u002Fbutton>\n      <div id=\"reciteResult-${idx}\" style=\"margin-top:10px\"><\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n// Instantly wipes one textarea's content mid-attempt \u2014 for when the mic\n// mis-transcribed something and the student wants a clean slate without\n// waiting to press Check first (that's what Try Again is for, after the\n// fact; this is for clearing DURING an attempt, before checking at all).\nfunction clearReciteInput(targetId){\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  const ta = document.getElementById(targetId);\n  if(ta){ ta.value = \"\"; ta.disabled = false; ta.focus(); }\n  // Clearing the answer is what re-opens the door to Check again -- closing\n  // and reopening the panel is NOT a way to resubmit the same already-scored\n  // answer for extra points (see openRecitePanel). Re-enable the Check\n  // button and this input's mic button, and drop the stale result, since\n  // whatever was scored no longer matches what's in the box.\n  const idxMatch = targetId.match(/-(\\d+)$/);\n  if(idxMatch){\n    const idx = idxMatch[1];\n    const checkBtn = document.getElementById(`reciteCheckBtn-${idx}`);\n    if(checkBtn) checkBtn.disabled = false;\n    const micBtn = document.getElementById(targetId.replace(\"reciteInput\", \"reciteMic\"));\n    if(micBtn) micBtn.disabled = false;\n    const resultEl = document.getElementById(`reciteResult-${idx}`);\n    if(resultEl) resultEl.innerHTML = \"\";\n  }\n}\n\n// Enables/disables the Check button, mic buttons, and textarea(s) together \u2014\n// used to lock everything once a result is showing, and unlock on Try Again.\nfunction setReciteInputsEnabled(idx, entry, enabled){\n  const checkBtn = document.getElementById(`reciteCheckBtn-${idx}`);\n  if(checkBtn) checkBtn.disabled = !enabled;\n  if(entry.qtype===\"distinguish\"){\n    const taA=document.getElementById(`reciteInputA-${idx}`); if(taA) taA.disabled=!enabled;\n    const taB=document.getElementById(`reciteInputB-${idx}`); if(taB) taB.disabled=!enabled;\n    const mA=document.getElementById(`reciteMicA-${idx}`); if(mA) mA.disabled=!enabled;\n    const mB=document.getElementById(`reciteMicB-${idx}`); if(mB) mB.disabled=!enabled;\n  } else {\n    const ta=document.getElementById(`reciteInput-${idx}`); if(ta) ta.disabled=!enabled;\n    const m=document.getElementById(`reciteMic-${idx}`); if(m) m.disabled=!enabled;\n  }\n}\n\n// Timestamp per pool index of when the current reading attempt started \u2014\n// reset every time the panel opens or Try Again is pressed, so the timer\n// always measures THIS attempt, not time spent sitting on the page.\nconst _reciteStartTs = {};\nlet _reciteTimerInterval = null; // one shared interval \u2014 only one panel is realistically open at a time\n\nfunction getReciteReferenceText(entry){\n  return entry.qtype===\"distinguish\" ? (entry.answerA+\" \"+entry.answerB) : entry.answer;\n}\n\nfunction resetReciteTimerBar(idx){\n  const bar = document.getElementById(`reciteTimerBar-${idx}`);\n  const pts = document.getElementById(`reciteTimerPts-${idx}`);\n  if(bar){ bar.style.width=\"100%\"; bar.style.background=\"#4a9873\"; }\n  if(pts){ pts.style.background=\"#4a9873\"; pts.textContent=\"\u26a1 calculating\u2026\"; }\n}\n\n// Same live countdown-bonus bar Practice mode's writing questions already\n// use \u2014 a shrinking bar and a running \"+N pts if done in Xs\" message \u2014 just\n// scoped to this recite panel's own fast/good thresholds (scaled to how\n// long THIS answer should take to read aloud).\nfunction startReciteTimer(idx){\n  stopReciteTimer();\n  const entry = _reviseRecitePool[idx];\n  if(!entry) return;\n  const expected = expectedReadMs(getReciteReferenceText(entry));\n  const fastMs = expected, goodMs = expected*1.6;\n  const fastPts = READ_SPEED_MARKS.fast, goodPts = READ_SPEED_MARKS.good;\n  const startMs = _reciteStartTs[idx] || Date.now();\n\n  function fmtCountdown(ms){\n    if(ms<=0) return \"0s\";\n    const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);\n    return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}s`;\n  }\n\n  function tick(){\n    const elapsed = Date.now() - startMs;\n    const bar = document.getElementById(`reciteTimerBar-${idx}`);\n    const pts = document.getElementById(`reciteTimerPts-${idx}`);\n    if(!bar){ stopReciteTimer(); return; }\n\n    if(elapsed <= fastMs){\n      const rem = fastMs - elapsed;\n      bar.style.width = Math.max(0,(rem/fastMs)*100)+\"%\";\n      bar.style.background = \"#4a9873\";\n      if(pts){ pts.style.background=\"#4a9873\"; pts.textContent=\"\u26a1 +\"+fastPts+\" pts if done in \"+fmtCountdown(rem); }\n    } else if(elapsed <= goodMs){\n      const rem = goodMs - elapsed;\n      bar.style.width = Math.max(0,(rem/(goodMs-fastMs))*100)+\"%\";\n      bar.style.background = \"#cf8f2e\";\n      if(pts){ pts.style.background=\"#cf8f2e\"; pts.textContent=\"\ud83d\udd50 +\"+goodPts+\" pts if done in \"+fmtCountdown(rem); }\n    } else {\n      bar.style.width = \"0%\";\n      bar.style.background = \"#ccc\";\n      if(pts){ pts.style.background=\"#aaa\"; pts.textContent=\"No speed bonus now \u2014 still worth finishing!\"; }\n    }\n  }\n\n  tick();\n  _reciteTimerInterval = setInterval(tick, 500);\n}\nfunction stopReciteTimer(){\n  if(_reciteTimerInterval){ clearInterval(_reciteTimerInterval); _reciteTimerInterval=null; }\n}\n\nfunction toggleRecitePanel(idx){\n  const panel = document.getElementById(`recitePanel-${idx}`);\n  if(!panel) return;\n  const opening = panel.style.display===\"none\" || !panel.style.display;\n  if(opening) openRecitePanel(idx); else closeRecitePanel(idx);\n}\n\nfunction openRecitePanel(idx){\n  const panel = document.getElementById(`recitePanel-${idx}`);\n  const entry = _reviseRecitePool[idx];\n  if(!panel || !entry) return;\n  panel.style.display = \"block\";\n  // Only reset to a fresh, unlocked state if it ISN'T already locked from a\n  // previous check. Reopening a panel that was left locked (checked, but\n  // never cleared or Try-Again'd) must NOT be a backdoor to resubmit that\n  // same unedited answer for duplicate points -- it stays locked, still\n  // showing the last result, until the answer is actually cleared.\n  const checkBtn = document.getElementById(`reciteCheckBtn-${idx}`);\n  const alreadyLocked = !!(checkBtn && checkBtn.disabled);\n  if(!alreadyLocked){\n    setReciteInputsEnabled(idx, entry, true);\n    const resultEl = document.getElementById(`reciteResult-${idx}`);\n    if(resultEl) resultEl.innerHTML = \"\";\n  }\n  _reciteStartTs[idx] = Date.now();\n  resetReciteTimerBar(idx);\n  startReciteTimer(idx);\n}\n\n// The one, unambiguous way back to normal Revise view \u2014 always stops any\n// mic still listening, always collapses the panel.\nfunction closeRecitePanel(idx){\n  const panel = document.getElementById(`recitePanel-${idx}`);\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  stopReciteTimer();\n  if(panel) panel.style.display = \"none\";\n}\n\n// Clears the attempt and restarts the timer for a fresh, fairly-timed re-read.\nfunction tryAgainRecite(idx){\n  const entry = _reviseRecitePool[idx];\n  if(!entry) return;\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  if(entry.qtype===\"distinguish\"){\n    const taA=document.getElementById(`reciteInputA-${idx}`); if(taA) taA.value=\"\";\n    const taB=document.getElementById(`reciteInputB-${idx}`); if(taB) taB.value=\"\";\n  } else {\n    const ta=document.getElementById(`reciteInput-${idx}`); if(ta) ta.value=\"\";\n  }\n  const resultEl = document.getElementById(`reciteResult-${idx}`);\n  if(resultEl) resultEl.innerHTML = \"\";\n  setReciteInputsEnabled(idx, entry, true); // unlock for the next attempt\n  _reciteStartTs[idx] = Date.now(); // restart the clock \u2014 a fresh attempt deserves a fresh timer\n  resetReciteTimerBar(idx);\n  startReciteTimer(idx);\n}\n\n// Expected reading time for a given answer, scaled to its word count at a\n// comfortable reading-aloud pace \u2014 a one-sentence answer and a five-point\n// list shouldn't be held to the same fixed time limit.\nfunction expectedReadMs(text){\n  const words = (text||\"\").trim().split(/\\s+/).filter(Boolean).length || 1;\n  return (words / READ_WPM) * 60000 + READ_START_BUFFER_MS;\n}\n\nfunction checkRecite(idx){\n  const entry = _reviseRecitePool[idx];\n  if(!entry) return;\n  const resultEl = document.getElementById(`reciteResult-${idx}`);\n  if(!resultEl) return;\n\n  // Stop any mic still listening/transcribing before reading the textareas \u2014\n  // otherwise recognition keeps running in the background after Check.\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  stopReciteTimer(); // freeze the display at the final time instead of leaving it ticking behind a locked panel\n\n  const elapsed = Date.now() - (_reciteStartTs[idx] || Date.now());\n  _reciteAttemptCounts[idx] = (_reciteAttemptCounts[idx]||0) + 1;\n  const tries = _reciteAttemptCounts[idx];\n\n  let pct, diffHTML, referenceText;\n  if(entry.qtype===\"distinguish\"){\n    const textA = document.getElementById(`reciteInputA-${idx}`)?.value.trim() || \"\";\n    const textB = document.getElementById(`reciteInputB-${idx}`)?.value.trim() || \"\";\n    const { pct:pctA } = scoreAnswer(textA, entry.answerA);\n    const { pct:pctB } = scoreAnswer(textB, entry.answerB);\n    pct = Math.round((pctA+pctB)/2);\n    referenceText = entry.answerA + \" \" + entry.answerB;\n    diffHTML = `\n      <div class=\"result-section-title\" style=\"margin-bottom:4px\">${entry.termA}<\u002Fdiv>\n      ${buildAnnotatedDiff(textA, entry.answerA)}\n      <div class=\"result-section-title\" style=\"margin:10px 0 4px\">${entry.termB}<\u002Fdiv>\n      ${buildAnnotatedDiff(textB, entry.answerB)}`;\n  } else {\n    const text = document.getElementById(`reciteInput-${idx}`)?.value.trim() || \"\";\n    const { pct:p } = scoreAnswer(text, entry.answer);\n    pct = p;\n    referenceText = entry.answer;\n    diffHTML = buildAnnotatedDiff(text, entry.answer);\n  }\n\n  setReciteInputsEnabled(idx, entry, false); // lock until Try Again \u2014 same reasoning as Practice mode's post-check lock\n\n  const READ_ACCURACY_MIN = 70; // needs to genuinely match the answer, not just finish fast, to earn any speed points\n  let speedNote = \"\";\n  if(pct >= READ_ACCURACY_MIN){\n    const expected = expectedReadMs(referenceText);\n    const tier = elapsed <= expected ? \"fast\" : elapsed <= expected*1.6 ? \"good\" : null;\n    if(tier) speedNote = awardReadSpeedBonus(entry, tier);\n  }\n\n  // Read & Memorise streak: reading the SAME passage well (80%+ match)\n  // several times in a row builds toward a bonus -- checking a DIFFERENT\n  // question before reaching the target, or any read below 80%, forfeits\n  // the progress and starts the count over (from the new question, if\n  // that's what triggered the reset). Always shown so he can see the count\n  // building, not just the moment the bonus fires.\n  let streakNote = \"\";\n  const hadStreak = _reciteStreakCount > 0;\n  if(pct >= RECITE_STREAK_MIN_ACCURACY){\n    if(_reciteStreakIdx === idx){ _reciteStreakCount++; } else { _reciteStreakIdx = idx; _reciteStreakCount = 1; }\n    if(_reciteStreakCount >= RECITE_STREAK_TARGET){\n      streakNote = awardReciteStreakBonus(entry);\n      _reciteStreakCount = 0;\n      _reciteStreakIdx = null;\n    } else {\n      const remaining = RECITE_STREAK_TARGET - _reciteStreakCount;\n      streakNote = `<div class=\"recite-tries\" style=\"color:var(--gold,#9c7519);font-weight:700\">\ud83d\udd25 ${_reciteStreakCount}/${RECITE_STREAK_TARGET} well-read in a row \u2014 ${remaining} more for +${RECITE_STREAK_BONUS_POINTS}!<\u002Fdiv>`;\n    }\n  } else {\n    _reciteStreakCount = 0;\n    _reciteStreakIdx = null;\n    if(hadStreak) streakNote = `<div class=\"recite-tries\" style=\"color:var(--muted)\">Streak reset \u2014 read it clearly (${RECITE_STREAK_MIN_ACCURACY}%+ match) to start building toward the bonus again.<\u002Fdiv>`;\n  }\n\n  const cls = pct>=80 ? \"great\" : pct>=50 ? \"ok\" : \"low\";\n  const chipLabel = pct>=READ_ACCURACY_MIN ? \"\ud83d\udcd6 Well read!\" : \"Read it again more clearly\";\n  resultEl.innerHTML = `\n    <div class=\"recite-result-chip ${cls}\">${chipLabel} \u2014 ${pct}% match<\u002Fdiv>\n    ${diffHTML}\n    ${speedNote}\n    ${streakNote}\n    <div class=\"recite-tries\">Read ${tries} time${tries!==1?\"s\":\"\"} this session \u2014 go again anytime.<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:10px\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainRecite(${idx})\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"closeRecitePanel(${idx})\">\u2713 Done, back to revising<\u002Fbutton>\n    <\u002Fdiv>`;\n\n  if(pct>=80) showReciteCelebration();\n}\n\n// Awards a small Growth Points bonus scaled to reading pace \u2014 \"fast\" pays\n// more than \"good,\" mirroring Practice mode's own speed-bonus tiers. Unlike\n// the old one-time recall bonus, this can be earned again each time it's\n// read quickly and accurately \u2014 genuinely re-reading something fast and\n// correctly is real practice, not a loophole.\nconst READ_SPEED_MARKS = { fast: 3, good: 1 };\n\n// Read & Memorise streak bonus -- getting the SAME passage right (80%+\n// match) several times in a row is a genuine \"I've actually got this now\"\n// signal, worth its own small repeatable bonus. Session-local (like the\n// spelling gate's done-keys) since it's about building fluency right now,\n// not a permanent record -- it resets on a fresh visit to the app.\nconst RECITE_STREAK_MIN_ACCURACY = 80;\nconst RECITE_STREAK_TARGET = 3;\nconst RECITE_STREAK_BONUS_POINTS = 10;\nlet _reciteStreakCount = 0;\nlet _reciteStreakIdx = null;\n\nfunction awardReciteStreakBonus(entry){\n  if(!currentLesson) return \"\";\n  fbLogEntry(\"logs\", {\n    subject: currentSubject||\"\", part: currentPart||\"\", lessonId: currentLesson.id,\n    lessonTitle: `\ud83d\udd25 ${RECITE_STREAK_TARGET} in a row well-read \u2014 ${currentLesson.title||\"\"}`,\n    qtype: \"recitestreak\", qIndex: entry.qIndexInType,\n    pct: 100, timeMs: 0, marks: RECITE_STREAK_BONUS_POINTS\n  });\n  bumpGrowthPointsBadge(RECITE_STREAK_BONUS_POINTS);\n  showPointsToast(RECITE_STREAK_BONUS_POINTS, `\ud83d\udd25 ${RECITE_STREAK_TARGET} well-read in a row!`);\n  return `<div class=\"recite-result-chip great\" style=\"margin-top:6px\">\ud83d\udd25 ${RECITE_STREAK_TARGET} in a row! +${RECITE_STREAK_BONUS_POINTS}<\u002Fdiv>`;\n}\nfunction awardReadSpeedBonus(entry, tier){\n  if(!currentLesson) return \"\";\n  const reciteQtype = `recite_${tier}_${entry.qtype}`;\n  fbLogEntry(\"logs\", {\n    subject: currentSubject||\"\", part: currentPart||\"\", lessonId: currentLesson.id,\n    lessonTitle: currentLesson.title||\"\", qtype: reciteQtype, qIndex: entry.qIndexInType,\n    pct: 100, timeMs: 0\n  });\n  const points = READ_SPEED_MARKS[tier];\n  bumpGrowthPointsBadge(points);\n  const label = tier===\"fast\" ? \"\u26a1 Fast, accurate read!\" : \"\ud83d\udd50 Good pace!\";\n  showPointsToast(points, label);\n  return `<div class=\"recite-result-chip ${tier===\"fast\"?\"great\":\"ok\"}\" style=\"margin-top:6px\">${label} +${points}<\u002Fdiv>`;\n}\n\n// Purely visual, no points involved \u2014 a quick, warm confirmation moment\n// distinct from showPointsToast so it's never mistaken for Growth Points.\nfunction showReciteCelebration(){\n  let stack = document.getElementById(\"pointsToastStack\");\n  if(!stack){\n    stack = document.createElement(\"div\");\n    stack.id = \"pointsToastStack\";\n    stack.style.cssText = \"position:fixed;top:14px;right:14px;z-index:99997;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none\";\n    document.body.appendChild(stack);\n  }\n  const toast = document.createElement(\"div\");\n  toast.style.cssText = \"background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;white-space:nowrap\";\n  toast.textContent = \"\ud83c\udfaf Nailed that read!\";\n  stack.appendChild(toast);\n  requestAnimationFrame(()=>{\n    toast.style.opacity = \"1\";\n    toast.style.transform = \"translateY(0) scale(1)\";\n  });\n  setTimeout(()=>{\n    toast.style.opacity = \"0\";\n    toast.style.transform = \"translateY(-8px) scale(.9)\";\n    setTimeout(()=>toast.remove(), 250);\n  }, 1800);\n}\n\nfunction renderSpellingRoundIntro(root){\n  const icon = DATA[_spellingSubject]?.icon || \"\ud83d\udd24\";\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:20px 16px\">\n      <div style=\"font-size:36px;margin-bottom:10px\">${icon}<\u002Fdiv>\n      <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:2px\">${_spellingSubject||\"Spelling Practice\"}<\u002Fh3>\n      <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">\n        ${_spellingWords.length} word${_spellingWords.length!==1?\"s\":\"\"} from your real mistakes in this subject.\n        This round: ${_spellingRoundSize} word${_spellingRoundSize!==1?\"s\":\"\"}, starting with the ones you've missed most. <b>+1 point<\u002Fb> per correct spelling.\n      <\u002Fp>\n      <button onclick=\"startSpellingRound()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Start \u25b6<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\nfunction startSpellingRound(){\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  renderSpellingQuestion();\n}\n\nfunction renderSpellingQuestion(){\n  const root = document.getElementById(\"spellingGameRoot\");\n  if(!root) return;\n\n  if(_spellingIdx >= _spellingRoundSize){\n    renderSpellingRoundResult(root);\n    return;\n  }\n\n  const item = _spellingWords[_spellingIdx];\n  const word = item.word;\n\n  // Show the word until HE says he's ready to move on -- no fixed timer.\n  // A student who reads more slowly deserves exactly as long as he needs\n  // to actually take the word in, not a countdown that might cut him off\n  // mid-read. Matches the same self-paced Show/Hide pattern already used\n  // for studying a poem before reciting it.\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:10px 16px\">\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:4px\">Word ${_spellingIdx+1} of ${_spellingRoundSize}<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:16px\">${item.lessonTitle||\"\"}<\u002Fdiv>\n      <div style=\"font-size:28px;font-weight:800;letter-spacing:2px;color:var(--navy);margin-bottom:20px;font-family:Georgia,serif\">${word}<\u002Fdiv>\n      <p style=\"font-size:13px;color:var(--muted);margin-bottom:14px\">Take your time to memorise the spelling.<\u002Fp>\n      <button onclick=\"revealSpellingInput()\" style=\"padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer\">I'm ready \u25b6<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\n// Called once he's actually ready \u2014 hides the word and shows the input,\n// at whatever pace HE chose rather than a fixed delay.\nfunction revealSpellingInput(){\n  const root = document.getElementById(\"spellingGameRoot\");\n  if(!root) return;\n  const item = _spellingWords[_spellingIdx];\n  if(!item) return; // may have navigated away\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:10px 16px\">\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:4px\">Word ${_spellingIdx+1} of ${_spellingRoundSize}<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:16px\">${item.lessonTitle||\"\"}<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--navy);margin-bottom:10px\">Now type it from
