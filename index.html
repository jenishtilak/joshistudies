  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r:#9c7519}\n.lesson-score-badge.poor{background:var(--red-light);color:var(--red)}\n\n/* \u2500\u2500 BOTTOM NAV \u2500\u2500 */\n.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:300;height:60px}\n@media(min-width:820px){.bottom-nav{display:none}}\n.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--muted);gap:2px;text-transform:uppercase;transition:color .2s}\n.nav-item.active{color:var(--navy)}\n.nav-icon{font-size:20px}\n\n/* \u2500\u2500 QUIZ OVERLAY \u2500\u2500 */\n.quiz-overlay{display:none;position:fixed;inset:0;z-index:500;background:var(--parchment);flex-direction:column;overflow-y:auto}\n.quiz-overlay.visible{display:flex}\n@media(min-width:820px){.quiz-overlay{left:var(--sidebar-w)}}\n\n.quiz-header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;flex-shrink:0}\n.quiz-growth-badge{background:rgba(73,181,126,.18);color:#8ad4ab;font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;white-space:nowrap;transition:transform .2s}\n.quiz-growth-badge.bump{transform:scale(1.18)}\n.back-btn{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}\n.quiz-title-wrap{flex:1;min-width:0}\n.quiz-lesson-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.quiz-part-label{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}\n.q-counter{font-size:12px;color:rgba(255,255,255,.6);flex-shrink:0}\n.progress-bar{height:3px;background:rgba(255,255,255,.15);flex-shrink:0}\n.progress-fill{height:100%;background:var(--gold);transition:width .4s ease}\n\n/* \u2500\u2500 QUESTION TYPE TABS (inside quiz) \u2500\u2500 */\n.qtype-tabs-wrap{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollba 00;color:var(--navy);padding:3px 8px;min-width:130px;max-width:200px;outline:none;font-family:inherit;border-radius:0;vertical-align:baseline;transition:border-color .2s}\n.blank-input:focus{border-bottom-color:var(--gold);background:var(--gold-light)}\n.blank-input:disabled{background:transparent}\n.fill-sentence{font-size:16px;line-height:2.4;color:var(--text);padding:16px;background:var(--parchment);border-radius:var(--radius)}\n\n/* match the following */\n.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}\n.match-col-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}\n.match-left-item{background:var(--parchment);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:8px}\n.match-right-select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);margin-bottom:8px;outline:none;cursor:pointer}\n.match-right-select:focus{border-color:var(--navy)}\n\n/* MCQ / choose correct */\n.mcq-options{display:flex;flex-direction:column;gap:8px;margin-top:14px}\n.mcq-option{background:var(--parchment);border:1.5px solid transparent;border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}\n.mcq-option:hover{border-color:var(--navy);background:#fff;transform:translateY(-1px);box-shadow:var(--shadow)}\n.mcq-option.selected{border-color:var(--navy);background:#fff}\n.mcq-option.correct{border-color:var(--green);background:var(--green-light);color:var(--green)}\n.mcq-option.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}\n.mcq-opt-letter{width:24px;height:24px;border-radius:50%;background:rgba(32,42,61,.1);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.mcq-option.selected .mcq-opt-letter{background:var(--navy);color:#fff}\n.mcq-option.correct .mcq-opt-letter{background:var(--green);color:#fff}\n.mcq-option.wrong   .mcq-opt-letter{background:var(--red);color:#fff}\n\n/* answer textarea */\n.answer-area{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}\n.answer-textarea{width:100%;min-height:130px;padding:16px;font-size:15px;font-family:inherit;border:none;outline:none;resize:none;color:var(--text);background:transparent;line-height:1.6}\n.answer-textarea:disabled{background:var(--parchment);color:var(--muted);cursor:not-allowed;opacity:.6}\n.answer-actions{display:flex;border-top:1px solid var(--border)}\n.btn-check{flex:1;padding:13px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;letter-spacing:.4px;transition:background .2s;font-family:inherit}\n.btn-check:disabled{opacity:.5;cursor:default}\n.btn-check:hover:not(:disabled){background:var(--navy-light)}\n.btn-skip{padding:13px 18px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border:none;border-left:1px solid var(--border);cursor:pointer;font-family:inherit}\n.ai-feedback-box{font-size:13.5px;line-height:1.8;color:var(--text);border-left:3px solid var(--navy);padding-left:12px;white-space:pre-line;margin-top:10px}\n.ai-graded-badge{display:inline-block;font-size:10px;font-weight:700;background:rgba(32,42,61,.08);color:var(--navy);padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}\n\n/* result panel */\n.result-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;display:none}\n.result-panel.visible{display:block}\n.score-stamp{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}\n.score-circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;border:3px solid}\n.score-c r:var(--navy);font-size:14px;font-weight:700;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:border-color .2s,background .2s}\n.btn-try-again:hover{border-color:var(--navy);background:var(--parchment)}\n\n/* no questions placeholder */\n.no-questions{padding:32px 16px;text-align:center;color:var(--muted)}\n.no-questions .nq-icon{font-size:36px;margin-bottom:10px}\n.no-questions p{font-size:14px}\n\n/* summary */\n.summary-screen{display:none;padding:32px 16px;text-align:center;max-width:500px;margin:0 auto;width:100%}\n.summary-screen.visible{display:block}\n.summary-trophy{font-size:56px;margin-bottom:12px}\n.summary-title{font-size:22px;font-weight:800;color:var(--navy);font-family:var(--font-display)}\n.summary-score{font-size:52px;font-weight:900;color:var(--gold);margin:14px 0 4px;font-family:var(--font-display)}\n.summary-subtitle{font-size:14px;color:var(--muted);margin-bottom:24px}\n.summary-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}\n.stat-box{background:#fff;border-radius:var(--radius);padding:14px 8px;box-shadow:var(--shadow)}\n.stat-num{font-size:24px;font-weight:800}\n.stat-num.green{color:var(--green)} .stat-num.amber{color:#9c7519} .stat-num.red{color:var(--red)}\n.stat-label{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}\n.btn-retry{width:100%;padding:14px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;margin-bottom:10px;font-family:inherit}\n.btn-back-lessons{width:100%;padding:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-family:inherit}\n\n/* \u2500\u2500 WELCOME / PASSCODE SCREEN \u2500\u2500 */\n.welcome-screen{\n  position:fixed;inset:0;z-index: ;letter-spacing:.4px;\n  transition:opacity .2s,transform .15s,box-shadow .2s;\n  box-shadow:0 6px 20px rgba(209,152,63,.25);\n}\n.wl-btn:hover{opacity:.95;transform:translateY(-1px);box-shadow:0 8px 24px rgba(209,152,63,.35)}\n.wl-btn:active{transform:scale(.98)}\n.wl-footer{font-size:11px;color:rgba(255,255,255,.25);margin-top:28px}\n\n::-webkit-scrollbar{width:6px;height:6px}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}\n\n.mode-toggle{display:flex;background:var(--parchment);border-radius:8px;padding:2px;gap:2px;flex-shrink:0}\n.mode-toggle-btn{padding:4px 8px;border:none;border-radius:6px;background:transparent;font-size:14px;cursor:pointer;transition:background .15s;line-height:1}\n.mode-toggle-btn.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}\n.q-timer-bar{display:flex;align-items:center;gap:6px;padding:4px 14px;background:var(--parchment);border-bottom:1px solid var(--border);font-size:12px}\n.q-timer-bar .q-timer-label{color:var(--muted);font-weight:500}\n.q-timer-bar .q-timer{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;font-size:12px}\n\n/* \u2500\u2500 MOCK EXAM ANSWER SHEET \u2500\u2500 */\n.mock-answer-sheet{display:none;padding:20px 16px 40px;max-width:700px;margin:0 auto}\n.mock-answer-sheet.visible{display:block}\n.mas-header{text-align:center;padding-bottom:20px;border-bottom:2px dashed var(--border);margin-bottom:24px}\n.mas-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:4px;font-family:var(--font-display)}\n.mas-meta{font-size:12px;color:var(--muted);margin-bottom:16px}\n.mas-mark-row{display:flex;justify-content:center;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}\n.mas-stats{display:flex;gap:16px;justify-content:center;margin-top:16px}\n.mas-stat{text-align:center}\n.mas-stat-num{font-size:22px;font-weight:800}\n.mas-stat-num.green{color:var(--green)}\n.mas-stat-num.amber{color:#cf8f2e}\n.mas-stat-num.red{color:var(--red)}\n.mas-stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}\n\n/* Per-question card */\n.mas-q-card{border-radius:12px;padding:16px;margin-bottom:14px;border:1.5px solid var(--border);background:#fff;position:relative}\n.mas-q-card.good{border-color:var(--green);background:var(--green-light)}\n.mas-q-card.mid {border-color:#cf8f2e;background:var(--gold-light)}\n.mas-q-card.poor{border-color:var(--red);background:var(--red-light)}\n.mas-q-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}\n.mas-q-num{font-size:11px;font-weight:700;color:var(--muted);flex:1}\n.mas-q-type{font-size:10px;background:var(--navy);color:#fff;border-radius:10px;padding:2px 7px;font-weight:700}\n.mas-q-score{font-size:13px;font-weight:800;font-family:'Courier New',monospace}\n.mas-q-score.good{color:var(--green)}\n.mas-q-score.mid {color:#9c7519}\n.mas-q-score.poor{color:var(--red)}\n.mas-q-time{font-size:11px;color:var(--muted)}\n.mas-q-text{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;line-height:1.5}\n.mas-section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}\n.mas-section-lbl.yours{color:var(--muted)}\n.mas-section-lbl.model{color:var(--green)}\n.mas-your-ans{font-size:13px;line-height:1.8;padding:8px 10px;background:rgba(255,255,255,.7);border-radius:6px;margin-bottom:8px}\n.mas-model-ans{font-size:13px;line-height:1.8;padding:8px 10px;background:var(--green-light);border-radius:6px;border-left:3px solid var(--green);white-space:pre-line;color:var(--text)}\n\n/* Spelling report */\n.mas-section-heading{font-size:13px;font-weight:800;color:var(--navy);margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border)}\n.spell-table{width:100%;border-collapse:collapse;font-size:13px}\n.spell-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}\n.spell-table td{padding:8px 12px;b -weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:6px 10px;background:var(--parchment);border-radius:6px;margin-bottom:12px;display:flex;align-items:center;gap:6px}\n.revise-card{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07);padding:16px;margin-bottom:12px}\n.revise-q-num{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}\n.revise-q{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;line-height:1.5}\n.revise-answer{font-size:13px;line-height:1.9;color:var(--text);border-left:3px solid var(--green);padding-left:12px;white-space:pre-line}\n.revise-mcq-opt{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--parchment);color:var(--muted);margin-bottom:5px}\n.revise-mcq-opt.correct{background:var(--green-light);color:var(--green);font-weight:700;border-left:3px solid var(--green)}\n.revise-blank{display:inline-block;background:var(--green-light);color:var(--green);font-weight:700;border-bottom:2px solid var(--green);padding:0 8px;border-radius:4px;margin:0 2px}\n.revise-match-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}\n.revise-match-table th{background:var(--navy);color:#fff;padding:7px 10px;font-size:11px;font-weight:700;text-align:left}\n.revise-match-table td{padding:7px 10px;border:1px solid var(--border)}\n.revise-match-table tr:nth-child(odd) td{background:var(--parchment)}\n.revise-spelling-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;margin-bottom:20px;background:rgba(73,181,126,.12);border:1.5px solid rgba(73,181,126,.35);border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;transition:transform .15s}\n.revise-spelling-cta:hover{transform:translateY(-1px)}\n.revise-spelling-cta:active{transform:scale(.98)}\n.revise-spelling-cta .rsc-title{font-size:14px;font-weight:800;color:var(--green)}\n.revise-spelling-cta .rsc-sub{font-size:11.5px;color:var(--mute RLAY -->\n<div class=\"quiz-overlay\" id=\"quizOverlay\">\n  <div class=\"quiz-header\">\n    <button class=\"back-btn\" onclick=\"closeQuiz()\">\u2190<\u002Fbutton>\n    <div class=\"quiz-title-wrap\">\n      <div class=\"quiz-lesson-title\" id=\"quizLessonTitle\"><\u002Fdiv>\n      <div class=\"quiz-part-label\" id=\"quizPartLabel\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mode-toggle\" id=\"modeToggle\">\n      <button class=\"mode-toggle-btn\" id=\"toggleRevise\" onclick=\"openRevise(currentLesson)\">\ud83d\udcd6<\u002Fbutton>\n      <button class=\"mode-toggle-btn\" id=\"togglePractice\" onclick=\"openLesson(currentLesson)\">\u270f\ufe0f<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"quiz-timer\" id=\"quizTimer\">0:00<\u002Fdiv>\n    <div class=\"quiz-growth-badge\" id=\"quizGrowthBadge\" title=\"Your Growth Points \u2014 updates live as you earn them\">\ud83c\udf31 \u2026<\u002Fdiv>\n    <div class=\"q-counter\" id=\"qCounter\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"progress-bar\">\n    <div class=\"progress-fill\" id=\"progressFill\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"q-timer-bar\">\n    <span class=\"q-timer-label\">This question:<\u002Fspan>\n    <span class=\"q-timer\" id=\"qTimer\">0:00<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- Question-type tabs -->\n  <div class=\"qtype-tabs-wrap\">\n    <div class=\"qtype-tabs\" id=\"qtypeTabs\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Question navigation bar -->\n  <div class=\"q-nav-bar\" id=\"qNavBar\" style=\"display:none\"><\u002Fdiv>\n\n  <div class=\"quiz-body\" id=\"quizBody\">\n    <!-- question + answer rendered here dynamically -->\n  <\u002Fdiv>\n\n  <!-- MOCK EXAM ANSWER SHEET -->\n  <div class=\"mock-answer-sheet\" id=\"mockAnswerSheet\"><\u002Fdiv>\n\n  <!-- Practice test submit button - fixed at bottom -->\n  <div class=\"mock-submit-bar\" id=\"mockSubmitBar\" style=\"display:none\">\n    <div class=\"mock-submit-progress\" id=\"mockSubmitProgress\">0 / 0 answered<\u002Fdiv>\n    <button class=\"mock-submit-btn\" onclick=\"submitMockExam()\">Submit Exam \u2713<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- STUDY MODE summary -->\n  <div class=\"summary-screen\" id=\"summaryScreen\">\n    <div class=\"summary-trophy\" id=\"summaryTrophy\">\ud83c\udfc6<\u002Fdiv>\n    <div class=\"summary-title\">Section Complete!<\u002Fdiv>\n    <div class=\"teacher-mark-wrap\">\n      <div class=\"teacher-mark\" id=\"teacherMark\">\n        <span class=\"tm-tick\" id=\"teacherTick\"><\u002Fspan>\n        <div class=\"tm-score\" id=\"teacherScore\"><\u002Fdiv>\n        <div class=\"tm-sep\"><\u002Fdiv>\n        <div class=\"tm-denom\">100<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"teacher-motivation\" id=\"teacherMotivation\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"summary-stats\">\n      <div class=\"stat-box\"><div class=\"stat-num green\" id=\"statCorrect\">0<\u002Fdiv><div class=\"stat-label\">Correct<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat-box\"><div class=\"stat-num amber\" id=\"statPartial\">0<\u002Fdiv><div class=\"stat-label\">Partial<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat-box\"><div class=\"stat-num red\" id=\"statWrong\">0<\u002Fdiv><div class=\"stat-label\">Wrong<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"summary-total-time\" id=\"summaryTotalTime\"><\u002Fdiv>\n    <button class=\"btn-retry\" onclick=\"retrySection()\">\ud83d\udd01 Try Again<\u002Fbutton>\n    <button class=\"btn-back-lessons\" onclick=\"closeQuiz()\">\u2190 Back to Lessons<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- EXAM MODE answer paper -->\n  <div class=\"answer-paper\" id=\"answerPaper\">\n    <div class=\"paper-header\">\n      <div class=\"paper-title\" id=\"paperTitle\">Answer Paper<\u002Fdiv>\n      <div class=\"paper-meta\" id=\"paperMeta\"><\u002Fdiv>\n      <div class=\"paper-mark-wrap\">\n        <div class=\"paper-teacher-mark\" id=\"paperTeacherMark\">\n          <span class=\"ptm-tick\" id=\"paperTeacherTick\"><\u002Fspan>\n          <div class=\"ptm-score\" id=\"paperTeacherScore\"><\u002Fdiv>\n          <div class=\"ptm-sep\"><\u002Fdiv>\n          <div class=\"ptm-denom\">100<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"paper-motivation\" id=\"paperMotivation\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"paperQuestions\"><\u002Fdiv>\n    <div class=\"paper-actions\">\n      <button class=\"btn-retry\" onclick=\"retrySection()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-back-lessons\" onclick=\"closeQuiz()\">\u2190 Back<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script>\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  QUESTION TYPE CONSTANTS\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst QTYPES = [\n  { id:\"mcq\",         label:\"Choose Correct\",             icon:\"\ud83d\udd18\", marks:1 },\n  { id:\"fill\",        label:\"Fill in the Blanks\",          icon:\"\u270f\ufe0f\",  marks:1 },\n  { id:\"match\",       label:\"Match the Following\",         icon:\"\ud83d\udd17\",  marks:5 },\n  { id:\"brief\",       label:\"Answer in Brief\",             icon:\"\ud83d\udcdd\",  marks:2 },\n  { id:\"truefalse\",   label:\"True or False\",               icon:\"\u2705\",  marks:1 },\n  { id:\"reasons\",     label:\"Give Reasons\",                icon:\"\ud83d\udca1\",  marks:2 },\n  { id:\"distinguish\", label:\"Distinguish Between\",         icon:\"\u2696\ufe0f\",  marks:3 },\n  { id:\"paragraph\",   label:\"Answer in Paragraph/Detail\",  icon:\"\ud83d\udcc4\",  marks:5 },\n  { id:\"memorise\",    label:\"Quote from Memory\",           icon:\"\ud83c\udfa4\",  marks:3 },\n];\n\n// Genuine answered-question types only -- excludes bonus/achievement pseudo\n// entries (goodwill, milestone, lessonmastery, dailygoal, etc.) that also\n// live in the same logs collection but aren't a real question attempt, so\n// they can't quietly skew accuracy-based insights (a milestone bonus always\n// logs pct:100, which isn't \"he got a question right\").\nconst REAL_QTYPES = new Set(QTYPES.map(q=>q.id));\n\n// Small, flat bonus for Revise mode's Recite & Check \u2014 deliberately worth\n// less than a real Practice-mode answer. Defined here (not down near the\n// Recite code) so getMarks can use the exact same number the toast shows \u2014\n// otherwise the toast risks promising an amount the Scoreboard doesn't\n// actually count, the same disconnect that turned up in the Growth Points\n// audit below.\nconst RECITE_BONUS_MARKS = 2;\n\n// Small, flat bonus for simply practicing a question again -- earned on\n// EVERY real attempt (right or wrong), separately from the correctness-based\n// marks above. The goal here is rewarding repetition itself, since getting\n// more reps in on a hard question matters even before he gets it right.\n// Skipping a question isn't practicing it, so skips are excluded (see\n// logQuestion's isSkip param).\nconst PRACTICE_BONUS_MARKS = 1;\n\n// Daily \"real memorization\" target -- a realistic number of genuine\n// memorize/recite reps per day. Quick-recall questions (MCQ etc.) can be\n// done 10-15 in 5 minutes, but real memorization is slower -- a handful of\n// solid reps a day is the honest, achievable target, not a big number.\n// Daily Practice Goal \u2014 tiered targets for attempting UNIQUE higher-mark\n// questions (Match, Brief, Give Reasons, Distinguish, Paragraph, Quote from\n// Memory) in Practice mode today. Deliberately excludes the 1-mark types\n// (MCQ, Fill, True/False) -- those are quick recognition checks, not real\n// practice. Revise-mode activity (read-aloud, Read & Memorise) doesn't\n// count either -- only a genuine Practice-mode attempt does. Tiers stack\n// through the day, each unlocking its own bonus, so progress feels\n// immediate rather than all-or-nothing.\nconst DAILY_PRACTICE_TIERS = [\n  { count:3,  points:10  },\n  { count:5,  points:20  },\n  { count:10, points:40  },\n  { count:15, points:60  },\n  { count:20, points:100 },\n];\nconst PRACTICE_GOAL_QTYPES = [\"match\",\"brief\",\"reasons\",\"distinguish\",\"paragraph\",\"memorise\"];\n\n// Returns only question types that actually have questions somewhere in the data.\n// Used by the daily goal so students aren't penalised for a missing type (e.g. no\n// True/False in English Grammar). Recomputed each call since data could expand.\nfunction getActiveQTypes(){\n  const present = new Set();\n  for(const subj of Object.values(DATA))\n    for(const part of Object.values(subj.parts))\n      for(const lesson of part.lessons)\n        for(const qt of QTYPES)\n          if((lesson.questions[qt.id]||[]).length > 0) present.add(qt.id);\n  return QTYPES.filter(qt => present.has(qt.id));\n}\n\n// Get marks for a question type. \"recite_fast_<qtype>\" / \"recite_good_<qtype>\"\n// tags (from Revise mode's Read & Memorise) are a distinct, deliberately-small\n// speed bonus \u2014 not one of the real QTYPES \u2014 so they're matched explicitly.\n// Bare \"recite_<qtype>\" (no fast/good) is the older one-time recall-bonus\n// format from before Read & Memorise existed; kept working for any entries\n// already earned under it, at its original flat value.\nfunction getMarks(qtypeId){\n  if(qtypeId && qtypeId.indexOf(\"recite_fast_\")===0) return READ_SPEED_MARKS.fast;\n  if(qtypeId && qtypeId.indexOf(\"recite_good_\")===0) return READ_SPEED_MARKS.good;\n  if(qtypeId && qtypeId.indexOf(\"recite_\")===0) return RECITE_BONUS_MARKS;\n  return QTYPES.find(q=>q.id===qtypeId)?.marks||1;\n}\n\n// Weighted score: earned marks / total possible marks * 100\nfunction calcWeightedScore(results){\n  // results: [{qtype, pct}]\n  if(!results.length) return 0;\n  let earned=0, total=0;\n  results.forEach(r=>{\n    const m=getMarks(r.qtype||\"mcq\");\n    total+=m;\n    earned+=m*(r.pct/100);\n  });\n  return total>0 ? Math.round((earned/total)*100) : 0;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  DATA\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Just the subject/part shell \u2014 names, icons, display order. NOT\n// database-backed (adding a whole new subject or part still needs a code\n// change), and intentionally tiny: every lesson and question now lives\n// only in Firestore, there is no hardcoded content fallback anymore. If\n// the database is ever briefly unreachable, the app shows these subject\n// tabs with zero lessons in them rather than crashing on a blank/missing\n// DATA object \u2014 not a full fallback like before, just enough structure\n// to fail gracefully instead of breaking.\n// The syllabus differs by class, so the skeleton is keyed by class instead\n// of being one flat structure. Class 9 is reproduced here exactly as it was\n// \u2014 nothing about his current year should shift underneath him.\nconst CLASS_ORDER = [\"9\",\"10\"];\nconst CLASS_STRUCTURES = {\n  \"9\": {\n    \"Science\": { icon: \"\ud83d\udd2c\", parts: { \"Physics\": {icon:\"\u26a1\"}, \"Chemistry\": {icon:\"\u2697\ufe0f\"}, \"Biology\": {icon:\"\ud83e\uddec\"} } },\n    \"Social Science\": { icon: \"\ud83c\udf0f\", parts: { \"History\": {icon:\"\ud83d\udcdc\"}, \"Geography\": {icon:\"\ud83d\uddfa\ufe0f\"}, \"Civics\": {icon:\"\ud83c\udfdb\ufe0f\"}, \"Economics\": {icon:\"\ud83d\udcb9\"} } },\n    \"English\": { icon: \"\ud83d\udcd8\", parts: { \"Prose\": {icon:\"\ud83d\udcd6\"}, \"Poem\": {icon:\"\ud83d\udcdc\"}, \"Grammar\": {icon:\"\u270f\ufe0f\"} } },\n  },\n  // Tamil Nadu State Board (Samacheer Kalvi) Class 10. Science carries a\n  // Computer Science chapter and English uses Supplementary rather than a\n  // Grammar section, so its parts are not identical to Class 9's.\n  \"10\": {\n    \"Science\": { icon: \"\ud83d\udd2c\", parts: { \"Physics\": {icon:\"\u26a1\"}, \"Chemistry\": {icon:\"\u2697\ufe0f\"}, \"Biology\": {icon:\"\ud83e\uddec\"}, \"Computer Science\": {icon:\"\ud83d\udcbb\"} } },\n    \"Social Science\": { icon: \"\ud83c\udf0f\", parts: { \"History\": {icon:\"\ud83d\udcdc\"}, \"Geography\": {icon:\"\ud83d\uddfa\ufe0f\"}, \"Civics\": {icon:\"\ud83c\udfdb\ufe0f\"}, \"Economics\": {icon:\"\ud83d\udcb9\"} } },\n    \"English\": { icon: \"\ud83d\udcd8\", parts: { \"Prose\": {icon:\"\ud83d\udcd6\"}, \"Poem\": {icon:\"\ud83d\udcdc\"}, \"Supplementary\": {icon:\"\ud83d\udcda\"} } },\n  },\n};\n// Defaults to Class 9 \u2014 he is still in Class 9, so the app must open exactly\n// where it always did. Class 10 is a tab he can look into, not the new home.\nlet currentClass = \"9\";\ntry{ const _c = localStorage.getItem(\"sb_currentClass\"); if(_c && CLASS_STRUCTURES[_c]) currentClass = _c; }catch(e){}\nfunction getSubjectStructure(){ return CLASS_STRUCTURES[currentClass] || CLASS_STRUCTURES[\"9\"]; }\n\nfunction buildEmptyDataFromSkeleton(){\n  const data = {};\n  Object.entries(getSubjectStructure()).forEach(([subj, sd])=>{\n    data[subj] = { icon: sd.icon, parts: {} };\n    Object.entries(sd.parts).forEach(([part, pd])=>{\n      data[subj].parts[part] = { icon: pd.icon, lessons: [] };\n    });\n  });\n  return data;\n}\n\n// DATA starts as the empty skeleton (subject/part tabs, zero lessons) --\n// init() replaces it with the database-loaded version. If that fetch ever\n// fails or comes back empty, DATA just stays the empty skeleton, so the\n// app shows subject tabs with no lessons rather than crashing outright.\nlet DATA = buildEmptyDataFromSkeleton();\n\n// Not real security \u2014 there's no user auth in this app, so this is a shared\n// static value, same limitation as the passcode itself. Its only job is to\n// stop a stranger who finds the Firebase config (visible to anyone who ever\n// loads the page) from writing directly to Firestore's API without ever\n// going through the app at all. Anyone who reads this JS source can still\n// find this same string \u2014 it only raises the bar against casual/automated\n// probing, not a determined reader. Matched by the Firestore rule for the\n// \"lessons\" collection: writes are rejected unless this exact value is\n// present on the document.\nconst ADMIN_WRITE_SECRET = \"dlvhVc5Rv75R9lqlDunc98VCpWwFEJu1\";\n\n// Rebuilds the DATA shape from a Firestore \"lessons\" collection snapshot.\n// Subject/part structure (names, icons, display order) still comes from\n// SUBJECT_STRUCTURE, not the database -- only lessons and their questions\n// are database-backed -- so a lesson doc referencing an unknown\n// subject/part is skipped rather than silently creating a stray new tab.\nfunction buildDataFromLessonDocs(lessonDocs){\n  const data = buildEmptyDataFromSkeleton();\n  lessonDocs.forEach(docSnap=>{\n    const l = docSnap.data();\n    // Lessons written before classes existed carry no `class` field at all \u2014\n    // they are all Class 9, so a missing value must read as \"9\" rather than\n    // being dropped. Getting this wrong would empty his entire syllabus.\n    if((l.class || \"9\") !== currentClass) return;\n    if(!data[l.subject] || !data[l.subject].parts[l.part]) return; // unknown subject/part \u2014 skip defensively\n    data[l.subject].parts[l.part].lessons.push({\n      id: docSnap.id, unit: l.unit||\"\", title: l.title||\"\", month: l.month||\"\",\n      order: l.order??0, questions: l.questions||{},\n      // Questions imported without a verified answer. Deliberately a SEPARATE\n      // field: nothing in the student's path reads it, so these can never be\n      // served in a quiz, counted towards mastery, or scored. An empty model\n      // answer scores 100% in scoreAnswer, so putting them in `questions`\n      // would silently mark them mastered and inflate his Growth Points.\n      pendingQuestions: l.pendingQuestions||{}\n    });\n  });\n  Object.values(data).forEach(sd=>{\n    Object.values(sd.parts).forEach(pd=>{\n      pd.lessons.sort((a,b)=>a.order-b.order);\n    });\n  });\n  return data;\n}\n\n// Loads lessons from the database and switches DATA over to them. If the\n// fetch fails or the collection is empty, DATA just stays whatever it\n// already was (the empty skeleton on first load, or last session's\n// successful fetch) \u2014 there's no hardcoded content to fall back to\n// anymore, so a database outage means empty subject tabs, not broken ones.\n// Firebase loads as an ES module importing from a CDN -- window._fb isn't\n// set the instant this script runs, it's set whenever that async import\n// finishes, which can be a beat later. Before, that race didn't matter:\n// DATA started as the full hardcoded copy either way. Now that there's no\n// hardcoded fallback, losing this race would leave DATA empty for the rest\n// of the session with no error and no retry -- so wait (briefly) for it\n// instead of giving up on the very first check.\nfunction waitForFirebase(timeoutMs){\n  timeoutMs = timeoutMs || 8000;\n  if(window._fb) return Promise.resolve(true);\n  return new Promise(resolve=>{\n    const start = Date.now();\n    (function check(){\n      if(window._fb){ resolve(true); return; }\n      if(Date.now() - start > timeoutMs){ resolve(false); return; }\n      setTimeout(check, 100);\n    })();\n  });\n}\n\nlet _allLessonDocs = null; // every lesson doc across all classes, as fetched\n\n// Switching class is purely a re-slice of what we already hold: rebuild DATA\n// from the cached docs, then re-render. Points, streaks and mastery are all\n// untouched \u2014 those key off question and lesson ids, and lesson ids are\n// unique across classes, so the two syllabi cannot collide.\nfunction rebuildDataForClass(){\n  DATA = _allLessonDocs ? buildDataFromLessonDocs(_allLessonDocs) : buildEmptyDataFromSkeleton();\n}\n\nfunction switchClass(cls){\n  if(!CLASS_STRUCTURES[cls] || cls===currentClass) return;\n  currentClass = cls;\n  try{ localStorage.setItem(\"sb_currentClass\", cls); }catch(e){}\n  rebuildDataForClass();\n  // Reuse the same \"is this still visible?\" logic focus mode uses, so a class\n  // with nothing browsable lands on a null subject rather than a stale one.\n  currentSubject = null; currentPart = null;\n  ensureCurrentSubjectPartVisible();\n  try{ renderClassTabs(); }catch(e){}\n  try{ renderSidebar(); }catch(e){}\n  try{ renderSubjectTabs(); }catch(e){}\n  try{ renderPartTabs(); }catch(e){}\n  try{ renderLessons(); }catch(e){}\n  try{ updateDesktopHeader(); }catch(e){}\n  try{ updateClassHeaderLabel(); }catch(e){}\n  try{ if(isAdminUser) renderAdminLessons(); }catch(e){}\n  try{ if(isAdminUser) renderManageContent(); }catch(e){}\n}\n\nfunction updateClassHeaderLabel(){\n  const el = document.getElementById(\"mobileHeaderSub\");\n  if(el) el.textContent = \"Class \" + currentClass + \" \\u00b7 Science & Social Science\";\n}\n\nasync function loadLessonsFromFirestore(){\n  const ready = await waitForFirebase();\n  if(!ready){ console.log(\"loadLessonsFromFirestore: Firebase never became available\"); return; }\n  try{\n    const { db, collection, getDocs } = window._fb;\n    const snap = await getDocs(collection(db, \"lessons\"));\n    if(snap.empty) return;\n    _allLessonDocs = snap.docs; // kept so switching class is a local rebuild, not another round-trip\n    DATA = buildDataFromLessonDocs(snap.docs);\n  } catch(err){\n    console.log(\"loadLessonsFromFirestore failed:\", err.message);\n  }\n}\n\nfunction totalLessonsInData(){\n  let n = 0;\n  Object.values(DATA).forEach(sd=>Object.values(sd.parts).forEach(pd=>n+=pd.lessons.length));\n  return n;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  FOCUS MODE \u2014 admin restricts which lessons the student can browse\n//  into for a session. Stored under the same sessions/{phone}/settings\n//  path everything else uses (already open read/write, no new rule\n//  needed). Admin's own view is never filtered -- Manage Content, Focus\n//  Mode's own picker, and every admin report always show everything,\n//  regardless of what's currently focused for the student.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _focusMode = { enabled: false, lessonIds: [], qtypes: [], unmasteredOnly: false };\n\n// Focus Mode can narrow which question types (\"headings\") are reachable as\n// well as which lessons. An empty list means no restriction \u2014 never \"none\" \u2014\n// so settings saved before this feature existed behave exactly as they did.\n// Admin is never restricted, matching how the lesson filter already behaves.\nfunction isQTypeAllowed(qtypeId){\n  if(isAdminUser || !_focusMode.enabled) return true;\n  const allowed = _focusMode.qtypes || [];\n  return !allowed.length || allowed.includes(qtypeId);\n}\nfunction allowedQTypes(){ return QTYPES.filter(qt=>isQTypeAllowed(qt.id)); }\n\n// \"Unmastered only\": hide questions he has already mastered so a focused\n// session drills what's actually left. Implemented as a SKIP over the fixed\n// question list, never as a filtered or reordered copy of it. Mastery keys are\n// `${lesson.id}_${qtype}_${index}` against the lesson's own array, and this\n// file has already been bitten twice by moving that index \u2014 once by the\n// reordering removed from startQTypeSession, once by question deletion. So\n// question 5 stays question 5 here; it is simply stepped over.\nfunction isQuestionMasteredAt(lessonId, qtype, idx){\n  return _masteredQuestionKeys.has(lessonId+\"_\"+qtype+\"_\"+idx);\n}\nfunction isQuestionHiddenByFocus(lessonId, qtype, idx){\n  if(isAdminUser || !_focusMode.enabled || !_focusMode.unmasteredOnly) return false;\n  return isQuestionMasteredAt(lessonId, qtype, idx);\n}\n// Counts what he can actually reach in a lesson/heading, so a heading whose\n// questions are all mastered doesn't offer a tab leading to an empty session.\nfunction reachableQuestionCount(lesson, qtypeId){\n  const arr = (lesson && lesson.questions[qtypeId]) || [];\n  let n = 0;\n  for(let i=0;i<arr.length;i++) if(!isQuestionHiddenByFocus(lesson.id, qtypeId, i)) n++;\n  return n;\n}\n// Next reachable position from `from` travelling in `dir`; -1 if there is none.\nfunction nextReachableIndex(from, dir, total){\n  for(let i=from; i>=0 && i<total; i+=dir){\n    if(!isQuestionHiddenByFocus(currentLesson?.id, currentQType, i)) return i;\n  }\n  return -1;\n}\n\nasync function loadFocusMode(){\n  if(!window._fb || !currentUserPhone) return;\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"focusMode\"));\n    if(snap.exists()){\n      const d = snap.data();\n      // qtypes is optional and an empty list means \"every type\" \u2014 focus\n      // settings saved before this existed have no such field, and must keep\n      // meaning no type restriction rather than suddenly restricting to none.\n      _focusMode = { enabled: !!d.enabled,\n                     lessonIds: Array.isArray(d.lessonIds) ? d.lessonIds : [],\n                     qtypes: Array.isArray(d.qtypes) ? d.qtypes : [],\n                     unmasteredOnly: !!d.unmasteredOnly };\n    }\n  }catch(e){ console.log(\"loadFocusMode failed:\", e.message); }\n}\n\nasync function saveFocusMode(enabled, lessonIds, qtypes, unmasteredOnly){\n  if(!window._fb || !currentUserPhone){ alert(\"No database connection right now \u2014 try again in a moment.\"); return false; }\n  const { db, doc, setDoc } = window._fb;\n  try{\n    const payload = { enabled: !!enabled, lessonIds: lessonIds||[], qtypes: qtypes||[], unmasteredOnly: !!unmasteredOnly };\n    await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"focusMode\"), payload);\n    _focusMode = payload;\n    return true;\n  }catch(err){\n    alert(\"Save failed: \" + err.message);\n    return false;\n  }\n}\n\n// The single source of truth for \"what can the student currently browse\n// into\" -- everywhere navigation or content-selection happens (sidebar,\n// subject/part tabs, lesson grid, the Practice Test picker) reads from\n// this instead of DATA directly, so a focused lesson set can't be\n// sidestepped through any of those paths. Admin always sees the full,\n// unfiltered DATA no matter what's focused.\nfunction getVisibleData(){\n  if(isAdminUser || !_focusMode.enabled) return DATA;\n  const allowed = new Set(_focusMode.lessonIds);\n  const out = {};\n  Object.entries(DATA).forEach(([subj, sd])=>{\n    const parts = {};\n    Object.entries(sd.parts).forEach(([part, pd])=>{\n      const lessons = pd.lessons.filter(l=>allowed.has(l.id));\n      if(lessons.length) parts[part] = { icon: pd.icon, lessons };\n    });\n    if(Object.keys(parts).length) out[subj] = { icon: sd.icon, parts };\n  });\n  return out;\n}\n\n// If focus mode just turned on/changed and the student's current\n// subject/part is no longer in the visible set, jump to the first\n// visible one instead of showing an empty part or erroring on undefined.\nfunction ensureCurrentSubjectPartVisible(){\n  const vis = getVisibleData();\n  if(vis[currentSubject] && vis[currentSubject].parts[currentPart]) return;\n  const firstSubj = Object.keys(vis)[0];\n  if(!firstSubj){ currentSubject = null; currentPart = null; return; }\n  currentSubject = firstSubj;\n  currentPart = Object.keys(vis[firstSubj].parts)[0];\n}\n\nasync function applyFocusModeAfterLogin(){\n  await loadFocusMode();\n  ensureCurrentSubjectPartVisible();\n  try{ renderSidebar(); }catch(e){}\n  try{ renderSubjectTabs(); }catch(e){}\n  try{ renderPartTabs(); }catch(e){}\n  try{ renderLessons(); }catch(e){}\n}\n\n// Called right after login (by which point Firebase has definitely had\n// time to load). If DATA still has zero lessons -- the initial page-load\n// fetch lost the race with Firebase starting up, or hit a transient\n// network blip -- retry once and re-render, rather than leaving the\n// student staring at empty subject tabs for the rest of the session.\nasync function retryLoadLessonsIfEmpty(){\n  if(totalLessonsInData() > 0) return;\n  await loadLessonsFromFirestore();\n  if(totalLessonsInData() > 0){\n    try{ renderSubjectTabs(); }catch(e){}\n    try{ renderPartTabs(); }catch(e){}\n    try{ renderLessons(); }catch(e){}\n  }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MANUAL REFRESH \u2014 pick up admin changes (new/edited lessons and\n//  questions, Focus Mode, lessons marked Complete) without a full page\n//  reload, which would otherwise lose whatever the student currently has\n//  open. Re-pulls exactly the same sources the initial login does, then\n//  re-renders the browsing UI in place -- doesn't touch an active quiz\n//  session (sessionLog, currentQIndex, etc.) at all, only the lesson\n//  list/nav underneath it.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _refreshingContent = false;\nasync function refreshStudentContent(){\n  if(_refreshingContent) return; // ignore a double-click mid-refresh\n  _refreshingContent = true;\n  const btn = document.getElementById(\"refreshContentBtn\");\n  const originalLabel = btn ? btn.textContent : \"\";\n  if(btn){ btn.disabled = true; btn.textContent = \"\ud83d\udd04 Refreshing\u2026\"; }\n  try{\n    await Promise.all([\n      loadLessonsFromFirestore(),\n      loadFocusMode(),\n      loadCompleteLessons()\n    ]);\n    ensureCurrentSubjectPartVisible();\n    try{ renderSidebar(); }catch(e){}\n    try{ renderSubjectTabs(); }catch(e){}\n    try{ renderPartTabs(); }catch(e){}\n    try{ renderLessons(); }catch(e){}\n    try{ updateDesktopHeader(); }catch(e){}\n    if(btn){ btn.textContent = \"\u2705 Updated\"; }\n  }catch(e){\n    console.log(\"refreshStudentContent failed:\", e.message);\n    if(btn){ btn.textContent = \"\u26a0\ufe0f Refresh failed\"; }\n  }finally{\n    _refreshingContent = false;\n    setTimeout(()=>{\n      if(btn){ btn.disabled = false; btn.textContent = originalLabel || \"\ud83d\udd04 Refresh Content\"; }\n    }, 1500);\n  }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SCORING  \u2014 sequence-aware token matching\n//  \"My pen is red colour\" vs \"my pen re colour\" \u2192 60%\n//  Algorithm:\n//   1. Tokenise both into lowercase words (strip punctuation)\n//   2. LCS (longest common subsequence) of tokens IN ORDER\n//   3. Score = 2*LCS / (len(ref)+len(user))  (S\u00f8rensen-like)\n//   4. Penalty: for each matched token pair, +spelling bonus\n//      if exact, slight deduction if within edit distance 1-2\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction tokenise(str){\n  return str.toLowerCase().replace(/[^a-z0-9\\s]/g,\" \").trim().split(/\\s+/).filter(Boolean);\n}\n\nfunction lcsLength(a,b){\n  const m=a.length, n=b.length;\n  // space-optimised DP\n  let prev=new Array(n+1).fill(0), curr=new Array(n+1).fill(0);\n  for(let i=1;i<=m;i++){\n    for(let j=1;j<=n;j++){\n      curr[j] = a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j],curr[j-1]);\n    }\n    [prev,curr]=[curr,prev]; curr.fill(0);\n  }\n  return prev[n];\n}\n\nfunction levenshtein(a,b){\n  const m=a.length,n=b.length;\n  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));\n  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)\n    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);\n  return dp[m][n];\n}\n\nfunction scoreAnswer(userText, refText){\n  if(!userText || userText===\"(skipped)\") return {pct:0, diff:[]};\n  const ref  = tokenise(refText);\n  const user = tokenise(userText);\n  if(!ref.length) return {pct:100, diff:[]};\n\n  // LCS gives matched count in order\n  const matched = lcsLength(ref, user);\n  // S\u00f8rensen dice on token level\n  const pct = Math.round(200*matched / (ref.length + user.length));\n\n  // Apply minimum threshold \u2014 below 30% is likely noise (random common words)\n  const finalPct = pct < 30 ? 0 : pct;\n  // also flag misspellings (close but not exact)\n  const diff = [];\n  let ui = 0;\n  for(let ri=0; ri<ref.length; ri++){\n    const rw = ref[ri];\n    // look ahead in user tokens for this word\n    let found = -1;\n    for(let k=ui; k<Math.min(ui+8, user.length); k++){\n      if(user[k]===rw){ found=k; break; }\n    }\n    if(found>=0){\n      // consume any skipped user words as \"extra/wrong\"\n      for(let k=ui;k<found;k++) diff.push({type:\"wrong\",word:user[k]});\n      diff.push({type:\"ok\",word:rw});\n      ui=found+1;\n    } else {\n      // check if there's a near-match (misspelling only \u2014 same first letter, similar length)\n      let nearIdx=-1;\n      for(let k=ui;k<Math.min(ui+5,user.length);k++){\n        const uw=user[k], rlen=rw.length, ulen=uw.length;\n        // Must share first letter, length within 2, levenshtein <=2, and word length > 3\n        if(uw.length>3 && rlen>3 && uw[0]===rw[0] &&\n           Math.abs(rlen-ulen)<=2 && levenshtein(uw,rw)<=2){ nearIdx=k; break; }\n      }\n      if(nearIdx>=0){\n        for(let k=ui;k<nearIdx;k++) diff.push({type:\"wrong\",word:user[k]});\n        diff.push({type:\"misspelled\",word:user[nearIdx],correct:rw});\n        ui=nearIdx+1;\n      } else {\n        diff.push({type:\"missing\",word:rw});\n      }\n    }\n  }\n  // remaining user words\n  for(;ui<user.length;ui++) diff.push({type:\"wrong\",word:user[ui]});\n\n  return {pct: Math.min(100, finalPct), diff};\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  STATE\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst STUDENT_PHONE = \"9865280639\";\nconst ADMIN_PHONE   = \"9962680639\";\nconst STUDENT_NAME   = \"Joshin\";\n// Bump this on every delivered version \u2014 shown in the admin bar so it's\n// always possible to confirm which build is actually live, rather than\n// guessing from behavior. This exact confusion (comparing a live file\n// against what was actually just fixed) has come up multiple times.\nconst APP_VERSION = \"2026.07.24-01\";\n{\n  const vt = document.getElementById(\"versionTag\");\n  if(vt) vt.textContent = \"v\" + APP_VERSION;\n}\n\nlet currentSubject = \"Social Science\";\nlet currentPart    = \"History\";\nlet currentLesson  = null;\nlet currentQType   = \"brief\";   // active question type tab\nlet currentQIndex  = 0;\nlet sessionResults = [];\nlet questionStates = []; // per-question: {pct, answered, skipped} \u2014 for nav dots\nlet mcqSelected    = null;\nlet matchAnswers   = {};        // leftIdx \u2192 selected right value\nlet scores         = {};        // \"lessonId:qtype\" \u2192 avg%\n\n// Mode\n// \u2500\u2500 SESSION LOG \u2500\u2500\nlet sessionLog = [];\nlet _answeredInPartsMode = false; // Write in Parts no longer auto-combines/auto-submits, so this stays false \u2014 a finished parts-practice answer is now a genuine unaided attempt and earns mastery normally.\nconst sessionSpellErrors = []; // {wrong, correct, lessonTitle, qtype} \u2014 const, never reassign (clear via .length=0 if needed)\nconst _sessionSpellErrorsPush = sessionSpellErrors.push.bind(sessionSpellErrors);\nsessionSpellErrors.push = function(entry){\n  fbLogEntry(\"spellErrors\", { ...entry, mockExamId: currentMockExamId });\n  return _sessionSpellErrorsPush(entry);\n};\nlet currentMode = \"study\";  // always study \u2014 exam mode removed\nconst examAnswers = [];       // used by practice test tracking \u2014 const so it can never be reassigned (only cleared via .length=0)\n// Mirror every exam answer to Firestore the moment it's recorded, without touching every call site.\nconst _examAnswersPush = examAnswers.push.bind(examAnswers);\nexamAnswers.push = function(entry){\n  fbLogEntry(\"examAnswers\", { ...entry, mockExamId: currentMockExamId });\n  return _examAnswersPush(entry);\n};\nlet pendingLesson = null;   // stub - not used // {subject, part, lesson, qtype, pct, timeMs, ts}\n\n// In exam mode we store full answer text per question index\n\n// \u2500\u2500 TIMER STATE \u2500\u2500\nlet _timerInterval = null;\nlet _sessionStart  = 0;\nlet _questionStart = 0;\nlet _questionTimes = [];  // ms per question\n\n// A \"session\" = one continuous period the app was open. Used to group\n// scoreboard stats (unique questions, attempts, time spent) per visit.\nconst currentSessionId = \"sess_\" + Date.now() + \"_\" + Math.random().toString(36).slice(2,8);\n// A \"practice test attempt\" = one full run through Start Practice Test \u2192 Submit.\n// Separate from currentSessionId so multiple exams in one sitting don't merge together.\nlet currentMockExamId = null;\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  INIT\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nasync function init(){\n  // Show rotating Bible verse on welcome screen\n  const verses=[\n    {text:'\"I can do all things through Christ who strengthens me.\"', ref:\"Philippians 4:13\"},\n    {text:'\"For the LORD gives wisdom; from his mouth come knowledge and understanding.\"', ref:\"Proverbs 2:6\"},\n  ];\n  const v=verses[Math.floor(Date.now()/86400000)%verses.length];\n  const el=document.getElementById(\"wlVerse\");\n  if(el) el.innerHTML=`<span class=\"wl-verse-text\">${v.text}<\u002Fspan><span class=\"wl-verse-ref\">${v.ref}<\u002Fspan>`;\n\n  // A short, warm line that rotates daily \u2014 small touch to make the login\n  // screen feel encouraging rather than purely a security gate.\n  const motivateLines = [\n    \"\ud83c\udf1f Every question you try makes you a little stronger.\",\n    \"\ud83d\udcc8 Small steps today, big results in the exam.\",\n    \"\ud83d\udd25 Show up today \u2014 your streak is counting on you!\",\n    \"\ud83c\udfc6 Yesterday you grew. Today, grow a little more.\",\n    \"\ud83d\udca1 Curiosity is the best exam strategy.\",\n    \"\ud83d\ude80 Ready to add another question to your streak?\",\n  ];\n  const ml = motivateLines[Math.floor(Date.now()/86400000)%motivateLines.length];\n  const mlEl = document.getElementById(\"wlMotivate\");\n  if(mlEl) mlEl.textContent = ml;\n\n  // A handful of softly floating decorative emojis behind the login card \u2014\n  // purely visual, no interaction, just makes the screen feel less static.\n  const decor = document.getElementById(\"wlBgDecor\");\n  if(decor){\n    const icons = [\"\ud83d\udcd6\",\"\u270f\ufe0f\",\"\ud83c\udfc6\",\"\ud83d\udd24\",\"\ud83c\udfaf\",\"\ud83d\udcd0\",\"\ud83e\uddea\",\"\ud83c\udf1f\"];\n    const positions = [\n      {top:\"8%\",left:\"10%\"}, {top:\"15%\",left:\"82%\"}, {top:\"72%\",left:\"6%\"},\n      {top:\"78%\",left:\"88%\"}, {top:\"40%\",left:\"4%\"}, {top:\"50%\",left:\"92%\"},\n      {top:\"88%\",left:\"45%\"}, {top:\"6%\",left:\"48%\"},\n    ];\n    decor.innerHTML = positions.map((pos,i)=>\n      `<span class=\"wl-float\" style=\"top:${pos.top};left:${pos.left};animation-delay:${i*0.7}s\">${icons[i%icons.length]}<\u002Fspan>`\n    ).join(\"\");\n  }\n\n  // Try to load lessons from the database before the first render -- falls\n  // back to (i.e. simply keeps) the hardcoded copy already in DATA if this\n  // doesn't resolve to anything usable. See loadLessonsFromFirestore.\n  await loadLessonsFromFirestore();\n\n  renderSidebar();\n  renderSubjectTabs();\n  renderPartTabs();\n  renderLessons();\n}\n\n// \u2500\u2500\u2500 SIDEBAR \u2500\u2500\u2500\nfunction renderSidebar(){\n  const nav=document.getElementById(\"sidebarNav\");\n  nav.innerHTML=\"\";\n  Object.entries(getVisibleData()).forEach(([subj,sd])=>{\n    const sec=document.createElement(\"div\"); sec.className=\"sidebar-section\"; sec.textContent=subj;\n    nav.appendChild(sec);\n    Object.entries(sd.parts).forEach(([part,pd])=>{\n      const el=document.createElement(\"div\");\n      el.className=\"sidebar-item\"+(subj===currentSubject&&part===currentPart?\" active\":\"\");\n      const sc=getPartAvg(subj,part);\n      el.innerHTML=`<span class=\"si-icon\">${pd.icon}<\u002Fspan>${part}${sc!==null?`<span class=\"sidebar-score ${sc>=80?\"good\":sc>=50?\"mid\":\"poor\"}\">${sc}%<\u002Fspan>`:\"\"}`;\n      el.onclick=()=>{ currentSubject=subj; currentPart=part; renderSidebar(); renderPartTabs(); renderLessons(); updateDesktopHeader(); document.getElementById(\"quizOverlay\").classList.remove(\"visible\"); };\n      nav.appendChild(el);\n    });\n  });\n}\nfunction getPartAvg(subj,part){\n  const lessons=getVisibleData()[subj].parts[part].lessons;\n  const vals=lessons.flatMap(l=>Object.keys(l.questions).map(qt=>scores[l.id+\":\"+qt]).filter(v=>v!==undefined));\n  return vals.length?Math.round(vals.reduce((a,v)=>a+v,0)/vals.length):null;\n}\n\n// \u2500\u2500\u2500 MOBILE TABS \u2500\u2500\u2500\n// Rendered from inside renderSubjectTabs so the class row can never drift out\n// of sync with the subject row \u2014 every path that redraws one redraws both.\nfunction renderClassTabs(){\n  const c=document.getElementById(\"classTabs\");\n  if(!c) return;\n  c.innerHTML=\"\";\n  CLASS_ORDER.forEach(cls=>{\n    const t=document.createElement(\"div\");\n    t.className=\"class-tab\"+(cls===currentClass?\" active\":\"\");\n    t.textContent=\"Class \"+cls;\n    t.onclick=()=>switchClass(cls);\n    c.appendChild(t);\n  });\n  updateClassHeaderLabel();\n}\n\nfunction renderSubjectTabs(){\n  renderClassTabs();\n  const c=document.getElementById(\"subjectTabs\"); c.innerHTML=\"\";\n  Object.keys(getVisibleData()).forEach(subj=>{\n    const t=document.createElement(\"div\");\n    t.className=\"subject-tab\"+(subj===currentSubject?\" active\":\"\");\n    t.textContent=subj;\n    t.onclick=()=>{ currentSubject=subj; currentPart=Object.keys(getVisibleData()[subj].parts)[0]; renderSubjectTabs(); renderPartTabs(); renderLessons(); scrollToLessons(); };\n    c.appendChild(t);\n  });\n}\nfunction renderPartTabs(){\n  const c=document.getElementById(\"partTabs\"); c.innerHTML=\"\";\n  const vis=getVisibleData();\n  if(!vis[currentSubject]) return; // nothing visible in this class \u2014 leave the row empty rather than throwing\n  Object.entries(vis[currentSubject].parts).forEach(([p,pd])=>{\n    const t=document.createElement(\"div\");\n    t.className=\"part-tab\"+(p===currentPart?\" active\":\"\");\n    t.innerHTML=`${pd.icon} ${p}`;\n    t.onclick=()=>{ currentPart=p; renderPartTabs(); renderLessons(); updateDesktopHeader(); scrollToLessons(); };\n    c.appendChild(t);\n  });\n}\n\n// \u2500\u2500\u2500 DESKTOP HEADER \u2500\u2500\u2500\nfunction updateDesktopHeader(){\n  const vis=getVisibleData();\n  const pd=vis[currentSubject] && vis[currentSubject].parts[currentPart];\n  if(!pd) return; // renderEmptyLessonState has already blanked these\n\n  document.getElementById(\"desktopPartTitle\").textContent=`${pd.icon} ${currentPart}`;\n  const total=pd.lessons.length;\n  const done=pd.lessons.filter(l=>Object.values(l.questions).some(arr=>arr.length>0)&&\n    Object.keys(l.questions).some(qt=>scores[l.id+\":\"+qt]!==undefined)).length;\n  document.getElementById(\"desktopPartSub\").textContent=`${total} lessons \u00b7 ${done} attempted`;\n  const sc=getPartAvg(currentSubject,currentPart);\n  document.getElementById(\"progressOverview\").innerHTML=sc!==null\n    ?`<div class=\"ov-stat\"><div class=\"ov-num\">${sc}%<\u002Fdiv><div class=\"ov-label\">Avg Score<\u002Fdiv><\u002Fdiv>\n      <div class=\"ov-stat\"><div class=\"ov-num\">${done}<\u002Fdiv><div class=\"ov-label\">Done<\u002Fdiv><\u002Fdiv>\n      <div class=\"ov-stat\"><div class=\"ov-num\">${total-done}<\u002Fdiv><div class=\"ov-label\">Left<\u002Fdiv><\u002Fdiv>`\n    :`<div class=\"ov-stat\"><div class=\"ov-num\">${total}<\u002Fdiv><div class=\"ov-label\">Lessons<\u002Fdiv><\u002Fdiv>`;\n}\n\n// \u2500\u2500\u2500 LESSONS \u2500\u2500\u2500\n// Shown when the selected class has nothing to display. Without this the\n// renderers below simply threw on a missing subject/part, and because every\n// caller wraps them in try/catch the failure was silent \u2014 leaving the PREVIOUS\n// class's lesson cards sitting on screen under the new class's tab.\nfunction renderEmptyLessonState(){\n  const heading = document.getElementById(\"partHeading\");\n  if(heading) heading.textContent = `Class ${currentClass} \u2014 no lessons yet`;\n  const parts = document.getElementById(\"partTabs\");\n  if(parts) parts.innerHTML = \"\";\n  const title = document.getElementById(\"desktopPartTitle\");\n  if(title) title.textContent = `Class ${currentClass}`;\n  const sub = document.getElementById(\"desktopPartSub\");\n  if(sub) sub.textContent = \"\";\n  const ov = document.getElementById(\"progressOverview\");\n  if(ov) ov.innerHTML = \"\";\n  const grid = document.getElementById(\"lessonGrid\");\n  if(!grid) return;\n  const focusHiding = !isAdminUser && _focusMode.enabled;\n  const msg = focusHiding\n    ? \"Focus Mode is on, and it's set to lessons from another class. Ask for it to be turned off to browse this one.\"\n    : (isAdminUser\n        ? \"No lessons here yet. Open Admin \u2192 Lessons to set up this class's syllabus.\"\n        : \"This class hasn't been set up yet \u2014 nothing to study here so far.\");\n  grid.innerHTML = `<div style=\"grid-column:1/-1;padding:28px 20px;text-align:center;color:var(--muted);background:var(--parchment,#f3ece1);border:1.5px dashed var(--border,#d8cdbb);border-radius:14px\">\n    <div style=\"font-size:34px;margin-bottom:8px\">\ud83d\udced<\u002Fdiv>\n    <div style=\"font-size:13.5px;line-height:1.6;max-width:340px;margin:0 auto\">${msg}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderLessons(){\n  const vis=getVisibleData();\n  const pd=vis[currentSubject] && vis[currentSubject].parts[currentPart];\n  if(!pd){ renderEmptyLessonState(); return; }\n  updateDesktopHeader();\n  document.getElementById(\"partHeading\").textContent=`${currentPart} \u2014 ${pd.lessons.length} Lessons`;\n  const grid=document.getElementById(\"lessonGrid\"); grid.innerHTML=\"\";\n  pd.lessons.forEach((lesson,i)=>{\n    const card=document.createElement(\"div\"); card.className=\"lesson-card\";\n    const vals=Object.keys(lesson.questions).map(qt=>scores[lesson.id+\":\"+qt]).filter(v=>v!==undefined);\n    const sc=vals.length?Math.round(vals.reduce((a,v)=>a+v,0)/vals.length):undefined;\n    const totalQ=Object.values(lesson.questions).reduce((a,arr)=>a+arr.length,0);\n    const badge=sc!==undefined?`<div class=\"lesson-score-badge ${sc>=80?\"good\":sc>=50?\"mid\":\"poor\"
