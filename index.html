y the woods and wants to admire the beauty of the snow-filled woods. But his little horse thinks it strange to stop at an unknown place with no farmhouse nearby. It conveys that the horse is practical while the poet is sensitive to nature's beauty.\" },\n                { q:\"What are the sounds heard by the poet?\", answer:\"Apart from the sound of the horse's harness bells, the poet can hear the gentle sweep of the wind and the soft sound of downy snowflakes falling.\" },\n                { q:\"The poet is aware of two choices. What are they? What choice does he make ultimately?\", answer:\"The two choices before the poet are to stay in the woods and admire its beauty, or to continue his journey and fulfil his duties. The poet ultimately chooses to leave the woods and go back to his responsibilities.\" },\n                { q:\"Pick out words from the poem that bring to mind peace and quiet.\", answer:\"'Easy wind', 'downy flake', 'darkest evening', 'lovely', 'dark and deep' — all these words bring to mind peace and quiet.\" },\n                { q:\"Whom does 'he' refer to in 'He will not see me stopping here'?\", answer:\"'He' refers to the owner of the woods, whose house is in the village.\" },\n                { q:\"Why should the horse think it queer to stop?\", answer:\"It is strange for the horse because they have stopped at a place where there is no farmhouse nearby, and the horse is not used to his master stopping in such an unusual spot.\" },\n                { q:\"Why does the horse give his harness bells a shake?\", answer:\"The horse shakes his harness bells to check whether anything has gone wrong with the poet and to ask if there is some mistake in stopping at such an unusual place.\" },\n                { q:\"How are the woods described in the poem?\", answer:\"The woods are described as lovely, dark and deep.\" },\n                { q:\"Explain: 'miles to go before I sleep'.\", answer:\"This line means the poet has many worldly commitments and duties to fulfil before he can rest. 'Sleep' symbolises the end of his journey and responsibilities, while 'miles to go' represents all the work he still has ahead of him.\" },\n              ],\n              truefalse:[], reasons:[], distinguish:[],\n              memorise:[\n                { q:\"Quote from memory: The first stanza of 'Stopping by Woods on a Snowy Evening'\",\n                  lines:\"Whose woods these are I think I know.\\nHis house is in the village though;\\nHe will not see me stopping here\\nTo watch his woods fill up with snow.\",\n                  answer:\"Whose woods these are I think I know His house is in the village though He will not see me stopping here To watch his woods fill up with snow\" },\n                { q:\"Quote from memory: The second stanza of 'Stopping by Woods on a Snowy Evening'\",\n                  lines:\"My little horse must think it queer\\nTo stop without a farmhouse near\\nBetween the woods and frozen lake\\nThe darkest evening of the year.\",\n                  answer:\"My little horse must think it queer To stop without a farmhouse near Between the woods and frozen lake The darkest evening of the year\" },\n                { q:\"Quote from memory: The third stanza of 'Stopping by Woods on a Snowy Evening'\",\n                  lines:\"He gives his harness bells a shake\\nTo ask if there is some mistake.\\nThe only other sound's the sweep\\nOf easy wind and downy flake.\",\n                  answer:\"He gives his harness bells a shake To ask if there is some mistake The only other sound's the sweep Of easy wind and downy flake\" },\n                { q:\"Quote from memory: The fourth (final) stanza of 'Stopping by Woods on a Snowy Evening'\",\n                  lines:\"The woods are lovely, dark and deep.\\nBut I have promises to keep,\\nAnd miles to go before I sleep,\\nAnd miles to go before I sleep.\",\n                  answer:\"The woods are lovely dark and deep But I have promises to keep And miles to go before I sleep And miles to go before I sleep\" },\n                { q:\"Quote from memory: The complete poem 'Stopping by Woods on a Snowy Evening' by Robert Frost\",\n                  lines:\"Whose woods these are I think I know.\\nHis house is in the village though;\\nHe will not see me stopping here\\nTo watch his woods fill up with snow.\\n\\nMy little horse must think it queer\\nTo stop without a farmhouse near\\nBetween the woods and frozen lake\\nThe darkest evening of the year.\\n\\nHe gives his harness bells a shake\\nTo ask if there is some mistake.\\nThe only other sound's the sweep\\nOf easy wind and downy flake.\\n\\nThe woods are lovely, dark and deep.\\nBut I have promises to keep,\\nAnd miles to go before I sleep,\\nAnd miles to go before I sleep.\",\n                  answer:\"Whose woods these are I think I know His house is in the village though He will not see me stopping here To watch his woods fill up with snow My little horse must think it queer To stop without a farmhouse near Between the woods and frozen lake The darkest evening of the year He gives his harness bells a shake To ask if there is some mistake The only other sound's the sweep Of easy wind and downy flake The woods are lovely dark and deep But I have promises to keep And miles to go before I sleep And miles to go before I sleep\" },\n              ],\n              paragraph:[\n                { q:\"It is said, \\\"The choices made by one, shapes one's destiny\\\". Ponder on the thought and write a paragraph. (80–100 words)\", answer:\"Making a choice is a turning point in everyone's life. Our choices build our future. To make good choices, we should think about the future and ask for advice from wise people we trust. We cannot control everything in life, but we can choose how we act every day. Small choices, like working hard and listening to others, shape our path. While luck can help us start, our own choices decide who we become. In the end, we make our own life and we shape our own destiny.\" },\n                { q:\"Write an appreciation of the poem 'Stopping by Woods on a Snowy Evening'. (80–100 words)\", answer:\"In this poem 'Stopping by Woods on a Snowy Evening', Robert Frost stands in front of a dark wood and wants to enjoy the snowy evening. Though he wants to stay back in the woods, he cannot do so as he has worldly commitments to fulfil. The poem uses beautiful imagery such as 'easy wind and downy flake' and 'lovely, dark and deep' to describe the peaceful woods. The figure of speech of personification is used when the horse is shown thinking. The last two lines, repeated for emphasis, remind us that duty must come before personal desire. It is a poem about the conflict between beauty and responsibility.\" },\n              ]\n            }\n          },\n          {\n            id:\"epo2\", unit:\"Unit 2\", title:\"A Poison Tree\", month:\"July\",\n            questions:{\n              mcq:[], fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[],\n              memorise:[\n                { q:\"Quote from memory: The first stanza of 'A Poison Tree'\",\n                  lines:\"I was angry with my friend;\\nI told my wrath, my wrath did end.\\nI was angry with my foe:\\nI told it not, my wrath did grow.\",\n                  answer:\"I was angry with my friend I told my wrath my wrath did end I was angry with my foe I told it not my wrath did grow\" },\n                { q:\"Quote from memory: The second stanza of 'A Poison Tree'\",\n                  lines:\"And I water'd it in fears,\\nNight and morning with my tears:\\nAnd I sunned it with smiles,\\nAnd with soft deceitful wiles.\",\n                  answer:\"And I water'd it in fears Night and morning with my tears And I sunned it with smiles And with soft deceitful wiles\" },\n                { q:\"Quote from memory: The third stanza of 'A Poison Tree'\",\n                  lines:\"And it grew both day and night,\\nTill it bore an apple bright.\\nAnd my foe beheld it shine,\\nAnd he knew that it was mine.\",\n                  answer:\"And it grew both day and night Till it bore an apple bright And my foe beheld it shine And he knew that it was mine\" },\n                { q:\"Quote from memory: The fourth (final) stanza of 'A Poison Tree'\",\n                  lines:\"And into my garden stole,\\nWhen the night had veiled the pole;\\nIn the morning glad I see,\\nMy foe outstretched beneath the tree.\",\n                  answer:\"And into my garden stole When the night had veiled the pole In the morning glad I see My foe outstretched beneath the tree\" },\n                { q:\"Quote from memory: The complete poem 'A Poison Tree' by William Blake\",\n                  lines:\"I was angry with my friend;\\nI told my wrath, my wrath did end.\\nI was angry with my foe:\\nI told it not, my wrath did grow.\\n\\nAnd I water'd it in fears,\\nNight and morning with my tears:\\nAnd I sunned it with smiles,\\nAnd with soft deceitful wiles.\\n\\nAnd it grew both day and night,\\nTill it bore an apple bright.\\nAnd my foe beheld it shine,\\nAnd he knew that it was mine.\\n\\nAnd into my garden stole,\\nWhen the night had veiled the pole;\\nIn the morning glad I see,\\nMy foe outstretched beneath the tree.\",\n                  answer:\"I was angry with my friend I told my wrath my wrath did end I was angry with my foe I told it not my wrath did grow And I water'd it in fears Night and morning with my tears And I sunned it with smiles And with soft deceitful wiles And it grew both day and night Till it bore an apple bright And my foe beheld it shine And he knew that it was mine And into my garden stole When the night had veiled the pole In the morning glad I see My foe outstretched beneath the tree\" },\n              ],\n              paragraph:[]\n            }\n          },\n\n        ]\n      },\n      \"Grammar\": {\n        icon: \"✏️\",\n        lessons: [\n          {\n            id:\"eg1\", unit:\"Unit 1\", title:\"Prepositions\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"We have been living in Chennai _________ eight years.\", options:[\"for\",\"since\",\"during\",\"from\"], correct:0 },\n                { q:\"Abdul has taken _________ his father.\", options:[\"at\",\"after\",\"from\",\"to\"], correct:1 },\n                { q:\"Vimal generally goes to his workplace _________ bus.\", options:[\"on\",\"by\",\"in\",\"with\"], correct:1 },\n                { q:\"The cricket ball was hidden _________ the leaves.\", options:[\"between\",\"among\",\"under\",\"behind\"], correct:1 },\n                { q:\"Mani divided his toys _________ his brothers and sisters.\", options:[\"between\",\"among\",\"with\",\"to\"], correct:1 },\n                { q:\"'Since' refers to _________ .\", options:[\"a duration of time\",\"a particular point of time\",\"a movement\",\"a place\"], correct:1 },\n                { q:\"'For' refers to _________ .\", options:[\"a particular point of time\",\"a place\",\"the duration of time\",\"a movement\"], correct:2 },\n                { q:\"Which preposition is used when items are part of a group and not specifically named?\", options:[\"Between\",\"Among\",\"During\",\"Since\"], correct:1 },\n                { q:\"Which type of preposition is 'towards'?\", options:[\"Preposition of Time\",\"Preposition of Place\",\"Preposition of Movement\",\"None of these\"], correct:2 },\n                { q:\"Both 'during' and 'in' are used to describe actions that happen in a _________ .\", options:[\"particular place\",\"particular person\",\"particular period of time\",\"particular movement\"], correct:2 },\n              ],\n              fill:[], match:[],\n              brief:[\n                { q:\"What is a preposition? Give an example.\", answer:\"A preposition is a word that is placed before a noun or a pronoun to show its relationship to other words in a sentence. Example: The cat is on the wall.\" },\n                { q:\"What are prepositions of time? Give examples.\", answer:\"Prepositions of time are used to indicate when a particular event happened. These include: in, on, at, since, for, during etc. Example: I was studying in the morning. She was born on the 5th of July.\" },\n                { q:\"What are prepositions of place? Give examples.\", answer:\"Prepositions of place are used to indicate the location and come before a noun or pronoun. These include: in, on, between, behind, under, over, near etc. Example: The cat is on the wall. Raj is in his room.\" },\n                { q:\"What are prepositions of movement? Give examples.\", answer:\"Prepositions of movement are used to describe movement. These include: to, into, towards, through etc. Example: I went to the book store. The swimmer jumped into the pool.\" },\n                { q:\"What is the difference between 'since' and 'for'?\", answer:\"'Since' refers to a particular point of time. Example: I have been studying since 5 a.m. 'For' refers to the duration of time. Example: Maya has worked in this institution for 23 years.\" },\n                { q:\"What is the difference between 'between' and 'among'?\", answer:\"'Between' is used when naming definite, individual items. Example: The final match will be held between India and Australia. 'Among' is used when the items are part of a group and are not specifically named. Example: The sailors divided the money among themselves.\" },\n                { q:\"What are prepositional verbs? Give examples.\", answer:\"Prepositional verbs are verbs that are usually followed by prepositions before the object of the verb. Examples: The kids laughed at the hilarious antics of the clown. I believe in the healing power of a mother's touch.\" },\n              ],\n              truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n        ]\n      }\n    }\n  }\n};\n\n// ═══════════════════════════════════════════════════════\n//  SCORING  — sequence-aware token matching\n//  \"My pen is red colour\" vs \"my pen re colour\" → 60%\n//  Algorithm:\n//   1. Tokenise both into lowercase words (strip punctuation)\n//   2. LCS (longest common subsequence) of tokens IN ORDER\n//   3. Score = 2*LCS / (len(ref)+len(user))  (Sørensen-like)\n//   4. Penalty: for each matched token pair, +spelling bonus\n//      if exact, slight deduction if within edit distance 1-2\n// ═══════════════════════════════════════════════════════\nfunction tokenise(str){\n  return str.toLowerCase().replace(/[^a-z0-9\\s]/g,\" \").trim().split(/\\s+/).filter(Boolean);\n}\n\nfunction lcsLength(a,b){\n  const m=a.length, n=b.length;\n  // space-optimised DP\n  let prev=new Array(n+1).fill(0), curr=new Array(n+1).fill(0);\n  for(let i=1;i<=m;i++){\n    for(let j=1;j<=n;j++){\n      curr[j] = a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j],curr[j-1]);\n    }\n    [prev,curr]=[curr,prev]; curr.fill(0);\n  }\n  return prev[n];\n}\n\nfunction levenshtein(a,b){\n  const m=a.length,n=b.length;\n  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));\n  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)\n    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);\n  return dp[m][n];\n}\n\nfunction scoreAnswer(userText, refText){\n  if(!userText || userText===\"(skipped)\") return {pct:0, diff:[]};\n  const ref  = tokenise(refText);\n  const user = tokenise(userText);\n  if(!ref.length) return {pct:100, diff:[]};\n\n  // LCS gives matched count in order\n  const matched = lcsLength(ref, user);\n  // Sørensen dice on token level\n  const pct = Math.round(200*matched / (ref.length + user.length));\n\n  // Apply minimum threshold — below 30% is likely noise (random common words)\n  const finalPct = pct < 30 ? 0 : pct;\n  // also flag misspellings (close but not exact)\n  const diff = [];\n  let ui = 0;\n  for(let ri=0; ri<ref.length; ri++){\n    const rw = ref[ri];\n    // look ahead in user tokens for this word\n    let found = -1;\n    for(let k=ui; k<Math.min(ui+8, user.length); k++){\n      if(user[k]===rw){ found=k; break; }\n    }\n    if(found>=0){\n      // consume any skipped user words as \"extra/wrong\"\n      for(let k=ui;k<found;k++) diff.push({type:\"wrong\",word:user[k]});\n      diff.push({type:\"ok\",word:rw});\n      ui=found+1;\n    } else {\n      // check if there's a near-match (misspelling only — same first letter, similar length)\n      let nearIdx=-1;\n      for(let k=ui;k<Math.min(ui+5,user.length);k++){\n        const uw=user[k], rlen=rw.length, ulen=uw.length;\n        // Must share first letter, length within 2, levenshtein <=2, and word length > 3\n        if(uw.length>3 && rlen>3 && uw[0]===rw[0] &&\n           Math.abs(rlen-ulen)<=2 && levenshtein(uw,rw)<=2){ nearIdx=k; break; }\n      }\n      if(nearIdx>=0){\n        for(let k=ui;k<nearIdx;k++) diff.push({type:\"wrong\",word:user[k]});\n        diff.push({type:\"misspelled\",word:user[nearIdx],correct:rw});\n        ui=nearIdx+1;\n      } else {\n        diff.push({type:\"missing\",word:rw});\n      }\n    }\n  }\n  // remaining user words\n  for(;ui<user.length;ui++) diff.push({type:\"wrong\",word:user[ui]});\n\n  return {pct: Math.min(100, finalPct), diff};\n}\n\n// ═══════════════════════════════════════════════════════\n//  STATE\n// ═══════════════════════════════════════════════════════\nconst STUDENT_PHONE = \"9865280639\";\nconst ADMIN_PHONE   = \"9962680639\";\nconst STUDENT_NAME   = \"Joshin\";\n// Bump this on every delivered version — shown in the admin bar so it's\n// always possible to confirm which build is actually live, rather than\n// guessing from behavior. This exact confusion (comparing a live file\n// against what was actually just fixed) has come up multiple times.\nconst APP_VERSION = \"2026.07.24-01\";\n{\n  const vt = document.getElementById(\"versionTag\");\n  if(vt) vt.textContent = \"v\" + APP_VERSION;\n}\n\nlet currentSubject = \"Social Science\";\nlet currentPart    = \"History\";\nlet currentLesson  = null;\nlet currentQType   = \"brief\";   // active question type tab\nlet currentQIndex  = 0;\nlet sessionResults = [];\nlet questionStates = []; // per-question: {pct, answered, skipped} — for nav dots\nlet mcqSelected    = null;\nlet matchAnswers   = {};        // leftIdx → selected right value\nlet scores         = {};        // \"lessonId:qtype\" → avg%\n\n// Mode\n// ── SESSION LOG ──\nlet sessionLog = [];\nlet _answeredInPartsMode = false; // Write in Parts no longer auto-combines/auto-submits, so this stays false — a finished parts-practice answer is now a genuine unaided attempt and earns mastery normally.\nconst sessionSpellErrors = []; // {wrong, correct, lessonTitle, qtype} — const, never reassign (clear via .length=0 if needed)\nconst _sessionSpellErrorsPush = sessionSpellErrors.push.bind(sessionSpellErrors);\nsessionSpellErrors.push = function(entry){\n  fbLogEntry(\"spellErrors\", { ...entry, mockExamId: currentMockExamId });\n  return _sessionSpellErrorsPush(entry);\n};\nlet currentMode = \"study\";  // always study — exam mode removed\nconst examAnswers = [];       // used by practice test tracking — const so it can never be reassigned (only cleared via .length=0)\n// Mirror every exam answer to Firestore the moment it's recorded, without touching every call site.\nconst _examAnswersPush = examAnswers.push.bind(examAnswers);\nexamAnswers.push = function(entry){\n  fbLogEntry(\"examAnswers\", { ...entry, mockExamId: currentMockExamId });\n  return _examAnswersPush(entry);\n};\nlet pendingLesson = null;   // stub - not used // {subject, part, lesson, qtype, pct, timeMs, ts}\n\n// In exam mode we store full answer text per question index\n\n// ── TIMER STATE ──\nlet _timerInterval = null;\nlet _sessionStart  = 0;\nlet _questionStart = 0;\nlet _questionTimes = [];  // ms per question\n\n// A \"session\" = one continuous period the app was open. Used to group\n// scoreboard stats (unique questions, attempts, time spent) per visit.\nconst currentSessionId = \"sess_\" + Date.now() + \"_\" + Math.random().toString(36).slice(2,8);\n// A \"practice test attempt\" = one full run through Start Practice Test → Submit.\n// Separate from currentSessionId so multiple exams in one sitting don't merge together.\nlet currentMockExamId = null;\n\n// ═══════════════════════════════════════════════════════\n//  INIT\n// ═══════════════════════════════════════════════════════\nfunction init(){\n  // Show rotating Bible verse on welcome screen\n  const verses=[\n    {text:'\"I can do all things through Christ who strengthens me.\"', ref:\"Philippians 4:13\"},\n    {text:'\"For the LORD gives wisdom; from his mouth come knowledge and understanding.\"', ref:\"Proverbs 2:6\"},\n  ];\n  const v=verses[Math.floor(Date.now()/86400000)%verses.length];\n  const el=document.getElementById(\"wlVerse\");\n  if(el) el.innerHTML=`<span class=\"wl-verse-text\">${v.text}<\u002Fspan><span class=\"wl-verse-ref\">${v.ref}<\u002Fspan>`;\n\n  // A short, warm line that rotates daily — small touch to make the login\n  // screen feel encouraging rather than purely a security gate.\n  const motivateLines = [\n    \"🌟 Every question you try makes you a little stronger.\",\n    \"📈 Small steps today, big results in the exam.\",\n    \"🔥 Show up today — your streak is counting on you!\",\n    \"🏆 Yesterday you grew. Today, grow a little more.\",\n    \"💡 Curiosity is the best exam strategy.\",\n    \"🚀 Ready to add another question to your streak?\",\n  ];\n  const ml = motivateLines[Math.floor(Date.now()/86400000)%motivateLines.length];\n  const mlEl = document.getElementById(\"wlMotivate\");\n  if(mlEl) mlEl.textContent = ml;\n\n  // A handful of softly floating decorative emojis behind the login card —\n  // purely visual, no interaction, just makes the screen feel less static.\n  const decor = document.getElementById(\"wlBgDecor\");\n  if(decor){\n    const icons = [\"📖\",\"✏️\",\"🏆\",\"🔤\",\"🎯\",\"📐\",\"🧪\",\"🌟\"];\n    const positions = [\n      {top:\"8%\",left:\"10%\"}, {top:\"15%\",left:\"82%\"}, {top:\"72%\",left:\"6%\"},\n      {top:\"78%\",left:\"88%\"}, {top:\"40%\",left:\"4%\"}, {top:\"50%\",left:\"92%\"},\n      {top:\"88%\",left:\"45%\"}, {top:\"6%\",left:\"48%\"},\n    ];\n    decor.innerHTML = positions.map((pos,i)=>\n      `<span class=\"wl-float\" style=\"top:${pos.top};left:${pos.left};animation-delay:${i*0.7}s\">${icons[i%icons.length]}<\u002Fspan>`\n    ).join(\"\");\n  }\n\n  renderSidebar();\n  renderSubjectTabs();\n  renderPartTabs();\n  renderLessons();\n}\n\n// ─── SIDEBAR ───\nfunction renderSidebar(){\n  const nav=document.getElementById(\"sidebarNav\");\n  nav.innerHTML=\"\";\n  Object.entries(DATA).forEach(([subj,sd])=>{\n    const sec=document.createElement(\"div\"); sec.className=\"sidebar-section\"; sec.textContent=subj;\n    nav.appendChild(sec);\n    Object.entries(sd.parts).forEach(([part,pd])=>{\n      const el=document.createElement(\"div\");\n      el.className=\"sidebar-item\"+(subj===currentSubject&&part===currentPart?\" active\":\"\");\n      const sc=getPartAvg(subj,part);\n      el.innerHTML=`<span class=\"si-icon\">${pd.icon}<\u002Fspan>${part}${sc!==null?`<span class=\"sidebar-score ${sc>=80?\"good\":sc>=50?\"mid\":\"poor\"}\">${sc}%<\u002Fspan>`:\"\"}`;\n      el.onclick=()=>{ currentSubject=subj; currentPart=part; renderSidebar(); renderPartTabs(); renderLessons(); updateDesktopHeader(); document.getElementById(\"quizOverlay\").classList.remove(\"visible\"); };\n      nav.appendChild(el);\n    });\n  });\n}\nfunction getPartAvg(subj,part){\n  const lessons=DATA[subj].parts[part].lessons;\n  const vals=lessons.flatMap(l=>Object.keys(l.questions).map(qt=>scores[l.id+\":\"+qt]).filter(v=>v!==undefined));\n  return vals.length?Math.round(vals.reduce((a,v)=>a+v,0)/vals.length):null;\n}\n\n// ─── MOBILE TABS ───\nfunction renderSubjectTabs(){\n  const c=document.getElementById(\"subjectTabs\"); c.innerHTML=\"\";\n  Object.keys(DATA).forEach(subj=>{\n    const t=document.createElement(\"div\");\n    t.className=\"subject-tab\"+(subj===currentSubject?\" active\":\"\");\n    t.textContent=subj;\n    t.onclick=()=>{ currentSubject=subj; currentPart=Object.keys(DATA[subj].parts)[0]; renderSubjectTabs(); renderPartTabs(); renderLessons(); scrollToLessons(); };\n    c.appendChild(t);\n  });\n}\nfunction renderPartTabs(){\n  const c=document.getElementById(\"partTabs\"); c.innerHTML=\"\";\n  Object.entries(DATA[currentSubject].parts).forEach(([p,pd])=>{\n    const t=document.createElement(\"div\");\n    t.className=\"part-tab\"+(p===currentPart?\" active\":\"\");\n    t.innerHTML=`${pd.icon} ${p}`;\n    t.onclick=()=>{ currentPart=p; renderPartTabs(); renderLessons(); updateDesktopHeader(); scrollToLessons(); };\n    c.appendChild(t);\n  });\n}\n\n// ─── DESKTOP HEADER ───\nfunction updateDesktopHeader(){\n  const pd=DATA[currentSubject].parts[currentPart];\n  document.getElementById(\"desktopPartTitle\").textContent=`${pd.icon} ${currentPart}`;\n  const total=pd.lessons.length;\n  const done=pd.lessons.filter(l=>Object.values(l.questions).some(arr=>arr.length>0)&&\n    Object.keys(l.questions).some(qt=>scores[l.id+\":\"+qt]!==undefined)).length;\n  document.getElementById(\"desktopPartSub\").textContent=`${total} lessons · ${done} attempted`;\n  const sc=getPartAvg(currentSubject,currentPart);\n  document.getElementById(\"progressOverview\").innerHTML=sc!==null\n    ?`<div class=\"ov-stat\"><div class=\"ov-num\">${sc}%<\u002Fdiv><div class=\"ov-label\">Avg Score<\u002Fdiv><\u002Fdiv>\n      <div class=\"ov-stat\"><div class=\"ov-num\">${done}<\u002Fdiv><div class=\"ov-label\">Done<\u002Fdiv><\u002Fdiv>\n      <div class=\"ov-stat\"><div class=\"ov-num\">${total-done}<\u002Fdiv><div class=\"ov-label\">Left<\u002Fdiv><\u002Fdiv>`\n    :`<div class=\"ov-stat\"><div class=\"ov-num\">${total}<\u002Fdiv><div class=\"ov-label\">Lessons<\u002Fdiv><\u002Fdiv>`;\n}\n\n// ─── LESSONS ───\nfunction renderLessons(){\n  updateDesktopHeader();\n  const pd=DATA[currentSubject].parts[currentPart];\n  document.getElementById(\"partHeading\").textContent=`${currentPart} — ${pd.lessons.length} Lessons`;\n  const grid=document.getElementById(\"lessonGrid\"); grid.innerHTML=\"\";\n  pd.lessons.forEach((lesson,i)=>{\n    const card=document.createElement(\"div\"); card.className=\"lesson-card\";\n    const vals=Object.keys(lesson.questions).map(qt=>scores[lesson.id+\":\"+qt]).filter(v=>v!==undefined);\n    const sc=vals.length?Math.round(vals.reduce((a,v)=>a+v,0)/vals.length):undefined;\n    const totalQ=Object.values(lesson.questions).reduce((a,arr)=>a+arr.length,0);\n    const badge=sc!==undefined?`<div class=\"lesson-score-badge ${sc>=80?\"good\":sc>=50?\"mid\":\"poor\"}\">${sc}%<\u002Fdiv>`:\"\";\n    // Count mastered (80%+ twice) and tried questions in this lesson\n    var masteredCount = 0, triedCount = 0;\n    if(_answeredKeysLoaded){\n      Object.entries(lesson.questions).forEach(function(pair){\n        var qt=pair[0], arr=pair[1];\n        for(var k=0;k<arr.length;k++){\n          var key = lesson.id+\"_\"+qt+\"_\"+k;\n          if(_masteredQuestionKeys.has(key)) masteredCount++;\n          if(_answeredQuestionKeys.has(key)) triedCount++;\n        }\n      });\n    }\n    const coveragePct = totalQ>0 ? Math.round(masteredCount/totalQ*100) : 0;\n    const triedPct    = totalQ>0 ? Math.round(triedCount/totalQ*100) : 0;\n    const isLessonComplete = !!_completeLessons[lesson.id];\n    const allMastered = isLessonComplete && totalQ>0 && masteredCount>=totalQ;\n    const masteryLabel = allMastered\n      ? '<span style=\"font-size:10px;color:var(--green);font-weight:800;white-space:nowrap\">🏆 Mastered! +200<\u002Fspan>'\n      : isLessonComplete\n        ? '<span style=\"font-size:10px;color:var(--gold);font-weight:700;white-space:nowrap\">'+masteredCount+'/'+totalQ+' · 🏆 master all for +200<\u002Fspan>'\n      : '<span style=\"font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap\">'+masteredCount+'/'+totalQ+' mastered<\u002Fspan>';\n    const completeBadge = isLessonComplete && !allMastered\n      ? '<div style=\"font-size:9px;background:var(--gold-light);color:#7d5c1e;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px\">🏆 Master all '+totalQ+' questions to earn +200 pts<\u002Fdiv>' : '';\n    const coverageBar = totalQ>0 ? `<div style=\"margin-top:6px;display:flex;align-items:center;gap:6px\">\n      <div style=\"flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;position:relative\">\n        <div style=\"position:absolute;height:100%;width:${triedPct}%;background:var(--gold);border-radius:2px;opacity:.35\"><\u002Fdiv>\n        <div style=\"position:absolute;height:100%;width:${coveragePct}%;background:var(--green);border-radius:2px\"><\u002Fdiv>\n      <\u002Fdiv>\n      ${masteryLabel}\n    <\u002Fdiv>` : \"\";\n    card.innerHTML=`\n      <div class=\"lesson-num\">${i+1}<\u002Fdiv>\n      <div class=\"lesson-info\">\n        <div class=\"lesson-name\">${lesson.title}<\u002Fdiv>\n        <div class=\"lesson-meta\">${lesson.unit} · ${totalQ} question${totalQ!==1?\"s\":\"\"} · ${lesson.month}<\u002Fdiv>\n        ${coverageBar}\n        ${completeBadge}\n        <div class=\"lesson-card-modes\">\n          <button class=\"btn-revise\" onclick=\"event.stopPropagation();openRevise(${JSON.stringify(lesson.id)})\">📖 Revise<\u002Fbutton>\n          <button class=\"btn-practice\" onclick=\"event.stopPropagation();openLesson(lessons_${i})\">✏️ Practice<\u002Fbutton>\n          <button class=\"btn-test\" onclick=\"event.stopPropagation();startLessonTest(${JSON.stringify(lesson.id)})\"\n            style=\"${isLessonComplete?'':'opacity:.4;cursor:not-allowed;'}\"\n            title=\"${isLessonComplete?'Take the lesson test':'Test not available yet — lesson still being completed'}\">\n            ${isLessonComplete?'🧪 Test':'🔒 Test'}\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>${badge}`;\n    // Store lesson ref for onclick\n    card.dataset.idx = i;\n    card.onclick = ()=>openLesson(lesson);\n    // Fix practice button to use correct lesson ref\n    card.querySelector(\".btn-practice\").onclick = (e)=>{ e.stopPropagation(); openLesson(lesson); };\n    card.querySelector(\".btn-revise\").onclick  = (e)=>{ e.stopPropagation(); openRevise(lesson); };\n    card.querySelector(\".btn-test\").onclick    = (e)=>{ e.stopPropagation(); startLessonTest(lesson.id); };\n    grid.appendChild(card);\n  });\n}\n\n// ═══════════════════════════════════════════════════════\n//  REVISE MODE\n// ═══════════════════════════════════════════════════════\nfunction openRevise(lesson){\n  // If already revising this exact lesson, just toggle the buttons — no need to re-render\n  if(currentMode===\"revise\" && currentLesson?.id===lesson.id && document.getElementById(\"quizOverlay\")?.classList.contains(\"visible\")){\n    document.getElementById(\"toggleRevise\")?.classList.add(\"active\");\n    document.getElementById(\"togglePractice\")?.classList.remove(\"active\");\n    return;\n  }\n  currentLesson = lesson;\n  currentMode = \"revise\"; // prevent renderCurrentQuestion from overwriting\n  const ov = document.getElementById(\"quizOverlay\");\n  ov.classList.add(\"visible\");\n  ov.scrollTo(0,0);\n  document.getElementById(\"quizLessonTitle\").textContent = lesson.title;\n  document.getElementById(\"quizPartLabel\").textContent = `${currentSubject} › ${currentPart} › ${lesson.unit}`;\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  const mas=document.getElementById(\"mockAnswerSheet\");\n  if(mas){ mas.classList.remove(\"visible\"); mas.innerHTML=\"\"; }\n  document.getElementById(\"qNavBar\").style.display = \"none\";\n  document.getElementById(\"qtypeTabs\").innerHTML = `<div style=\"padding:8px 14px;font-size:12px;font-weight:700;color:var(--sage)\">📖 Revision Notes — all questions &amp; answers<\u002Fdiv>`;\n  document.getElementById(\"toggleRevise\")?.classList.add(\"active\");\n  document.getElementById(\"togglePractice\")?.classList.remove(\"active\");\n  document.getElementById(\"modeToggle\").style.display=\"flex\";\n  const _msb2=document.getElementById(\"mockSubmitBar\");\n  if(_msb2) _msb2.style.display=\"none\"; // only ever meant for mock exam mode\n  const _qt2=document.getElementById(\"quizTimer\"); if(_qt2) _qt2.textContent=\"\";\n  initLiveGrowthBadge();\n  fbLiveState({ mode:\"revise\", lessonTitle: lesson.title });\n  renderRevise(lesson);\n}\n\nfunction renderRevise(lesson){\n  const body = document.getElementById(\"quizBody\");\n  body.style.display = \"block\";\n  body.scrollTo(0,0);\n  document.getElementById(\"quizOverlay\").scrollTo(0,0);\n\n  let html = `<div class=\"revise-body\">`;\n  _reviseSpellPool = []; // reset per-question spelling word pool for this render\n  _reviseRecitePool = []; // reset per-question recite pool for this render\n\n  QTYPES.forEach(qt=>{\n    const qs = lesson.questions[qt.id]||[];\n    if(!qs.length) return;\n\n    html += `<div class=\"revise-qtype-section\">\n      <div class=\"revise-qtype-heading\">${qt.icon} ${qt.label}<\u002Fdiv>`;\n\n    qs.forEach((q,i)=>{\n      html += `<div class=\"revise-card\"><div class=\"revise-q-num\">Q${i+1}<\u002Fdiv>`;\n\n      if(qt.id===\"mcq\"){\n        // shuffle deterministically — show correct highlighted\n        html += `<div class=\"revise-q\">${q.q}<\u002Fdiv>`;\n        q.options.forEach((opt,oi)=>{\n          html += `<div class=\"revise-mcq-opt${oi===q.correct?\" correct\":\"\"}\">${String.fromCharCode(65+oi)}. ${opt}<\u002Fdiv>`;\n        });\n\n      } else if(qt.id===\"fill\"){\n        let idx=0;\n        const filled = q.sentence.replace(/___/g,()=>{\n          const ans = q.answers[idx++]||\"\";\n          // Show slash-alternatives as \"word or word\" for clarity\n          const display = ans.split(\"/\").map(s=>s.trim()).join(\" or \");\n          return `<span class=\"revise-blank\">${display}<\u002Fspan>`;\n        });\n        html += `<div class=\"revise-fill-sentence\">${filled}<\u002Fdiv>`;\n\n      } else if(qt.id===\"match\"){\n        html += `<div class=\"revise-q\">${q.q||\"Match the following\"}<\u002Fdiv>\n          <table class=\"revise-match-table\">\n            <thead><tr><th>Column A<\u002Fth><th>Column B<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>${q.left.map((l,li)=>`<tr><td>${l}<\u002Ftd><td>${q.right[q.correct[li]]}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody>\n          <\u002Ftable>`;\n\n      } else if(qt.id===\"distinguish\"){\n        const qText = q.q || `Distinguish between ${q.termA} and ${q.termB}`;\n        const reciteIdx = registerRecite(q, qt, i);\n        html += `<div class=\"revise-q\">${qText}<\u002Fdiv>\n          <div id=\"${reciteIdx>=0?`revise-dist-table-${reciteIdx}`:\"\"}\">${buildDistTable(q)}<\u002Fdiv>\n          ${buildReviseSpellButton(getAnswerSpellingWords((q.answerA||\"\")+\" \"+(q.answerB||\"\")), lesson, qt, i)}\n          ${buildReviseReciteButton(reciteIdx, q)}`;\n\n      } else if(qt.id===\"truefalse\"){\n        html += `<div class=\"revise-q\">${q.statement||q.q}<\u002Fdiv>\n          <div class=\"revise-mcq-opt correct\">Answer: ${q.answer===\"true\"?\"True ✓\":\"False ✗\"}<\u002Fdiv>\n          ${q.reason?`<div class=\"revise-answer\" style=\"margin-top:8px\">${q.reason}<\u002Fdiv>`:\"\"}`;\n\n      } else if(qt.id===\"memorise\"){\n        html += `<div class=\"revise-q\">${q.q}<\u002Fdiv>\n          <div class=\"revise-answer\" style=\"font-family:Georgia,serif;font-size:14px;line-height:1.9;white-space:pre-line\">${(q.lines||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>`;\n      } else {\n        // brief, reasons, paragraph\n        const reciteIdx = registerRecite(q, qt, i);\n        html += `<div class=\"revise-q\">${q.q}<\u002Fdiv>\n          <div class=\"revise-answer\" id=\"${reciteIdx>=0?`revise-answer-${reciteIdx}`:\"\"}\">${(q.answer||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n          ${buildReviseSpellButton(getAnswerSpellingWords(q.answer||\"\"), lesson, qt, i)}\n          ${buildReviseReciteButton(reciteIdx, q)}`;\n      }\n\n      html += `<\u002Fdiv>`;\n    });\n\n    html += `<\u002Fdiv>`;\n  });\n\n  html += `<\u002Fdiv>`;\n  body.innerHTML = html;\n}\n\n// ═══════════════════════════════════════════════════════\n//  LESSON START (direct — no mode picker)\n// ═══════════════════════════════════════════════════════\nfunction openLesson(lesson){\n  // If already viewing this lesson in practice mode, don't reset — just switch toggle state\n  if(currentMode===\"study\" && currentLesson?.id===lesson.id && document.getElementById(\"quizOverlay\")?.classList.contains(\"visible\")){\n    document.getElementById(\"togglePractice\")?.classList.add(\"active\");\n    document.getElementById(\"toggleRevise\")?.classList.remove(\"active\");\n    return;\n  }\n  currentMode=\"study\";\n  showPracticeBonusPopup(lesson, function(){ startLesson(lesson); });\n}\n\nfunction closePracticeBonusPopup(){\n  var el = document.getElementById(\"practiceBonusPopup\");\n  if(el) el.remove();\n}\n\nfunction showPracticeBonusPopup(lesson, onStart){\n  var briefCount   = (lesson.questions.brief||[]).length + (lesson.questions.reasons||[]).length;\n  var paraCount    = (lesson.questions.paragraph||[]).length + (lesson.questions.distinguish||[]).length;\n  if(briefCount===0 && paraCount===0){ onStart(); return; }\n  var rows = \"\";\n  if(briefCount>0) rows += '<div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)\">'\n    +'<div><div style=\"font-size:13px;color:#fff\">📝 Brief + Reasons<\u002Fdiv>'\n    +'<div style=\"font-size:10px;color:rgba(255,255,255,.45);margin-top:1px\">All '+briefCount+' question'+(briefCount!==1?'s':'')+' · 80%+ score each<\u002Fdiv><\u002Fdiv>'\n    +'<div style=\"font-size:14px;font-weight:800;color:var(--gold)\">+100 pts<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  if(paraCount>0) rows += '<div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0\">'\n    +'<div><div style=\"font-size:13px;color:#fff\">📄 Detail + Distinguish<\u002Fdiv>'\n    +'<div style=\"font-size:10px;color:rgba(255,255,255,.45);margin-top:1px\">All '+paraCount+' question'+(paraCount!==1?'s':'')+' · 80%+ score each<\u002Fdiv><\u002Fdiv>'\n    +'<div style=\"font-size:14px;font-weight:800;color:var(--gold)\">+200 pts<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  var ov = document.createElement(\"div\");\n  ov.id = \"practiceBonusPopup\";\n  ov.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  ov.innerHTML = '<div style=\"background:var(--navy,#202a3d);border-radius:16px;padding:22px 20px;max-width:320px;width:100%\">'\n    +'<div style=\"font-size:15px;font-weight:800;color:#fff;margin-bottom:2px\">'+lesson.title+'<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:rgba(255,255,255,.45);margin-bottom:16px\">Practice Mode<\u002Fdiv>'\n    +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px\">🎯 Session Bonuses<\u002Fdiv>'\n    +rows\n    +'<div style=\"font-size:10px;color:rgba(255,255,255,.35);margin-top:10px;margin-bottom:16px\">Score 80%+ on ALL questions of that type in one session to earn the bonus<\u002Fdiv>'\n    +'<div style=\"display:flex;gap:8px\">'\n      +'<button onclick=\"closePracticeBonusPopup()\" style=\"flex:1;padding:10px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-weight:700;font-size:13px;cursor:pointer\">Cancel<\u002Fbutton>'\n      +'<button id=\"practiceBonusStartBtn\" style=\"flex:2;padding:10px;background:var(--gold,#d1983f);color:var(--navy);border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer\">Start! →<\u002Fbutton>'\n    +'<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  document.body.appendChild(ov);\n  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };\n  document.getElementById(\"practiceBonusStartBtn\").onclick = function(){\n    ov.remove(); onStart();\n  };\n}\nfunction startLesson(lesson){\n  currentLesson = lesson;\n  resetSessionTypeBonus(); // fresh session, bonuses not yet awarded\n  const firstWithQ=QTYPES.find(qt=>lesson.questions[qt.id]&&lesson.questions[qt.id].length>0);\n  currentQType=firstWithQ?firstWithQ.id:QTYPES[0].id;\n\n  const ov=document.getElementById(\"quizOverlay\");\n  ov.classList.add(\"visible\");\n  ov.scrollTo(0,0);\n  document.getElementById(\"quizLessonTitle\").textContent=lesson.title;\n  document.getElementById(\"quizPartLabel\").textContent=`${currentSubject} › ${currentPart} › ${lesson.unit}`;\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n  const _mas=document.getElementById(\"mockAnswerSheet\");\n  if(_mas){ _mas.classList.remove(\"visible\"); _mas.innerHTML=\"\"; }\n\n  renderQTypeTabs();\n  document.getElementById(\"togglePractice\")?.classList.add(\"active\");\n  document.getElementById(\"toggleRevise\")?.classList.remove(\"active\");\n  document.getElementById(\"modeToggle\").style.display=\"flex\";\n  const _msb=document.getElementById(\"mockSubmitBar\");\n  if(_msb) _msb.style.display=\"none\"; // only ever meant for mock exam mode — leftover from a previous test otherwise\n  initLiveGrowthBadge();\n  fbLiveState({ mode:\"practice\", lessonTitle: lesson.title });\n  startQTypeSession();\n}\n\nfunction renderQTypeTabs(){\n  const wrap=document.getElementById(\"qtypeTabs\");\n  // Hide tabs entirely in practice test — questions span many lessons/types\n  if(currentLesson && currentLesson.id===\"__mock__\"){\n    wrap.innerHTML=\"\"; return;\n  }\n  wrap.innerHTML=\"\";\n  QTYPES.forEach(qt=>{\n    const count=(currentLesson.questions[qt.id]||[]).length;\n    if(!count) return; // don't show tabs with 0 questions\n    const t=document.createElement(\"div\");\n    t.className=\"qtype-tab\"+(qt.id===currentQType?\" active\":\"\");\n    t.innerHTML=`${qt.icon} ${qt.label}<span class=\"qt-count\">${count}<\u002Fspan>`;\n    if(count) t.onclick=()=>{\n      if(qt.id===currentQType) return; // already on this tab, no-op\n      saveCurrentQTypeSession();\n      currentQType=qt.id;\n      renderQTypeTabs();\n      startQTypeSession();\n    };\n    wrap.appendChild(t);\n    // Auto-scroll active tab into view\n    if(qt.id===currentQType) setTimeout(()=>t.scrollIntoView({behavior:\"smooth\",block:\"nearest\",inline:\"center\"}),50);\n  });\n}\n\n// ── TIMER FUNCTIONS ──\nfunction fmtMs(ms){\n  const s=Math.floor(ms/1000), m=Math.floor(s/60);\n  return m>0?`${m}:${String(s%60).padStart(2,\"0\")}`:`0:${String(s).padStart(2,\"0\")}`;\n}\nfunction startTimer(){\n  stopTimer();\n  _sessionStart=Date.now();\n  _questionStart=Date.now();\n  _questionTimes=[];\n  _timerInterval=setInterval(()=>{\n    const totalEl=document.getElementById(\"quizTimer\");\n    const qEl=document.getElementById(\"qTimer\");\n    if(totalEl) totalEl.textContent=fmtMs(Date.now()-_sessionStart);\n    if(qEl)     qEl.textContent=\"Q: \"+fmtMs(Date.now()-_questionStart);\n  },1000);\n}\nfunction stopTimer(){\n  if(_timerInterval){ clearInterval(_timerInterval); _timerInterval=null; }\n  const qEl=document.getElementById(\"qTimer\");\n  if(qEl) qEl.textContent=\"\";\n}\nfunction stampQuestion(){\n  stopSpeedTimer();\n  const elapsed=Date.now()-_questionStart;\n  _questionTimes.push(elapsed);\n  _questionStart=Date.now();\n  return elapsed;\n}\n// Quick, unobtrusive \"+N points\" toast — fires every time Growth Points goes\n// up. Stacks if several fire in quick succession (e.g. answering MCQs fast)\n// instead of overlapping, and each one clears itself automatically. Never\n// blocks input, never requires dismissing, just a small confirming nudge.\nfunction showPointsToast(amount, label){\n  let stack = document.getElementById(\"pointsToastStack\");\n  if(!stack){\n    stack = document.createElement(\"div\");\n    stack.id = \"pointsToastStack\";\n    stack.style.cssText = \"position:fixed;top:14px;right:14px;z-index:99997;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none\";\n    document.body.appendChild(stack);\n  }\n  const toast = document.createElement(\"div\");\n  toast.style.cssText = \"background:var(--navy);color:var(--gold,#d1983f);font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;white-space:nowrap\";\n  toast.textContent = `+${amount} ${label || \"Growth Points\"} 🏆`;\n  stack.appendChild(toast);\n  requestAnimationFrame(()=>{\n    toast.style.opacity = \"1\";\n    toast.style.transform = \"translateY(0) scale(1)\";\n  });\n  setTimeout(()=>{\n    toast.style.opacity = \"0\";\n    toast.style.transform = \"translateY(-8px) scale(.9)\";\n    setTimeout(()=>toast.remove(), 250);\n  }, 1800);\n}\n\nfunction logQuestion(pct, elapsed, feedbackHTML, isCorrect){\n  const origIdx = getOriginalQIndex(currentQIndex);\n  // clientId lets us reliably tell \"this exact attempt\" apart from every\n  // other attempt, and match it up later between the live session and\n  // Firestore — comparing timestamps for this doesn't work, since the\n  // session uses Date.now() (a plain number) while Firestore stores\n  // serverTimestamp() (a Timestamp object); those can never be equal even\n  // for the very same entry, which was silently causing every answer from\n  // the current session to be counted TWICE in the Growth Points total\n  // (once from the session, once from Firestore) until the next reload\n  // dropped the session's copy — which looked exactly like points had been\n  // taken away, when really the inflated number was just correcting itself.\n  const clientId = currentSessionId+\"-\"+Date.now()+\"-\"+Math.random().toString(36).slice(2,8);\n\n  // Work out the REAL point value BEFORE logging anything, and store that\n  // exact number on the entry itself. This used to be computed twice —\n  // once here (to show the toast) and again later when the Scoreboard\n  // recalculated the total from history — and those two calculations kept\n  // drifting apart (this is exactly what happened to the first-attempt\n  // doubling, the Recite bonus, and the Speed Bonus, independently, at\n  // different points in this app's life). Storing the true value once, at\n  // the moment it's earned, means the toast and the permanent total can\n  // never disagree again — there's only one number, not two copies of it.\n  const qKey = (currentLesson?.id||\"\")+\"_\"+(currentQType||\"\")+\"_\"+origIdx;\n  const isFirstAttempt = pct >= MIN_SCORE_FOR_GOAL_CREDIT && !_answeredQuestionKeys.has(qKey);\n  const baseMarks = getMarks(currentQType);\n  const marks = pct >= MIN_SCORE_FOR_GOAL_CREDIT ? (isFirstAttempt ? baseMarks*2 : baseMarks) : 0;\n  const sb = pct >= MIN_SCORE_FOR_GOAL_CREDIT ? getSpeedBonus(currentQType, elapsed) : null;\n  const totalEarned = marks + (sb ? sb.points : 0);\n\n  const entry = {\n    subject: currentSubject||'',\n    part: currentPart||'',\n    lessonId: currentLesson?.id||'',\n    lessonTitle: currentLesson?.title||'',\n    qtype: currentQType||'',\n    qIndex: origIdx,\n    pct, timeMs: elapsed, clientId, marks: totalEarned,\n    peeked: (hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)]||0) > 0\n  };\n  sessionLog.push({...entry, ts: Date.now()});\n  fbLogEntry(\"logs\", entry);\n  // Forward the SAME feedback the student is looking at — not just a number —\n  // so the admin's live view genuinely mirrors what the student sees on screen.\n  fbLiveState({ answered:true, lastScore: pct, isCorrect: !!isCorrect, feedbackHTML: feedbackHTML||\"\", currentAnswer: document.getElementById(\"answerInput\")?.value||\"\" });\n  const btn=document.getElementById('reportBtn');\n  if(btn) btn.classList.add('visible');\n  // Growth Points go up by +1 for every well-answered question (50%+) — show\n  // a quick, unobtrusive toast right away so he sees the number move every\n  // single time, without waiting for the Scoreboard to reload. Kept small and\n  // auto-dismissing on purpose: this happens often, so it should never feel\n  // like an interruption, just a quiet \"yes, that counted.\"\n  if(pct >= MIN_SCORE_FOR_GOAL_CREDIT){\n    bumpGrowthPointsBadge(totalEarned); // instant, persistent update — not just a toast\n    if(isFirstAttempt){\n      _answeredQuestionKeys.add(qKey); // mark as answered now\n      showPointsToast(marks, \"🆕 New question! 2× points\");\n    } else {\n      showPointsToast(marks);\n    }\n    // Update mastery keys live so lesson cards update without reload\n    _answeredQuestionKeys.add(qKey);\n    // Parts mode = student saw each part split up, don't award mastery.\n    // Same reasoning applies to peeking: a score reached by looking at the\n    // model answer isn't proof he actually knows it unaided, so it shouldn't\n    // count as \"mastered\" either — otherwise peeking would quietly become a\n    // way to mark hard questions as done without ever really learning them.\n    const wasPeeked = (hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)]||0) > 0;\n    if(pct >= 80 && !_answeredInPartsMode && !wasPeeked){\n      _masteredQuestionKeys.add(qKey);\n      checkMilestonesAfterMastery(); // fire-and-forget — checks if this update just completed a Social Science milestone\n      checkLessonMasteryBonus(currentLesson?.id); // fire-and-forget — checks if this update just fully mastered the whole lesson\n    }\n    if(_answeredInPartsMode && pct >= 80) console.log(\"Parts mode: score=\"+pct+\"% but mastery not awarded — student must answer all at once\");\n    if(wasPeeked && pct >= 80) console.log(\"Peeked at the answer: score=\"+pct+\"% but mastery not awarded — needs an unaided attempt\");\n\n    // Speed bonus — only for written types where fast = good recall. Now\n    // genuinely counted (see totalEarned/marks above), not just a toast.\n    if(sb) setTimeout(()=>showSpeedBonusToast(sb.points, sb.label), 600);\n\n    // Show points breakdown after a short delay\n    var inParts = _answeredInPartsMode;\n    setTimeout(function(){\n      var panel = document.getElementById(\"resultPanel\");\n      if(panel){\n        var breakdown = '<div style=\"background:var(--parchment);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:11px\">'\n          +'<div style=\"display:flex;justify-content:space-between;font-weight:700;color:var(--navy)\">'\n            +'<span>Points earned this question<\u002Fspan>'\n            +'<span style=\"color:var(--green)\">+'+totalEarned+'<\u002Fspan>'\n          +'<\u002Fdiv>';\n        if(isFirstAttempt) breakdown += '<div style=\"color:var(--muted);margin-top:2px\">🆕 New question bonus: ×2<\u002Fdiv>';\n        if(sb) breakdown += '<div style=\"color:var(--muted);margin-top:2px\">⚡ Speed bonus: +'+sb.points+'<\u002Fdiv>';\n        if(inParts) breakdown += '<div style=\"color:#cf8f2e;margin-top:4px;font-weight:700\">✍️ Answered in parts — not counted as mastered. Try answering all at once to master this question!<\u002Fdiv>';\n        breakdown += '<\u002Fdiv>';\n        panel.insertAdjacentHTML(\"beforeend\", breakdown);\n      }\n    }, 300);\n  } else {\n    // Even below 50%, track that the question was attempted\n    _answeredQuestionKeys.add(qKey);\n    // Show \"no points\" message\n    setTimeout(function(){\n      var panel = document.getElementById(\"resultPanel\");\n      if(panel){\n        panel.insertAdjacentHTML(\"beforeend\", '<div style=\"background:var(--parchment);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:11px;color:var(--muted)\">Score below 50% — no points this time. Try again!<\u002Fdiv>');\n      }\n    }, 300);\n  }\n}\n\n// Checks if all questions of a type in this session scored 80%+ and awards bonus\nvar _sessionTypeBonusAwarded = {}; // qtype -> true once awarded per session\n\nfunction checkSessionTypeBonus(qtype){\n  // Only applies to brief and paragraph/distinguish types\n  // Group: brief+reasons = +100, paragraph+distinguish = +200\n  var group = (qtype===\"brief\"||qtype===\"reasons\") ? \"brief_reasons\"\n            : (qtype===\"paragraph\"||qtype===\"distinguish\") ? \"para_dist\" : null;\n  if(!group) return;\n  if(_sessionTypeBonusAwarded[group]) return;\n\n  var bonus = group===\"brief_reasons\" ? 100 : 200;\n  var groupTypes = group===\"brief_reasons\" ? [\"brief\",\"reasons\"] : [\"paragraph\",\"distinguish\"];\n\n  // All questions of all types in this group must be answered at 80%+\n  var totalNeeded = 0, allDone = true;\n  groupTypes.forEach(function(t){\n    var qs = currentLesson && currentLesson.questions[t] ? currentLesson.questions[t] : [];\n    totalNeeded += qs.length;\n    if(!qs.length) return;\n    var results = sessionResults.filter(function(r){ return r.qtype===t; });\n    if(results.length < qs.length) allDone = false;\n    else if(results.some(function(r){ return r.pct<80; })) allDone = false;\n  });\n  if(totalNeeded===0) return;\n\n  if(allDone){\n    _sessionTypeBonusAwarded[group] = true;\n    var label = group===\"brief_reasons\" ? \"📝 All Brief & Reasons done!\" : \"📄 All Detail & Distinguish done!\";\n    setTimeout(function(){\n      showSpeedBonusToast(bonus, label+\" Session Bonus!\");\n      // Session bonus is a one-time toast only — not persisted to Firebase\n      // (These bonuses are motivational rewards, not part of the permanent score)\n    }, 1200);\n  }\n}\n\nfunction resetSessionTypeBonus(){\n  _sessionTypeBonusAwarded = {};\n}\n\nfunction showSpeedBonusToast(points, label){\n  let stack = document.getElementById(\"pointsToastStack\");\n  if(!stack){\n    stack = document.createElement(\"div\");\n    stack.id = \"pointsToastStack\";\n    stack.style.cssText = \"position:fixed;top:14px;right:14px;z-index:99997;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none\";\n    document.body.appendChild(stack);\n  }\n  const toast = document.createElement(\"div\");\n  toast.style.cssText = \"background:#c45000;color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;white-space:nowrap\";\n  toast.textContent = `+${points} Speed Bonus ${label}`;\n  stack.appendChild(toast);\n  requestAnimationFrame(()=>{ toast.style.opacity=\"1\"; toast.style.transform=\"translateY(0) scale(1)\"; });\n  setTimeout(()=>{\n    toast.style.opacity=\"0\"; toast.style.transform=\"translateY(-8px) scale(.9)\";\n    setTimeout(()=>toast.remove(), 250);\n  }, 2200);\n}\nfunction timeChip(ms){\n  const s=Math.round(ms/1000);\n  const cls=s<=15?\"fast\":s>=60?\"slow\":\"\";\n  return `<span class=\"time-chip ${cls}\">⏱ ${fmtMs(ms)}<\u002Fspan>`;\n}\n\n// ── SPEED TIMER ──\nlet _speedTimerInterval = null;\n\nfunction startSpeedTimer(qtype){\n  stopSpeedTimer();\n  const wrap = document.getElementById(\"speedTimerWrap\");\n  if(!wrap) return;\n  const thresholds = SPEED_BONUS[qtype];\n  if(!thresholds) return;\n\n  const fastMs  = thresholds.fast[0];\n  const goodMs  = thresholds.good[0];\n  const fastPts = thresholds.fast[1];\n  const goodPts = thresholds.good[1];\n  const startMs = Date.now();\n\n  // Set challenge text\n  var fastMins = Math.round(fastMs/60000);\n  var challenge = document.getElementById(\"speedChallenge\");\n  var challenges = [\n    \"⚡ Can you nail this in \"+fastMins+\" min? +\"+fastPts+\" bonus!\",\n    \"🏃 Race the clock — \"+fastMins+\" min for +\"+fastPts+\" pts!\",\n    \"🔥 Quick fire! Finish in \"+fastMins+\" min = +\"+fastPts+\"!\",\n    \"💪 Challenge: beat \"+fastMins+\" min for +\"+fastPts+\" bonus!\",\n    \"🎯 Speed round — \"+fastMins+\" min target!\",\n  ];\n  if(challenge) challenge.textContent = challenges[Math.floor(Math.random()*challenges.length)];\n\n  function fmtCountdown(ms){\n    if(ms<=0) return \"0s\";\n    const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);\n    return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}s`;\n  }\n\n  const nudge15x = Math.round(goodMs * 1.5);\n  const nudge2x  = goodMs * 2;\n  const nudge3x  = goodMs * 3;\n\n  function tick(){\n    const elapsed = Date.now() - startMs;\n    const bar = document.getElementById(\"speedTimerBar\");\n    const pts = document.getElementById(\"speedTimerPts\");\n    const nudge = document.getElementById(\"speedNudge\");\n    if(!bar) return;\n\n    if(elapsed <= fastMs){\n      const rem = fastMs - elapsed;\n      bar.style.width = Math.max(0,(rem/fastMs)*100)+\"%\";\n      bar.style.background = \"#4a9873\";\n      if(pts){ pts.style.background=\"#4a9873\"; pts.textContent=\"⚡ +\"+fastPts+\" pts if done in \"+fmtCountdown(rem); }\n      if(nudge) nudge.textContent = \"\";\n    } else if(elapsed <= goodMs){\n      const rem = goodMs - elapsed;\n      bar.style.width = Math.max(0,(rem/(goodMs-fastMs))*100)+\"%\";\n      bar.style.background = \"#cf8f2e\";\n      if(pts){ pts.style.background=\"#cf8f2e\"; pts.textContent=\"🕐 +\"+goodPts+\" pts if done in \"+fmtCountdown(rem); }\n      if(nudge) nudge.textContent = \"\";\n    } else {\n      bar.style.width = \"0%\";\n      bar.style.background = \"#ccc\";\n      if(pts){ pts.style.background=\"#aaa\"; pts.textContent=\"No speed bonus\"; }\n      // Nudge messages — escalate over time\n      if(nudge){\n        if(elapsed >= nudge3x){\n          nudge.textContent = \"🚀 Skip this one and come back later!\";\n          nudge.style.color = \"#d15f5a\";\n        } else if(elapsed >= nudge2x){\n          nudge.textContent = \"⏰ Too long on this one — move on and retry later\";\n          nudge.style.color = \"#cf8f2e\";\n        } else if(elapsed >= nudge15x){\n          nudge.textContent = \"💡 Write what you know — you can always retry!\";\n          nudge.style.color = \"var(--muted)\";\n        }\n      }\n    }\n  }\n\n  tick();\n  _speedTimerInterval = setInterval(tick, 500);\n}\n\nfunction stopSpeedTimer(){\n  if(_speedTimerInterval){ clearInterval(_speedTimerInterval); _speedTimerInterval=null; }\n}\n\n// Speed bonus thresholds (ms) per question type.\n// Only applies to written types where time reflects genuine recall speed.\n// Returns { points, label } or null if no bonus.\nconst SPEED_BONUS = {\n  brief:      { fast:[2*60000, 5, \"⚡ Quick recall!\"],   good:[4*60000,  2, \"🕐 Good pace!\"] },\n  reasons:    { fast:[3*60000, 5, \"⚡ Quick recall!\"],   good:[5*60000,  2, \"🕐 Good pace!\"] },\n  paragraph:  { fast:[5*60000, 5, \"⚡ Fast writer!\"],    good:[8*60000,  2, \"🕐 Good pace!\"] },\n  distinguish:{ fast:[4*60000, 5, \"⚡ Quick recall!\"],   good:[6*60000,  2, \"🕐 Good pace!\"] },\n  memorise:   { fast:[3*60000, 5, \"⚡ Well memorised!\"], good:[5*60000,  2, \"🕐 Good pace!\"] },\n};\n\nfunction getSpeedBonus(qtype, ms){\n  const thresholds = SPEED_BONUS[qtype];\n  if(!thresholds) return null;\n  if(ms <= thresholds.fast[0]) return { points: thresholds.fast[1], label: thresholds.fast[2] };\n  if(ms <= thresholds.good[0]) return { points: thresholds.good[1], label: thresholds.good[2] };\n  return null;\n}\n\n// Count unique questions actually learnt (deduped by lesson+qtype+qIndex),\n// as opposed to sessionLog.length which counts every attempt including retries.\nfunction countUniqueQuestions(log){\n  const seen = new Set();\n  log.forEach(e=>{\n    seen.add(`${e.lessonId}|${e.qtype}|${e.qIndex}`);\n  });\n  return seen.size;\n}\n\nlet studyAnswerCache = []; // cached {bodyHTML, resultHTML, answered, pct} per question index\nlet qtypeSessionState = {}; // key: lessonId+\":\"+qtype → {currentQIndex, sessionResults, questionStates, studyAnswerCache, mcqSelected, matchAnswers}\n\nfunction getQTypeSessionKey(){\n  return (currentLesson?.id||\"\")+\":\"+currentQType;\n}\n\nfunction saveCurrentQTypeSession(){\n  if(!currentLesson || currentLesson.id===\"__mock__\") return;\n  const key=getQTypeSessionKey();\n  qtypeSessionState[key]={\n    currentQIndex, sessionResults: [...sessionResults],\n    questionStates: questionStates.map(s=>({...s})),\n    studyAnswerCache: studyAnswerCache.map(c=>c?{...c}:null),\n    questionIndexMap: _questionIndexMap ? [..._questionIndexMap] : null\n  };\n}\n\nfunction loadQTypeSession(qtypeId){\n  const key=currentLesson.id+\":\"+qtypeId;\n  return qtypeSessionState[key]||null;\n}\n\nfunction startQTypeSession(){\n  const qs = currentLesson.questions[currentQType]||[];\n  const total = qs.length;\n  const existing=loadQTypeSession(currentQType);\n\n  // REMOVED: this used to reorder unanswered questions to the front of the\n  // list (\"show what you haven't answered yet first\"). It kept causing the\n  // same recurring bug — Practice mode's \"Question 1\" silently showing a\n  // DIFFERENT question's text than Revise mode's \"Question 1,\" because the\n  // display position no longer matched the question's real position in the\n  // lesson data. A narrower patch tried to stop a stale map leaking between\n  // tabs, but the reordering itself was still the underlying cause. Questions\n  // now always display in the lesson's fixed, natural order — identical to\n  // Revise mode — so \"Question 1\" always means the same thing everywhere.\n  _questionIndexMap = null;\n\n  if(existing){\n    // Restore previous progress for this qtype\n    currentQIndex=existing.currentQIndex;\n    sessionResults=[...existing.sessionResults];\n    questionStates=existing.questionStates.map(s=>({...s}));\n    studyAnswerCache=existing.studyAnswerCache.map(c=>c?{...c}:null);\n  } else {\n    currentQIndex=0;\n    sessionResults=[];\n    questionStates=Array.from({length:total},()=>({answered:false,skipped:false,pct:null}));\n    studyAnswerCache=Array.from({length:total},()=>null);\n  }\n  matchAnswers={};\n  mcqSelected=null;\n  startTimer();\n  const qTimerBar = document.querySelector(\".q-timer-bar\");\n  if(qTimerBar) qTimerBar.style.display = \"flex\";\n  renderNavBar();\n  // If this qtype was already answered fully, jump to its last position; else render current\n  jumpToQuestion(currentQIndex);\n}\n\nfunction saveStudyAnswer(pct){\n  if(!studyAnswerCache || currentLesson?.id===\"__mock__\") return;\n  const body=document.getElementById(\"quizBody\");\n  if(body && studyAnswerCache[currentQIndex]===null){\n    studyAnswerCache[currentQIndex]={bodyHTML:body.innerHTML, pct};\n  }\n}\n\n// ── NAVIGATION BAR ──\nfunction renderNavBar(){\n  const qs=currentLesson.questions[currentQType]||[];\n  const bar=document.getElementById(\"qNavBar\");\n  if(!qs.length){ bar.style.display=\"none\"; return; }\n  bar.style.display=\"flex\";\n  bar.innerHTML=\"\";\n  if(!qs.length) { bar.style.display=\"none\"; return; }\n\n  // Prev button\n  const prev=document.createElement(\"button\");\n  prev.className=\"q-nav-prev\"; prev.textContent=\"← Prev\";\n  prev.disabled=currentQIndex===0;\n  prev.onclick=()=>jumpToQuestion(currentQIndex-1);\n  bar.appendChild(prev);\n\n  // Dot per question\n  qs.forEach((_,i)=>{\n    const dot=document.createElement(\"div\");\n    dot.className=\"q-nav-dot\";\n    const origI = getOriginalQIndex(i);\n    const qMasteryKey = (currentLesson?.id||\"\")+\"_\"+(currentQType||\"\")+\"_\"+origI;\n    const isMastered = _masteredQuestionKeys.has(qMasteryKey);\n    dot.textContent = isMastered ? \"✓\" : (i+1);\n    if(isMastered) dot.title = \"Mastered — try a new one!\";\n    if(i===currentQIndex) dot.classList.add(\"current\");\n    else if(questionStates[i]?.answered){\n      const p=questionStates[i].pct;\n      dot.classList.add(p>=80?\"answered-good\":p>=50?\"answered-mid\":\"answered-poor\");\n    } else if(questionStates[i]?.skipped) dot.classList.add(\"skipped\");\n    else if(isMastered) dot.classList.add(\"answered-good\");\n    dot.onclick=()=>jumpToQuestion(i);\n    bar.appendChild(dot);\n  });\n\n  // Next button\n  const next=document.createElement(\"button\");\n  next.className=\"q-nav-next\"; next.textContent=\"Next →\";\n  next.disabled=currentQIndex>=qs.length-1;\n  next.onclick=()=>jumpToQuestion(currentQIndex+1);\n  bar.appendChild(next);\n}\n\nfunction jumpToQuestion(idx){\n  const total=(currentLesson.questions[currentQType]||[]).length;\n  if(idx<0||idx>=total) return;\n  const body=document.getElementById(\"quizBody\");\n  currentQIndex=idx;\n  mcqSelected=null;\n  matchAnswers={};\n  renderNavBar();\n  // Restore cached state if this question was already answered\n  if(studyAnswerCache && studyAnswerCache[idx]){\n    const cached=studyAnswerCache[idx];\n    body.innerHTML=cached.bodyHTML;\n    document.getElementById(\"resultPanel\")?.classList.add(\"visible\");\n    const br=document.getElementById(\"btnRow\");\n    if(br) br.style.display=\"flex\";\n  } else {\n    renderCurrentQuestion();\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n//  RENDER CURRENT QUESTION\n// ═══════════════════════════════════════════════════════\n// Load answered + mastered question keys from Firebase on login (not just on scoreboard open)\nasync function loadMasteryKeys(){\n  if(!window._fb || !currentUserPhone){ console.log(\"loadMasteryKeys: skipped, no fb or phone\"); return; }\n  if(_answeredKeysLoaded){ console.log(\"loadMasteryKeys: already loaded\"); return; }\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  try{\n    console.log(\"loadMasteryKeys: fetching logs...\");\n    const logsSnap = await getDocs(query(collection(db,\"sessions\",currentUserPhone,\"logs\"), orderBy(\"ts\",\"asc\")));\n    console.log(\"loadMasteryKeys: got\", logsSnap.size, \"log entries\");\n    logsSnap.forEach(function(d){\n      var e = d.data();\n      var key = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n      _answeredQuestionKeys.add(key);\n      if((e.pct||0) >= 80 && !e.peeked) _masteredQuestionKeys.add(key);\n    });\n    _answeredKeysLoaded = true;\n    console.log(\"loadMasteryKeys: answered=\", _answeredQuestionKeys.size, \"mastered=\", _masteredQuestionKeys.size);\n    // Re-render lesson cards with updated mastery info\n    try{ renderLessons(); console.log(\"loadMasteryKeys: renderLessons OK\"); }catch(e2){ console.log(\"loadMasteryKeys: renderLessons skipped -\", e2.message); }\n  }catch(e){ console.error(\"loadMasteryKeys error:\", e); }\n}\n\n// Maps display index to original DATA index (accounts for weighted reordering)\nfunction getOriginalQIndex(displayIdx){\n  return _questionIndexMap ? (_questionIndexMap[displayIdx]||displayIdx) : displayIdx;\n}\n// Gets the actual question object at the current display index\nfunction getCurrentQuestion(){\n  var qs = currentLesson.questions[currentQType]||[];\n  return qs[getOriginalQIndex(currentQIndex)];\n}\n\n// Returns a small badge showing whether this question is mastered, tried, or new\nfunction getQuestionStatusBadge(lessonId, qtype, qIndex){\n  var realIdx = getOriginalQIndex(qIndex||0);\n  var key = (lessonId||\"\")+\"_\"+(qtype||\"\")+\"_\"+realIdx;\n  if(_masteredQuestionKeys.has(key)) return '<span style=\"display:inline-block;font-size:9px;font-weight:700;background:var(--green-light);color:var(--green);padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle\">✅ Mastered<\u002Fspan>';\n  if(_answeredQuestionKeys.has(key)) return '<span style=\"display:inline-block;font-size:9px;font-weight:700;background:var(--gold-light);color:#7d5c1e;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle\">📝 Attempted<\u002Fspan>';\n  return '<span style=\"display:inline-block;font-size:9px;font-weight:700;background:rgba(100,149,237,.15);color:#4169e1;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle\">🆕 New<\u002Fspan>';\n}\n\nfunction renderCurrentQuestion(){\n  if(currentMode===\"revise\") return;\n  if(currentLesson?.id===\"__mock__\") return; // practice test uses renderMockQuestion directly\n  // Reset per-question timer\n  _questionStart=Date.now();\n  const qEl=document.getElementById(\"qTimer\");\n  if(qEl) qEl.textContent=\"0:00\";\n  const qs=currentLesson.questions[currentQType]||[];\n  const body=document.getElementById(\"quizBody\");\n  body.style.display=\"block\";\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  body.scrollTo(0,0);\n  document.getElementById(\"quizOverlay\").scrollTo(0,0);\n  // Keep active tab highlight in sync\n  renderQTypeTabs();\n\n  // update progress\n  const total=qs.length;\n  const _qcr=document.getElementById(\"qCounter\"); if(_qcr) _qcr.textContent=total?`${currentQIndex+1} / ${total}`:\"\";\n  document.getElementById(\"progressFill\").style.width=total?`${(currentQIndex/total)*100}%`:\"0%\";\n\n  // Tell the admin mirror what the student is currently looking at\n  fbLiveState({\n    mode: \"study\",\n    lessonId: currentLesson?.id||\"\",\n    lessonTitle: currentLesson?.title||\"\",\n    qtype: currentQType,\n    qIndex: currentQIndex,\n    qTotal: total,\n    questionText: (qs[getOriginalQIndex(currentQIndex)]?.q || qs[getOriginalQIndex(currentQIndex)]?.sentence || qs[getOriginalQIndex(currentQIndex)]?.statement || \"\"),\n    correctAnswer: (qs[getOriginalQIndex(currentQIndex)]?.answer || (qs[getOriginalQIndex(currentQIndex)]?.answers||[]).join(\" / \") || \"\"),\n    currentAnswer: \"\",\n    answered: false,\n    isCorrect: false,\n    peeksUsedThisQuestion: 0 // fresh question — clear any peek flag left over from the previous one\n  });\n\n  if(!total){\n    body.innerHTML=`<div class=\"no-questions\">\n      <div class=\"nq-icon\">📭<\u002Fdiv>\n      <p>No questions added yet for this section.<br>Questions will appear here once added.<\u002Fp>\n    <\u002Fdiv>`;\n    return;\n  }\n\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const isLast=currentQIndex>=total-1;\n  const qnum=`Question ${currentQIndex+1} of ${total}`;\n\n  switch(currentQType){\n    case \"mcq\":        renderMCQ(q, qnum, isLast); break;\n    case \"fill\":       renderFill(q, qnum, isLast); break;\n    case \"match\":      renderMatch(q, qnum, isLast); break;\n    case \"brief\":      renderTextAnswer(q, qnum, isLast, false); break;\n    case \"truefalse\":  renderTrueFalse(q, qnum, isLast); break;\n    case \"reasons\":    renderTextAnswer(q, qnum, isLast, false); break;\n    case \"distinguish\":renderDistinguish(q, qnum, isLast); break;\n    case \"paragraph\":  renderTextAnswer(q, qnum, isLast, true); break;\n    case \"memorise\":   renderMemorise(q, qnum, isLast); break;\n  }\n  maybeShowNewTryBanner(currentQType, getOriginalQIndex(currentQIndex));\n}\n\n\n// ── MEMORISE (Quote from Memory) ──\n// Shows the full poem/passage first. Student reads it, hides it,\n// then types it from memory. Score is based on word-level accuracy.\nfunction renderMemorise(q, qnum, isLast){\n  const peekBtn = currentMode!==\"exam\" ? `\n    <button class=\"btn-peek\" id=\"mainPeekBtn\" onclick=\"togglePeekMem()\" style=\"margin-bottom:10px\">\n      📖 Show / Hide the poem to study\n    <\u002Fbutton>\n    <div class=\"peek-panel\" id=\"peekPanel\" style=\"font-family:Georgia,serif;white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--text)\">\n${q.lines.replace(/<\u002Fg,\"&lt;\")}\n    <\u002Fdiv>` : \"\";\n  const actionBtns = currentMode===\"exam\"\n    ? `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"examNextText(${isLast})\">${isLast?\"Finish ✓\":\"Next →\"}<\u002Fbutton>`\n    : `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkTextAnswer()\">Check Recitation<\u002Fbutton>\n       <button class=\"btn-skip\" onclick=\"skipQuestion(${isLast})\">Skip<\u002Fbutton>`;\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">🎤 Quote from Memory<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text\">${q.q}<\u002Fdiv>\n    <\u002Fdiv>\n    ${peekBtn}\n    <div id=\"speedTimerWrap\" style=\"margin:0 0 10px;padding:8px 10px;background:var(--parchment);border-radius:8px\">\n      <div style=\"font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center\" id=\"speedChallenge\">⚡ Challenge: Can you finish this one fast?<\u002Fdiv>\n      <div style=\"background:#e0e0e0;border-radius:3px;overflow:hidden;height:5px;margin-bottom:5px\">\n        <div id=\"speedTimerBar\" style=\"height:100%;width:100%;background:#4a9873;border-radius:3px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:10px;color:var(--muted)\">Speed Bonus<\u002Fspan>\n        <span id=\"speedTimerPts\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#4a9873;color:#fff;transition:background .5s\">⚡ calculating…<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"speedNudge\" style=\"font-size:11px;font-weight:600;margin-top:6px;text-align:center;min-height:16px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"answer-area\" id=\"answerArea\" style=\"margin-top:10px\">\n      <textarea class=\"answer-textarea\" id=\"answerInput\"\n        placeholder=\"Study the poem above, then hide it and type it from memory here…\"\n        style=\"min-height:180px;font-family:Georgia,serif;line-height:1.8\"\n        oninput=\"fbLiveState({currentAnswer:this.value, typing:true})\"\n        onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\"><\u002Ftextarea>\n      <div class=\"answer-actions\">${actionBtns}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">🔁 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results 🎯\":\"Next Question →\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n  setTimeout(()=>startSpeedTimer(\"memorise\"), 50);\n}\n\nfunction togglePeekMem(){\n  const panel = document.getElementById(\"peekPanel\");\n  const btn = document.getElementById(\"mainPeekBtn\");\n  const ta = document.getElementById(\"answerInput\");\n  if(!panel) return;\n  const showing = panel.classList.toggle(\"visible\");\n  btn.textContent = showing ? \"📕 Hide poem — now type from memory!\" : \"📖 Show poem again\";\n  if(ta) ta.disabled = showing; // lock textarea while poem is visible\n}\n\n// ── SHUFFLE helper ──\nfunction shuffle(arr){\n  const a=[...arr];\n  for(let i=a.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [a[i],a[j]]=[a[j],a[i]];\n  }\n  return a;\n}\n\n// ── MCQ ──\nfunction renderMCQ(q, qnum, isLast){\n  mcqSelected=null;\n\n  // Shuffle options, track where the correct answer lands\n  const indexed = q.options.map((text,i)=>({text,orig:i}));\n  const shuffled = shuffle(indexed);\n  const newCorrect = shuffled.findIndex(o=>o.orig===q.correct);\n\n  const opts=shuffled.map((o,i)=>`\n    <div class=\"mcq-option\" id=\"mcqopt${i}\" onclick=\"selectMCQ(${i},${newCorrect},${isLast})\">\n      <span class=\"mcq-opt-letter\">${String.fromCharCode(65+i)}<\u002Fspan>\n      <span>${o.text}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\");\n\n  const actionBtn = currentMode===\"exam\"\n    ? `<button class=\"btn-next\" id=\"examNextBtn\" onclick=\"examNextMCQ(${newCorrect},${isLast})\" disabled style=\"margin-bottom:24px\">${isLast?\"Finish ✓\":\"Next →\"}<\u002Fbutton>`\n    : ``;\n\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">Choose the Correct Answer<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text\">${q.q}<\u002Fdiv>\n      <div class=\"mcq-options\">${opts}<\u002Fdiv>\n    <\u002Fdiv>\n    ${actionBtn}\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">🔁 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results 🎯\":\"Next Question →\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n}\nfunction selectMCQ(idx, correctIdx, isLast){\n  if(currentMode!==\"exam\" && document.getElementById(\"btnRow\")?.style.display===\"flex\") return;\n  mcqSelected=idx;\n  const opts = document.querySelectorAll(\".mcq-option\");\n  const selText = opts[idx]?.querySelector(\"span:last-child\")?.textContent || opts[idx]?.textContent || \"\";\n  const correctText = opts[correctIdx]?.querySelector(\"span:last-child\")?.textContent || opts[correctIdx]?.textContent || \"\";\n  fbLiveState({ currentAnswer: selText, correctAnswer: correctText, isCorrect: idx===correctIdx, typing:false });\n\n  if(currentMode===\"exam\"){\n    // Exam mode: just highlight selected, enable Next button\n    document.querySelectorAll(\".mcq-option\").forEach((el,i)=>el.classList.toggle(\"selected\",i===idx));\n    const eb=document.getElementById(\"examNextBtn\");\n    if(eb) eb.disabled=false;\n    return;\n  }\n\n  // Study mode: instant green/red\n  document.querySelectorAll(\".mcq-option\").forEach((el,i)=>{\n    el.onclick=null;\n    if(i===correctIdx) el.classList.add(\"correct\");\n    else if(i===idx)   el.classList.add(\"wrong\");\n  });\n  const pct = idx===correctIdx ? 100 : 0;\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  const elapsed=stampQuestion();\n  logQuestion(pct,elapsed);\n  showSimpleResult(pct,\n    (idx===correctIdx?\"Correct! Well done 🎉\":\"Incorrect. The correct answer is highlighted in green.\")\n    +` ${timeChip(elapsed)}`);\n  const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n}\nfunction examNextMCQ(correctIdx, isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const pct=mcqSelected===correctIdx?100:0;\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  // Read displayed text from the DOM (shuffled order)\n  const selectedText = mcqSelected!==null\n    ? document.querySelector(`#mcqopt${mcqSelected} span:last-child`)?.textContent || \"(not answered)\"\n    : \"(not answered)\";\n  const correctText = document.querySelector(`#mcqopt${correctIdx} span:last-child`)?.textContent || \"\";\n  examAnswers.push({\n    q: q.q,\n    userText: selectedText,\n    modelText: correctText,\n    pct,\n    qtype: currentQType,\n    lessonTitle: currentLesson.title,\n    lessonId: currentLesson.id,\n    mockIdx: mockQIndex\n  });\n  if(isLast){ showMockResults(); return; }\n  mcqSelected=null; nextQuestion();\n}\n// checkMCQ is now handled directly inside selectMCQ for study mode\n\n// ── FILL IN BLANKS ──\nfunction renderFill(q, qnum, isLast){\n  let idx=0;\n  const html=q.sentence.replace(/___/g,()=>\n    `<input class=\"blank-input\" id=\"blank${idx++}\" placeholder=\"type answer...\" autocomplete=\"off\" spellcheck=\"false\" onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\" oninput=\"fbLiveState({currentAnswer:[...document.querySelectorAll('.blank-input')].map(i=>i.value).join(' / '), typing:true})\">`\n  );\n\n  const peekBtn = currentMode!==\"exam\" ? `<button class=\"btn-peek\" onclick=\"toggleFillPeek()\">👁 View Answer before
