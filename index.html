gify(_logsLocalCache)); }\n  catch(e){ /* storage full/disabled \u2014 safe to skip, just means no persistence across reloads */ }\n}\n\n// Wraps a plain array of already-fetched entries so every existing consumer\n// (.forEach, .empty, .size) keeps working exactly as if this were a real\n// Firestore QuerySnapshot \u2014 nothing downstream needs to change.\nfunction makeLocalSnapshot(entries){\n  return {\n    empty: entries.length === 0,\n    size: entries.length,\n    forEach(cb){ entries.forEach(e => cb({ id: e._id, data: () => e })); }\n  };\n}\n\n// Unwraps any Firestore-snapshot-shaped object (real or makeLocalSnapshot's\n// stand-in) back into a plain array of doc data \u2014 for callers like\n// computeStudyInsights that just want to iterate entries, not deal with\n// the .forEach(doc=>doc.data()) ceremony.\nfunction snapToArray(snap){\n  const out = [];\n  if(snap) snap.forEach(d => out.push(d.data()));\n  return out;\n}\n\n// Fetches only documents at or after `sinceTs` (inclusive, so the boundary\n// document \u2014 which we may already have \u2014 gets deduped below rather than\n// risking ever silently skipping it). Pass sinceTs=0 for a full first sync.\nasync function fetchLogsSince(kind, sinceTs){\n  const { db, collection, query, orderBy, where, getDocs } = window._fb;\n  const base = collection(db,\"sessions\",currentUserPhone,kind);\n  const q = sinceTs > 0\n    ? query(base, where(\"ts\",\">=\", new Date(sinceTs)), orderBy(\"ts\",\"asc\"))\n    : query(base, orderBy(\"ts\",\"asc\"));\n  const snap = await getDocs(q);\n  const fresh = [];\n  snap.forEach(d=>{\n    const e = d.data();\n    const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : (typeof e.ts === \"number\" ? e.ts : Date.now());\n    fresh.push({ ...e, ts: tsMs, _id: d.id });\n  });\n  return fresh;\n}\n\nfunction mergeFreshIntoCache(existingEntries, freshEntries){\n  if(!freshEntries.length) return existingEntries;\n  const existingIds = new Set(existingEntries.map(e=>e._id).filter(Boolean));\n  const merged = existingEntries.slice();\n  let newestTs = 0;\n  freshEntries.forEach(e=>{\n    if(e.ts > newestTs) newestTs = e.ts;\n    if(e._id && existingIds.has(e._id)) return; // already have this one \u2014 boundary overlap from the >= query\n    merged.push(e);\n  });\n  return { merged, newestTs };\n}\n\nasync function getLogsBundle(){\n  if(_logsBundleCache && (Date.now()-_logsBundleCache.ts) < LOGS_BUNDLE_TTL_MS){\n    return _logsBundleCache;\n  }\n  if(!_logsLocalCache) _logsLocalCache = loadLogsLocalCache();\n\n  const [freshLogs, freshExam, freshSpell, totalTestPoints] = await Promise.all([\n    fetchLogsSince(\"logs\", _logsLocalCache.logsLastTs),\n    fetchLogsSince(\"examAnswers\", _logsLocalCache.examLastTs),\n    fetchLogsSince(\"spellErrors\", _logsLocalCache.spellLastTs),\n    fetchTotalTestPoints()\n  ]);\n\n  if(freshLogs.length){\n    const { merged, newestTs } = mergeFreshIntoCache(_logsLocalCache.logsEntries, freshLogs);\n    _logsLocalCache.logsEntries = merged;\n    _logsLocalCache.logsLastTs = Math.max(_logsLocalCache.logsLastTs, newestTs);\n  }\n  if(freshExam.length){\n    const { merged, newestTs } = mergeFreshIntoCache(_logsLocalCache.examEntries, freshExam);\n    _logsLocalCache.examEntries = merged;\n    _logsLocalCache.examLastTs = Math.max(_logsLocalCache.examLastTs, newestTs);\n  }\n  if(freshSpell.length){\n    const { merged, newestTs } = mergeFreshIntoCache(_logsLocalCache.spellEntries, freshSpell);\n    _logsLocalCache.spellEntries = merged;\n    _logsLocalCache.spellLastTs = Math.max(_logsLocalCache.spellLastTs, newestTs);\n  }\n  if(freshLogs.length || freshExam.length || freshSpell.length) saveLogsLocalCache();\n\n  _logsBundleCache = {\n    logsSnap: makeLocalSnapshot(_logsLocalCache.logsEntries),\n    examSnap: makeLocalSnapshot(_logsLocalCache.examEntries),\n    spellSnap: makeLocalSnapshot(_logsLocalCache.spellEntries),\n    totalTestPoints,\n    ts: Date.now()\n  };\n  return _logsBundleCache;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LIVE GROWTH POINTS BADGE \u2014 a real, always-visible score,\n//  not just a fleeting toast\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Loaded once (the real total, calculated the exact same way the Scoreboard\n// does), then kept in sync purely in memory from that point on \u2014 every time\n// points are earned anywhere in the app, this number bumps immediately, with\n// a little pulse, right in the header. No waiting to open the Scoreboard to\n// see it move.\nlet _liveGrowthPoints = null;\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  GROWTH POINTS FLOOR \u2014 locked in at today's corrected total\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// An earlier version of this floor was anchored to an old, inflated\n// number (from before several over-counting bugs were fixed) \u2014 which\n// meant the true corrected total could sit far below it, making the\n// score look frozen. This version doesn't hardcode any old number: the\n// FIRST time it ever runs for this account, it simply seeds itself at\n// whatever the current, already-corrected calculation gives \u2014 today's\n// real total, nothing else. From that exact point on, it can only ever\n// climb, permanently, no matter what future fixes change about how new\n// points are calculated. The goal is the same as it always was \u2014 a\n// number that never goes backwards \u2014 just anchored at an honest starting\n// line instead of a number that was never accurate to begin with.\nlet _growthPointsFloorCache = null;\n\nasync function applyGrowthPointsFloor(freshTotal){\n  if(!window._fb || !currentUserPhone) return freshTotal; // no account context \u2014 nothing to floor against\n  if(_growthPointsFloorCache === null){\n    try{\n      const { db, doc, getDoc } = window._fb;\n      const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"));\n      // No floor recorded yet \u2014 seed it at today's fresh total, not any\n      // old hardcoded number. This is the one and only place a fresh\n      // total is ever treated as the new baseline going forward.\n      _growthPointsFloorCache = snap.exists() ? (snap.data().value||0) : freshTotal;\n      if(!snap.exists()){\n        const { setDoc } = window._fb;\n        setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"), { value: freshTotal }).catch(()=>{});\n      }\n    }catch(e){ _growthPointsFloorCache = freshTotal; }\n  }\n  const effective = Math.max(freshTotal, _growthPointsFloorCache);\n  if(effective > _growthPointsFloorCache){\n    _growthPointsFloorCache = effective;\n    if(window._fb && currentUserPhone){\n      const { db, doc, setDoc } = window._fb;\n      setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"), { value: effective }).catch(()=>{});\n    }\n  }\n  return effective;\n}\n\nasync function initLiveGrowthBadge(){\n  const badge = document.getElementById(\"quizGrowthBadge\");\n  if(!badge) return;\n  if(_liveGrowthPoints !== null){ badge.textContent = \"\ud83c\udf31 \"+_liveGrowthPoints; return; } // already loaded this session \u2014 reuse it\n  if(!window._fb || !currentUserPhone){ badge.textContent = \"\"; return; }\n  try{\n    const { logsSnap, examSnap, totalTestPoints } = await getLogsBundle();\n    const { allUnique, allScoredEntries } = aggregateScoreboardData(logsSnap, examSnap);\n    const { growthPoints } = calcGrowthScore(allUnique, allScoredEntries, totalTestPoints);\n    _liveGrowthPoints = await applyGrowthPointsFloor(growthPoints);\n    badge.textContent = \"\ud83c\udf31 \"+_liveGrowthPoints;\n  }catch(e){ badge.textContent = \"\"; }\n}\n\n// Call this anywhere points are actually earned \u2014 bumps the header badge\n// immediately instead of only showing a toast that disappears.\nfunction bumpGrowthPointsBadge(amount){\n  if(!amount || _liveGrowthPoints===null) return; // badge hasn't loaded yet \u2014 toast still shows regardless, this just skips the live bump this one time\n  _liveGrowthPoints += amount;\n  if(_growthPointsFloorCache !== null && _liveGrowthPoints > _growthPointsFloorCache){\n    _growthPointsFloorCache = _liveGrowthPoints; // keep the floor caught up to what's already been shown live\n    if(window._fb && currentUserPhone){\n      const { db, doc, setDoc } = window._fb;\n      setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"growthPointsFloor\"), { value: _liveGrowthPoints }).catch(()=>{});\n    }\n  }\n  const badge = document.getElementById(\"quizGrowthBadge\");\n  if(!badge) return;\n  badge.textContent = \"\ud83c\udf31 \"+_liveGrowthPoints;\n  badge.classList.add(\"bump\");\n  setTimeout(()=>badge.classList.remove(\"bump\"), 200);\n}\n\n// Same logic as the admin's scoreboard, but scoped to the logged-in student\n// viewing their own all-time stats (no live-mirroring UI needed here).\nasync function buildStudentScoreboard(){\n  const totalBox = document.getElementById(\"studentScoreboardTotal\");\n  if(!totalBox) return;\n\n  if(!window._fb || !currentUserPhone){\n    totalBox.innerHTML = \"<p style='margin:0'>Scoreboard needs an internet connection.<\u002Fp>\";\n    return;\n  }\n\n  totalBox.innerHTML = \"Loading\u2026\";\n\n  let logsSnap, examSnap, totalTestPoints;\n  try{\n    ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  } catch(err){\n    totalBox.innerHTML = \"<p style='margin:0'>Couldn't load scoreboard right now.<\u002Fp>\";\n    return;\n  }\n\n  if(logsSnap.empty && examSnap.empty){\n    totalBox.innerHTML = \"<p style='margin:0'>No sessions recorded yet \u2014 keep studying!<\u002Fp>\";\n    return;\n  }\n\n  // Catch up on anything already true but never actually logged as a real\n  // event \u2014 a lesson mastered before this feature existed, or a Daily\n  // Goal/session/time bonus that was always correctly counted in the total\n  // but never had a Points History entry to show for it. If any of this\n  // logs something new, re-fetch once so THIS render reflects it, instead\n  // of only the next one.\n  const firstPassEntries = aggregateScoreboardData(logsSnap, examSnap).allScoredEntries;\n  await sweepAllPendingBonuses();\n  await syncPointAchievementsToHistory(firstPassEntries);\n  ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  maybeShowScoreCorrectionNotice();\n\n  const agg = aggregateScoreboardData(logsSnap, examSnap);\n  const allScoredEntries = agg.allScoredEntries;\n  let grandTimeMs = agg.grandTimeMs;\n\n  // Build set of previously-answered question keys for first-attempt bonus + mastery tracking\n  if(!_answeredKeysLoaded){\n    await loadContentEditMarkers();\n    allScoredEntries.forEach(function(e){\n      // Skip entries that no longer refer to the question actually at this\n      // position -- e.g. a delete elsewhere in the array shifted it.\n      if(!isMasteryKeyStillValid(e.lessonId||\"\", e.qtype||\"\", e.qIndex||0, e.ts)) return;\n      var key = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n      _answeredQuestionKeys.add(key);\n      // Mastered = scored 80%+ at least once WITHOUT peeking \u2014 a score reached\n      // by looking at the model answer isn't proof he knows it unaided.\n      if((e.pct||0) >= 80 && !e.peeked) _masteredQuestionKeys.add(key);\n      recordQuestionScoreInfo(key, e.pct||0, !!e.peeked);\n    });\n    _answeredKeysLoaded = true;\n  }\n\n  // Merge current session entries that may not yet be in Firebase, so the\n  // 30-min time bonus and stats update immediately \u2014 matched by clientId\n  // (a stable ID stored in both places) rather than timestamp, since a\n  // session's local Date.now() and Firestore's serverTimestamp() can never\n  // be made to match even for the exact same entry. Older entries logged\n  // before clientId existed won't have one on either side, so they simply\n  // never match here and fall back to showing only once they've synced \u2014\n  // no different from how every entry already behaved before this fix.\n  const existingClientIds = new Set(allScoredEntries.map(e=>e.clientId).filter(Boolean));\n  sessionLog.forEach(function(e){\n    if(e.clientId && !existingClientIds.has(e.clientId)){\n      allScoredEntries.push(e);\n      grandTimeMs += e.timeMs || 0;\n    }\n  });\n\n  totalBox.innerHTML = (await renderScoreboardTotalHTML(agg.bySession, agg.allUnique, agg.grandAttempts, grandTimeMs, agg.mockStats, allScoredEntries, totalTestPoints)) + renderMilestonesHTML();\n  celebrateDailyGoalIfJustCompleted(agg.allUnique, allScoredEntries, totalTestPoints);\n}\n\n// A card showing progress toward each Social Science milestone \u2014 which\n// lessons are genuinely mastered (not peeked-through) toward each batch,\n// and how many milestones are complete overall.\n// A real, category-by-category audit of exactly where the total comes from \u2014\n// dark-theme styled to sit inside the Scoreboard's navy sheet, collapsed by\n// default like the other detail sections. Only shows categories that have\n// actually contributed something, so it stays short for a student who's\n// only earned points a few ways so far.\nfunction renderScoreBreakdownHTML(breakdown, rawTotal, flooredTotal){\n  const rows = [\n    [\"\ud83d\udcdd\", \"Practice answers (incl. first-attempt & speed bonus)\", breakdown.practice],\n    [\"\ud83d\udccb\", \"Daily Goal completions\", breakdown.dailyGoal],\n    [\"\u23f0\", \"Morning/Evening session bonuses\", breakdown.sessionBonuses],\n    [\"\u26a1\", \"Speed Bonus (older entries)\", breakdown.speedBonusLegacy],\n    [\"\ud83d\udcdd\", \"Practice Test scores\", breakdown.testPoints],\n    [\"\u23f1\", \"Daily time bonus (30+ min/subject)\", breakdown.dailyTime],\n    [\"\ud83d\udcd6\", \"Read & Memorise bonus\", breakdown.reciteReadMemorise],\n    [\"\ud83c\udf31\", \"New Question bonus\", breakdown.newTry],\n    [\"\ud83c\udfc6\", \"Lesson Mastery bonus\", breakdown.lessonMastery],\n    [\"\ud83c\udfc5\", \"Milestones\", breakdown.milestones],\n    [\"\ud83c\udf81\", \"Goodwill Points\", breakdown.goodwill],\n    [\"\ud83c\udf81\", \"Compensation bonus\", breakdown.compensation],\n    [\"\ud83c\udfaf\", \"Daily Practice Goal completions\", breakdown.dailyPracticeGoal],\n    [\"\ud83d\udd25\", \"Read & Memorise streak bonus\", breakdown.reciteStreak],\n  ].filter(r => r[2] > 0);\n  if(!rows.length) return \"\";\n  const rowsHTML = rows.map(r=>\n    `<div style=\"display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px\">\n      <div style=\"color:rgba(255,255,255,.8)\">${r[0]} ${r[1]}<\u002Fdiv>\n      <div style=\"font-weight:800;color:#7ee787\">+${r[2].toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>`\n  ).join(\"\");\n  // The header describes the number these rows actually sum to (today's\n  // fresh calculation). If the floor is currently protecting a HIGHER\n  // number than that (shouldn't normally happen now that it's seeded at an\n  // honest baseline, but could if a future fix genuinely reduces the raw\n  // math again), that gap is shown as its own explicit line rather than\n  // silently mixed into the same figure.\n  const floorNote = flooredTotal > rawTotal\n    ? `<div style=\"margin-top:10px;padding:8px 10px;background:rgba(209,152,63,.12);border:1px solid rgba(209,152,63,.3);border-radius:8px;font-size:11.5px;color:rgba(255,255,255,.75)\">\n        \ud83d\udee1\ufe0f Your displayed total is protected at <b style=\"color:#d1983f\">${flooredTotal.toLocaleString()}<\u002Fb> \u2014 the highest it's ever reached \u2014 even though today's fresh calculation below currently comes to ${rawTotal.toLocaleString()}. It can only go up from here, never down.\n      <\u002Fdiv>`\n    : \"\";\n  return `<div style=\"margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)\">\n    <details>\n      <summary style=\"list-style:none;cursor:pointer;font-weight:800;color:#fff;font-size:13px;user-select:none\">\ud83d\udd0d Score Breakdown \u2014 why is it ${rawTotal.toLocaleString()}?<\u002Fsummary>\n      <div style=\"margin-top:8px\">${rowsHTML}<\u002Fdiv>\n      ${floorNote}\n    <\u002Fdetails>\n  <\u002Fdiv>`;\n}\n\nfunction renderMilestonesHTML(){\n  const milestones = buildSocialMilestones();\n  if(!milestones.length) return \"\";\n  let stillInOrder = true; // flips false at the first milestone whose lessons aren't all mastered yet\n  let completeCount = 0;\n  const rows = milestones.map(m=>{\n    const doneLessons = m.lessons.filter(l=>isLessonFullyMastered(l)).length;\n    const lessonsMastered = doneLessons === m.lessons.length;\n    const isComplete = stillInOrder && lessonsMastered; // only counts as \"done\" if everything before it is genuinely done too, in order\n    const locked = !stillInOrder;\n    if(!lessonsMastered) stillInOrder = false; // this and everything after is gated behind finishing this one first\n    if(isComplete) completeCount++;\n    const icon = isComplete ? \"\ud83c\udfc5\" : locked ? \"\ud83d\udd12\" : \"\u2b1c\";\n    return `<div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);${locked?'opacity:.5':''}\">\n      <div style=\"flex:1;padding-right:10px\">\n        <div style=\"font-weight:700;color:var(--navy);font-size:12.5px\">${icon} Milestone ${m.num}${locked?` <span style=\"font-weight:400;color:var(--muted)\">(unlocks after Milestone ${m.num-1})<\u002Fspan>`:\"\"}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted);margin-top:1px\">${m.lessons.map(l=>l.title).join(\" \u00b7 \")}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-weight:800;font-size:13px;color:${isComplete?\"var(--green)\":\"var(--muted)\"};white-space:nowrap\">${doneLessons}/${m.lessons.length}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join(\"\");\n  return `<div style=\"margin-top:16px;background:var(--parchment);border-radius:12px;padding:12px 14px;color:var(--text)\">\n    <details>\n      <summary style=\"list-style:none;cursor:pointer;font-weight:800;color:var(--navy);font-size:13px;user-select:none\">\ud83c\udfc5 Milestones (${completeCount}/${milestones.length}) \u2014 +${MILESTONE_POINTS} pts each<\u002Fsummary>\n      <div style=\"margin-top:8px\">${rows}<\u002Fdiv>\n    <\u002Fdetails>\n  <\u002Fdiv>`;\n}\n\n// Fires a fireworks burst the first time the daily goal is seen as complete\n// for a given date \u2014 never repeats for the same day, even if the scoreboard\n// is reopened many times after it's already done. Uses localStorage purely\n// as a \"have I already celebrated today\" flag, scoped by date so it resets\n// naturally every day.\n// Checks for newly-completed milestones (daily goal, morning/evening sessions)\n// and celebrates each one exactly once per day \u2014 fireworks plus a clear\n// \"+N points\" announcement, separate from the small per-question toast.\n// Each milestone gets its own dated flag so completing several in one day\n// (e.g. daily goal AND both sessions) celebrates all of them, just once each.\nfunction celebrateDailyGoalIfJustCompleted(allUnique, allScoredEntries, totalTestPoints){\n  try{\n    const { dailyGoal, sessionGoals, practiceGoal } = calcGrowthScore(allUnique, allScoredEntries, totalTestPoints||0);\n    const todayKey = new Date().toISOString().slice(0,10); // YYYY-MM-DD\n\n    const milestones = [\n      { done: dailyGoal.completedToday, flag:\"goal\", points:10, label:\"Daily Goal complete!\" },\n    ];\n    // Daily Practice Goal \u2014 one milestone per tier reached today, each with\n    // its own points (celebrated once per tier per day via the storageKey\n    // below, so reaching tier 20 doesn't re-celebrate tiers 3/5/10/15 again).\n    practiceGoal.tiersReached.forEach(t=>{\n      milestones.push({ done:true, flag:`practice_tier_${t.count}`, points:t.points, label:`\ud83c\udfaf ${t.count} unique questions practiced today!` });\n    });\n    // Per-subject session milestones \u2014 full completion and partial \"started\"\n    Object.entries(sessionGoals.bySubject||{}).forEach(([subj,sg])=>{\n      const abbr = subj.split(\" \")[0]; // e.g. \"Social\" from \"Social Science\"\n      if(sg.earlyDone)       milestones.push({ done:true, flag:\"early_\"+subj,      points:70, label:`Early Morning \u2014 ${abbr}! \ud83c\udf05` });\n      else if(sg.lateDone)   milestones.push({ done:true, flag:\"late_\"+subj,       points:50, label:`Morning Session \u2014 ${abbr}! \ud83c\udf05` });\n      else if(sg.mornStarted)milestones.push({ done:true, flag:\"mornstart_\"+subj,  points:10, label:`${abbr} Morning started! \ud83d\udfe0 Keep going!` });\n      if(sg.eveningDone)     milestones.push({ done:true, flag:\"evening_\"+subj,    points:50, label:`Evening Session \u2014 ${abbr}! \ud83c\udf19` });\n      else if(sg.eveStarted) milestones.push({ done:true, flag:\"evestart_\"+subj,   points:10, label:`${abbr} Evening started! \ud83d\udfe0 Keep going!` });\n      if(sg.bothDone)        milestones.push({ done:true, flag:\"both_\"+subj,       points:50, label:`Both sessions \u2014 ${abbr}! \ud83c\udf89` });\n    });\n\n    let anyNewMilestone = false;\n    milestones.forEach(ms=>{\n      if(!ms.done) return;\n      const storageKey = `studybuddy_celebrated_${ms.flag}_${todayKey}`;\n      if(localStorage.getItem(storageKey)) return; // already celebrated this one today\n      localStorage.setItem(storageKey, \"1\");\n      showPointsToast(ms.points, ms.label);\n      anyNewMilestone = true;\n    });\n\n    if(anyNewMilestone) launchFireworks();\n  } catch(err){\n    // localStorage can throw in some restricted contexts \u2014 celebration is a\n    // nice-to-have, never worth breaking the scoreboard over.\n  }\n}\n\n// Shared aggregation logic used by both the student's and admin's scoreboard views.\nfunction aggregateScoreboardData(logsSnap, examSnap){\n  const bySession = {};\n  const allUnique = new Set();\n  let grandAttempts = 0, grandTimeMs = 0;\n\n  // Resolves a Firestore timestamp field to a real millisecond number, or null\n  // if it genuinely isn't available yet. Never falls back to \"now\" \u2014 doing so\n  // previously caused entries with an unresolved/missing timestamp to silently\n  // look like they happened today, every single time the page reloaded, which\n  // is exactly what made the daily goal appear permanently \"complete\" and never\n  // reset at midnight.\n  function resolveTs(e){\n    if(e.ts?.toDate) return e.ts.toDate().getTime();\n    if(typeof e.ts === \"number\") return e.ts; // already a millisecond number\n    return null;\n  }\n\n  logsSnap.forEach(d=>{\n    const e = d.data();\n\n    // Admin logs in through the exact same UI the student uses (to preview\n    // or test lessons/questions while managing content), and any question\n    // he answers there writes a normal \"logs\" entry tagged loggedBy:\"admin\".\n    // That's testing activity, not the student studying \u2014 it must never be\n    // counted as if the student did it. Bonus/achievement entries (goodwill,\n    // compensation, milestone, lesson mastery, daily/practice goal backfills)\n    // are deliberately NOT filtered here: those are legitimately awarded TO\n    // the student regardless of which login happened to trigger the write.\n    if(e.loggedBy===\"admin\" && REAL_QTYPES.has(e.qtype)) return;\n\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = { entries:[], mockEntries:[], firstTs:null, lastTs:null };\n    bySession[sid].entries.push(e);\n    const tsMs = resolveTs(e);\n    if(tsMs!==null){\n      if(!bySession[sid].firstTs || tsMs < bySession[sid].firstTs) bySession[sid].firstTs = tsMs;\n      if(!bySession[sid].lastTs  || tsMs > bySession[sid].lastTs)  bySession[sid].lastTs  = tsMs;\n    }\n\n    // Admin-awarded goodwill/compensation bonuses (and milestone bonuses)\n    // aren't a real answered question \u2014 they still show up in the session's\n    // activity list above, and still count toward Growth Points further\n    // down, but shouldn't inflate \"unique questions covered\" or the attempt count.\n    if(e.qtype!==\"goodwill\" && e.qtype!==\"compensation\" && e.qtype!==\"milestone\" && e.qtype!==\"lessonmastery\"){\n      // Only count toward \"unique questions covered\" if this qIndex still\n      // corresponds to a real question in the CURRENT lesson content, AND\n      // hasn't been shifted onto a different question by a later delete --\n      // content gets edited over time, so a slot he answered against long\n      // ago may no longer exist, or may now hold something he never\n      // actually attempted. grandAttempts/grandTimeMs still count it either\n      // way -- that's real time he genuinely spent, regardless of later\n      // content edits.\n      if(isMasteryKeyStillValid(e.lessonId, e.qtype, e.qIndex, tsMs)){\n        allUnique.add(`${e.lessonId}|${e.qtype}|${e.qIndex}`);\n      }\n      grandAttempts++;\n      grandTimeMs += e.timeMs || 0;\n    }\n  });\n\n  // Practice test answers \u2014 counted separately for the \"Practice Test\" stat row,\n  // and also folded into unique-questions / attempts / time so the grand total reflects everything.\n  let mockAttempts = 0, mockTimeMs = 0, mockScoreSum = 0, mockScoreCount = 0;\n  const mockUnique = new Set();\n  examSnap.forEach(d=>{\n    const e = d.data();\n    // Same admin-testing exclusion as above \u2014 every exam-answer entry is a\n    // genuine question attempt (no bonus/pseudo types exist in this collection).\n    if(e.loggedBy===\"admin\") return;\n\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = { entries:[], mockEntries:[], firstTs:null, lastTs:null };\n    bySession[sid].mockEntries.push(e);\n    const tsMs = resolveTs(e);\n    if(tsMs!==null){\n      if(!bySession[sid].firstTs || tsMs < bySession[sid].firstTs) bySession[sid].firstTs = tsMs;\n      if(!bySession[sid].lastTs  || tsMs > bySession[sid].lastTs)  bySession[sid].lastTs  = tsMs;\n    }\n\n    const uniqueKey = `mock|${e.lessonId}|${e.qtype}|${e.mockIdx}`;\n    mockUnique.add(uniqueKey);\n    allUnique.add(uniqueKey);\n    mockAttempts++;\n    grandAttempts++;\n    if(typeof e.pct === \"number\"){ mockScoreSum += e.pct; mockScoreCount++; }\n  });\n\n  const mockStats = {\n    attempts: mockAttempts,\n    uniqueCount: mockUnique.size,\n    avgScore: mockScoreCount ? Math.round(mockScoreSum/mockScoreCount) : null\n  };\n\n  // Flat list of every scored entry (study + mock combined) \u2014 used by the Growth Score\n  // calculation for mastery-weighting and the improvement trend, independent of how\n  // sessions/practice tests happen to be grouped. Entries with no resolvable timestamp\n  // are skipped entirely here, rather than guessed, since the daily goal and session\n  // goals both depend on knowing exactly which calendar day each entry belongs to.\n  const allScoredEntries = [];\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    if(e.loggedBy===\"admin\" && REAL_QTYPES.has(e.qtype)) return; // admin's own testing clicks -- not the student's activity\n    const tsMs = resolveTs(e);\n    if(typeof e.pct === \"number\" && tsMs!==null){\n      allScoredEntries.push({ pct:e.pct, qtype:e.qtype, ts: tsMs, subject:e.subject||\"\", lessonId:e.lessonId||\"\", qIndex:e.qIndex, timeMs:e.timeMs||0, clientId:e.clientId, marks:e.marks, peeked:e.peeked });\n    }\n  });\n  examSnap.forEach(d=>{\n    const e = d.data();\n    if(e.loggedBy===\"admin\") return; // same admin-testing exclusion\n    const tsMs = resolveTs(e);\n    if(typeof e.pct === \"number\" && tsMs!==null){\n      // Practice test answers don't carry a `subject` field directly \u2014 fall back\n      // to looking up the lesson, since practice tests can span multiple lessons\n      // that may belong to different subjects.\n      const lesson = findLessonById(e.lessonId);\n      allScoredEntries.push({ pct:e.pct, qtype:e.qtype, ts: tsMs, subject: lesson ? findSubjectForLesson(e.lessonId) : \"\", lessonId:e.lessonId||\"\", qIndex:e.mockIdx, timeMs:e.timeMs||0, clientId:e.clientId });\n    }\n  });\n  allScoredEntries.sort((a,b)=>a.ts-b.ts);\n\n  return { bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries };\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  GROWTH SCORE \u2014 rewards breadth + harder questions + improving, not just being \"good\"\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//\n// Three components, each 0-100, combined with weights:\n//   1. Coverage (40%)  \u2014 % of the ENTIRE syllabus ever attempted at least once.\n//                         Directly rewards trying new material over re-doing known questions.\n//   2. Mastery   (40%)  \u2014 accuracy weighted by question difficulty (using the same marks\n//                         weightage already used for exam scoring \u2014 Paragraph/Distinguish\n//                         count for more than MCQ). Rewards tackling harder question types well,\n//                         not just racking up easy correct answers.\n//   3. Trend     (20%)  \u2014 average score in the most recent half of attempts vs the earlier half.\n//                         Rewards genuinely improving over time, not just staying comfortable.\n//\n// The result is a single 0-100 \"Growth Score\" that a student can't inflate just by\n// repeating questions they already know.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  DAILY GOAL \u2014 answer at least one question from each of the 8 question\n//  types, every day. Rewards well-rounded daily practice (a bit of everything)\n//  rather than grinding only the question types that feel easiest.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Minimum score for an answer to count toward the daily goal / streaks. A\n// guess that happens to touch every question type shouldn't satisfy the goal \u2014\n// it should reflect genuine attempts, not just clicking through.\nconst MIN_SCORE_FOR_GOAL_CREDIT = 50;\n\nfunction calcDailyGoal(allScoredEntries){\n  const startOfToday = new Date();\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n\n  // Only require types that actually have questions in the syllabus.\n  // This means students aren't blocked from completing the daily goal just\n  // because e.g. English Grammar has no True/False questions.\n  const activeTypes = getActiveQTypes();\n  const activeCount = activeTypes.length;\n\n  const doneToday = new Set();\n  // Per-subject: which qtypes done today in each subject\n  const subjectNames = Object.keys(DATA);\n  const doneBySubject = {};\n  subjectNames.forEach(s=>{ doneBySubject[s] = new Set(); });\n\n  allScoredEntries.forEach(e=>{\n    if(e.ts >= todayMs && e.qtype && (e.pct??0) >= MIN_SCORE_FOR_GOAL_CREDIT){\n      doneToday.add(e.qtype);\n      const subj = e.subject||'';\n      if(doneBySubject[subj]) doneBySubject[subj].add(e.qtype);\n    }\n  });\n\n  const checklist = activeTypes.map(qt=>({ id:qt.id, label:qt.label, icon:qt.icon, done:doneToday.has(qt.id) }));\n  const doneCount = checklist.filter(c=>c.done).length;\n  const completedToday = doneCount >= activeCount;\n\n  // Per-subject checklist: only types that exist in that subject\n  const subjectChecklists = {};\n  subjectNames.forEach(s=>{\n    const subjTypes = getActiveQTypesForSubject(s);\n    subjectChecklists[s] = subjTypes.map(qt=>({\n      id:qt.id, label:qt.label, icon:qt.icon,\n      done: doneBySubject[s].has(qt.id)\n    }));\n  });\n\n  const byDay = {};\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    const d = new Date(e.ts);\n    d.setHours(0,0,0,0);\n    const key = d.getTime();\n    if(!byDay[key]) byDay[key] = new Set();\n    if(e.qtype) byDay[key].add(e.qtype);\n  });\n  let streak = 0;\n  let cursor = todayMs;\n  if(!completedToday) cursor -= 86400000;\n  // Streak: each past day must have covered all active types\n  while(byDay[cursor] && activeTypes.every(qt=>byDay[cursor].has(qt.id))){\n    streak++;\n    cursor -= 86400000;\n  }\n\n  return { checklist, doneCount, total:activeCount, completedToday, streak, subjectChecklists };\n}\n\n// Today's Daily Practice Goal progress, plus a streak of consecutive\n// days the top tier was reached -- the \"today\" view alongside\n// calcCumulativeTotals' permanent, history-wide count (which is what the\n// actual points are based on).\nfunction calcPracticeGoal(allScoredEntries){\n  const startOfToday = new Date();\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n  const topTier = DAILY_PRACTICE_TIERS[DAILY_PRACTICE_TIERS.length-1].count;\n\n  // Unique question keys attempted each day (Practice mode only, scored\n  // 50%+). Originally this counted ANY attempt regardless of score -- but\n  // that let skipping the actual question (after still going through the\n  // mandatory spelling warm-up) count toward the goal with zero real\n  // engagement. Requiring MIN_SCORE_FOR_GOAL_CREDIT here matches the same\n  // bar every other point/credit in the app already uses.\n  const seenByDay = {};\n  allScoredEntries.forEach(e=>{\n    if(!PRACTICE_GOAL_QTYPES.includes(e.qtype)) return;\n    if((e.pct||0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const dayKey = d.getTime();\n    if(!seenByDay[dayKey]) seenByDay[dayKey] = new Set();\n    seenByDay[dayKey].add((e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0));\n  });\n  const countForDay = dayKey => (seenByDay[dayKey] ? seenByDay[dayKey].size : 0);\n\n  const count = countForDay(todayMs);\n  const tiersReached = DAILY_PRACTICE_TIERS.filter(t=>count >= t.count);\n  const nextTier = DAILY_PRACTICE_TIERS.find(t=>count < t.count) || null;\n  const completedToday = count >= topTier;\n\n  let streak = 0, cursor = todayMs;\n  if(!completedToday) cursor -= 86400000;\n  while(countForDay(cursor) >= topTier){ streak++; cursor -= 86400000; }\n\n  return { count, tiers:DAILY_PRACTICE_TIERS, tiersReached, nextTier, completedToday, streak };\n}\n\n\n// Returns the question types that actually have questions within one specific subject.\n// Used so per-subject session bonuses only require types that subject has content for.\nfunction getActiveQTypesForSubject(subjectName){\n  const subj = DATA[subjectName];\n  if(!subj) return [];\n  const present = new Set();\n  for(const part of Object.values(subj.parts))\n    for(const lesson of part.lessons)\n      for(const qt of QTYPES)\n        if((lesson.questions[qt.id]||[]).length > 0) present.add(qt.id);\n  return QTYPES.filter(qt => present.has(qt.id));\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  SESSION GOALS \u2014 encourages showing up twice a day, with the strongest\n//  nudge reserved for studying early (6-7am specifically). Independent of the\n//  8-type daily goal above: this is about WHEN and HOW OFTEN he studies, not\n//  WHAT he studies.\n//\n//  A \"session\" here just means at least MIN_QUESTIONS_FOR_SESSION questions\n//  answered within that time window \u2014 low bar so it's achievable, high enough\n//  that opening and immediately closing the app doesn't count.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction calcSessionGoals(allScoredEntries){\n  const now = new Date();\n  const startOfToday = new Date(now);\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n\n  const subjectNames = Object.keys(DATA);\n\n  // Track which qtypes were answered per subject per time-bucket today.\n  // A subject session is complete only when ALL active qtypes for that subject\n  // are covered in that bucket \u2014 not just a count of questions.\n  // subjQtypes[subj][bucket] = Set of qtype ids answered\n  const subjQtypes = {};\n  subjectNames.forEach(s=>{ subjQtypes[s] = { early:new Set(), late:new Set(), evening:new Set() }; });\n\n  // Also track global early/late/evening any-subject coverage for the morning streak\n  const globalQtypes = { early:new Set(), late:new Set(), evening:new Set() };\n\n  allScoredEntries.forEach(e=>{\n    if(e.ts < todayMs || !e.qtype) return;\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    const hour = new Date(e.ts).getHours();\n    // Morning: 6am (early) or 7am (late)\n    // Evening: 5pm-9pm (17-21)\n    // Anything else (8am-5pm, after 10pm) does NOT count toward session bonuses \u2014\n    // this used to say hour>=8, which incorrectly treated ALL of 8am-11pm as\n    // \"evening,\" so studying right after the morning window (e.g. 9am, 2pm)\n    // was already being credited toward evening completion, well before\n    // evening \u2014 which looked exactly like the evening goal wasn't resetting.\n    const bucket = hour===6 ? 'early' : hour===7 ? 'late' : (hour>=17 && hour<=21) ? 'evening' : null;\n    if(!bucket) return;\n    globalQtypes[bucket].add(e.qtype);\n    const subj = e.subject || '';\n    if(subjQtypes[subj]) subjQtypes[subj][bucket].add(e.qtype);\n  });\n\n  // A subject session is done when all of that subject's active types are covered\n  function subjSessionDone(subj, bucket){\n    const required = getActiveQTypesForSubject(subj);\n    if(!required.length) return false;\n    return required.every(qt => subjQtypes[subj][bucket].has(qt.id));\n  }\n\n  // Global morning done = any subject covered all its types in 6-8am\n  // (used only for morning streak \u2014 per-subject has its own earlyDone/lateDone)\n  const anyEarlyDone = subjectNames.some(s => subjSessionDone(s, 'early'));\n  const anyLateDone  = subjectNames.some(s => subjSessionDone(s, 'late'));\n  const morningDone  = anyEarlyDone || anyLateDone;\n  const eveningDone  = subjectNames.some(s => subjSessionDone(s, 'evening'));\n  const bothDone     = morningDone && eveningDone;\n\n  // Per-subject status\n  const bySubject = {};\n  subjectNames.forEach(s=>{\n    const sEarly   = subjSessionDone(s, 'early');\n    const sLate    = subjSessionDone(s, 'late');\n    const sMorning = sEarly || sLate;\n    const sEvening = subjSessionDone(s, 'evening');\n    // Progress: how many types done vs required, per bucket\n    const required = getActiveQTypesForSubject(s);\n    const progEarly   = required.filter(qt=>subjQtypes[s].early.has(qt.id)).length;\n    const progLate    = required.filter(qt=>subjQtypes[s].late.has(qt.id)).length;\n    const progEvening = required.filter(qt=>subjQtypes[s].evening.has(qt.id)).length;\n    const progMorning = Math.max(progEarly, progLate);\n    const mornStarted = !sMorning && progMorning > 0;\n    const eveStarted  = !sEvening && progEvening > 0;\n    bySubject[s] = {\n      earlyDone:sEarly, lateDone:sLate, morningDone:sMorning, eveningDone:sEvening, bothDone:sMorning&&sEvening,\n      mornStarted, eveStarted,\n      required: required.length,\n      progMorning, progEvening,\n    };\n  });\n\n  // Morning streak: consecutive days where any subject had a complete morning session\n  const byDayMorning = {};\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT || !e.qtype) return;\n    const hour = new Date(e.ts).getHours();\n    if(hour!==6 && hour!==7) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const key = d.getTime();\n    if(!byDayMorning[key]) byDayMorning[key] = {};\n    const subj = e.subject||'';\n    if(!byDayMorning[key][subj]) byDayMorning[key][subj] = new Set();\n    byDayMorning[key][subj].add(e.qtype);\n  });\n  let morningStreak = 0;\n  let cursor = todayMs;\n  if(!morningDone) cursor -= 86400000;\n  function dayHadMorningSession(dayData){\n    if(!dayData) return false;\n    return subjectNames.some(s=>{\n      const required = getActiveQTypesForSubject(s);\n      return required.length && required.every(qt=>(dayData[s]||new Set()).has(qt.id));\n    });\n  }\n  while(dayHadMorningSession(byDayMorning[cursor])){\n    morningStreak++;\n    cursor -= 86400000;\n  }\n\n  return { morningDone, eveningDone, bothDone, morningStreak, bySubject };\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CUMULATIVE TOTALS \u2014 unlike \"today's\" goal status above, these never reset.\n//  Every day the daily goal or a session was completed adds permanently to the\n//  Growth Score, the same way Coverage/Mastery do. This is what makes the score\n//  genuinely cumulative: progress earned yesterday stays earned forever, it\n//  doesn't evaporate at midnight just because \"today\" started fresh.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nfunction calcCumulativeTotals(allScoredEntries){\n  const subjectNames = Object.keys(DATA);\n\n  // byDay[dayKey] = { qtypes:Set, tsByQtype:{qtype:ts} }  \u2014 for the global daily goal\n  // byDaySubjBucket[dayKey][subj][bucket] = Set of qtype ids, plus tsByBucket[bucket][qtype]=ts\n  const byDay = {};\n  const byDaySubjBucket = {};\n\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT || !e.qtype) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const dayKey = d.getTime();\n    const hour = new Date(e.ts).getHours();\n    // Same bug as the one fixed in calcSessionGoals \u2014 this used to say\n    // hour>=8, treating ALL of 8am-11pm as \"evening\" instead of the actual\n    // intended 5pm-9pm window. This copy feeds PERMANENT, never-reset\n    // cumulative totals (+50/+70 points per subject per qualifying day),\n    // so this specific copy of the bug was likely a meaningfully larger\n    // source of inflation than the display-only one \u2014 every midday study\n    // session was silently banking a permanent \"evening session complete\"\n    // bonus it was never supposed to earn.\n    const bucket = hour===6 ? 'early' : hour===7 ? 'late' : (hour>=17 && hour<=21) ? 'evening' : null;\n    if(!bucket) {\n      // Still counts for the global daily goal (answered anytime counts for goal)\n      if(!byDay[dayKey]) byDay[dayKey] = { qtypes:new Set(), tsByQtype:{} };\n      byDay[dayKey].qtypes.add(e.qtype);\n      if(byDay[dayKey].tsByQtype[e.qtype]===undefined || e.ts < byDay[dayKey].tsByQtype[e.qtype]) byDay[dayKey].tsByQtype[e.qtype] = e.ts;\n      return;\n    }\n\n    // Global daily goal tracking\n    if(!byDay[dayKey]) byDay[dayKey] = { qtypes:new Set(), tsByQtype:{} };\n    byDay[dayKey].qtypes.add(e.qtype);\n    if(byDay[dayKey].tsByQtype[e.qtype]===undefined || e.ts < byDay[dayKey].tsByQtype[e.qtype]) byDay[dayKey].tsByQtype[e.qtype] = e.ts;\n\n    // Per-subject per-bucket qtype tracking\n    const subj = e.subject || '';\n    if(subj){\n      if(!byDaySubjBucket[dayKey]) byDaySubjBucket[dayKey] = {};\n      if(!byDaySubjBucket[dayKey][subj]) byDaySubjBucket[dayKey][subj] = { early:new Set(), late:new Set(), evening:new Set(), tsByBucket:{ early:{}, late:{}, evening:{} } };\n      byDaySubjBucket[dayKey][subj][bucket].add(e.qtype);\n      const tsMap = byDaySubjBucket[dayKey][subj].tsByBucket[bucket];\n      if(tsMap[e.qtype]===undefined || e.ts < tsMap[e.qtype]) tsMap[e.qtype] = e.ts;\n    }\n  });\n\n  // Daily Practice Goal tracking \u2014 its own independent pass, gated by\n  // MIN_SCORE_FOR_GOAL_CREDIT (50%+) exactly like the loop above and\n  // calcPracticeGoal's live \"today\" computation. Used to require only a\n  // genuine ATTEMPT regardless of score \u2014 but that let skipping a question\n  // (even right after the mandatory spelling warm-up) count toward the\n  // goal, so it now needs the same real-engagement bar as everything else.\n  const practiceKeyFirstTsByDay = {}; // dayKey -> Map(uniqueQuestionKey -> first ts attempted that day)\n  allScoredEntries.forEach(e=>{\n    if(!e.qtype || !PRACTICE_GOAL_QTYPES.includes(e.qtype)) return;\n    if((e.pct||0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const dayKey = d.getTime();\n    if(!practiceKeyFirstTsByDay[dayKey]) practiceKeyFirstTsByDay[dayKey] = new Map();\n    const pKey = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n    const m = practiceKeyFirstTsByDay[dayKey];\n    if(!m.has(pKey) || e.ts < m.get(pKey)) m.set(pKey, e.ts);\n  });\n\n  let daysGoalCompleted = 0;\n  const subjectSessions = {};\n  subjectNames.forEach(s=>{ subjectSessions[s] = { earlyMorning:0, lateMorning:0, evening:0, both:0, mornStarted:0, eveStarted:0 }; });\n  const achievements = []; // {key, dayMs, earnedAt, qtype, subject, label, points} \u2014 one entry per day/subject/type actually earned, used to sync into real logged Points History events\n\n  // Global daily goal \u2014 earnedAt is the moment the LAST required type was\n  // first covered that day (whichever qtype completed the set).\n  Object.entries(byDay).forEach(([dayKey, day])=>{\n    const activeTypes = getActiveQTypes();\n    if(activeTypes.every(qt=>day.qtypes.has(qt.id))){\n      daysGoalCompleted++;\n      const earnedAt = Math.max(...activeTypes.map(qt=>day.tsByQtype[qt.id]));\n      achievements.push({ key:`dailygoal_${dayKey}`, dayMs:Number(dayKey), earnedAt, qtype:\"dailygoal\", subject:\"\", label:\"Daily Goal complete\", points:10 });\n    }\n  });\n\n  // Daily Practice Goal \u2014 each tier reached on a given day generates its\n  // own permanent achievement with its own points, stamped with the exact\n  // moment that Nth unique question was attempted (not the whole day).\n  let daysPracticeGoalCompleted = 0; // days the TOP tier was reached\n  let practiceGoalPointsTotal = 0;   // sum of every tier's points earned, every day \u2014 used directly since tiers carry different point values (a flat \"count * X\" formula no longer applies)\n  const topPracticeTier = DAILY_PRACTICE_TIERS[DAILY_PRACTICE_TIERS.length-1].count;\n  Object.entries(practiceKeyFirstTsByDay).forEach(([dayKey, tsMap])=>{\n    const sortedTs = Array.from(tsMap.values()).sort((a,b)=>a-b);\n    const count = sortedTs.length;\n    if(count >= topPracticeTier) daysPracticeGoalCompleted++;\n    DAILY_PRACTICE_TIERS.forEach(tier=>{\n      if(count >= tier.count){\n        const earnedAt = sortedTs[tier.count-1];\n        practiceGoalPointsTotal += tier.points;\n        achievements.push({ key:`practicetier_${tier.count}_${dayKey}`, dayMs:Number(dayKey), earnedAt, qtype:\"practicegoal\", subject:\"\", label:`\ud83c\udfaf Daily Practice \u2014 ${tier.count} unique questions`, points:tier.points });\n      }\n    });\n  });\n\n  // Per-subject session days: a session counts only when all of that\n  // subject's active types were covered in that bucket on that day.\n  // \"started\" = at least 1 type covered but not all. earnedAt for a\n  // completed session is when the last required type was covered; for a\n  // \"started\" one it's whenever that bucket's earliest activity happened.\n  Object.entries(byDaySubjBucket).forEach(([dayKey, subjMap])=>{\n    subjectNames.forEach(subj=>{\n      const buckets = subjMap[subj];\n      if(!buckets) return;\n      const required = getActiveQTypesForSubject(subj);\n      if(!required.length) return;\n      const early = required.every(qt=>buckets.early.has(qt.id));\n      const late  = required.every(qt=>buckets.late.has(qt.id));\n      const eve   = required.every(qt=>buckets.evening.has(qt.id));\n      const earlyStarted   = !early  && buckets.early.size   > 0;\n      const lateStarted    = !late   && buckets.late.size    > 0;\n      const eveStarted     = !eve    && buckets.evening.size > 0;\n      const dayMs = Number(dayKey);\n      const earliestTs = tsMap => Math.min(...Object.values(tsMap));\n      const morningEarnedAt = early ? Math.max(...required.map(qt=>buckets.tsByBucket.early[qt.id]))\n        : late ? Math.max(...required.map(qt=>buckets.tsByBucket.late[qt.id]))\n        : earlyStarted ? earliestTs(buckets.tsByBucket.early)\n        : lateStarted ? earliestTs(buckets.tsByBucket.late)\n        : null;\n      const eveEarnedAt = eve ? Math.max(...required.map(qt=>buckets.tsByBucket.evening[qt.id]))\n        : eveStarted ? earliestTs(buckets.tsByBucket.evening)\n        : null;\n      if(early){ subjectSessions[subj].earlyMorning++; achievements.push({ key:`session_early_${subj}_${dayKey}`, dayMs, earnedAt:morningEarnedAt, qtype:\"session_early\", subject:subj, label:`Early Morning session \u2014 ${subj}`, points:70 }); }\n      else if(late){ subjectSessions[subj].lateMorning++; achievements.push({ key:`session_late_${subj}_${dayKey}`, dayMs, earnedAt:morningEarnedAt, qtype:\"session_late\", subject:subj, label:`Morning session \u2014 ${subj}`, points:50 }); }\n      else if(earlyStarted || lateStarted){ subjectSessions[subj].mornStarted++; achievements.push({ key:`session_mornstart_${subj}_${dayKey}`, dayMs, earnedAt:morningEarnedAt, qtype:\"session_mornstart\", subject:subj, label:`Morning session started \u2014 ${subj}`, points:10 }); }\n      if(eve){ subjectSessions[subj].evening++; achievements.push({ key:`session_evening_${subj}_${dayKey}`, dayMs, earnedAt:eveEarnedAt, qtype:\"session_evening\", subject:subj, label:`Evening session \u2014 ${subj}`, points:50 }); }\n      else if(eveStarted){ subjectSessions[subj].eveStarted++; achievements.push({ key:`session_evestart_${subj}_${dayKey}`, dayMs, earnedAt:eveEarnedAt, qtype:\"session_evestart\", subject:subj, label:`Evening session started \u2014 ${subj}`, points:10 }); }\n      if((early||late) && eve){ subjectSessions[subj].both++; achievements.push({ key:`session_both_${subj}_${dayKey}`, dayMs, earnedAt:Math.max(morningEarnedAt, eveEarnedAt), qtype:\"session_both\", subject:subj, label:`Both sessions \u2014 ${subj}`, points:50 }); }\n    });\n  });\n\n  return { daysGoalCompleted, daysPracticeGoalCompleted, practiceGoalPointsTotal, subjectSessions, achievements };\n}\n\n\n// Fetches every Lesson Test attempt ever logged and sums the points earned \u2014\n// used to fold Test points into the main Growth Points total, since they're\n// stored in their own collection (tagged per-lesson) rather than alongside\n// regular question logs.\nlet _testPointsLocalCache = null; // { total, lastTs, seenIds:[] } \u2014 same incremental idea as getLogsBundle\n\nfunction testPointsLocalCacheKey(){\n  return \"sbTestPointsCache_v\" + LOGS_LOCAL_CACHE_VERSION + \"_\" + currentUserPhone;\n}\n\nasync function fetchTotalTestPoints(){\n  if(!window._fb || !currentUserPhone) return 0;\n  try{\n    if(!_testPointsLocalCache){\n      try{\n        const raw = localStorage.getItem(testPointsLocalCacheKey());\n        const parsed = raw ? JSON.parse(raw) : null;\n        // Older caches stored a running `total` accumulator instead of the\n        // actual entries -- that design meant any single historical bug in\n        // the accumulator (a missed doc, a double-count) would drift the\n        // total permanently, since there was nothing to recompute FROM.\n        // That's exactly the kind of drift that could make this number\n        // quietly disagree with Points History's own always-fresh full scan\n        // of the same collection. An old-shaped cache (no `entries` array)\n        // fails this check and falls through to a full resync below, which\n        // self-heals any accumulated drift by rebuilding from Firestore.\n        _testPointsLocalCache = (parsed && Array.isArray(parsed.entries)) ? parsed : { entries:[], lastTs:0 };\n      }catch(e){ _testPointsLocalCache = { entries:[], lastTs:0 }; }\n    }\n    const fresh = await fetchLogsSince(\"testPoints\", _testPointsLocalCache.lastTs);\n    if(fresh.length){\n      const { merged, newestTs } = mergeFreshIntoCache(_testPointsLocalCache.entries, fresh);\n      _testPointsLocalCache.entries = merged;\n      _testPointsLocalCache.lastTs = Math.max(_testPointsLocalCache.lastTs, newestTs);\n      try{ localStorage.setItem(testPointsLocalCacheKey(), JSON.stringify(_testPointsLocalCache)); }catch(e){}\n    }\n    // Always a fresh sum over the actual stored entries -- never a running\n    // total that could silently drift and then carry that error forward\n    // forever with no way to self-correct.\n    return _testPointsLocalCache.entries.reduce((sum,e)=>sum+(e.points||0), 0);\n  } catch(err){\n    return _testPointsLocalCache ? _testPointsLocalCache.entries.reduce((sum,e)=>sum+(e.points||0), 0) : 0;\n  }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  DAILY TIME BONUS \u2014 +100 points for each subject the student spends at\n//  least 30 minutes on today. Counts ALL time (any score), since this is\n//  about genuine time invested studying, not correctness \u2014 a separate signal\n//  from the type-coverage session bonus above.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst DAILY_TIME_BONUS_MS = 30 * 60 * 1000; // 30 minutes\nconst DAILY_TIME_BONUS_POINTS = 100;\n\nfunction calcDailyTimeBonus(allScoredEntries){\n  const startOfToday = new Date();\n  startOfToday.setHours(0,0,0,0);\n  const todayMs = startOfToday.getTime();\n\n  const subjectNames = Object.keys(DATA);\n\n  // Group every entry by day \u00d7 subject, keeping its own timestamp so we can\n  // walk them in chronological order and find the exact moment the running\n  // total first reaches 30 minutes (rather than stamping the whole day).\n  const entriesByDaySubject = {}; // \"dayMs:subject\" -> [{ts, timeMs}, ...]\n  allScoredEntries.forEach(e=>{\n    const subj = e.subject || '';\n    if(!subj) return;\n    const d = new Date(e.ts); d.setHours(0,0,0,0);\n    const key = d.getTime()+\":\"+subj;\n    if(!entriesByDaySubject[key]) entriesByDaySubject[key] = [];\n    entriesByDaySubject[key].push({ ts:e.ts, timeMs:e.timeMs||0 });\n  });\n\n  // For a day\u00d7subject's entries, find the timestamp of whichever entry\n  // first pushed the running total past the 30-minute threshold.\n  function findCrossingTs(list){\n    const sorted = [...list].sort((a,b)=>a.ts-b.ts);\n    let running = 0;\n    for(const item of sorted){\n      running += item.timeMs;\n      if(running >= DAILY_TIME_BONUS_MS) return item.ts;\n    }\n    return null;\n  }\n\n  // \u2500\u2500 ALL-TIME: count bonus points for every past day where 30+ min was spent \u2500\u2500\n  let totalHistoricalPoints = 0;\n  const achievements = []; // {key, dayMs, earnedAt, subject, points} \u2014 for syncing into real logged Points History events\n  Object.entries(entriesByDaySubject).forEach(function(pair){\n    const parts = pair[0].split(\":\");\n    const dayMs = parseInt(parts[0]);\n    const subj = parts[1];\n    if(dayMs >= todayMs) return; // today is handled live below\n    const crossedAt = findCrossingTs(pair[1]);\n    if(crossedAt!==null){\n      totalHistoricalPoints += DAILY_TIME_BONUS_POINTS;\n      achievements.push({ key:`dailytime_${subj}_${dayMs}`, dayMs, earnedAt:crossedAt, qtype:\"dailytime\", subject:subj, label:`30+ min studied \u2014 ${subj}`, points:DAILY_TIME_BONUS_POINTS });\n    }\n  });\n\n  // \u2500\u2500 TODAY: show live progress per subject \u2500\u2500\n  const timeToday = {};\n  subjectNames.forEach(s=>{ timeToday[s] = 0; });\n  allScoredEntries.forEach(e=>{\n    if(e.ts < todayMs) return;\n    const subj = e.subject || '';\n    if(timeToday[subj] !== undefined) timeToday[subj] += (e.timeMs || 0);\n  });\n\n  const bySubject = {};\n  let todayPoints = 0;\n  subjectNames.forEach(s=>{\n    const ms = timeToday[s];\n    const done = ms >= DAILY_TIME_BONUS_MS;\n    if(done){\n      todayPoints += DAILY_TIME_BONUS_POINTS;\n      const crossedAt = findCrossingTs(entriesByDaySubject[todayMs+\":\"+s] || []);\n      achievements.push({ key:`dailytime_${s}_${todayMs}`, dayMs:todayMs, earnedAt:crossedAt, qtype:\"dailytime\", subject:s, label:`30+ min studied \u2014 ${s}`, points:DAILY_TIME_BONUS_POINTS });\n    }\n    bySubject[s] = { ms, done, pct: Math.min(100, Math.round((ms/DAILY_TIME_BONUS_MS)*100)) };\n  });\n\n  return { bySubject, pointsEarned: totalHistoricalPoints + todayPoints, achievements };\n}\n\n\nfunction calcGrowthScore(allUnique, allScoredEntries, totalTestPoints){\n  const totalAvailable = countTotalAvailableQuestions();\n  const coverage = totalAvailable>0 ? Math.min(100, Math.round((allUnique.size/totalAvailable)*100)) : 0;\n\n  let mastery = 0;\n  if(allScoredEntries.length){\n    let earned=0, possible=0;\n    allScoredEntries.forEach(e=>{\n      if(e.qtype===\"goodwill\" || e.qtype===\"compensation\" || e.qtype===\"milestone\" || e.qtype===\"lessonmastery\") return; // bonuses aren't a measure of academic quality\n      const m = getMarks(e.qtype||\"mcq\");\n      possible += m;\n      earned += m*(e.pct/100);\n    });\n    mastery = possible>0 ? Math.round((earned/possible)*100) : 0;\n  }\n\n  let trend = 50; // neutral default until there's enough data to compare\n  if(allScoredEntries.length >= 6){\n    const mid = Math.floor(allScoredEntries.length/2);\n    const earlier = allScoredEntries.slice(0, mid);\n    const recent  = allScoredEntries.slice(mid);\n    const avg = arr => arr.reduce((a,e)=>a+e.pct,0)/arr.length;\n    const earlierAvg = avg(earlier), recentAvg = avg(recent);\n    // Map the improvement delta onto a 0-100 trend score: no change = 50,\n    // +20 points of improvement or more = 100, -20 or worse = 0.\n    const delta = recentAvg - earlierAvg;\n    trend = Math.max(0, Math.min(100, Math.round(50 + delta*2.5)));\n  }\n\n  // Mastery Score: a capped 0-100 quality measure \u2014 \"how good is he right now.\"\n  // A cap makes sense here since it's a percentage-style measure, the same way\n  // a test score caps at 100%.\n  const masteryScore = Math.round(coverage*0.4 + mastery*0.4 + trend*0.2);\n\n  // Growth Points: a completely different kind of number \u2014 it never caps and\n  // never goes down. Every genuine answer, every completed daily goal, every\n  // session, every lesson test adds points permanently. This is the number\n  // that should always visibly be climbing, the one that actually motivates\n  // showing up again tomorrow \u2014 unlike a 0-100 score that has nowhere left to\n  // go once it's near the ceiling, which is exactly what made finishing the\n  // evening goal feel like it \"did nothing\" once the old score was near 100.\n  const cumulative = calcCumulativeTotals(allScoredEntries);\n  const dailyGoal = calcDailyGoal(allScoredEntries);       // still used for \"today's\" checklist display\n  const practiceGoal = calcPracticeGoal(allScoredEntries); // today's Daily Practice Goal progress\n  const sessionGoals = calcSessionGoals(allScoredEntries); // still used for \"today's\" session card display\n\n  let growthPoints = 0;\n  // Tracks WHERE the total actually comes from, category by category \u2014 so a\n  // question like \"why is the score 9767\" can be answered directly, by\n  // looking at a real breakdown, instead of re-deriving the whole thing from\n  // scratch or just trusting the single final number.\n  const breakdown = {\n    practice: 0,       // regular question answers (base marks, first-attempt doubling, speed bonus baked into marks)\n    dailyGoal: 0,       // +10 per day every active question type was covered\n    sessionBonuses: 0,  // per-subject morning/evening session completions\n    speedBonusLegacy: 0,// speed bonus for older entries logged before it was baked into marks\n    testPoints: 0,      // Lesson Test / Practice Test scores\n    dailyTime: 0,       // +100 per subject with 30+ min studied today\n    dailyPracticeGoal: 0,// points from every Daily Practice Goal tier reached, any day\n    reciteStreak: 0,   // Read & Memorise streak bonus (80%+ match, N reads in a row)\n    goodwill: 0,\n    compensation: 0,\n    milestones: 0,\n    lessonMastery: 0,\n    newTry: 0,\n    reciteReadMemorise: 0,\n  };\n  // BUG FIX: this used to add getMarks(e.qtype) for every single qualifying\n  // attempt, first time or the 50th, with no distinction. That quietly broke\n  // two things: (1) the \"\ud83c\udd95 New question! 2\u00d7 points\" toast shown right after\n  // a first-ever correct answer promised double points that never actually\n  // landed in this total, and (2) because repeats were never discounted,\n  // simply re-answering an already-mastered question over and over kept\n  // adding full marks forever \u2014 an unintended way to inflate Growth Points\n  // that had nothing to do with the \"harder types are worth more\" protection\n  // the comment below describes. This now mirrors logQuestion's real\n  // behavior: first qualifying attempt at a given question = double marks,\n  // every attempt after that = base marks \u2014 so the number shown in the toast\n  // is always the same number that ends up permanently counted.\n  const _seenGrowthKeys = new Set();\n  allScoredEntries.forEach(e=>{\n    if((e.pct??0) < MIN_SCORE_FOR_GOAL_CREDIT) return;\n    // Admin-awarded goodwill/one-time compensation bonuses use whatever exact\n    // amount the admin chose at the time (stored directly on the entry as\n    // `marks`) \u2014 there's no static per-qtype value for these since the\n    // amount is deliberately chosen per-award, not looked up from a table.\n    if(e.qtype===\"goodwill\"){ growthPoints += (e.marks||0); breakdown.goodwill += (e.marks||0); return; }\n    if(e.qtype===\"compensation\"){ growthPoints += (e.marks||0); breakdown.compensation += (e.marks||0); return; }\n    if(e.qtype===\"milestone\"){ growthPoints += (e.marks||0); breakdown.milestones += (e.marks||0); return; }\n    if(e.qtype===\"lessonmastery\"){ growthPoints += (e.marks||0); breakdown.lessonMastery += (e.marks||0); return; }\n    if(e.qtype===\"newtry\"){ growthPoints += (e.marks||0); breakdown.newTry += (e.marks||0); return; }\n    if((e.qtype||\"\").startsWith(\"recite_\")){ const m=getMarks(e.qtype); growthPoints += m; breakdown.reciteReadMemorise += m; return; }\n    // Achievement records (Daily Goal, session bonuses, daily time bonus) \u2014\n    // these are backfilled purely so Points History has something to show.\n    // The actual points, AND their breakdown contribution, are already\n    // counted once via cumulative/dailyTimeBonus further down this\n    // function \u2014 adding to breakdown here too was double-counting these\n    // three categories specifically (confirmed: a 9,981 total with a\n    // breakdown that summed to 12,028 \u2014 the exact gap these three\n    // categories being counted twice would produce).\n    if(e.qtype===\"dailygoal\") return;\n    if((e.qtype||\"\").startsWith(\"session_\")) return;\n    if(e.qtype===\"dailytime\") return;\n    if(e.qtype===\"practicegoal\") return;\n    if(e.qtype===\"recitestreak\"){ growthPoints += (e.marks||0); breakdown.reciteStreak += (e.marks||0); return; }\n    const isRealQType = QTYPES.some(q=>q.id===e.qtype);\n    const key = (e.lessonId||\"\")+\"_\"+(e.qtype||\"\")+\"_\"+(e.qIndex||0);\n    // If this entry stored its own exact point value at the moment it was\n    // earned (base marks, already doubled if it was a first attempt, PLUS\n    // any Speed Bonus \u2014 see logQuestion), use that directly. This used to\n    // be recomputed from scratch here instead, which silently dropped the\n    // Speed Bonus every time \u2014 the toast said \"+5 Speed Bonus\" but this loop\n    // only ever added the base marks, never that +5, no matter what the\n    // stored entry actually said. Trusting the stored number is what makes\n    // the toast and the permanent total finally guaranteed to agree.\n    if(typeof e.marks === \"number\" && isRealQType){\n      growthPoints += e.marks;\n      breakdown.practice += e.marks;\n      _seenGrowthKeys.add(key);\n      return;\n    }\n    if(!isRealQType){ growthPoints += getMarks(e.qtype); breakdown.practice += getMarks(e.qtype); return; }\n    // Fallback ONLY for entries logged before the `marks` field existed \u2014\n    // recomputes the old way (no Speed Bonus available for these older rows).\n    const base = getMarks(e.qtype);\n    const isFirst = !_seenGrowthKeys.has(key);\n    _seenGrowthKeys.add(key);\n    const amt = isFirst ? base*2 : base;\n    growthPoints += amt;\n    breakdown.practice += amt;\n  });\n  growthPoints += cumulative.daysGoalCompleted * 10;   // full 8-type goal, any day \u2014 big, permanent\n  breakdown.dailyGoal += cumulative.daysGoalCompleted * 10;\n  growthPoints += cumulative.practiceGoalPointsTotal;\n  breakdown.dailyPracticeGoal += cumulative.practiceGoalPointsTotal;\n  // Per-subject morning/evening sessions \u2014 each subject earns its own bonus\n  Object.values(cumulative.subjectSessions||{}).forEach(ss=>{\n    const subtotal = ss.earlyMorning*70 + ss.lateMorning*50 + ss.evening*50 + ss.both*50 + ss.mornStarted*10 + ss.eveStarted*10;\n    growthPoints += subtotal;\n    breakdown.sessionBonuses += subtotal;\n  });\n  // Speed bonus: only recompute for OLDER entries that don't already have it\n  // baked into their stored `marks` value (see the marks-based branch above).\n  // This used to recompute and add speed bonus for EVERY entry regardless,\n  // which double-counted it for any entry that already had it included in\n  // `.marks` \u2014 quietly inflating the real total beyond what any single\n  // toast ever promised.\n  let speedBonusTotal = 0;\n  allScoredEntries.forEach(e=>{\n    if(typeof e.marks === \"number\") return; // already included, don't add it again\n    if((e.pct||0) >= MIN_SCORE_FOR_GOAL_CREDIT && e.timeMs){\n      const sb = getSpeedBonus(e.qtype, e.timeMs);\n      if(sb) speedBonusTotal += sb.points;\n    }\n  });\n  growthPoints += speedBonusTotal;\n  breakdown.speedBonusLegacy += speedBonusTotal;\n  growthPoints += totalTestPoints || 0;                // every Lesson Test ever taken \u2014 30/40/50/100 per test based on score tier\n  breakdown.testPoints += totalTestPoints || 0;\n\n  // Daily time bonus: +100 per subject with 30+ minutes spent today\n  const dailyTimeBonus = calcDailyTimeBonus(allScoredEntries);\n  growthPoints += dailyTimeBonus.pointsEarned;\n  breakdown.dailyTime += dailyTimeBonus.pointsEarned;\n\n  growthPoints = Math.round(growthPoints);\n\n  return { masteryScore, coverage, mastery, trend, totalAvailable, dailyGoal, sessionGoals, practiceGoal, cumulative, growthPoints, dailyTimeBonus, breakdown };\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  STUDY INSIGHTS \u2014 replaces the old Past Sessions / Practice Tests admin\n//  tabs (raw historical lists nobody found useful) with actual analysis:\n//  where he's weak, how consistently he's showing up, whether he's\n//  trending up or down, and how often he peeks at the answer before\n//  attempting. Computed once from the same allScoredEntries the Growth\n//  Score already uses, and rendered into both the student's own Scoreboard\n//  and the admin's mirrored Scoreboard tab \u2014 same function, same data,\n//  shown in both places.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nconst INSIGHTS_MIN_SAMPLE = 3;   // don't call something a \"weak spot\" off 1-2 lucky/unlucky attempts\nconst INSIGHTS_WEAK_THRESHOLD = 60; // avg % below this, with enough samples, counts as needing more practice\nconst INSIGHTS_PEEK_FLAG = 30;   // peek rate % above this is worth calling out per subject\n\nfunction computeStudyInsights(allScoredEntries, spellEntries){\n  const real = (allScoredEntries||[]).filter(e=>REAL_QTYPES.has(e.qtype));\n  if(!real.length) return null;\n\n  // Weak spots by subject\n  const bySubject = {};\n  real.forEach(e=>{\n    if(!e.subject) return;\n    if(!bySubject[e.subject]) bySubject[e.subject] = { sum:0, count:0 };\n    bySubject[e.subject].sum += e.pct; bySubject[e.subject].count++;\n  });\n  const subjectStats = Object.entries(bySubject)\n    .map(([subject,s])=>({ subject, avg: Math.round(s.sum/s.count), count: s.count }))\n    .sort((a,b)=>a.avg-b.avg);\n\n  // Weak spots by question type\n  const byQtype = {};\n  real.forEach(e=>{\n    if(!byQtype[e.qtype]) byQtype[e.qtype] = { sum:0, count:0 };\n    byQtype[e.qtype].sum += e.pct; byQtype[e.qtype].count++;\n  });\n  const qtypeStats = Object.entries(byQtype).map(([qtype,s])=>{\n    const def = QTYPES.find(q=>q.id===qtype);\n    return { qtype, label: def?def.label:qtype, icon: def?def.icon:\"\u2753\", avg: Math.round(s.sum/s.count), count: s.count };\n  }).sort((a,b)=>a.avg-b.avg);\n\n  const weakSubjects = subjectStats.filter(s=>s.count>=INSIGHTS_MIN_SAMPLE && s.avg<INSIGHTS_WEAK_THRESHOLD);\n  const weakQtypes = qtypeStats.filter(s=>s.count>=INSIGHTS_MIN_SAMPLE && s.avg<INSIGHTS_WEAK_THRESHOLD);\n\n  // Unique questions studied per heading (MCQ, Fill, Match, etc.) \u2014 distinct\n  // from qtypeStats above, which is about average SCORE per attempt. This is\n  // purely about coverage: out of every question that exists under each\n  // heading across the whole syllabus, how many different ones has he\n  // actually tried at least once \u2014 broken down by today / this week, on top\n  // of the all-time total, so day-to-day and week-to-week progress through\n  // each heading is visible, not just the cumulative number. Kept in\n  // QTYPES' own order (matches the order the headings appear as tabs in a\n  // lesson) rather than sorted, so it reads like a checklist.\n  const QC_DAY_MS = 86400000;\n  const qcNow = Date.now();\n  const qcDayKey = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };\n  const qcTodayKey = qcDayKey(qcNow);\n  const qtypeUniqueKeys = {}, qtypeUniqueKeysToday = {}, qtypeUniqueKeysWeek = {};\n  real.forEach(e=>{\n    // Same validity check as aggregateScoreboardData/calcSubjectBreakdown --\n    // a qIndex from before a content edit (or a later delete that shifted\n    // it) shouldn't still count toward coverage of a heading that may have\n    // fewer, or completely different, questions at that position now.\n    if(!isMasteryKeyStillValid(e.lessonId, e.qtype, e.qIndex, e.ts)) return;\n    const key = `${e.lessonId}|${e.qIndex}`;\n    if(!qtypeUniqueKeys[e.qtype]) qtypeUniqueKeys[e.qtype] = new Set();\n    qtypeUniqueKeys[e.qtype].add(key);\n    if(qcDayKey(e.ts) === qcTodayKey){\n      if(!qtypeUniqueKeysToday[e.qtype]) qtypeUniqueKeysToday[e.qtype] = new Set();\n      qtypeUniqueKeysToday[e.qtype].add(key);\n    }\n    if(e.ts >= qcNow - 7*QC_DAY_MS){\n      if(!qtypeUniqueKeysWeek[e.qtype]) qtypeUniqueKeysWeek[e.qtype] = new Set();\n      qtypeUniqueKeysWeek[e.qtype].add(key);\n    }\n  });\n  const qtypeAvailable = countAvailableQuestionsByQtype();\n  const qtypeCoverage = QTYPES.map(def=>{\n    const uniqueCount = qtypeUniqueKeys[def.id] ? qtypeUniqueKeys[def.id].size : 0;\n    const todayCount = qtypeUniqueKeysToday[def.id] ? qtypeUniqueKeysToday[def.id].size : 0;\n    const weekCount = qtypeUniqueKeysWeek[def.id] ? qtypeUniqueKeysWeek[def.id].size : 0;\n    const totalAvailable = qtypeAvailable[def.id] || 0;\n    const coverage = totalAvailable>0 ? Math.min(100, Math.round((uniqueCount/totalAvailable)*100)) : 0;\n    return { qtype: def.id, label: def.label, icon: def.icon, uniqueCount, todayCount, weekCount, totalAvailable, coverage };\n  }).filter(s=>s.totalAvailable>0); // skip headings that don't exist in the syllabus at all\n\n  // Consistency & streaks -- bucket by calendar day (local time)\n  const ONE_DAY = 86400000;\n  const dayKey = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };\n  const studiedDays = new Set(real.map(e=>dayKey(e.ts)));\n  const todayKey = dayKey(Date.now());\n  let streak = 0;\n  {\n    let d = studiedDays.has(todayKey) ? todayKey : todayKey - ONE_DAY; // don't break the streak just because today isn't over yet\n    while(studiedDays.has(d)){ streak++; d -= ONE_DAY; }\n  }\n  const daysInLast = n => [...studiedDays].filter(d => d >= todayKey - (n-1)*ONE_DAY && d <= todayKey).length;\n  const last7 = daysInLast(7);\n  const last30 = daysInLast(30);\n\n  // Progress trend -- this week's avg vs the week before\n  const now = Date.now();\n  const avgOf = arr => arr.length ? Math.round(arr.reduce((a,e)=>a+e.pct,0)/arr.length) : null;\n  const last7Avg  = avgOf(real.filter(e=>e.ts >= now - 7*ONE_DAY));\n  const prior7Avg = avgOf(real.filter(e=>e.ts >= now - 14*ONE_DAY && e.ts < now - 7*ONE_DAY));\n  const trend = (last7Avg!==null && prior7Avg!==null) ? { last7Avg, prior7Avg, delta: last7Avg-prior7Avg } : null;\n\n  // Honesty signal -- how often the model answer was peeked at before attempting\n  const peekedCount = real.filter(e=>e.peeked).length;\n  const peekRate = Math.round((peekedCount/real.length)*100);\n  const peekBySubject = subjectStats\n    .map(s=>{\n      const subjEntries = real.filter(e=>e.subject===s.subject);\n      const subjPeeked = subjEntries.filter(e=>e.peeked).length;\n      return { subject: s.subject, peekRate: subjEntries.length ? Math.round(subjPeeked/subjEntries.length*100) : 0, count: subjEntries.length };\n    })\n    .filter(s=>s.count>=INSIGHTS_MIN_SAMPLE && s.peekRate>=INSIGHTS_PEEK_FLAG)\n    .sort((a,b)=>b.peekRate-a.peekRate);\n\n  // Spelling mistakes -- per day and overall, so both the student and the\n  // parent can see whether spelling is actually improving or just piling up.\n  const ONE_DAY_MS = 86400000;\n  const spellDayKey = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };\n  const spell = spellEntries || [];\n  const spellToday = spell.filter(e=>spellDayKey(e.ts)===todayKey).length;\n  const spellLast7 = spell.filter(e=>e.ts >= now - 7*ONE_DAY_MS).length;\n  const spellTotal = spell.length;\n  const spellByWord = {};\n  spell.forEach(e=>{\n    const key = (e.correct||e.wrong||\"\").toLowerCase().trim();\n    if(!key) return;\n    if(!spellByWord[key]) spellByWord[key] = { word: e.correct||e.wrong, count: 0 };\n    spellByWord[key].count++;\n  });\n  const spellTopWords = Object.values(spellByWord).filter(w=>w.count>=2).sort((a,b)=>b.count-a.count).slice(0,5);\n  const spellStats = { today: spellToday, last7: spellLast7, total: spellTotal, topWords: spellTopWords };\n\n  return { subjectStats, qtypeStats, weakSubjects, weakQtypes, qtypeCoverage, streak, last7, last30, trend, peekRate, peekBySubject, totalReal: real.length, spellStats };\n}\n\nfunction renderStudyInsightsHTML(allScoredEntries, theme, spellEntries){\n  const ins = computeStudyInsights(allScoredEntries, spellEntries);\n  // \"dark\" = white-on-navy (Scoreboard panel). \"light\" = navy-on-white\n  // (the Progress/session-report panel, which has a white .report-sheet\n  // background \u2014 reusing the dark palette there made the text nearly\n  // invisible, white-on-white).\n  const isDark = theme !== \"light\";\n  const c = isDark\n    ? { dim:\"rgba(255,255,255,.55)\", faint:\"rgba(255,255,255,.45)\", text:\"rgba(255,255,255,.85)\",\n        boxBg:\"rgba(255,255,255,.08)\", divider:\"rgba(255,255,255,.08)\", up:\"#7ee787\", down:\"#ffa07a\", flat:\"rgba(255,255,255,.7)\" }\n    : { dim:\"var(--muted)\", faint:\"var(--muted)\", text:\"var(--text)\",\n        boxBg:\"var(--parchment,#faf6ee)\", divider:\"var(--border)\", up:\"var(--green)\", down:\"#c0392b\", flat:\"var(--muted)\" };\n\n  if(!ins){\n    return `<div style=\"margin-top:18px;padding:14px;text-align:center;color:${c.dim};font-size:12.5px;background:${c.boxBg};border-radius:10px\">Not enough activity yet to show insights.<\u002Fdiv>`;\n  }\n\n  let html = `<div style=\"margin-top:20px;color:${c.text}\">`;\n  html += `<div style=\"font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:${c.dim};margin-bottom:10px\">\ud83d\udcc8 Study Insights<\u002Fdiv>`;\n\n  html += `
