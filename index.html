as Simon Commission boycotted?\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"What is Poorna Swaraj?\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"Write a note on Bhagat Singh\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"What are the terms of the Poona Pact?\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"}],\"fill\":[{\"sentence\":\"Gandhi regarded as his political guru ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"}],\"paragraph\":[{\"q\":\"Examine the factors that led to the transformation of Gandhi into a mass leader\",\"answer\":\"\",\"_src\":\"Answer in detail\"},{\"q\":\"Critically examine the Civil Disobedience Movement as the typical example of Gandhian movement\",\"answer\":\"\",\"_src\":\"Answer in detail\"},{\"q\":\"Discuss the reasons behind the partition of India\",\"answer\":\"\",\"_src\":\"Answer in detail\"}]}},\"c10_his_9\":{\"p\":{\"brief\":[{\"q\":\"Who among the following were Swarajists?\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"Who set up the satyagraha camp in Udyavanam near Madras?\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"Who was the first President of the Madras Mahajana Sabha?\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"Where was the third session of the Indian National Congress held?\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"Who said \\\"Better bullock carts and freedom than a train de luxe with subjection\\\"?\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"(i) Madras Native Association was founded in 1852. (ii) Tamil nationalist periodical Swadesamitran was started in 1891. (iii) The Madras Mahajana Sabha demanded conduct of civil services examinations only in India (iv) V.S. Srinivasanar was an extremist\",\"answer\":\"\",\"_src\":\"Choose the correct statement / Assertion-Reason\"},{\"q\":\"(i) E.V.R. did not participate in the Non-Cooperation Movement. (ii) Rajaji worked closely with Yakub Hasan of the Muslim League. (iii) Workers did not participate in the Non-Cooperation Movement. (iv) Toddy shops were not picketed in Tamil Nadu\",\"answer\":\"\",\"_src\":\"Choose the correct statement / Assertion-Reason\"},{\"q\":\"List out the contribution of the moderates\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"Write a note on the Tirunelveli Uprising\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"What is the contribution of Annie Besant to India's freedom struggle?\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"}],\"fill\":[{\"sentence\":\"was appointed the first Indian Judge of the Madras High Court ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"Nilakanta Brahmachari started the secret society named ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"formed the first Congress Ministry in Madras ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"was the founder of the Madras branch of the Muslim League ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"hoisted the national flag atop Fort St. George on 26 January 1932 ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"}],\"paragraph\":[{\"q\":\"Discuss the response to Swadeshi Movement in Tamil Nadu\",\"answer\":\"\",\"_src\":\"Answer in detail\"},{\"q\":\"Examine the origin and growth of non- Brahmin Movement in Tamil Nadu\",\"answer\":\"\",\"_src\":\"Answer in detail\"},{\"q\":\"Describe the role of Tamil Nadu in the Civil Disobedience Movement\",\"answer\":\"\",\"_src\":\"Answer in detail\"}]}},\"c10_his_10\":{\"p\":{\"brief\":[{\"q\":\"established a full-fledged printing press in 1709, at Tranquebar\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"founded Adi Dravida Mahajana Sabha in 1893\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"India's first organised trade union, the Madras Labour Union was formed in\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"was established by the Justice Party Government for the selection of Government officials\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"was the first elected Legislative Council Member from the depressed class in Madras Province\",\"answer\":\"\",\"_src\":\"Choose the correct answer (MCQ)\"},{\"q\":\"(i) Thirukkural was one of the earliest Tamil literary texts to be published in 1812. (ii) Maraimalai Adigal collected and edited different palm leaf manuscripts of the Tamil grammars and literature. (iii) Robert Caldwell established the close affinity between the Dravidian\",\"answer\":\"\",\"_src\":\"Choose the correct statement / Assertion-Reason\"},{\"q\":\"Assertion (A): The Justice Party continued to remain in government from 1920-1937 in Madras Presidency. Reason (R): The Congress Party boycotted the Madras Legislature during this period of Dyarchy. explanation to A\",\"answer\":\"\",\"_src\":\"Choose the correct statement / Assertion-Reason\"},{\"q\":\"Write a note on Tamil Renaissance\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"Highlight the contribution of Caldwell for the cause of South Indian languages\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"List out the personalities who contributed to the revival of Tamil literature through their writings\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"Discuss the importance of Hindu Religious Endowment Act passed by the Justice Party?\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"Name the newspapers published by the South Indian Liberal Foundation\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"},{\"q\":\"Estimate Periyar as a feminist\",\"answer\":\"\",\"_src\":\"Answer briefly (short answer)\"}],\"fill\":[{\"sentence\":\"was the first non- European language that went into print ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"The College of Fort St. George was founded by ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"is considered the father of Tamil linguistic purism ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"was the first to approve participation of women in the electoral politics ___\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"The name Suriyanarayana Sastri changed in Tamil as __________\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"__________ gave prominence to Tamil music\",\"answers\":[],\"_src\":\"Fill in the blanks\"},{\"sentence\":\"The first Woman Legislator in India was __________\",\"answers\":[],\"_src\":\"Fill in the blanks\"}],\"paragraph\":[{\"q\":\"Attempt an essay on the foundation and development of Tamil Renaissance in the 19th Century\",\"answer\":\"\",\"_src\":\"Answer in detail\"},{\"q\":\"Describe the background for the formation of the Justice Party and point out its contribution to the cause of social justice\",\"answer\":\"\",\"_src\":\"Answer in detail\"},{\"q\":\"Estimate Periyar E.V.R's decisive contribution to the social transformation of Tamil Nadu\",\"answer\":\"\",\"_src\":\"Answer in detail\"}]}}};\n\nfunction questionDedupeKey(q){\n  return String(q.q || q.sentence || \"\").toLowerCase().replace(/\\s+/g,\" \").trim();\n}\n\n// Merges the bank into the lesson docs. Never overwrites or removes anything:\n// a question already present (matched on its text) is skipped, so this is safe\n// to re-run after the bank grows or after answers have been filled in by hand.\nasync function importClass10QuestionBank(){\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return; }\n  const entries = Object.entries(CLASS10_QUESTION_BANK);\n  if(!confirm(\"Import the Class 10 Social Science question bank into \" + entries.length + \" chapters?\\n\\nExisting questions are left untouched. Questions without a verified answer are stored separately and stay hidden from \" + STUDENT_NAME + \" until you add one.\")) return;\n  const btn = document.getElementById(\"importC10Btn\");\n  if(btn){ btn.disabled = true; btn.textContent = \"Importing\u2026\"; }\n  const { db, doc, getDoc } = window._fb;\n  let live = 0, held = 0, failed = 0; const missing = [];\n  // Resolve each bank chapter to a real lesson by TITLE within Class 10 first,\n  // falling back to the seeded id. Chapters that already existed before the\n  // seeder ran are the ones the questions actually belong in \u2014 matching on id\n  // alone would fill a duplicate empty chapter and leave the real one bare.\n  const byTitle = {};\n  lessonsInClass(\"10\").forEach(d=>{\n    const k = normaliseTitleKey(d.data().title);\n    if(k && !(k in byTitle)) byTitle[k] = d.id;\n  });\n  const titleOf = {};\n  CLASS10_SYLLABUS.forEach(r=>{ titleOf[class10LessonId(r[2], r[3])] = r[4]; });\n  for(const [bankId, rec] of entries){\n    const lessonId = byTitle[normaliseTitleKey(titleOf[bankId])] || bankId;\n    let snap;\n    try{ snap = await getDoc(doc(db,\"lessons\",lessonId)); }\n    catch(e){ failed++; continue; }\n    if(!snap.exists()){ missing.push(lessonId); continue; }\n    const data = snap.data();\n    const questions = { ...(data.questions||{}) };\n    const pending   = { ...(data.pendingQuestions||{}) };\n    let changed = false;\n    Object.entries(rec.q||{}).forEach(([qt,arr])=>{\n      const cur = (questions[qt]||[]).slice();\n      const seen = new Set(cur.map(questionDedupeKey));\n      arr.forEach(q=>{ const k=questionDedupeKey(q); if(k && !seen.has(k)){ cur.push(q); seen.add(k); live++; changed=true; } });\n      questions[qt] = cur;\n    });\n    Object.entries(rec.p||{}).forEach(([qt,arr])=>{\n      const cur = (pending[qt]||[]).slice();\n      const seen = new Set(cur.map(questionDedupeKey));\n      const alreadyLive = new Set((questions[qt]||[]).map(questionDedupeKey));\n      arr.forEach(q=>{ const k=questionDedupeKey(q); if(k && !seen.has(k) && !alreadyLive.has(k)){ cur.push(q); seen.add(k); held++; changed=true; } });\n      pending[qt] = cur;\n    });\n    if(!changed) continue;\n    const ok = await saveLessonDoc(lessonId, { ...data, questions, pendingQuestions: pending });\n    if(!ok) failed++;\n  }\n  await loadLessonsFromFirestore();\n  rebuildDataForClass();\n  try{ renderAdminLessons(); }catch(e){}\n  try{ renderManageContent(); }catch(e){}\n  try{ renderLessons(); }catch(e){}\n  if(btn){ btn.disabled = false; btn.textContent = \"Import question bank\"; }\n  alert(\"Imported \" + live + \" ready-to-study question\" + (live===1?\"\":\"s\") + \".\\n\"\n    + held + \" more are waiting on answers and stay hidden from \" + STUDENT_NAME + \" until you add them.\\n\"\n    + (missing.length ? \"\\n\" + missing.length + \" chapter(s) not found \u2014 run 'Set up Class 10 syllabus' first.\" : \"\")\n    + (failed ? \"\\n\" + failed + \" chapter(s) failed to save.\" : \"\"));\n}\n\nfunction buildClass10ImportBanner(){\n  if(currentClass !== \"10\") return \"\";\n  const totalLive = Object.values(CLASS10_QUESTION_BANK).reduce((a,r)=>a+Object.values(r.q||{}).reduce((x,y)=>x+y.length,0),0);\n  const totalHeld = Object.values(CLASS10_QUESTION_BANK).reduce((a,r)=>a+Object.values(r.p||{}).reduce((x,y)=>x+y.length,0),0);\n  return '<div style=\"padding:14px;margin-bottom:16px;background:#fff;border:1.5px solid var(--border,#e8e0d0);border-radius:12px\">'\n    + '<div style=\"font-size:13px;font-weight:800;color:var(--navy);margin-bottom:4px\">\ud83d\udce5 Social Science question bank<\u002Fdiv>'\n    + '<div style=\"font-size:12px;color:var(--muted);margin-bottom:10px\">' + totalLive + ' questions with verified answers go straight in. '\n    + totalHeld + ' more import without answers and stay hidden from ' + STUDENT_NAME + ' until you fill them in \u2014 they cannot be studied or scored while they are waiting. Safe to run more than once.<\u002Fdiv>'\n    + '<button id=\"importC10Btn\" onclick=\"importClass10QuestionBank()\" style=\"padding:9px 16px;background:var(--navy);color:#fff;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer\">Import question bank<\u002Fbutton>'\n    + '<\u002Fdiv>';\n}\n\n// Opens the normal question form pre-filled with a pending question, and on\n// save moves it out of pendingQuestions into the live questions array.\nfunction openPendingAnswerEditor(lessonId, qtype, pIndex){\n  const loc = findLessonLocation(lessonId);\n  const existing = loc && ((loc.lesson.pendingQuestions||{})[qtype]||[])[pIndex];\n  if(!existing){ alert(\"That question is no longer pending \u2014 reload and try again.\"); return; }\n  const qtDef = QTYPES.find(q=>q.id===qtype);\n  let overlay = document.getElementById(\"questionEditorOverlay\");\n  if(overlay) overlay.remove();\n  overlay = document.createElement(\"div\");\n  overlay.id = \"questionEditorOverlay\";\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto\";\n  overlay.innerHTML = `<div style=\"background:#fff;border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto\">\n    <div style=\"font-weight:800;font-size:15px;margin-bottom:4px;color:var(--navy)\">Add answer \u2014 ${qtDef?qtDef.icon+\" \"+qtDef.label:qtype}<\u002Fdiv>\n    <div style=\"font-size:11.5px;color:var(--muted);margin-bottom:12px\">Once saved this becomes a real question and ${STUDENT_NAME} can study it.<\u002Fdiv>\n    <div id=\"qEditorFields\">${renderQuestionFormFields(qtype, existing)}<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:16px\">\n      <button onclick=\"document.getElementById('questionEditorOverlay').remove()\" style=\"flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer\">Cancel<\u002Fbutton>\n      <button onclick=\"submitPendingAnswer('${lessonId}','${qtype}',${pIndex})\" style=\"flex:1;padding:12px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-weight:700;cursor:pointer\">Save &amp; publish<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n}\n\nasync function submitPendingAnswer(lessonId, qtype, pIndex){\n  const result = buildQuestionObject(qtype, readQuestionFormRaw(qtype));\n  if(!result.ok){ alert(result.error); return; }\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return; }\n  const { db, doc, getDoc } = window._fb;\n  let data;\n  try{\n    const snap = await getDoc(doc(db,\"lessons\",lessonId));\n    if(!snap.exists()){ alert(\"This lesson no longer exists in the database \u2014 reload and try again.\"); return; }\n    data = snap.data();\n  }catch(err){ alert(\"Couldn't load the lesson: \" + err.message); return; }\n  const questions = { ...(data.questions||{}) };\n  questions[qtype] = (questions[qtype]||[]).concat([result.question]);\n  const pending = { ...(data.pendingQuestions||{}) };\n  // Remove by position from the freshly-read doc, not from the in-memory copy\n  const arr = (pending[qtype]||[]).slice();\n  if(pIndex>=0 && pIndex<arr.length) arr.splice(pIndex,1);\n  pending[qtype] = arr;\n  const ok = await saveLessonDoc(lessonId, { ...data, questions, pendingQuestions: pending });\n  if(!ok) return;\n  document.getElementById(\"questionEditorOverlay\")?.remove();\n  await refreshContentFromDB();\n}\n\nasync function discardPendingQuestion(lessonId, qtype, pIndex){\n  if(!confirm(\"Remove this question from the waiting list? It won't be added for \" + STUDENT_NAME + \".\")) return;\n  if(!window._fb) return;\n  const { db, doc, getDoc } = window._fb;\n  let data;\n  try{ const snap = await getDoc(doc(db,\"lessons\",lessonId)); if(!snap.exists()) return; data = snap.data(); }\n  catch(err){ return; }\n  const pending = { ...(data.pendingQuestions||{}) };\n  const arr = (pending[qtype]||[]).slice();\n  if(pIndex>=0 && pIndex<arr.length) arr.splice(pIndex,1);\n  pending[qtype] = arr;\n  if(!await saveLessonDoc(lessonId, { ...data, pendingQuestions: pending })) return;\n  await refreshContentFromDB();\n}\n\nfunction class10LessonId(code, chapter){ return \"c10_\" + code + \"_\" + chapter; }\n\nfunction class10MissingChapters(){\n  const existing = new Set((_allLessonDocs||[]).map(d=>d.id));\n  return CLASS10_SYLLABUS.filter(row => !existing.has(class10LessonId(row[2], row[3])));\n}\n\n// Creates one lesson doc per missing chapter, with no questions in it. Never\n// touches a chapter that already exists, so it is safe to re-run after the\n// syllabus list is extended or a chapter is deleted by hand.\nasync function seedClass10Syllabus(){\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return; }\n  const missing = class10MissingChapters();\n  if(!missing.length){ alert(\"Class 10 syllabus is already set up \u2014 nothing to create.\"); return; }\n  if(!confirm(\"Create \" + missing.length + \" empty Class 10 chapters?\\n\\nExisting chapters are left untouched.\")) return;\n  const btn = document.getElementById(\"seedClass10Btn\");\n  if(btn){ btn.disabled = true; btn.textContent = \"Creating\u2026\"; }\n  let created = 0, failed = 0;\n  for(const [subject, part, code, chapter, title] of missing){\n    const ok = await saveLessonDoc(class10LessonId(code, chapter), {\n      subject, part, title,\n      unit: \"Chapter \" + chapter,\n      month: \"\",\n      order: chapter,\n      questions: {},\n      class: \"10\"\n    });\n    ok ? created++ : failed++;\n  }\n  await loadLessonsFromFirestore();\n  rebuildDataForClass();\n  try{ renderSidebar(); }catch(e){}\n  try{ renderSubjectTabs(); }catch(e){}\n  try{ renderPartTabs(); }catch(e){}\n  try{ renderLessons(); }catch(e){}\n  try{ renderAdminLessons(); }catch(e){}\n  if(btn){ btn.disabled = false; btn.textContent = \"Set up Class 10 syllabus\"; }\n  alert(\"Created \" + created + \" chapter\" + (created===1?\"\":\"s\") + (failed ? \", \" + failed + \" failed.\" : \".\") + \"\\n\\nAdd questions to each from this same list.\");\n}\n\n// Shown at the top of the admin lesson list whenever the selected class has\n// chapters in its syllabus that don't exist in the database yet.\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CLASS REASSIGNMENT TOOLS\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Lessons written before classes existed carry no `class` field and are read\n// as Class 9. If that content was actually Class 10, it needs relabelling \u2014\n// which is purely a change of which tab it appears under. Lesson ids are NOT\n// touched, and every piece of progress (mastery keys, complete flags, mastery\n// and test-point awards) keys off the lesson id, so his record follows the\n// lesson across without migration.\n\nfunction normaliseTitleKey(t){\n  return String(t||\"\").toLowerCase().replace(/[^a-z0-9]+/g,\" \").trim();\n}\n\nfunction lessonsInClass(cls){\n  return (_allLessonDocs||[]).filter(d=>((d.data().class)||\"9\")===cls);\n}\n\nasync function setLessonClass(lessonId, cls){\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return false; }\n  const { db, doc, getDoc } = window._fb;\n  try{\n    const snap = await getDoc(doc(db,\"lessons\",lessonId));\n    if(!snap.exists()) return false;\n    return await saveLessonDoc(lessonId, { ...snap.data(), class: cls });\n  }catch(e){ return false; }\n}\n\nasync function bulkMoveClass(fromCls, toCls){\n  const docs = lessonsInClass(fromCls);\n  if(!docs.length){ alert(\"No lessons are in Class \" + fromCls + \".\"); return; }\n  if(!confirm(\"Move all \" + docs.length + \" Class \" + fromCls + \" lesson\" + (docs.length===1?\"\":\"s\") + \" to Class \" + toCls + \"?\\n\\n\"\n    + \"Questions, mastery, complete marks and points are all keyed to the lesson itself and come with it \u2014 this only changes which class tab they appear under. It can be moved back the same way.\")) return;\n  const btn = document.getElementById(\"bulkMoveBtn\");\n  if(btn){ btn.disabled = true; btn.textContent = \"Moving\u2026\"; }\n  let moved = 0, failed = 0;\n  for(const d of docs){\n    (await setLessonClass(d.id, toCls)) ? moved++ : failed++;\n  }\n  await loadLessonsFromFirestore();\n  rebuildDataForClass();\n  try{ renderAdminLessons(); }catch(e){}\n  try{ renderManageContent(); }catch(e){}\n  try{ renderSubjectTabs(); renderPartTabs(); renderLessons(); renderSidebar(); }catch(e){}\n  if(btn){ btn.disabled = false; }\n  alert(\"Moved \" + moved + \" lesson\" + (moved===1?\"\":\"s\") + \" to Class \" + toCls + (failed?\", \" + failed + \" failed.\":\".\"));\n}\n\n// Removes chapters the seeder created that were never used. Deliberately\n// refuses to touch anything holding questions \u2014 including ones only waiting on\n// answers \u2014 so this can never delete work, only empty scaffolding.\nasync function deleteEmptySeededChapters(){\n  const seededIds = new Set(CLASS10_SYLLABUS.map(r=>class10LessonId(r[2], r[3])));\n  const empties = (_allLessonDocs||[]).filter(d=>{\n    if(!seededIds.has(d.id)) return false;\n    const x = d.data();\n    const q = Object.values(x.questions||{}).reduce((a,arr)=>a+arr.length,0);\n    const pq = Object.values(x.pendingQuestions||{}).reduce((a,arr)=>a+arr.length,0);\n    return q===0 && pq===0;\n  });\n  if(!empties.length){ alert(\"Nothing to remove \u2014 every seeded chapter either holds questions or doesn't exist.\"); return; }\n  if(!confirm(\"Delete \" + empties.length + \" empty seeded chapter\" + (empties.length===1?\"\":\"s\") + \"?\\n\\nOnly chapters with no questions at all are removed. Anything holding questions, including ones waiting on answers, is left alone.\")) return;\n  let removed = 0, failed = 0;\n  for(const d of empties){\n    (await deleteLessonDoc(d.id)) ? removed++ : failed++;\n  }\n  await loadLessonsFromFirestore();\n  rebuildDataForClass();\n  try{ renderAdminLessons(); }catch(e){}\n  try{ renderManageContent(); }catch(e){}\n  alert(\"Removed \" + removed + \" empty chapter\" + (removed===1?\"\":\"s\") + (failed?\", \" + failed + \" failed.\":\".\"));\n}\n\nfunction buildClassToolsPanel(){\n  const c9 = lessonsInClass(\"9\").length, c10 = lessonsInClass(\"10\").length;\n  const other = currentClass === \"9\" ? \"10\" : \"9\";\n  const seededIds = new Set(CLASS10_SYLLABUS.map(r=>class10LessonId(r[2], r[3])));\n  const emptySeeded = (_allLessonDocs||[]).filter(d=>{\n    if(!seededIds.has(d.id)) return false;\n    const x = d.data();\n    return Object.values(x.questions||{}).reduce((a,arr)=>a+arr.length,0)===0\n        && Object.values(x.pendingQuestions||{}).reduce((a,arr)=>a+arr.length,0)===0;\n  }).length;\n  return '<details style=\"margin-bottom:16px;background:#fff;border:1.5px solid var(--border,#e8e0d0);border-radius:12px;padding:12px 14px\">'\n    + '<summary style=\"cursor:pointer;font-size:13px;font-weight:800;color:var(--navy)\">\ud83d\udd00 Class tools<\u002Fsummary>'\n    + '<div style=\"font-size:12px;color:var(--muted);margin:8px 0 10px\">Class 9 holds <b>' + c9 + '<\u002Fb> lesson' + (c9===1?'':'s') + ', Class 10 holds <b>' + c10 + '<\u002Fb>. '\n    + 'Lessons created before classes existed are read as Class 9. Moving a lesson changes only which tab it sits under \u2014 its questions, mastery, complete mark and points all travel with it.<\u002Fdiv>'\n    + '<div style=\"display:flex;gap:8px;flex-wrap:wrap\">'\n    + '<button id=\"bulkMoveBtn\" onclick=\"bulkMoveClass(\\'' + currentClass + '\\',\\'' + other + '\\')\" style=\"padding:9px 14px;border-radius:9px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:12.5px;cursor:pointer\">Move all Class ' + currentClass + ' lessons \u2192 Class ' + other + '<\u002Fbutton>'\n    + (emptySeeded ? '<button onclick=\"deleteEmptySeededChapters()\" style=\"padding:9px 14px;border-radius:9px;border:1.5px solid #d15f5a;background:#fff;color:#d15f5a;font-weight:700;font-size:12.5px;cursor:pointer\">Delete ' + emptySeeded + ' empty seeded chapter' + (emptySeeded===1?'':'s') + '<\u002Fbutton>' : \"\")\n    + '<\u002Fdiv><\u002Fdetails>';\n}\n\nfunction buildClassSeedBanner(){\n  if(currentClass !== \"10\") return \"\";\n  const missing = class10MissingChapters();\n  if(!missing.length) return \"\";\n  return '<div style=\"padding:14px;margin-bottom:16px;background:var(--parchment,#f3ece1);border:1.5px dashed var(--gold,#d1983f);border-radius:12px\">'\n    + '<div style=\"font-size:13px;font-weight:800;color:var(--navy);margin-bottom:4px\">\ud83d\udcd8 Class 10 syllabus not set up yet<\u002Fdiv>'\n    + '<div style=\"font-size:12px;color:var(--muted);margin-bottom:10px\">' + missing.length + ' chapter' + (missing.length===1?'':'s') + ' from the Tamil Nadu State Board syllabus '\n    + (missing.length===1?'is':'are') + ' missing. This creates them empty \u2014 you then add questions to each one as normal.<\u002Fdiv>'\n    + '<button id=\"seedClass10Btn\" onclick=\"seedClass10Syllabus()\" style=\"padding:9px 16px;background:var(--navy);color:#fff;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer\">Set up Class 10 syllabus<\u002Fbutton>'\n    + '<\u002Fdiv>';\n}\n\nfunction renderAdminLessons(){\n  renderAdminClassBars();\n  var box = document.getElementById(\"adminLessonsList\");\n  if(!box) return;\n  var html = buildClassToolsPanel() + buildClassSeedBanner() + buildClass10ImportBanner();\n  Object.entries(DATA).forEach(function(subjEntry){\n    var subjName = subjEntry[0], subjData = subjEntry[1];\n    var icon = subjData.icon || \"\ud83d\udcda\";\n    html += '<div style=\"margin-bottom:20px\">';\n    html += '<div style=\"font-size:14px;font-weight:700;color:var(--navy);margin-bottom:8px\">'+icon+' '+subjName+'<\u002Fdiv>';\n    Object.entries(subjData.parts).forEach(function(partEntry){\n      var partName = partEntry[0], partData = partEntry[1];\n      partData.lessons.forEach(function(lesson){\n        var totalQ = Object.values(lesson.questions).reduce(function(a,arr){return a+arr.length;},0);\n        // Count mastered + tried by student\n        var masteredQ = 0, triedQ = 0;\n        Object.entries(lesson.questions).forEach(function(pair){\n          var qt = pair[0], arr = pair[1];\n          for(var k=0;k<arr.length;k++){\n            var key = lesson.id+\"_\"+qt+\"_\"+k;\n            if(_masteredQuestionKeys.has(key)) masteredQ++;\n            if(_answeredQuestionKeys.has(key)) triedQ++;\n          }\n        });\n        var isComplete = !!_completeLessons[lesson.id];\n        var allMastered = isComplete && totalQ>0 && masteredQ>=totalQ;\n        var bgColor = allMastered ? \"rgba(74,152,115,.2)\" : isComplete ? \"rgba(74,152,115,.1)\" : \"#fff\";\n        var borderColor = allMastered ? \"var(--green)\" : isComplete ? \"var(--green)\" : \"var(--border)\";\n        var masteryPct = totalQ>0 ? Math.round(masteredQ/totalQ*100) : 0;\n        var barColor = masteryPct>=100 ? \"var(--green)\" : masteryPct>0 ? \"var(--gold)\" : \"var(--border)\";\n        html += '<div style=\"padding:12px;margin-bottom:6px;background:'+bgColor+';border:1.5px solid '+borderColor+';border-radius:10px\">';\n        html += '<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">';\n        html += '<div>';\n        html += '<div style=\"font-size:13px;font-weight:700;color:var(--navy)\">'+lesson.title+(allMastered?' \ud83c\udfc6':'')+'<\u002Fdiv>';\n        html += '<div style=\"font-size:11px;color:var(--muted)\">'+lesson.unit+' \u00b7 '+totalQ+' questions \u00b7 '+partName+'<\u002Fdiv>';\n        html += '<\u002Fdiv>';\n        html += '<button onclick=\"toggleLessonComplete(&quot;'+lesson.id+'&quot;)\" style=\"padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;border:1.5px solid '+(isComplete?'var(--green)':'var(--border)')+';background:'+(isComplete?'var(--green)':'#fff')+';color:'+(isComplete?'#fff':'var(--navy)')+'\">'+(isComplete?'\u2705 Complete':'Mark Complete')+'<\u002Fbutton>';\n        html += '<\u002Fdiv>'; // close flex row\n        // Mastery progress bar\n        html += '<div style=\"display:flex;align-items:center;gap:8px;margin-top:6px\">';\n        html += '<div style=\"flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden\">';\n        html += '<div style=\"height:100%;width:'+masteryPct+'%;background:'+barColor+';border-radius:3px\"><\u002Fdiv>';\n        html += '<\u002Fdiv>';\n        html += '<div style=\"font-size:10px;font-weight:700;color:'+(allMastered?'var(--green)':masteredQ>0?'var(--gold)':'var(--muted)')+'\">'+masteredQ+'/'+totalQ+' mastered<\u002Fdiv>';\n        html += '<\u002Fdiv>';\n        // Tried vs mastered detail\n        html += '<div style=\"font-size:10px;color:var(--muted);margin-top:4px\">\ud83d\udcdd '+triedQ+' tried \u00b7 \u2705 '+masteredQ+' mastered (80%+) \u00b7 '+(totalQ-triedQ)+' not attempted<\u002Fdiv>';\n        // \"Why not mastered?\" detail \u2014 only worth showing while the lesson\n        // hasn't actually reached full mastery yet.\n        if(!allMastered){\n          html += '<button id=\"masteryDetailBtn_'+lesson.id+'\" onclick=\"toggleMasteryDetail(&quot;'+lesson.id+'&quot;)\" style=\"margin-top:6px;padding:4px 0;background:none;border:none;color:var(--navy);font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer\">Why not mastered? \u25be<\u002Fbutton>';\n          html += '<div id=\"masteryDetail_'+lesson.id+'\" style=\"display:none;margin-top:4px;padding-top:4px;border-top:1px dashed var(--border)\">'+buildLessonMasteryDetail(lesson, isComplete)+'<\u002Fdiv>';\n        }\n        html += '<\u002Fdiv>'; // close card\n      });\n    });\n    html += '<\u002Fdiv>';\n  });\n  box.innerHTML = html;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MANAGE CONTENT \u2014 admin add/edit/delete for lessons & questions\n//  Writes go straight to the \"lessons\" Firestore collection (the same one\n//  the migration populated). Subjects/parts themselves are NOT editable\n//  here \u2014 only lessons and questions within the existing subject/part\n//  structure \u2014 adding a whole new subject or part still needs a code\n//  change, same limitation the migration always had.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nfunction getExistingSubjects(){\n  return Object.keys(getSubjectStructure());\n}\nfunction getExistingParts(subject){\n  const sd = getSubjectStructure()[subject];\n  return sd ? Object.keys(sd.parts) : [];\n}\n\n// Finds which subject/part a lesson currently lives under, using the LIVE\n// DATA tree (so it reflects the database copy once loaded, not just the\n// hardcoded fallback) \u2014 same lookup pattern checkLessonMasteryBonus already\n// uses, since lesson objects themselves don't carry subject/part as fields.\nfunction findLessonLocation(lessonId){\n  for(const [subjName, subj] of Object.entries(DATA)){\n    for(const [partName, part] of Object.entries(subj.parts)){\n      const lesson = part.lessons.find(l=>l.id===lessonId);\n      if(lesson) return { subject: subjName, part: partName, lesson };\n    }\n  }\n  return null;\n}\n\nfunction generateLessonId(){\n  return \"lesson_\" + Date.now() + \"_\" + Math.random().toString(36).slice(2,7);\n}\n\nasync function saveLessonDoc(lessonId, payload){\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return false; }\n  const { db, doc, setDoc } = window._fb;\n  try{\n    await setDoc(doc(db,\"lessons\",lessonId), { ...payload, adminSecret: ADMIN_WRITE_SECRET });\n    return true;\n  }catch(err){\n    alert(\"Save failed: \" + err.message);\n    return false;\n  }\n}\n\nasync function deleteLessonDoc(lessonId){\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return false; }\n  const { db, doc, deleteDoc } = window._fb;\n  try{\n    await deleteDoc(doc(db,\"lessons\",lessonId));\n    return true;\n  }catch(err){\n    alert(\"Delete failed: \" + err.message);\n    return false;\n  }\n}\n\n// Re-pulls from Firestore after any content change so DATA, the student's\n// own lesson list, and this admin screen all reflect it right away instead\n// of waiting for the next full page reload.\nasync function refreshContentFromDB(){\n  await loadLessonsFromFirestore();\n  renderManageContent();\n  try{ renderLessons(); }catch(e){}\n  try{ renderAdminLessons(); }catch(e){}\n}\n\nfunction escapeAttr(s){\n  return String(s==null?\"\":s).replace(/&/g,\"&amp;\").replace(/\"/g,\"&quot;\").replace(/<\u002Fg,\"&lt;\");\n}\nfunction escapeHtml(s){\n  return String(s==null?\"\":s).replace(/&/g,\"&amp;\").replace(/<\u002Fg,\"&lt;\").replace(/>/g,\"&gt;\");\n}\n\n// Both admin lists render from DATA, which is filtered to the selected class\n// \u2014 and currentClass persists across reloads. Without a control here, opening\n// admin after having looked at Class 10 shows two empty lists and no clue why,\n// which reads as the screens being broken rather than simply pointed at an\n// empty class. Rendered into both tabs, from their own render functions, so it\n// can never fall out of step with the list beneath it.\nfunction renderAdminClassBars(){\n  const bar = CLASS_ORDER.map(cls=>{\n    const active = cls===currentClass;\n    const count = _allLessonDocs\n      ? _allLessonDocs.filter(d=>((d.data().class)||\"9\")===cls).length\n      : 0;\n    return `<button onclick=\"adminSwitchClass('${cls}')\" style=\"flex:1;padding:9px 10px;border-radius:9px;font-weight:800;font-size:12.5px;cursor:pointer;border:1.5px solid ${active?\"var(--navy)\":\"var(--border,#e8e0d0)\"};background:${active?\"var(--navy)\":\"#fff\"};color:${active?\"#fff\":\"var(--muted)\"}\">Class ${cls}<span style=\"opacity:.7;font-weight:600\"> \u00b7 ${count}<\u002Fspan><\u002Fbutton>`;\n  }).join(\"\");\n  const html = `<div style=\"display:flex;gap:8px\">${bar}<\u002Fdiv>\n    <div style=\"font-size:11px;color:var(--muted);margin-top:6px\">Showing Class ${currentClass} content. ${STUDENT_NAME} sees whichever class he has selected.<\u002Fdiv>`;\n  [\"adminClassBarLessons\",\"adminClassBarContent\"].forEach(id=>{\n    const el = document.getElementById(id);\n    if(el) el.innerHTML = html;\n  });\n}\n\nfunction adminSwitchClass(cls){\n  switchClass(cls);\n  renderAdminClassBars();\n}\n\nfunction renderManageContent(){\n  renderAdminClassBars();\n  const box = document.getElementById(\"manageContentList\");\n  if(!box) return;\n  let html = `<button onclick=\"openLessonEditor(null)\" style=\"width:100%;padding:12px;margin-bottom:10px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer\">+ Add New Lesson<\u002Fbutton>`;\n  // A full syllabus is 70-odd lessons, which is a lot to scroll past to reach\n  // one chapter. Filtering hides non-matching cards in place rather than\n  // re-rendering, so typing never costs the input its focus.\n  html += `<div style=\"display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap\">\n    <input id=\"mcFilter\" type=\"text\" placeholder=\"Filter lessons\u2026\" oninput=\"filterManageContent(this.value)\"\n      style=\"flex:1;min-width:150px;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px\">\n    <button onclick=\"setAllManageLessons(true)\" style=\"padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy)\">Expand all<\u002Fbutton>\n    <button onclick=\"setAllManageLessons(false)\" style=\"padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy)\">Collapse all<\u002Fbutton>\n  <\u002Fdiv>`;\n  Object.entries(DATA).forEach(([subjName, subjData])=>{\n    let subjHtml = `<div style=\"margin:18px 0 6px;font-size:14px;font-weight:800;color:var(--navy)\">${subjData.icon||\"\ud83d\udcda\"} ${escapeHtml(subjName)}<\u002Fdiv>`;\n    let anyInSubject = false;\n    Object.entries(subjData.parts).forEach(([partName, partData])=>{\n      if(!partData.lessons.length) return;\n      anyInSubject = true;\n      subjHtml += `<div class=\"mc-part\">`\n        + `<div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 0 6px;text-transform:uppercase;letter-spacing:.4px\">${partData.icon||\"\"} ${escapeHtml(partName)} <span style=\"opacity:.7\">(${partData.lessons.length})<\u002Fspan><\u002Fdiv>`;\n      partData.lessons.forEach(lesson=>{\n        subjHtml += renderManageLessonCard(lesson, subjName, partName);\n      });\n      subjHtml += `<\u002Fdiv>`;\n    });\n    if(anyInSubject) html += `<div class=\"mc-subject\">${subjHtml}<\u002Fdiv>`;\n  });\n  if(totalLessonsInData() === 0){\n    html += `<div style=\"padding:22px;text-align:center;color:var(--muted);background:var(--parchment,#f3ece1);border:1.5px dashed var(--border,#d8cdbb);border-radius:12px;font-size:13px\">\n      No lessons in Class ${currentClass} yet.${currentClass===\"10\" ? ' Use <b>Lessons \u2192 Set up Class 10 syllabus<\u002Fb> to create the chapters first.' : \"\"}\n    <\u002Fdiv>`;\n  }\n  box.innerHTML = html;\n}\n\nfunction setAllManageLessons(open){\n  const box = document.getElementById(\"manageContentList\");\n  if(!box) return;\n  box.querySelectorAll(\"details\").forEach(d=>{ d.open = !!open; });\n}\n\n// Hides non-matching lesson cards, then hides any part or subject heading\n// left with nothing under it \u2014 a heading floating above no lessons reads as a\n// rendering fault rather than as a filter doing its job.\nfunction filterManageContent(term){\n  const box = document.getElementById(\"manageContentList\");\n  if(!box) return;\n  const q = (term||\"\").trim().toLowerCase();\n  box.querySelectorAll(\"details[data-lesson-title]\").forEach(d=>{\n    const hit = !q || (d.getAttribute(\"data-lesson-title\")||\"\").toLowerCase().includes(q);\n    d.style.display = hit ? \"\" : \"none\";\n    if(q && hit) d.open = true; // searching for something implies wanting to see inside it\n    if(!q) d.open = false;\n  });\n  box.querySelectorAll(\".mc-part\").forEach(sec=>{\n    const visible = Array.from(sec.querySelectorAll(\"details\")).some(d=>d.style.display!==\"none\");\n    sec.style.display = visible ? \"\" : \"none\";\n  });\n  box.querySelectorAll(\".mc-subject\").forEach(sec=>{\n    const visible = Array.from(sec.querySelectorAll(\".mc-part\")).some(p=>p.style.display!==\"none\");\n    sec.style.display = visible ? \"\" : \"none\";\n  });\n}\n\nfunction renderManageLessonCard(lesson, subjName, partName){\n  const totalQ = Object.values(lesson.questions).reduce((a,arr)=>a+arr.length,0);\n  let qtypeSections = \"\";\n  QTYPES.forEach(qt=>{\n    const arr = lesson.questions[qt.id] || [];\n    qtypeSections += `<div style=\"margin-top:10px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n        <span style=\"font-size:11.5px;font-weight:700;color:var(--navy)\">${qt.icon} ${qt.label} (${arr.length})<\u002Fspan>\n        <button onclick=\"openQuestionEditor('${lesson.id}','${qt.id}',-1)\" style=\"padding:4px 10px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:700;cursor:pointer;color:var(--navy)\">+ Add<\u002Fbutton>\n      <\u002Fdiv>\n      ${arr.map((q,i)=>`<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:var(--parchment,#faf6ee);border-radius:6px;margin-bottom:3px\">\n        <span style=\"font-size:11.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1\">${escapeHtml(describeQuestionShort(qt.id,q))}<\u002Fspan>\n        <span style=\"display:flex;gap:4px;flex-shrink:0\">\n          <button onclick=\"openQuestionEditor('${lesson.id}','${qt.id}',${i})\" title=\"Edit\" style=\"padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer\">\u270f\ufe0f<\u002Fbutton>\n          <button onclick=\"confirmDeleteQuestion('${lesson.id}','${qt.id}',${i})\" title=\"Delete\" style=\"padding:3px 8px;border-radius:5px;border:1px solid #d15f5a;background:#fff;color:#d15f5a;font-size:11px;cursor:pointer\">\ud83d\uddd1\ufe0f<\u002Fbutton>\n        <\u002Fspan>\n      <\u002Fdiv>`).join(\"\")}\n    <\u002Fdiv>`;\n  });\n\n  // Questions imported without an answer. Listed apart from the real ones so\n  // it's obvious they aren't live yet, with the count called out on the card\n  // itself \u2014 otherwise a chapter looks empty when it's actually full of work\n  // waiting on answers.\n  const pendingByType = lesson.pendingQuestions || {};\n  const pendingTotal = Object.values(pendingByType).reduce((a,arr)=>a+arr.length,0);\n  let pendingSection = \"\";\n  if(pendingTotal){\n    pendingSection = `<div style=\"margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--border)\">\n      <div style=\"font-size:11.5px;font-weight:800;color:#a1712a;margin-bottom:6px\">\u23f3 Waiting on answers (${pendingTotal}) \u2014 hidden from ${STUDENT_NAME}<\u002Fdiv>`;\n    QTYPES.forEach(qt=>{\n      const arr = pendingByType[qt.id] || [];\n      if(!arr.length) return;\n      pendingSection += `<div style=\"font-size:11px;font-weight:700;color:var(--muted);margin:8px 0 4px\">${qt.icon} ${qt.label} (${arr.length})<\u002Fdiv>`;\n      pendingSection += arr.map((q,i)=>`<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:#fdf7ec;border:1px dashed #e3cfa6;border-radius:6px;margin-bottom:3px\">\n        <span style=\"font-size:11.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1\">${escapeHtml(q.q||q.sentence||\"\")}<\u002Fspan>\n        <span style=\"display:flex;gap:4px;flex-shrink:0\">\n          <button onclick=\"openPendingAnswerEditor('${lesson.id}','${qt.id}',${i})\" style=\"padding:3px 9px;border-radius:5px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:11px;font-weight:700;cursor:pointer\">\u270d\ufe0f Answer<\u002Fbutton>\n          <button onclick=\"discardPendingQuestion('${lesson.id}','${qt.id}',${i})\" title=\"Remove\" style=\"padding:3px 8px;border-radius:5px;border:1px solid #d15f5a;background:#fff;color:#d15f5a;font-size:11px;cursor:pointer\">\ud83d\uddd1\ufe0f<\u002Fbutton>\n        <\u002Fspan>\n      <\u002Fdiv>`).join(\"\");\n    });\n    pendingSection += `<\u002Fdiv>`;\n  }\n\n  // Deliberately NOT open-when-empty any more. That was a helpful nudge when\n  // one lesson had been left without questions, but seeding a whole syllabus\n  // creates dozens of empty lessons at once \u2014 every one of which then rendered\n  // fully expanded, eight question-type sections deep, turning the page into\n  // something you could not realistically scroll. Empty lessons are called out\n  // with a badge instead, which reads better in a long list anyway.\n  const waitingBadge = (Object.values(lesson.pendingQuestions||{}).reduce((a,arr)=>a+arr.length,0))\n    ? `<span style=\"display:inline-block;font-size:10px;font-weight:800;background:#fdf7ec;color:#a1712a;border:1px solid #e3cfa6;padding:2px 7px;border-radius:9px;margin-left:6px;vertical-align:middle\">${Object.values(lesson.pendingQuestions||{}).reduce((a,arr)=>a+arr.length,0)} awaiting answers<\u002Fspan>`\n    : \"\";\n  const emptyBadge = totalQ===0\n    ? `<span style=\"display:inline-block;font-size:10px;font-weight:800;background:#fdf0d5;color:#a1712a;padding:2px 7px;border-radius:9px;margin-left:6px;vertical-align:middle\">no questions yet<\u002Fspan>`\n    : \"\";\n  return `<details data-lesson-title=\"${escapeAttr((lesson.title||\"\")+\" \"+(lesson.unit||\"\"))}\" style=\"margin-bottom:8px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px\">\n    <summary style=\"cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between\">\n      <span>\n        <div style=\"font-size:13px;font-weight:700;color:var(--navy)\">${escapeHtml(lesson.title)}${emptyBadge}${waitingBadge}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted)\">${escapeHtml(lesson.unit||\"\")} \u00b7 ${totalQ} questions<\u002Fdiv>\n      <\u002Fspan>\n      <span style=\"display:flex;gap:6px;flex-shrink:0\" onclick=\"event.preventDefault()\">\n        <button onclick=\"openLessonEditor('${lesson.id}')\" style=\"padding:6px 10px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:700;cursor:pointer\">\u270f\ufe0f Edit<\u002Fbutton>\n        <button onclick=\"confirmDeleteLesson('${lesson.id}')\" style=\"padding:6px 10px;border-radius:6px;border:1.5px solid #d15f5a;background:#fff;color:#d15f5a;font-size:11px;font-weight:700;cursor:pointer\">\ud83d\uddd1\ufe0f Delete<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fsummary>\n    ${qtypeSections}\n    ${pendingSection}\n  <\u002Fdetails>`;\n}\n\nfunction describeQuestionShort(qtype, q){\n  if(qtype===\"mcq\") return q.q;\n  if(qtype===\"fill\") return q.sentence;\n  if(qtype===\"match\") return q.q;\n  if(qtype===\"truefalse\") return q.q;\n  if(qtype===\"distinguish\") return q.q;\n  if(qtype===\"memorise\") return q.q;\n  return q.q; // brief, reasons, paragraph\n}\n\n// \u2500\u2500\u2500 Lesson add/edit \u2500\u2500\u2500\n\nfunction openLessonEditor(lessonId){\n  const loc = lessonId ? findLessonLocation(lessonId) : null;\n  const lesson = loc ? loc.lesson : null;\n  const subjects = getExistingSubjects();\n  const currentSubj = loc ? loc.subject : subjects[0];\n  const parts = getExistingParts(currentSubj);\n\n  let overlay = document.getElementById(\"lessonEditorOverlay\");\n  if(overlay) overlay.remove();\n  overlay = document.createElement(\"div\");\n  overlay.id = \"lessonEditorOverlay\";\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto\";\n  overlay.innerHTML = `<div style=\"background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto\">\n    <div style=\"font-weight:800;font-size:15px;margin-bottom:14px;color:var(--navy)\">${lesson?\"Edit\":\"Add\"} Lesson<\u002Fdiv>\n\n    <label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">Subject<\u002Flabel>\n    <select id=\"lf_subject\" onchange=\"onLessonEditorSubjectChange()\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-family:inherit\">\n      ${subjects.map(s=>`<option value=\"${escapeAttr(s)}\" ${s===currentSubj?\"selected\":\"\"}>${escapeHtml(s)}<\u002Foption>`).join(\"\")}\n    <\u002Fselect>\n\n    <label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">Part<\u002Flabel>\n    <select id=\"lf_part\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-family:inherit\">\n      ${parts.map(p=>`<option value=\"${escapeAttr(p)}\" ${loc&&p===loc.part?\"selected\":\"\"}>${escapeHtml(p)}<\u002Foption>`).join(\"\")}\n    <\u002Fselect>\n\n    <label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">Unit<\u002Flabel>\n    <input id=\"lf_unit\" type=\"text\" value=\"${escapeAttr(lesson?lesson.unit:\"\")}\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-family:inherit\">\n\n    <label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">Title<\u002Flabel>\n    <input id=\"lf_title\" type=\"text\" value=\"${escapeAttr(lesson?lesson.title:\"\")}\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-family:inherit\">\n\n    <label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">Month (optional)<\u002Flabel>\n    <input id=\"lf_month\" type=\"text\" value=\"${escapeAttr(lesson?lesson.month:\"\")}\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-family:inherit\">\n\n    <label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">Order (lower shows first)<\u002Flabel>\n    <input id=\"lf_order\" type=\"number\" value=\"${lesson&&lesson.order!=null?lesson.order:0}\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:16px;font-family:inherit\">\n\n    <div style=\"display:flex;gap:8px\">\n      <button onclick=\"document.getElementById('lessonEditorOverlay').remove()\" style=\"flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer\">Cancel<\u002Fbutton>\n      <button onclick=\"submitLessonEditor(${lessonId?`'${lessonId}'`:'null'})\" style=\"flex:1;padding:12px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-weight:700;cursor:pointer\">Save<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n}\n\nfunction onLessonEditorSubjectChange(){\n  const subj = document.getElementById(\"lf_subject\").value;\n  const parts = getExistingParts(subj);\n  const partSel = document.getElementById(\"lf_part\");\n  partSel.innerHTML = parts.map(p=>`<option value=\"${escapeAttr(p)}\">${escapeHtml(p)}<\u002Foption>`).join(\"\");\n}\n\nasync function submitLessonEditor(existingLessonId){\n  const subject = document.getElementById(\"lf_subject\").value;\n  const part = document.getElementById(\"lf_part\").value;\n  const unit = document.getElementById(\"lf_unit\").value.trim();\n  const title = document.getElementById(\"lf_title\").value.trim();\n  const month = document.getElementById(\"lf_month\").value.trim();\n  const order = parseInt(document.getElementById(\"lf_order\").value, 10) || 0;\n\n  if(!title){ alert(\"Title is required.\"); return; }\n\n  const lessonId = existingLessonId || generateLessonId();\n  const loc = existingLessonId ? findLessonLocation(existingLessonId) : null;\n  const questions = loc ? loc.lesson.questions : {};\n\n  const ok = await saveLessonDoc(lessonId, { subject, part, unit, title, month, order, questions, class: currentClass });\n  if(!ok) return;\n  document.getElementById(\"lessonEditorOverlay\")?.remove();\n  await refreshContentFromDB();\n}\n\nasync function confirmDeleteLesson(lessonId){\n  const loc = findLessonLocation(lessonId);\n  const title = loc ? loc.lesson.title : lessonId;\n  if(!confirm(`Delete \"${title}\" and all its questions? This can't be undone.`)) return;\n  const ok = await deleteLessonDoc(lessonId);\n  if(!ok) return;\n  await refreshContentFromDB();\n}\n\n// \u2500\u2500\u2500 Question add/edit \u2500\u2500\u2500\n\nfunction openQuestionEditor(lessonId, qtype, index){\n  const loc = findLessonLocation(lessonId);\n  const existing = (index>=0 && loc) ? loc.lesson.questions[qtype][index] : null;\n  const qtDef = QTYPES.find(q=>q.id===qtype);\n\n  let overlay = document.getElementById(\"questionEditorOverlay\");\n  if(overlay) overlay.remove();\n  overlay = document.createElement(\"div\");\n  overlay.id = \"questionEditorOverlay\";\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto\";\n  overlay.innerHTML = `<div style=\"background:#fff;border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto\">\n    <div style=\"font-weight:800;font-size:15px;margin-bottom:12px;color:var(--navy)\">${index>=0?\"Edit\":\"Add\"} ${qtDef?qtDef.icon+\" \"+qtDef.label:qtype} Question<\u002Fdiv>\n    <div id=\"qEditorFields\">${renderQuestionFormFields(qtype, existing)}<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:16px\">\n      <button onclick=\"document.getElementById('questionEditorOverlay').remove()\" style=\"flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer\">Cancel<\u002Fbutton>\n      <button onclick=\"submitQuestionEditor('${lessonId}','${qtype}',${index})\" style=\"flex:1;padding:12px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-weight:700;cursor:pointer\">Save<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n}\n\nfunction ffield(label, inputHtml){\n  return `<label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px\">${label}<\u002Flabel>${inputHtml}<div style=\"height:10px\"><\u002Fdiv>`;\n}\nfunction ftext(id, value){\n  return `<input id=\"${id}\" type=\"text\" value=\"${escapeAttr(value)}\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit\">`;\n}\nfunction ftextarea(id, value, rows){\n  return `<textarea id=\"${id}\" rows=\"${rows||3}\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit\">${escapeHtml(value)}<\u002Ftextarea>`;\n}\n\nfunction renderQuestionFormFields(qtype, existing){\n  const e = existing || {};\n  if(qtype===\"mcq\"){\n    const opts = e.options || [\"\",\"\",\"\",\"\"];\n    return ffield(\"Question\", ftext(\"qf_q\", e.q||\"\"))\n      + [0,1,2,3].map(i=>ffield(`Option ${i+1}`, ftext(\"qf_opt\"+i, opts[i]||\"\"))).join(\"\")\n      + ffield(\"Correct option (1-4)\", ftext(\"qf_correct\", e.correct!=null?(e.correct+1):\"1\"));\n  }\n  if(qtype===\"fill\"){\n    return ffield(\"Sentence (use ___ for the blank)\", ftext(\"qf_sentence\", e.sentence||\"\"))\n      + ffield(\"Acceptable answers (comma-separated)\", ftext(\"qf_answers\", (e.answers||[]).join(\", \")));\n  }\n  if(qtype===\"match\"){\n    const pairs = [];\n    if(e.left){ e.left.forEach((l,i)=> pairs.push({ left:l, right: e.right[e.correct[i]] })); }\n    let rows = \"\";\n    for(let i=0;i<6;i++){\n      const p = pairs[i] || {left:\"\",right:\"\"};\n      rows += `<div style=\"display:flex;gap:6px;margin-bottom:6px\">\n        <input id=\"qf_pair_left_${i}\" type=\"text\" placeholder=\"Left ${i+1}\" value=\"${escapeAttr(p.left)}\" style=\"flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit\">\n        <input id=\"qf_pair_right_${i}\" type=\"text\" placeholder=\"Right ${i+1}\" value=\"${escapeAttr(p.right)}\" style=\"flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit\">\n      <\u002Fdiv>`;\n    }\n    return ffield(\"Question\", ftext(\"qf_q\", e.q||\"\"))\n      + `<label style=\"display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px\">Pairs (leave blank rows unused \u2014 need at least 2)<\u002Flabel>${rows}`;\n  }\n  if(qtype===\"brief\" || qtype===\"reasons\" || qtype===\"paragraph\"){\n    return ffield(\"Question\", ftext(\"qf_q\", e.q||\"\"))\n      + ffield(\"Model answer\", ftextarea(\"qf_answer\", e.answer||\"\", 5));\n  }\n  if(qtype===\"truefalse\"){\n    return ffield(\"Statement\", ftext(\"qf_q\", e.q||\"\"))\n      + ffield(\"Answer\", `<select id=\"qf_answer\" style=\"width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit\">\n          <option value=\"true\" ${e.answer===true?\"selected\":\"\"}>True<\u002Foption>\n          <option value=\"false\" ${e.answer===false?\"selected\":\"\"}>False<\u002Foption>\n        <\u002Fselect>`)\n      + ffield(\"Correction (shown when the statement is false)\", ftextarea(\"qf_correction\", e.correction||\"\", 3));\n  }\n  if(qtype===\"distinguish\"){\n    return ffield(\"Question\", ftext(\"qf_q\", e.q||\"\"))\n      + ffield(\"Term A\", ftext(\"qf_termA\", e.termA||\"\"))\n      + ffield(\"Answer for Term A\", ftextarea(\"qf_answerA\", e.answerA||\"\", 4))\n      + ffield(\"Term B\", ftext(\"qf_termB\", e.termB||\"\"))\n      + ffield(\"Answer for Term B\", ftextarea(\"qf_answerB\", e.answerB||\"\", 4));\n  }\n  if(qtype===\"memorise\"){\n    return ffield(\"Question (e.g. \\\"Quote from memory: ...\\\")\", ftext(\"qf_q\", e.q||\"\"))\n      + ffield(\"Lines to memorise (one line per row)\", ftextarea(\"qf_lines\", e.lines||\"\", 5));\n  }\n  return \"<p>Unknown question type.<\u002Fp>\";\n}\n\n// Pure builder: given the qtype and a plain object of raw field values\n// (already read from the form), returns { ok:true, question } or\n// { ok:false, error }. Kept separate from DOM-reading so it can be tested\n// without a browser.\nfunction buildQuestionObject(qtype, raw){\n  function need(v, label){ if(!v || !String(v).trim()) throw new Error(label+\" is required.\"); }\n  try{\n    if(qtype===\"mcq\"){\n      need(raw.q, \"Question\");\n      const options = [raw.opt0, raw.opt1, raw.opt2, raw.opt3];\n      options.forEach((o,i)=>need(o, \"Option \"+(i+1)));\n      const correctNum = parseInt(raw.correct, 10);\n      if(!(correctNum>=1 && correctNum<=4)) throw new Error(\"Correct option must be 1-4.\");\n      return { ok:true, question: { q: raw.q.trim(), options: options.map(o=>o.trim()), correct: correctNum-1 } };\n    }\n    if(qtype===\"fill\"){\n      need(raw.sentence, \"Sentence\");\n      const answers = (raw.answers||\"\").split(\",\").map(s=>s.trim()).filter(Boolean);\n      if(!answers.length) throw new Error(\"At least one acceptable answer is required.\");\n      return { ok:true, question: { sentence: raw.sentence.trim(), answers } };\n    }\n    if(qtype===\"match\"){\n      need(raw.q, \"Question\");\n      const pairs = (raw.pairs||[]).filter(p=>p.left.trim() || p.right.trim());\n      pairs.forEach(p=>{\n        if(!p.left.trim() || !p.right.trim()) throw new Error(\"Every pair needs both a left and right side filled in (or leave the whole row blank).\");\n      });\n      if(pairs.length < 2) throw new Error(\"Need at least 2 complete pairs.\");\n      const left = pairs.map(p=>p.left.trim());\n      const rightOriginal = pairs.map(p=>p.right.trim());\n      const shuffledRight = shuffleArrayPure(rightOriginal.map((v,i)=>({v,i})));\n      const right = shuffledRight.map(x=>x.v);\n      const correct = rightOriginal.map(v => shuffledRight.findIndex(x=>x.v===v));\n      return { ok:true, question: { q: raw.q.trim(), left, right, correct } };\n    }\n    if(qtype===\"brief\" || qtype===\"reasons\" || qtype===\"paragraph\"){\n      need(raw.q, \"Question\");\n      need(raw.answer, \"Model answer\");\n      return { ok:true, question: { q: raw.q.trim(), answer: raw.answer.trim() } };\n    }\n    if(qtype===\"truefalse\"){\n      need(raw.q, \"Statement\");\n      need(raw.correction, \"Correction\");\n      return { ok:true, question: { q: raw.q.trim(), answer: raw.answer===\"true\", correction: raw.correction.trim() } };\n    }\n    if(qtype===\"distinguish\"){\n      need(raw.q, \"Question\"); need(raw.termA, \"Term A\"); need(raw.answerA, \"Answer for Term A\");\n      need(raw.termB, \"Term B\"); need(raw.answerB, \"Answer for Term B\");\n      return { ok:true, question: { q: raw.q.trim(), termA: raw.termA.trim(), answerA: raw.answerA.trim(), termB: raw.termB.trim(), answerB: raw.answerB.trim() } };\n    }\n    if(qtype===\"memorise\"){\n      need(raw.q, \"Question\"); need(raw.lines, \"Lines to memorise\");\n      const lines = raw.lines.trim();\n      const answer = lines.replace(/\\n+/g,\" \").replace(/\\s+/g,\" \").trim();\n      return { ok:true, question: { q: raw.q.trim(), lines, answer } };\n    }\n    return { ok:false, error: \"Unknown question type.\" };\n  }catch(err){\n    return { ok:false, error: err.message };\n  }\n}\n\n// Fisher-Yates on a copy \u2014 used for match questions so the right-hand\n// column shown to the student isn't in the same order as the left, without\n// the admin having to think about indices at all: they just enter matching\n// pairs, and this scrambles the display order while keeping the mapping correct.\nfunction shuffleArrayPure(arr){\n  const a = arr.slice();\n  for(let i=a.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [a[i],a[j]] = [a[j],a[i]];\n  }\n  return a;\n}\n\nfunction readQuestionFormRaw(qtype){\n  const v = id => document.getElementById(id)?.value ?? \"\";\n  if(qtype===\"mcq\") return { q:v(\"qf_q\"), opt0:v(\"qf_opt0\"), opt1:v(\"qf_opt1\"), opt2:v(\"qf_opt2\"), opt3:v(\"qf_opt3\"), correct:v(\"qf_correct\") };\n  if(qtype===\"fill\") return { sentence:v(\"qf_sentence\"), answers:v(\"qf_answers\") };\n  if(qtype===\"match\"){\n    const pairs = [];\n    for(let i=0;i<6;i++) pairs.push({ left:v(\"qf_pair_left_\"+i), right:v(\"qf_pair_right_\"+i) });\n    return { q:v(\"qf_q\"), pairs };\n  }\n  if(qtype===\"brief\" || qtype===\"reasons\" || qtype===\"paragraph\") return { q:v(\"qf_q\"), answer:v(\"qf_answer\") };\n  if(qtype===\"truefalse\") return { q:v(\"qf_q\"), answer:v(\"qf_answer\"), correction:v(\"qf_correction\") };\n  if(qtype===\"distinguish\") return { q:v(\"qf_q\"), termA:v(\"qf_termA\"), answerA:v(\"qf_answerA\"), termB:v(\"qf_termB\"), answerB:v(\"qf_answerB\") };\n  if(qtype===\"memorise\") return { q:v(\"qf_q\"), lines:v(\"qf_lines\") };\n  return {};\n}\n\nasync function submitQuestionEditor(lessonId, qtype, index){\n  const raw = readQuestionFormRaw(qtype);\n  const result = buildQuestionObject(qtype, raw);\n  if(!result.ok){ alert(result.error); return; }\n\n  // Read the lesson fresh right before writing, so we're editing the\n  // latest questions map rather than a possibly-stale in-memory copy.\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return; }\n  const { db, doc, getDoc } = window._fb;\n  let lessonData;\n  try{\n    const snap = await getDoc(doc(db,\"lessons\",lessonId));\n    if(!snap.exists()){ alert(\"This lesson no longer exists in the database \u2014 reload and try again.\"); return; }\n    lessonData = snap.data();\n  }catch(err){ alert(\"Couldn't load the lesson: \" + err.message); return; }\n\n  const questions = { ...lessonData.questions };\n  const arr = (questions[qtype] || []).slice();\n  if(index>=0) arr[index] = result.question;\n  else arr.push(result.question);\n  questions[qtype] = arr;\n\n  const ok = await saveLessonDoc(lessonId, { ...lessonData, questions });\n  if(!ok) return;\n  document.getElementById(\"questionEditorOverlay\")?.remove();\n  await refreshContentFromDB();\n}\n\nasync function confirmDeleteQuestion(lessonId, qtype, index){\n  if(!confirm(\"Delete this question? This can't be undone.\")) return;\n  if(!window._fb){ alert(\"No database connection right now \u2014 try again in a moment.\"); return; }\n  const { db, doc, getDoc } = window._fb;\n  let lessonData;\n  try{\n    const snap = await getDoc(doc(db,\"lessons\",lessonId));\n    if(!snap.exists()){ alert(\"This lesson no longer exists in the database \u2014 reload and try again.\"); return; }\n    lessonData = snap.data();\n  }catch(err){ alert(\"Couldn't load the lesson: \" + err.message); return; }\n\n  const questions = { ...lessonData.questions };\n  const arr = (questions[qtype] || []).slice();\n  arr.splice(index, 1);\n  questions[qtype] = arr;\n\n  const ok = await saveLessonDoc(lessonId, { ...lessonData, questions });\n  if(!ok) return;\n  // Every question after this index just shifted down by one -- any\n  // mastery/answered history at or after this position no longer refers\n  // to the question that's actually there now. See isMasteryKeyStillValid.\n  await recordQuestionContentEdit(lessonId, qtype, index);\n  await refreshContentFromDB();\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  FOCUS MODE ADMIN UI\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _focusModeDraftIds = null; // Set \u2014 the checklist's working selection while this tab is open\nlet _focusModeDraftQTypes = null; // Set \u2014 question types ticked in the draft; empty means all\n\nfunction renderFocusModeTab(){\n  const box = document.getElementById(\"focusModeList\");\n  if(!box) return;\n  if(!_focusModeDraftIds) _focusModeDraftIds = new Set(_focusMode.lessonIds);\n  if(!_focusModeDraftQTypes) _focusModeDraftQTypes = new Set(_focusMode.qtypes||[]);\n  if(_focusModeDraftUnmastered===null) _focusModeDraftUnmastered = !!_focusMode.unmasteredOnly;\n\n  let html = `<div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:${_focusMode.enabled?\"var(--green-light)\":\"var(--parchment,#faf6ee)\"};border:1.5px solid ${_focusMode.enabled?\"var(--green)\":\"var(--border)\"};border-radius:10px;margin-bottom:16px\">\n    <div>\n      <div style=\"font-weight:800;color:var(--navy)\">${_focusMode.enabled?\"\ud83c\udfaf Focus Mode is ON\":\"Focus Mode is OFF\"}<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:var(--muted)\">${_focusMode.enabled?_focusMode.lessonIds.length+\" lesson(s)\"+((_focusMode.qtypes||[]).length?\" \u00b7 \"+_focusMode.qtypes.length+\" heading(s)\":\" \u00b7 all headings\")+(_focusMode.unmasteredOnly?\" \u00b7 unmastered only\":\"\")+\" \u2014 everything else is hidden from \"+STUDENT_NAME:\"Nothing is restricted right now \u2014 \"+STUDENT_NAME+\" can browse everything\"}<\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"toggleFocusModeOff()\" ${_focusMode.enabled?\"\":\"disabled\"} style=\"padding:8px 14px;border-radius:8px;border:1.5px solid ${_focusMode.enabled?\"#d15f5a\":\"var(--border)\"};background:#fff;color:${_focusMode.enabled?\"#d15f5a\":\"var(--muted)\"};font-weight:700;font-size:12px;cursor:pointer\">Turn Off<\u002Fbutton>\n  <\u002Fdiv>`;\n\n  // Headings first: it's the coarser of the two filters, and leaving it empty\n  // is the common case, so it shouldn't sit below a long lesson checklist.\n  html += `<div style=\"padding:12px 14px;background:#fff;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px\">\n    <div style=\"font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:3px\">Headings<\u002Fdiv>\n    <div style=\"font-size:11.5px;color:var(--muted);margin-bottom:9px\">Tick to limit him to those question types \u2014 useful for drilling one heading before a test. Leave all unticked to allow every heading.<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\">`;\n  QTYPES.forEach(qt=>{\n    const on = _focusModeDraftQTypes.has(qt.id);\n    html += `<label style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;border:1.5px solid ${on?\"var(--navy)\":\"var(--border)\"};background:${on?\"var(--navy)\":\"#fff\"};color:${on?\"#fff\":\"var(--muted)\"}\">\n      <input type=\"checkbox\" ${on?\"checked\":\"\"} onchange=\"toggleFocusDraftQType('${qt.id}',this.checked)\" style=\"margin:0\">\n      ${qt.icon} ${qt.label}\n    <\u002Flabel>`;\n  });\n  html += `<\u002Fdiv>\n    <div style=\"font-size:11px;color:var(--muted);margin-top:8px\">${_focusModeDraftQTypes.size ? _focusModeDraftQTypes.size+\" heading(s) selected\" : \"All headings allowed\"}<\u002Fdiv>\n  <\u002Fdiv>`;\n\n  html += `<label style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1.5px solid ${_focusModeDraftUnmastered?\"var(--navy)\":\"var(--border)\"};border-radius:10px;margin-bottom:14px;cursor:pointer\">\n    <input type=\"checkbox\" ${_focusModeDraftUnmastered?\"checked\":\"\"} onchange=\"toggleFocusDraftUnmastered(this.checked)\" style=\"margin:0\">\n    <span>\n      <span style=\"font-size:12.5px;font-weight:800;color:var(--navy)\">Only what he hasn't mastered<\u002Fspan>\n      <span style=\"display:block;font-size:11.5px;color:var(--muted)\">Questions already mastered are stepped over, so a session drills what's left. Question numbers stay put \u2014 a mastered question 5 is skipped, not renumbered.<\u002Fspan>\n    <\u002Fspan>\n  <\u002Flabel>`;\n\n  html += `<button onclick=\"saveFocusModeDraft()\" style=\"width:100%;padding:12px;margin-bottom:16px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer\">\ud83c\udfaf Turn On With Selected Lessons<\u002Fbutton>`;\n\n  Object.entries(DATA).forEach(([subjName, subjData])=>{\n    const hasLessons = Object.values(subjData.parts).some(pd=>pd.lessons.length);\n    if(!hasLessons) return;\n    html += `<div style=\"margin:16px 0 6px;font-size:14px;font-weight:800;color:var(--navy)\">${subjData.icon||\"\ud83d\udcda\"} ${escapeHtml(subjName)}<\u002Fdiv>`;\n    Object.entries(subjData.parts).forEach(([partName, partData])=>{\n      if(!partData.lessons.length) return;\n      html += `<div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 0 6px;text-transform:uppercase;letter-spacing:.4px\">${partData.icon||\"\"} ${escapeHtml(partName)}<\u002Fdiv>`;\n      partData.lessons.forEach(lesson=>{\n        const checked = _focusModeDraftIds.has(lesson.id);\n        html += `<label style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1.5px solid var(--border);border-radius:8px;margin-bottom:4px;cursor:pointer\">\n          <input type=\"checkbox\" ${checked?\"checked\":\"\"} onchange=\"toggleFocusDraftLesson('${lesson.id}',this.checked)\">\n          <span style=\"font-size:13px;color:var(--text)\">${escapeHtml(lesson.title)}<\u002Fspan>\n        <\u002Flabel>`;\n      });\n    });\n  });\n\n  box.innerHTML = html;\n}\n\nfunction toggleFocusDraftUnmastered(checked){\n  _focusModeDraftUnmastered = !!checked;\n  renderFocusModeTab();\n}\n\nfunction toggleFocusDraftQType(qtypeId, checked){\n  if(!_focusModeDraftQTypes) _focusModeDraftQTypes = new Set(_focusMode.qtypes||[]);\n  if(checked) _focusModeDraftQTypes.add(qtypeId); else _focusModeDraftQTypes.delete(qtypeId);\n  renderFocusModeTab(); // redraw so the pill reflects its state\n}\n\nfunction toggleFocusDraftLesson(lessonId, checked){\n  if(!_focusModeDraftIds) _focusModeDraftIds = new Set(_focusMode.lessonIds);\n  if(checked) _focusModeDraftIds.add(lessonId); else _focusModeDraftIds.delete(lessonId);\n}\n\nasync function saveFocusModeDraft(){\n  const ids = Array.from(_focusModeDraftIds || []);\n  if(!ids.length){ alert(\"Select at least one lesson before turning Focus Mode on.\"); return; }\n  const qts = Array.from(_focusModeDraftQTypes || []);\n  const ok = await saveFocusMode(true, ids, qts, !!_focusModeDraftUnmastered);\n  if(!ok) return;\n  renderFocusModeTab();\n  alert(\"Focus Mode is on \u2014 \"+ids.length+\" lesson(s) selected\"\n    + (qts.length ? \", limited to \"+qts.length+\" heading(s)\" : \", all headings allowed\")\n    + (_focusModeDraftUnmastered ? \", showing only what he hasn't mastered\" : \"\")\n    + \". \"+STUDENT_NAME+\" will see this the next time the app loads (or on refresh, if already open).\");\n}\n\nasync function toggleFocusModeOff(){\n  if(!confirm(\"Turn off Focus Mode? \"+STUDENT_NAME+\" will be able to browse everything again.\")) return;\n  const ok = await saveFocusMode(false, _focusMode.lessonIds, _focusMode.qtypes, _focusMode.unmasteredOnly); // remember the same selection for next time, just disabled\n  if(!ok) return;\n  renderFocusModeTab();\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
</body>
</html>
