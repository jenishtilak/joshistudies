memory:<\u002Fdiv>\n      <input id=\"spellInput\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\"\n        style=\"width:100%;max-width:280px;padding:12px;font-size:18px;text-align:center;border:2px solid var(--border);border-radius:10px;margin-bottom:14px\"\n        onkeydown=\"if(event.key==='Enter') checkSpellingAnswer()\">\n      <div id=\"spellFeedback\" style=\"min-height:24px;font-size:14px;font-weight:700;margin-bottom:10px\"><\u002Fdiv>\n      <button onclick=\"checkSpellingAnswer()\" style=\"padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer\">Check<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.getElementById(\"spellInput\")?.focus();\n}\n\n\nfunction checkSpellingAnswer(){\n  const input = document.getElementById(\"spellInput\");\n  const feedback = document.getElementById(\"spellFeedback\");\n  if(!input || input.disabled) return; // prevent double-submit\n  const item = _spellingWords[_spellingIdx];\n  const typed = input.value.trim();\n  const isCorrect = typed.toLowerCase() === item.word.toLowerCase();\n\n  input.disabled = true;\n  if(isCorrect){\n    _spellingScore++;\n    feedback.style.color = \"var(--green)\";\n    feedback.textContent = \"\u2713 Correct! +1 point\";\n    // Log as its own scored entry so it counts toward Growth Points \u2014\n    // 1 mark, 100%, tagged with the subject the word came from.\n    fbLogEntry(\"logs\", {\n      qtype: \"spelling\", pct: 100, timeMs: 0,\n      subject: _spellingSubject || \"\", lessonId: \"spelling\", qIndex: _spellingIdx,\n      lessonTitle: item.lessonTitle || \"Spelling Practice\"\n    });\n  } else {\n    feedback.style.color = \"var(--red)\";\n    feedback.innerHTML = `Not quite \u2014 it's <b>${item.word}<\u002Fb>`;\n  }\n\n  setTimeout(()=>{\n    // If the panel was closed/navigated away during the delay, don't keep advancing.\n    if(!document.getElementById(\"spellingGameRoot\")) return;\n    _spellingIdx++;\n    renderSpellingQuestion();\n  }, 1400);\n}\n\nfunction renderSpellingRoundResult(root){\n  const pct = Math.round((_spellingScore / _spellingRoundSize) * 100);\n  if(_spellingIsWarmDown){\n    // One pass through is enough -- his score is already locked in, this is\n    // reinforcement, not a second gate. Right or wrong on each word, \"See My\n    // Score\" is the only way forward, since there's no question left to skip.\n    root.innerHTML = `\n      <div style=\"text-align:center;padding:20px 16px\">\n        <div style=\"font-size:40px;margin-bottom:10px\">${pct===100?\"\ud83c\udfc6\":\"\u270d\ufe0f\"}<\u002Fdiv>\n        <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:6px\">${_spellingScore} / ${_spellingRoundSize} correct<\u002Fh3>\n        <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">Now let's see how you did on the question.<\u002Fp>\n        <button onclick=\"finishSpellingWarmDown()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">See My Score \u2192<\u002Fbutton>\n      <\u002Fdiv>`;\n    return;\n  }\n  if(_spellingIsGate){\n    // All 6 (or however many the round is) must be correct to unlock the\n    // question -- a partial score just sends him back for another attempt\n    // at this exact same set of words, not a fresh/easier one.\n    const allCorrect = _spellingScore === _spellingRoundSize;\n    root.innerHTML = `\n      <div style=\"text-align:center;padding:20px 16px\">\n        <div style=\"font-size:40px;margin-bottom:10px\">${allCorrect?\"\ud83c\udfc6\":\"\ud83d\udcaa\"}<\u002Fdiv>\n        <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:6px\">${_spellingScore} / ${_spellingRoundSize} correct<\u002Fh3>\n        <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">${allCorrect ? \"Nice warm-up \u2014 now let's answer the actual question.\" : `Get all ${_spellingRoundSize} correct to unlock the question \u2014 give it another go!`}<\u002Fp>\n        ${allCorrect\n          ? `<button onclick=\"finishSpellingGate()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Continue to Question \u2192<\u002Fbutton>`\n          : `<button onclick=\"startSpellingRound()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Try Again<\u002Fbutton>`}\n      <\u002Fdiv>`;\n    return;\n  }\n  const remaining = _spellingWords.length - _spellingRoundSize;\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:20px 16px\">\n      <div style=\"font-size:40px;margin-bottom:10px\">${pct>=80?\"\ud83c\udfc6\":pct>=50?\"\ud83d\udc4d\":\"\ud83d\udcaa\"}<\u002Fdiv>\n      <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:6px\">${_spellingScore} / ${_spellingRoundSize} correct<\u002Fh3>\n      <p style=\"color:var(--gold,#9c7519);font-size:13px;font-weight:700;margin-bottom:8px\">+${_spellingScore} point${_spellingScore!==1?\"s\":\"\"} earned<\u002Fp>\n      <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">\n        ${remaining>0 ? `${remaining} more word${remaining!==1?\"s\":\"\"} in ${_spellingSubject} still to practise.` : `You've covered every word in ${_spellingSubject}!`}\n      <\u002Fp>\n      <button onclick=\"restartCurrentSpellingRound()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-right:8px\">Play Again<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\n// Restarts a fresh round using whichever word set is already loaded (the\n// current lesson/question's spelling words) \u2014 replaces the old multi-subject\n// \"startSpellingSubject\" now that the standalone cross-subject game is retired.\nfunction restartCurrentSpellingRound(){\n  if(!_spellingWords || !_spellingWords.length) return;\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(10, _spellingWords.length);\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n}\n\n// Pull both collections once and assemble a downloadable HTML report (admin only)\nasync function downloadAdminMirror(){\n  if(!window._fb || !currentUserPhone) return;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n\n  const [logsSnap, examSnap, spellSnap, hintSnap] = await Promise.all([\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"logs\"), orderBy(\"ts\",\"desc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"examAnswers\"), orderBy(\"ts\",\"desc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"spellErrors\"), orderBy(\"ts\",\"desc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"hintConcepts\"), orderBy(\"ts\",\"desc\")))\n  ]);\n\n  // Build scoreboard summary for the download too\n  const bySession = {}; const allUnique = new Set();\n  let grandAttempts = 0, grandTimeMs = 0;\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = [];\n    bySession[sid].push(e);\n    allUnique.add(`${e.lessonId}|${e.qtype}|${e.qIndex}`);\n    grandAttempts++; grandTimeMs += e.timeMs||0;\n  });\n\n  let html = `<html><head><meta charset=\"utf-8\"><title>Study Buddy Mirror Report<\u002Ftitle>\n    <style>body{font-family:Georgia,serif;padding:24px;color:#222}h2{color:#202a3d}\n    table{width:100%;border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;text-align:left}\n    .ok{color:#2a9d5c;font-weight:700}.bad{color:#c0392b;font-weight:700}\n    .wrong-word{text-decoration:line-through;color:#c0392b}.right-word{color:#2a9d5c;font-weight:700}<\u002Fstyle>\n    <\u002Fhead><body>\n    <h1>\ud83d\udcca Study Buddy \u2014 Admin Mirror Report<\u002Fh1>\n    <p>Student: ${STUDENT_NAME} (${STUDENT_PHONE}) \u00b7 Generated: ${new Date().toLocaleString()}<\u002Fp>\n\n    <h2>\ud83c\udfc6 Scoreboard<\u002Fh2>\n    <p><b>${allUnique.size}<\u002Fb> unique questions learnt across <b>${Object.keys(bySession).length}<\u002Fb> session(s) \u00b7\n       <b>${grandAttempts}<\u002Fb> total attempts \u00b7 <b>${fmtMs(grandTimeMs)}<\u002Fb> total time spent<\u002Fp>\n\n    <h2>Session Logs (${logsSnap.size})<\u002Fh2>\n    <table><tr><th>Lesson<\u002Fth><th>Type<\u002Fth><th>Score<\u002Fth><th>Time taken<\u002Fth><th>When<\u002Fth><\u002Ftr>`;\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td>${e.lessonTitle||\"\u2014\"}<\u002Ftd><td>${e.qtype||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><td>${e.timeMs?fmtMs(e.timeMs):\"\"}<\u002Ftd><td>${e.ts?.toDate?e.ts.toDate().toLocaleString():\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><h2>Practice Test Answers (${examSnap.size})<\u002Fh2>\n    <table><tr><th>Question<\u002Fth><th>Student's Answer<\u002Fth><th>Correct Answer<\u002Fth><th>Score<\u002Fth><\u002Ftr>`;\n  examSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td>${e.q||\"\"}<\u002Ftd><td>${e.userText||\"\"}<\u002Ftd><td>${e.modelText||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable>\n    <h2>\u270f\ufe0f Spelling to Learn (${spellSnap.size})<\u002Fh2>\n    <table><tr><th>You wrote<\u002Fth><th>Correct spelling<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>`;\n  spellSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td class=\"wrong-word\">${e.wrong||\"\"}<\u002Ftd><td class=\"right-word\">${e.correct||\"\"}<\u002Ftd><td>${e.lessonTitle||\"\u2014\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable>\n    <h2>\ud83e\udd14 Concepts ${STUDENT_NAME} Needed Help With (${hintSnap.size})<\u002Fh2>\n    <table><tr><th>Question<\u002Fth><th>Type<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>`;\n  hintSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td>${e.questionText||\"\"}<\u002Ftd><td>${e.qtype||\"\"}<\u002Ftd><td>${e.lessonTitle||\"\u2014\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_AdminMirror_${Date.now()}.html`;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n\nfunction togglePasscodeVisibility(){\n  const inp = document.getElementById(\"passcodeInput\");\n  const btn = document.getElementById(\"wlToggle\");\n  if(inp.type === \"password\"){\n    inp.type = \"text\";\n    btn.textContent = \"\ud83d\ude48\";\n  } else {\n    inp.type = \"password\";\n    btn.textContent = \"\ud83d\udc41\";\n  }\n}\n\ninit();\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  LESSON MASTERY \u2014 complete flag + bonus\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nasync function loadCompleteLessons(){\n  if(!window._fb || !currentUserPhone){ console.log(\"loadCompleteLessons: no fb or phone\"); return; }\n  const { db, doc, getDoc } = window._fb;\n  try{\n    const ref = doc(db,\"sessions\",currentUserPhone,\"settings\",\"completeLessons\");\n    console.log(\"loadCompleteLessons: fetching from\", ref.path);\n    const snap = await getDoc(ref);\n    console.log(\"loadCompleteLessons: exists=\", snap.exists(), \"data=\", snap.exists()?snap.data():null);\n    if(snap.exists()) _completeLessons = snap.data() || {};\n    // Re-render lesson cards now that we know which are complete\n    if(typeof renderLessons === \"function\") renderLessons();\n  }catch(e){ console.error(\"loadCompleteLessons error:\", e); }\n}\n\nasync function toggleLessonComplete(lessonId){\n  _completeLessons[lessonId] = !_completeLessons[lessonId];\n  if(!_completeLessons[lessonId]) delete _completeLessons[lessonId];\n  console.log(\"toggleLessonComplete:\", lessonId, \"now:\", JSON.stringify(_completeLessons));\n  // Save to Firebase\n  if(window._fb && currentUserPhone){\n    const { db, doc, setDoc } = window._fb;\n    try{\n      var ref = doc(db,\"sessions\",currentUserPhone,\"settings\",\"completeLessons\");\n      console.log(\"saving to:\", ref.path, \"data:\", JSON.stringify(_completeLessons));\n      await setDoc(ref, _completeLessons);\n      console.log(\"saved OK\");\n    }catch(e){ console.error(\"toggleLessonComplete save error:\", e); }\n  }\n  checkLessonMasteryBonus(lessonId); // fire-and-forget \u2014 in case every question was already mastered before this toggle\n  awardPendingTestPoints(lessonId);   // fire-and-forget \u2014 pays out any lesson test he sat before this lesson was marked complete\n  renderAdminLessons();\n}\n\n// Explains, per question, exactly why a lesson isn't (yet) fully mastered --\n// whether it's simply not marked \"Complete\", or which specific questions\n// have never scored 80%+ unaided. Surfaced on-demand under each lesson card\n// below rather than always rendered, so lessons close to being mastered\n// don't get buried by a long list for every other lesson at once.\nfunction buildLessonMasteryDetail(lesson, isComplete){\n  var html = \"\";\n  if(!isComplete){\n    html += '<div style=\"font-size:11.5px;color:var(--red,#c0392b);padding:4px 0;font-weight:700\">\u26a0\ufe0f Not marked \"Complete\" yet \u2014 the \ud83c\udfc6 Lesson Mastery bonus can\\'t fire until this lesson is marked complete, no matter how well he scores.<\u002Fdiv>';\n  }\n  var questionRows = \"\";\n  Object.entries(lesson.questions).forEach(function(pair){\n    var qt = pair[0], arr = pair[1];\n    var def = QTYPES.find(function(q){ return q.id===qt; });\n    var label = def ? def.label : qt;\n    for(var i=0;i<arr.length;i++){\n      var key = lesson.id+\"_\"+qt+\"_\"+i;\n      if(_masteredQuestionKeys.has(key)) continue; // only list what's actually blocking mastery\n      var info = _questionScoreInfo[key];\n      var status;\n      if(!info || !info.attempted){\n        status = \"\u26aa Never attempted\";\n      } else if(info.everPeekedAt80Plus){\n        // He DID reach 80%+ at some point, but only while peeking -- the\n        // exact \"completed it but still not mastered\" case: peeking doesn't\n        // count as proof he knows it unaided, no matter the score.\n        status = \"\ud83d\udc41 Scored 80%+ before, but while peeking the model answer\"\n          + (info.bestUnaidedPct>=0 ? \" (best unaided score: \"+info.bestUnaidedPct+\"%)\" : \" \u2014 never scored 80%+ without peeking\")\n          + \" \u2014 redo it without peeking to count\";\n      } else {\n        status = \"\ud83d\udfe1 Best unaided score so far: \"+(info.bestUnaidedPct>=0?info.bestUnaidedPct:0)+\"% (needs 80%+)\";\n      }\n      questionRows += '<div style=\"font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--border)\">'+label+' #'+(i+1)+': '+status+'<\u002Fdiv>';\n    }\n  });\n  html += questionRows || '<div style=\"font-size:11.5px;color:var(--green);padding:4px 0\">\u2705 Every question has been mastered.<\u002Fdiv>';\n  return html;\n}\n\nfunction toggleMasteryDetail(lessonId){\n  var el = document.getElementById(\"masteryDetail_\"+lessonId);\n  var btn = document.getElementById(\"masteryDetailBtn_\"+lessonId);\n  if(!el) return;\n  var showing = el.style.display !== \"none\";\n  el.style.display = showing ? \"none\" : \"block\";\n  if(btn) btn.textContent = showing ? \"Why not mastered? \u25be\" : \"Hide details \u25b4\";\n}\n\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CLASS 10 SYLLABUS SKELETON \u2014 Tamil Nadu State Board (Samacheer Kalvi)\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n// Chapter list only: every lesson is created with an empty question set, to\n// be filled in through the normal admin editor. Ids are deterministic\n// (\"c10_<part>_<chapter>\") so seeding can be re-run safely \u2014 anything that\n// already exists is skipped rather than overwritten, which matters a great\n// deal once questions have been added to it.\nconst CLASS10_SYLLABUS = [\n  // \u2500\u2500 Science \u2500\u2500\n  [\"Science\",\"Physics\",\"phy\",1,\"Laws of Motion\"],\n  [\"Science\",\"Physics\",\"phy\",2,\"Optics\"],\n  [\"Science\",\"Physics\",\"phy\",3,\"Thermal Physics\"],\n  [\"Science\",\"Physics\",\"phy\",4,\"Electricity\"],\n  [\"Science\",\"Physics\",\"phy\",5,\"Acoustics\"],\n  [\"Science\",\"Physics\",\"phy\",6,\"Nuclear Physics\"],\n  [\"Science\",\"Chemistry\",\"che\",7,\"Atoms and Molecules\"],\n  [\"Science\",\"Chemistry\",\"che\",8,\"Periodic Classification of Elements\"],\n  [\"Science\",\"Chemistry\",\"che\",9,\"Solutions\"],\n  [\"Science\",\"Chemistry\",\"che\",10,\"Types of Chemical Reactio
