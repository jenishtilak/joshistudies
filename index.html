spellingGateKey = null;\n  _spellingGateResumeFn = null;\n  document.getElementById(\"spellingPanel\")?.classList.remove(\"visible\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  if(doneBtn) doneBtn.style.display = \"\";\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  if(skipBtn) skipBtn.style.display = \"none\";\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  if(viewAnswerBtn) viewAnswerBtn.style.display = \"none\";\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(answerBox) answerBox.style.display = \"none\";\n  skipQuestion(isLast);\n}\n\n\nfunction getAnswerSpellingWords(answerText, maxWords){\n  if(!answerText) return [];\n  const seen = new Set();\n  const words = [];\n  // Deliberately inclusive: any real word 3+ letters that isn't a basic\n  // function word (the, and, of, etc.) qualifies — not just long or\n  // capitalized ones. For a student whose spelling needs broad practice,\n  // narrowing this down to only \"hard-looking\" words would leave out plenty\n  // of perfectly ordinary words (like \"unit,\" \"law,\" \"acts\") that are still\n  // genuinely worth drilling. The round itself stays short regardless\n  // (capped at 6 words), so a longer candidate pool just means more variety\n  // across repeat visits, not a longer single round.\n  const tokens = String(answerText).split(/[^A-Za-z]+/).filter(Boolean);\n  tokens.forEach(tok=>{\n    if(tok.length<3) return; // skip single/double-letter words — too trivial to be worth spelling practice\n    const lower = tok.toLowerCase();\n    if(SPELL_STOPWORDS.has(lower)) return;\n    if(seen.has(lower)) return;\n    seen.add(lower);\n    words.push(tok);\n  });\n  return maxWords ? words.slice(0, maxWords) : words;\n}\n\n// Practice mode's post-check spelling button uses THIS instead of the generic\n// lesson-vocabulary extractor above — it only pulls words from what the\n// student actually got wrong in THIS attempt: words the diff marked\n// \"missing\" (never written) or \"misspelled\" (attempted but wrong), using the\n// correct spelling in both cases. \"wrong\"-type words are deliberately\n// excluded — those are extra content the student wrote that doesn't match\n// anything in the model answer, so they're not a real vocabulary target.\nfunction getWrongSpellingWords(diff){\n  if(!diff || !diff.length) return [];\n  const seen = new Set();\n  const words = [];\n  diff.forEach(d=>{\n    let candidate = null, forceInclude = false;\n    if(d.type===\"missing\"){ candidate = d.word; }\n    else if(d.type===\"misspelled\"){ candidate = d.correct; forceInclude = true; } // they clearly tried this word — always worth drilling regardless of length\n    if(!candidate) return;\n    const tok = String(candidate).trim();\n    if(!tok) return;\n    const isAcronym = tok.length>=2 && tok===tok.toUpperCase();\n    if(!forceInclude && !isAcronym && tok.length<6) return;\n    const lower = tok.toLowerCase();\n    if(!forceInclude && !isAcronym && SPELL_STOPWORDS.has(lower)) return;\n    if(seen.has(lower)) return;\n    seen.add(lower);\n    words.push(tok);\n  });\n  return words;\n}\n\n// Pool of {words, label} built fresh each time renderRevise runs — buttons\n// reference it by index instead of inlining data into onclick attributes.\nlet _reviseSpellPool = [];\n\nfunction buildReviseSpellButton(words, lesson, qt, qIndex){\n  if(!words || !words.length) return \"\";\n  const label = `${qt.label} · Q${qIndex+1}`;\n  _reviseSpellPool.push({ words, label, lessonTitle: lesson.title });\n  const idx = _reviseSpellPool.length-1;\n  return `<button class=\"revise-spelling-cta\" style=\"margin-top:12px\" onclick=\"openQuestionSpellingGame(${idx})\">\n    <div>\n      <div class=\"rsc-title\">🔤 Practice Spellings for this Answer<\u002Fdiv>\n      <div class=\"rsc-sub\">${words.length} key word${words.length!==1?\"s\":\"\"} from this answer<\u002Fdiv>\n    <\u002Fdiv>\n    <span class=\"rsc-arrow\">→<\u002Fspan>\n  <\u002Fbutton>`;\n}\n\nfunction openQuestionSpellingGame(poolIndex){\n  const entry = _reviseSpellPool[poolIndex];\n  if(!entry || !entry.words.length) return;\n  _spellingWords = entry.words.map(w=>({ word:w, lessonTitle: `${entry.lessonTitle} — ${entry.label}` }));\n  _spellingSubject = entry.label;\n  _spellingAllBySubject = { [entry.label]: _spellingWords };\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(10, _spellingWords.length);\n\n  const panel = document.getElementById(\"spellingPanel\");\n  const titleEl = panel?.querySelector(\".report-title\");\n  if(titleEl) titleEl.textContent = `🔤 Spelling — ${entry.label}`;\n  panel?.classList.add(\"visible\");\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n}\n\n// ═══════════════════════════════════════════════════════\n//  REVISE MODE — READ & MEMORISE\n// ═══════════════════════════════════════════════════════\n// Unlike a blind recall test, the model answer stays fully visible the\n// whole time — the student reads it aloud (or types it out) to help it\n// stick through repetition, the same way reading something aloud a few\n// times helps memorise it. No peek/hide mechanic needed since nothing is\n// ever hidden. Scoring rewards PACE, mirroring Practice mode's own speed\n// bonus: read it accurately (70%+ match to the model answer) and quickly\n// relative to its length, and it earns a small Growth Points bonus —\n// faster = more points, exactly like Practice mode's timer. Logged under\n// \"recite_fast_\"/\"recite_good_\" qtype prefixes (legacy \"recite_\" is still\n// recognised for entries earned under the old one-time bonus system) so\n// it never touches Practice mode's own mastery tracking for the question.\nlet _reviseRecitePool = [];\nconst _reciteAttemptCounts = {}; // poolIndex -> count, in-memory only, resets on reload — purely a friendly nudge, never persisted\nconst READ_WPM = 100; // slower, more forgiving pace for reading aloud (not silent reading) — technical vocabulary takes longer to say than to skim\nconst READ_START_BUFFER_MS = 6000; // extra flat time for opening the mic, taking a breath, and actually starting to speak, before the clock effectively starts costing points\n\n// Pre-registers a question for reading aloud and returns its pool index\n// (or -1 if there's nothing to read).\nfunction registerRecite(q, qt, qIndexInType){\n  const isDist = qt.id===\"distinguish\";\n  if(isDist && !((q.answerA||\"\").trim() || (q.answerB||\"\").trim())) return -1;\n  if(!isDist && !(q.answer||\"\").trim()) return -1;\n  _reviseRecitePool.push({\n    qtype:qt.id, qIndexInType, answer:q.answer||\"\", answerA:q.answerA||\"\", answerB:q.answerB||\"\",\n    termA:q.termA||\"Term A\", termB:q.termB||\"Term B\"\n  });\n  return _reviseRecitePool.length-1;\n}\n\nfunction buildReviseReciteButton(idx, q){\n  if(idx<0) return \"\";\n  const entry = _reviseRecitePool[idx];\n  const isDist = entry.qtype===\"distinguish\";\n  const panelInner = isDist ? `\n      <div class=\"dist-input-grid\">\n        <div>\n          <div class=\"dist-input-label\">${entry.termA}<\u002Fdiv>\n          <div class=\"voice-input-row\">\n            <button type=\"button\" class=\"btn-mic\" id=\"reciteMicA-${idx}\" onclick=\"toggleVoiceInput('reciteInputA-${idx}', this)\">🎤 Speak<\u002Fbutton>\n            <button type=\"button\" class=\"btn-recite-clear\" onclick=\"clearReciteInput('reciteInputA-${idx}')\">🗑 Clear<\u002Fbutton>\n          <\u002Fdiv>\n          <textarea class=\"answer-textarea\" id=\"reciteInputA-${idx}\" style=\"min-height:70px\" placeholder=\"Read ${entry.termA} aloud, or type it…\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div class=\"dist-input-label\">${entry.termB}<\u002Fdiv>\n          <div class=\"voice-input-row\">\n            <button type=\"button\" class=\"btn-mic\" id=\"reciteMicB-${idx}\" onclick=\"toggleVoiceInput('reciteInputB-${idx}', this)\">🎤 Speak<\u002Fbutton>\n            <button type=\"button\" class=\"btn-recite-clear\" onclick=\"clearReciteInput('reciteInputB-${idx}')\">🗑 Clear<\u002Fbutton>\n          <\u002Fdiv>\n          <textarea class=\"answer-textarea\" id=\"reciteInputB-${idx}\" style=\"min-height:70px\" placeholder=\"Read ${entry.termB} aloud, or type it…\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>`\n    : `\n      <div class=\"voice-input-row\">\n        <button type=\"button\" class=\"btn-mic\" id=\"reciteMic-${idx}\" onclick=\"toggleVoiceInput('reciteInput-${idx}', this)\">🎤 Speak<\u002Fbutton>\n        <button type=\"button\" class=\"btn-recite-clear\" onclick=\"clearReciteInput('reciteInput-${idx}')\">🗑 Clear<\u002Fbutton>\n      <\u002Fdiv>\n      <textarea class=\"answer-textarea\" id=\"reciteInput-${idx}\" style=\"min-height:90px\" placeholder=\"Read the answer above aloud, or type it…\"><\u002Ftextarea>`;\n  return `<button class=\"revise-spelling-cta\" style=\"margin-top:12px\" onclick=\"toggleRecitePanel(${idx})\">\n      <div>\n        <div class=\"rsc-title\">📖 Read &amp; Memorise<\u002Fdiv>\n        <div class=\"rsc-sub\">Read it aloud — the faster and more accurate, the more points<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"rsc-arrow\">→<\u002Fspan>\n    <\u002Fbutton>\n    <div class=\"recite-panel\" id=\"recitePanel-${idx}\" style=\"display:none\">\n      <div style=\"display:flex;justify-content:flex-end;margin-bottom:6px\">\n        <button type=\"button\" onclick=\"closeRecitePanel(${idx})\" style=\"background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;padding:4px 8px\">✕ Close &amp; back to revising<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"reciteTimerWrap-${idx}\" style=\"margin:0 0 10px;padding:8px 10px;background:var(--parchment);border-radius:8px\">\n        <div style=\"font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center\" id=\"reciteChallenge-${idx}\">📖 Read it — the faster and clearer, the more points<\u002Fdiv>\n        <div style=\"background:#e0e0e0;border-radius:3px;overflow:hidden;height:5px;margin-bottom:5px\">\n          <div id=\"reciteTimerBar-${idx}\" style=\"height:100%;width:100%;background:#4a9873;border-radius:3px;transition:width .5s linear,background .5s\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"font-size:10px;color:var(--muted)\">Reading Speed Bonus<\u002Fspan>\n          <span id=\"reciteTimerPts-${idx}\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#4a9873;color:#fff;transition:background .5s\">⚡ calculating…<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${panelInner}\n      <button class=\"btn-check\" id=\"reciteCheckBtn-${idx}\" style=\"margin-top:10px;padding:9px 18px;font-size:13px\" onclick=\"checkRecite(${idx})\">Check<\u002Fbutton>\n      <div id=\"reciteResult-${idx}\" style=\"margin-top:10px\"><\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n// Instantly wipes one textarea's content mid-attempt — for when the mic\n// mis-transcribed something and the student wants a clean slate without\n// waiting to press Check first (that's what Try Again is for, after the\n// fact; this is for clearing DURING an attempt, before checking at all).\nfunction clearReciteInput(targetId){\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  const ta = document.getElementById(targetId);\n  if(ta){ ta.value = \"\"; ta.focus(); }\n}\n\n// Enables/disables the Check button, mic buttons, and textarea(s) together —\n// used to lock everything once a result is showing, and unlock on Try Again.\nfunction setReciteInputsEnabled(idx, entry, enabled){\n  const checkBtn = document.getElementById(`reciteCheckBtn-${idx}`);\n  if(checkBtn) checkBtn.disabled = !enabled;\n  if(entry.qtype===\"distinguish\"){\n    const taA=document.getElementById(`reciteInputA-${idx}`); if(taA) taA.disabled=!enabled;\n    const taB=document.getElementById(`reciteInputB-${idx}`); if(taB) taB.disabled=!enabled;\n    const mA=document.getElementById(`reciteMicA-${idx}`); if(mA) mA.disabled=!enabled;\n    const mB=document.getElementById(`reciteMicB-${idx}`); if(mB) mB.disabled=!enabled;\n  } else {\n    const ta=document.getElementById(`reciteInput-${idx}`); if(ta) ta.disabled=!enabled;\n    const m=document.getElementById(`reciteMic-${idx}`); if(m) m.disabled=!enabled;\n  }\n}\n\n// Timestamp per pool index of when the current reading attempt started —\n// reset every time the panel opens or Try Again is pressed, so the timer\n// always measures THIS attempt, not time spent sitting on the page.\nconst _reciteStartTs = {};\nlet _reciteTimerInterval = null; // one shared interval — only one panel is realistically open at a time\n\nfunction getReciteReferenceText(entry){\n  return entry.qtype===\"distinguish\" ? (entry.answerA+\" \"+entry.answerB) : entry.answer;\n}\n\nfunction resetReciteTimerBar(idx){\n  const bar = document.getElementById(`reciteTimerBar-${idx}`);\n  const pts = document.getElementById(`reciteTimerPts-${idx}`);\n  if(bar){ bar.style.width=\"100%\"; bar.style.background=\"#4a9873\"; }\n  if(pts){ pts.style.background=\"#4a9873\"; pts.textContent=\"⚡ calculating…\"; }\n}\n\n// Same live countdown-bonus bar Practice mode's writing questions already\n// use — a shrinking bar and a running \"+N pts if done in Xs\" message — just\n// scoped to this recite panel's own fast/good thresholds (scaled to how\n// long THIS answer should take to read aloud).\nfunction startReciteTimer(idx){\n  stopReciteTimer();\n  const entry = _reviseRecitePool[idx];\n  if(!entry) return;\n  const expected = expectedReadMs(getReciteReferenceText(entry));\n  const fastMs = expected, goodMs = expected*1.6;\n  const fastPts = READ_SPEED_MARKS.fast, goodPts = READ_SPEED_MARKS.good;\n  const startMs = _reciteStartTs[idx] || Date.now();\n\n  function fmtCountdown(ms){\n    if(ms<=0) return \"0s\";\n    const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);\n    return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}s`;\n  }\n\n  function tick(){\n    const elapsed = Date.now() - startMs;\n    const bar = document.getElementById(`reciteTimerBar-${idx}`);\n    const pts = document.getElementById(`reciteTimerPts-${idx}`);\n    if(!bar){ stopReciteTimer(); return; }\n\n    if(elapsed <= fastMs){\n      const rem = fastMs - elapsed;\n      bar.style.width = Math.max(0,(rem/fastMs)*100)+\"%\";\n      bar.style.background = \"#4a9873\";\n      if(pts){ pts.style.background=\"#4a9873\"; pts.textContent=\"⚡ +\"+fastPts+\" pts if done in \"+fmtCountdown(rem); }\n    } else if(elapsed <= goodMs){\n      const rem = goodMs - elapsed;\n      bar.style.width = Math.max(0,(rem/(goodMs-fastMs))*100)+\"%\";\n      bar.style.background = \"#cf8f2e\";\n      if(pts){ pts.style.background=\"#cf8f2e\"; pts.textContent=\"🕐 +\"+goodPts+\" pts if done in \"+fmtCountdown(rem); }\n    } else {\n      bar.style.width = \"0%\";\n      bar.style.background = \"#ccc\";\n      if(pts){ pts.style.background=\"#aaa\"; pts.textContent=\"No speed bonus now — still worth finishing!\"; }\n    }\n  }\n\n  tick();\n  _reciteTimerInterval = setInterval(tick, 500);\n}\nfunction stopReciteTimer(){\n  if(_reciteTimerInterval){ clearInterval(_reciteTimerInterval); _reciteTimerInterval=null; }\n}\n\nfunction toggleRecitePanel(idx){\n  const panel = document.getElementById(`recitePanel-${idx}`);\n  if(!panel) return;\n  const opening = panel.style.display===\"none\" || !panel.style.display;\n  if(opening) openRecitePanel(idx); else closeRecitePanel(idx);\n}\n\nfunction openRecitePanel(idx){\n  const panel = document.getElementById(`recitePanel-${idx}`);\n  const entry = _reviseRecitePool[idx];\n  if(!panel || !entry) return;\n  panel.style.display = \"block\";\n  setReciteInputsEnabled(idx, entry, true); // fresh open — always start unlocked, in case it was left locked from a check last time\n  const resultEl = document.getElementById(`reciteResult-${idx}`);\n  if(resultEl) resultEl.innerHTML = \"\";\n  _reciteStartTs[idx] = Date.now();\n  resetReciteTimerBar(idx);\n  startReciteTimer(idx);\n}\n\n// The one, unambiguous way back to normal Revise view — always stops any\n// mic still listening, always collapses the panel.\nfunction closeRecitePanel(idx){\n  const panel = document.getElementById(`recitePanel-${idx}`);\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  stopReciteTimer();\n  if(panel) panel.style.display = \"none\";\n}\n\n// Clears the attempt and restarts the timer for a fresh, fairly-timed re-read.\nfunction tryAgainRecite(idx){\n  const entry = _reviseRecitePool[idx];\n  if(!entry) return;\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  if(entry.qtype===\"distinguish\"){\n    const taA=document.getElementById(`reciteInputA-${idx}`); if(taA) taA.value=\"\";\n    const taB=document.getElementById(`reciteInputB-${idx}`); if(taB) taB.value=\"\";\n  } else {\n    const ta=document.getElementById(`reciteInput-${idx}`); if(ta) ta.value=\"\";\n  }\n  const resultEl = document.getElementById(`reciteResult-${idx}`);\n  if(resultEl) resultEl.innerHTML = \"\";\n  setReciteInputsEnabled(idx, entry, true); // unlock for the next attempt\n  _reciteStartTs[idx] = Date.now(); // restart the clock — a fresh attempt deserves a fresh timer\n  resetReciteTimerBar(idx);\n  startReciteTimer(idx);\n}\n\n// Expected reading time for a given answer, scaled to its word count at a\n// comfortable reading-aloud pace — a one-sentence answer and a five-point\n// list shouldn't be held to the same fixed time limit.\nfunction expectedReadMs(text){\n  const words = (text||\"\").trim().split(/\\s+/).filter(Boolean).length || 1;\n  return (words / READ_WPM) * 60000 + READ_START_BUFFER_MS;\n}\n\nfunction checkRecite(idx){\n  const entry = _reviseRecitePool[idx];\n  if(!entry) return;\n  const resultEl = document.getElementById(`reciteResult-${idx}`);\n  if(!resultEl) return;\n\n  // Stop any mic still listening/transcribing before reading the textareas —\n  // otherwise recognition keeps running in the background after Check.\n  if(typeof stopVoiceInput===\"function\") stopVoiceInput();\n  stopReciteTimer(); // freeze the display at the final time instead of leaving it ticking behind a locked panel\n\n  const elapsed = Date.now() - (_reciteStartTs[idx] || Date.now());\n  _reciteAttemptCounts[idx] = (_reciteAttemptCounts[idx]||0) + 1;\n  const tries = _reciteAttemptCounts[idx];\n\n  let pct, diffHTML, referenceText;\n  if(entry.qtype===\"distinguish\"){\n    const textA = document.getElementById(`reciteInputA-${idx}`)?.value.trim() || \"\";\n    const textB = document.getElementById(`reciteInputB-${idx}`)?.value.trim() || \"\";\n    const { pct:pctA } = scoreAnswer(textA, entry.answerA);\n    const { pct:pctB } = scoreAnswer(textB, entry.answerB);\n    pct = Math.round((pctA+pctB)/2);\n    referenceText = entry.answerA + \" \" + entry.answerB;\n    diffHTML = `\n      <div class=\"result-section-title\" style=\"margin-bottom:4px\">${entry.termA}<\u002Fdiv>\n      ${buildAnnotatedDiff(textA, entry.answerA)}\n      <div class=\"result-section-title\" style=\"margin:10px 0 4px\">${entry.termB}<\u002Fdiv>\n      ${buildAnnotatedDiff(textB, entry.answerB)}`;\n  } else {\n    const text = document.getElementById(`reciteInput-${idx}`)?.value.trim() || \"\";\n    const { pct:p } = scoreAnswer(text, entry.answer);\n    pct = p;\n    referenceText = entry.answer;\n    diffHTML = buildAnnotatedDiff(text, entry.answer);\n  }\n\n  setReciteInputsEnabled(idx, entry, false); // lock until Try Again — same reasoning as Practice mode's post-check lock\n\n  const READ_ACCURACY_MIN = 70; // needs to genuinely match the answer, not just finish fast, to earn any speed points\n  let speedNote = \"\";\n  if(pct >= READ_ACCURACY_MIN){\n    const expected = expectedReadMs(referenceText);\n    const tier = elapsed <= expected ? \"fast\" : elapsed <= expected*1.6 ? \"good\" : null;\n    if(tier) speedNote = awardReadSpeedBonus(entry, tier);\n  }\n\n  const cls = pct>=80 ? \"great\" : pct>=50 ? \"ok\" : \"low\";\n  const chipLabel = pct>=READ_ACCURACY_MIN ? \"📖 Well read!\" : \"Read it again more clearly\";\n  resultEl.innerHTML = `\n    <div class=\"recite-result-chip ${cls}\">${chipLabel} — ${pct}% match<\u002Fdiv>\n    ${diffHTML}\n    ${speedNote}\n    <div class=\"recite-tries\">Read ${tries} time${tries!==1?\"s\":\"\"} this session — go again anytime.<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:10px\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainRecite(${idx})\">🔁 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"closeRecitePanel(${idx})\">✓ Done, back to revising<\u002Fbutton>\n    <\u002Fdiv>`;\n\n  if(pct>=80) showReciteCelebration();\n}\n\n// Awards a small Growth Points bonus scaled to reading pace — \"fast\" pays\n// more than \"good,\" mirroring Practice mode's own speed-bonus tiers. Unlike\n// the old one-time recall bonus, this can be earned again each time it's\n// read quickly and accurately — genuinely re-reading something fast and\n// correctly is real practice, not a loophole.\nconst READ_SPEED_MARKS = { fast: 3, good: 1 };\nfunction awardReadSpeedBonus(entry, tier){\n  if(!currentLesson) return \"\";\n  const reciteQtype = `recite_${tier}_${entry.qtype}`;\n  fbLogEntry(\"logs\", {\n    subject: currentSubject||\"\", part: currentPart||\"\", lessonId: currentLesson.id,\n    lessonTitle: currentLesson.title||\"\", qtype: reciteQtype, qIndex: entry.qIndexInType,\n    pct: 100, timeMs: 0\n  });\n  const points = READ_SPEED_MARKS[tier];\n  bumpGrowthPointsBadge(points);\n  const label = tier===\"fast\" ? \"⚡ Fast, accurate read!\" : \"🕐 Good pace!\";\n  showPointsToast(points, label);\n  return `<div class=\"recite-result-chip ${tier===\"fast\"?\"great\":\"ok\"}\" style=\"margin-top:6px\">${label} +${points}<\u002Fdiv>`;\n}\n\n// Purely visual, no points involved — a quick, warm confirmation moment\n// distinct from showPointsToast so it's never mistaken for Growth Points.\nfunction showReciteCelebration(){\n  let stack = document.getElementById(\"pointsToastStack\");\n  if(!stack){\n    stack = document.createElement(\"div\");\n    stack.id = \"pointsToastStack\";\n    stack.style.cssText = \"position:fixed;top:14px;right:14px;z-index:99997;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none\";\n    document.body.appendChild(stack);\n  }\n  const toast = document.createElement(\"div\");\n  toast.style.cssText = \"background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;white-space:nowrap\";\n  toast.textContent = \"🎯 Nailed that read!\";\n  stack.appendChild(toast);\n  requestAnimationFrame(()=>{\n    toast.style.opacity = \"1\";\n    toast.style.transform = \"translateY(0) scale(1)\";\n  });\n  setTimeout(()=>{\n    toast.style.opacity = \"0\";\n    toast.style.transform = \"translateY(-8px) scale(.9)\";\n    setTimeout(()=>toast.remove(), 250);\n  }, 1800);\n}\n\nfunction renderSpellingRoundIntro(root){\n  const icon = DATA[_spellingSubject]?.icon || \"🔤\";\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:20px 16px\">\n      <div style=\"font-size:36px;margin-bottom:10px\">${icon}<\u002Fdiv>\n      <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:2px\">${_spellingSubject||\"Spelling Practice\"}<\u002Fh3>\n      <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">\n        ${_spellingWords.length} word${_spellingWords.length!==1?\"s\":\"\"} from your real mistakes in this subject.\n        This round: ${_spellingRoundSize} word${_spellingRoundSize!==1?\"s\":\"\"}, starting with the ones you've missed most. <b>+1 point<\u002Fb> per correct spelling.\n      <\u002Fp>\n      <button onclick=\"startSpellingRound()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Start ▶<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\nfunction startSpellingRound(){\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  renderSpellingQuestion();\n}\n\nfunction renderSpellingQuestion(){\n  const root = document.getElementById(\"spellingGameRoot\");\n  if(!root) return;\n\n  if(_spellingIdx >= _spellingRoundSize){\n    renderSpellingRoundResult(root);\n    return;\n  }\n\n  const item = _spellingWords[_spellingIdx];\n  const word = item.word;\n\n  // Show the word briefly (study phase), then blank it out for recall —\n  // simple, fair, and avoids the discomfort of any harsh \"wrong\" flash.\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:10px 16px\">\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:4px\">Word ${_spellingIdx+1} of ${_spellingRoundSize}<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:16px\">${item.lessonTitle||\"\"}<\u002Fdiv>\n      <div id=\"spellWordShow\" style=\"font-size:28px;font-weight:800;letter-spacing:2px;color:var(--navy);margin-bottom:20px;font-family:Georgia,serif\">${word}<\u002Fdiv>\n      <p style=\"font-size:13px;color:var(--muted)\">Memorise the spelling — the input box appears in a moment…<\u002Fp>\n    <\u002Fdiv>`;\n\n  setTimeout(()=>{\n    const show = document.getElementById(\"spellWordShow\");\n    if(!show) return; // user may have navigated away\n    root.innerHTML = `\n      <div style=\"text-align:center;padding:10px 16px\">\n        <div style=\"font-size:12px;color:var(--muted);margin-bottom:4px\">Word ${_spellingIdx+1} of ${_spellingRoundSize}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--muted);margin-bottom:16px\">${item.lessonTitle||\"\"}<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--navy);margin-bottom:10px\">Now type it from memory:<\u002Fdiv>\n        <input id=\"spellInput\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\"\n          style=\"width:100%;max-width:280px;padding:12px;font-size:18px;text-align:center;border:2px solid var(--border);border-radius:10px;margin-bottom:14px\"\n          onkeydown=\"if(event.key==='Enter') checkSpellingAnswer()\">\n        <div id=\"spellFeedback\" style=\"min-height:24px;font-size:14px;font-weight:700;margin-bottom:10px\"><\u002Fdiv>\n        <button onclick=\"checkSpellingAnswer()\" style=\"padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer\">Check<\u002Fbutton>\n      <\u002Fdiv>`;\n    document.getElementById(\"spellInput\")?.focus();\n  }, 1800);\n}\n\nfunction checkSpellingAnswer(){\n  const input = document.getElementById(\"spellInput\");\n  const feedback = document.getElementById(\"spellFeedback\");\n  if(!input || input.disabled) return; // prevent double-submit\n  const item = _spellingWords[_spellingIdx];\n  const typed = input.value.trim();\n  const isCorrect = typed.toLowerCase() === item.word.toLowerCase();\n\n  input.disabled = true;\n  if(isCorrect){\n    _spellingScore++;\n    feedback.style.color = \"var(--green)\";\n    feedback.textContent = \"✓ Correct! +1 point\";\n    // Log as its own scored entry so it counts toward Growth Points —\n    // 1 mark, 100%, tagged with the subject the word came from.\n    fbLogEntry(\"logs\", {\n      qtype: \"spelling\", pct: 100, timeMs: 0,\n      subject: _spellingSubject || \"\", lessonId: \"spelling\", qIndex: _spellingIdx,\n      lessonTitle: item.lessonTitle || \"Spelling Practice\"\n    });\n  } else {\n    feedback.style.color = \"var(--red)\";\n    feedback.innerHTML = `Not quite — it's <b>${item.word}<\u002Fb>`;\n  }\n\n  setTimeout(()=>{\n    // If the panel was closed/navigated away during the delay, don't keep advancing.\n    if(!document.getElementById(\"spellingGameRoot\")) return;\n    _spellingIdx++;\n    renderSpellingQuestion();\n  }, 1400);\n}\n\nfunction renderSpellingRoundResult(root){\n  const pct = Math.round((_spellingScore / _spellingRoundSize) * 100);\n  if(_spellingIsGate){\n    root.innerHTML = `\n      <div style=\"text-align:center;padding:20px 16px\">\n        <div style=\"font-size:40px;margin-bottom:10px\">${pct>=80?\"🏆\":pct>=50?\"👍\":\"💪\"}<\u002Fdiv>\n        <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:6px\">${_spellingScore} / ${_spellingRoundSize} correct<\u002Fh3>\n        <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">Nice warm-up — now let's answer the actual question.<\u002Fp>\n        <button onclick=\"finishSpellingGate()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Continue to Question →<\u002Fbutton>\n      <\u002Fdiv>`;\n    return;\n  }\n  const remaining = _spellingWords.length - _spellingRoundSize;\n  root.innerHTML = `\n    <div style=\"text-align:center;padding:20px 16px\">\n      <div style=\"font-size:40px;margin-bottom:10px\">${pct>=80?\"🏆\":pct>=50?\"👍\":\"💪\"}<\u002Fdiv>\n      <h3 style=\"font-family:Georgia,serif;color:var(--navy);margin-bottom:6px\">${_spellingScore} / ${_spellingRoundSize} correct<\u002Fh3>\n      <p style=\"color:var(--gold,#9c7519);font-size:13px;font-weight:700;margin-bottom:8px\">+${_spellingScore} point${_spellingScore!==1?\"s\":\"\"} earned<\u002Fp>\n      <p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">\n        ${remaining>0 ? `${remaining} more word${remaining!==1?\"s\":\"\"} in ${_spellingSubject} still to practise.` : `You've covered every word in ${_spellingSubject}!`}\n      <\u002Fp>\n      <button onclick=\"restartCurrentSpellingRound()\" style=\"padding:12px 28px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-right:8px\">Play Again<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\n// Restarts a fresh round using whichever word set is already loaded (the\n// current lesson/question's spelling words) — replaces the old multi-subject\n// \"startSpellingSubject\" now that the standalone cross-subject game is retired.\nfunction restartCurrentSpellingRound(){\n  if(!_spellingWords || !_spellingWords.length) return;\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(10, _spellingWords.length);\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n}\n\n// Pull both collections once and assemble a downloadable HTML report (admin only)\nasync function downloadAdminMirror(){\n  if(!window._fb || !currentUserPhone) return;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n\n  const [logsSnap, examSnap, spellSnap, hintSnap] = await Promise.all([\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"logs\"), orderBy(\"ts\",\"desc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"examAnswers\"), orderBy(\"ts\",\"desc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"spellErrors\"), orderBy(\"ts\",\"desc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"hintConcepts\"), orderBy(\"ts\",\"desc\")))\n  ]);\n\n  // Build scoreboard summary for the download too\n  const bySession = {}; const allUnique = new Set();\n  let grandAttempts = 0, grandTimeMs = 0;\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = [];\n    bySession[sid].push(e);\n    allUnique.add(`${e.lessonId}|${e.qtype}|${e.qIndex}`);\n    grandAttempts++; grandTimeMs += e.timeMs||0;\n  });\n\n  let html = `<html><head><meta charset=\"utf-8\"><title>Study Buddy Mirror Report<\u002Ftitle>\n    <style>body{font-family:Georgia,serif;padding:24px;color:#222}h2{color:#202a3d}\n    table{width:100%;border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;text-align:left}\n    .ok{color:#2a9d5c;font-weight:700}.bad{color:#c0392b;font-weight:700}\n    .wrong-word{text-decoration:line-through;color:#c0392b}.right-word{color:#2a9d5c;font-weight:700}<\u002Fstyle>\n    <\u002Fhead><body>\n    <h1>📊 Study Buddy — Admin Mirror Report<\u002Fh1>\n    <p>Student: ${STUDENT_NAME} (${STUDENT_PHONE}) · Generated: ${new Date().toLocaleString()}<\u002Fp>\n\n    <h2>🏆 Scoreboard<\u002Fh2>\n    <p><b>${allUnique.size}<\u002Fb> unique questions learnt across <b>${Object.keys(bySession).length}<\u002Fb> session(s) ·\n       <b>${grandAttempts}<\u002Fb> total attempts · <b>${fmtMs(grandTimeMs)}<\u002Fb> total time spent<\u002Fp>\n\n    <h2>Session Logs (${logsSnap.size})<\u002Fh2>\n    <table><tr><th>Lesson<\u002Fth><th>Type<\u002Fth><th>Score<\u002Fth><th>Time taken<\u002Fth><th>When<\u002Fth><\u002Ftr>`;\n  logsSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td>${e.lessonTitle||\"—\"}<\u002Ftd><td>${e.qtype||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><td>${e.timeMs?fmtMs(e.timeMs):\"\"}<\u002Ftd><td>${e.ts?.toDate?e.ts.toDate().toLocaleString():\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><h2>Practice Test Answers (${examSnap.size})<\u002Fh2>\n    <table><tr><th>Question<\u002Fth><th>Student's Answer<\u002Fth><th>Correct Answer<\u002Fth><th>Score<\u002Fth><\u002Ftr>`;\n  examSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td>${e.q||\"\"}<\u002Ftd><td>${e.userText||\"\"}<\u002Ftd><td>${e.modelText||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable>\n    <h2>✏️ Spelling to Learn (${spellSnap.size})<\u002Fh2>\n    <table><tr><th>You wrote<\u002Fth><th>Correct spelling<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>`;\n  spellSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td class=\"wrong-word\">${e.wrong||\"\"}<\u002Ftd><td class=\"right-word\">${e.correct||\"\"}<\u002Ftd><td>${e.lessonTitle||\"—\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable>\n    <h2>🤔 Concepts ${STUDENT_NAME} Needed Help With (${hintSnap.size})<\u002Fh2>\n    <table><tr><th>Question<\u002Fth><th>Type<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>`;\n  hintSnap.forEach(d=>{\n    const e = d.data();\n    html += `<tr><td>${e.questionText||\"\"}<\u002Ftd><td>${e.qtype||\"\"}<\u002Ftd><td>${e.lessonTitle||\"—\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_AdminMirror_${Date.now()}.html`;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n\nfunction togglePasscodeVisibility(){\n  const inp = document.getElementById(\"passcodeInput\");\n  const btn = document.getElementById(\"wlToggle\");\n  if(inp.type === \"password\"){\n    inp.type = \"text\";\n    btn.textContent = \"🙈\";\n  } else {\n    inp.type = \"password\";\n    btn.textContent = \"👁\";\n  }\n}\n\ninit();\n\n// ═══════════════════════════════════════════════════════\n//  LESSON MASTERY — complete flag + bonus\n// ═══════════════════════════════════════════════════════\n\nasync function loadCompleteLessons(){\n  if(!window._fb || !currentUserPhone){ console.log(\"loadCompleteLessons: no fb or phone\"); return; }\n  const { db, doc, getDoc } = window._fb;\n  try{\n    const ref = doc(db,\"sessions\",currentUserPhone,\"settings\",\"completeLessons\");\n    console.log(\"loadCompleteLessons: fetching from\", ref.path);\n    const snap = await getDoc(ref);\n    console.log(\"loadCompleteLessons: exists=\", snap.exists(), \"data=\", snap.exists()?snap.data():null);\n    if(snap.exists()) _completeLessons = snap.data() || {};\n    // Re-render lesson cards now that we know which are complete\n    if(typeof renderLessons === \"function\") renderLessons();\n  }catch(e){ console.error(\"loadCompleteLessons error:\", e); }\n}\n\nasync function toggleLessonComplete(lessonId){\n  _completeLessons[lessonId] = !_completeLessons[lessonId];\n  if(!_completeLessons[lessonId]) delete _completeLessons[lessonId];\n  console.log(\"toggleLessonComplete:\", lessonId, \"now:\", JSON.stringify(_completeLessons));\n  // Save to Firebase\n  if(window._fb && currentUserPhone){\n    const { db, doc, setDoc } = window._fb;\n    try{\n      var ref = doc(db,\"sessions\",currentUserPhone,\"settings\",\"completeLessons\");\n      console.log(\"saving to:\", ref.path, \"data:\", JSON.stringify(_completeLessons));\n      await setDoc(ref, _completeLessons);\n      console.log(\"saved OK\");\n    }catch(e){ console.error(\"toggleLessonComplete save error:\", e); }\n  }\n  checkLessonMasteryBonus(lessonId); // fire-and-forget — in case every question was already mastered before this toggle\n  renderAdminLessons();\n}\n\nfunction renderAdminLessons(){\n  var box = document.getElementById(\"adminLessonsList\");\n  if(!box) return;\n  var html = \"\";\n  Object.entries(DATA).forEach(function(subjEntry){\n    var subjName = subjEntry[0], subjData = subjEntry[1];\n    var icon = subjData.icon || \"📚\";\n    html += '<div style=\"margin-bottom:20px\">';\n    html += '<div style=\"font-size:14px;font-weight:700;color:var(--navy);margin-bottom:8px\">'+icon+' '+subjName+'<\u002Fdiv>';\n    Object.entries(subjData.parts).forEach(function(partEntry){\n      var partName = partEntry[0], partData = partEntry[1];\n      partData.lessons.forEach(function(lesson){\n        var totalQ = Object.values(lesson.questions).reduce(function(a,arr){return a+arr.length;},0);\n        // Count mastered + tried by student\n        var masteredQ = 0, triedQ = 0;\n        Object.entries(lesson.questions).forEach(function(pair){\n          var qt = pair[0], arr = pair[1];\n          for(var k=0;k<arr.length;k++){\n            var key = lesson.id+\"_\"+qt+\"_\"+k;\n            if(_masteredQuestionKeys.has(key)) masteredQ++;\n            if(_answeredQuestionKeys.has(key)) triedQ++;\n          }\n        });\n        var isComplete = !!_completeLessons[lesson.id];\n        var allMastered = isComplete && totalQ>0 && masteredQ>=totalQ;\n        var bgColor = allMastered ? \"rgba(74,152,115,.2)\" : isComplete ? \"rgba(74,152,115,.1)\" : \"#fff\";\n        var borderColor = allMastered ? \"var(--green)\" : isComplete ? \"var(--green)\" : \"var(--border)\";\n        var masteryPct = totalQ>0 ? Math.round(masteredQ/totalQ*100) : 0;\n        var barColor = masteryPct>=100 ? \"var(--green)\" : masteryPct>0 ? \"var(--gold)\" : \"var(--border)\";\n        html += '<div style=\"padding:12px;margin-bottom:6px;background:'+bgColor+';border:1.5px solid '+borderColor+';border-radius:10px\">';\n        html += '<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">';\n        html += '<div>';\n        html += '<div style=\"font-size:13px;font-weight:700;color:var(--navy)\">'+lesson.title+(allMastered?' 🏆':'')+'<\u002Fdiv>';\n        html += '<div style=\"font-size:11px;color:var(--muted)\">'+lesson.unit+' · '+totalQ+' questions · '+partName+'<\u002Fdiv>';\n        html += '<\u002Fdiv>';\n        html += '<button onclick=\"toggleLessonComplete(&quot;'+lesson.id+'&quot;)\" style=\"padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;border:1.5px solid '+(isComplete?'var(--green)':'var(--border)')+';background:'+(isComplete?'var(--green)':'#fff')+';color:'+(isComplete?'#fff':'var(--navy)')+'\">'+(isComplete?'✅ Complete':'Mark Complete')+'<\u002Fbutton>';\n        html += '<\u002Fdiv>'; // close flex row\n        // Mastery progress bar\n        html += '<div style=\"display:flex;align-items:center;gap:8px;margin-top:6px\">';\n        html += '<div style=\"flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden\">';\n        html += '<div style=\"height:100%;width:'+masteryPct+'%;background:'+barColor+';border-radius:3px\"><\u002Fdiv>';\n        html += '<\u002Fdiv>';\n        html += '<div style=\"font-size:10px;font-weight:700;color:'+(allMastered?'var(--green)':masteredQ>0?'var(--gold)':'var(--muted)')+'\">'+masteredQ+'/'+totalQ+' mastered<\u002Fdiv>';\n        html += '<\u002Fdiv>';\n        // Tried vs mastered detail\n        html += '<div style=\"font-size:10px;color:var(--muted);margin-top:4px\">📝 '+triedQ+' tried · ✅ '+masteredQ+' mastered (80%+) · '+(totalQ-triedQ)+' not attempted<\u002Fdiv>';\n        html += '<\u002Fdiv>'; // close card\n      });\n    });\n    html += '<\u002Fdiv>';\n  });\n  box.innerHTML = html;\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
