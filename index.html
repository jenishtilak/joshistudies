exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n  // Writing starts locked \u2014 the student must open and close the peek at least\n  // once (an explicit \"I'm ready to write\" action) before the textarea unlocks.\n  // Practice test skips this since there's no peek option there at all.\n  // Start speed timer immediately when question appears \u2014 time is running from the moment\n  // the student sees the question, whether they peek or not.\n  setTimeout(()=>startSpeedTimer(currentQType), 50);\n  if(currentMode===\"exam\"){\n    const ta=document.getElementById(\"answerInput\");\n    if(ta) ta.disabled=false;\n  }\n}\n\n// \u2500\u2500 WRITE IT IN PARTS \u2014 breaks a long answer into guided steps \u2500\u2500\nlet partsModeState = null; // {parts, currentPart, written[], scores[], originalQuestion}\n\nfunction startPartsMode(){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const parts = splitAnswerIntoParts(q.answer);\n  if(!parts) return;\n  // Carry over anything already typed in the main textarea as a starting point for part 1.\n  const existing = document.getElementById(\"answerInput\")?.value || \"\";\n  partsModeState = { parts, currentPart: 0, written: parts.map(()=>\"\"), scores: parts.map(()=>null), originalQuestion: q.q, usedPartsMode: true };\n  if(existing.trim()) partsModeState.written[0] = existing;\n  renderPartsStep();\n}\n\n// Scores just the current part against its matching sentence from the model\n// answer \u2014 gives quick feedback right away instead of waiting until the whole\n// answer is combined at the end. Doesn't lock anything; the student can keep\n// editing this part afterward and re-check, or move on.\nfunction checkCurrentPart(){\n  const s = partsModeState;\n  if(!s) return;\n  const i = s.currentPart;\n  const input = document.getElementById(\"partInput\");\n  const userText = (input?.value||\"\").trim();\n  s.written[i] = input?.value || \"\";\n  if(!userText){\n    const fb = document.getElementById(\"partFeedback\");\n    if(fb) fb.innerHTML = `<div style=\"color:var(--muted);font-size:12.5px;margin-top:8px\">Write something for this part first.<\u002Fdiv>`;\n    return;\n  }\n  const {pct} = scoreAnswer(userText, s.parts[i]);\n  s.scores[i] = pct;\n  const fb = document.getElementById(\"partFeedback\");\n  const feedbackHTML = `<div class=\"score-stamp\" style=\"margin-top:8px\">\n      <div class=\"score-circle ${pct>=80?\"perfect\":pct>=50?\"good\":\"poor\"}\" style=\"width:46px;height:46px;font-size:14px\">${pct}%<\u002Fdiv>\n      <div><div class=\"score-label\" style=\"font-size:13px\">${pct>=80?\"Great \u2014 this part is solid\":pct>=50?\"Good, room to add a bit more\":\"Worth revising this part\"}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    ${buildAnnotatedDiff(userText, s.parts[i])}`;\n  if(fb) fb.innerHTML = feedbackHTML;\n  // Let the admin see this part's result the moment it's checked, same as\n  // every other \"submit\" moment elsewhere in the app.\n  fbLiveState({ currentAnswer: userText, answered:true, isCorrect: pct>=80, lastScore: pct, feedbackHTML, typing:false });\n}\n\nfunction renderPartsStep(){\n  const s = partsModeState;\n  if(!s) return;\n  const body = document.getElementById(\"quizBody\");\n  const total = s.parts.length;\n  const i = s.currentPart;\n  const existingScore = s.scores[i];\n  const scoreCls = existingScore===null ? \"\" : (existingScore>=80?\"perfect\":existingScore>=50?\"good\":\"poor\");\n  const existingFeedback = existingScore===null ? \"\" : `<div class=\"score-stamp\" style=\"margin-top:8px\">\n      <div class=\"score-circle ${scoreCls}\" style=\"width:46px;height:46px;font-size:14px\">${existingScore}%<\u002Fdiv>\n      <div><div class=\"score-label\" style=\"font-size:13px\">${existingScore>=80?\"Great \u2014 this part is solid\":existingScore>=50?\"Good, room to add a bit more\":\"Worth revising this part\"}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    ${buildAnnotatedDiff(s.written[i]||\"\", s.parts[i])}`;\n\n  // Tell the admin mirror what the student is doing \u2014 previously missing\n  // entirely for \"Write it in parts\" mode, so the admin saw nothing at all\n  // while the student worked through a long answer piece by piece.\n  fbLiveState({\n    mode: \"study\",\n    lessonId: currentLesson?.id||\"\",\n    lessonTitle: currentLesson?.title||\"\",\n    qtype: currentQType,\n    qIndex: currentQIndex,\n    questionText: `${s.originalQuestion}  (Writing in parts \u2014 part ${i+1} of ${total})`,\n    correctAnswer: s.parts[i] || \"\",\n    currentAnswer: s.written[i] || \"\",\n    answered: existingScore!==null,\n    isCorrect: existingScore!==null ? existingScore>=80 : false,\n    lastScore: existingScore,\n    peeksUsedThisQuestion: hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0\n  });\n\n  body.innerHTML = `\n    <div class=\"question-card\">\n      <div class=\"q-label\">Writing in Parts \u2014 Part ${i+1} of ${total}<\u002Fdiv>\n      <div class=\"q-num\">${i+1}<\u002Fdiv>\n      <div class=\"q-text\">${s.originalQuestion}<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn-peek\" id=\"partPeekBtn\" onclick=\"togglePartPeek()\" ${peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0).disabled?\"disabled\":\"\"}>${peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0).disabled ? \"No peeks left\" : `\ud83d\udc41 View Model Answer for this part (${MAX_HINTS - (hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0)} left)`}<\u002Fbutton>\n    <div class=\"peek-panel\" id=\"peekPanel\">\n      <div class=\"peek-label\">Model Answer \u2014 Part ${i+1}<\u002Fdiv>\n      <div class=\"peek-text\">${(s.parts[i]||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"answer-area\" id=\"answerArea\">\n      <textarea class=\"answer-textarea\" id=\"partInput\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"Write this part of your answer\u2026\" style=\"min-height:120px\" oninput=\"document.getElementById('partFeedback').innerHTML=''; reportPartLiveState(this.value)\">${s.written[i]||\"\"}<\u002Ftextarea>\n      <div id=\"partFeedback\">${existingFeedback}<\u002Fdiv>\n      <div class=\"answer-actions\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <button class=\"btn-check\" onclick=\"checkCurrentPart()\" style=\"flex:1\">Check this part<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"answer-actions\" style=\"display:flex;gap:8px;margin-top:6px\">\n        ${i>0 ? `<button class=\"btn-skip\" onclick=\"goToPart(${i-1})\">\u2190 Back<\u002Fbutton>` : \"\"}\n        <button class=\"btn-check\" onclick=\"goToPart(${i+1})\" style=\"flex:1\">${i<total-1 ? \"Next part \u2192\" : \"Now Write It Whole \u2192\"}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;justify-content:center;margin-top:14px\">\n      ${s.parts.map((_,idx)=>`<div style=\"width:${100/total}%;max-width:34px;height:5px;border-radius:3px;background:${s.scores[idx]!==null?(s.scores[idx]>=80?'var(--green)':s.scores[idx]>=50?'#cf8f2e':'var(--red)'):(idx<=i?'var(--navy)':'var(--border)')}\"><\u002Fdiv>`).join(\"\")}\n    <\u002Fdiv>\n    <button onclick=\"exitPartsMode()\" style=\"margin-top:14px;width:100%;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer\">Go back to writing it all at once<\u002Fbutton>\n  `;\n  document.getElementById(\"partInput\")?.focus();\n}\n\n// Reports live typing for the current part to the admin's mirror view.\nfunction reportPartLiveState(value){\n  fbLiveState({ currentAnswer: value, typing:true });\n}\n\n// Peek toggle for \"Write it in parts\" mode \u2014 same lock-until-closed behaviour\n// as the main togglePeek, but targets the per-part textarea and shows only\n// that part's sentence, not the whole answer. Free to view before writing\n// anything for this part; only counts toward the overall peek cap once the\n// student has actually started writing.\nfunction togglePartPeek(){\n  const p=document.getElementById(\"peekPanel\");\n  const b=document.getElementById(\"partPeekBtn\");\n  const ta=document.getElementById(\"partInput\");\n  if(!p) return;\n  const opening=!p.classList.contains(\"visible\");\n  p.classList.toggle(\"visible\",opening);\n  if(opening){\n    if(ta) ta.disabled=true;\n    if(b){ b.textContent=\"\ud83d\ude48 Close to start writing\"; b.classList.add(\"peeking\"); }\n  } else {\n    const hadWrittenSomething = !!(ta && ta.value && ta.value.trim());\n    if(hadWrittenSomething) recordPeekUsed();\n    const unlockForWriting = ()=>{\n      if(ta){ ta.disabled=false; ta.focus(); }\n      if(b){\n        const peekState = peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0);\n        const left = MAX_HINTS - (hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0);\n        b.textContent = peekState.disabled ? \"No peeks left\" : `\ud83d\udc41 View Model Answer for this part (${left} left)`;\n        b.disabled = peekState.disabled;\n        b.classList.remove(\"peeking\");\n      }\n    };\n    if(!maybeShowSpellingGate(currentQType, getOriginalQIndex(currentQIndex), unlockForWriting)){\n      unlockForWriting();\n    }\n  }\n}\n\nfunction goToPart(targetIdx){\n  const s = partsModeState;\n  if(!s) return;\n  // Save what was just written before moving\n  const input = document.getElementById(\"partInput\");\n  if(input) s.written[s.currentPart] = input.value;\n\n  if(targetIdx >= s.parts.length){\n    // Don't allow finishing until every part actually has something written \u2014\n    // previously this silently dropped any empty parts and combined\n    // whatever existed, which meant \"Combine & Finish\" could produce an\n    // answer missing entire sections without ever telling him.\n    const emptyIdx = s.written.findIndex(w => !w || !w.trim());\n    if(emptyIdx !== -1){\n      s.currentPart = emptyIdx;\n      renderPartsStep();\n      const fb = document.getElementById(\"partFeedback\");\n      if(fb) fb.innerHTML = `<div style=\"color:var(--red);font-size:12.5px;margin-top:8px;font-weight:700\">\u270b Write this part before finishing \u2014 every part needs something written first.<\u002Fdiv>`;\n      return;\n    }\n    finishPartsMode();\n    return;\n  }\n  s.currentPart = Math.max(0, targetIdx);\n  renderPartsStep();\n}\n\n// Combines everything written across all parts back into the single answer\n// textarea, then returns to the normal question view so it can be checked\n// Called when the student finishes the LAST part \u2014 rather than stitching\n// together and auto-submitting what was written piece-by-piece, this hands\n// back a genuinely BLANK textarea: writing each part separately was\n// practice/scaffolding, but the real test is whether he can now write the\n// whole answer himself, unaided, in one go. Nothing is auto-checked \u2014 he\n// writes it fresh and hits Check Answer himself, same as any normal\n// question, and this time it's a genuine full attempt, so it earns mastery\n// normally (unlike the old auto-combined version, which deliberately didn't).\nfunction finishPartsMode(){\n  const s = partsModeState;\n  if(!s) return;\n  partsModeState = null;\n  renderCurrentQuestion();\n  setTimeout(()=>{\n    const ta = document.getElementById(\"answerInput\");\n    if(ta){\n      ta.value = \"\";\n      ta.disabled = false; // unlock immediately \u2014 he just practiced each part, no need to peek again before writing the whole thing\n      ta.focus();\n    }\n    fbLiveState({ currentAnswer: \"\", typing:false });\n  }, 0);\n}\n\n// Lets the student bail out of parts mode back to the normal single textarea \u2014\n// keeps whatever they've written so far, but does NOT score it, since they\n// haven't necessarily finished. Just unlocks the box so they can keep editing.\nfunction exitPartsMode(){\n  const s = partsModeState;\n  if(!s) return;\n  const input = document.getElementById(\"partInput\");\n  if(input) s.written[s.currentPart] = input.value;\n  const combined = s.written.map(w=>w.trim()).filter(Boolean).join(\" \");\n  partsModeState = null;\n  renderCurrentQuestion();\n  setTimeout(()=>{\n    const ta = document.getElementById(\"answerInput\");\n    if(ta){\n      ta.value = combined;\n      ta.disabled = false; // unlock so they can keep writing/editing directly\n    }\n    fbLiveState({ currentAnswer: combined, typing:false });\n  }, 0);\n}\n\n// Records that the \"View Model Answer\" peek was used once \u2014 the single source\n// of truth for the score cap, replacing what used to be a separate \"Stuck? Peek\"\n// button system. There's only one peek mechanism now: the existing View Model\n// Answer button doubles as the help button \u2014 free and unlimited now, see applyHintPenalty above.\nfunction recordPeekUsed(){\n  const key = getPrevAttemptKey(currentQIndex);\n  const used = hintsUsedByQuestion[key] || 0;\n  if(used >= MAX_HINTS) return;\n  if(used === 0){\n    const qs=currentLesson.questions[currentQType];\n    const q=qs?.[currentQIndex];\n    if(q) recordHintConcept(key, currentLesson?.title, currentQType, q.q);\n  }\n  hintsUsedByQuestion[key] = used + 1;\n  // Let the admin's live view know right away that a peek was used \u2014 this is\n  // exactly the kind of moment worth seeing live, not just after the fact.\n  fbLiveState({ peeksUsedThisQuestion: hintsUsedByQuestion[key] });\n}\n\n// Tracks which concepts/questions needed help, the same way sessionSpellErrors\n// tracks spelling mistakes \u2014 so struggling areas become visible later instead\n// of disappearing once the question is answered.\nconst hintConceptsNeeded = []; // const \u2014 never reassign, only clear via .length=0 if ever needed\nconst _hintConceptsPush = hintConceptsNeeded.push.bind(hintConceptsNeeded);\nhintConceptsNeeded.push = function(entry){\n  fbLogEntry(\"hintConcepts\", entry);\n  return _hintConceptsPush(entry);\n};\nfunction recordHintConcept(key, lessonTitle, qtype, questionText){\n  // Only log once per question per attempt \u2014 repeated hints on the same question\n  // don't need to spam multiple \"needed help\" entries.\n  if(hintConceptsNeeded.some(c=>c._key===key)) return;\n  hintConceptsNeeded.push({\n    _key: key,\n    lessonTitle: lessonTitle||\"\",\n    qtype: qtype||\"\",\n    questionText: (questionText||\"\").slice(0,200)\n  });\n}\n\n// \u2500\u2500 TRUE OR FALSE \u2500\u2500\nfunction renderTrueFalse(q, qnum, isLast){\n  const actionBtn = currentMode===\"exam\"\n    ? `<button class=\"btn-next\" id=\"examNextBtn\" onclick=\"examNextTF('${q.answer}',${isLast})\" disabled style=\"margin-bottom:24px\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>`\n    : ``;\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">True or False<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text\">${q.statement||q.q}<\u002Fdiv>\n      <div class=\"mcq-options\" style=\"margin-top:14px\">\n        <div class=\"mcq-option\" id=\"tfopt0\" data-val=\"true\" data-correct=\"${q.answer}\" data-reason=\"${(q.reason||\"\").replace(/\"/g,\"&quot;\")}\" onclick=\"selectTFFromEl(this,${isLast})\">\n          <span class=\"mcq-opt-letter\">T<\u002Fspan><span>True<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"mcq-option\" id=\"tfopt1\" data-val=\"false\" data-correct=\"${q.answer}\" data-reason=\"${(q.reason||\"\").replace(/\"/g,\"&quot;\")}\" onclick=\"selectTFFromEl(this,${isLast})\">\n          <span class=\"mcq-opt-letter\">F<\u002Fspan><span>False<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${actionBtn}\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n}\nfunction selectTFFromEl(el, isLast){\n  const selected = el.dataset.val;\n  const correct  = el.dataset.correct;\n  const reason   = el.dataset.reason||\"\";\n  selectTF(selected, correct, isLast, reason);\n}\nfunction selectTF(selected, correct, isLast, reason){\n  if(document.getElementById(\"btnRow\")?.style.display===\"flex\") return;\n  fbLiveState({\n    currentAnswer: selected===\"true\"?\"True\":\"False\",\n    correctAnswer: correct===\"true\"?\"True\":\"False\",\n    isCorrect: selected===correct,\n    typing:false\n  });\n\n  if(currentMode===\"exam\"){\n    // Exam mode: just highlight selected, enable Next\n    document.getElementById(\"tfopt0\").classList.toggle(\"selected\", selected===\"true\");\n    document.getElementById(\"tfopt1\").classList.toggle(\"selected\", selected===\"false\");\n    const eb=document.getElementById(\"examNextBtn\");\n    if(eb){ eb.disabled=false; eb.dataset.sel=selected; }\n    return;\n  }\n  const isCorrect = selected===correct;\n  if(document.getElementById(\"btnRow\")?.style.display===\"flex\") return;\n  document.querySelectorAll(\".mcq-option\").forEach(el=>el.onclick=null);\n  document.getElementById(\"tfopt0\").classList.toggle(\"correct\", correct===\"true\");\n  document.getElementById(\"tfopt0\").classList.toggle(\"wrong\", selected===\"true\" && !isCorrect);\n  document.getElementById(\"tfopt1\").classList.toggle(\"correct\", correct===\"false\");\n  document.getElementById(\"tfopt1\").classList.toggle(\"wrong\", selected===\"false\" && !isCorrect);\n  const pct = isCorrect ? 100 : 0;\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  const tfelapsed=stampQuestion();\n  logQuestion(pct,tfelapsed);\n  const panel=document.getElementById(\"resultPanel\");\n  panel.classList.add(\"visible\");\n  const cls=isCorrect?\"perfect\":\"poor\";\n  const correctLabel = correct===\"true\" ? \"True\" : \"False\";\n  const tfFeedbackHTML = `\n    <div class=\"score-stamp\">\n      <div class=\"score-circle ${cls}\">${pct}%<\u002Fdiv>\n      <div><div class=\"score-label\">${isCorrect?\"Correct! \ud83c\udf89\":\"Incorrect \u2014 it is \"+correctLabel}<\u002Fdiv>\n      <div style=\"margin-top:4px\">${timeChip(tfelapsed)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    ${reason?`<div class=\"result-section\"><div class=\"result-section-title correct\">Reason<\u002Fdiv><div class=\"diff-answer-block model\">${reason.replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv><\u002Fdiv>`:\"\"}`;\n  panel.innerHTML = tfFeedbackHTML;\n  fbLiveState({ answered:true, lastScore:pct, isCorrect, feedbackHTML: tfFeedbackHTML, currentAnswer: selected!==undefined?String(selected):\"\" });\n  renderNavBar();\n  const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n}\nfunction examNextTF(correct, isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const eb=document.getElementById(\"examNextBtn\");\n  const sel = eb?.dataset?.sel || (document.querySelector(\".mcq-option.selected span:last-child\")?.textContent?.toLowerCase());\n  const pct = sel===correct?100:0;\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  examAnswers.push({q:q.statement||q.q, userText:sel||\"(no answer)\", modelText:correct, pct, qtype:\"truefalse\", lessonTitle:currentLesson.title, lessonId:currentLesson.id, mockIdx:mockQIndex});\n  if(isLast){ showMockResults(); return; }\n  nextQuestion();\n}\nfunction togglePeek(){\n  const p=document.getElementById(\"peekPanel\");\n  const b=document.getElementById(\"mainPeekBtn\");\n  const ta=document.getElementById(\"answerInput\");\n  if(!p) return;\n  const opening=!p.classList.contains(\"visible\");\n  p.classList.toggle(\"visible\",opening);\n  if(opening){\n    // Grey out and disable the textarea while the model answer is showing \u2014\n    // forces the student to close the peek before they can keep writing.\n    if(ta) ta.disabled=true;\n    if(b){\n      b.textContent=\"\ud83d\ude48 Close to start writing\";\n      b.classList.add(\"peeking\"); // visually greyed, but still clickable so it can be closed\n    }\n  } else {\n    // Score is never affected by peeking \u2014 only the count is capped, and only\n    // so it stays a genuine \"I need help\" moment rather than clicking through.\n    const hadWrittenSomething = !!(ta && ta.value && ta.value.trim());\n    if(hadWrittenSomething) recordPeekUsed();\n    const unlockForWriting = ()=>{\n      if(ta){ ta.disabled=false; ta.focus(); }\n      if(b){\n        const peekState = peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0);\n        b.textContent = peekState.label;\n        b.disabled = peekState.disabled;\n        b.classList.remove(\"peeking\");\n      }\n    };\n    // The spelling warm-up now triggers HERE \u2014 right when he's actually\n    // about to start writing (closed the peek, ready to type) \u2014 rather than\n    // the moment the question first appears, which was popping up before he'd\n    // even decided to answer it and getting in the way of quick navigation\n    // between questions. If it triggers, the textarea stays locked until the\n    // warm-up finishes; if not, it unlocks immediately as before.\n    if(!maybeShowSpellingGate(currentQType, getOriginalQIndex(currentQIndex), unlockForWriting)){\n      unlockForWriting();\n    }\n  }\n}\nfunction examNextText(isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const userText=document.getElementById(\"answerInput\").value.trim();\n  const {pct, diff}=scoreAnswer(userText||\"\", q.answer);\n  // Log spelling errors to session report\n  diff.forEach(d=>{\n    if(d.type===\"misspelled\")\n      sessionSpellErrors.push({wrong:d.word, correct:d.correct, lessonTitle:currentLesson.title, qtype:currentQType, subject:currentSubject});\n  });\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  examAnswers.push({q:q.q, userText:userText||\"(no answer)\", modelText:q.answer, pct, qtype:currentQType, lessonTitle:currentLesson.title, lessonId:currentLesson.id, mockIdx:mockQIndex});\n  if(isLast){ showMockResults(); return; }\n  nextQuestion();\n}\n// \u2500\u2500 ANNOTATED DIFF helper \u2014 word-level annotation, same line format as model \u2500\u2500\nfunction buildAnnotatedDiff(userText, modelText){\n  const {diff} = scoreAnswer(userText, modelText);\n  let annotated = \"\";\n  diff.forEach(d=>{\n    const w = d.word.replace(/<\u002Fg,\"&lt;\");\n    if(d.type===\"ok\")          annotated += `<span class=\"word-ok\">${w}<\u002Fspan> `;\n    else if(d.type===\"wrong\")  annotated += `<span class=\"word-wrong\">${w}<\u002Fspan> `;\n    else if(d.type===\"misspelled\") annotated += `<span class=\"word-wrong\">${w}<\u002Fspan><span class=\"word-correction\">\u2192${d.correct.replace(/<\u002Fg,\"&lt;\")}<\u002Fspan> `;\n    else if(d.type===\"missing\") annotated += `<span class=\"word-missing\">[${w}]<\u002Fspan> `;\n  });\n\n  // Preserve the model answer's line breaks in both blocks\n  const modelFormatted = modelText.replace(/<\u002Fg,\"&lt;\").replace(/\\n/g,\"<br>\");\n\n  return `\n    <div class=\"result-section\">\n      <div class=\"result-section-title\">Your Answer<\u002Fdiv>\n      <div class=\"diff-answer-block\">${annotated||\"<em>(skipped)<\u002Fem>\"}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-section\">\n      <div class=\"result-section-title correct\">\u2705 Model Answer<\u002Fdiv>\n      <div class=\"diff-answer-block model\">${modelFormatted}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\nfunction checkTextAnswer(){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const isLast=currentQIndex>=qs.length-1;\n  const userText=document.getElementById(\"answerInput\").value.trim();\n  if(!userText) return;\n  document.getElementById(\"answerInput\").disabled=true;\n  document.getElementById(\"checkBtn\").disabled=true;\n  const skipBtn=document.getElementById(\"answerArea\")?.querySelector(\".btn-skip\");\n  if(skipBtn) skipBtn.disabled=true;\n  const peekBtnEl=document.getElementById(\"mainPeekBtn\");\n  if(peekBtnEl) peekBtnEl.disabled=true;\n\n  const {pct:rawPct, diff}=scoreAnswer(userText, q.answer);\n  const key = getPrevAttemptKey(currentQIndex);\n  const hintsUsed = hintsUsedByQuestion[key] || 0;\n  const pct = applyHintPenalty(rawPct, hintsUsed);\n\n  // Collect spelling errors for session report\n  diff.forEach(d=>{\n    if(d.type===\"misspelled\")\n      sessionSpellErrors.push({wrong:d.word, correct:d.correct, lessonTitle:currentLesson.title, qtype:currentQType, subject:currentSubject});\n  });\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  const txtElapsed=stampQuestion();\n\n  const cls=pct>=80?\"perfect\":pct>=50?\"good\":\"poor\";\n  const lbl=pct>=80?\"Great answer!\":pct>=50?\"Good effort \u2014 almost there!\":\"Keep practising!\";\n  const hintNote = hintsUsed>0\n    ? `<div class=\"score-detail\" style=\"color:#7d5c1e;margin-top:4px\">\ud83d\udc41 Peeked the answer ${hintsUsed} time${hintsUsed!==1?\"s\":\"\"} \u2014 no effect on your score<\u002Fdiv>`\n    : \"\";\n\n  const sb = pct>=MIN_SCORE_FOR_GOAL_CREDIT ? getSpeedBonus(currentQType, txtElapsed) : null;\n  const speedChip = sb ? `<span style=\"background:#c45000;color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px\">\u26a1 +${sb.points} Speed Bonus!<\u002Fspan>` : \"\";\n  // The old optional \"Practice Spellings for this Answer\" button is gone --\n  // maybeShowSpellingWarmDown() below now forces exactly this same practice\n  // on the same wrong words, every time, instead of leaving it to a click.\n  const feedbackHTML = `\n    <div class=\"score-stamp\">\n      <div class=\"score-circle ${cls}\">${pct}%<\u002Fdiv>\n      <div><div class=\"score-label\">${lbl} ${timeChip(txtElapsed)}${speedChip}<\u002Fdiv>\n      <div class=\"score-detail\">green = correct \u00b7 <span style=\"color:var(--red)\">red = wrong/extra<\u002Fspan> \u00b7 <span style=\"color:#8a651b\">[bracketed] = missing<\u002Fspan><\u002Fdiv>\n      ${hintNote}<\u002Fdiv>\n    <\u002Fdiv>\n    ${buildAnnotatedDiff(userText, q.answer)}`;\n\n  logQuestion(pct, txtElapsed, feedbackHTML, pct>=80);\n  maybeAwardNewTryBonus(currentQType, getOriginalQIndex(currentQIndex));\n  renderNavBar();\n\n  const revealTextResult = ()=>{\n    const panel=document.getElementById(\"resultPanel\");\n    panel.classList.add(\"visible\");\n    panel.innerHTML = feedbackHTML;\n    setTimeout(()=>saveStudyAnswer(pct),50);\n\n    document.getElementById(\"answerArea\").style.display=\"none\";\n    hidePeek();\n    const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n  };\n\n  // Forced spelling warm-down on whatever he just got wrong, before the\n  // score is revealed -- skips straight to revealTextResult() if there was\n  // nothing wrong to practise, or if this isn't a normal study-mode answer.\n  if(!maybeShowSpellingWarmDown(diff, revealTextResult)){\n    revealTextResult();\n  }\n}\n\n// Combines both Distinguish textareas into a single readable currentAnswer for\n// the live admin view \u2014 otherwise typing in box B would silently overwrite\n// whatever box A showed, hiding half of what the student has written.\nfunction reportDistLiveState(){\n  const a = document.getElementById(\"distInputA\")?.value || \"\";\n  const b = document.getElementById(\"distInputB\")?.value || \"\";\n  fbLiveState({ currentAnswer: `[Term A] ${a}\\n\\n[Term B] ${b}`, typing:true });\n}\n\n// \u2500\u2500 DISTINGUISH BETWEEN \u2500\u2500\nfunction renderDistinguish(q, qnum, isLast){\n  const prevAttempt = previousAttempts[getPrevAttemptKey(currentQIndex)];\n  const peekState = peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0);\n  const peekBtn = currentMode!==\"exam\" ? `<button class=\"btn-peek\" id=\"mainPeekBtn\" onclick=\"togglePeekDist()\" ${peekState.disabled&&!prevAttempt?\"disabled\":\"\"}>${peekState.label}<\u002Fbutton>\n       <div class=\"peek-panel\" id=\"peekPanel\">\n         ${prevAttempt && prevAttempt.type===\"distinguish\" ? `\n           <div class=\"peek-label\" style=\"color:var(--red)\">Your Previous Attempt \u2014 ${q.termA}<\u002Fdiv>\n           ${buildAnnotatedDiff(prevAttempt.userTextA, q.answerA)}\n           <div class=\"peek-label\" style=\"margin-top:14px;color:var(--red)\">Your Previous Attempt \u2014 ${q.termB}<\u002Fdiv>\n           ${buildAnnotatedDiff(prevAttempt.userTextB, q.answerB)}\n         ` : buildDistTable(q, true)}\n       <\u002Fdiv>` : \"\";\n  const actionBtns = currentMode===\"exam\"\n    ? `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"examNextDistinguish(${isLast})\">${isLast?\"Finish \u2713\":\"Next \u2192\"}<\u002Fbutton>`\n    : `<button class=\"btn-check\" id=\"checkBtn\" onclick=\"checkDistinguish()\">Check Answer<\u002Fbutton>\n       <button class=\"btn-skip\" onclick=\"skipQuestion(${isLast})\">Skip<\u002Fbutton>`;\n\n  const distPlaceholder = currentMode===\"exam\" ? null : \"Tap \ud83d\udc41 above, then close it to start writing\u2026\";\n  fbLiveState({\n    mode: currentLesson?.id===\"__mock__\" ? \"mock\" : \"study\",\n    lessonId: currentLesson?.id||\"\",\n    lessonTitle: currentLesson?.title||\"\",\n    qtype: currentQType,\n    qIndex: currentQIndex,\n    questionText: q.q || `Distinguish between ${q.termA} and ${q.termB}.`,\n    correctAnswer: `${q.termA}: ${q.answerA}\\n\\n${q.termB}: ${q.answerB}`,\n    currentAnswer: \"\",\n    answered: false,\n    isCorrect: false,\n    peeksUsedThisQuestion: 0\n  });\n\n  document.getElementById(\"quizBody\").innerHTML=`\n    <div class=\"question-card\">\n      <div class=\"q-label\">Distinguish Between<\u002Fdiv>\n      <div class=\"q-num\">${qnum}${currentMode!==\"exam\"?getQuestionStatusBadge(currentLesson?.id,currentQType,currentQIndex):\"\"}<\u002Fdiv>\n      <div class=\"q-text distinguish\">${q.q || `Distinguish between <strong>${q.termA}<\u002Fstrong> and <strong>${q.termB}<\u002Fstrong>.`}<\u002Fdiv>\n    <\u002Fdiv>\n    ${peekBtn}\n    <div id=\"speedTimerWrap\" style=\"margin:0 0 10px;padding:8px 10px;background:var(--parchment);border-radius:8px\">\n      <div style=\"font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center\" id=\"speedChallenge\">\u26a1 Challenge: Can you finish this one fast?<\u002Fdiv>\n      <div style=\"background:#e0e0e0;border-radius:3px;overflow:hidden;height:5px;margin-bottom:5px\">\n        <div id=\"speedTimerBar\" style=\"height:100%;width:100%;background:#4a9873;border-radius:3px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <span style=\"font-size:10px;color:var(--muted)\">Speed Bonus<\u002Fspan>\n        <span id=\"speedTimerPts\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#4a9873;color:#fff;transition:background .5s\">\u26a1 calculating\u2026<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"speedNudge\" style=\"font-size:11px;font-weight:600;margin-top:6px;text-align:center;min-height:16px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"answer-area\" id=\"answerArea\">\n      <div class=\"dist-input-grid\">\n        <div class=\"dist-input-col\">\n          <div class=\"dist-input-label\">${q.termA}<\u002Fdiv>\n          <textarea class=\"dist-textarea\" id=\"distInputA\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"${distPlaceholder||`Write about ${q.termA}\u2026`}\" ${currentMode!==\"exam\"?\"disabled\":\"\"} onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\" oninput=\"reportDistLiveState()\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div class=\"dist-input-col\">\n          <div class=\"dist-input-label\">${q.termB}<\u002Fdiv>\n          <textarea class=\"dist-textarea\" id=\"distInputB\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"${distPlaceholder||`Write about ${q.termB}\u2026`}\" ${currentMode!==\"exam\"?\"disabled\":\"\"} onpaste=\"return false\" oncopy=\"return false\" oncut=\"return false\" oncontextmenu=\"return false\" oninput=\"reportDistLiveState()\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"answer-actions\" style=\"padding:0 12px 12px\">${actionBtns}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-panel\" id=\"resultPanel\"><\u002Fdiv>\n    ${currentMode!==\"exam\"?`<div class=\"btn-row\" id=\"btnRow\" style=\"display:none\">\n      <button class=\"btn-try-again\" onclick=\"tryAgainQuestion()\">\ud83d\udd01 Try Again<\u002Fbutton>\n      <button class=\"btn-next\" onclick=\"nextQuestion()\">${isLast?\"See Results \ud83c\udfaf\":\"Next Question \u2192\"}<\u002Fbutton>\n    <\u002Fdiv>`:\"\"}`;\n  setTimeout(()=>startSpeedTimer(\"distinguish\"), 50);\n}\n\n// Toggle peek for distinguish \u2014 disables BOTH textareas. Free to view before\n// writing anything in either box; only counts once they've started writing.\nfunction togglePeekDist(){\n  const p=document.getElementById(\"peekPanel\");\n  const b=document.getElementById(\"mainPeekBtn\");\n  const taA=document.getElementById(\"distInputA\");\n  const taB=document.getElementById(\"distInputB\");\n  if(!p) return;\n  const opening=!p.classList.contains(\"visible\");\n  p.classList.toggle(\"visible\",opening);\n  if(opening){\n    if(taA) taA.disabled=true;\n    if(taB) taB.disabled=true;\n    if(b){ b.textContent=\"\ud83d\ude48 Close to start writing\"; b.classList.add(\"peeking\"); }\n  } else {\n    const hadWrittenSomething = !!((taA && taA.value.trim()) || (taB && taB.value.trim()));\n    if(hadWrittenSomething) recordPeekUsed();\n    const unlockForWriting = ()=>{\n      if(taA){ taA.disabled=false; taA.focus(); }\n      if(taB) taB.disabled=false;\n      if(b){\n        const peekState = peekButtonState(hintsUsedByQuestion[getPrevAttemptKey(currentQIndex)] || 0);\n        b.textContent = peekState.label;\n        b.disabled = peekState.disabled;\n        b.classList.remove(\"peeking\");\n      }\n    };\n    if(!maybeShowSpellingGate(currentQType, getOriginalQIndex(currentQIndex), unlockForWriting)){\n      unlockForWriting();\n    }\n  }\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  VOICE INPUT \u2014 \"Speak Answer\"\n//  Free, no backend, no API key. Two paths depending on\n//  browser support:\n//   1. Native Web Speech API (Chrome/Android) \u2014 instant,\n//      the browser itself does the recognition for free.\n//   2. In-browser Whisper (Safari/iPhone and anywhere else\n//      the native API isn't available) \u2014 runs a small\n//      speech-recognition model entirely on the student's\n//      own device via transformers.js. Audio never leaves\n//      the device either way; nothing is uploaded anywhere.\n//  Whatever text comes out gets dropped straight into the\n//  textarea exactly as if the student had typed it \u2014 the\n//  existing exact-match scorer grades it the same way.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _voiceActive = false;\nlet _voiceRecognitionInstance = null;\nlet _voiceMediaRecorder = null;\nlet _voiceMediaStream = null;\nlet _voiceChunks = [];\nlet _whisperPipelinePromise = null;\n\nfunction setMicUI(btn, state){\n  if(!btn) return;\n  btn.classList.remove(\"recording\",\"processing\");\n  if(state===\"listening\"){ btn.textContent=\"\u23f9 Stop\"; btn.classList.add(\"recording\"); }\n  else if(state===\"processing\"){ btn.textContent=\"\u23f3 Transcribing\u2026\"; btn.classList.add(\"processing\"); }\n  else { btn.textContent = btn.dataset.micLabel || \"\ud83c\udfa4 Speak Answer\"; }\n}\n\nfunction toggleVoiceInput(targetId, btn){\n  if(!btn.dataset.micLabel) btn.dataset.micLabel = btn.textContent; // remember idle label (e.g. \"\ud83c\udfa4 Speak\" vs \"\ud83c\udfa4 Speak Answer\")\n  if(_voiceActive){ stopVoiceInput(); return; }\n  const ta = document.getElementById(targetId);\n  if(!ta || ta.disabled) return;\n  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n  if(SR) startNativeVoiceInput(targetId, btn, SR);\n  else startWhisperVoiceInput(targetId, btn);\n}\n\nfunction stopVoiceInput(){\n  if(_voiceRecognitionInstance){\n    try{ _voiceRecognitionInstance.stop(); }catch(e){}\n    _voiceRecognitionInstance = null;\n  }\n  if(_voiceMediaRecorder && _voiceMediaRecorder.state!==\"inactive\"){\n    try{ _voiceMediaRecorder.stop(); }catch(e){} // onstop handler does the transcribing\n  } else {\n    _voiceActive = false;\n  }\n}\n\n// \u2500\u2500 Path 1: native browser speech recognition (free, instant, Chrome/Android) \u2500\u2500\nfunction startNativeVoiceInput(targetId, btn, SR){\n  const ta = document.getElementById(targetId);\n  _voiceActive = true;\n  setMicUI(btn, \"listening\");\n  const rec = new SR();\n  rec.lang = \"en-IN\";\n  rec.interimResults = true;\n  rec.continuous = true;\n  const startingText = ta.value ? ta.value.trim()+\" \" : \"\";\n  let finalText = startingText;\n  rec.onresult = (e)=>{\n    let interim = \"\";\n    for(let i=e.resultIndex; i<e.results.length; i++){\n      const t = e.results[i][0].transcript;\n      if(e.results[i].isFinal) finalText += t + \" \";\n      else interim += t;\n    }\n    ta.value = (finalText + interim).trim();\n    ta.dispatchEvent(new Event(\"input\"));\n  };\n  rec.onerror = ()=>{ _voiceActive=false; setMicUI(btn,\"idle\"); };\n  rec.onend   = ()=>{ _voiceActive=false; setMicUI(btn,\"idle\"); _voiceRecognitionInstance=null; };\n  _voiceRecognitionInstance = rec;\n  try{ rec.start(); }catch(e){ _voiceActive=false; setMicUI(btn,\"idle\"); }\n}\n\n// \u2500\u2500 Path 2: in-browser Whisper (free, runs on-device, works on Safari/iPhone) \u2500\u2500\nasync function startWhisperVoiceInput(targetId, btn){\n  let stream;\n  try{\n    stream = await navigator.mediaDevices.getUserMedia({audio:true});\n  }catch(e){\n    alert(\"Microphone access is needed to speak your answer. Please allow microphone access in your browser settings and try again.\");\n    return;\n  }\n  _voiceMediaStream = stream;\n  _voiceActive = true;\n  setMicUI(btn, \"listening\");\n  _voiceChunks = [];\n  let recorder;\n  try{\n    recorder = MediaRecorder.isTypeSupported(\"audio/webm\")\n      ? new MediaRecorder(stream, {mimeType:\"audio/webm\"})\n      : new MediaRecorder(stream);\n  }catch(e){\n    recorder = new MediaRecorder(stream);\n  }\n  recorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) _voiceChunks.push(e.data); };\n  recorder.onstop = async ()=>{\n    stream.getTracks().forEach(t=>t.stop());\n    setMicUI(btn, \"processing\");\n    const ta = document.getElementById(targetId);\n    try{\n      const blob = new Blob(_voiceChunks, {type:recorder.mimeType||\"audio/webm\"});\n      const text = await transcribeWithWhisper(blob);\n      if(ta && text){\n        ta.value = (ta.value ? ta.value.trim()+\" \" : \"\") + text;\n        ta.dispatchEvent(new Event(\"input\"));\n      }\n    }catch(err){\n      console.error(\"On-device transcription failed:\", err);\n      alert(\"Sorry, couldn't transcribe that \u2014 please try again or type your answer instead.\");\n    }\n    _voiceActive = false;\n    setMicUI(btn, \"idle\");\n    _voiceMediaRecorder = null;\n  };\n  _voiceMediaRecorder = recorder;\n  recorder.start();\n}\n\n// Lazily loads transformers.js + a small quantized Whisper model, once per\n// page load, then reuses the same pipeline for every question afterward.\nasync function getWhisperPipeline(){\n  if(!_whisperPipelinePromise){\n    _whisperPipelinePromise = (async ()=>{\n      const { pipeline } = await import(\"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/+esm\");\n      return await pipeline(\"automatic-speech-recognition\", \"Xenova/whisper-tiny.en\");\n    })();\n  }\n  return _whisperPipelinePromise;\n}\n\n// Decodes recorded audio and resamples it to 16kHz mono Float32 \u2014 the\n// format Whisper expects \u2014 entirely client-side via the Web Audio API.\nasync function decodeAudioTo16kMono(blob){\n  const arrayBuffer = await blob.arrayBuffer();\n  const AC = window.AudioContext || window.webkitAudioContext;\n  const audioCtx = new AC();\n  const decoded = await audioCtx.decodeAudioData(arrayBuffer);\n  const targetRate = 16000;\n  const offline = new OfflineAudioContext(1, Math.ceil(decoded.duration*targetRate), targetRate);\n  const src = offline.createBufferSource();\n  src.buffer = decoded;\n  src.connect(offline.destination);\n  src.start(0);\n  const rendered = await offline.startRendering();\n  audioCtx.close();\n  return rendered.getChannelData(0);\n}\n\nasync function transcribeWithWhisper(blob){\n  const [transcriber, audioData] = await Promise.all([getWhisperPipeline(), decodeAudioTo16kMono(blob)]);\n  const result = await transcriber(audioData);\n  return (result?.text||\"\").trim();\n}\n\n\nfunction buildDistTable(q, isPeek=false){\n  const rowsA = q.answerA.split(\"\\n\").filter(r=>r.trim());\n  const rowsB = q.answerB.split(\"\\n\").filter(r=>r.trim());\n  const maxRows = Math.max(rowsA.length, rowsB.length);\n  let rows=\"\";\n  for(let i=0;i<maxRows;i++){\n    const a=(rowsA[i]||\"\").replace(/<\u002Fg,\"&lt;\");\n    const b=(rowsB[i]||\"\").replace(/<\u002Fg,\"&lt;\");\n    rows+=`<tr><td>${a}<\u002Ftd><td>${b}<\u002Ftd><\u002Ftr>`;\n  }\n  const label = isPeek ? \"\u2705 Model Answer\" : \"\";\n  return `\n    ${isPeek?`<div class=\"peek-label\">${label}<\u002Fdiv>`:\"\"}\n    <table class=\"dist-table\">\n      <thead><tr><th>${q.termA}<\u002Fth><th>${q.termB}<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${rows}<\u002Ftbody>\n    <\u002Ftable>`;\n}\n\n// Build annotated diff for a single textarea vs model text\nfunction buildDistAnnotated(userText, modelText){\n  const {diff}=scoreAnswer(userText, modelText);\n  let html=\"\";\n  diff.forEach(d=>{\n    const w=d.word.replace(/<\u002Fg,\"&lt;\");\n    if(d.type===\"ok\")           html+=`<span class=\"word-ok\">${w}<\u002Fspan> `;\n    else if(d.type===\"wrong\")   html+=`<span class=\"word-wrong\">${w}<\u002Fspan> `;\n    else if(d.type===\"misspelled\") html+=`<span class=\"word-wrong\">${w}<\u002Fspan><span class=\"word-correction\">\u2192${d.correct.replace(/<\u002Fg,\"&lt;\")}<\u002Fspan> `;\n    else if(d.type===\"missing\") html+=`<span class=\"word-missing\">[${w}]<\u002Fspan> `;\n  });\n  return html||\"<em style='color:var(--muted)'>(not written)<\u002Fem>\";\n}\n\nfunction examNextDistinguish(isLast){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const userA=(document.getElementById(\"distInputA\")?.value||\"\").trim();\n  const userB=(document.getElementById(\"distInputB\")?.value||\"\").trim();\n  const combined=userA+\" \"+userB;\n  const {pct}=scoreAnswer(combined, q.answerA+\" \"+q.answerB);\n  sessionResults.push({pct, qtype:currentQType});\n  markMockAnswered(pct);\n  examAnswers.push({\n    q:`Distinguish: ${q.termA} vs ${q.termB}`,\n    userText:`${q.termA}: ${userA}\\n${q.termB}: ${userB}`,\n    modelText:`${q.termA}:\\n${q.answerA}\\n\\n${q.termB}:\\n${q.answerB}`,\n    pct, qtype:currentQType, lessonTitle:currentLesson.title, lessonId:currentLesson.id, mockIdx:mockQIndex\n  });\n  if(isLast){ showMockResults(); return; }\n  nextQuestion();\n}\n\nfunction checkDistinguish(){\n  const qs=currentLesson.questions[currentQType];\n  const q=qs[getOriginalQIndex(currentQIndex)];\n  const userA=(document.getElementById(\"distInputA\")?.value||\"\").trim();\n  const userB=(document.getElementById(\"distInputB\")?.value||\"\").trim();\n  if(!userA && !userB) return;\n\n  // Disable both textareas\n  [\"distInputA\",\"distInputB\"].forEach(id=>{\n    const el=document.getElementById(id);\n    if(el) el.disabled=true;\n  });\n  document.getElementById(\"checkBtn\").disabled=true;\n  const skipBtn=document.getElementById(\"answerArea\")?.querySelector(\".btn-skip\");\n  if(skipBtn) skipBtn.disabled=true;\n\n  // Disable the peek button too, now that the question is checked\n  const peekBtnEl=document.getElementById(\"mainPeekBtn\");\n  if(peekBtnEl) peekBtnEl.disabled=true;\n\n  // Score each side separately, average them. Peeking once shows BOTH terms'\n  // model answers together (single panel), so the same peek count and cap\n  // applies equally to both sides rather than tracking them separately.\n  const {pct:rawPctA, diff:diffA}=scoreAnswer(userA, q.answerA);\n  const {pct:rawPctB, diff:diffB}=scoreAnswer(userB, q.answerB);\n  const peekKey = getPrevAttemptKey(currentQIndex);\n  const peeksUsed = hintsUsedByQuestion[peekKey] || 0;\n  const pctA = applyHintPenalty(rawPctA, peeksUsed);\n  const pctB = applyHintPenalty(rawPctB, peeksUsed);\n  const pct=Math.round((pctA+pctB)/2);\n  const distDiff = [...diffA, ...diffB];\n  // Collect spelling errors for the session report -- checkTextAnswer already\n  // did this for the single-textarea writing types; Distinguish's two-box\n  // answer never had this, which meant its mistakes never showed up in the\n  // Spelling Report or Study Insights even though the warm-down below now\n  // drills exactly these words.\n  distDiff.forEach(d=>{\n    if(d.type===\"misspelled\")\n      sessionSpellErrors.push({wrong:d.word, correct:d.correct, lessonTitle:currentLesson.title, qtype:currentQType, subject:currentSubject});\n  });\n  sessionResults.push({pct, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  const distElapsed=stampQuestion();\n\n  const cls=pct>=80?\"perfect\":pct>=50?\"good\":\"poor\";\n  const hintNote = peeksUsed>0\n    ? `<div class=\"score-detail\" style=\"color:#7d5c1e;margin-top:4px\">\ud83d\udc41 Peeked the answer ${peeksUsed} time${peeksUsed!==1?\"s\":\"\"} \u2014 no effect on your score<\u002Fdiv>`\n    : \"\";\n  // The old optional \"Practice Spellings for this Answer\" button is gone --\n  // maybeShowSpellingWarmDown() below now forces exactly this same practice\n  // on the same wrong words, every time, instead of leaving it to a click.\n  const feedbackHTML = `\n    <div class=\"score-stamp\">\n      <div class=\"score-circle ${cls}\">${pct}%<\u002Fdiv>\n      <div>\n        <div class=\"score-label\">${pct>=80?\"Excellent!\":pct>=50?\"Good effort!\":\"Keep practising!\"} ${timeChip(distElapsed)}<\u002Fdiv>\n        <div class=\"score-detail\">green = correct \u00b7 <span style=\"color:var(--red)\">red = wrong<\u002Fspan> \u00b7 <span style=\"color:#8a651b\">[bracketed] = missing<\u002Fspan><\u002Fdiv>\n        ${hintNote}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-section-title\" style=\"margin-bottom:6px\">Your Answer<\u002Fdiv>\n    <div class=\"dist-your-grid\">\n      <div class=\"dist-your-box\">\n        <div class=\"dist-your-title\">${q.termA}<\u002Fdiv>\n        <div>${buildDistAnnotated(userA, q.answerA)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dist-your-box\">\n        <div class=\"dist-your-title\">${q.termB}<\u002Fdiv>\n        <div>${buildDistAnnotated(userB, q.answerB)}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-section-title correct\" style=\"margin:10px 0 4px\">\u2705 Model Answer<\u002Fdiv>\n    ${buildDistTable(q)}`;\n\n  logQuestion(pct, distElapsed, feedbackHTML, pct>=80);\n  maybeAwardNewTryBonus(currentQType, getOriginalQIndex(currentQIndex));\n  renderNavBar();\n\n  const revealDistResult = ()=>{\n    const panel=document.getElementById(\"resultPanel\");\n    panel.classList.add(\"visible\");\n    panel.innerHTML = feedbackHTML;\n\n    document.getElementById(\"answerArea\").style.display=\"none\";\n    hidePeek();\n    const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n  };\n\n  if(!maybeShowSpellingWarmDown(distDiff, revealDistResult)){\n    revealDistResult();\n  }\n}\n\n// \u2500\u2500 SIMPLE RESULT (MCQ / FILL / MATCH) \u2500\u2500\nfunction showSimpleResult(pct, detail){\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:true,skipped:false,pct};\n  renderNavBar();\n  const panel=document.getElementById(\"resultPanel\");\n  panel.classList.add(\"visible\");\n  const cls=pct>=80?\"perfect\":pct>=50?\"good\":\"poor\";\n  const m=getMarks(currentQType);\n  const earned=(m*(pct/100)).toFixed(m===1?0:1);\n  const feedbackHTML = `\n    <div class=\"score-stamp\">\n      <div class=\"score-circle ${cls}\">${pct}%<\u002Fdiv>\n      <div>\n        <div class=\"score-label\">${pct>=80?\"Correct! \ud83c\udf89\":pct>=50?\"Partially correct\":\"Incorrect\"}<\u002Fdiv>\n        <div class=\"score-detail\">${detail}<\u002Fdiv>\n        <div class=\"marks-chip\">${earned}/${m} mark${m!==1?\"s\":\"\"}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  panel.innerHTML = feedbackHTML;\n  // Mirror the exact same feedback to the admin's live view, in addition to\n  // whatever fbLiveState call already ran when the answer was selected.\n  fbLiveState({ answered:true, lastScore:pct, isCorrect: pct>=80, feedbackHTML, currentAnswer: (document.getElementById(\"distInputA\")?.value||\"\")+\"\\n\\n\"+(document.getElementById(\"distInputB\")?.value||\"\") });\n  setTimeout(()=>saveStudyAnswer(pct), 50);\n}\n\n// \u2500\u2500 SKIP \u2500\u2500\nfunction skipQuestion(isLast){\n  sessionResults.push({pct:0, qtype:currentQType});\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:false,skipped:true,pct:0};\n  const skipElapsed=stampQuestion();\n  logQuestion(0,skipElapsed,undefined,undefined,true);\n  renderNavBar();\n  const panel=document.getElementById(\"resultPanel\");\n  panel.classList.add(\"visible\");\n  panel.innerHTML=`<div class=\"score-stamp\"><div class=\"score-circle poor\">0%<\u002Fdiv><div><div class=\"score-label\">Skipped<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  if(document.getElementById(\"answerArea\")) document.getElementById(\"answerArea\").style.display=\"none\";\n  if(document.getElementById(\"checkBtn\")) document.getElementById(\"checkBtn\").disabled=true;\n  // Disable single or dual textareas\n  [\"answerInput\",\"distInputA\",\"distInputB\"].forEach(id=>{\n    const el=document.getElementById(id);\n    if(el) el.disabled=true;\n  });\n  const peekBtnEl=document.getElementById(\"mainPeekBtn\");\n  if(peekBtnEl) peekBtnEl.disabled=true;\n  hidePeek();\n  const _br=document.getElementById(\"btnRow\"); if(_br) _br.style.display=\"flex\";\n}\n\n// \u2500\u2500 HIDE PEEK BUTTON & PANEL \u2500\u2500\nfunction hidePeek(){\n  const btn=document.querySelector(\".btn-peek\");\n  const panel=document.getElementById(\"peekPanel\");\n  if(btn)   btn.style.display=\"none\";\n  if(panel) panel.style.display=\"none\";\n}\n\n// \u2500\u2500 TRY AGAIN (single question) \u2500\u2500\nlet previousAttempts = {}; // key: lessonId+\":\"+qtype+\":\"+qIndex \u2192 {type, userText/userTextA/userTextB}\nlet hintsUsedByQuestion = {}; // key: same as previousAttempts \u2192 number of times the answer was peeked at\nconst MAX_HINTS = 2; // two peeks per question \u2014 a limit, but a score-free one (see below)\n\n// The score penalty is permanently removed \u2014 it was discouraging him from\n// using View Model Answer at all, even when actually looking at it would\n// have helped him learn, which was the opposite of the intent. Peeking\n// NEVER affects the score, no matter how many times. The count is kept\n// capped at MAX_HINTS purely so it stays a genuine \"I need help\" moment\n// rather than something to click through absentmindedly \u2014 but that limit\n// carries no penalty of any kind once it's reached.\nfunction applyHintPenalty(rawPct, hintsUsed){\n  return rawPct;\n}\n\nfunction getPrevAttemptKey(idx){\n  return (currentLesson?.id||\"\")+\":\"+currentQType+\":\"+idx;\n}\n\n// Shared by every \"View Model Answer\" button \u2014 same label logic everywhere,\n// so the free-but-limited messaging can't drift out of sync between spots.\nfunction peekButtonState(used){\n  const left = MAX_HINTS - used;\n  return {\n    disabled: left<=0,\n    label: left<=0 ? \"No peeks left\" : `\ud83d\udc41 View Model Answer (free \u2014 ${left} left)`\n  };\n}\n\nfunction tryAgainQuestion(){\n  // Save the previous attempt (with mistakes) before clearing, so it can be shown\n  // alongside the model answer when the student tries again.\n  const cached = studyAnswerCache && studyAnswerCache[currentQIndex];\n  const key = getPrevAttemptKey(currentQIndex);\n  if(cached){\n    const ta = document.getElementById(\"answerInput\");\n    const da = document.getElementById(\"distInputA\");\n    if(ta){\n      previousAttempts[key] = { type:\"text\", userText: ta.value||\"\" };\n    } else if(da){\n      const db = document.getElementById(\"distInputB\");\n      previousAttempts[key] = { type:\"distinguish\", userTextA: da.value||\"\", userTextB: db?.value||\"\" };\n    }\n  }\n  // Remove the last result so retry replaces it (not adds to it)\n  if(sessionResults.length > currentQIndex) sessionResults.splice(currentQIndex, 1);\n  if(questionStates[currentQIndex]) questionStates[currentQIndex]={answered:false,skipped:false,pct:null};\n  if(studyAnswerCache && studyAnswerCache[currentQIndex]!==undefined) studyAnswerCache[currentQIndex]=null;\n  // Clear hint/peek state too \u2014 a fresh attempt gets fresh peeks, same as the\n  // fresh score and fresh answer text it already gets.\n  delete hintsUsedByQuestion[key];\n  console.log(\"tryAgain: cleared peeks for\", key, \"hintsUsedByQuestion now:\", JSON.stringify(hintsUsedByQuestion));\n  mcqSelected=null;\n  matchAnswers={};\n  renderCurrentQuestion();\n}\n\n// \u2500\u2500 NEXT \u2500\u2500\nlet _mockNavLock = false;\nfunction nextQuestion(){\n  // Practice test flow\n  if(currentLesson.id===\"__mock__\"){\n    if(_mockNavLock) return;\n    _mockNavLock = true;\n    setTimeout(()=>{ _mockNavLock=false; }, 300);\n    // Score current question from DOM if not already recorded\n    scoreMockCurrentQuestion();\n    saveMockAnswer(mockQIndex);\n    if(mockExamStates[mockQIndex] && !mockExamStates[mockQIndex].answered){\n      mockExamStates[mockQIndex]={answered:false,skipped:true,pct:null};\n    }\n    if(mockQIndex>=mockQuestions.length-1){\n      // Reached the last question \u2014 don't auto-submit, ask for confirmation\n      submitMockExam();\n      return;\n    }\n    mockQIndex++;\n    mcqSelected=null; matchAnswers={};\n    document.getElementById(\"quizBody\").style.display=\"block\";\n    renderMockQuestion();\n    setTimeout(()=>restoreMockAnswer(mockQIndex),0);\n    return;\n  }\n  const total=(currentLesson.questions[currentQType]||[]).length;\n  const nxt = nextReachableIndex(currentQIndex+1, 1, total);\n  if(currentQIndex>=total-1 || nxt===-1){ showSummary(); return; }\n  currentQIndex = nxt;\n  mcqSelected=null; matchAnswers={};\n  renderCurrentQuestion();\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  MOCK EXAM\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet mockExamStates = []; // {answered, skipped, pct} per mock question index\nlet mockSavedAnswers = []; // saved user answer per mock question index\nlet mockSelected  = new Set();   // lesson ids\nlet mockQTypes    = new Set([\"mcq\",\"fill\",\"match\",\"brief\",\"truefalse\",\"reasons\",\"distinguish\",\"paragraph\"]);\nlet mockQuestions = [];          // flat list of {q, qtype, lesson} objects\nlet mockQIndex    = 0;\nlet isLessonTest  = false;       // true when this run is a single-lesson Test, not a multi-lesson Practice Test\nlet lessonTestLesson = null;     // the lesson being tested, when isLessonTest is true\n\nfunction openMockExam(){\n  isLessonTest = false;\n  lessonTestLesson = null;\n  mockSubject = getVisibleData()[currentSubject] ? currentSubject : Object.keys(getVisibleData())[0];\n  mockSelected.clear();\n  // Reset all qtypes to selected by default each time\n  mockQTypes = new Set(allowedQTypes().map(qt=>qt.id).filter(id=>id!==\"memorise\"));\n  renderMockModal();\n  document.getElementById(\"mockExamModal\").classList.remove(\"hidden\");\n}\nfunction closeMockExam(){\n  document.getElementById(\"mockExamModal\").classList.add(\"hidden\");\n}\n\nfunction renderMockModal(){\n  const visData = getVisibleData();\n  // Subject tabs\n  const tabsEl = document.getElementById(\"mockSubjectTabs\");\n  tabsEl.innerHTML = Object.keys(visData).map(s=>\n    `<button class=\"mock-subj-tab${s===mockSubject?\" active\":\"\"}\" onclick=\"switchMockSubject('${s}')\">${visData[s].icon} ${s}<\u002Fbutton>`\n  ).join(\"\");\n\n  // Lesson list grouped by part\n  const listEl = document.getElementById(\"mockLessonList\");\n  listEl.innerHTML = \"\";\n  Object.entries(visData[mockSubject].parts).forEach(([partName, partData])=>{\n    const group = document.createElement(\"div\");\n    group.className = \"mock-part-group\";\n    const allIds = partData.lessons.map(l=>l.id);\n    const allChecked = allIds.every(id=>mockSelected.has(id));\n    group.innerHTML = `<div class=\"mock-part-name\">${partData.icon||\"\"} ${partName}\n      <button onclick=\"toggleMockPart(${JSON.stringify(allIds)},${!allChecked})\">${allChecked?\"Deselect all\":\"Select all\"}<\u002Fbutton>\n    <\u002Fdiv>`;\n    partData.lessons.forEach(lesson=>{\n      const totalQ = Object.entries(lesson.questions)\n        .filter(([qt])=>mockQTypes.has(qt))\n        .reduce((a,[,arr])=>a+arr.length, 0);\n      const item = document.createElement(\"label\");\n      item.className = \"mock-lesson-item\";\n      item.innerHTML = `\n        <input type=\"checkbox\" id=\"mock_${lesson.id}\" ${mockSelected.has(lesson.id)?\"checked\":\"\"}\n          onchange=\"toggleMockLesson('${lesson.id}',this.checked)\">\n        <span class=\"mock-lesson-name\">${lesson.unit} \u2014 ${lesson.title}<\u002Fspan>\n        <span class=\"mock-lesson-qcount\">${totalQ}q<\u002Fspan>`;\n      group.appendChild(item);\n    });\n    listEl.appendChild(group);\n  });\n\n  // QType chips\n  const chipsEl = document.getElementById(\"mockQTypeChips\");\n  chipsEl.innerHTML = QTYPES.map(qt=>\n    `<button class=\"mock-qtype-chip${mockQTypes.has(qt.id)?\" active\":\"\"}\"\n      onclick=\"toggleMockQType('${qt.id}')\">${qt.icon} ${qt.label}<\u002Fbutton>`\n  ).join(\"\");\n\n  updateMockCount();\n}\n\nfunction switchMockSubject(subj){\n  mockSubject = subj;\n  mockSelected.clear();\n  renderMockModal();\n}\n\nfunction toggleMockLesson(id, on){\n  if(on) mockSelected.add(id); else mockSelected.delete(id);\n  updateMockCount();\n  renderMockModal();\n}\n\nfunction toggleMockPart(ids, on){\n  ids.forEach(id=>{ if(on) mockSelected.add(id); else mockSelected.delete(id); });\n  updateMockCount();\n  renderMockModal();\n}\n\nfunction toggleMockQType(qt){\n  if(mockQTypes.has(qt)) mockQTypes.delete(qt); else mockQTypes.add(qt);\n  updateMockCount();\n  renderMockModal();\n}\n\nfunction updateMockCount(){\n  let total = 0;\n  mockSelected.forEach(id=>{\n    const lesson = findLessonById(id);\n    if(!lesson) return;\n    QTYPES.forEach(qt=>{\n      if(!mockQTypes.has(qt.id)) return;\n      total += (lesson.questions[qt.id]||[]).length;\n    });\n  });\n  const countEl = document.getElementById(\"mockCount\");\n  if(countEl) countEl.textContent = total\n    ? `${total} question${total!==1?\"s\":\"\"} from ${mockSelected.size} lesson${mockSelected.size!==1?\"s\":\"\"}`\n    : \"Select at least one lesson to begin\";\n  const startBtn = document.getElementById(\"startMockBtn\");\n  if(startBtn) startBtn.disabled = total===0;\n}\n\nfunction findLessonById(id){\n  for(const subj of Object.values(DATA))\n    for(const part of Object.values(subj.parts))\n      for(const lesson of part.lessons)\n        if(lesson.id===id) return lesson;\n  return null;\n}\n\n// Whether (lessonId, qtype, qIndex) still points at a real question in the\n// CURRENT syllabus. Content gets edited over time through the admin CRUD\n// tool -- questions get added, removed, reordered -- so a qIndex a student\n// answered against a year ago can easily no longer correspond to anything\n// (or to a completely different question) today. Coverage-style \"how many\n// distinct questions has he covered out of the total available\" counts must\n// only count keys that are still valid, or the numerator can end up bigger\n// than the denominator (e.g. \"276/246\") once enough edits have piled up.\n// Historical score/streak/trend stats deliberately do NOT use this check --\n// those should keep every real attempt exactly as it happened, regardless\n// of later content edits.\nfunction questionExists(lessonId, qtype, qIndex){\n  const lesson = findLessonById(lessonId);\n  if(!lesson || !lesson.questions || !lesson.questions[qtype]) return false;\n  return typeof qIndex === \"number\" && qIndex >= 0 && qIndex < lesson.questions[qtype].length;\n}\n\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n//  CONTENT-EDIT INVALIDATION \u2014 fixes a sharper version of the bug above.\n//  questionExists() only catches indices that fell OFF the end of the\n//  array. Deleting a question from the MIDDLE (arr.splice) shifts every\n//  question AFTER it down by one index -- so a mastery/answered record\n//  logged against index 5 (the old question) silently becomes a record\n//  for whatever NEW question now sits at index 5, which may never have\n//  been attempted at all. This is exactly the \"delete a question, the\n//  question now at that number shows Mastered\" bug.\n//\n//  Fix: whenever the admin deletes a question, remember the lesson+qtype\n//  and the earliest index that shifted, with a timestamp. Any historical\n//  entry at or after that index, logged BEFORE that timestamp, can no\n//  longer be trusted to refer to the question currently at that position\n//  -- so it's excluded from mastery/answered/coverage tracking. Entries\n//  from AFTER the edit (re-attempts of whatever's there now) count fine.\n//  Adding a question never triggers this -- the editor only ever appends\n//  to the end (see submitQuestionEditor), which never shifts anything.\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nlet _contentEditMarkers = {}; // \"lessonId_qtype\" -> { minIndex, ts }\nlet _contentEditMarkersLoaded = false;\n\nasync function loadContentEditMarkers(){\n  if(_contentEditMarkersLoaded) return;\n  if(!window._fb || !currentUserPhone) return;\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"questionContentEdits\"));\n    if(snap.exists()) _contentEditMarkers = snap.data() || {};\n  }catch(e){ console.log(\"loadContentEditMarkers failed:\", e.message); }\n  _contentEditMarkersLoaded = true;\n}\n\n// Called right after a question delete succeeds. Merges into whatever's\n// already recorded for this lesson+qtype -- minIndex only ever moves\n// earlier (the earliest position ever disrupted), ts only ever moves later.\nasync function recordQuestionContentEdit(lessonId, qtype, fromIndex){\n  if(!window._fb || !currentUserPhone) return;\n  await loadContentEditMarkers(); // merge into the latest, don't clobber other keys with a stale in-memory copy\n  const key = lessonId+\"_\"+qtype;\n  const existing = _contentEditMarkers[key];\n  _contentEditMarkers[key] = {\n    minIndex: existing ? Math.min(existing.minIndex, fromIndex) : fromIndex,\n    ts: Date.now()\n  };\n  try{\n    const { db, doc, setDoc } = window._fb;\n    await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"questionContentEdits\"), _contentEditMarkers);\n  }catch(e){ console.log(\"recordQuestionContentEdit failed:\", e.message); }\n}\n\n// The actual check used everywhere mastery/answered/coverage keys get built.\n// entryTs must be a millisecond number (already resolved from whatever\n// Firestore timestamp shape the caller has).\nfunction isMasteryKeyStillValid(lessonId, qtype, qIndex, entryTs){\n  if(!questionExists(lessonId, qtype, qIndex)) return false;\n  const marker = _contentEditMarkers[lessonId+\"_\"+qtype];\n  if(marker && qIndex >= marker.minIndex && entryTs < marker.ts) return false;\n  return true;\n}\n\n// Looks up which top-level subject (Science / Social Science / English) a\n// given lesson id belongs to \u2014 needed because practice test log entries only\n// store the lessonId, not the subject name directly.\nfunction findSubjectForLesson(lessonId){\n  for(const [subjName, subj] of Object.entries(DATA))\n    for(const part of Object.values(subj.parts))\n      for(const lesson of part.lessons)\n        if(lesson.id===lessonId) return subjName;\n  return \"\";\n}\n\n// Counts every individual question across the entire syllabus, regardless of subject/unit.\n// Used as the denominator for the \"coverage\" component of the Growth Score \u2014 this is what\n// actually rewards trying new material over re-doing the same few easy questions.\nfunction countTotalAvailableQuestions(){\n  let total = 0;\n  for(const subj of Object.values(DATA))\n    for(const part of Object.values(subj.parts))\n      for(const lesson of part.lessons)\n        for(const qtype of Object.keys(lesson.questions||{}))\n          total += (lesson.questions[qtype]||[]).length;\n  return total;\n}\n\n// Same as above but bucketed by question type (\"heading\") instead of\n// summed \u2014 used to show unique-questions-studied per heading (MCQ, Fill,\n// Match, etc.) in Study Insights, independent of which subject/lesson they\n// came from.\nfunction countAvailableQuestionsByQtype(){\n  const byQtype = {};\n  for(const subj of Object.values(DATA))\n    for(const part of Object.values(subj.parts))\n      for(const lesson of part.lessons)\n        for(const qtype of Object.keys(lesson.questions||{})){\n          const n = (lesson.questions[qtype]||[]).length;\n          byQtype[qtype] = (byQtype[qtype]||0) + n;\n        }\n  return byQtype;\n}\n\n// Same as above but scoped to one subject \u2014 used to compute Coverage % per\n// subject for the scoreboard's per-subject breakdown.\nfunction countAvailableQuestionsForSubject(subjectName){\n  const subj = DATA[subjectName];\n  if(!subj) return 0;\n  let total = 0;\n  for(const part of Object.values(subj.parts))\n    for(const lesson of part.lessons)\n      for(const qtype of Object.keys(lesson.questions||{}))\n        total += (lesson.questions[qtype]||[]).length;\n  return total;\n}\n\n// Builds a Coverage/Mastery/Attempts breakdown per subject, from the same\n// flat allScoredEntries list already used for the main Growth Score \u2014 splits\n// by the `subject` field every log entry already carries. Goals (Daily Goal,\n// Morning/Evening, Growth Points) stay unified across subjects by design;\n// this is purely a \"where is he strong/weak\" view, not a separate goal system.\nfunction calcSubjectBreakdown(allScoredEntries){\n  const subjectNames = Object.keys(DATA);\n  return subjectNames.map(name=>{\n    const entries = allScoredEntries.filter(e=>e.subject===name);\n    // Same validity check as aggregateScoreboardData's allUnique -- only\n    // currently-existing, not-since-shifted questions count toward coverage,\n    // so a heavily re-edited lesson can't push the numerator past the\n    // denominator, or credit a deleted-and-shifted position as covered.\n    const uniqueKeys = new Set(entries.filter(e=>isMasteryKeyStillValid(e.lessonId, e.qtype, e.qIndex, e.ts)).map(e=>`${e.lessonId}|${e.qtype}|${e.qIndex}`));\n    const totalAvailable = countAvailableQuestionsForSubject(name);\n    const coverage = totalAvailable>0 ? Math.min(100, Math.round((uniqueKeys.size/totalAvailable)*100)) : 0;\n    const timeMs = entries.reduce((a,e)=>a+(e.timeMs||0),0);\n\n    let mastery = 0;\n    if(entries.length){\n      let earned=0, possible=0;\n      entries.forEach(e=>{\n        const m = getMarks(e.qtype||\"mcq\");\n        possible += m;\n        earned += m*(e.pct/100);\n      });\n      mastery = possible>0 ? Math.round((earned/possible)*100) : 0;\n    }\n\n    const icon = DATA[name]?.icon || \"\ud83d\udcd8\";\n    return { name, icon, coverage, mastery, attempts: entries.length, uniqueCount: uniqueKeys.size, totalAvailable, timeMs };\n  }).filter(s=>s.attempts>0 || s.totalAvailable>0); // skip subjects with literally nothing in them\n}\n\n// Tests the ENTIRE lesson in one go \u2014 every question, every type \u2014 as a single\n// timed, no-peek attempt. Reuses the same exam engine as Practice Test, just\n// auto-scoped to one lesson instead of a multi-lesson picker, and tagged so\n// completion awards Test-specific bonus points instead of just a score.\nfunction startLessonTest(lessonId){\n  const lesson = findLessonById(lessonId);\n  if(!lesson) return;\n\n\n\n\n\n\n\n  // Show pre-test popup explaining points before starting\n  showLessonTestIntroPopup(lesson, function(){\n    isLessonTest = true;\n    lessonTestLesson = lesson;\n    mockSubject = currentSubject;\n    mockSelected = new Set([lessonId]);\n    mockQTypes = new Set(allowedQTypes().map(qt=>qt.id));\n    startMockExam();\n    const _qlt=document.getElementById(\"quizLessonTitle\");\n    if(_qlt) _qlt.textContent = `\ud83e\uddea Test \u2014 ${lesson.title}`;\n    const _qpl2=document.getElementById(\"quizPartLabel\");\n    if(_qpl2) _qpl2.textContent = `Full lesson test \u00b7 ${mockQuestions.length} questions`;\n  });\n}\n\nfunction closeLessonTestPopup(){\n  var el = document.getElementById(\"lessonTestPopup\");\n  if(el) el.remove();\n}\n\nfunction showLessonTestBlockedPopup(lesson){\n  const ov = document.createElement(\"div\");\n  ov.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  ov.innerHTML = '<div style=\"background:#fff;border-radius:16px;padding:24px 20px;max-width:320px;width:100%;text-align:center\">'\n    +'<div style=\"font-size:36px;margin-bottom:10px\">\ud83d\udd12<\u002Fdiv>'\n    +'<div style=\"font-size:16px;font-weight:800;color:var(--navy);margin-bottom:8px\">Lesson Test Locked<\u002Fdiv>'\n    +'<div style=\"font-size:13px;color:var(--muted);margin-bottom:16px\">The lesson test for <b>'+lesson.title+'<\u002Fb> is not available yet \u2014 more questions are still being added. Check back soon!<\u002Fdiv>'\n    +'<button onclick=\"closeLessonTestPopup()\" style=\"padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer\">OK<\u002Fbutton>'\n  +'<\u002Fdiv>';\n  document.body.appendChild(ov);\n  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };\n}\n\nfunction showLessonTestIntroPopup(lesson, onStart){\n  const totalQ = Object.values(lesson.questions).reduce(function(a,arr){return a+arr.length;},0);\n  const isComplete = !!_completeLessons[lesson.id];\n  const ov = document.createElement(\"div\");\n  ov.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  ov.innerHTML = '<div style=\"background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px;max-width:320px;width:100%;text-align:center\">'\n    +'<div style=\"font-size:36px;margin-bottom:10px\">\ud83e\uddea<\u002Fdiv>'\n    +'<div style=\"font-size:16px;font-weight:800;margin-bottom:4px\">'+lesson.title+'<\u002Fdiv>'\n    +'<div style=\"font-size:12px;opacity:.6;margin-bottom:16px\">Lesson Test \u00b7 '+totalQ+' questions \u00b7 no peeking<\u002Fdiv>'\n    +(isComplete\n      ? '<div style=\"background:rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left\"><div style=\"font-size:11px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px\">Points you can earn<\u002Fdiv><div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><span style=\"font-size:13px\">Score 60%+<\u002Fspan><span style=\"font-size:13px;font-weight:800;color:var(--gold)\">+300 pts<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><span style=\"font-size:13px\">Score 80%+<\u002Fspan><span style=\"font-size:13px;font-weight:800;color:var(--gold)\">+500 pts<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:13px\">Score 100%<\u002Fspan><span style=\"font-size:13px;font-weight:800;color:var(--gold)\">+700 pts<\u002Fspan><\u002Fdiv><\u002Fdiv>'\n      : '<div style=\"background:rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left\"><div style=\"font-size:12px;color:rgba(255,255,255,.5)\">\ud83d\udcdd Practice run \u2014 no points yet<\u002Fdiv><div style=\"font-size:11px;color:rgba(255,255,255,.35);margin-top:4px\">Points unlock once this lesson is fully ready<\u002Fdiv><\u002Fdiv>'\n    )\n    +'<div style=\"font-size:11px;opacity:.5;margin-bottom:16px\">No peeking allowed \u2014 answers are scored automatically<\u002Fdiv>'\n    +'<div style=\"display:flex;gap:8px\">'\n      +'<button onclick=\"closeLessonTestPopup()\" style=\"flex:1;padding:11px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-weight:700;font-size:13px;cursor:pointer\">Cancel<\u002Fbutton>'\n      +'<button id=\"lessonTestStartBtn\" style=\"flex:2;padding:11px;background:var(--gold,#d1983f);color:var(--navy);border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer\">Start Test \u2192<\u002Fbutton>'\n    +'<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  ov.id = \"lessonTestPopup\";\n  document.body.appendChild(ov);\n  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };\n  document.getElementById(\"lessonTestStartBtn\").onclick = function(){\n    ov.remove();\n    onStart();\n  };\n}\n\nfunction startMockExam(){\n  // Build flat question list from all selected lessons + qtypes IN ORDER\n  mockQuestions = [];\n  mockSelected.forEach(id=>{\n    const lesson = findLessonById(id);\n    if(!lesson) return;\n    QTYPES.forEach(qt=>{\n      if(!mockQTypes.has(qt.id)) return;\n      (lesson.questions[qt.id]||[]).forEach((q, qi)=>{\n        if(isQuestionHiddenByFocus(lesson.id, qt.id, qi)) return; // mastered, and Focus Mode is set to what's left\n        mockQuestions.push({q, qtype:qt.id, lesson, qtLabel:qt.label});\n      });\n    });\n  });\n  mockQIndex = 0;\n  mockExamStates = Array.from({length:mockQuestions.length},()=>({answered:false,skipped:false,pct:null}));\n  mockSavedAnswers = Array.from({length:mockQuestions.length},()=>null);\n  // Each practice test attempt gets its own ID, separate from the page-load sessionId \u2014\n  // otherwise multiple exams taken in one sitting would collapse into a single group.\n  currentMockExamId = \"exam_\" + Date.now() + \"_\" + Math.random().toString(36).slice(2,8);\n  closeMockExam();\n  startTimer();\n\n  // Reuse the quiz overlay in exam mode\n  currentMode = \"exam\";\n  examAnswers.length = 0; // clear in place \u2014 reassigning would lose the Firestore-sync override on .push\n  sessionResults = [];\n  questionStates = Array.from({length:mockQuestions.length},()=>({answered:false,skipped:false,pct:null}));\n\n  const ov = document.getElementById(\"quizOverlay\");\n  ov.classList.add(\"visible\");\n  ov.scrollTo(0,0);\n  const _qlt=document.getElementById(\"quizLessonTitle\"); if(_qlt) _qlt.textContent=`\ud83d\udcdd Practice Test \u2014 ${mockSubject}`;\n  const _qpl2=document.getElementById(\"quizPartLabel\"); if(_qpl2) _qpl2.textContent=`${mockSelected.size} lesson${mockSelected.size!==1?\"s\":\"\"} \u00b7 ${mockQuestions.length} questions`;\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n  const _mb=document.getElementById(\"modeBadge\"); if(_mb) _mb.textContent=\"Exam\";\n  const _mc=document.getElementById(\"modeBadge\"); if(_mc) _mc.className=\"mode-badge exam\";\n  document.getElementById(\"progressFill\").style.width = \"0%\";\n  const _mt=document.getElementById(\"modeToggle\");\n  if(_mt) _mt.style.display=\"none\";\n  const msb=document.getElementById(\"mockSubmitBar\");\n  if(msb) msb.style.display=\"flex\";\n\n  // Set up a virtual lesson for mock mode\n  currentLesson = {\n    id:\"__mock__\",\n    title:\"Practice Test\",\n    questions: buildMockQuestionsMap()\n  };\n  currentQType = mockQuestions[0].qtype;\n  renderMockQuestion();\n}\n\n// Wrap a single question so existing render/check functions work\nfunction buildSingleQ(qtype, q){\n  const map={};\n  QTYPES.forEach(qt=>{ map[qt.id]=[]; });\n  map[qtype]=[q];\n  return map;\n}\nfunction buildMockQuestionsMap(){ return {}; } // legacy stub\n\nfunction renderMockQuestion(){\n  if(mockQIndex>=mockQuestions.length){ showMockResults(); return; }\n  const item=mockQuestions[mockQIndex];\n  const total=mockQuestions.length;\n  const isLast=mockQIndex>=total-1;\n  const qnum=`Question ${mockQIndex+1} of ${total}`;\n\n  // Update UI\n  document.getElementById(\"progressFill\").style.width=`${(mockQIndex/total)*100}%`;\n  const _qc=document.getElementById(\"qCounter\"); if(_qc) _qc.textContent=`${mockQIndex+1} / ${total}`;\n  const _qpl=document.getElementById(\"quizPartLabel\"); if(_qpl) _qpl.textContent=`${item.lesson.unit} \u2014 ${item.lesson.tit
