9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  ov.innerHTML = '<div style=\"background:#fff;border-radius:16px;padding:24px 20px;max-width:320px;width:100%;text-align:center\">'\n    +'<div style=\"font-size:36px;margin-bottom:10px\">🔒<\u002Fdiv>'\n    +'<div style=\"font-size:16px;font-weight:800;color:var(--navy);margin-bottom:8px\">Lesson Test Locked<\u002Fdiv>'\n    +'<div style=\"font-size:13px;color:var(--muted);margin-bottom:16px\">The lesson test for <b>'+lesson.title+'<\u002Fb> is not available yet — more questions are still being added. Check back soon!<\u002Fdiv>'\n    +'<button onclick=\"closeLessonTestPopup()\" style=\"padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer\">OK<\u002Fbutton>'\n  +'<\u002Fdiv>';\n  document.body.appendChild(ov);\n  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };\n}\n\nfunction showLessonTestIntroPopup(lesson, onStart){\n  const totalQ = Object.values(lesson.questions).reduce(function(a,arr){return a+arr.length;},0);\n  const isComplete = !!_completeLessons[lesson.id];\n  const ov = document.createElement(\"div\");\n  ov.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  ov.innerHTML = '<div style=\"background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px;max-width:320px;width:100%;text-align:center\">'\n    +'<div style=\"font-size:36px;margin-bottom:10px\">🧪<\u002Fdiv>'\n    +'<div style=\"font-size:16px;font-weight:800;margin-bottom:4px\">'+lesson.title+'<\u002Fdiv>'\n    +'<div style=\"font-size:12px;opacity:.6;margin-bottom:16px\">Lesson Test · '+totalQ+' questions · no peeking<\u002Fdiv>'\n    +(isComplete\n      ? '<div style=\"background:rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left\"><div style=\"font-size:11px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px\">Points you can earn<\u002Fdiv><div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><span style=\"font-size:13px\">Score 60%+<\u002Fspan><span style=\"font-size:13px;font-weight:800;color:var(--gold)\">+300 pts<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><span style=\"font-size:13px\">Score 80%+<\u002Fspan><span style=\"font-size:13px;font-weight:800;color:var(--gold)\">+500 pts<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:13px\">Score 100%<\u002Fspan><span style=\"font-size:13px;font-weight:800;color:var(--gold)\">+700 pts<\u002Fspan><\u002Fdiv><\u002Fdiv>'\n      : '<div style=\"background:rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left\"><div style=\"font-size:12px;color:rgba(255,255,255,.5)\">📝 Practice run — no points yet<\u002Fdiv><div style=\"font-size:11px;color:rgba(255,255,255,.35);margin-top:4px\">Points unlock once this lesson is fully ready<\u002Fdiv><\u002Fdiv>'\n    )\n    +'<div style=\"font-size:11px;opacity:.5;margin-bottom:16px\">No peeking allowed — answers are scored automatically<\u002Fdiv>'\n    +'<div style=\"display:flex;gap:8px\">'\n      +'<button onclick=\"closeLessonTestPopup()\" style=\"flex:1;padding:11px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-weight:700;font-size:13px;cursor:pointer\">Cancel<\u002Fbutton>'\n      +'<button id=\"lessonTestStartBtn\" style=\"flex:2;padding:11px;background:var(--gold,#d1983f);color:var(--navy);border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer\">Start Test →<\u002Fbutton>'\n    +'<\u002Fdiv>'\n  +'<\u002Fdiv>';\n  ov.id = \"lessonTestPopup\";\n  document.body.appendChild(ov);\n  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };\n  document.getElementById(\"lessonTestStartBtn\").onclick = function(){\n    ov.remove();\n    onStart();\n  };\n}\n\nfunction startMockExam(){\n  // Build flat question list from all selected lessons + qtypes IN ORDER\n  mockQuestions = [];\n  mockSelected.forEach(id=>{\n    const lesson = findLessonById(id);\n    if(!lesson) return;\n    QTYPES.forEach(qt=>{\n      if(!mockQTypes.has(qt.id)) return;\n      (lesson.questions[qt.id]||[]).forEach(q=>{\n        mockQuestions.push({q, qtype:qt.id, lesson, qtLabel:qt.label});\n      });\n    });\n  });\n  mockQIndex = 0;\n  mockExamStates = Array.from({length:mockQuestions.length},()=>({answered:false,skipped:false,pct:null}));\n  mockSavedAnswers = Array.from({length:mockQuestions.length},()=>null);\n  // Each practice test attempt gets its own ID, separate from the page-load sessionId —\n  // otherwise multiple exams taken in one sitting would collapse into a single group.\n  currentMockExamId = \"exam_\" + Date.now() + \"_\" + Math.random().toString(36).slice(2,8);\n  closeMockExam();\n  startTimer();\n\n  // Reuse the quiz overlay in exam mode\n  currentMode = \"exam\";\n  examAnswers.length = 0; // clear in place — reassigning would lose the Firestore-sync override on .push\n  sessionResults = [];\n  questionStates = Array.from({length:mockQuestions.length},()=>({answered:false,skipped:false,pct:null}));\n\n  const ov = document.getElementById(\"quizOverlay\");\n  ov.classList.add(\"visible\");\n  ov.scrollTo(0,0);\n  const _qlt=document.getElementById(\"quizLessonTitle\"); if(_qlt) _qlt.textContent=`📝 Practice Test — ${mockSubject}`;\n  const _qpl2=document.getElementById(\"quizPartLabel\"); if(_qpl2) _qpl2.textContent=`${mockSelected.size} lesson${mockSelected.size!==1?\"s\":\"\"} · ${mockQuestions.length} questions`;\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n  const _mb=document.getElementById(\"modeBadge\"); if(_mb) _mb.textContent=\"Exam\";\n  const _mc=document.getElementById(\"modeBadge\"); if(_mc) _mc.className=\"mode-badge exam\";\n  document.getElementById(\"progressFill\").style.width = \"0%\";\n  const _mt=document.getElementById(\"modeToggle\");\n  if(_mt) _mt.style.display=\"none\";\n  const msb=document.getElementById(\"mockSubmitBar\");\n  if(msb) msb.style.display=\"flex\";\n\n  // Set up a virtual lesson for mock mode\n  currentLesson = {\n    id:\"__mock__\",\n    title:\"Practice Test\",\n    questions: buildMockQuestionsMap()\n  };\n  currentQType = mockQuestions[0].qtype;\n  renderMockQuestion();\n}\n\n// Wrap a single question so existing render/check functions work\nfunction buildSingleQ(qtype, q){\n  const map={};\n  QTYPES.forEach(qt=>{ map[qt.id]=[]; });\n  map[qtype]=[q];\n  return map;\n}\nfunction buildMockQuestionsMap(){ return {}; } // legacy stub\n\nfunction renderMockQuestion(){\n  if(mockQIndex>=mockQuestions.length){ showMockResults(); return; }\n  const item=mockQuestions[mockQIndex];\n  const total=mockQuestions.length;\n  const isLast=mockQIndex>=total-1;\n  const qnum=`Question ${mockQIndex+1} of ${total}`;\n\n  // Update UI\n  document.getElementById(\"progressFill\").style.width=`${(mockQIndex/total)*100}%`;\n  const _qc=document.getElementById(\"qCounter\"); if(_qc) _qc.textContent=`${mockQIndex+1} / ${total}`;\n  const _qpl=document.getElementById(\"quizPartLabel\"); if(_qpl) _qpl.textContent=`${item.lesson.unit} — ${item.lesson.title} · ${item.qtLabel}`;\n  const body=document.getElementById(\"quizBody\");\n  body.style.display=\"block\";\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n  document.getElementById(\"quizOverlay\").scrollTo(0,0);\n  // Clear any leftover result feedback from the previous question\n  const _rp=document.getElementById(\"resultPanel\");\n  if(_rp){ _rp.classList.remove(\"visible\"); _rp.innerHTML=\"\"; }\n  const _br=document.getElementById(\"btnRow\");\n  if(_br) _br.style.display=\"none\";\n\n  currentQType=item.qtype;\n  currentQIndex=0;\n  mcqSelected=null; matchAnswers={};\n  currentMode=\"exam\"; // ensure exam mode for every question render\n\n  fbLiveState({\n    mode: \"mock\",\n    lessonId: item.lesson.id,\n    lessonTitle: item.lesson.title,\n    qtype: item.qtype,\n    qIndex: mockQIndex,\n    qTotal: total,\n    questionText: item.q?.q || item.q?.sentence || item.q?.statement || \"\",\n    correctAnswer: item.q?.answer || (item.q?.answers||[]).join(\" / \") || \"\",\n    currentAnswer: \"\",\n    answered: mockExamStates[mockQIndex]?.answered || false,\n    peeksUsedThisQuestion: 0\n  });\n  // Reset per-question timer\n  _questionStart=Date.now();\n  const qEl=document.getElementById(\"qTimer\");\n  if(qEl) qEl.textContent=\"0:00\";\n  const map={};\n  QTYPES.forEach(qt=>{ map[qt.id]=[]; });\n  map[item.qtype]=[item.q];\n  currentLesson={ id:\"__mock__\", title:item.lesson.title, questions:map };\n\n  // Update submit bar progress\n  const answered=mockExamStates.filter(s=>s.answered).length;\n  const sp=document.getElementById(\"mockSubmitProgress\");\n  if(sp) sp.textContent=`${answered} / ${mockQuestions.length} answered`;\n\n  // Render mock nav bar\n  renderMockNavBar();\n\n  // In practice test, always pass isLast=false — end detection happens in nextQuestion()\n  const renderIsLast = false;\n\n  // Render question\n  switch(item.qtype){\n    case \"mcq\":        renderMCQ(item.q, qnum, renderIsLast); break;\n    case \"fill\":       renderFill(item.q, qnum, renderIsLast); break;\n    case \"match\":      renderMatch(item.q, qnum, renderIsLast); break;\n    case \"brief\":      renderTextAnswer(item.q, qnum, renderIsLast, false); break;\n    case \"truefalse\":  renderTrueFalse(item.q, qnum, renderIsLast); break;\n    case \"reasons\":    renderTextAnswer(item.q, qnum, renderIsLast, false); break;\n    case \"distinguish\":renderDistinguish(item.q, qnum, renderIsLast); break;\n    case \"paragraph\":  renderTextAnswer(item.q, qnum, renderIsLast, true); break;\n    case \"memorise\":   renderMemorise(item.q, qnum, renderIsLast); break;\n  }\n}\n\nfunction renderMockNavBar(){\n  const bar=document.getElementById(\"qNavBar\");\n  if(!bar) return;\n  bar.style.display=\"flex\";\n  bar.innerHTML=\"\";\n  const total=mockQuestions.length;\n\n  // Prev button\n  const prev=document.createElement(\"button\");\n  prev.className=\"q-nav-prev\"; prev.textContent=\"‹\";\n  prev.title=\"Previous\";\n  prev.disabled=mockQIndex===0;\n  prev.onclick=()=>jumpMockQuestion(mockQIndex-1);\n  bar.appendChild(prev);\n\n  // Scrollable dots\n  const dotsWrap=document.createElement(\"div\");\n  dotsWrap.className=\"q-nav-dots-wrap\";\n\n  mockQuestions.forEach((_,i)=>{\n    const dot=document.createElement(\"div\");\n    dot.className=\"q-nav-dot\";\n    dot.textContent=i+1;\n    if(i===mockQIndex){\n      dot.classList.add(\"current\");\n    } else if(mockExamStates[i]?.answered){\n      const p=mockExamStates[i].pct;\n      dot.classList.add(p>=80?\"answered-good\":p>=50?\"answered-mid\":\"answered-poor\");\n    } else if(mockExamStates[i]?.skipped){\n      dot.classList.add(\"skipped\");\n    }\n    dot.onclick=()=>jumpMockQuestion(i);\n    dotsWrap.appendChild(dot);\n    if(i===mockQIndex) setTimeout(()=>dot.scrollIntoView({behavior:\"smooth\",block:\"nearest\",inline:\"center\"}),50);\n  });\n  bar.appendChild(dotsWrap);\n\n  // Next button\n  const next=document.createElement(\"button\");\n  next.className=\"q-nav-next\"; next.textContent=\"›\";\n  next.title=\"Next\";\n  next.disabled=mockQIndex>=total-1;\n  next.onclick=()=>jumpMockQuestion(mockQIndex+1);\n  bar.appendChild(next);\n}\n\nfunction markMockAnswered(pct){\n  if(!mockExamStates.length) return;\n  if(mockQIndex<0 || mockQIndex>=mockExamStates.length) return;\n  mockExamStates[mockQIndex]={answered:true,skipped:false,pct};\n  // Log to session report\n  const item=mockQuestions[mockQIndex];\n  if(item){\n    const clientId = currentSessionId+\"-\"+Date.now()+\"-\"+Math.random().toString(36).slice(2,8);\n    const entry = {\n      subject: mockSubject,\n      part: item.lesson.part||\"\",\n      lessonId: item.lesson.id,\n      lessonTitle: item.lesson.title,\n      qtype: item.qtype,\n      qIndex: \"mock:\"+mockQIndex,\n      pct, timeMs: Date.now()-_questionStart, clientId\n    };\n    sessionLog.push({...entry, ts: Date.now()});\n    fbLogEntry(\"logs\", entry);\n    const btn=document.getElementById(\"reportBtn\");\n    if(btn) btn.classList.add(\"visible\");\n  }\n  // Update submit bar progress\n  const answered=mockExamStates.filter(s=>s&&s.answered).length;\n  const sp=document.getElementById(\"mockSubmitProgress\");\n  if(sp) sp.textContent=`${answered} / ${mockQuestions.length} answered`;\n  // Re-render nav dots\n  renderMockNavBar();\n}\n\nfunction saveMockAnswer(idx){\n  const item = mockQuestions[idx];\n  if(!item) return;\n  let saved = null;\n  if(item.qtype===\"mcq\"){\n    // Find which option is selected\n    const sel = document.querySelector(\".mcq-option.selected\");\n    if(sel) saved = {type:\"mcq\", selectedIdx: [...document.querySelectorAll(\".mcq-option\")].indexOf(sel)};\n  } else if(item.qtype===\"truefalse\"){\n    const sel = document.querySelector(\"#tfopt0.selected, #tfopt1.selected\");\n    if(sel) saved = {type:\"truefalse\", val: sel.dataset.val};\n  } else if(item.qtype===\"fill\"){\n    const inputs = [...document.querySelectorAll(\".blank-input\")];\n    if(inputs.length) saved = {type:\"fill\", values: inputs.map(i=>i.value)};\n  } else if(item.qtype===\"match\"){\n    const sels = [...document.querySelectorAll(\".match-right-select\")];\n    if(sels.length) saved = {type:\"match\", values: sels.map(s=>s.value)};\n  } else if(item.qtype===\"distinguish\"){\n    const a = document.getElementById(\"distInputA\")?.value||\"\";\n    const b = document.getElementById(\"distInputB\")?.value||\"\";\n    if(a||b) saved = {type:\"distinguish\", a, b};\n  } else {\n    const ta = document.getElementById(\"answerInput\")?.value||\"\";\n    if(ta) saved = {type:\"text\", value: ta};\n  }\n  mockSavedAnswers[idx] = saved;\n}\n\nfunction restoreMockAnswer(idx){\n  const saved = mockSavedAnswers[idx];\n  if(!saved) return;\n  if(saved.type===\"mcq\"){\n    const opts = document.querySelectorAll(\".mcq-option\");\n    if(opts[saved.selectedIdx]) opts[saved.selectedIdx].classList.add(\"selected\");\n    mcqSelected = saved.selectedIdx; // restore JS state, not just DOM class\n    const eb = document.getElementById(\"examNextBtn\");\n    if(eb) eb.disabled = false;\n  } else if(saved.type===\"truefalse\"){\n    const el = document.getElementById(saved.val===\"true\"?\"tfopt0\":\"tfopt1\");\n    if(el) el.classList.add(\"selected\");\n    const eb = document.getElementById(\"examNextBtn\");\n    if(eb){ eb.disabled=false; eb.dataset.sel=saved.val; }\n  } else if(saved.type===\"fill\"){\n    saved.values.forEach((v,i)=>{ const inp=document.getElementById(\"blank\"+i); if(inp) inp.value=v; });\n  } else if(saved.type===\"match\"){\n    saved.values.forEach((v,i)=>{ const sel=document.getElementById(\"match\"+i); if(sel) sel.value=v; });\n  } else if(saved.type===\"distinguish\"){\n    const a=document.getElementById(\"distInputA\"); if(a) a.value=saved.a;\n    const b=document.getElementById(\"distInputB\"); if(b) b.value=saved.b;\n  } else if(saved.type===\"text\"){\n    const ta=document.getElementById(\"answerInput\"); if(ta) ta.value=saved.value;\n    // Enable Next button since user has typed content\n    const cb=document.getElementById(\"checkBtn\"); if(cb) cb.disabled=false;\n  }\n}\n\nfunction jumpMockQuestion(idx){\n  if(idx<0||idx>=mockQuestions.length) return;\n  if(_mockNavLock) return;\n  _mockNavLock = true;\n  setTimeout(()=>{ _mockNavLock=false; }, 300);\n  saveMockAnswer(mockQIndex);\n  scoreMockCurrentQuestion(); // score before leaving\n  mockQIndex=idx;\n  mcqSelected=null; matchAnswers={};\n  renderMockQuestion();\n  setTimeout(()=>restoreMockAnswer(idx), 0);\n}\n\nfunction scoreMockCurrentQuestion(){\n  try{\n  if(!mockExamStates[mockQIndex] || mockExamStates[mockQIndex].answered) return;\n  const item = mockQuestions[mockQIndex];\n  if(!item) return;\n  let pct = null;\n  if(item.qtype===\"mcq\"){\n    if(mcqSelected===null) return; // nothing selected\n    const btn = document.getElementById(\"examNextBtn\");\n    if(!btn) return;\n    const m = btn.getAttribute(\"onclick\")?.match(/examNextMCQ\\((\\d+)/);\n    if(!m) return;\n    const correctIdx = parseInt(m[1]);\n    pct = mcqSelected===correctIdx ? 100 : 0;\n    // Capture text from DOM\n    const selSpan = document.querySelector(`#mcqopt${mcqSelected} span:last-child`);\n    const corrSpan = document.querySelector(`#mcqopt${correctIdx} span:last-child`);\n    const userText = selSpan?.textContent||\"\";\n    const modelText = corrSpan?.textContent||item.q.options[item.q.correct]||\"\";\n    sessionResults.push({pct, qtype:currentQType});\n    examAnswers.push({\n      q:item.q.q||\"\", userText, modelText, pct,\n      qtype:item.qtype, lessonTitle:item.lesson.title,\n      lessonId:item.lesson.id, mockIdx:mockQIndex\n    });\n    markMockAnswered(pct);\n    return;\n  } else if(item.qtype===\"truefalse\"){\n    const sel = document.querySelector(\"#tfopt0.selected, #tfopt1.selected\");\n    if(!sel) return;\n    pct = sel.dataset.val===item.q.answer ? 100 : 0;\n  } else if(item.qtype===\"fill\"){\n    const inputs = [...document.querySelectorAll(\".blank-input\")];\n    if(!inputs.length || inputs.every(i=>!i.value.trim())) return;\n    const answers = item.q.answers||[];\n    const correct = inputs.filter((inp,i)=>levenshtein(inp.value.trim().toLowerCase(),(answers[i]||\"\").toLowerCase())<=1).length;\n    pct = Math.round(100*correct/Math.max(inputs.length,1));\n  } else if(item.qtype===\"match\"){\n    const sels = [...document.querySelectorAll(\".match-right-select\")];\n    if(!sels.length || sels.every(s=>!s.value)) return;\n    const correct = sels.filter((s,i)=>s.value===item.q.right[item.q.correct[i]]).length;\n    pct = Math.round(100*correct/Math.max(sels.length,1));\n  } else if(item.qtype===\"distinguish\"){\n    const a = document.getElementById(\"distInputA\")?.value?.trim()||\"\";\n    const b = document.getElementById(\"distInputB\")?.value?.trim()||\"\";\n    if(!a && !b) return;\n    const {pct:pA}=scoreAnswer(a, item.q.answerA||\"\");\n    const {pct:pB}=scoreAnswer(b, item.q.answerB||\"\");\n    pct = Math.round((pA+pB)/2);\n  } else {\n    const userText = document.getElementById(\"answerInput\")?.value?.trim()||\"\";\n    if(!userText) return;\n    const {pct:p}=scoreAnswer(userText, item.q.answer||\"\");\n    pct=p;\n  }\n  if(pct!==null){\n    sessionResults.push({pct, qtype:currentQType});\n    // Build proper userText for answer sheet\n    let userText = \"\";\n    if(item.qtype===\"mcq\"){\n      const sel=document.querySelector(\".mcq-option.selected span:last-child\");\n      userText = sel?.textContent||\"\";\n    } else if(item.qtype===\"truefalse\"){\n      const sel=document.querySelector(\"#tfopt0.selected, #tfopt1.selected\");\n      userText = sel?.dataset.val===\"true\"?\"True\":\"False\";\n    } else if(item.qtype===\"fill\"){\n      userText = [...document.querySelectorAll(\".blank-input\")].map(i=>i.value.trim()).join(\" / \");\n    } else if(item.qtype===\"match\"){\n      userText = [...document.querySelectorAll(\".match-right-select\")].map((s,i)=>`${item.q.left[i]} → ${s.value||\"(blank)\"}`).join(\"\\n\");\n    } else if(item.qtype===\"distinguish\"){\n      const a=document.getElementById(\"distInputA\")?.value?.trim()||\"\";\n      const b=document.getElementById(\"distInputB\")?.value?.trim()||\"\";\n      userText = `${item.q.termA}:\\n${a}\\n\\n${item.q.termB}:\\n${b}`;\n    } else {\n      userText = document.getElementById(\"answerInput\")?.value?.trim()||\"\";\n    }\n    const modelText = (()=>{\n      if(item.qtype===\"mcq\") return item.q.options[item.q.correct]||\"\";\n      if(item.qtype===\"truefalse\") return (item.q.answer===\"true\"?\"True\":\"False\")+(item.q.reason?\"\\nReason: \"+item.q.reason:\"\");\n      if(item.qtype===\"fill\") return item.q.answers?.join(\" / \")||\"\";\n      if(item.qtype===\"match\") return item.q.left.map((l,i)=>`${l} → ${item.q.right[item.q.correct[i]]}`).join(\"\\n\");\n      if(item.qtype===\"distinguish\") return `${item.q.termA}:\\n${item.q.answerA}\\n\\n${item.q.termB}:\\n${item.q.answerB}`;\n      return item.q.answer||\"\";\n    })();\n    examAnswers.push({\n      q: item.q.q||item.q.statement||item.q.sentence||\"\",\n      userText, modelText, pct,\n      qtype: item.qtype,\n      lessonTitle: item.lesson.title,\n      lessonId: item.lesson.id,\n      mockIdx: mockQIndex\n    });\n    markMockAnswered(pct);\n  }\n  } catch(e){ console.warn(\"scoreMock error:\", e); }\n}\n\n// Point tiers for completing a full Lesson Test — rewards genuine mastery of\n// the whole lesson, with a strong jump at 100% to make true perfection feel\n// distinctly special rather than just \"one tier better.\"\nfunction calcTestPoints(pct, lessonId){\n  // Only complete lessons earn lesson test points\n  if(lessonId && !_completeLessons[lessonId]) return 0;\n  if(pct>=100) return 700;\n  if(pct>=80)  return 500;\n  if(pct>=60)  return 300;\n  return 0;\n}\n\n// ═══════════════════════════════════════════════════════\n//  FIREWORKS — a short celebratory burst, used for completing the daily goal\n//  and for high lesson-test scores. Pure CSS/DOM, no canvas/libraries needed,\n//  auto-removes itself so it never lingers or blocks interaction.\n// ═══════════════════════════════════════════════════════\nfunction launchFireworks(){\n  const root = document.createElement(\"div\");\n  root.style.cssText = \"position:fixed;inset:0;z-index:200000;pointer-events:none;overflow:hidden\";\n  document.body.appendChild(root);\n\n  const colors = [\"#d1983f\",\"#49b57e\",\"#5b8def\",\"#cf7452\",\"#c45bdb\",\"#ff6b6b\"];\n  const burstCount = 5;\n\n  for(let b=0; b<burstCount; b++){\n    setTimeout(()=>{\n      const cx = 15 + Math.random()*70; // vw\n      const cy = 20 + Math.random()*40; // vh\n      const particleCount = 24;\n      for(let i=0; i<particleCount; i++){\n        const p = document.createElement(\"div\");\n        const angle = (i/particleCount) * Math.PI * 2;\n        const distance = 60 + Math.random()*60;\n        const dx = Math.cos(angle)*distance;\n        const dy = Math.sin(angle)*distance;\n        const color = colors[Math.floor(Math.random()*colors.length)];\n        p.style.cssText = `position:absolute;left:${cx}vw;top:${cy}vh;width:7px;height:7px;border-radius:50%;background:${color};box-shadow:0 0 6px ${color};opacity:1;transition:transform 900ms cubic-bezier(.2,.6,.3,1), opacity 900ms ease-out`;\n        root.appendChild(p);\n        requestAnimationFrame(()=>{\n          p.style.transform = `translate(${dx}px, ${dy}px)`;\n          p.style.opacity = \"0\";\n        });\n      }\n    }, b*220);\n  }\n\n  setTimeout(()=>root.remove(), burstCount*220 + 1100);\n}\n\nfunction showMockResults(){\n  stopTimer();\n  const totalMs = Date.now()-_sessionStart;\n  // Score = total points earned / total questions (unanswered = 0)\n  // Weighted score across all mock questions\n  const mockResults = mockExamStates.map((s,i)=>({pct:s.answered?s.pct:0, qtype:mockQuestions[i]?.qtype||\"mcq\"}));\n  const avg = calcWeightedScore(mockResults);\n  // Hide submit bar\n  const msb=document.getElementById(\"mockSubmitBar\");\n  if(msb) msb.style.display=\"none\";\n\n  // Hide everything else in the overlay\n  document.getElementById(\"quizBody\").style.display=\"none\";\n  document.getElementById(\"qNavBar\").style.display=\"none\";\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"qtypeTabs\").innerHTML=\"\";\n  document.getElementById(\"progressFill\").style.width=\"100%\";\n\n  // Build and show answer sheet\n  const sheet = document.getElementById(\"mockAnswerSheet\");\n  sheet.innerHTML = buildMockAnswerSheet(avg, totalMs);\n  sheet.classList.add(\"visible\");\n  // Scroll overlay to top\n  const ov = document.getElementById(\"quizOverlay\");\n  ov.scrollTo(0,0);\n  setTimeout(()=>ov.scrollTo(0,0),50);\n\n  // Award and announce bonus points based on the score tier — for BOTH a\n  // single-lesson Test and a full multi-lesson Practice Test. Practice Test earns\n  // slightly more per tier since it covers more ground in one sitting.\n  //\n  // The tier bonus is then scaled by how genuinely difficult the chosen mix\n  // of question types is — picking only MCQ/Fill/True-False (all 1-mark)\n  // should not earn the same completion bonus as a mix that includes Brief,\n  // Distinguish, or Paragraph. Without this, a student could deselect every\n  // hard question type in the Practice Test picker, answer only easy ones, and\n  // still collect the full tiered bonus for comparatively little effort.\n  const avgMarksWeight = mockResults.length\n    ? mockResults.reduce((sum,r)=>sum+getMarks(r.qtype),0) / mockResults.length\n    : 1;\n  // 1.0 (all 1-mark types) -> 50% of the tier bonus. 5.0 (all 5-mark types) -> 100%.\n  const difficultyMultiplier = Math.max(0.5, Math.min(1, 0.5 + (avgMarksWeight-1)/8));\n\n  const rawPoints = isLessonTest ? calcTestPoints(avg, lessonTestLesson?.id) : calcMockExamPoints(avg);\n  const points = Math.round(rawPoints * difficultyMultiplier);\n  if(points>0){\n    fbLogEntry(\"testPoints\", {\n      lessonId: isLessonTest ? (lessonTestLesson?.id||\"\") : \"\",\n      lessonTitle: isLessonTest ? (lessonTestLesson?.title||\"\") : `Practice Test (${mockSelected.size} lesson${mockSelected.size!==1?\"s\":\"\"})`,\n      pct: avg,\n      points,\n      rawPoints,\n      difficultyMultiplier,\n      isMockExam: !isLessonTest\n    });\n  }\n  setTimeout(()=>showTestPointsPopup(avg, points, isLessonTest, difficultyMultiplier), 400);\n}\n\n// Point tiers for a full multi-lesson Practice Test — same shape as Lesson Test\n// but a bit richer per tier, since a practice test spans more material at once.\nfunction calcMockExamPoints(pct){\n  if(pct>=100) return 120;\n  if(pct>=90)  return 65;\n  if(pct>=80)  return 50;\n  if(pct>=60)  return 35;\n  return 0;\n}\n\n// Announces the test score and any bonus points earned, right after the\n// answer sheet appears — the whole point of telling him is to make it land\n// as a clear, immediate result, not something buried in the scoreboard later.\nfunction showTestPointsPopup(pct, points, isLessonTestRun, difficultyMultiplier){\n  let overlay = document.getElementById(\"testPointsPopup\");\n  if(!overlay){\n    overlay = document.createElement(\"div\");\n    overlay.id = \"testPointsPopup\";\n    overlay.style.cssText = \"position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100002;display:flex;align-items:center;justify-content:center;padding:20px\";\n    document.body.appendChild(overlay);\n  }\n  const tier = pct>=100?\"🏆 Perfect Score!\":pct>=90?\"🌟 Outstanding!\":pct>=80?\"🎉 Great Job!\":pct>=60?\"👍 Good Work!\":\"💪 Keep Practising!\";\n  const tierColor = pct>=90?\"var(--gold,#d1983f)\":pct>=60?\"var(--green,#49b57e)\":\"var(--muted,#888)\";\n  const runLabel = isLessonTestRun ? \"lesson test\" : \"practice test\";\n  const showDifficultyNote = !isLessonTestRun && difficultyMultiplier!==undefined && difficultyMultiplier < 0.95;\n  overlay.innerHTML = `<div style=\"background:#fff;border-radius:18px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)\">\n    <div style=\"font-size:40px;margin-bottom:8px\">${pct>=80?\"🎊\":pct>=60?\"✨\":\"📘\"}<\u002Fdiv>\n    <div style=\"font-size:18px;font-weight:800;color:${tierColor};margin-bottom:4px\">${tier}<\u002Fdiv>\n    <div style=\"font-size:14px;color:var(--muted);margin-bottom:16px\">You scored <b style=\"color:var(--navy)\">${pct}%<\u002Fb> on this ${runLabel}<\u002Fdiv>\n    ${points>0 ? `\n      <div style=\"background:var(--parchment);border-radius:12px;padding:14px;margin-bottom:16px\">\n        <div style=\"font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px\">Bonus Points Earned<\u002Fdiv>\n        <div style=\"font-size:32px;font-weight:900;color:var(--navy)\">+${points}<\u002Fdiv>\n        ${showDifficultyNote ? `<div style=\"font-size:11px;color:var(--muted);margin-top:4px\">Include harder question types like Brief, Distinguish or Paragraph next time for a bigger bonus!<\u002Fdiv>` : \"\"}\n      <\u002Fdiv>` : isLessonTestRun && !_completeLessons[lessonTestLesson?.id] ? `\n      <div style=\"background:var(--parchment);border-radius:12px;padding:14px;margin-bottom:16px\">\n        <div style=\"font-size:12px;color:var(--muted)\">📝 Practice run — no points yet<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted);margin-top:4px\">Points will be awarded once this lesson is marked complete<\u002Fdiv>\n      <\u002Fdiv>` : `\n      <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:16px\">Score 60% or higher to earn bonus points. Try again!<\u002Fdiv>`}\n    <button onclick=\"document.getElementById('testPointsPopup').remove()\" style=\"width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Continue →<\u002Fbutton>\n  <\u002Fdiv>`;\n  if(points>0) launchFireworks();\n}\n\nfunction buildMockAnswerSheet(avg, totalMs){\n  const {msg} = getMotivation(avg);\n  const cls = avg>=80?\"great\": avg>=50?\"good\":\"\";\n  const borderColor = avg>=80?\"#49b57e\": avg>=50?\"#cf8f2e\":\"#cf7452\";\n  const scoreColor  = avg>=80?\"#49b57e\": avg>=50?\"#d9b466\":\"#cf7452\";\n  const answered = mockExamStates.filter(s=>s.answered).length;\n  const correct = mockExamStates.filter(s=>s.answered&&s.pct>=80).length;\n  const partial = mockExamStates.filter(s=>s.answered&&s.pct>=30&&s.pct<80).length;\n  const wrong   = mockExamStates.filter(s=>s.answered&&s.pct<30).length;\n  const skipped = mockQuestions.length - answered;\n\n  // Build lookup: mockIdx → examAnswer\n  const eaByIdx = {};\n  examAnswers.forEach(ea=>{ if(ea.mockIdx!==undefined) eaByIdx[ea.mockIdx]=ea; });\n\n  // Collect spelling errors\n  const spellErrors = [];\n  Object.values(eaByIdx).forEach(ea=>{\n    if(ea.modelText && ea.qtype!==\"mcq\"&&ea.qtype!==\"fill\"&&ea.qtype!==\"match\"&&ea.qtype!==\"truefalse\"){\n      const {diff} = scoreAnswer(ea.userText||\"\", ea.modelText);\n      diff.forEach(d=>{\n        if(d.type===\"misspelled\") spellErrors.push({wrong:d.word, correct:d.correct, qNum:(ea.mockIdx??0)+1, lesson:ea.lessonTitle||\"\"});\n      });\n    }\n  });\n\n  // Build question cards — only answered questions\n  let qCards = \"\";\n  const notAttempted = [];\n\n  // Build a map of answered questions by mock index\n  // examAnswers may have fewer entries than mockQuestions if user skipped without answering\n  mockQuestions.forEach((item, i)=>{\n    const ea = eaByIdx[i];\n    const state = mockExamStates[i];\n    const wasSkipped = !state?.answered || !ea || !ea.userText || ea.userText===\"(no answer)\" || ea.userText===\"(skipped)\" || ea.userText===\"\";\n\n    if(wasSkipped){\n      notAttempted.push({q: ea?.q||item.q.q||item.q.statement||item.q.sentence||\"\", qtype: item.qtype, lessonTitle: item.lesson.title, num: i+1});\n      return;\n    }\n    const qCls = ea.pct>=80?\"good\": ea.pct>=50?\"mid\":\"poor\";\n    const qt = QTYPES.find(t=>t.id===ea.qtype)||{label:ea.qtype, icon:\"📝\"};\n    const qTime = _questionTimes[i] ? `⏱ ${fmtMs(_questionTimes[i])}` : \"\";\n\n    // Build annotated user answer\n    let userDisplay = ea.userText||\"(no answer)\";\n    if(ea.modelText && ea.qtype!==\"mcq\"&&ea.qtype!==\"fill\"&&ea.qtype!==\"match\"&&ea.qtype!==\"truefalse\"){\n      const {diff} = scoreAnswer(ea.userText||\"\", ea.modelText);\n      userDisplay = diff.map(d=>{\n        const w = (d.word||\"\").replace(/<\u002Fg,\"&lt;\");\n        if(d.type===\"ok\")          return `<span class=\"word-ok\">${w}<\u002Fspan>`;\n        if(d.type===\"wrong\")       return `<span class=\"word-wrong\">${w}<\u002Fspan>`;\n        if(d.type===\"misspelled\")  return `<span class=\"word-wrong\">${w}<\u002Fspan><span class=\"word-correction\">→${(d.correct||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fspan>`;\n        if(d.type===\"missing\")     return `<span class=\"word-missing\">[${w}]<\u002Fspan>`;\n        return w;\n      }).join(\" \");\n    } else if(ea.qtype===\"mcq\"){\n      userDisplay = ea.pct===100\n        ? `<span class=\"word-ok\">✓ ${ea.userText}<\u002Fspan>`\n        : `<span class=\"word-wrong\">${ea.userText}<\u002Fspan>`;\n    }\n\n    const modelFormatted = (ea.modelText||\"\").replace(/<\u002Fg,\"&lt;\").replace(/\\n/g,\"<br>\");\n\n    qCards += `\n    <div class=\"mas-q-card ${qCls}\">\n      <div class=\"mas-q-top\">\n        <div class=\"mas-q-num\">Q${i+1}<\u002Fdiv>\n        <div class=\"mas-q-type\">${qt.icon} ${qt.label}<\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div class=\"mas-q-time\">${qTime}<\u002Fdiv>\n        <div class=\"mas-q-score ${qCls}\">${ea.pct}%<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mas-q-text\">${(ea.q||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n      <div class=\"mas-section-lbl yours\">Your Answer<\u002Fdiv>\n      <div class=\"mas-your-ans\">${userDisplay||\"<em style='color:var(--muted)'>(skipped)<\u002Fem>\"}<\u002Fdiv>\n      <div class=\"mas-section-lbl model\">✅ Model Answer<\u002Fdiv>\n      <div class=\"mas-model-ans\">${modelFormatted}<\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n\n  // Build spelling table\n  let spellHtml = \"\";\n  if(spellErrors.length){\n    const rows = spellErrors.map(e=>`\n      <tr>\n        <td>${e.qNum}<\u002Ftd>\n        <td><span class=\"spell-wrong\">${e.wrong}<\u002Fspan><span class=\"spell-right\">→ ${e.correct}<\u002Fspan><\u002Ftd>\n        <td>${e.lesson}<\u002Ftd>\n      <\u002Ftr>`).join(\"\");\n    spellHtml = `\n    <div class=\"mas-section-heading\">✏️ Spelling to Learn (${spellErrors.length})<\u002Fdiv>\n    <table class=\"spell-table\">\n      <thead><tr><th>Q#<\u002Fth><th>Correction<\u002Fth><th>Lesson<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${rows}<\u002Ftbody>\n    <\u002Ftable>`;\n  }\n\n  // Not Attempted section\n  let notAttemptedHtml = \"\";\n  if(notAttempted.length){\n    const rows = notAttempted.map(n=>`\n      <div class=\"improve-card\" style=\"border-left-color:var(--muted)\">\n        <div class=\"improve-lesson\" style=\"color:var(--muted)\">Q${n.num} · ${n.lessonTitle||\"\"} · ${QTYPES.find(t=>t.id===n.qtype)?.label||n.qtype}<\u002Fdiv>\n        <div class=\"improve-text\">${(n.q||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n      <\u002Fdiv>`).join(\"\");\n    notAttemptedHtml = `\n      <div class=\"mas-section-heading\">⏭ Not Attempted (${notAttempted.length})<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--muted);margin-bottom:10px\">Revise these topics and practise them in Study Mode.<\u002Fdiv>\n      ${rows}`;\n  }\n\n  // Build improvement recommendations based on weak areas\n  const weakByLesson = {};\n  examAnswers.forEach(ea=>{\n    if(ea.pct<60){\n      const key = ea.lessonTitle||ea.lessonId||\"General\";\n      if(!weakByLesson[key]) weakByLesson[key]={count:0,qtypes:new Set()};\n      weakByLesson[key].count++;\n      weakByLesson[key].qtypes.add(ea.qtype);\n    }\n  });\n  let improveHtml = \"\";\n  if(Object.keys(weakByLesson).length){\n    const cards = Object.entries(weakByLesson).map(([lesson,data])=>{\n      const types = [...data.qtypes].map(qt=>QTYPES.find(t=>t.id===qt)?.label||qt).join(\", \");\n      return `<div class=\"improve-card\">\n        <div class=\"improve-lesson\">📚 ${lesson}<\u002Fdiv>\n        <div class=\"improve-text\">Revise this lesson — especially <strong>${types}<\u002Fstrong> (${data.count} question${data.count!==1?\"s\":\"\"} below 60%).<\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join(\"\");\n    improveHtml = `\n    <div class=\"mas-section-heading\">💡 Topics to Improve<\u002Fdiv>\n    ${cards}`;\n  }\n\n  return `\n  <div class=\"mas-header\">\n    <div class=\"mas-title\">📝 Practice Test — Answer Sheet<\u002Fdiv>\n    <div class=\"mas-meta\">${mockSubject} · ${answered}/${mockQuestions.length} answered · ⏱ ${fmtMs(totalMs)}<\u002Fdiv>\n    <div class=\"mas-mark-row\">\n      <div style=\"display:flex;flex-direction:column;align-items:center\">\n        <div style=\"position:relative;width:120px;height:120px;border-radius:50%;border:4.5px solid ${borderColor};background:#202a3d;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-3deg);font-family:'Courier New',monospace;box-shadow:0 4px 20px rgba(0,0,0,.2)\">\n          <div style=\"font-size:32px;font-weight:900;color:${scoreColor};line-height:1\">${avg}<\u002Fdiv>\n          <div style=\"width:55%;border-top:1.5px solid rgba(255,255,255,.3);margin:4px 0\"><\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:700;color:rgba(255,255,255,.6)\">100<\u002Fdiv>\n          <div style=\"position:absolute;top:-16px;right:-10px;font-size:30px;transform:rotate(8deg)\">${avg>=80?\"✓✓\":avg>=50?\"✓\":\"\"}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;color:var(--navy);margin-top:14px;font-style:italic;max-width:220px;text-align:center\">\"${msg}\"<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mas-stats\">\n      <div class=\"mas-stat\"><div class=\"mas-stat-num green\">${correct}<\u002Fdiv><div class=\"mas-stat-label\">Good<\u002Fdiv><\u002Fdiv>\n      <div class=\"mas-stat\"><div class=\"mas-stat-num amber\">${partial}<\u002Fdiv><div class=\"mas-stat-label\">Partial<\u002Fdiv><\u002Fdiv>\n      <div class=\"mas-stat\"><div class=\"mas-stat-num red\">${wrong}<\u002Fdiv><div class=\"mas-stat-label\">Wrong<\u002Fdiv><\u002Fdiv>\n      <div class=\"mas-stat\"><div class=\"mas-stat-num\" style=\"color:var(--muted)\">${skipped}<\u002Fdiv><div class=\"mas-stat-label\">Skipped<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  ${qCards}\n  ${spellHtml}\n  ${improveHtml}\n  <div style=\"display:flex;gap:8px;margin-top:20px\">\n    <button class=\"btn-back-lessons\" style=\"flex:1\" onclick=\"closeMockAnswerSheet()\">← Back<\u002Fbutton>\n    <button class=\"btn-back-lessons\" style=\"flex:1;background:var(--navy);color:#fff;border-color:var(--navy)\" onclick=\"downloadMockAnswerSheet()\">⬇ Download<\u002Fbutton>\n  <\u002Fdiv>`;}\n\nfunction downloadMockAnswerSheet(){\n  const sheet = document.getElementById(\"mockAnswerSheet\");\n  if(!sheet) return;\n  const dateStr = new Date().toLocaleDateString(\"en-IN\",{day:\"2-digit\",month:\"short\",year:\"numeric\"});\n  const html = `<!DOCTYPE html><html><head><meta charset=\"utf-8\">\n    <title>Practice Test Answer Sheet — ${dateStr}<\u002Ftitle>\n    <style>\n      body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:20px;color:#202a3d}\n      .mas-q-card{border-radius:10px;padding:14px;margin-bottom:12px;border:1.5px solid #ddd}\n      .mas-q-card.good{border-color:#4a9873;background:#e7f2ec}\n      .mas-q-card.mid{border-color:#cf8f2e;background:#f8ecd2}\n      .mas-q-card.poor{border-color:#d15f5a;background:#fbe9e7}\n      .word-ok{color:#4a9873}.word-wrong{text-decoration:line-through;color:#d15f5a}\n      .word-missing{background:#f8ecd2;color:#8a651b;padding:0 4px;border-radius:3px}\n      .word-correction{color:#4a9873;font-weight:700;margin-left:3px}\n      .spell-wrong{text-decoration:line-through;color:#d15f5a;font-weight:700}\n      .spell-right{color:#4a9873;font-weight:700;margin-left:6px}\n      table{width:100%;border-collapse:collapse}th{background:#202a3d;color:#fff;padding:7px 10px;text-align:left}\n      td{padding:7px 10px;border-bottom:1px solid #ddd}.improve-card{background:#f7f4ee;border-left:3px solid #202a3d;border-radius:8px;padding:12px;margin-bottom:8px}\n      @media print{.no-print{display:none}}\n    <\u002Fstyle><\u002Fhead><body>\n    ${sheet.innerHTML.replace(/onclick=\"[^\"]*\"/g,'').replace(/<button[^>]*>.*?<\\/button>/gs,'')}\n    <\u002Fbody><\u002Fhtml>`;\n  const blob = new Blob([html],{type:\"text/html;charset=utf-8\"});\n  const url  = URL.createObjectURL(blob);\n  const a    = document.createElement(\"a\");\n  a.href=url; a.download=`MockExam_AnswerSheet_${dateStr.replace(/ /g,\"_\")}.html`;\n  document.body.appendChild(a); a.click();\n  document.body.removeChild(a);\n  setTimeout(()=>URL.revokeObjectURL(url),1000);\n}\nfunction submitMockExam(){\n  saveMockAnswer(mockQIndex);\n  scoreMockCurrentQuestion(); // score whatever is currently on screen\n  const answered=mockExamStates.filter(s=>s.answered).length;\n  const unanswered=mockQuestions.length-answered;\n\n  // Show custom confirmation\n  const overlay=document.createElement(\"div\");\n  overlay.style.cssText=\"position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px\";\n  overlay.innerHTML=`\n    <div style=\"background:#fff;border-radius:16px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2)\">\n      <div style=\"font-size:36px;margin-bottom:12px\">📋<\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:800;color:var(--navy);margin-bottom:8px\">Submit Exam?<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--muted);margin-bottom:6px\">\n        ${answered} of ${mockQuestions.length} questions answered\n      <\u002Fdiv>\n      ${unanswered>0?`<div style=\"font-size:12px;color:var(--red);font-weight:600;margin-bottom:16px\">⚠ ${unanswered} question${unanswered!==1?\"s\":\"\"} not answered<\u002Fdiv>`\n        :`<div style=\"font-size:12px;color:var(--green);font-weight:600;margin-bottom:16px\">✓ All questions answered<\u002Fdiv>`}\n      <div style=\"display:flex;gap:10px\">\n        <button onclick=\"this.closest('[style*=fixed]').remove()\"\n          style=\"flex:1;padding:11px;background:var(--parchment);border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit\">\n          Continue\n        <\u002Fbutton>\n        <button onclick=\"this.closest('[style*=fixed]').remove(); showMockResults();\"\n          style=\"flex:1;padding:11px;background:var(--green);border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit\">\n          Submit ✓\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n}\n\nfunction closeMockAnswerSheet(){\n  document.getElementById(\"mockAnswerSheet\").classList.remove(\"visible\");\n  document.getElementById(\"mockAnswerSheet\").innerHTML=\"\";\n  const msb=document.getElementById(\"mockSubmitBar\");\n  if(msb) msb.style.display=\"none\";\n  currentMode=\"study\";\n  closeQuiz();\n}\n\n// Check if the currently displayed mock question has any answer entered\nfunction mockQuestionHasAnswer(){\n  const item = mockQuestions[mockQIndex];\n  if(!item) return false;\n  if(item.qtype===\"mcq\"){\n    return mcqSelected!==null;\n  } else if(item.qtype===\"truefalse\"){\n    return !!document.querySelector(\"#tfopt0.selected, #tfopt1.selected\");\n  } else if(item.qtype===\"fill\"){\n    const inputs=[...document.querySelectorAll(\".blank-input\")];\n    return inputs.length>0 && inputs.some(i=>i.value.trim());\n  } else if(item.qtype===\"match\"){\n    const sels=[...document.querySelectorAll(\".match-right-select\")];\n    return sels.length>0 && sels.some(s=>s.value);\n  } else if(item.qtype===\"distinguish\"){\n    const a=document.getElementById(\"distInputA\")?.value?.trim()||\"\";\n    const b=document.getElementById(\"distInputB\")?.value?.trim()||\"\";\n    return !!(a||b);\n  } else {\n    const ta=document.getElementById(\"answerInput\")?.value?.trim()||\"\";\n    return !!ta;\n  }\n}\n\n// ── DISABLE COPY/PASTE/CUT/RIGHT-CLICK ON ANSWER INPUTS ──\n// Applies to all answer textboxes (fill blanks, brief/paragraph/reasons, distinguish)\n// so students can't paste in answers from elsewhere or copy questions out easily.\nconst _noCopyPasteSelectors = \".blank-input, .answer-textarea, .dist-textarea\";\n[\"copy\",\"cut\",\"paste\",\"contextmenu\"].forEach(evt=>{\n  document.addEventListener(evt, function(e){\n    if(e.target.closest && e.target.closest(_noCopyPasteSelectors)){\n      e.preventDefault();\n    }\n  });\n});\n// Also block right-click anywhere inside the quiz overlay (questions, model answers, etc.)\ndocument.addEventListener(\"contextmenu\", function(e){\n  if(e.target.closest && e.target.closest(\"#quizOverlay\")){\n    e.preventDefault();\n  }\n});\n// Block drag-and-drop text into textboxes (another paste vector)\ndocument.addEventListener(\"drop\", function(e){\n  if(e.target.closest && e.target.closest(_noCopyPasteSelectors)){\n    e.preventDefault();\n  }\n});\n\n// ── KEYBOARD NAVIGATION ──\nlet _navKeyLock = false;\n// Shared \"go to previous / go to next\" logic — used by both arrow-key navigation\n// and swipe gestures, so the rules stay identical (e.g. can't swipe forward past\n// an unanswered question, practice test submits via the real button not a shortcut).\nfunction navigatePrev(){\n  if(currentLesson?.id===\"__mock__\"){\n    jumpMockQuestion(mockQIndex-1);\n  } else {\n    jumpToQuestion(currentQIndex-1);\n  }\n}\nfunction navigateNext(){\n  if(currentLesson?.id===\"__mock__\"){\n    const hasAnswer = mockQuestionHasAnswer();\n    const nextBtn=document.getElementById(\"examNextBtn\")||document.getElementById(\"checkBtn\");\n    if(hasAnswer && nextBtn && !nextBtn.disabled){\n      nextBtn.click();\n    } else if(mockQIndex<mockQuestions.length-1){\n      jumpMockQuestion(mockQIndex+1);\n    }\n  } else {\n    const btnRow=document.getElementById(\"btnRow\");\n    if(btnRow?.style.display===\"flex\"){\n      nextQuestion();\n    }\n  }\n}\n\ndocument.addEventListener(\"keydown\", function(e){\n  // Only in quiz overlay, not typing in inputs\n  const overlay = document.getElementById(\"quizOverlay\");\n  if(!overlay?.classList.contains(\"visible\")) return;\n  const tag = document.activeElement?.tagName;\n  if(tag===\"INPUT\"||tag===\"TEXTAREA\"||tag===\"SELECT\") return;\n  if(![\"ArrowLeft\",\"ArrowRight\",\"ArrowUp\",\"ArrowDown\"].includes(e.key)) return;\n\n  // Debounce: ignore repeat keydowns within 350ms to prevent double-advance\n  if(_navKeyLock) { e.preventDefault(); return; }\n  _navKeyLock = true;\n  setTimeout(()=>{ _navKeyLock=false; }, 350);\n\n  if(e.key===\"ArrowLeft\"||e.key===\"ArrowUp\"){\n    e.preventDefault();\n    navigatePrev();\n  } else if(e.key===\"ArrowRight\"||e.key===\"ArrowDown\"){\n    e.preventDefault();\n    navigateNext();\n  }\n});\n\n// ── SWIPE TO NAVIGATE (mobile, quick-answer question types only) ──\n// Deliberately scoped to MCQ / Fill / True-False / Match — never enabled for\n// Brief/Reasons/Paragraph/Distinguish, since a stray swipe while scrolling a\n// long written answer (or with the on-screen keyboard up) could accidentally\n// fire \"next question\" and feel like it ate the student's work. Quick-answer\n// types have nothing to lose from an accidental swipe, so it's safe there.\nconst SWIPE_SAFE_QTYPES = new Set([\"mcq\",\"fill\",\"truefalse\",\"match\"]);\n\nfunction isSwipeSafeRightNow(){\n  const overlay = document.getElementById(\"quizOverlay\");\n  if(!overlay?.classList.contains(\"visible\")) return false;\n  // Never swipe while any text input/textarea is focused, even on a safe qtype's\n  // page (e.g. the rare case of a select still open) — belt-and-suspenders.\n  const tag = document.activeElement?.tagName;\n  if(tag===\"INPUT\"||tag===\"TEXTAREA\"||tag===\"SELECT\") return false;\n\n  const isMock = currentLesson?.id===\"__mock__\";\n  const qtype = isMock ? mockQuestions[mockQIndex]?.qtype : currentQType;\n  return SWIPE_SAFE_QTYPES.has(qtype);\n}\n\n(function setupSwipeNav(){\n  let touchStartX = null, touchStartY = null, touchStartTime = 0;\n  const quizBody = document.getElementById(\"quizBody\");\n  if(!quizBody) return;\n\n  quizBody.addEventListener(\"touchstart\", function(e){\n    if(!isSwipeSafeRightNow() || e.touches.length!==1) return;\n    touchStartX = e.touches[0].clientX;\n    touchStartY = e.touches[0].clientY;\n    touchStartTime = Date.now();\n  }, {passive:true});\n\n  quizBody.addEventListener(\"touchend\", function(e){\n    if(touchStartX===null || !isSwipeSafeRightNow()) { touchStartX=null; return; }\n    const touch = e.changedTouches[0];\n    const dx = touch.clientX - touchStartX;\n    const dy = touch.clientY - touchStartY;\n    const dt = Date.now() - touchStartTime;\n    touchStartX = null;\n\n    // Require a clearly horizontal, deliberate flick — not a scroll, not a tap,\n    // not a diagonal drag. Mirrors how native swipe-card gestures feel.\n    const MIN_DISTANCE = 60, MAX_VERTICAL = 60, MAX_TIME = 600;\n    if(Math.abs(dx) < MIN_DISTANCE || Math.abs(dy) > MAX_VERTICAL || dt > MAX_TIME) return;\n    if(!isSwipeSafeRightNow()) return; // re-check in case state changed mid-gesture\n\n    if(_navKeyLock) return;\n    _navKeyLock = true;\n    setTimeout(()=>{ _navKeyLock=false; }, 350);\n\n    if(dx < 0) navigateNext();      // swipe left → next\n    else navigatePrev();            // swipe right → previous\n  }, {passive:true});\n})();\nfunction getMotivation(avg){\n  if(avg===100) return { msg:\"Perfect score! You're a star! ⭐\", tick:\"✓✓\" };\n  if(avg>=90)   return { msg:\"Outstanding work! Keep it up!\", tick:\"✓✓\" };\n  if(avg>=80)   return { msg:\"Excellent! You really know this material.\", tick:\"✓\" };\n  if(avg>=70)   return { msg:\"Very good! A little more practice and you'll ace it.\", tick:\"✓\" };\n  if(avg>=60)   return { msg:\"Good effort! Review the highlighted answers and try again.\", tick:\"\" };\n  if(avg>=50)   return { msg:\"Keep going! You're halfway there — revise and retry.\", tick:\"\" };\n  if(avg>=35)   return { msg:\"Don't give up! Read the model answers carefully and try again.\", tick:\"\" };\n  return         { msg:\"Every expert was once a beginner. Keep practising! 💪\", tick:\"\" };\n}\n\nfunction setTeacherMark(scoreEl, tickEl, wrapEl, motivationEl, avg){\n  scoreEl.textContent = avg;\n  const cls = avg>=80?\"great\": avg>=50?\"good\":\"\";\n  wrapEl.className = wrapEl.className.replace(/\\bgreat\\b|\\bgood\\b/g,\"\").trim() + (cls?\" \"+cls:\"\");\n  const {msg, tick} = getMotivation(avg);\n  const verses=[\"Philippians 4:13 — \\\"I can do all things through Christ who strengthens me.\\\"\",\"Proverbs 2:6 — \\\"For the LORD gives wisdom; from his mouth come knowledge and understanding.\\\"\"];\n  const verse=verses[Math.floor(Date.now()/86400000)%verses.length];\n  tickEl.textContent = tick;\n  motivationEl.textContent = `\"${msg}\"`;\n}\n\n// ── SUMMARY (study mode) ──\nfunction showSummary(){\n  stopTimer();\n  const totalMs=Date.now()-_sessionStart;\n  // Use questionStates (correctly indexed per question) instead of sessionResults\n  // (sessionResults can be out of order due to Prev/Next navigation and retries)\n  const answeredStates = questionStates.filter(s=>s.answered);\n  const resultsForScoring = answeredStates.map(s=>({pct:s.pct, qtype:currentQType}));\n  const avg = calcWeightedScore(resultsForScoring);\n  scores[currentLesson.id+\":\"+currentQType]=avg;\n  document.getElementById(\"quizBody\").style.display=\"none\";\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n  const sum=document.getElementById(\"summaryScreen\");\n  sum.classList.add(\"visible\");\n  document.getElementById(\"summaryTrophy\").textContent=avg>=80?\"🏆\":avg>=50?\"📚\":\"💪\";\n  setTeacherMark(\n    document.getElementById(\"teacherScore\"),\n    document.getElementById(\"teacherTick\"),\n    document.getElementById(\"teacherMark\"),\n    document.getElementById(\"teacherMotivation\"),\n    avg\n  );\n  document.getElementById(\"statCorrect\").textContent=answeredStates.filter(r=>r.pct>=80).length;\n  document.getElementById(\"statPartial\").textContent=answeredStates.filter(r=>r.pct>=40&&r.pct<80).length;\n  document.getElementById(\"statWrong\").textContent=answeredStates.filter(r=>r.pct<40).length;\n  document.getElementById(\"summaryTotalTime\").textContent=`⏱ Total time: ${fmtMs(totalMs)}`;\n  document.getElementById(\"progressFill\").style.width=\"100%\";\n  renderSidebar(); renderLessons();\n}\n\n// ── ANSWER PAPER (exam mode) ──\nfunction showAnswerPaper(){\n  stopTimer();\n  const totalMs=Date.now()-_sessionStart;\n  const avg=sessionResults.length\n    ?Math.round(sessionResults.reduce((a,r)=>a+r.pct,0)/sessionResults.length):0;\n  scores[currentLesson.id+\":\"+currentQType]=avg;\n\n  document.getElementById(\"quizBody\").style.display=\"none\";\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"progressFill\").style.width=\"100%\";\n  const paper=document.getElementById(\"answerPaper\");\n  paper.classList.add(\"visible\");\n\n  document.getElementById(\"paperTitle\").textContent=`${currentLesson.title} — Answer Paper`;\n  document.getElementById(\"paperMeta\").textContent=\n    `${currentQType.toUpperCase()} · ${examAnswers.length} question${examAnswers.length!==1?\"s\":\"\"} · ${new Date().toLocaleDateString()} · ⏱ ${fmtMs(totalMs)}`;\n\n  setTeacherMark(\n    document.getElementById(\"paperTeacherScore\"),\n    document.getElementById(\"paperTeacherTick\"),\n    document.getElementById(\"paperTeacherMark\"),\n    document.getElementById(\"paperMotivation\"),\n    avg\n  );\n\n  const qWrap=document.getElementById(\"paperQuestions\");\n  qWrap.innerHTML=\"\";\n  examAnswers.forEach((ea, i)=>{\n    const cls=ea.pct>=80?\"pq-good\":ea.pct>=50?\"pq-mid\":\"pq-poor\";\n    const scCls=ea.pct>=80?\"good\":ea.pct>=50?\"mid\":\"poor\";\n    const div=document.createElement(\"div\");\n    div.className=`paper-q ${cls}`;\n\n    // Build annotated diff for text answers\n    let userDisplay=ea.userText;\n    if(ea.modelText && ea.qtype!==\"mcq\" && ea.qtype!==\"fill\" && ea.qtype!==\"match\"){\n      const {diff}=scoreAnswer(ea.userText, ea.modelText);\n      userDisplay=diff.map(d=>{\n        if(d.type===\"ok\")          return `<span class=\"word-ok\">${d.word}<\u002Fspan>`;\n        if(d.type===\"wrong\")       return `<span class=\"word-wrong\">${d.word}<\u002Fspan>`;\n        if(d.type===\"misspelled\")  return `<span class=\"word-wrong\">${d.word}<\u002Fspan><span class=\"word-correction\">→${d.correct.replace(/<\u002Fg,\"&lt;\")}<\u002Fspan>`;\n        if(d.type===\"missing\")     return `<span class=\"word-missing\">[${d.word}]<\u002Fspan>`;\n        return d.word;\n      }).join(\" \");\n    }\n\n    div.innerHTML=`\n      <div class=\"pq-top\">\n        <div class=\"pq-num\">Q${i+1} · ${QTYPES.find(t=>t.id===ea.qtype)?.label||ea.qtype}<\u002Fdiv>\n        <div class=\"pq-score ${scCls}\">${ea.pct}%<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pq-question\">${ea.q}<\u002Fdiv>\n      <div class=\"pq-section-label yours\">Your Answer<\u002Fdiv>\n      <div class=\"pq-user-answer\">${userDisplay}<\u002Fdiv>\n      <div class=\"pq-section-label model\">✅ Model Answer<\u002Fdiv>\n      <div class=\"pq-model-answer\">${ea.modelText}<\u002Fdiv>`;\n    qWrap.appendChild(div);\n  });\n\n  renderSidebar(); renderLessons();\n}\n\nfunction retrySection(){\n  examAnswers.length = 0; // clear in place — preserves the Firestore-sync override on .push\n  startQTypeSession();\n  document.getElementById(\"quizBody\").style.display=\"block\";\n  document.getElementById(\"summaryScreen\").classList.remove(\"visible\");\n  document.getElementById(\"answerPaper\").classList.remove(\"visible\");\n}\n\n// ── SESSION REPORT ──\nfunction openReport(){\n  renderReport();\n  renderTodayStudySummary();\n  document.getElementById(\"reportPanel\").classList.add(\"visible\");\n  showReportTab(\"topics\");\n}\n\n// Scans the WHOLE day (all sessions, not just this browser sitting) for how\n// many questions he's actually studied and how long each took on average —\n// this is the number that answers \"how much did he do today,\" which \"this\n// session\" alone can't answer if he's studied in more than one sitting.\nasync function renderTodayStudySummary(){\n  const banner = document.getElementById(\"reportTodayBanner\");\n  if(!banner) return;\n  if(!window._fb || !currentUserPhone){ banner.innerHTML = \"\"; return; }\n  banner.innerHTML = \"Loading today's summary…\";\n  try{\n    const { logsSnap, examSnap } = await getLogsBundle();\n    const { allScoredEntries } = aggregateScoreboardData(logsSnap, examSnap);\n    const dayCutoff = Date.now() - 24*60*60*1000;\n    const today = allScoredEntries.filter(e =>\n      e.ts >= dayCutoff && e.qtype!==\"goodwill\" && e.qtype!==\"compensation\" &&\n      e.qtype!==\"newtry\" && e.qtype!==\"milestone\" && e.qtype!==\"lessonmastery\" && !(e.qtype||\"\").startsWith(\"recite_\")\n    );\n    if(!today.length){\n      banner.innerHTML = `<div style=\"background:var(--parchment);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--muted);text-align:center\">No questions studied yet today.<\u002Fdiv>`;\n      return;\n    }\n    const uniqueToday = new Set(today.map(e=>`${e.lessonId}|${e.qtype}|${e.qIndex}`)).size;\n    const totalToday = today.length;\n    const totalTimeToday = today.reduce((sum,e)=>sum+(e.timeMs||0), 0);\n    const avgTimePerQ = Math.round(totalTimeToday / totalToday);\n    banner.innerHTML = `\n      <div style=\"background:var(--navy);border-radius:12px;padding:14px 16px;color:#fff\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.65;margin-bottom:8px\">📅 Today, across all study sessions<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <div><div style=\"font-size:20px;font-weight:800\">${uniqueToday}<\u002Fdiv><div style=\"font-size:11px;opacity:.75\">unique questions<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:20px;font-weight:800\">${totalToday}<\u002Fdiv><div style=\"font-size:11px;opacity:.75\">total attempts<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:20px;font-weight:800\">${fmtMs(totalTimeToday)}<\u002Fdiv><div style=\"font-size:11px;opacity:.75\">time studied<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:20px;font-weight:800\">${fmtMs(avgTimePerQ)}<\u002Fdiv><div style=\"font-size:11px;opacity:.75\">avg per question<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }catch(e){ banner.innerHTML = \"\"; }\n}\n\nfunction showReportTab(tab){\n  document.getElementById(\"reportTabTopics\").style.display = tab===\"topics\" ? \"block\" : \"none\";\n  document.getElementById(\"reportTabPast\").style.display = tab===\"past\" ? \"block\" : \"none\";\n  document.getElementById(\"reportTabMock\").style.display = tab===\"mockexams\" ? \"block\" : \"none\";\n  document.getElementById(\"reportTabBtnTopics\").classList.toggle(\"active\", tab===\"topics\");\n  document.getElementById(\"reportTabBtnPast\").classList.toggle(\"active\", tab===\"past\");\n  document.getElementById(\"reportTabBtnMock\").classList.toggle(\"active\", tab===\"mockexams\");\n  if(tab===\"past\") buildStudentPastSessionsList();\n  if(tab===\"mockexams\") buildStudentMockExamsList();\n}\n\n// closeSpellingPanel is still used by the contextual \"Practice Spellings\" feature\n// (Revise mode and Practice mode both open this same modal directly) — only the old\n// standalone entry point above it was retired, not the shared modal itself.\nfunction closeSpellingPanel(){\n  if(_spellingIsGate) return; // mandatory warm-up in progress — only finishSpellingGate() can close this\n  document.getElementById(\"spellingPanel\").classList.remove(\"visible\");\n}\n\n// ── STANDALONE SCOREBOARD PANEL (its own floating icon, alongside Practice Test / Spelling) ──\nfunction openScoreboardPanel(){\n  document.getElementById(\"scoreboardPanel\").classList.add(\"visible\");\n  buildStudentScoreboard();\n  renderHowToEarnPoints();\n}\nfunction closeScoreboardPanel(){\n  document.getElementById(\"scoreboardPanel\").classList.remove(\"visible\");\n}\n\n// ═══════════════════════════════════════════════════════\n//  POINTS HISTORY — a plain chronological log of exactly where\n//  points came from, visible to both student and admin\n// ═══════════════════════════════════════════════════════\nfunction openPointsHistoryPanel(){\n  document.getElementById(\"pointsHistoryPanel\")?.classList.add(\"visible\");\n  renderPointsHistory(\"today\");\n}\nfunction closePointsHistoryPanel(){\n  document.getElementById(\"pointsHistoryPanel\")?.classList.remove(\"visible\");\n}\n\n// Turns one raw log entry into a plain-language label — reused so the\n// wording stays identical between the toast, the Scoreboard, and this list.\nfunction describePointsEntry(e){\n  if(e.qtype===\"goodwill\") return { icon:\"🎁\", label: e.lessonTitle || \"Goodwill Points\" };\n  if(e.qtype===\"compensation\") return { icon:\"🎁\", label: e.lessonTitle || \"Compensation Bonus\" };\n  if(e.qtype===\"milestone\") return { icon:\"🏅\", label: e.lessonTitle || \"Milestone Complete\" };\n  if(e.qtype===\"lessonmastery\") return { icon:\"🏆\", label: `Lesson Mastered — ${e.lessonTitle||\"\"}` };\n  if(e.qtype===\"dailygoal\") return { icon:\"📋\", label: \"Daily Goal complete\" };\n  if(e.qtype===\"session_early\") return { icon:\"🌅\", label: `Early Morning session — ${e.lessonTitle||e.subject||\"\"}` };\n  if(e.qtype===\"session_late\") return { icon:\"🌅\", label: `Morning session — ${e.lessonTitle||e.subject||\"\"}` };\n  if(e.qtype===\"session_mornstart\") return { icon:\"🟠\", label: `Morning session started — ${e.lessonTitle||e.subject||\"\"}` };\n  if(e.qtype===\"session_evening\") return { icon:\"🌙\", label: `Evening session — ${e.lessonTitle||e.subject||\"\"}` };\n  if(e.qtype===\"session_evestart\") return { icon:\"🟠\", label: `Evening session started — ${e.lessonTitle||e.subject||\"\"}` };\n  if(e.qtype===\"session_both\") return { icon:\"🎉\", label: `Both sessions — ${e.lessonTitle||e.subject||\"\"}` };\n  if(e.qtype===\"dailytime\") return { icon:\"⏱\", label: e.lessonTitle || \"30+ min studied\" };\n  if(e.qtype===\"testpoints\") return { icon:\"📝\", label: `Practice Test — ${e.lessonTitle||\"\"}` };\n  if(e.qtype===\"newtry\") return { icon:\"🌱\", label: \"Tried a brand-new question\" };\n  if(e.qtype && e.qtype.indexOf(\"recite_fast_\")===0) return { icon:\"⚡\", label: `Read & Memorise — fast, accurate read (${e.lessonTitle||\"\"})` };\n  if(e.qtype && e.qtype.indexOf(\"recite_good_\")===0) return { icon:\"🕐\", label: `Read & Memorise — good pace (${e.lessonTitle||\"\"})` };\n  const qtObj = QTYPES.find(q=>q.id===e.qtype);\n  const qtLabel = qtObj ? qtObj.label : (e.qtype||\"Question\");\n  return { icon: qtObj?.icon || \"✏️\", label: `${e.lessonTitle||\"Lesson\"} — ${qtLabel}` };\n}\n\nasync function renderPointsHistory(range){\n  [\"phRangeToday\",\"phRangeWeek\"].forEach(id=>document.getElementById(id)?.classList.remove(\"active\"));\n  document.getElementById(\"phRange\"+range.charAt(0).toUpperCase()+range.slice(1))?.classList.add(\"active\");\n\n  const list = document.getElementById(\"pointsHistoryList\");\n  if(!list) return;\n  if(!window._fb || !currentUserPhone){ list.innerHTML = \"<p style='color:var(--muted);padding:12px'>Needs an internet connection.<\u002Fp>\"; return; }\n  list.innerHTML = \"Loading…\";\n\n  const { logsSnap, examSnap } = await getLogsBundle();\n  const firstPassEntries = aggregateScoreboardData(logsSnap, examSnap).allScoredEntries;\n\n  // Same catch-up sweep the Scoreboard runs — without this, opening Points\n  // History directly (without opening the Scoreboard first) could show a\n  // list missing anything not yet synced, even though the actual Growth\n  // Score total already includes it, causing exactly this kind of mismatch.\n  await sweepAllPendingBonuses();\n  await syncPointAchievementsToHistory(firstPassEntries);\n\n  const { logsSnap: logsSnap2, examSnap: examSnap2 } = await getLogsBundle();\n  const { allScoredEntries } = aggregateScoreboardData(logsSnap2, examSnap2);\n\n  // Test Points live in their own Firestore collection (written whenever a\n  // Lesson Test or Practice Test is taken) and were always correctly folded\n  // into the Growth Points total — but Points History only ever read from\n  // logs/examAnswers, never this collection, so every test score was\n  // invisible here even though it was genuinely counted in the total.\n  let testPointsEntries = [];\n  try{\n    const { db, collection, query, orderBy, getDocs } = window._fb;\n    const tpSnap = await getDocs(query(collection(db,\"sessions\",currentUserPhone,\"testPoints\"), orderBy(\"ts\",\"asc\")));\n    tpSnap.forEach(d=>{\n      const e = d.data();\n      const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : (typeof e.ts===\"number\" ? e.ts : null);\n      if(tsMs===null || typeof e.points!==\"number\") return;\n      testPointsEntries.push({ pct:e.pct??100, qtype:\"testpoints\", ts:tsMs, lessonTitle:e.lessonTitle||\"\", marks:e.points });\n    });\n  }catch(e){ /* fine — just won't show test points this time */ }\n\n  const now = Date.now();\n  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);\n  // \"Today\" means the actual calendar day (since midnight), not a rolling\n  // 24-hour window — the rolling version drifted throughout the day and\n  // could include part of yesterday's late-night activity instead of\n  // updating cleanly at 12am like a real \"today\" should.\n  const cutoff = range===\"today\" ? startOfToday.getTime() : range===\"week\" ? now - 7*24*60*60*1000 : 0;\n\n  // \"Points as of yesterday\" — derived from the ACTUAL displayed Growth\n  // Score (which runs through the floor), not an independent raw\n  // recalculation. The floor means the real displayed total can sit above\n  // what a fresh calculation of all entries would give — so yesterday must\n  // be computed as (today's floor-protected total) minus (today's raw\n  // contribution), guaranteeing yesterday + today always adds up to\n  // exactly the same number shown as the Growth Score everywhere else.\n  const totalTestPointsSum = testPointsEntries.reduce((sum,e)=>sum+(e.marks||0), 0);\n  const rawCurrentTotal = calcGrowthScore(new Set(), allScoredEntries, totalTestPointsSum).growthPoints;\n  const currentFlooredTotal = await applyGrowthPointsFloor(rawCurrentTotal); // the real, currently-displayed Growth Score\n  const yesterdayEntries = allScoredEntries.filter(e => e.ts < startOfToday.getTime());\n  const yesterdayTestPoints = testPointsEntries.filter(e => e.ts < startOfToday.getTime()).reduce((sum,e)=>sum+(e.marks||0), 0);\n  const yesterdayRaw = calcGrowthScore(new Set(), yesterdayEntries, yesterdayTestPoints).growthPoints;\n  const todaysContribution = rawCurrentTotal - yesterdayRaw;\n  const yesterdayTotal = currentFlooredTotal - todaysContribution;\n\n  const qualifying = [...allScoredEntries, ...testPointsEntries]\n    .filter(e => (e.qtype===\"testpoints\" || (e.pct??0) >= MIN_SCORE_FOR_GOAL_CREDIT) && e.ts >= cutoff)\n    .map(e => {\n      const isRealQType = QTYPES.some(q=>q.id===e.qtype);\n      const pts = typeof e.marks===\"number\" ? e.marks : getMarks(e.qtype); // approximate for older entries without a stored marks value\n      return { ...e, pts };\n    })\n    .filter(e => e.pts > 0)\n    .sort((a,b)=>b.ts-a.ts); // newest first\n\n  const yesterdayLine = `<div style=\"text-align:center;padding:8px 0;font-size:11.5px;color:var(--muted);border-bottom:1px dashed var(--border);margin-bottom:8px\">Points as of yesterday: <b style=\"color:var(--navy)\">${yesterdayTotal.toLocaleString()}<\u002Fb><\u002Fdiv>`;\n\n  if(!qualifying.length){\n    list.innerHTML = yesterdayLine + `<p style=\"color:var(--muted);padding:16px;text-align:center\">No points earned ${range===\"today\"?\"today\":range===\"week\"?\"this week\":\"yet\"}.<\u002Fp>`;\n    return;\n  }\n\n  const totalPts = range===\"today\" ? todaysContribution : qualifying.reduce((sum,e)=>sum+e.pts, 0);\n  list.innerHTML = yesterdayLine + `\n    <div style=\"text-align:center;padding:10px 0 14px;font-size:13px;color:var(--muted)\">\n      <b style=\"color:var(--green);font-size:18px\">+${totalPts.toLocaleString()}<\u002Fb> points ${range===\"today\"?\"earned today\":range===\"week\"?\"earned this week\":\"earned in total\"}\n    <\u002Fdiv>\n    ${qualifying.map(e=>{\n      const { icon, label } = describePointsEntry(e);\n      const timeLabel = new Date(e.ts).toLocaleString(undefined, { month:\"short\", day:\"numeric\", hour:\"numeric\", minute:\"2-digit\" });\n      return `<div class=\"ph-row\">\n        <div class=\"ph-label\">${icon} ${label}<span class=\"ph-time\">${timeLabel}<\u002Fspan><\u002Fdiv>\n        <div class=\"ph-pts\">+${e.pts}<\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join(\"\")}\n  `;\n}\n\n// Plain-language explanation of every way the Growth Score actually moves —\n// shown collapsed by default so it doesn't compete with the live numbers,\n// but always one tap away. The goal is that he understands the LEVERS, not\n// just the result.\nfunction renderHowToEarnPoints(targetId){\n  const box = document.getElementById(targetId||\"scoreboardHowToEarn\");\n  if(!box) return;\n  box.innerHTML = `\n    <details>\n      <summary style=\"cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);padding:10px 12px;background:var(--parchment);border-radius:10px;list-style:none\">💡 How do I earn points? ▾<\u002Fsummary>\n      <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:8px\">\n\n        <div style=\"font-size:11px;color:var(--muted);padding:0 2px\">There are two different numbers — here's what each one means:<\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px solid var(--gold,#d1983f);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🏆 Growth Points — never goes down<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Every question you answer well adds points permanently. It only ever climbs — this is the number that shows you're building something over time.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11px;font-weight:700;color:var(--navy);padding:6px 2px 0\">How Growth Points add up — every answer 50%+ counts:<\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">✏️ Each question you answer well<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">+1 point for MCQ/Fill/True-False, +2 for Brief/Reasons, +3 for Distinguish/Quote from Memory, +5 for Match/Paragraph. Harder questions are worth more. The very first time you answer a specific question, it's worth double.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">⚡ Speed Bonus — +5 or +2 per written question<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Answer written questions fast and well (50%+) to earn extra points on top of the base mark.<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.8\">Brief/Reasons: under 2–3 min = +5 · under 4–5 min = +2<br>Paragraph: under 5 min = +5 · under 8 min = +2<br>Distinguish: under 4 min = +5 · under 6 min = +2<br>Memorise: under 3 min = +5 · under 5 min = +2<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">📅 Daily Goal — +10 per day<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Score 50%+ on at least one question of every active type in the same day. Every day you do this adds another +10, forever.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🌅 Morning Session — +70 or +50 per subject<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Cover all question types in a subject between 6:00–6:59am for +70, or 7:00–7:59am for +50. Each subject earns its own bonus. Started but not finished = +10.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🌙 Evening Session — +50 per subject, +50 for both<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Cover all question types in a subject between 5:00–9:00pm for +50. Both a morning AND an evening session in the same subject on the same day = an extra +50. Started but not finished = +10.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">⏱ Daily Time Bonus — +100 per subject<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Spend at least 30 minutes studying a subject in one day (any score counts, this is about time invested) for +100. Separate from the session bonuses above — this is purely about time spent, not covering every question type.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🧪 Practice/Lesson Test — 300 to 700 points<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Test an entire lesson in one go (no peeking allowed!). Score 60%+ for 300 points, 80%+ for 500, and a perfect 100% earns 700 points — scaled a little by how hard the lesson's questions are.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">📖 Read & Memorise — +3 or +1<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">In Revise mode, read a Brief/Reasons/Distinguish/Paragraph answer aloud accurately (70%+ match) and quickly for +3, or at a normal pace for +1.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🌱 New Question Bonus — +10<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">The first time you ever attempt a specific Brief/Reasons/Distinguish/Paragraph/Memorise/Match question, you get +10 just for trying it — no daily limit, since each question can only be \"new\" once.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🏆 Lesson Mastery — +200<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Once every question in a lesson is genuinely mastered (80%+, without peeking) AND the admin has marked that lesson \"Complete,\" it's worth a one-time +200.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🏅 Milestones — +1000 each<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Big, rare rewards for mastering a whole batch of Social Science lessons across all subjects at once. Unlocked strictly in order, one at a time.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--navy)\">🎁 Goodwill Points &amp; Compensation<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">Occasional bonuses the admin can award for good effort or behavior (kept small and capped so they stay meaningful), plus one-time apology bonuses if something ever needed correcting.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:10.5px;color:var(--muted);text-align:center;margin-top:2px\">⚠️ Answers below 50% don't count toward any of this — quality matters, not just clicking through.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdetails>`;\n}\n\n// ═══════════════════════════════════════════════════════\n//  SHARED LOGS BUNDLE — fixes slow scoreboard loads\n// ═══════════════════════════════════════════════════════\n// Every scoreboard-style view (student scoreboard, admin scoreboard, the\n// welcome-back popup) independently re-fetched the ENTIRE logs +\n// examAnswers + testPoints history from Firestore, one request at a time,\n// every single time it opened — three sequential network round trips,\n// getting slower as more history piles up. This fixes both problems:\n//  1. The three fetches now run in PARALLEL (Promise.all) instead of one\n//     after another — roughly a 3x cut in load time on its own.\n//  2. The result is cached in memory for a few seconds, so opening the\n//     scoreboard right after it was already loaded (or right after the\n//     welcome-back popup fetched the same data) is instant, not a second\n//     round trip. The cache is invalidated immediately the moment a new\n//     answer is actually logged, so it never shows stale numbers.\nlet _logsBundleCache = null; // { logsSnap, examSnap, totalTestPoints, ts }\nconst LOGS_BUNDLE_TTL_MS = 20000;\n\nfunction invalidateLogsBundleCache(){ _logsBundleCache = null; }\n\nasync function getLogsBundle(){\n  if(_logsBundleCache && (Date.now()-_logsBundleCache.ts) < LOGS_BUNDLE_TTL_MS){\n    return _logsBundleCache;\n  }\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  const [logsSnap, examSnap, totalTestPoints] = await Promise.all([\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"logs\"), orderBy(\"ts\",\"asc\"))),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"examAnswers\"), orderBy(\"ts\",\"asc\"))),\n    fetchTotalTestPoints()\n  ]);\n  _logsBundleCache = { logsSnap, examSnap, totalTestPoints, ts: Date.now() };\n  return _logsBundleCache;\n}\n\n// ═══════════════════════════════════════════════════════\n//  LIVE GROWTH POINTS BADGE — a real, always-visible score,\n//  not just a fleeting toast\n// ═══════════════════════════════════════════════════════\n// Loaded once (the real total, calculated the exact same way the Scoreboard\n// does), then kept in sync purely in memory from that point on — every time\n// points are earned anywhere in the app, this number bumps immediately, with\n// a little pulse, right in the header. No waiting to open the Scoreboard to\n// see it move.\nlet _liveGrowthPoints = null;\n\n// ═══════════════════════════════════════════════════════\n//
