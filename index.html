  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-thumb{background:var(--navy-light);border-radius:4px}\n}\n.sidebar-logo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}\n.sidebar-logo h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:.3px;font-family:var(--font-display)}\n.sidebar-logo p{font-size:11px;color:rgba(255,255,255,.45);margin-top:3px}\n.sidebar-nav{flex:1;padding:10px 0}\n.sidebar-section{padding:10px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.35)}\n.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);border-left:3px solid transparent;transition:all .15s}\n.sidebar-item:hover{background:rgba(255,255,255,.06);color:#fff}\n.sidebar-item.active{background:rgba(255,255,255,.08);color:var(--gold);border-left-color:var(--gold);font-weight:700}\n.sidebar-item .si-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}\n.sidebar-score{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px}\n.sidebar-score.good{background:rgba(74,152,115,.2);color:var(--green)}\n.sidebar-score.mid{background:rgba(209,152,63,.15);color:var(--gold)}\n.sidebar-score.poor{background:rgba(209,95,90,.15);color:var(--red)}\n\n/* ── MAIN ── */\n.main-content{flex:1;display:flex;flex-direction:column;min-width:0;padding-bottom:70px}\n@media(min-width:820px){.main-content{padding-bottom:0}}\n\n/* ── MOBILE HEADER ── */\n.mobile-header{background:var(--navy);color:#fff;padding:16px 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}\n@media(min-width:820px){.mobile-header{display:none}}\n.mobile-header h1{font-size:17px;font-weight:800;font-family:var(--font-display)}\n.mobile-header p{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}\n\n/* ── DESKTOP HEADER ── */\n.desktop-header{display:none}\n@media(min-width:820px){\n  .desktop-header{display:flex;align-items:center;justify-content:space-between;padding:28px 36px 0}\n  .desktop-header h2{font-size:22px;font-weight:800;color:var(--navy);font-family:var(--font-display)}\n  .desktop-header p{font-size:13px;color:var(--muted);margin-top:3px}\n  .progress-overview{display:flex;gap:16px}\n  .ov-stat{background:#fff;border-radius:var(--radius);padding:12px 20px;text-align:center;box-shadow:var(--shadow);min-width:80px}\n  .ov-num{font-size:22px;font-weight:800;color:var(--navy)}\n  .ov-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}\n}\n\n/* ── MOBILE TABS ── */\n.subject-tabs{display:flex;background:var(--navy-mid);overflow-x:auto;scrollbar-width:none;position:sticky;top:61px;z-index:99}\n.subject-tabs::-webkit-scrollbar{display:none}\n@media(min-width:820px){.subject-tabs{display:none}}\n.subject-tab{flex:1;min-width:max-content;padding:10px 16px;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap;transition:all .2s;text-transform:uppercase}\n.subject-tab.active{color:var(--gold);border-bottom-color:var(--gold)}\n.part-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:101px;z-index:98}\n.part-tabs::-webkit-scrollbar{display:none}\n@media(min-width:820px){.part-tabs{display:none}}\n.part-tab{flex:1;min-width:max-content;padding:10px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap;transition:all .2s}\n.part-tab.active{color:var(--navy);border-bottom-color:var(--navy)}\n\n/* ── LESSON GRID ── */\n.lesson-pane{padding:14px 14px 0}\n@media(min-width:820px){.lesson-pane{padding:20px 36px}}\n.part-heading{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:8px 2px 6px}\n@media(min-width:820px){.part-heading{font-size:14px;padding:0 0 12px;color:var(--navy);letter-spacing:.3px}}\n.lesson-grid{display:grid;grid-template-columns:1fr;gap:10px}\n@media(min-width:820px){.lesson-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}}\n.lesson-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:transform .15s,box-shadow .15s;border:1.5px solid transparent;color:inherit}\n.lesson-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border)}\n.lesson-card:active{transform:scale(.98)}\n.lesson-num{width:34px;height:34px;background:var(--navy);color:var(--gold);border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.lesson-info{flex:1;min-width:0}\n.lesson-name{font-size:14px;font-weight:600;margin-bottom:3px;line-height:1.3}\n.lesson-meta{font-size:11px;color:var(--muted)}\n.lesson-score-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;flex-shrink:0;align-self:flex-start;margin-top:2px}\n.lesson-score-badge.good{background:var(--green-light);color:var(--green)}\n.lesson-score-badge.mid{background:var(--gold-light);color:#9c7519}\n.lesson-score-badge.poor{background:var(--red-light);color:var(--red)}\n\n/* ── BOTTOM NAV ── */\n.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:300;height:60px}\n@media(min-width:820px){.bottom-nav{display:none}}\n.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--muted);gap:2px;text-transform:uppercase;transition:color .2s}\n.nav-item.active{color:var(--navy)}\n.nav-icon{font-size:20px}\n\n/* ── QUIZ OVERLAY ── */\n.quiz-overlay{display:none;position:fixed;inset:0;z-index:500;background:var(--parchment);flex-direction:column;overflow-y:auto}\n.quiz-overlay.visible{display:flex}\n@media(min-width:820px){.quiz-overlay{left:var(--sidebar-w)}}\n\n.quiz-header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;flex-shrink:0}\n.quiz-growth-badge{background:rgba(73,181,126,.18);color:#8ad4ab;font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;white-space:nowrap;transition:transform .2s}\n.quiz-growth-badge.bump{transform:scale(1.18)}\n.back-btn{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}\n.quiz-title-wrap{flex:1;min-width:0}\n.quiz-lesson-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.quiz-part-label{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}\n.q-counter{font-size:12px;color:rgba(255,255,255,.6);flex-shrink:0}\n.progress-bar{height:3px;background:rgba(255,255,255,.15);flex-shrink:0}\n.progress-fill{height:100%;background:var(--gold);transition:width .4s ease}\n\n/* ── QUESTION TYPE TABS (inside quiz) ── */\n.qtype-tabs-wrap{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0;position:sticky;top:57px;z-index:9}\n.qtype-tabs-wrap::-webkit-scrollbar{display:none}\n.qtype-tabs{display:flex;min-width:max-content}\n.qtype-tab{padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:5px}\n.qtype-tab.active{color:var(--navy);border-bottom-color:var(--navy)}\n.qtype-tab .qt-count{font-size:10px;background:var(--parchment);color:var(--muted);padding:1px 6px;border-radius:6px;font-weight:700}\n.qtype-tab.active .qt-count{background:var(--navy);color:#fff}\n\n/* ── SPEED TIMER ── */\n#speedTimerWrap{margin:0 0 10px}\n#speedTimerBar{height:5px;border-radius:3px;transition:width .5s linear,background .5s;background:var(--green)}\n#speedTimerLabel{font-size:11px;font-weight:700;margin-top:4px;display:flex;justify-content:space-between;align-items:center}\n#speedTimerLabel .timer-pts{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:800;background:var(--green);color:#fff;transition:background .5s}\n\n/* ── QUIZ BODY ── */\n.quiz-body{flex:1;padding:20px 16px;max-width:700px;width:100%;margin:0 auto}\n@media(min-width:820px){.quiz-body{padding:28px 32px}}\n\n.question-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}\n.q-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}\n.q-num{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}\n.q-text{font-size:16px;font-weight:600;line-height:1.5;color:var(--navy)}\n\n/* distinguish layout */\n.q-text.distinguish{font-size:15px}\n.dist-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 0}\n.dist-input-col{display:flex;flex-direction:column;gap:6px}\n.dist-input-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--navy);padding:6px 10px;background:var(--parchment);border-radius:8px 8px 0 0;border:1.5px solid var(--border);border-bottom:none;text-align:center}\n.dist-textarea{width:100%;min-height:130px;padding:12px;font-size:14px;font-family:inherit;border:1.5px solid var(--border);border-radius:0 0 8px 8px;outline:none;resize:vertical;color:var(--text);background:#fff;line-height:1.7;box-sizing:border-box}\n.dist-textarea:focus{border-color:var(--navy)}\n.dist-textarea:disabled{background:var(--parchment);color:var(--muted);cursor:not-allowed;opacity:.6}\n/* distinguish model answer table */\n.dist-table{width:100%;border-collapse:collapse;margin-top:10px;border-radius:10px;overflow:hidden;border:1.5px solid var(--green)}\n.dist-table th{background:var(--navy);color:#fff;padding:9px 12px;font-size:12px;font-weight:700;text-align:left;width:50%}\n.dist-table td{padding:9px 12px;font-size:13px;line-height:1.75;vertical-align:top;border-top:1px solid var(--border)}\n.dist-table tr:nth-child(odd) td{background:var(--green-light)}\n.dist-table tr:nth-child(even) td{background:#fff}\n.dist-table td:first-child{border-right:1.5px solid var(--border)}\n/* your answer two-box result */\n.dist-your-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}\n.dist-your-box{background:var(--parchment);border-radius:8px;padding:10px 12px}\n.dist-your-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:6px}\n/* distinguish peek */\n.dist-peek-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.dist-peek-box{background:rgba(255,255,255,.5);border-radius:6px;padding:8px}\n.dist-peek-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--green);margin-bottom:4px}\n\n/* fill in the blank */\n.blank-input{border:none;border-bottom:2.5px solid var(--navy);background:transparent;font-size:15px;font-weight:600;color:var(--navy);padding:3px 8px;min-width:130px;max-width:200px;outline:none;font-family:inherit;border-radius:0;vertical-align:baseline;transition:border-color .2s}\n.blank-input:focus{border-bottom-color:var(--gold);background:var(--gold-light)}\n.blank-input:disabled{background:transparent}\n.fill-sentence{font-size:16px;line-height:2.4;color:var(--text);padding:16px;background:var(--parchment);border-radius:var(--radius)}\n\n/* match the following */\n.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}\n.match-col-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}\n.match-left-item{background:var(--parchment);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:8px}\n.match-right-select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);margin-bottom:8px;outline:none;cursor:pointer}\n.match-right-select:focus{border-color:var(--navy)}\n\n/* MCQ / choose correct */\n.mcq-options{display:flex;flex-direction:column;gap:8px;margin-top:14px}\n.mcq-option{background:var(--parchment);border:1.5px solid transparent;border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}\n.mcq-option:hover{border-color:var(--navy);background:#fff;transform:translateY(-1px);box-shadow:var(--shadow)}\n.mcq-option.selected{border-color:var(--navy);background:#fff}\n.mcq-option.correct{border-color:var(--green);background:var(--green-light);color:var(--green)}\n.mcq-option.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}\n.mcq-opt-letter{width:24px;height:24px;border-radius:50%;background:rgba(32,42,61,.1);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.mcq-option.selected .mcq-opt-letter{background:var(--navy);color:#fff}\n.mcq-option.correct .mcq-opt-letter{background:var(--green);color:#fff}\n.mcq-option.wrong   .mcq-opt-letter{background:var(--red);color:#fff}\n\n/* answer textarea */\n.answer-area{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}\n.answer-textarea{width:100%;min-height:130px;padding:16px;font-size:15px;font-family:inherit;border:none;outline:none;resize:none;color:var(--text);background:transparent;line-height:1.6}\n.answer-textarea:disabled{background:var(--parchment);color:var(--muted);cursor:not-allowed;opacity:.6}\n.answer-actions{display:flex;border-top:1px solid var(--border)}\n.btn-check{flex:1;padding:13px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;letter-spacing:.4px;transition:background .2s;font-family:inherit}\n.btn-check:disabled{opacity:.5;cursor:default}\n.btn-check:hover:not(:disabled){background:var(--navy-light)}\n.btn-skip{padding:13px 18px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border:none;border-left:1px solid var(--border);cursor:pointer;font-family:inherit}\n.ai-feedback-box{font-size:13.5px;line-height:1.8;color:var(--text);border-left:3px solid var(--navy);padding-left:12px;white-space:pre-line;margin-top:10px}\n.ai-graded-badge{display:inline-block;font-size:10px;font-weight:700;background:rgba(32,42,61,.08);color:var(--navy);padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}\n\n/* result panel */\n.result-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;display:none}\n.result-panel.visible{display:block}\n.score-stamp{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}\n.score-circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;border:3px solid}\n.score-circle.perfect{background:var(--green-light);color:var(--green);border-color:var(--green)}\n.score-circle.good{background:var(--gold-light);color:#9c7519;border-color:var(--gold)}\n.score-circle.poor{background:var(--red-light);color:var(--red);border-color:var(--red)}\n.score-label{font-size:14px;font-weight:700;margin-bottom:2px}\n.score-detail{font-size:11px;color:var(--muted)}\n.result-section{margin-bottom:14px}\n.result-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;gap:5px}\n.result-section-title.correct{color:var(--green)}\n.result-section-title.misspelled{color:#9c7519}\n.result-section-title.missing{color:var(--red)}\n.highlighted-answer{font-size:14px;line-height:1.9;color:var(--text);background:var(--parchment);border-radius:8px;padding:12px}\n.word-ok{color:var(--green)}\n.word-wrong{background:var(--red-light);color:var(--red);border-radius:2px;padding:0 2px;text-decoration:line-through}\n.word-missing{background:var(--gold-light);color:#8a651b;border-radius:3px;padding:1px 5px;font-style:italic;font-size:12px}\n.word-correction{font-size:11px;color:var(--green);font-style:normal;font-weight:700;text-decoration:none;margin-left:2px;background:var(--green-light);border-radius:3px;padding:0 3px}\n.ideal-answer{font-size:13px;line-height:1.8;color:var(--text);background:var(--green-light);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:10px 12px;white-space:pre-line}\n\n.btn-row{display:flex;gap:10px;margin-bottom:24px}\n.btn-next{flex:1;padding:14px;background:var(--gold);color:var(--navy);font-size:15px;font-weight:800;border:none;border-radius:var(--radius);cursor:pointer;letter-spacing:.3px;transition:all .2s;font-family:inherit;box-shadow:0 4px 16px rgba(209,152,63,.3)}\n.btn-next:hover{box-shadow:0 6px 20px rgba(209,152,63,.4);transform:translateY(-1px)}\n.btn-next:active{opacity:.85}\n.btn-try-again{padding:14px 18px;background:#fff;color:var(--navy);font-size:14px;font-weight:700;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:border-color .2s,background .2s}\n.btn-try-again:hover{border-color:var(--navy);background:var(--parchment)}\n\n/* no questions placeholder */\n.no-questions{padding:32px 16px;text-align:center;color:var(--muted)}\n.no-questions .nq-icon{font-size:36px;margin-bottom:10px}\n.no-questions p{font-size:14px}\n\n/* summary */\n.summary-screen{display:none;padding:32px 16px;text-align:center;max-width:500px;margin:0 auto;width:100%}\n.summary-screen.visible{display:block}\n.summary-trophy{font-size:56px;margin-bottom:12px}\n.summary-title{font-size:22px;font-weight:800;color:var(--navy);font-family:var(--font-display)}\n.summary-score{font-size:52px;font-weight:900;color:var(--gold);margin:14px 0 4px;font-family:var(--font-display)}\n.summary-subtitle{font-size:14px;color:var(--muted);margin-bottom:24px}\n.summary-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}\n.stat-box{background:#fff;border-radius:var(--radius);padding:14px 8px;box-shadow:var(--shadow)}\n.stat-num{font-size:24px;font-weight:800}\n.stat-num.green{color:var(--green)} .stat-num.amber{color:#9c7519} .stat-num.red{color:var(--red)}\n.stat-label{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}\n.btn-retry{width:100%;padding:14px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;margin-bottom:10px;font-family:inherit}\n.btn-back-lessons{width:100%;padding:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-family:inherit}\n\n/* ── WELCOME / PASSCODE SCREEN ── */\n.welcome-screen{\n  position:fixed;inset:0;z-index:2000;\n  background:\n    radial-gradient(circle at 15% 8%, rgba(209,152,63,.10), transparent 45%),\n    radial-gradient(circle at 85% 88%, rgba(74,152,115,.08), transparent 50%),\n    linear-gradient(160deg, #171f30 0%, #202a3d 45%, #293854 100%);\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  padding:32px 24px;text-align:center;\n  transition:opacity .4s ease;\n  overflow:hidden;\n}\n.welcome-screen.fade-out{opacity:0;pointer-events:none}\n.welcome-screen.gone{display:none}\n.wl-bg-decor{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}\n.wl-float{position:absolute;font-size:22px;opacity:.16;animation:wlFloat 9s ease-in-out infinite}\n@keyframes wlFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-22px) rotate(8deg)}}\n.wl-icon{font-size:58px;margin-bottom:14px;animation:bob 2.4s ease-in-out infinite;position:relative;z-index:1}\n@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-3deg)}}\n.wl-title{font-size:28px;font-weight:900;color:#fff;letter-spacing:.3px;margin-bottom:4px;position:relative;z-index:1;background:linear-gradient(90deg,#fff,#f3ddab);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:var(--font-display)}\n.wl-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:6px;line-height:1.5;position:relative;z-index:1}\n.wl-motivate{font-size:12.5px;color:var(--gold);font-weight:700;margin-bottom:16px;position:relative;z-index:1;min-height:18px}\n.wl-verse{\n  margin-top:16px;\n  padding-top:14px;\n  border-top:1px solid rgba(255,255,255,.1);\n  text-align:center;\n  animation:verseFadeIn 1.2s ease forwards;\n  opacity:0;\n}\n@keyframes verseFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n.wl-verse-text{\n  font-size:14px;\n  color:rgba(255,255,255,.85);\n  font-style:italic;\n  line-height:1.8;\n  font-family:Georgia,serif;\n  letter-spacing:.2px;\n  display:block;\n  animation:textPulse 4s ease-in-out 1.2s infinite;\n}\n@keyframes textPulse{0%,100%{color:rgba(255,255,255,.85)}50%{color:rgba(255,255,255,1)}}\n.wl-verse-ref{\n  display:block;\n  margin-top:8px;\n  font-size:10px;\n  font-weight:700;\n  font-style:normal;\n  color:var(--gold);\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n  opacity:.8;\n}\n.wl-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);\n  border-radius:18px;padding:28px 24px;width:100%;max-width:360px;position:relative;z-index:1;\n  box-shadow:0 20px 60px rgba(0,0,0,.35), 0 0 0 1px rgba(209,152,63,.06)}\n.wl-card-title{font-size:13px;font-weight:700;text-transform:uppercase;\n  letter-spacing:1px;color:rgba(255,255,255,.45);margin-bottom:16px}\n.wl-input-wrap{position:relative;margin-bottom:12px}\n.wl-input{\n  width:100%;padding:14px 48px 14px 18px;\n  background:rgba(255,255,255,.08);\n  border:1.5px solid rgba(255,255,255,.15);\n  border-radius:12px;font-size:18px;font-family:inherit;\n  color:#fff;letter-spacing:3px;text-align:center;outline:none;\n  transition:border-color .2s;\n}\n.wl-input::placeholder{letter-spacing:1px;font-size:14px;color:rgba(255,255,255,.3)}\n.wl-input:focus{border-color:var(--gold)}\n.wl-input.error{border-color:var(--red);animation:shake .35s ease}\n@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}\n.wl-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);\n  background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;\n  font-size:18px;padding:4px;line-height:1}\n.wl-toggle:hover{color:rgba(255,255,255,.8)}\n.wl-error{font-size:12px;color:var(--red);min-height:18px;margin-bottom:10px;font-weight:600}\n.wl-btn{\n  width:100%;padding:14px;background:linear-gradient(135deg,#e0b562,var(--gold));color:var(--navy);\n  font-size:15px;font-weight:800;border:none;border-radius:12px;\n  cursor:pointer;font-family:inherit;letter-spacing:.4px;\n  transition:opacity .2s,transform .15s,box-shadow .2s;\n  box-shadow:0 6px 20px rgba(209,152,63,.25);\n}\n.wl-btn:hover{opacity:.95;transform:translateY(-1px);box-shadow:0 8px 24px rgba(209,152,63,.35)}\n.wl-btn:active{transform:scale(.98)}\n.wl-footer{font-size:11px;color:rgba(255,255,255,.25);margin-top:28px}\n\n::-webkit-scrollbar{width:6px;height:6px}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}\n\n.mode-toggle{display:flex;background:var(--parchment);border-radius:8px;padding:2px;gap:2px;flex-shrink:0}\n.mode-toggle-btn{padding:4px 8px;border:none;border-radius:6px;background:transparent;font-size:14px;cursor:pointer;transition:background .15s;line-height:1}\n.mode-toggle-btn.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}\n.q-timer-bar{display:flex;align-items:center;gap:6px;padding:4px 14px;background:var(--parchment);border-bottom:1px solid var(--border);font-size:12px}\n.q-timer-bar .q-timer-label{color:var(--muted);font-weight:500}\n.q-timer-bar .q-timer{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;font-size:12px}\n\n/* ── MOCK EXAM ANSWER SHEET ── */\n.mock-answer-sheet{display:none;padding:20px 16px 40px;max-width:700px;margin:0 auto}\n.mock-answer-sheet.visible{display:block}\n.mas-header{text-align:center;padding-bottom:20px;border-bottom:2px dashed var(--border);margin-bottom:24px}\n.mas-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:4px;font-family:var(--font-display)}\n.mas-meta{font-size:12px;color:var(--muted);margin-bottom:16px}\n.mas-mark-row{display:flex;justify-content:center;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}\n.mas-stats{display:flex;gap:16px;justify-content:center;margin-top:16px}\n.mas-stat{text-align:center}\n.mas-stat-num{font-size:22px;font-weight:800}\n.mas-stat-num.green{color:var(--green)}\n.mas-stat-num.amber{color:#cf8f2e}\n.mas-stat-num.red{color:var(--red)}\n.mas-stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}\n\n/* Per-question card */\n.mas-q-card{border-radius:12px;padding:16px;margin-bottom:14px;border:1.5px solid var(--border);background:#fff;position:relative}\n.mas-q-card.good{border-color:var(--green);background:var(--green-light)}\n.mas-q-card.mid {border-color:#cf8f2e;background:var(--gold-light)}\n.mas-q-card.poor{border-color:var(--red);background:var(--red-light)}\n.mas-q-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}\n.mas-q-num{font-size:11px;font-weight:700;color:var(--muted);flex:1}\n.mas-q-type{font-size:10px;background:var(--navy);color:#fff;border-radius:10px;padding:2px 7px;font-weight:700}\n.mas-q-score{font-size:13px;font-weight:800;font-family:'Courier New',monospace}\n.mas-q-score.good{color:var(--green)}\n.mas-q-score.mid {color:#9c7519}\n.mas-q-score.poor{color:var(--red)}\n.mas-q-time{font-size:11px;color:var(--muted)}\n.mas-q-text{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;line-height:1.5}\n.mas-section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}\n.mas-section-lbl.yours{color:var(--muted)}\n.mas-section-lbl.model{color:var(--green)}\n.mas-your-ans{font-size:13px;line-height:1.8;padding:8px 10px;background:rgba(255,255,255,.7);border-radius:6px;margin-bottom:8px}\n.mas-model-ans{font-size:13px;line-height:1.8;padding:8px 10px;background:var(--green-light);border-radius:6px;border-left:3px solid var(--green);white-space:pre-line;color:var(--text)}\n\n/* Spelling report */\n.mas-section-heading{font-size:13px;font-weight:800;color:var(--navy);margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border)}\n.spell-table{width:100%;border-collapse:collapse;font-size:13px}\n.spell-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}\n.spell-table td{padding:8px 12px;border-bottom:1px solid var(--border)}\n.spell-table tr:nth-child(even) td{background:var(--parchment)}\n.spell-wrong{text-decoration:line-through;color:var(--red);font-weight:700}\n.spell-right{color:var(--green);font-weight:700;margin-left:6px}\n\n/* Improve section */\n.improve-card{background:var(--parchment);border-radius:10px;padding:14px;margin-bottom:10px;border-left:3px solid var(--navy)}\n.improve-lesson{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}\n.improve-text{font-size:13px;color:var(--text);line-height:1.6}\n.marks-chip{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:10px;padding:2px 8px;letter-spacing:.3px}\n.time-chip.fast{background:var(--green-light);border-color:var(--green);color:var(--green)}\n.time-chip.slow{background:var(--gold-light);border-color:var(--gold);color:#7d5c1e}\n/* ── LESSON CARD MODE BUTTONS ── */\n.lesson-card-modes{display:flex;gap:6px;margin-top:8px}\n.btn-revise{flex:1;padding:7px 0;background:var(--parchment);border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;transition:all .15s}\n.btn-revise:hover{background:var(--gold-light);border-color:var(--gold)}\n.btn-practice{flex:1;padding:7px 0;background:var(--navy);border:1.5px solid var(--navy);border-radius:8px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;transition:all .15s}\n.btn-practice:hover{background:var(--navy-mid)}\n.btn-test{flex:1;padding:7px 0;background:#fff;border:1.5px solid #cf8f2e;border-radius:8px;font-size:12px;font-weight:700;color:#9c7519;cursor:pointer;font-family:inherit;transition:all .15s}\n.btn-test:hover{background:#f8ecd2}\n/* ── REVISE MODE ── */\n.revise-body{padding:16px;max-width:700px;margin:0 auto;padding-bottom:60px}\n.revise-qtype-section{margin-bottom:28px}\n.revise-qtype-heading{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:6px 10px;background:var(--parchment);border-radius:6px;margin-bottom:12px;display:flex;align-items:center;gap:6px}\n.revise-card{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07);padding:16px;margin-bottom:12px}\n.revise-q-num{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}\n.revise-q{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;line-height:1.5}\n.revise-answer{font-size:13px;line-height:1.9;color:var(--text);border-left:3px solid var(--green);padding-left:12px;white-space:pre-line}\n.revise-mcq-opt{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--parchment);color:var(--muted);margin-bottom:5px}\n.revise-mcq-opt.correct{background:var(--green-light);color:var(--green);font-weight:700;border-left:3px solid var(--green)}\n.revise-blank{display:inline-block;background:var(--green-light);color:var(--green);font-weight:700;border-bottom:2px solid var(--green);padding:0 8px;border-radius:4px;margin:0 2px}\n.revise-match-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}\n.revise-match-table th{background:var(--navy);color:#fff;padding:7px 10px;font-size:11px;font-weight:700;text-align:left}\n.revise-match-table td{padding:7px 10px;border:1px solid var(--border)}\n.revise-match-table tr:nth-child(odd) td{background:var(--parchment)}\n.revise-spelling-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;margin-bottom:20px;background:rgba(73,181,126,.12);border:1.5px solid rgba(73,181,126,.35);border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;transition:transform .15s}\n.revise-spelling-cta:hover{transform:translateY(-1px)}\n.revise-spelling-cta:active{transform:scale(.98)}\n.revise-spelling-cta .rsc-title{font-size:14px;font-weight:800;color:var(--green)}\n.revise-spelling-cta .rsc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}\n.revise-spelling-cta .rsc-arrow{font-size:18px;color:var(--green);flex-shrink:0}\n.mock-exam-bar{display:flex;align-items:center;gap:10px;padding:8px 0 14px}\n.btn-mock-exam{padding:9px 18px;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap;box-shadow:0 3px 12px rgba(32,42,61,.25)}\n.btn-mock-exam:hover{background:var(--navy-mid)}\n.mock-exam-hint{font-size:12px;color:var(--muted)}\n\n/* ── MOCK EXAM MODAL ── */\n.mock-exam-box{background:#fff;border-radius:16px;width:min(96vw,600px);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.18)}\n.mock-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}\n.mock-title{font-size:18px av-next:not(:disabled):hover{border-color:var(--navy);background:var(--parchment)}\n.q-nav-dots-wrap{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0;align-items:center}\n.q-nav-dots-wrap::-webkit-scrollbar{display:none}\n.mock-submit-bar{position:sticky;bottom:0;z-index:10;background:#fff;border-top:1.5px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,.08)}\n.mock-submit-progress{font-size:13px;font-weight:600;color:var(--muted)}\n.mock-submit-btn{padding:10px 24px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}\n.mock-submit-btn:hover{background:#3d8563}\n\n/* ── MODEL ANSWER PEEK (study mode) ── */\n.btn-peek{width:100%;padding:11px;background:transparent;color:var(--sage);font-size:13px;font-weight:600;border:1.5px dashed var(--sage);border-radius:var(--radius);cursor:pointer;font-family:inherit;margin-bottom:10px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}\n.btn-peek.peeking{background:var(--parchment);color:var(--muted);border-color:var(--border);border-style:solid;font-weight:700}\n.btn-peek:hover{background:var(--green-light);border-color:var(--green);color:var(--green)}\n.peek-panel{background:var(--green-light);border-left:3px solid var(--green);border-radius:0 var(--radius) var(--radius) 0;padding:12px;margin-bottom:10px;display:none}\n.peek-panel.visible{display:block}\n.peek-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--green);margin-bottom:6px}\n.peek-text{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-line}\n\n/* ── VOICE INPUT (SPEAK ANSWER) ── */\n.voice-input-row{display:flex;align-items:center;gap:8px;margin:0 12px 8px}\n.btn-mic{padding:8px 14px;background:var(--parchment);color:var(--navy);border:1.5px solid rap{display:flex;flex-direction:column;align-items:center;margin:20px 0 8px}\n.paper-teacher-mark{\n  position:relative;width:120px;height:120px;border-radius:50%;\n  border:4.5px solid var(--red);background:#202a3d;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  box-shadow:0 3px 20px rgba(209,95,90,.4);transform:rotate(-3deg);\n  font-family:'Courier New',monospace;\n}\n.paper-teacher-mark.great{border-color:#49b57e;box-shadow:0 3px 20px rgba(74,152,115,.4);background:#1a3030}\n.paper-teacher-mark.good {border-color:#cf8f2e;box-shadow:0 3px 20px rgba(209,152,63,.4);background:#2a2010}\n.paper-teacher-mark .ptm-score{font-size:30px;font-weight:900;line-height:1;color:#cf7452;text-align:center}\n.paper-teacher-mark.great .ptm-score{color:#49b57e}\n.paper-teacher-mark.good  .ptm-score{color:#d9b466}\n.paper-teacher-mark .ptm-sep{width:55%;border-top:1.5px solid rgba(255,255,255,.3);margin:4px 0}\n.paper-teacher-mark .ptm-denom{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);text-align:center}\n.paper-teacher-mark .ptm-tick{position:absolute;top:-16px;right:-12px;font-size:32px;transform:rotate(8deg);line-height:1}\n.paper-motivation{font-size:14px;font-weight:600;color:var(--navy);margin-top:14px;text-align:center;max-width:300px;line-height:1.6;font-style:italic}\n\n/* ── SESSION REPORT ── */\n.report-btn{position:fixed;bottom:76px;right:16px;z-index:200;background:var(--navy);color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-family:inherit}\n@media(min-width:820px){.report-btn{bottom:20px;right:20px}}\n.report-panel{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;padding:0}\n#studentScoreboardTotal summary::-webkit-details-marker{display:none}\n#studentScoreboardTotal summary{color:#fff}\n#scoreboardTotal summary "stat-label\">Correct<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat-box\"><div class=\"stat-num amber\" id=\"statPartial\">0<\u002Fdiv><div class=\"stat-label\">Partial<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat-box\"><div class=\"stat-num red\" id=\"statWrong\">0<\u002Fdiv><div class=\"stat-label\">Wrong<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"summary-total-time\" id=\"summaryTotalTime\"><\u002Fdiv>\n    <button class=\"btn-retry\" onclick=\"retrySection()\">🔁 Try Again<\u002Fbutton>\n    <button class=\"btn-back-lessons\" onclick=\"closeQuiz()\">← Back to Lessons<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- EXAM MODE answer paper -->\n  <div class=\"answer-paper\" id=\"answerPaper\">\n    <div class=\"paper-header\">\n      <div class=\"paper-title\" id=\"paperTitle\">Answer Paper<\u002Fdiv>\n      <div class=\"paper-meta\" id=\"paperMeta\"><\u002Fdiv>\n      <div class=\"paper-mark-wrap\">\n        <div class=\"paper-teacher-mark\" id=\"paperTeacherMark\">\n          <span class=\"ptm-tick\" id=\"paperTeacherTick\"><\u002Fspan>\n          <div class=\"ptm-score\" id=\"paperTeacherScore\"><\u002Fdiv>\n          <div class=\"ptm-sep\"><\u002Fdiv>\n          <div class=\"ptm-denom\">100<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"paper-motivation\" id=\"paperMotivation\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"paperQuestions\"><\u002Fdiv>\n    <div class=\"paper-actions\">\n      <button class=\"btn-retry\" onclick=\"retrySection()\">🔁 Try Again<\u002Fbutton>\n      <button class=\"btn-back-lessons\" onclick=\"closeQuiz()\">← Back<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script>\n// ═══════════════════════════════════════════════════════\n//  QUESTION TYPE CONSTANTS\n// ═══════════════════════════════════════════════════════\nconst QTYPES = [\n  { id:\"mcq\",         label:\"Choose Correct\",             icon:\"🔘\", marks:1 },\n  { id:\"fill\",        label:\"Fill in the Blanks\",          icon:\"✏️\",  marks:1 },\n  { id:\"match\",       label:\"Match the Following\",         icon:\"🔗\",  marks:5 },\n  { id:\"brief\",       label:\"Answer in Brief\",             icon:\"📝\",  marks:2 },\n  { id:\"truefalse\",   label:\"True or False\",               icon:\"✅\",  marks:1 },\n  { id:\"reasons\",     label:\"Give Reasons\",                icon:\"💡\",  marks:2 },\n  { id:\"distinguish\", label:\"Distinguish Between\",         icon:\"⚖️\",  marks:3 },\n  { id:\"paragraph\",   label:\"Answer in Paragraph/Detail\",  icon:\"📄\",  marks:5 },\n  { id:\"memorise\",    label:\"Quote from Memory\",           icon:\"🎤\",  marks:3 },\n];\n\n// Small, flat bonus for Revise mode's Recite & Check — deliberately worth\n// less than a real Practice-mode answer. Defined here (not down near the\n// Recite code) so getMarks can use the exact same number the toast shows —\n// otherwise the toast risks promising an amount the Scoreboard doesn't\n// actually count, the same disconnect that turned up in the Growth Points\n// audit below.\nconst RECITE_BONUS_MARKS = 2;\n\n// Returns only question types that actually have questions somewhere in the data.\n// Used by the daily goal so students aren't penalised for a missing type (e.g. no\n// True/False in English Grammar). Recomputed each call since data could expand.\nfunction getActiveQTypes(){\n  const present = new Set();\n  for(const subj of Object.values(DATA))\n    for(const part of Object.values(subj.parts))\n      for(const lesson of part.lessons)\n        for(const qt of QTYPES)\n          if((lesson.questions[qt.id]||[]).length > 0) present.add(qt.id);\n  return QTYPES.filter(qt => present.has(qt.id));\n}\n\n// Get marks for a question type. \"recite_fast_<qtype>\" / \"recite_good_<qtype>\"\n// tags (from Revise mode's Read & Memorise) are a distinct, deliberately-small\n// speed bonus — not one of the real QTYPES — so they're matched explicitly.\n// Bare \"recite_<qtype>\" (no fast/good) is the older one-time recall-bonus\n// format from before Read & Memorise existed; kept working for any entries\n// already earned under it, at its original flat value.\nfunction getMarks(qtypeId){\n  if(qtypeId && qtypeId.indexOf(\"recite_fast_\")===0) return READ_SPEED_MARKS.fast;\n  if(qtypeId && qtypeId.indexOf(\"recite_good_\")===0) return READ_SPEED_MARKS.good;\n  if(qtypeId && qtypeId.indexOf(\"recite_\")===0) return RECITE_BONUS_MARKS;\n  return QTYPES.find(q=>q.id===qtypeId)?.marks||1;\n}\n\n// Weighted score: earned marks / total possible marks * 100\nfunction calcWeightedScore(results){\n  // results: [{qtype, pct}]\n  if(!results.length) return 0;\n  let earned=0, total=0;\n  results.forEach(r=>{\n    const m=getMarks(r.qtype||\"mcq\");\n    total+=m;\n    earned+=m*(r.pct/100);\n  });\n  return total>0 ? Math.round((earned/total)*100) : 0;\n}\n\n// ═══════════════════════════════════════════════════════\n//  DATA\n// ═══════════════════════════════════════════════════════\nconst DATA = {\n  \"Science\": {\n    icon: \"🔬\",\n    parts: {\n      \"Physics\": {\n        icon: \"⚡\",\n        lessons: [\n          {\n            id:\"sp1\", unit:\"Unit 1\", title:\"Measurement\", month:\"June\",\n            questions:{\n              mcq:[\n                {\n                  q:\"Choose the correct order of units from smallest to largest.\",\n                  options:[\"mm < cm < m < km\",\"mm > cm > m > km\",\"km < m < cm < mm\",\"mm > m > cm > km\"],\n                  correct:0\n                },\n                {\n                  q:\"Rulers, measuring tapes and metre scales are used to measure\",\n                  options:[\"Mass\",\"Weight\",\"Time\",\"Length\"],\n                  correct:3\n                },\n                {\n                  q:\"1 metric ton is equal to\",\n                  options:[\"100 quintals\",\"10 quintals\",\"1/10 quintals\",\"1/100 quintals\"],\n                  correct:1\n                },\n                {\n                  q:\"Which among the following is NOT a device to measure mass?\",\n                  options:[\"Spring balance\",\"Beam balance\",\"Physical balance\",\"Digital balance\"],\n                  correct:0\n                },\n                {\n                  q:\"Assertion (A): The scientifically correct expression is \\\"The mass of the bag is 10 kg\\\".\\nReason (R): In everyday life, we use the term weight instead of mass.\",\n                  options:[\"Both A and R are true but R is not the correct reason\",\"Both A and R are true and R is the correct reason\",\"A is true but R is false\",\"A is false but R is true\"],\n                  correct:0\n                },\n                {\n                  q:\"Assertion (A): 0°C = 273.16 K. For our convenience we take it as 273 K after rounding off the decimal.\\nReason (R): To convert a temperature on the Celsius scale we have to add 273 to the given temperature.\",\n                  options:[\"Both A and R are true but R is not the correct reason\",\"Both A and R are true and R is the correct reason\",\"A is true but R is false\",\"A is false but R is true\"],\n                  correct:1\n                },\n                {\n                  q:\"Assertion (A): Distance between two celestial bodies is measured in terms of light year.\\nReason (R): The distance travelled by light in one year is one light year.\",\n                  options:[\"Both A and R are true but R is not the correct reason\",\"Both A and R are true and R is the correct reason\",\"A is true but R is false\",\"A is false but R is true\"],\n                  correct:3\n                },\n              ],\n              fill:[\n                { sentence:\"Metre is the unit of ___.\", answers:[\"length\"] },\n                { sentence:\"1 kg of rice is weighed by ___.\", answers:[\"Beam balance\"] },\n                { sentence:\"Thickness of a cricket ball is measured by ___.\", answers:[\"Vernier caliper\"] },\n                { sentence:\"Radius of a thin wire is measured by ___.\", answers:[\"screw gauge\"] },\n                { sentence:\"A physical balance measures small differences in mass up to ___.\", answers:[\"1mg\"] },\n              ],\n              match:[\n                {\n                  q:\"Match the fundamental quantities with their SI units.\",\n                  left:[\"Length\",\"Mass\",\"Time\",\"Temperature\"],\n                  right:[\"kilogram\",\"second\",\"metre\",\"kelvin\"],\n                  correct:[2,0,1,3]\n                },\n                {\n                  q:\"Match the measuring instruments with the objects they measure.\",\n                  left:[\"Screw gauge\",\"Vernier caliper\",\"Beam balance\",\"Digital balance\"],\n                  right:[\"Gold ornaments\",\"Cricket ball\",\"Vegetables\",\"Coins\"],\n                  correct:[3,0,2,1]\n                },\n              ],\n              brief:[\n                {\n                  q:\"Define measurement.\",\n                  answer:\"Measurement is the determination of the size or magnitude of a quantity. It is about assigning a number as a characteristic of an object or event which can be compared with other objects or events.\"\n                },\n                {\n                  q:\"Define standard unit.\",\n                  answer:\"A unit is a standard quantity with which the unknown quantities are compared. It is defined as a specific magnitude of a physical quantity that has been adopted by law or convention.\"\n                },\n                {\n                  q:\"What is the full form of SI system?\",\n                  answer:\"SI stands for Systeme Internationale d'Unites which means International System of Units.\"\n                },\n                {\n                  q:\"Define least count of any device.\",\n                  answer:\"The smallest measurement that can be taken by a measuring instrument is called its least count. For example, the least count of a Vernier caliper is 0.1 mm and the least count of a screw gauge is 0.01 mm.\"\n                },\n                {\n                  q:\"What do you know about pitch of a screw gauge?\",\n                  answer:\"The pitch of the screw is the distance moved by the tip of the screw for one complete rotation of the head. It is equal to 1 mm in typical screw gauges.\"\n                },\n                {\n                  q:\"Can you find the diameter of a thin rod of length 2 m using the ruler from instrument box?\",\n                  answer:\"No. The ruler in the instrument box is only about 15 cm long. A thin rod of length 2 m cannot be measured using it. We need a metre scale or measuring tape.\"\n                },\n                {\n                  q:\"Write the need of a standard unit.\",\n                  answer:\"A standard unit is needed so that measurements made by different people at different places can be compared. Without a standard unit, communication of measurements would be confusing and inaccurate.\"\n                },\n                {\n                  q:\"How will you measure the least count using Vernier caliper?\",\n                  answer:\"The first step in using the Vernier caliper is to find out its least count, range and zero error.\\n\\nLeast count of the instrument (LC) = Value of one main scale division / Total number of vernier scale divisions.\\n\\nThe main scale division will be in centimetre, further divided into millimetre. The value of the smallest main scale division is 1 mm. In the Vernier scale there will be 10 divisions.\\n\\nLC = 1mm / 10 = 0.1 mm = 0.01 cm\"\n                },\n              ],\n              truefalse:[\n                { q:\"The SI unit of electric current is kilogram.\", answer:false, correction:\"The SI unit of electric current is ampere. Kilogram is the SI unit of mass.\" },\n                { q:\"Kilometre is one of the SI units of measurement.\", answer:true },\n                { q:\"In everyday life, we use the term weight instead of mass.\", answer:true },\n                { q:\"A physical balance is more sensitive than a beam balance.\", answer:true },\n                { q:\"One Celsius degree is an interval of 1K and zero degree Celsius is 273.15 K.\", answer:true },\n                { q:\"With the help of Vernier caliper we can have an accuracy of 0.1 mm and with screw gauge we can have an accuracy of 0.01 mm.\", answer:true },\n              ],\n              reasons:[],\n              distinguish:[\n                {\n                  q:\"Differentiate mass and weight.\",\n                  termA:\"Mass\",\n                  answerA:\"1. It is a fundamental quantity.\\n2. It has magnitude alone — scalar quantity.\\n3. It is the amount of matter contained in a body.\\n4. Remains the same everywhere.\\n5. It is measured using physical balance.\\n6. Its unit is kilogram.\",\n                  termB:\"Weight\",\n                  answerB:\"1. It is a derived quantity.\\n2. It has magnitude and direction — vector quantity.\\n3. It is the normal force exerted by the surface of the object against gravitational pull.\\n4. Varies from place to place.\\n5. It is measured using spring balance.\\n6. Its unit is newton.\"\n                },\n              ],\n              paragraph:[\n                {\n                  q:\"Write the rules for writing symbols of units in SI system.\",\n                  answer:\"The rules for writing symbols of units in SI system are:\\n\\n1. The units named after scientists are not written with a capital initial letter. E.g. newton, henry, ampere and watt.\\n2. The symbols of the units named after scientists should be written by the initial capital letter. E.g. N for newton, H for henry, A for ampere and W for watt.\\n3. Small letters are used as symbols for units not derived from a proper noun. E.g. m for metre, kg for kilogram.\\n4. No full stop or other punctuation marks should be used within or at the end of symbols. E.g. 50 m not as 50 m.\\n5. The symbols of the units are not expressed in plural form. E.g. 10 kg not as 10 kgs.\\n6. When temperature is expressed in kelvin, the degree sign is omitted. E.g. 283 K not as 283° K.\"\n                },\n              ]\n            }\n          },\n          { id:\"sp2\",  unit:\"Unit 2\",  title:\"Motion\",                        month:\"July\",     questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp3\",  unit:\"Unit 3\",  title:\"Fluids\",                        month:\"August\",   questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp4\",  unit:\"Unit 4\",  title:\"Electric Charge and Electric Current\", month:\"October\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp5\",  unit:\"Unit 5\",  title:\"Magnetism and Electromagnetism\", month:\"November\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp6\",  unit:\"Unit 6\",  title:\"Light\",                         month:\"December\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp7\",  unit:\"Unit 7\",  title:\"Heat\",                          month:\"January\",  questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp8\",  unit:\"Unit 8\",  title:\"Sound\",                         month:\"February\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sp9\",  unit:\"Unit 9\",  title:\"Universe\",                      month:\"March\",    questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n        ]\n      },\n      \"Chemistry\": {\n        icon: \"⚗️\",\n        lessons: [\n          { id:\"sc10\", unit:\"Unit 10\", title:\"Matter Around Us\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"The separation of denser particles from lighter particles done by rotation at high speed is called __________.\", options:[\"Filtration\",\"sedimentation\",\"decantation\",\"centrifugation\"], correct:3 },\n                { q:\"Among the following __________ is a mixture.\", options:[\"Common Salt\",\"Juice\",\"Carbon dioxide\",\"Pure Silver\"], correct:1 },\n                { q:\"When we mix a drop of ink in water we get a __________.\", options:[\"Heterogeneous Mixture\",\"Compound\",\"Homogeneous Mixture\",\"Suspension\"], correct:2 },\n                { q:\"__________ is essential to perform separation by solvent extraction method.\", options:[\"Separating funnel\",\"filter paper\",\"centrifuge machine\",\"sieve\"], correct:0 },\n                { q:\"__________ has the same properties throughout the sample.\", options:[\"Pure substance\",\"Mixture\",\"Colloid\",\"Suspension\"], correct:0 },\n              ],\n              fill:[\n                { sentence:\"A ___ mixture has no distinguishable boundary between its components.\", answers:[\"Homogeneous\"] },\n                { sentence:\"An example of a substance that sublimes is ___.\", answers:[\"Camphor\"] },\n                { sentence:\"Alcohol can be separated from water by ___.\", answers:[\"Distillation\"] },\n                { sentence:\"In petroleum refining, the method of separation used is ___.\", answers:[\"Fractional distillation\"] },\n                { sentence:\"Chromatography is based on the principle of ___.\", answers:[\"Adsorption\"] },\n              ],\n              match:[\n                {\n                  q:\"Match the terms with their descriptions\",\n                  left:[\"Element\",\"Compound\",\"Colloid\",\"Suspension\",\"Mixture\"],\n                  right:[\"Settles down on standing\",\"Impure substance\",\"Made up of molecules\",\"Pure substance\",\"Made up of atoms\"],\n                  correct:[4,2,1,0,3]\n                }\n              ],\n              brief:[\n                { q:\"How are homogeneous solutions different from heterogeneous solutions? Explain with examples.\", answer:\"A mixture in which the components cannot be seen separately is called a homogeneous mixture. Example: Salt solution, sugar solution.\\n\\nA mixture in which the components can be seen separately is called a heterogeneous mixture. Example: Sand and water, oil and water.\" },\n                { q:\"Define Sublimation.\", answer:\"Certain solid substances when heated change directly from solid to gaseous state without attaining liquid state. The vapours when cooled give back the solid substance. This process is known as sublimation. Examples: Iodine, camphor, ammonium chloride.\" },\n              ],\n              truefalse:[\n                { statement:\"Oil and water are immiscible with each other.\", answer:\"true\", reason:\"Oil and water do not mix because oil is non-polar and water is polar.\" },\n                { statement:\"A compound cannot be broken into simpler substances chemically.\", answer:\"false\", reason:\"A compound can be broken down into simpler substances (elements) by chemical methods.\" },\n                { statement:\"Liquid – liquid colloids are called gel.\", answer:\"false\", reason:\"Liquid–liquid colloids are called emulsion. Gel is a solid–liquid colloid.\" },\n                { statement:\"Buttermilk is an example of heterogeneous mixture.\", answer:\"false\", reason:\"Buttermilk is a colloidal solution (homogeneous mixture).\" },\n                { statement:\"Aspirin is composed of 60% Carbon, 4.5% Hydrogen and 35.5% Oxygen by mass. Aspirin is a mixture.\", answer:\"false\", reason:\"Aspirin is a compound because its constituents are present in a definite proportion by mass.\" },\n              ],\n              reasons:[],\n              distinguish:[\n                {\n                  q:\"Write the differences between elements and compounds and give an example for each.\",\n                  termA:\"Element\",\n                  termB:\"Compound\",\n                  answerA:\"Made up of only one kind of atom.\\nThe smallest particle that retains all its properties is an atom.\\nCannot be broken down into simpler substances.\\nExample: Copper\",\n                  answerB:\"Made up of more than one kind of atom.\\nThe smallest particle that retains all its properties is the molecule.\\nCan be broken down into elements by chemical methods.\\nExample: Water\"\n                }\n              ],\n              paragraph:[]\n            }\n          },\n          { id:\"sc11\", unit:\"Unit 11\", title:\"Atomic Structure\",                       month:\"July\",     questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sc12\", unit:\"Unit 12\", title:\"Periodic Classification of Elements\",    month:\"August\",   questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sc13\", unit:\"Unit 13\", title:\"Chemical Bonding\",                       month:\"October\",  questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sc14\", unit:\"Unit 14\", title:\"Acids, Bases and Salts\",                 month:\"November\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sc15\", unit:\"Unit 15\", title:\"Carbon and its Compounds\",               month:\"January\",  questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sc16\", unit:\"Unit 16\", title:\"Applied Chemistry\",                      month:\"February\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n        ]\n      },\n      \"Biology\": {\n        icon: \"🧬\",\n        lessons: [\n          { id:\"sb17\", unit:\"Unit 17\", title:\"Animal Kingdom\",              month:\"June\",     questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb18\", unit:\"Unit 18\", title:\"Organisation of Tissues\",     month:\"July\",     questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb19\", unit:\"Unit 19\", title:\"Plant Physiology\",            month:\"August\",   questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb20\", unit:\"Unit 20\", title:\"Organ Systems in Animals\",    month:\"October\",  questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb21\", unit:\"Unit 21\", title:\"Nutrition and Health\",        month:\"November\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb22\", unit:\"Unit 22\", title:\"World of Microbes\",           month:\"November\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb23\", unit:\"Unit 23\", title:\"Economic Biology\",            month:\"January\",  questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb24\", unit:\"Unit 24\", title:\"Environmental Science\",       month:\"February\", questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n          { id:\"sb25\", unit:\"Unit 25\", title:\"LibreOffice Impress\",         month:\"September\",questions:{mcq:[],fill:[],match:[],brief:[],truefalse:[],reasons:[],distinguish:[],paragraph:[]} },\n        ]\n      }\n    }\n  },\n  \"Social Science\": {\n    icon:\"🌏\",\n    parts: {\n      \"History\": {\n        icon:\"📜\",\n        lessons: [\n          { id:\"h1\",  unit:\"Unit 1\",  title:\"Evolution of Humans and Society – Prehistoric Period\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"__________ is genetically closest to humans.\", options:[\"Gorilla\",\"Chimpanzee\",\"Orang-utan\",\"Great Apes\"], correct:1 },\n                { q:\"The period called __________ marks the beginning of agriculture and animal domestication.\", options:[\"Palaeolithic\",\"Mesolithic\",\"Neolithic\",\"Megalithic\"], correct:2 },\n                { q:\"Direct ancestor of modern man was __________.\", options:[\"Homo habilis\",\"Homo erectus\",\"Homo sapiens\",\"Neanderthal man\"], correct:1 },\n                { q:\"__________ refers to the area covering Egypt, Israel-Palestine and Iraq.\", options:[\"Great Rift Valley\",\"Fertile Crescent\",\"Solo river\",\"Neander Valley\"], correct:1 },\n                { q:\"Sir Robert Bruce Foote, a geologist from England first discovered the __________ tools at Pallavaram near Chennai.\", options:[\"Microlithic\",\"Palaeolithic\",\"Mesolithic\",\"Neolithic\"], correct:1 },\n                { q:\"Which of the following statement(s) about the pre-historic period is correct? (i) The period before the introduction of writing is called pre-history. (ii) Pre-historic people developed language, made paintings and artefacts. (iii) Pre-historic societies are treated as literate. (iv) The pre-historic period is called ancient.\", options:[\"(i) is correct\",\"(i) and (ii) are correct\",\"(i) and (iv) are correct\",\"(ii) and (iii) are correct\"], correct:1 },\n                { q:\"Which of the following about the Neolithic period is correct? (i) The Neolithic people used polished stone axes called Celts. (ii) Evidence of Neolithic village is found at Payyampalli in Chennai district. (iii) The cultural period that succeeded the Neolithic is called the Bronze Age. (iv) The
