edEntries);\n  const dailyTime = calcDailyTimeBonus(allScoredEntries);\n  const allAchievements = [...(cumulative.achievements||[]), ...(dailyTime.achievements||[])];\n  const newlyLogged = allAchievements.filter(a => !logged[a.key]);\n  if(!newlyLogged.length) return;\n\n  for(const a of newlyLogged){\n    logged[a.key] = true;\n    // Achievement records are marked-only entries for Points History display —\n    // NOT counted a second time in growthPoints, since the aggregate\n    // calculation already accounts for them (see the \"achievement record\"\n    // branch in calcGrowthScore). Noon of the actual day, so it displays\n    // under the right date rather than bunched up as \"just now.\"\n    await fbLogEntryWithTs(\"logs\", {\n      subject: a.subject||\"\", part:\"\", lessonId:\"achievement\", lessonTitle: a.label,\n      qtype: a.qtype, qIndex: a.dayMs, pct:100, timeMs:0, marks: a.points\n    }, a.dayMs + 12*60*60*1000);\n  }\n  const { db, doc, setDoc } = window._fb;\n  try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"pointAchievementsLogged\"), logged); }catch(e){}\n}\n\n// ═══════════════════════════════════════════════════════\n//  GOODWILL POINTS — admin-awarded encouragement bonuses\n// ═══════════════════════════════════════════════════════\n// Two distinct things live here, deliberately kept separate:\n//  1. A routine \"Goodwill Points\" award the admin can give any time for\n//     good behavior — kept small (5-50 pts) and rate-limited (max 3/day)\n//     so it stays a genuine, meaningful nudge rather than becoming a\n//     casual, overused button that quietly inflates the whole point system.\n//  2. A ONE-TIME 500pt \"Compensation Bonus\" — a distinct, larger, single-use\n//     apology for the Growth Points display bug that made his score\n//     appear to shrink for reasons he couldn't see. Deliberately exempt\n//     from the routine cap since it's a one-off correction, not a pattern.\n// Both use the SAME delivery mechanism: written to a small \"live\" doc the\n// student's own open tab is already listening to, so the celebratory\n// popup appears INSTANTLY — no reload needed — the moment the admin awards it.\nconst GOODWILL_MIN = 5;\nconst GOODWILL_MAX = 50;\nconst GOODWILL_DAILY_CAP = 3;\nconst COMPENSATION_BONUS_AMOUNT = 500;\n\nconst GOODWILL_MESSAGES = [\n  \"You didn't waste any time today!\",\n  \"You finished so fast — great focus!\",\n  \"Excellent effort today!\",\n  \"You've been really consistent lately!\",\n  \"Great attitude, keep it up!\",\n  \"You worked really hard on that!\",\n  \"Proud of how you handled that!\",\n  \"You showed real patience today!\",\n];\n\nfunction pickGoodwillMessage(){\n  return GOODWILL_MESSAGES[Math.floor(Math.random()*GOODWILL_MESSAGES.length)];\n}\n\n// ── Student side: listens for an admin award and celebrates instantly ──\nfunction startGoodwillListener(){\n  if(!window._fb || !currentUserPhone || isAdminUser) return; // admin's own tab never celebrates its own award\n  const { db, doc, onSnapshot } = window._fb;\n  onSnapshot(doc(db, \"sessions\", currentUserPhone, \"live\", \"goodwillEvent\"), snap => {\n    if(!snap.exists()) return;\n    const data = snap.data();\n    if(!data.id) return;\n    const lastSeenId = localStorage.getItem(\"lastGoodwillEventId\");\n    if(data.id === lastSeenId) return; // already celebrated this one — don't re-show on reload\n    localStorage.setItem(\"lastGoodwillEventId\", data.id);\n    bumpGrowthPointsBadge(data.amount||0);\n    showGoodwillCelebration(data.amount||0, data.message||pickGoodwillMessage());\n  });\n}\n\n// Big, animated, unmissable congratulation — deliberately more festive than\n// the small in-line point toasts, since this represents the admin noticing\n// and calling out something specific, not just routine progress.\nfunction showGoodwillCelebration(amount, message){\n  const overlayId = \"goodwillCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.55);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:52px;margin-bottom:6px;animation:goodwillBounce 1s ease-in-out infinite\">🎉<\u002Fdiv>\n      <div style=\"font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px\">Congrats, ${STUDENT_NAME}!<\u002Fdiv>\n      <div style=\"font-size:15px;color:var(--text);margin-bottom:16px;line-height:1.5\">${message.replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:800;font-size:22px;padding:10px 20px;border-radius:14px;display:inline-block;margin-bottom:18px\">+${amount} Growth Points 🎁<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Awesome, thanks! →<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  if(!document.getElementById(\"goodwillAnimStyle\")){\n    const s = document.createElement(\"style\");\n    s.id = \"goodwillAnimStyle\";\n    s.textContent = \"@keyframes goodwillBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\";\n    document.head.appendChild(s);\n  }\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// ── Admin side: reads/updates the daily cap, one-time compensation flag ──\nasync function getGoodwillDailyState(){\n  const { db, doc, getDoc } = window._fb;\n  const today = new Date().toISOString().slice(0,10);\n  const snap = await getDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"goodwillDaily\"));\n  const data = snap.exists() ? snap.data() : null;\n  if(!data || data.date !== today) return { date: today, count: 0 };\n  return data;\n}\n\nasync function checkCompensationAwarded(){\n  const { db, doc, getDoc } = window._fb;\n  const snap = await getDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"compensationAwarded\"));\n  return snap.exists() && snap.data().awarded === true;\n}\n\n// The routine, capped, rate-limited award — the one meant for everyday use.\nasync function awardGoodwillPoints(amount, reason){\n  amount = Math.round(Number(amount)||0);\n  if(amount < GOODWILL_MIN || amount > GOODWILL_MAX){\n    alert(`Goodwill Points must be between ${GOODWILL_MIN} and ${GOODWILL_MAX} — keeping it small keeps it meaningful.`);\n    return false;\n  }\n  const state = await getGoodwillDailyState();\n  if(state.count >= GOODWILL_DAILY_CAP){\n    alert(`Already given ${GOODWILL_DAILY_CAP} Goodwill Point awards today — that cap is there on purpose, so it stays a genuine \"I noticed that\" rather than routine currency. Try again tomorrow!`);\n    return false;\n  }\n  const message = (reason && reason.trim()) || pickGoodwillMessage();\n  const { db, doc, setDoc } = window._fb;\n  fbLogEntry(\"logs\", {\n    subject:\"\", part:\"\", lessonId:\"goodwill\", lessonTitle: message,\n    qtype:\"goodwill\", qIndex: Date.now(), pct:100, timeMs:0, marks: amount\n  });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"goodwillDaily\"), { date: state.date, count: state.count+1 });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"live\", \"goodwillEvent\"), {\n    id: \"gw_\"+Date.now(), amount, message, ts: Date.now()\n  });\n  return true;\n}\n\n// The one-time, larger, exempt-from-the-cap apology bonus for the Growth\n// Points display bug — usable exactly once, ever.\nasync function awardCompensationBonus(){\n  const already = await checkCompensationAwarded();\n  if(already){\n    alert(\"The one-time compensation bonus has already been given.\");\n    return false;\n  }\n  const { db, doc, setDoc } = window._fb;\n  fbLogEntry(\"logs\", {\n    subject:\"\", part:\"\", lessonId:\"compensation\", lessonTitle:\"Thanks for your patience while we fixed a scoring glitch!\",\n    qtype:\"compensation\", qIndex: Date.now(), pct:100, timeMs:0, marks: COMPENSATION_BONUS_AMOUNT\n  });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"settings\", \"compensationAwarded\"), { awarded:true, ts:Date.now() });\n  await setDoc(doc(db, \"sessions\", currentUserPhone, \"live\", \"goodwillEvent\"), {\n    id: \"comp_\"+Date.now(), amount: COMPENSATION_BONUS_AMOUNT,\n    message: \"We found and fixed a glitch that was making your points look smaller than they should sometimes. Your progress was always safe — enjoy this bonus for your patience! 🎉\",\n    ts: Date.now()\n  });\n  return true;\n}\n\n// ═══════════════════════════════════════════════════════\n//  MILESTONES — big, rare, motivating rewards for finishing\n//  a whole batch of lessons across Social Science\n// ═══════════════════════════════════════════════════════\n// Milestones 1-5: matching lesson number across Civics/Economics/Geography/\n// History (Milestone 3 = c3+e3+g3+h3, etc.) — built dynamically from the\n// actual lesson lists, not hardcoded, so it stays correct if lessons are\n// ever added. Economics only has 5 lessons total, so once it runs out,\n// remaining lessons from the other three subjects get grouped into batches\n// of 4 for Milestone 6 onward (the very last batch may have fewer than 4,\n// since it's just whatever's left). Social Science only for now.\nconst MILESTONE_POINTS = 1000;\nconst MILESTONE_SUBJECT_ORDER = [\"Civics\",\"Economics\",\"Geography\",\"History\"];\n\nfunction buildSocialMilestones(){\n  const ss = DATA[\"Social Science\"];\n  if(!ss) return [];\n  const lessonLists = MILESTONE_SUBJECT_ORDER.map(p => (ss.parts[p]?.lessons)||[]);\n  if(lessonLists.some(l=>!l.length)) return [];\n  const minLen = Math.min(...lessonLists.map(l=>l.length));\n  const milestones = [];\n  for(let i=0;i<minLen;i++){\n    milestones.push({ num: milestones.length+1, lessons: lessonLists.map(l=>l[i]) });\n  }\n  const remaining = [];\n  lessonLists.forEach(list=>{\n    for(let i=minLen;i<list.length;i++) remaining.push(list[i]);\n  });\n  for(let i=0;i<remaining.length;i+=4){\n    milestones.push({ num: milestones.length+1, lessons: remaining.slice(i,i+4) });\n  }\n  return milestones;\n}\n\n// A lesson counts as \"mastered\" for milestone purposes only if it has at\n// least one question AND every question across every type has been\n// genuinely mastered (80%+, unaided — same _masteredQuestionKeys set used\n// everywhere else, so a peeked-to-80% score correctly does NOT count here).\nfunction isLessonFullyMastered(lesson){\n  if(!lesson) return false;\n  let hasAny = false;\n  for(const qt of QTYPES){\n    const qs = lesson.questions[qt.id]||[];\n    for(let i=0;i<qs.length;i++){\n      hasAny = true;\n      const key = `${lesson.id}_${qt.id}_${i}`;\n      if(!_masteredQuestionKeys.has(key)) return false;\n    }\n  }\n  return hasAny;\n}\n\nlet _milestonesAwardedCache = null; // {1:true, 2:true, ...} — which milestones have already been paid out, loaded once\n\nasync function loadMilestonesAwarded(){\n  if(_milestonesAwardedCache) return _milestonesAwardedCache;\n  if(!window._fb || !currentUserPhone){ _milestonesAwardedCache = {}; return _milestonesAwardedCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"milestonesAwarded\"));\n    _milestonesAwardedCache = snap.exists() ? snap.data() : {};\n  }catch(e){ _milestonesAwardedCache = {}; }\n  return _milestonesAwardedCache;\n}\n\n// Called after every mastery update — checks whether that update just\n// completed a milestone, and if so, awards it exactly once, ever.\nasync function checkMilestonesAfterMastery(){\n  // Note: fires for admin too (see checkLessonMasteryBonus for the same\n  // reasoning) — this used to skip entirely for admin, which meant the\n  // retroactive sweep silently did nothing when admin was the one viewing\n  // the Scoreboard, producing a different (stale) total than the student's\n  // own view of the exact same account.\n  if(!window._fb || !currentUserPhone) return;\n  const milestones = buildSocialMilestones();\n  if(!milestones.length) return;\n  const awarded = await loadMilestonesAwarded();\n  for(const m of milestones){\n    if(awarded[m.num]) continue; // already earned — move on to check the next one in sequence\n    // Milestones unlock strictly in order. If this is the first not-yet-\n    // earned milestone and its lessons aren't ALL mastered yet, nothing\n    // after it can be legitimately checked either — even if he's jumped\n    // ahead and happens to have mastered a later milestone's lessons\n    // already (e.g. studied History out of order), it still can't be\n    // awarded until everything before it is genuinely done.\n    if(!m.lessons.every(l => isLessonFullyMastered(l))) break;\n    awarded[m.num] = true; // mark immediately so a rapid double-trigger can't double-award before Firestore round-trips\n    const { db, doc, setDoc } = window._fb;\n    try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"milestonesAwarded\"), awarded); }catch(e){}\n    await fbLogEntry(\"logs\", {\n      subject:\"Social Science\", part:\"\", lessonId:\"milestone\", lessonTitle:`Milestone ${m.num}: ${m.lessons.map(l=>l.title).join(\", \")}`,\n      qtype:\"milestone\", qIndex: Date.now(), pct:100, timeMs:0, marks: MILESTONE_POINTS\n    });\n    bumpGrowthPointsBadge(MILESTONE_POINTS);\n    showMilestoneCelebration(m.num, m.lessons);\n    // Deliberately no break here — if completing this milestone means the\n    // NEXT one's lessons also happen to already be fully mastered (e.g.\n    // catching up several at once), the loop naturally checks it next,\n    // still awarding strictly in order rather than all at once regardless.\n  }\n}\n\nfunction showMilestoneCelebration(num, lessons){\n  const overlayId = \"milestoneCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.7);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:34px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 60px rgba(0,0,0,.4);transform:scale(.8);transition:transform .45s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:58px;margin-bottom:8px;animation:goodwillBounce 1s ease-in-out infinite\">🏅<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px\">Milestone ${num} Complete!<\u002Fdiv>\n      <div style=\"font-size:15px;color:var(--text);margin-bottom:14px;line-height:1.6\">${lessons.map(l=>l.title).join(\" · \")}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:900;font-size:26px;padding:12px 24px;border-radius:14px;display:inline-block;margin-bottom:20px\">+${MILESTONE_POINTS} Growth Points 🎉<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Amazing! →<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// ═══════════════════════════════════════════════════════\n//  LESSON MASTERY BONUS — +200 for fully mastering a lesson\n// ═══════════════════════════════════════════════════════\n// Previously this was recalculated fresh from current state every time the\n// Scoreboard loaded, rather than logged as a one-time event like every other\n// bonus (Goodwill, Milestones, New Question, etc.). That meant it could\n// silently affect the total but never show up in Points History, since\n// Points History reads discrete logged events — there simply wasn't one to\n// show. This fixes it properly: the first time a lesson is BOTH marked\n// \"complete\" (by admin) AND has every question genuinely mastered, it's\n// logged exactly once, same as everything else.\nconst LESSON_MASTERY_POINTS = 200;\nlet _lessonMasteryAwardedCache = null; // {lessonId: true, ...} — loaded once per session\n\nasync function loadLessonMasteryAwarded(){\n  if(_lessonMasteryAwardedCache) return _lessonMasteryAwardedCache;\n  if(!window._fb || !currentUserPhone){ _lessonMasteryAwardedCache = {}; return _lessonMasteryAwardedCache; }\n  try{\n    const { db, doc, getDoc } = window._fb;\n    const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"lessonMasteryAwarded\"));\n    _lessonMasteryAwardedCache = snap.exists() ? snap.data() : {};\n  }catch(e){ _lessonMasteryAwardedCache = {}; }\n  return _lessonMasteryAwardedCache;\n}\n\n// Checks ONE specific lesson (the one just touched, or just marked complete)\n// rather than re-scanning the whole syllabus every time — cheap enough to\n// call after every mastery update and every admin \"mark complete\" toggle.\nasync function checkLessonMasteryBonus(lessonId){\n  // Note: unlike student-experience-only checks (New Try Bonus, spelling\n  // gate), this deliberately fires for admin too — marking a lesson\n  // \"complete\" is an admin-only action, so if that admin action is what\n  // completes the bonus (all questions already mastered beforehand), it\n  // needs to fire right there, not only from the student's own side.\n  if(!window._fb || !currentUserPhone || !lessonId) return;\n  const awarded = await loadLessonMasteryAwarded();\n  if(awarded[lessonId]) return; // already earned, ever\n  if(!_completeLessons[lessonId]) return; // admin hasn't marked it complete yet\n\n  // Find the actual lesson object AND which subject/part it lives under —\n  // this used to fall back to the global currentSubject/currentPart, which\n  // is only correct while actively inside that lesson's own session. When\n  // this check runs from a sweep (checking every lesson, not just the one\n  // just answered), that global state could belong to a completely\n  // different lesson, silently mislabeling the log entry.\n  let lesson = null, foundSubject = \"\", foundPart = \"\";\n  outer: for(const [subjName, subj] of Object.entries(DATA)){\n    for(const [partName, part] of Object.entries(subj.parts)){\n      const found = part.lessons.find(l=>l.id===lessonId);\n      if(found){ lesson = found; foundSubject = subjName; foundPart = partName; break outer; }\n    }\n  }\n  if(!lesson || !isLessonFullyMastered(lesson)) return;\n\n  awarded[lessonId] = true; // mark immediately so a rapid double-trigger can't double-award before Firestore round-trips\n  const { db, doc, setDoc } = window._fb;\n  try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"lessonMasteryAwarded\"), awarded); }catch(e){}\n  await fbLogEntry(\"logs\", {\n    subject: foundSubject, part: foundPart, lessonId:\"lessonmastery\",\n    lessonTitle: `${lesson.title}`, qtype:\"lessonmastery\", qIndex: Date.now(), pct:100, timeMs:0, marks: LESSON_MASTERY_POINTS\n  });\n  bumpGrowthPointsBadge(LESSON_MASTERY_POINTS);\n  showLessonMasteryCelebration(lesson);\n}\n\n// Catches anything that was ALREADY true but never got a live trigger to\n// check it — e.g. a lesson fully mastered and marked complete before this\n// feature existed, or between sessions with no new answer to fire the\n// per-question check. Safe to call as often as needed: both underlying\n// checks are already idempotent (a persisted \"awarded\" flag prevents any\n// double-payout), this just makes sure they're actually CALLED regularly,\n// not only from live events that might never happen again for an\n// already-finished lesson.\nasync function sweepAllPendingBonuses(){\n  if(!window._fb || !currentUserPhone) return;\n  await checkMilestonesAfterMastery(); // already checks every milestone from scratch each time\n  for(const subj of Object.values(DATA)){\n    for(const part of Object.values(subj.parts)){\n      for(const lesson of part.lessons){\n        await checkLessonMasteryBonus(lesson.id);\n      }\n    }\n  }\n}\n\nfunction showLessonMasteryCelebration(lesson){\n  const overlayId = \"lessonMasteryCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.65);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:32px 26px;max-width:370px;width:100%;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:52px;margin-bottom:8px;animation:goodwillBounce 1s ease-in-out infinite\">🏆<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px\">Lesson Mastered!<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:700;color:var(--navy);margin-bottom:14px\">${lesson.title}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:900;font-size:24px;padding:11px 22px;border-radius:14px;display:inline-block;margin-bottom:18px\">+${LESSON_MASTERY_POINTS} Growth Points 🎉<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Great work! →<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// ═══════════════════════════════════════════════════════\n//  ONE-TIME SCORE CORRECTION NOTICE\n// ═══════════════════════════════════════════════════════\n// A handful of bugs (a permanently-inflating evening-session bonus, a\n// doubled speed bonus) had been over-counting Growth Points for a while.\n// Fixing them means the true, correctly-calculated total is lower than\n// what was showing before — a real, honest correction, not new points\n// disappearing. Shown exactly once, ever, so it doesn't feel like the\n// score is being explained away every time it's opened.\nlet _scoreCorrectionNoticeShownCache = null;\n\nasync function maybeShowScoreCorrectionNotice(){\n  if(!window._fb || !currentUserPhone) return;\n  if(_scoreCorrectionNoticeShownCache === null){\n    try{\n      const { db, doc, getDoc } = window._fb;\n      const snap = await getDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"scoreCorrectionNoticeShown\"));\n      _scoreCorrectionNoticeShownCache = snap.exists();\n    }catch(e){ return; } // if we can't check, better to stay quiet than risk showing it repeatedly\n  }\n  if(_scoreCorrectionNoticeShownCache) return;\n  _scoreCorrectionNoticeShownCache = true;\n  const { db, doc, setDoc } = window._fb;\n  try{ await setDoc(doc(db,\"sessions\",currentUserPhone,\"settings\",\"scoreCorrectionNoticeShown\"), { shown:true, ts:Date.now() }); }catch(e){}\n\n  const overlayId = \"scoreCorrectionNotice_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.6);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:left;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.92);transition:transform .35s ease\">\n      <div style=\"font-size:34px;margin-bottom:10px\">📐<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:800;color:var(--navy);margin-bottom:10px\">A quick note about your Growth Points<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:var(--text);line-height:1.6;margin-bottom:16px\">\n        We found and fixed a few scoring bugs that had been quietly adding extra points by accident — nothing you did wrong, just mistakes in how a couple of bonuses were calculated behind the scenes.<br><br>\n        Your total may look a little different than before because of this — that's the fix working correctly, not points disappearing. Everything is fully accurate now, and every point you earn from here on counts exactly right and keeps climbing, same as always.\n      <\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Got it →<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// ═══════════════════════════════════════════════════════\n//  \"TRY SOMETHING NEW\" — every brand-new question, first attempt\n// ═══════════════════════════════════════════════════════\n// Targets a specific moment: the dread that shows up BEFORE even attempting\n// a question he's never seen, on the harder multi-mark types (1-mark\n// MCQ/Fill/True-False are quick guesses, not the \"can I even learn this\"\n// problem this is meant to address). Every genuinely new question of a\n// qualifying type gets a calm reassurance banner beforehand, and —\n// regardless of score — a celebratory bonus afterward for having tried,\n// not for having gotten it right. No daily cap: the \"never attempted\n// before\" check is itself the safeguard — a given question can only ever\n// be \"new\" once, so the total is naturally bounded by the size of the\n// syllabus, not farmable by repeating anything.\nconst NEW_TRY_EXCLUDED_QTYPES = new Set([\"mcq\",\"fill\",\"truefalse\"]);\nconst NEW_TRY_BONUS_MARKS = 10;\nconst NEW_TRY_MESSAGES_BEFORE = [\n  \"New territory! First tries are just about getting something down — not getting it right.\",\n  \"You haven't seen this one before — most people need 2–3 tries before it clicks.\",\n  \"This is brand new for you. Whatever you write is a fine start.\",\n];\nconst NEW_TRY_MESSAGES_AFTER = [\n  \"That's how learning something new always starts.\",\n  \"First attempts are for finding out what you don't know yet. That's exactly what just happened.\",\n  \"You tried something brand new today — that's the hard part, and you did it.\",\n];\n\nlet _pendingNewTryBonus = null; // {lessonId, qtype, qIndex} — the exact question the banner was shown for\n\nfunction pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }\n\n// Called after every question renders — shows the banner for any genuinely\n// new (never-attempted) qualifying question, every time, not just once/day.\nfunction maybeShowNewTryBanner(qtype, qIndex){\n  _pendingNewTryBonus = null;\n  if(isAdminUser) return; // admin browsing the mirror never triggers this\n  if(NEW_TRY_EXCLUDED_QTYPES.has(qtype)) return;\n  if(!currentLesson || currentLesson.id===\"__mock__\") return;\n  const key = `${currentLesson.id}_${qtype}_${qIndex}`;\n  if(_answeredQuestionKeys.has(key)) return; // he's attempted this one before — not actually new\n\n  const card = document.querySelector(\"#quizBody .question-card\");\n  if(!card || !card.parentNode) return;\n  const banner = document.createElement(\"div\");\n  banner.style.cssText = \"margin:0 0 12px;padding:10px 14px;background:#eef4ff;border:1.5px dashed #7fa8e0;border-radius:10px;font-size:12.5px;color:#2a4a7a;line-height:1.5\";\n  banner.textContent = \"🌱 \" + pickRandom(NEW_TRY_MESSAGES_BEFORE);\n  card.parentNode.insertBefore(banner, card.nextSibling);\n\n  _pendingNewTryBonus = { lessonId: currentLesson.id, qtype, qIndex };\n}\n\n// Called from each check* function after scoring — awards the bonus only if\n// THIS exact question is the one the banner was shown for, regardless of\n// how well it went, since the point is rewarding the attempt itself.\nfunction maybeAwardNewTryBonus(qtype, qIndex){\n  if(!_pendingNewTryBonus) return;\n  if(!currentLesson || _pendingNewTryBonus.lessonId!==currentLesson.id || _pendingNewTryBonus.qtype!==qtype || _pendingNewTryBonus.qIndex!==qIndex) return;\n  _pendingNewTryBonus = null; // consume immediately — a Try Again on this same question can't re-trigger it\n\n  fbLogEntry(\"logs\", {\n    subject: currentSubject||\"\", part: currentPart||\"\", lessonId: currentLesson?.id||\"\",\n    lessonTitle: currentLesson?.title||\"\", qtype:\"newtry\", qIndex: Date.now(), pct:100, timeMs:0, marks: NEW_TRY_BONUS_MARKS\n  });\n  bumpGrowthPointsBadge(NEW_TRY_BONUS_MARKS);\n  showNewTryCelebration();\n}\n\nfunction showNewTryCelebration(){\n  const overlayId = \"newTryCelebration_\"+Date.now();\n  const overlay = document.createElement(\"div\");\n  overlay.id = overlayId;\n  overlay.style.cssText = \"position:fixed;inset:0;background:rgba(32,42,61,.55);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s\";\n  overlay.innerHTML = `\n    <div style=\"background:#fff;border-radius:22px;padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.35);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)\">\n      <div style=\"font-size:48px;margin-bottom:6px\">🌱<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px\">You tried something new!<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:var(--text);margin-bottom:16px;line-height:1.5\">${pickRandom(NEW_TRY_MESSAGES_AFTER)}<\u002Fdiv>\n      <div style=\"background:var(--green-light);color:var(--green);font-weight:800;font-size:20px;padding:9px 18px;border-radius:14px;display:inline-block;margin-bottom:18px\">+${NEW_TRY_BONUS_MARKS} Growth Points 🌱<\u002Fdiv>\n      <button onclick=\"document.getElementById('${overlayId}').remove()\" style=\"width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">Keep going →<\u002Fbutton>\n    <\u002Fdiv>`;\n  document.body.appendChild(overlay);\n  requestAnimationFrame(()=>{\n    overlay.style.opacity = \"1\";\n    overlay.firstElementChild.style.transform = \"scale(1)\";\n  });\n}\n\n// Continuously overwrite a single \"live\" document with whatever the student is\n// currently doing — current question, what's selected/typed so far, navigation.\n// This is what makes the admin view feel like watching over their shoulder.\nlet _liveStateTimer = null;\nfunction fbLiveState(patch){\n  if(!window._fb || !currentUserPhone || isAdminUser) return; // admin never overwrites the student's live state\n  clearTimeout(_liveStateTimer);\n  _liveStateTimer = setTimeout(()=>{\n    const { db, doc, setDoc, serverTimestamp } = window._fb;\n    setDoc(doc(db, \"sessions\", currentUserPhone, \"live\", \"current\"), {\n      ...patch,\n      updatedAt: serverTimestamp()\n    }, { merge: true }).catch(err => console.warn(\"Live state write failed:\", err));\n  }, 250); // debounce so fast typing doesn't spam writes\n}\n\n// Admin-only: show a small floating bar with a live mirror + download button\nfunction showAdminBar(){\n  if(!window._fb) return;\n  const bar = document.createElement(\"div\");\n  bar.id = \"adminBar\";\n  bar.style.cssText = \"position:fixed;top:0;left:0;right:0;background:#202a3d;color:#fff;padding:8px 14px;font-size:12px;font-weight:700;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:10px\";\n  bar.innerHTML = `\n    <span>👁 Admin Mode — mirroring ${STUDENT_NAME} <span style=\"opacity:.55;font-weight:400\">· v${APP_VERSION}<\u002Fspan><\u002Fspan>\n    <button onclick=\"openAdminMirror()\" style=\"background:#fff;color:#202a3d;border:none;border-radius:6px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer\">Open Live Report<\u002Fbutton>`;\n  document.body.appendChild(bar);\n  document.body.style.paddingTop = \"36px\";\n}\n\nfunction closeAdminMirror(){\n  const panel = document.getElementById(\"adminMirrorPanel\");\n  if(panel) panel.classList.remove(\"visible\");\n}\n\n// Opens a live-updating panel showing the student's session logs and exam answers in real time.\nfunction openAdminMirror(){\n  if(!window._fb || !currentUserPhone) return;\n  const { db, doc, collection, onSnapshot, query, orderBy } = window._fb;\n\n  let panel = document.getElementById(\"adminMirrorPanel\");\n  if(panel){ panel.classList.add(\"visible\"); return; }\n\n  panel = document.createElement(\"div\");\n  panel.id = \"adminMirrorPanel\";\n  panel.style.cssText = \"position:fixed;inset:0;background:#fff;z-index:200000;overflow-y:auto;padding:60px 16px 24px\";\n  panel.innerHTML = `\n    <button onclick=\"closeAdminMirror()\"\n      style=\"position:fixed;top:46px;right:12px;background:#d15f5a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:200001\">✕ Close<\u002Fbutton>\n    <h2 style=\"font-family:Georgia,serif;color:#202a3d\">📊 Live Mirror — ${STUDENT_NAME}<\u002Fh2>\n    <div style=\"display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap\">\n      <button onclick=\"showAdminTab('live')\" id=\"tabBtnLive\" class=\"admin-tab-btn active\">🔴 Live<\u002Fbutton>\n      <button onclick=\"showAdminTab('scoreboard')\" id=\"tabBtnScoreboard\" class=\"admin-tab-btn\">🏆 Scoreboard<\u002Fbutton>\n      <button onclick=\"showAdminTab('past')\" id=\"tabBtnPast\" class=\"admin-tab-btn\">📂 Past Sessions<\u002Fbutton>\n      <button onclick=\"showAdminTab('mockexams')\" id=\"tabBtnMockExams\" class=\"admin-tab-btn\">📝 Practice Tests<\u002Fbutton>\n      <button onclick=\"showAdminTab('lessons')\" id=\"tabBtnLessons\" class=\"admin-tab-btn\">📚 Lessons<\u002Fbutton>\n      <button onclick=\"showAdminTab('goodwill')\" id=\"tabBtnGoodwill\" class=\"admin-tab-btn\">🎁 Goodwill<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"adminTabLive\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#d15f5a;display:inline-block;animation:pulseLive 1.5s infinite\"><\u002Fspan>\n        <span style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px\">Right now — what ${STUDENT_NAME} sees<\u002Fspan>\n      <\u002Fdiv>\n      <style>@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.3}}<\u002Fstyle>\n      <div id=\"adminLiveNow\" style=\"background:var(--parchment,#faf6ee);border:1.5px solid var(--border,#e8e0d0);border-radius:14px;padding:16px;margin-bottom:20px\">\n        <div id=\"adminLiveNowBody\"><p style=\"opacity:.7;margin:0\">Waiting for activity…<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"font-family:Georgia,serif;color:#202a3d\">🕘 Recent Activity (Today)<\u002Fh3>\n      <div id=\"adminLogList\" style=\"font-size:13px\"><\u002Fdiv>\n      <h3 style=\"margin-top:24px;font-family:Georgia,serif;color:#202a3d\">📝 Practice Test Answers (Today)<\u002Fh3>\n      <div id=\"adminExamList\" style=\"font-size:13px\"><\u002Fdiv>\n      <button onclick=\"downloadAdminMirror()\" style=\"margin-top:20px;padding:10px 20px;background:#202a3d;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">⬇ Download Full Report<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"adminTabScoreboard\" style=\"display:none\">\n      <div id=\"scoreboardTotal\" style=\"background:#202a3d;color:#fff;border-radius:12px;padding:16px;margin-bottom:20px\"><\u002Fdiv>\n      <div id=\"adminHowToEarn\" style=\"margin-bottom:20px\"><\u002Fdiv>\n      <div id=\"scoreboardSessions\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabPast\" style=\"display:none\">\n      <p style=\"font-size:12px;color:var(--muted);margin-bottom:14px\">Showing the last 5 sessions. Each includes both study activity and any practice test taken during it.<\u002Fp>\n      <div id=\"pastSessionsList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabLessons\" style=\"display:none\">\n      <p style=\"font-size:12px;color:var(--muted);margin-bottom:14px\">Toggle lessons as \"Complete\" once all questions are added. Only complete lessons qualify for the 🏆 Lesson Mastery bonus (+200 pts).<\u002Fp>\n      <div id=\"adminLessonsList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"adminTabMockExams\" style=\"display:none\">\n      <p style=\"font-size:12px;color:var(--muted);margin-bottom:14px\">Every practice test ${STUDENT_NAME} has taken, grouped by exam attempt — view full answers or download.<\u002Fp>\n      <div id=\"mockExamsList\"><\u002Fdiv>\n      <button id=\"mockExamsLoadMore\" onclick=\"loadMoreMockExams()\" style=\"display:none;width:100%;margin-top:10px;padding:10px;background:#fff;border:1.5px solid #202a3d;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;color:#202a3d\">Load older exams ↓<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"adminTabGoodwill\" style=\"display:none\">\n      <div id=\"compensationBox\" style=\"background:#fff8e6;border:1.5px solid #d1983f;border-radius:12px;padding:16px;margin-bottom:20px\">\n        <div style=\"font-weight:800;color:#202a3d;margin-bottom:6px\">🎁 One-Time Compensation Bonus<\u002Fdiv>\n        <p style=\"font-size:12.5px;color:var(--muted);margin:0 0 12px\">For the Growth Points display bug that made his score look smaller than it really was. This is a separate, one-off apology bonus — usable exactly once, and not part of the routine cap below.<\u002Fp>\n        <div id=\"compensationBtnWrap\">Loading…<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--parchment,#faf6ee);border:1.5px solid var(--border,#e8e0d0);border-radius:12px;padding:16px\">\n        <div style=\"font-weight:800;color:#202a3d;margin-bottom:6px\">🎁 Award Goodwill Points<\u002Fdiv>\n        <p style=\"font-size:12.5px;color:var(--muted);margin:0 0 12px\">For genuinely noticing good behavior or effort — kept small (${GOODWILL_MIN}–${GOODWILL_MAX} pts) and capped at ${GOODWILL_DAILY_CAP} awards a day, so it stays meaningful instead of routine.<\u002Fp>\n        <div id=\"goodwillDailyStatus\" style=\"font-size:12px;font-weight:700;color:#202a3d;margin-bottom:10px\">Loading today's usage…<\u002Fdiv>\n        <label style=\"display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px\">Points (${GOODWILL_MIN}–${GOODWILL_MAX})<\u002Flabel>\n        <input type=\"number\" id=\"goodwillAmountInput\" min=\"${GOODWILL_MIN}\" max=\"${GOODWILL_MAX}\" value=\"20\" style=\"width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:10px;font-family:inherit\">\n        <label style=\"display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px\">Reason (shown to ${STUDENT_NAME}, optional — a nice default is picked if left blank)<\u002Flabel>\n        <select id=\"goodwillReasonSelect\" onchange=\"document.getElementById('goodwillReasonCustom').value=this.value==='custom'?'':this.value\" style=\"width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:8px;font-family:inherit\">\n          <option value=\"\">— Pick a message or write your own below —<\u002Foption>\n          ${GOODWILL_MESSAGES.map(m=>`<option value=\"${m.replace(/\"/g,\"&quot;\")}\">${m}<\u002Foption>`).join(\"\")}\n          <option value=\"custom\">Write my own…<\u002Foption>\n        <\u002Fselect>\n        <textarea id=\"goodwillReasonCustom\" placeholder=\"Or type a custom message…\" style=\"width:100%;min-height:50px;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:12px;font-family:inherit\"><\u002Ftextarea>\n        <button onclick=\"submitGoodwillAward()\" style=\"width:100%;padding:12px;background:#202a3d;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer\">🎁 Give Goodwill Points<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  document.body.appendChild(panel);\n  panel.classList.add(\"visible\");\n\n  const styleTag = document.createElement(\"style\");\n  styleTag.textContent = `.admin-tab-btn{padding:8px 16px;border:1.5px solid #ddd;border-radius:8px;background:#fff;font-weight:700;font-size:13px;cursor:pointer}\n    .admin-tab-btn.active{background:#202a3d;color:#fff;border-color:#202a3d}`;\n  panel.appendChild(styleTag);\n\n  // Live listener — what the student is doing RIGHT NOW\n  onSnapshot(doc(db, \"sessions\", currentUserPhone, \"live\", \"current\"), snap => {\n    const box = document.getElementById(\"adminLiveNowBody\");\n    if(!box) return;\n    if(!snap.exists()){ box.innerHTML = \"<p style='opacity:.7;margin:0'>Waiting for activity…<\u002Fp>\"; return; }\n    const s = snap.data();\n    const modeLabel = s.mode===\"mock\" ? \"📝 Practice Test\"\n      : s.mode===\"revise\" ? \"📖 Revise Mode\"\n      : s.mode===\"browsing\" ? \"🏠 Browsing lessons\"\n      : \"✏️ Practice Mode\";\n\n    // Build an options list that looks like the real .mcq-option cards when we can tell\n    // the student's answer apart from the correct one (MCQ / True-False style answers).\n    let answerBlockHTML = \"\";\n    if(s.currentAnswer || s.typing){\n      const cls = s.answered ? (s.isCorrect ? \"correct\" : \"wrong\") : \"selected\";\n      answerBlockHTML = `\n        <div class=\"mcq-option ${cls}\" style=\"margin-bottom:8px;cursor:default\">\n          <span class=\"mcq-opt-letter\" style=\"width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0\">${STUDENT_NAME[0]}<\u002Fspan>\n          <span style=\"white-space:pre-wrap;word-break:break-word\">${s.typing?\"✍️ \":\"\"}${s.currentAnswer||\"\"}${s.typing?\" …\":\"\"}<\u002Fspan>\n        <\u002Fdiv>`;\n    } else {\n      answerBlockHTML = `<div style=\"font-size:13px;color:var(--muted);font-style:italic;padding:8px 0\">…not answered yet<\u002Fdiv>`;\n    }\n\n    // Model answer, shown exactly like the real peek panel the student can open themselves.\n    const peekHTML = s.correctAnswer ? `\n      <div class=\"peek-panel visible\" style=\"margin-top:6px\">\n        <div class=\"peek-label\">✓ Model / Correct Answer<\u002Fdiv>\n        <div class=\"peek-text\" style=\"white-space:pre-wrap\">${s.correctAnswer||\"\"}<\u002Fdiv>\n      <\u002Fdiv>` : \"\";\n\n    // Flag clearly when the student has used a peek/clue on this question —\n    // worth seeing live, not just buried in the score breakdown afterward.\n    const peekUsedHTML = s.peeksUsedThisQuestion>0 ? `\n      <div style=\"margin-top:8px;padding:8px 10px;background:rgba(209,152,63,.15);border-left:3px solid var(--gold,#d1983f);border-radius:0 8px 8px 0;font-size:12px;color:#7d5c1e;font-weight:700\">\n        👁 Used ${s.peeksUsedThisQuestion} peek${s.peeksUsedThisQuestion>1?\"s\":\"\"} on this question\n      <\u002Fdiv>` : \"\";\n\n    box.innerHTML = `\n      <div style=\"font-size:11px;color:var(--muted);margin-bottom:6px\">${modeLabel} · ${s.lessonTitle||\"\"} · ${s.qtype||\"\"} · Q${(s.qIndex??0)+1}/${s.qTotal||\"?\"}<\u002Fdiv>\n      <div class=\"q-text\" style=\"margin-bottom:10px;white-space:pre-wrap\">${s.questionText||\"\"}<\u002Fdiv>\n      ${s.answered && s.feedbackHTML ? `\n        ${s.currentAnswer ? `\n          <div style=\"font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px\">✍️ ${STUDENT_NAME}'s answer:<\u002Fdiv>\n          <div style=\"background:var(--parchment);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;border-left:3px solid var(--navy)\">${s.currentAnswer}<\u002Fdiv>\n        ` : \"\"}\n        <div style=\"font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px\">📋 ${STUDENT_NAME}'s result (same view they see):<\u002Fdiv>\n        ${s.feedbackHTML}\n      ` : `\n        ${answerBlockHTML}\n        ${peekHTML}\n        ${peekUsedHTML}\n      `}\n    `;\n  });\n\n  // Live listener — logs (today only — this is \"recent activity,\" not full history;\n  // use Past Sessions or Practice Tests tabs for anything older).\n  const logsQ = query(collection(db, \"sessions\", currentUserPhone, \"logs\"), orderBy(\"ts\", \"desc\"));\n  onSnapshot(logsQ, snap => {\n    const list = document.getElementById(\"adminLogList\");\n    if(!list) return;\n    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);\n    const todayDocs = snap.docs.filter(d=>{\n      const e = d.data();\n      const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : null;\n      return tsMs!==null && tsMs >= startOfToday.getTime();\n    });\n    if(!todayDocs.length){ list.innerHTML = \"<p style='color:#999'>No activity today yet.<\u002Fp>\"; return; }\n    list.innerHTML = todayDocs.map(d=>{\n      const e = d.data();\n      return `<div style=\"padding:8px 10px;border-bottom:1px solid #eee\">\n        <b>${e.lessonTitle||\"—\"}<\u002Fb> · ${e.qtype||\"\"} · ${e.pct!==undefined?e.pct+\"%\":\"\"}\n        <span style=\"color:#999;float:right\">${e.ts?.toDate?e.ts.toDate().toLocaleString():\"...\"}<\u002Fspan>\n      <\u002Fdiv>`;\n    }).join(\"\");\n  });\n\n  // Live listener — exam answers\n  const examQ = query(collection(db, \"sessions\", currentUserPhone, \"examAnswers\"), orderBy(\"ts\", \"desc\"));\n  onSnapshot(examQ, snap => {\n    const list = document.getElementById(\"adminExamList\");\n    if(!list) return;\n    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);\n    const todayDocs = snap.docs.filter(d=>{\n      const e = d.data();\n      const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : null;\n      return tsMs!==null && tsMs >= startOfToday.getTime();\n    });\n    if(!todayDocs.length){ list.innerHTML = \"<p style='color:#999'>No practice test activity today. See the Practice Tests tab for past attempts.<\u002Fp>\"; return; }\n    list.innerHTML = todayDocs.map(d=>{\n      const e = d.data();\n      const isOk = (e.pct||0) >= 80;\n      return `<div style=\"padding:8px 10px;border-bottom:1px solid #eee\">\n        <b>${(e.q||\"\").slice(0,80)}<\u002Fb><br>\n        <span style=\"color:#666\">Student's answer: ${(e.userText||\"\").slice(0,100)}<\u002Fspan><br>\n        <span style=\"color:#2a9d5c\">Correct answer: ${(e.modelText||\"\").slice(0,100)}<\u002Fspan>\n        <span style=\"color:${isOk?'#2a9d5c':'#c0392b'};float:right;font-weight:700\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fspan>\n      <\u002Fdiv>`;\n    }).join(\"\");\n  });\n}\n\nfunction showAdminTab(tab){\n  document.getElementById(\"adminTabLive\").style.display = tab===\"live\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabScoreboard\").style.display = tab===\"scoreboard\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabPast\").style.display = tab===\"past\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabMockExams\").style.display = tab===\"mockexams\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabLessons\").style.display = tab===\"lessons\" ? \"block\" : \"none\";\n  document.getElementById(\"adminTabGoodwill\").style.display = tab===\"goodwill\" ? \"block\" : \"none\";\n  if(tab===\"lessons\") renderAdminLessons();\n  document.getElementById(\"tabBtnLive\").classList.toggle(\"active\", tab===\"live\");\n  document.getElementById(\"tabBtnScoreboard\").classList.toggle(\"active\", tab===\"scoreboard\");\n  document.getElementById(\"tabBtnPast\").classList.toggle(\"active\", tab===\"past\");\n  document.getElementById(\"tabBtnMockExams\").classList.toggle(\"active\", tab===\"mockexams\");\n  document.getElementById(\"tabBtnLessons\").classList.toggle(\"active\", tab===\"lessons\");\n  document.getElementById(\"tabBtnGoodwill\").classList.toggle(\"active\", tab===\"goodwill\");\n  if(tab===\"scoreboard\"){ buildScoreboard(); renderHowToEarnPoints(\"adminHowToEarn\"); }\n  if(tab===\"past\") buildPastSessionsList();\n  if(tab===\"mockexams\") buildMockExamsList();\n  if(tab===\"goodwill\") renderGoodwillTab();\n}\n\nasync function renderGoodwillTab(){\n  const compBox = document.getElementById(\"compensationBtnWrap\");\n  const dailyBox = document.getElementById(\"goodwillDailyStatus\");\n  if(compBox){\n    const already = await checkCompensationAwarded();\n    compBox.innerHTML = already\n      ? `<div style=\"padding:10px;background:#eafaf0;color:var(--green);border-radius:8px;font-weight:700;font-size:13px;text-align:center\">✓ Already given<\u002Fdiv>`\n      : `<button onclick=\"submitCompensationBonus()\" style=\"width:100%;padding:12px;background:#d1983f;color:#202a3d;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer\">🎁 Give One-Time ${COMPENSATION_BONUS_AMOUNT}pt Bonus<\u002Fbutton>`;\n  }\n  if(dailyBox){\n    const state = await getGoodwillDailyState();\n    const left = GOODWILL_DAILY_CAP - state.count;\n    dailyBox.textContent = left>0\n      ? `${left} of ${GOODWILL_DAILY_CAP} awards left today`\n      : `No awards left today — resets tomorrow`;\n  }\n}\n\nasync function submitCompensationBonus(){\n  const ok = await awardCompensationBonus();\n  if(ok){\n    alert(`${COMPENSATION_BONUS_AMOUNT} points sent! ${STUDENT_NAME} will see the celebration instantly if the app is open.`);\n    renderGoodwillTab();\n  }\n}\n\nasync function submitGoodwillAward(){\n  const amount = document.getElementById(\"goodwillAmountInput\")?.value;\n  const custom = document.getElementById(\"goodwillReasonCustom\")?.value || \"\";\n  const select = document.getElementById(\"goodwillReasonSelect\")?.value || \"\";\n  const reason = custom.trim() || (select && select!==\"custom\" ? select : \"\");\n  const ok = await awardGoodwillPoints(amount, reason);\n  if(ok){\n    alert(`Sent! ${STUDENT_NAME} will see the celebration instantly if the app is open.`);\n    document.getElementById(\"goodwillReasonCustom\").value = \"\";\n    document.getElementById(\"goodwillReasonSelect\").value = \"\";\n    renderGoodwillTab();\n  }\n}\n\nasync function buildScoreboard(){\n  if(!window._fb || !currentUserPhone) return;\n  const totalBox = document.getElementById(\"scoreboardTotal\");\n  const sessBox = document.getElementById(\"scoreboardSessions\");\n  totalBox.innerHTML = \"Loading…\";\n  sessBox.innerHTML = \"\";\n\n  let { logsSnap, examSnap, totalTestPoints } = await getLogsBundle();\n\n  if(logsSnap.empty && examSnap.empty){\n    totalBox.innerHTML = \"<p style='margin:0'>No sessions recorded yet.<\u002Fp>\";\n    return;\n  }\n\n  // Same catch-up sweep as the student's own Scoreboard — without this,\n  // admin and student could show two different totals for the exact same\n  // account, since this is what catches a lesson mastered (or a milestone\n  // completed) before it had a chance to fire from a live event.\n  const firstPassEntries = aggregateScoreboardData(logsSnap, examSnap).allScoredEntries;\n  await sweepAllPendingBonuses();\n  await syncPointAchievementsToHistory(firstPassEntries);\n  ({ logsSnap, examSnap, totalTestPoints } = await getLogsBundle());\n  maybeShowScoreCorrectionNotice();\n\n  const { bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries } = aggregateScoreboardData(logsSnap, examSnap);\n  totalBox.innerHTML = await renderScoreboardTotalHTML(bySession, allUnique, grandAttempts, grandTimeMs, mockStats, allScoredEntries, totalTestPoints);\n  sessBox.innerHTML = renderScoreboardSessionsHTML(bySession);\n}\n\n// Cache of the last-fetched session groups, so View/Download buttons don't have\n// to re-query Firestore every click.\nlet _pastSessionsCache = null;\n\n// Student-facing wrapper — same data and rendering, just targets the report panel's element.\nfunction buildStudentPastSessionsList(){\n  buildPastSessionsList(\"studentPastSessionsList\");\n}\n\nasync function buildPastSessionsList(targetId){\n  targetId = targetId || \"pastSessionsList\";\n  if(!window._fb || !currentUserPhone) return;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  const list = document.getElementById(targetId);\n  if(!list) return;\n  list.innerHTML = \"Loading…\";\n\n  const [{ logsSnap, examSnap }, spellSnap] = await Promise.all([\n    getLogsBundle(),\n    getDocs(query(collection(db,\"sessions\",currentUserPhone,\"spellErrors\"), orderBy(\"ts\",\"asc\")))\n  ]);\n\n  if(logsSnap.empty && examSnap.empty){\n    list.innerHTML = \"<p style='color:var(--muted)'>No sessions recorded yet.<\u002Fp>\";\n    return;\n  }\n\n  const { bySession } = aggregateScoreboardData(logsSnap, examSnap);\n  // Fold spelling errors into their matching session group by sessionId\n  spellSnap.forEach(d=>{\n    const e = d.data();\n    const sid = e.sessionId || \"unknown\";\n    if(!bySession[sid]) bySession[sid] = { entries:[], mockEntries:[], spellEntries:[], firstTs:null, lastTs:null };\n    if(!bySession[sid].spellEntries) bySession[sid].spellEntries = [];\n    bySession[sid].spellEntries.push(e);\n  });\n\n  const sessionIds = Object.keys(bySession).sort((a,b)=>bySession[b].firstTs - bySession[a].firstTs).slice(0,5);\n  _pastSessionsCache = bySession;\n\n  list.innerHTML = sessionIds.map(sid=>{\n    const s = bySession[sid];\n    const uniqueInSession = new Set(s.entries.map(e=>`${e.lessonId}|${e.qtype}|${e.qIndex}`));\n    const attemptsInSession = s.entries.length;\n    const timeInSession = s.entries.reduce((a,e)=>a+(e.timeMs||0),0);\n    const mockInSession = s.mockEntries.length;\n    const dateLabel = new Date(s.firstTs).toLocaleString();\n    return `\n      <div style=\"border:1.5px solid var(--border,#eee);border-radius:10px;padding:14px;margin-bottom:12px\">\n        <div style=\"font-weight:700;font-size:13px;color:var(--navy,#202a3d)\">${dateLabel}<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-top:8px;font-size:12px;flex-wrap:wrap;color:var(--muted,#666)\">\n          <div><b style=\"color:var(--navy,#202a3d)\">${uniqueInSession.size}<\u002Fb> unique<\u002Fdiv>\n          <div><b style=\"color:var(--navy,#202a3d)\">${attemptsInSession}<\u002Fb> attempts<\u002Fdiv>\n          <div><b style=\"color:var(--navy,#202a3d)\">${fmtMs(timeInSession)}<\u002Fb> spent<\u002Fdiv>\n          ${mockInSession ? `<div>🎯 <b style=\"color:var(--navy,#202a3d)\">${mockInSession}<\u002Fb> mock answers<\u002Fdiv>` : \"\"}\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button onclick=\"viewPastSession('${sid}')\" style=\"flex:1;padding:8px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">👁 View<\u002Fbutton>\n          <button onclick=\"downloadPastSession('${sid}')\" style=\"flex:1;padding:8px;background:#fff;color:var(--navy,#202a3d);border:1.5px solid var(--navy,#202a3d);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">⬇ Download<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n}\n\n// Opens an in-page detail view for one specific past session —\n// every question answered, the student's answer, and the correct answer.\nfunction viewPastSession(sid){\n  const s = _pastSessionsCache?.[sid];\n  if(!s) return;\n\n  let detail = document.getElementById(\"pastSessionDetail\");\n  if(!detail){\n    detail = document.createElement(\"div\");\n    detail.id = \"pastSessionDetail\";\n    detail.style.cssText = \"position:fixed;inset:0;background:#fff;z-index:300000;overflow-y:auto;padding:50px 16px 24px\";\n    document.body.appendChild(detail);\n  }\n\n  const dateLabel = new Date(s.firstTs).toLocaleString();\n  const studyRows = s.entries.map(e=>`\n    <div style=\"padding:8px 10px;border-bottom:1px solid #eee;font-size:13px\">\n      <b>${e.lessonTitle||\"—\"}<\u002Fb> · ${e.qtype||\"\"}\n      <span style=\"float:right;font-weight:700;color:${(e.pct||0)>=80?'var(--green,#2a9d5c)':'var(--red,#c0392b)'}\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\") || \"<p style='color:var(--muted)'>No study activity in this session.<\u002Fp>\";\n\n  const mockRows = s.mockEntries.map(e=>`\n    <div style=\"padding:10px;border-bottom:1px solid #eee;font-size:13px\">\n      <b>${(e.q||\"\").slice(0,100)}<\u002Fb><br>\n      <span style=\"color:var(--muted,#666)\">Student's answer: ${(e.userText||\"\").slice(0,150)}<\u002Fspan><br>\n      <span style=\"color:var(--green,#2a9d5c)\">Correct answer: ${(e.modelText||\"\").slice(0,150)}<\u002Fspan>\n      <span style=\"float:right;font-weight:700;color:${(e.pct||0)>=80?'var(--green,#2a9d5c)':'var(--red,#c0392b)'}\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\") || \"<p style='color:var(--muted)'>No practice test in this session.<\u002Fp>\";\n\n  const spellRows = (s.spellEntries||[]).map(e=>`\n    <div style=\"padding:6px 10px;border-bottom:1px solid #eee;font-size:13px\">\n      <span style=\"text-decoration:line-through;color:var(--red,#c0392b)\">${e.wrong||\"\"}<\u002Fspan>\n      → <span style=\"color:var(--green,#2a9d5c);font-weight:700\">${e.correct||\"\"}<\u002Fspan>\n      <span style=\"float:right;color:var(--muted,#888)\">${e.lessonTitle||\"\"}<\u002Fspan>\n    <\u002Fdiv>`).join(\"\") || \"<p style='color:var(--muted)'>No spelling corrections in this session.<\u002Fp>\";\n\n  detail.innerHTML = `\n    <button onclick=\"document.getElementById('pastSessionDetail').remove()\"\n      style=\"position:fixed;top:8px;right:12px;background:#d15f5a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:300001\">✕ Close<\u002Fbutton>\n    <h2 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d)\">${dateLabel}<\u002Fh2>\n    <h3 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d);margin-top:20px\">📖 Study Activity<\u002Fh3>\n    ${studyRows}\n    <h3 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d);margin-top:20px\">📝 Practice Test<\u002Fh3>\n    ${mockRows}\n    <h3 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d);margin-top:20px\">✏️ Spelling to Learn<\u002Fh3>\n    ${spellRows}\n    <button onclick=\"downloadPastSession('${sid}')\" style=\"margin-top:20px;padding:10px 20px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">⬇ Download This Session<\u002Fbutton>\n  `;\n}\n\n// Downloads a single past session as a standalone HTML report.\nfunction downloadPastSession(sid){\n  const s = _pastSessionsCache?.[sid];\n  if(!s) return;\n  const dateLabel = new Date(s.firstTs).toLocaleString();\n\n  let html = `<html><head><meta charset=\"utf-8\"><title>Study Buddy Session Report<\u002Ftitle>\n    <style>body{font-family:Georgia,serif;padding:24px;color:#222}h2{color:#202a3d}\n    table{width:100%;border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;text-align:left}<\u002Fstyle>\n    <\u002Fhead><body>\n    <h1>📊 Study Buddy — Session Report<\u002Fh1>\n    <p>Student: ${STUDENT_NAME} · Session: ${dateLabel}<\u002Fp>\n    <h2>Study Activity (${s.entries.length})<\u002Fh2>\n    <table><tr><th>Lesson<\u002Fth><th>Type<\u002Fth><th>Score<\u002Fth><th>Time taken<\u002Fth><\u002Ftr>`;\n  s.entries.forEach(e=>{\n    html += `<tr><td>${e.lessonTitle||\"—\"}<\u002Ftd><td>${e.qtype||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><td>${e.timeMs?fmtMs(e.timeMs):\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><h2>Practice Test (${s.mockEntries.length})<\u002Fh2>\n    <table><tr><th>Question<\u002Fth><th>Student's Answer<\u002Fth><th>Correct Answer<\u002Fth><th>Score<\u002Fth><\u002Ftr>`;\n  s.mockEntries.forEach(e=>{\n    html += `<tr><td>${e.q||\"\"}<\u002Ftd><td>${e.userText||\"\"}<\u002Ftd><td>${e.modelText||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><h2>✏️ Spelling to Learn (${(s.spellEntries||[]).length})<\u002Fh2>\n    <table><tr><th>You wrote<\u002Fth><th>Correct spelling<\u002Fth><th>Lesson<\u002Fth><\u002Ftr>`;\n  (s.spellEntries||[]).forEach(e=>{\n    html += `<tr><td>${e.wrong||\"\"}<\u002Ftd><td>${e.correct||\"\"}<\u002Ftd><td>${e.lessonTitle||\"—\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_Session_${s.firstTs}.html`;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n\n// Cache of mock-exam attempts (grouped by sessionId, since one practice test = one session's worth of examAnswers).\nlet _mockExamsCache = null;\nlet _mockExamsAllIds = [];   // all exam IDs, newest first, fully loaded once per call\nlet _mockExamsShown = 0;     // how many are currently rendered\nconst MOCK_EXAMS_PAGE_SIZE = 15;\n\n// Student-facing wrapper\nfunction buildStudentMockExamsList(){\n  buildMockExamsList(\"studentMockExamsList\", \"studentMockExamsLoadMore\");\n}\n\nasync function buildMockExamsList(targetId, loadMoreBtnId){\n  targetId = targetId || \"mockExamsList\";\n  loadMoreBtnId = loadMoreBtnId || \"mockExamsLoadMore\";\n  if(!window._fb || !currentUserPhone) return;\n  const { db, collection, query, orderBy, getDocs } = window._fb;\n  const list = document.getElementById(targetId);\n  if(!list) return;\n  list.innerHTML = \"Loading…\";\n\n  const examSnap = await getDocs(query(collection(db,\"sessions\",currentUserPhone,\"examAnswers\"), orderBy(\"ts\",\"asc\")));\n  if(examSnap.empty){\n    list.innerHTML = \"<p style='color:var(--muted)'>No practice tests taken yet.<\u002Fp>\";\n    const lm = document.getElementById(loadMoreBtnId); if(lm) lm.style.display = \"none\";\n    return;\n  }\n\n  // Group by mockExamId (one group = one full exam attempt). Older entries written\n  // before this field existed fall back to sessionId so they still show up.\n  const byExam = {};\n  examSnap.forEach(d=>{\n    const e = d.data();\n    const eid = e.mockExamId || e.sessionId || \"unknown\";\n    if(!byExam[eid]) byExam[eid] = { answers:[], firstTs:null, lastTs:null };\n    byExam[eid].answers.push(e);\n    const tsMs = e.ts?.toDate ? e.ts.toDate().getTime() : Date.now();\n    if(!byExam[eid].firstTs || tsMs < byExam[eid].firstTs) byExam[eid].firstTs = tsMs;\n    if(!byExam[eid].lastTs  || tsMs > byExam[eid].lastTs)  byExam[eid].lastTs  = tsMs;\n  });\n  _mockExamsCache = byExam;\n  _mockExamsAllIds = Object.keys(byExam).sort((a,b)=>byExam[b].firstTs - byExam[a].firstTs);\n  _mockExamsShown = Math.min(MOCK_EXAMS_PAGE_SIZE, _mockExamsAllIds.length);\n\n  renderMockExamsPage(targetId, loadMoreBtnId);\n}\n\nfunction renderMockExamsPage(targetId, loadMoreBtnId){\n  const list = document.getElementById(targetId);\n  const byExam = _mockExamsCache;\n  const visibleIds = _mockExamsAllIds.slice(0, _mockExamsShown);\n\n  list.innerHTML = visibleIds.map(eid=>{\n    const ex = byExam[eid];\n    const total = ex.answers.length;\n    const avgScore = Math.round(ex.answers.reduce((a,e)=>a+(e.pct||0),0)/total);\n    const correct = ex.answers.filter(e=>(e.pct||0)>=80).length;\n    const dateLabel = new Date(ex.firstTs).toLocaleString();\n    const durationMs = ex.lastTs - ex.firstTs;\n    return `\n      <div style=\"border:1.5px solid var(--border,#eee);border-radius:10px;padding:14px;margin-bottom:12px\">\n        <div style=\"font-weight:700;font-size:13px;color:var(--navy,#202a3d)\">${dateLabel}<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;margin-top:8px;font-size:12px;flex-wrap:wrap;color:var(--muted,#666)\">\n          <div><b style=\"color:var(--navy,#202a3d)\">${total}<\u002Fb> questions<\u002Fdiv>\n          <div><b style=\"color:${avgScore>=80?'var(--green,#2a9d5c)':avgScore>=50?'#9c7519':'var(--red,#c0392b)'}\">${avgScore}%<\u002Fb> avg score<\u002Fdiv>\n          <div><b style=\"color:var(--navy,#202a3d)\">${correct}<\u002Fb>/${total} correct<\u002Fdiv>\n          <div>⏱ <b style=\"color:var(--navy,#202a3d)\">${fmtMs(durationMs)}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button onclick=\"viewMockExam('${eid}')\" style=\"flex:1;padding:8px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">👁 View Answers<\u002Fbutton>\n          <button onclick=\"downloadMockExamAttempt('${eid}')\" style=\"flex:1;padding:8px;background:#fff;color:var(--navy,#202a3d);border:1.5px solid var(--navy,#202a3d);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer\">⬇ Download<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n\n  // Show/hide and wire the \"Load older exams\" button\n  const lm = document.getElementById(loadMoreBtnId);\n  if(lm){\n    if(_mockExamsShown < _mockExamsAllIds.length){\n      lm.style.display = \"block\";\n      lm.textContent = `Load older exams ↓ (${_mockExamsAllIds.length - _mockExamsShown} more)`;\n      lm.onclick = ()=>{\n        _mockExamsShown = Math.min(_mockExamsShown + MOCK_EXAMS_PAGE_SIZE, _mockExamsAllIds.length);\n        renderMockExamsPage(targetId, loadMoreBtnId);\n      };\n    } else {\n      lm.style.display = \"none\";\n    }\n  }\n}\n\n// Full answer-by-answer view for one practice test attempt — selected vs correct answer for every question.\nfunction viewMockExam(eid){\n  const ex = _mockExamsCache?.[eid];\n  if(!ex) return;\n\n  let detail = document.getElementById(\"mockExamDetail\");\n  if(!detail){\n    detail = document.createElement(\"div\");\n    detail.id = \"mockExamDetail\";\n    detail.style.cssText = \"position:fixed;inset:0;background:#fff;z-index:300000;overflow-y:auto;padding:50px 16px 24px\";\n    document.body.appendChild(detail);\n  }\n\n  const dateLabel = new Date(ex.firstTs).toLocaleString();\n  const rows = ex.answers.map((e,i)=>{\n    const isOk = (e.pct||0) >= 80;\n    return `\n      <div style=\"border:1.5px solid var(--border,#eee);border-radius:10px;padding:12px 14px;margin-bottom:10px\">\n        <div style=\"font-size:12px;color:var(--muted,#888);margin-bottom:4px\">Q${i+1} · ${e.qtype||\"\"} · ${e.lessonTitle||\"\"}<\u002Fdiv>\n        <div class=\"q-text\" style=\"margin-bottom:8px;font-size:14px\">${e.q||\"\"}<\u002Fdiv>\n        <div class=\"mcq-option ${isOk?'correct':'wrong'}\" style=\"margin-bottom:6px;cursor:default\">\n          <span>${STUDENT_NAME}'s answer: ${e.userText||\"(no answer)\"}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"peek-panel visible\">\n          <div class=\"peek-label\">✓ Correct Answer<\u002Fdiv>\n          <div class=\"peek-text\">${e.modelText||\"\"}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:6px;font-size:12px;font-weight:700;color:${isOk?'var(--green,#2a9d5c)':'var(--red,#c0392b)'}\">${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join(\"\");\n\n  detail.innerHTML = `\n    <button onclick=\"document.getElementById('mockExamDetail').remove()\"\n      style=\"position:fixed;top:8px;right:12px;background:#d15f5a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:300001\">✕ Close<\u002Fbutton>\n    <h2 style=\"font-family:Georgia,serif;color:var(--navy,#202a3d)\">📝 Practice Test — ${dateLabel}<\u002Fh2>\n    ${rows}\n    <button onclick=\"downloadMockExamAttempt('${eid}')\" style=\"margin-top:10px;padding:10px 20px;background:var(--navy,#202a3d);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">⬇ Download This Exam<\u002Fbutton>\n  `;\n}\n\n// Downloads one practice test attempt as a standalone HTML report.\nfunction downloadMockExamAttempt(eid){\n  const ex = _mockExamsCache?.[eid];\n  if(!ex) return;\n  const dateLabel = new Date(ex.firstTs).toLocaleString();\n  const total = ex.answers.length;\n  const avgScore = Math.round(ex.answers.reduce((a,e)=>a+(e.pct||0),0)/total);\n\n  let html = `<html><head><meta charset=\"utf-8\"><title>Study Buddy Practice Test Report<\u002Ftitle>\n    <style>body{font-family:Georgia,serif;padding:24px;color:#222}h2{color:#202a3d}\n    table{width:100%;border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;text-align:left}<\u002Fstyle>\n    <\u002Fhead><body>\n    <h1>🎯 Study Buddy — Practice Test Report<\u002Fh1>\n    <p>Student: ${STUDENT_NAME} · Taken: ${dateLabel} · Average score: ${avgScore}%<\u002Fp>\n    <table><tr><th>#<\u002Fth><th>Question<\u002Fth><th>Student's Answer<\u002Fth><th>Correct Answer<\u002Fth><th>Score<\u002Fth><\u002Ftr>`;\n  ex.answers.forEach((e,i)=>{\n    html += `<tr><td>${i+1}<\u002Ftd><td>${e.q||\"\"}<\u002Ftd><td>${e.userText||\"\"}<\u002Ftd><td>${e.modelText||\"\"}<\u002Ftd><td>${e.pct!==undefined?e.pct+\"%\":\"\"}<\u002Ftd><\u002Ftr>`;\n  });\n  html += `<\u002Ftable><\u002Fbody><\u002Fhtml>`;\n\n  const blob = new Blob([html], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `StudyBuddy_MockExam_${ex.firstTs}.html`;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n\n// ═══════════════════════════════════════════════════════\n//  SPELLING GAME — built from real past mistakes\n// ═══════════════════════════════════════════════════════\nlet _spellingWords = [];   // deduped {word, lessonTitle, missCount} pulled from Firestore\nlet _spellingIdx = 0;\nlet _spellingScore = 0;\nlet _spellingRoundSize = 0;\nlet _spellingSubject = \"\";\nlet _answeredQuestionKeys = new Set(); // tracks lessonId|qtype|qIndex keys already answered (loaded from Firebase on scoreboard open)\nlet _answeredKeysLoaded = false;\nlet _masteredQuestionKeys = new Set();\nlet _questionIndexMap = null; // maps display index -> original DATA index for weighted ordering // questions scored 80%+ at least twice\nlet _completeLessons = {}; // lessonId -> true/false, loaded from Firebase\n\nlet _spellingAllBySubject = {}; // subject -> [{word, lessonTitle, missCount}]\n\n// ═══════════════════════════════════════════════════════\n//  REVISE MODE — PRACTICE SPELLINGS FOR THIS QUESTION\n// ═══════════════════════════════════════════════════════\n// For long-answer types (Answer in Brief, Give Reasons, Distinguish Between,\n// Answer in Paragraph/Detail), pull the harder/key vocabulary words straight\n// out of THIS question's model answer so a student can drill spelling for\n// exactly the answer they're revising, right where they're revising it.\nconst SPELL_STOPWORDS = new Set([\"the\",\"about\",\"after\",\"again\",\"against\",\"all\",\"also\",\n  \"although\",\"among\",\"and\",\"another\",\"any\",\"are\",\"around\",\"because\",\"been\",\n  \"before\",\"being\",\"between\",\"both\",\"but\",\"cannot\",\"could\",\"did\",\"does\",\"doing\",\n  \"down\",\"during\",\"each\",\"either\",\"enough\",\"even\",\"every\",\"for\",\"from\",\"further\",\n  \"had\",\"has\",\"have\",\"having\",\"here\",\"however\",\"into\",\"itself\",\"just\",\"like\",\n  \"made\",\"make\",\"many\",\"might\",\"more\",\"most\",\"much\",\"must\",\"never\",\"not\",\n  \"nowhere\",\"off\",\"once\",\"only\",\"onto\",\"other\",\"others\",\"otherwise\",\"ought\",\n  \"our\",\"ours\",\"out\",\"over\",\"own\",\"people\",\"public\",\"rather\",\"same\",\"shall\",\n  \"should\",\"since\",\"some\",\"still\",\"such\",\"than\",\"that\",\"their\",\"theirs\",\"them\",\n  \"themselves\",\"then\",\"there\",\"therefore\",\"these\",\"they\",\"this\",\"those\",\"though\",\n  \"through\",\"throughout\",\"thus\",\"under\",\"unless\",\"until\",\"upon\",\"very\",\"was\",\n  \"well\",\"were\",\"what\",\"whatever\",\"when\",\"whenever\",\"where\",\"whereas\",\"wherever\",\n  \"whether\",\"which\",\"while\",\"who\",\"whom\",\"whose\",\"why\",\"will\",\"with\",\"within\",\n  \"without\",\"would\",\"yet\",\"your\",\"yours\",\"yourself\"]);\n\n// ═══════════════════════════════════════════════════════\n//  MANDATORY SPELLING WARM-UP — before writing questions\n// ═══════════════════════════════════════════════════════\n// A short, unskippable spelling round on this specific question's key\n// vocabulary, required before the answer box becomes usable. Scoped to the\n// writing types (Brief, Reasons, Distinguish, Paragraph, Quote from Memory)\n// where getting the right words down actually matters — not MCQ/Fill/\n// True-False/Match, where this wouldn't make sense. Resets each fresh visit\n// to the app (session-local), so it recurs regularly without becoming\n// absurdly repetitive on every single Try Again within one sitting.\nconst SPELLING_GATE_QTYPES = new Set([\"brief\",\"reasons\",\"distinguish\",\"paragraph\",\"memorise\"]);\nlet _spellingIsGate = false;\nlet _spellingGateKey = null;\nlet _spellingGateResumeFn = null; // what to run once the warm-up finishes — set by whichever peek-close triggered it\nlet _spellingGateAnswerHTML = \"\"; // the model answer text, stashed so it can be viewed again on demand during the gate\nconst _spellingGateDoneKeys = new Set();\n\nfunction maybeShowSpellingGate(qtype, qIndex, onDone){\n  // Note: this now also triggers for admin logins, deliberately — it's a\n  // purely in-memory, session-local flag (_spellingGateDoneKeys), never\n  // written to Firestore, so admin triggering it for testing has zero\n  // effect on the student's actual saved progress either way.\n  if(currentMode!==\"study\" || !currentLesson || currentLesson.id===\"__mock__\") return false;\n  if(!SPELLING_GATE_QTYPES.has(qtype)) return false;\n  const key = `${currentLesson.id}_${qtype}_${qIndex}`;\n  if(_spellingGateDoneKeys.has(key)) return false;\n\n  const qs = currentLesson.questions[qtype]||[];\n  const q = qs[qIndex];\n  if(!q) return false;\n  const refText = qtype===\"distinguish\" ? ((q.answerA||\"\")+\" \"+(q.answerB||\"\")) : (q.answer||\"\");\n  const words = getAnswerSpellingWords(refText);\n  if(!words.length){ _spellingGateDoneKeys.add(key); return false; } // nothing to warm up on — don't block for no reason\n\n  _spellingIsGate = true;\n  _spellingGateKey = key;\n  _spellingGateResumeFn = onDone || null; // what to do once the warm-up finishes — set by whoever triggered it (always the peek-close moment now)\n  _spellingGateAnswerHTML = qtype===\"distinguish\"\n    ? `<div style=\"margin-bottom:8px\"><b>${(q.termA||\"Term A\").replace(/<\u002Fg,\"&lt;\")}:<\u002Fb> ${(q.answerA||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv><div><b>${(q.termB||\"Term B\").replace(/<\u002Fg,\"&lt;\")}:<\u002Fb> ${(q.answerB||\"\").replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>`\n    : (q.answer||\"\").replace(/<\u002Fg,\"&lt;\");\n  _spellingWords = words.map(w=>({ word:w, lessonTitle: currentLesson.title }));\n  _spellingSubject = \"Warm-Up\";\n  _spellingIdx = 0;\n  _spellingScore = 0;\n  _spellingRoundSize = Math.min(6, _spellingWords.length); // shorter than a full round — a quick warm-up, not the whole game\n\n  const panel = document.getElementById(\"spellingPanel\");\n  const titleEl = document.getElementById(\"spellingPanelTitle\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(titleEl) titleEl.textContent = \"🔤 Quick Spelling Warm-Up\";\n  if(doneBtn) doneBtn.style.display = \"none\"; // no early exit into the actual question — only \"Continue to Question\" at the end gets you there\n  if(skipBtn) skipBtn.style.display = \"block\"; // but moving PAST this question entirely is always allowed — the gate only blocks answering it\n  if(viewAnswerBtn){ viewAnswerBtn.style.display = \"block\"; viewAnswerBtn.textContent = \"👁 View Model Answer Again\"; }\n  if(answerBox) answerBox.style.display = \"none\"; // start collapsed each time the gate opens\n  panel?.classList.add(\"visible\");\n  renderSpellingRoundIntro(document.getElementById(\"spellingGameRoot\"));\n\n  // The answer box is already locked at this point — the gate now triggers\n  // right when peek closes, BEFORE the textarea would have unlocked, so\n  // there's nothing extra to lock here. The peek button itself still gets\n  // disabled, so it can't be reopened mid-warm-up.\n  const peekBtn = document.getElementById(\"mainPeekBtn\");\n  if(peekBtn) peekBtn.disabled = true;\n  return true;\n}\n\n// Called from the \"Continue to Question →\" button at the end of a gate round\n// Lets him look at the model answer again mid-warm-up, in case he closed\n// peek too fast or wants to double-check something before continuing —\n// shown inline in the same panel, no need to leave the gate to see it.\nfunction toggleSpellingGateAnswer(){\n  const box = document.getElementById(\"spellingGateAnswerBox\");\n  const btn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  if(!box) return;\n  const showing = box.style.display !== \"none\";\n  if(showing){\n    box.style.display = \"none\";\n    if(btn) btn.textContent = \"👁 View Model Answer Again\";\n  } else {\n    box.innerHTML = _spellingGateAnswerHTML;\n    box.style.display = \"block\";\n    if(btn) btn.textContent = \"🙈 Hide Model Answer\";\n  }\n}\n\nfunction finishSpellingGate(){\n  if(_spellingGateKey) _spellingGateDoneKeys.add(_spellingGateKey);\n  _spellingIsGate = false;\n  _spellingGateKey = null;\n  document.getElementById(\"spellingPanel\")?.classList.remove(\"visible\");\n  const doneBtn = document.getElementById(\"spellingPanelDoneBtn\");\n  if(doneBtn) doneBtn.style.display = \"\"; // restore for normal (non-gate) spelling game use\n  const skipBtn = document.getElementById(\"spellingGateSkipBtn\");\n  if(skipBtn) skipBtn.style.display = \"none\";\n  const viewAnswerBtn = document.getElementById(\"spellingGateViewAnswerBtn\");\n  if(viewAnswerBtn) viewAnswerBtn.style.display = \"none\";\n  const answerBox = document.getElementById(\"spellingGateAnswerBox\");\n  if(answerBox) answerBox.style.display = \"none\";\n  // Resume exactly where the peek-close left off — unlock the textarea(s)\n  // directly, rather than a full re-render, which would otherwise wipe out\n  // the fact that he already viewed the peek and reset things back to\n  // \"disabled, awaiting peek\" again.\n  const resume = _spellingGateResumeFn;\n  _spellingGateResumeFn = null;\n  if(resume) resume(); else renderCurrentQuestion();\n}\n\n// Lets him move past this question entirely without doing the warm-up —\n// the gate only blocks actually ANSWERING it, not navigating on. Doesn't\n// mark the warm-up as done, so if he comes back to genuinely answer this\n// question later, the gate applies fresh, same as any other new attempt.\nfunction skipQuestionFromSpellingGate(){\n  const isLast = currentQIndex >= (currentLesson?.questions[currentQType]||[]).length - 1;\n  _spellingIsGate = false;\n  _
