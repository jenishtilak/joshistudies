period that witnessed domestication of animals and cultivation of crops is called Mesolithic.\", options:[\"(i) is correct\",\"(ii) is correct\",\"(ii) and (iii) are correct\",\"(iv) is correct\"], correct:0 },\n                { q:\"Assertion (A): Many of the Mesolithic sites are found nearby rivers and tanks. Reason (R): Irrigation management developed during Mesolithic period.\", options:[\"A and R are correct and R explains A\",\"A and R are correct but R doesn't explain A\",\"A is correct but R is incorrect\",\"A and R both are incorrect\"], correct:2 },\n              ],\n              fill:[\n                { sentence:\"Hand axes and cleavers are the important tool types of the ___ culture.\", answers:[\"Lower Palaeolithic\"] },\n                { sentence:\"The methods and techniques involved in the production of stone tools are called ___ technology.\", answers:[\"Lithic\"] },\n                { sentence:\"___ is known as the Middle Stone Age, as it is placed between the Palaeolithic and Neolithic.\", answers:[\"Mesolithic\"] },\n              ],\n              match:[\n                {\n                  q:\"Match the terms with their meanings\",\n                  left:[\"Palaeo anthropology\",\"Hand axe tools\",\"Images on stone and bone\",\"Red sand dunes\",\"Stone artefacts of small size\"],\n                  right:[\"Teris\",\"Venus\",\"Acheulian\",\"Microliths\",\"The study of the human ancestors\"],\n                  correct:[4,2,1,0,3]\n                }\n              ],\n              brief:[\n                { q:\"Discuss how the age of speculation made humans become conscious and knowledgeable.\", answer:\"Humans are the only species on earth concerned with understanding as well as explaining the world and the universe. In the course of evolution humans became conscious and knowledgeable.\" },\n                { q:\"Examine the tool making technical skills of lower Palaeolithic people.\", answer:\"The human ancestors flaked large stone blocks and designed various tools including hand axes.\" },\n                { q:\"The history of humans is closely related to the history of the earth. Elucidate.\", answer:\"The history of humans is closely related to the history of the earth. The earth contains geological, archaeological and biological records of historical times in its upper layers. They are important for reconstructing the history of the earth and various living organisms.\" },\n              ], truefalse:[\n                { statement:\"The concept 'survival of the fittest' contributed to the scientific understanding of human origins.\", answer:\"true\", reason:\"Charles Darwin's theory of natural selection and biological evolution helped explain human origins scientifically.\" },\n                { statement:\"The book 'On the Origin of Species' was published by Herbert Spencer.\", answer:\"false\", reason:\"The book 'On the Origin of Species' was written and published by Charles Darwin, not Herbert Spencer.\" },\n                { statement:\"Among the Great Apes, Orang-utan is genetically the closest to humans.\", answer:\"false\", reason:\"Chimpanzee is genetically the closest to humans, not Orang-utan.\" },\n                { statement:\"The ancestors to humans were called Hominins and their origins have been traced to Africa.\", answer:\"true\", reason:\"Fossil evidence shows that hominins, the ancestors of modern humans, originated in Africa.\" },\n                { statement:\"Flake can be used for tool making.\", answer:\"false\", reason:\"Flake is a small chip removed from the core. It is the Core (the main block) from which flakes are removed to make tools, not the flake itself used directly.\" },\n                { statement:\"Acheulian is the main block of stone from which small chips are flaked by using a hammer stone.\", answer:\"false\", reason:\"The Core is the main block of stone from which small chips are flaked. Acheulian refers to a tool culture/tradition.\" },\n              ],\n              reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h2\",\n            questions:{\n              mcq:[\n                { q:\"The earliest signs to denote words through pictures\", options:[\"Calligraphy\",\"Pictographic\",\"Ideographic\",\"Stratigraphic\"], correct:1 },\n                { q:\"The preservation process of dead body in ancient Egypt\", options:[\"Sarcophagus\",\"Hyksos\",\"Mummification\",\"Polytheism\"], correct:2 },\n                { q:\"The Sumerian system of writing\", options:[\"Pictographic\",\"Hieroglyphic\",\"Sonogram\",\"Cuneiform\"], correct:3 },\n                { q:\"The Harappans did not have the knowledge of\", options:[\"Gold and Elephant\",\"Horse and Iron\",\"Sheep and Silver\",\"Ox and Platinum\"], correct:1 },\n                { q:\"The Bronze image suggestive of the use of lost-wax process known to the Indus people.\", options:[\"Jar\",\"Priest king\",\"Dancing girl\",\"Bird\"], correct:2 },\n                { q:\"Which statement about Mesopotamia is correct? (i) The oldest civilisation in Mesopotamia belonged to the Akkadians. (ii) The Chinese developed the Hieroglyphic system. (iii) The Euphrates and Tigris drain into the Mannar Gulf. (iv) Hammurabi, the king of Babylon was a great law maker.\", options:[\"(i) is correct\",\"(i) and (ii) are correct\",\"(iii) is correct\",\"(iv) is correct\"], correct:3 },\n                { q:\"Which statement about China is correct? (i) Yangtze River is known as Sorrow of China. (ii) Wu-Ti constructed the Great Wall of China. (iii) Chinese invented gun powder. (iv) According to traditions Mencius was the founder of Taoism.\", options:[\"(i) is correct\",\"(ii) is correct\",\"(iii) is correct\",\"(iii) and (iv) are correct\"], correct:2 },\n                { q:\"What is the correct chronological order of four civilisations of Mesopotamia?\", options:[\"Sumerians - Assyrians - Akkadians - Babylonians\",\"Babylonians - Sumerians - Assyrians - Akkadians\",\"Sumerians - Akkadians - Babylonians - Assyrians\",\"Babylonians - Assyrians - Akkadians - Sumerians\"], correct:2 },\n                { q:\"Assertion (A): Assyrians of Mesopotamian civilisation were contemporaries of Indus civilisation. Reason (R): The Documents of an Assyrian ruler refer to the ships from Meluha.\", options:[\"A and R are correct and A explains R\",\"A and R are correct but A doesn't explain R\",\"A is incorrect but R is correct\",\"Both A and R are incorrect\"], correct:0 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h3\",  unit:\"Unit 3\",  title:\"Early Tamil Society and Culture\", month:\"July\",\n            questions:{\n              mcq:[\n                { q:\"The name of the script used in the Sangam Age\", options:[\"English\",\"Devanagari\",\"Tamil-Brahmi\",\"Granta\"], correct:2 },\n                { q:\"The Sri Lankan chronicle composed in the Pali language mentioning about merchants and horse traders from Tamil Nadu\", options:[\"Deepavamsa\",\"Arthasastra\",\"Mahavamsa\",\"Indica\"], correct:2 },\n                { q:\"The notable Chola king credited with bringing forest lands under the plough and developing irrigational facilities\", options:[\"Karikalan\",\"Rajarajan I\",\"Kulothungan\",\"Rajendran I\"], correct:0 },\n                { q:\"Inscription that mentions the Cheras\", options:[\"Pugalur\",\"Girnar\",\"Pulimankombai\",\"Madurai\"], correct:0 },\n                { q:\"Which statements are correct? (i) Coins as a medium of exchange were introduced for the first time in the Mesolithic Age. (ii) Prakrit was the language used by the common people in Northern India during the Mauryan period. (iii) Vienna Papyrus, a Roman document, mentions trade related to Muziri. (iv) The concept of Thinai is presented in the Tamil grammar work of Pathupaattu.\", options:[\"(i) is correct\",\"(ii) is correct\",\"(ii) and (ii) are correct\",\"(iii) and (iv) are correct\"], correct:1 },\n                { q:\"Which statements about the Sangam age are correct? (i) Pathitrupathu speaks about the Pandya kings and their territory. (ii) The Akanaanuru describes the trading activities at Kaveripoompattinum. (iii) The Chola Emblem was the tiger and they issued square copper coins with images of a tiger. (iv) Neythal is a sandy desert region.\", options:[\"(i) is correct\",\"(ii) and (iii) are correct\",\"(iii) is correct\",\"(iv) is correct\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h4\",  unit:\"Unit 4\",  title:\"Intellectual Awakening and Socio-Political Changes\", month:\"August\",\n            questions:{\n              mcq:[\n                { q:\"Identify the founder of a new sect who exemplified simplicity and self-denial.\", options:[\"Buddha\",\"Lao-tze\",\"Confucius\",\"Zoroaster\"], correct:0 },\n                { q:\"The Magadha king influenced by the teachings of Mahavira\", options:[\"Dhananandha\",\"Chandragupta\",\"Bimbisara\",\"Shishunaga\"], correct:2 },\n                { q:\"The northern India extended from the Kabul Valley in the north to the Godavari in the south witnessed the rise of Sixteen States.\", options:[\"Mahajanapadas\",\"Gana-sanghas\",\"Dravida\",\"Dakshinapatha\"], correct:0 },\n                { q:\"Tri-ratnas are the three principles taught by\", options:[\"Buddha\",\"Mahavira\",\"Lao-tze\",\"Confucius\"], correct:1 },\n                { q:\"The account which throws light on Mauryan polity and society\", options:[\"Marco Polo\",\"Fahien\",\"Megasthanes\",\"Seleucus\"], correct:2 },\n                { q:\"Which statements are correct? (i) Under the Magadha king the mahamatriyas functioned as secretaries to the ministers. (ii) Accounts of Megasthanes titled Indica is a useful record about Mauryan polity and society. (iii) Nanda's attempt to build an imperial structure was cut short by Ashoka who founded the Mauryan kingdom. (iv) According to tradition, towards the end of his life Chandragupta become an ardent follower of Buddhism.\", options:[\"(i) is correct\",\"(ii) is correct\",\"(i) and (ii) are correct\",\"(iii) and (iv) are correct\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h5\",  unit:\"Unit 5\",  title:\"The Classical World\", month:\"August\",\n            questions:{\n              mcq:[\n                { q:\"__________ is the Greek city-state which resisted the Persians to the end.\", options:[\"Acropolis\",\"Sparta\",\"Athens\",\"Rome\"], correct:1 },\n                { q:\"The other name for Greeks was __________.\", options:[\"Hellenists\",\"Hellenes\",\"Phoenicians\",\"Spartans\"], correct:1 },\n                { q:\"The founder of Han dynasty was __________.\", options:[\"Wu Ti\",\"Hung Chao\",\"Liu Pang\",\"Mangu Khan\"], correct:2 },\n                { q:\"__________ was the Roman Governor responsible for the crucifixion of Jesus.\", options:[\"Innocent I\",\"Hildebrand\",\"Leo I\",\"Pontius Pilate\"], correct:3 },\n                { q:\"The Peloponnesian War was fought between __________ and __________.\", options:[\"Greeks and Persians\",\"Plebeians and Patricians\",\"Spartans and Athenians\",\"Greeks and Romans\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h6\",  unit:\"Unit 6\",  title:\"The Middle Ages\", month:\"October\",\n            questions:{\n              mcq:[\n                { q:\"__________ was the original religion of Japan.\", options:[\"Shinto\",\"Confucianism\",\"Taoism\",\"Animism\"], correct:0 },\n                { q:\"__________ means great name - lord.\", options:[\"Daimyo\",\"Shogun\",\"Fujiwara\",\"Tokugawa\"], correct:0 },\n                { q:\"The Arab General who conquered Spain was __________.\", options:[\"Tariq\",\"Alaric\",\"Saladin\",\"Mohammad the Conqueror\"], correct:0 },\n                { q:\"Harun-al-Rashid was the able emperor of __________.\", options:[\"Abbasid dynasty\",\"Umayyad dynasty\",\"Sassanid dynasty\",\"Mongol dynasty\"], correct:0 },\n                { q:\"Feudalism centred around __________.\", options:[\"vassalage\",\"slavery\",\"serfdom\",\"land\"], correct:3 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h7\",  unit:\"Unit 7\",  title:\"State and Society in Medieval India\", month:\"October\",\n            questions:{\n              mcq:[\n                { q:\"__________ was the second stronghold of Ala-ud-din Khalji's expanding Kingdom.\", options:[\"Dauladabad\",\"Delhi\",\"Madurai\",\"Bidar\"], correct:0 },\n                { q:\"The Deccan Sultanates were conquered by __________.\", options:[\"Ala-ud-din Khilji\",\"Ala-ud-din Bahman-shah\",\"Aurangzeb\",\"Malik Kafur\"], correct:3 },\n                { q:\"The establishment of __________ empire changed the administrative and institutional structures of South India.\", options:[\"Bahmani\",\"Vijayanagar\",\"Mughal\",\"Nayak\"], correct:1 },\n                { q:\"Krishnadeva Raya was a contemporary of __________.\", options:[\"Babur\",\"Humayun\",\"Akbar\",\"Shershah\"], correct:0 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h8\",  unit:\"Unit 8\",  title:\"The Beginning of the Modern Age\", month:\"November\",\n            questions:{\n              mcq:[\n                { q:\"Who among the following is known as the Father of Humanism?\", options:[\"Leonardo da Vinci\",\"Petrarch\",\"Erasmus\",\"Thomas More\"], correct:1 },\n                { q:\"The School of Athens was painted by\", options:[\"Raphael Sanzio\",\"Michelangelo\",\"Albrecht Durer\",\"Leonardo da Vinci\"], correct:0 },\n                { q:\"William Harvey discovered __________.\", options:[\"Heliocentric theory\",\"Geocentric theory\",\"Gravitational force\",\"Circulation of blood\"], correct:3 },\n                { q:\"Who wrote the 95 Theses?\", options:[\"Martin Luther\",\"Zwingli\",\"John Calvin\",\"Thomas More\"], correct:0 },\n                { q:\"Who wrote the book Institutes of Christian Religion?\", options:[\"Martin Luther\",\"Zwingli\",\"John Calvin\",\"Cervantes\"], correct:2 },\n                { q:\"Which sailor was the first to cross the Equator?\", options:[\"Henry, the Navigator\",\"Lopo Gonzalves\",\"Bartholomew Diaz\",\"Christopher Columbus\"], correct:1 },\n                { q:\"__________ named the sea as Pacific Ocean as it was very calm.\", options:[\"Columbus\",\"Amerigo Vespucci\",\"Ferdinand Magellan\",\"Vasco da Gama\"], correct:2 },\n                { q:\"The continent of America was named after __________.\", options:[\"Amerigo Vespucci\",\"Christopher Columbus\",\"Vasco da Gama\",\"Hernando Cortez\"], correct:0 },\n                { q:\"__________ was the headquarters of the Portuguese possession in the East.\", options:[\"Manila\",\"Bombay\",\"Pondicherry\",\"Goa\"], correct:3 },\n                { q:\"Which among the following plants were introduced from America to Europe?\", options:[\"Sugarcane\",\"Sweet Potato\",\"Rice\",\"Wheat\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h9\",  unit:\"Unit 9\",  title:\"The Age of Revolutions\", month:\"Nov–Dec\",\n            questions:{\n              mcq:[\n                { q:\"The first British colony in America was __________.\", options:[\"New York\",\"Philadelphia\",\"Jamestown\",\"Amsterdam\"], correct:2 },\n                { q:\"The pioneer of French Revolution who fought on the side of Washington against the British was __________.\", options:[\"Mirabeau\",\"Lafayette\",\"Napoleon\",\"Danton\"], correct:1 },\n                { q:\"Lafayette, Thomas Jefferson and Mirabeau wrote the __________.\", options:[\"Declaration of Independence\",\"Declaration of Pilnitz\",\"Declaration of Rights of Man and Citizen\",\"Human Rights Charter\"], correct:2 },\n                { q:\"The defeat of British at __________ paved the way for the friendship between France and America.\", options:[\"Trenton\",\"Saratoga\",\"Pennsylvania\",\"New York\"], correct:1 },\n                { q:\"__________ was the symbol of 'Royal Despotism' in France.\", options:[\"Versailles Palace\",\"Prison of Bastille\",\"Paris Commune\",\"Estates General\"], correct:1 },\n                { q:\"The forces of Austria and Prussia were defeated by the French Revolutionary forces at __________.\", options:[\"Verna\",\"Versailles\",\"Pilnitz\",\"Valmy\"], correct:3 },\n                { q:\"Candide was written by __________.\", options:[\"Voltaire\",\"Rousseau\",\"Montesquieu\",\"Danton\"], correct:0 },\n                { q:\"The moderate liberals who wanted to retain Louis XVI as a limited monarchy were called __________.\", options:[\"Girondins\",\"Jacobins\",\"Emigres\",\"Royalists\"], correct:0 },\n                { q:\"American War of Independence was ended with the Peace of Paris in the year __________.\", options:[\"1776\",\"1779\",\"1781\",\"1783\"], correct:3 },\n                { q:\"Thomas Paine's famous pamphlet was __________.\", options:[\"Common Sense\",\"Rights of Man\",\"Bill of Rights\",\"Abolition of Slavery\"], correct:0 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h10\", unit:\"Unit 10\", title:\"Industrial Revolution\", month:\"January\",\n            questions:{\n              mcq:[\n                { q:\"Who established the first steam boat service?\", options:[\"Arkwright\",\"Samuel Crompton\",\"Robert Fulton\",\"James Watt\"], correct:2 },\n                { q:\"Why was Manchester considered ideal for textile production?\", options:[\"availability of land\",\"rich human resources\",\"better living condition\",\"cool climate\"], correct:3 },\n                { q:\"Who invented the sewing machine?\", options:[\"Elias Howe\",\"Eli Whitney\",\"Samuel Crompton\",\"Humphrey Davy\"], correct:0 },\n                { q:\"Which family introduced steam engine in France?\", options:[\"de Wendel\",\"de Hindal\",\"de Arman\",\"de Renault\"], correct:0 },\n                { q:\"Who called Slater, the father of American Industrial Revolution?\", options:[\"F.D. Roosevelt\",\"Andrew Jackson\",\"Winston Churchill\",\"Woodrow Wilson\"], correct:1 },\n                { q:\"Which of the following is observed to commemorate the Hay Market Massacre?\", options:[\"Independence Day\",\"Farmers Day\",\"Labour Day\",\"Martyrs Day\"], correct:2 },\n                { q:\"Where was Zollverein Customs Union formed?\", options:[\"England\",\"Germany\",\"France\",\"America\"], correct:1 },\n                { q:\"Who produced the first batch of automobiles in France?\", options:[\"Louis Renault\",\"Armand Peugeot\",\"Thomas Alva Edison\",\"McAdam\"], correct:0 },\n                { q:\"What was the invention that removed seeds from cotton?\", options:[\"Rolling Mill\",\"Cotton Gin\",\"Spinning Mule\",\"Spinning Jenny\"], correct:1 },\n                { q:\"Which of the following was used as fuel in olden days to smelt iron?\", options:[\"Coke\",\"Charcoal\",\"Firewood\",\"Paper\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"h11\", unit:\"Unit 11\", title:\"Colonialism in Asia and Africa\", month:\"Jan–Feb\",\n            questions:{\n              mcq:[\n                { q:\"__________ was brought to the attention of the East India Company by Francis Light.\", options:[\"Spice islands\",\"Java island\",\"Penang island\",\"Malacca\"], correct:2 },\n                { q:\"In 1896 __________ states were formed into Federated Malay States.\", options:[\"Four\",\"Five\",\"Three\",\"Six\"], correct:0 },\n                { q:\"__________ was the only part of Indo-China which was directly under French Control.\", options:[\"Annam\",\"Tong king\",\"Cambodia\",\"Cochin-China\"], correct:3 },\n                { q:\"The Discovery of gold in the __________ led to a large number of British miners settled in and around Johannesburg.\", options:[\"Transvaal\",\"Orange Free State\",\"Cape Colony\",\"Rhodesia\"], correct:0 },\n                { q:\"__________ became the first European power to establish trade with India.\", options:[\"Portuguese\",\"French\",\"Danes\",\"Dutch\"], correct:0 },\n                { q:\"Indentured labour system was a form of __________.\", options:[\"contract labour system\",\"slavery\",\"debt bondage\",\"serfdom\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n        ]\n      },\n      \"Geography\": {\n        icon:\"🗺️\",\n        lessons: [\n          {\n            id:\"g1\", unit:\"Unit 1\", title:\"Lithosphere – I Endogenetic Processes\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"__________ is the rigid outer layer of the Earth.\", options:[\"Core\",\"Mantle\",\"Crust\",\"Inner core\"], correct:2 },\n                { q:\"__________ layer is made up of liquid iron.\", options:[\"Inner core\",\"Outer core\",\"Mantle\",\"Crust\"], correct:1 },\n                { q:\"Magma is found in the __________.\", options:[\"crust\",\"mantle\",\"core\",\"None of the above\"], correct:1 },\n                { q:\"The movement of tectonic plates is induced by __________ energy.\", options:[\"hydel\",\"thermal\",\"wave\",\"tidal\"], correct:1 },\n                { q:\"In the ancient period, Gondwanaland moved towards __________ direction.\", options:[\"north\",\"south\",\"east\",\"west\"], correct:0 },\n                { q:\"Many million years ago, India was a part of the super continent __________.\", options:[\"Gondwana\",\"Laurasia\",\"Panthalasa\",\"Pangea\"], correct:0 },\n                { q:\"The movement of plates that creates stress and tension in the rocks causing them to stretch and cracks result in __________.\", options:[\"fold\",\"fault\",\"mountain\",\"earthquake\"], correct:1 },\n                { q:\"__________ refers to a bowl-shaped depression found at the top of the volcano.\", options:[\"crater\",\"vent\",\"chamber\",\"volcanic cone\"], correct:0 },\n                { q:\"The point of origin of an Earthquake is called the __________.\", options:[\"epicentre\",\"focus\",\"seismic wave\",\"magnitude\"], correct:1 },\n                { q:\"Consider: i. Mt. Fujiyama is a dormant volcano  ii. Mt. Kilimanjaro is a dormant volcano  iii. Mt. Tanzania is a dormant volcano. Which of the statement(s) is/are true?\", options:[\"i is true\",\"ii is true\",\"iii is true\",\"I, ii, iii are true\"], correct:0 },\n                { q:\"Statement: Magma gushes out when it finds vents. Reason: Interior of the Earth contains compressed hot magma. Which of the statement(s) is/are true?\", options:[\"Statements & reason are true\",\"Statement is true, reason is false\",\"Statement is false, reason is true\",\"Statement & reason are false\"], correct:0 },\n                { q:\"Statement I: Mountain ranges are formed by the collision of tectonic plates. Statement II: The movement of tectonic plates is due to the thermal energy from the mantle.\", options:[\"Statement I is false, II is true\",\"Statement I and II are false\",\"Statement I is true, II is false\",\"Statement I and II are true\"], correct:3 },\n              ],\n              fill:[],\n              truefalse:[],\n              match:[\n                {\n                  left:[\"Endogenetic process\",\"Mantle\",\"Convergent boundaries\",\"Earthquake\",\"Composite volcano\"],\n                  right:[\"Seismograph\",\"Subduction Zone\",\"Volcanic\",\"Pacific Ocean\",\"SIMA\"],\n                  correct:[2,4,1,0,3]\n                }\n              ],\n              brief:[\n                { q:\"Write a brief note on the various spheres of the Earth.\", answer:\"The lithosphere is the solid outer part of the Earth.\\nThe atmosphere is a thin layer of gases.\\nThe hydrosphere is the watery part of the Earth's surface.\\nThe biosphere is the layer of Earth where life exists.\" },\n                { q:\"Mention the layers of the interior of the Earth.\", answer:\"The structure of the Earth's interior is divided into three layers namely the crust, the mantle and the core.\" },\n                { q:\"Define plate tectonics.\", answer:\"Collisions of these plates produce mountain ranges and other irregular surface features, both on land and the ocean floor. This phenomenon is called plate tectonics.\" },\n                { q:\"What is Tsunami?\", answer:\"The word Tsunami is a Japanese term, meaning harbour waves. It is adopted to describe large seismically generated sea waves caused by Earthquakes, submarine explosions and landslides.\" },\n                { q:\"What is a Volcano? Mention its major components.\", answer:\"A volcano is a vent or an opening on the surface of the Earth crust, through which hot solid, liquid and gaseous materials erupt.\\n\\nVolcanoes have the following major components: Magma chamber, Vents and Volcanic cone.\" },\n                { q:\"What is an Earthquake and how does it occur?\", answer:\"Earthquakes are generally caused by the sudden vibrations in the Earth's crust, which spreads outward in all directions as waves from the source of disturbance.\" },\n                { q:\"What are seismic waves and mention its types?\", answer:\"Earthquakes generate seismic waves. The nature, force and speed of these seismic waves depend on the nature of the medium through which it passes.\\n\\nThere are three types of seismic waves:\\n1. Primary or P-waves\\n2. Secondary or S-waves\\n3. Surface Waves (or) L-waves\" },\n                { q:\"Write about the Pacific Ring of Fire.\", answer:\"One such area is the Circum-Pacific Ring of Fire, where the Pacific Plate meets many surrounding plates. This is the area where most of the world's earthquakes and volcanic eruptions occur along the plate boundaries.\" },\n              ],\n              truefalse:[],\n              reasons:[\n                { q:\"Igneous rocks are also called Primary Rocks or Mother rocks.\", answer:\"Igneous rocks are also called Primary or Mother rocks because all other rocks are directly or indirectly formed from them.\" },\n              ],\n              distinguish:[\n                { termA:\"Core\", termB:\"Crust\", answerA:\"The core is the innermost and hottest layer of the Earth which lies below the mantle.\", answerB:\"Crust is the outer layer of the Earth, where we live. It is the skin of our Earth, which ranges from 5 to 30 km. It is the solid and rigid layer of the Earth.\" },\n                { termA:\"Epicentre\", termB:\"Hypocentre (Focus)\", answerA:\"Epicentre is a point on the Earth's surface that lies directly above the focus. The impact of the Earthquake is felt the most at the epicentre.\", answerB:\"Hypocentre (Focus) is the point inside the Earth where the earthquake originates. It generates a series of elastic waves.\" },\n                { termA:\"Convergent Boundary\", termB:\"Divergent Boundary\", answerA:\"Here the plates move toward each other and sometimes, a plate sinks under another. This process is called subduction.\", answerB:\"Here the plates pull away from each other as magma pushes up from the mantle, creating new crust.\" },\n                { termA:\"Primary waves (P-waves)\", termB:\"Secondary waves (S-waves)\", answerA:\"Primary or P-waves are the fastest of all the Earthquake waves and the first to reach the epicentre. They travel through solids, liquids and gases.\", answerB:\"Secondary or S-waves travel only through solids. These transverse waves shake the ground perpendicular to the direction of travel. They are slower than P-waves.\" },\n                { termA:\"Shield Volcano\", termB:\"Volcanic Dome\", answerA:\"Shield volcanoes are formed by intense viscous lava. These are shallow depositions with gently sloping sides.\", answerB:\"A lava dome or volcanic dome is roughly a circular mound formed due to the slow ejection of viscous lava from a volcano.\" },\n              ],\n              paragraph:[\n                { q:\"Describe the structure of the Earth.\", answer:\"The structure of the Earth's interior is divided into three layers namely the crust, the mantle and the core.\\n\\nCrust:\\nCrust is the outer layer of the Earth, where we live. It is the skin of our Earth, which ranges from 5 to 30 km. It is the solid and rigid layer of the Earth.\\n\\nMantle:\\nThe interior part beneath the crust is called mantle, which is about 2,900 km thick.\\n\\nCore:\\nThe core is the innermost and hottest layer of the Earth which lies below the mantle.\" },\n                { q:\"Write a note on the internal and external processes of Earth.\", answer:\"The forces that act from the Earth's interior towards the Earth's surface are called Internal processes. They are caused by the heat energy from the interior of the Earth. They are responsible for building up the relief of the Earth's surface through folding, faulting and volcanic activity.\\n\\nThe forces that act on the surface of the Earth due to natural agents like running water, glacier, wind, waves, etc., are called External processes. They wear down (denude) the surface features built up by internal processes. The wearing down and rebuilding of the Earth's surface is known as gradation.\" },\n                { q:\"How are volcanoes classified based on the periodicity of their eruptions?\", answer:\"Based on the periodicity of eruptions, volcanoes are classified into:\\n\\n(i) Active volcano: Active volcanoes are those which constantly eject volcanic lava, gases and fragmented materials.\\n\\n(ii) Dormant volcano: Volcanoes that do not show any sign of volcanic activity for a long period of time are known as dormant volcanoes.\\n\\n(iii) Extinct volcano: When a volcano permanently stops its volcanic activity, then it is called an extinct volcano.\" },\n                { q:\"Explain the effects of Volcanoes.\", answer:\"Positive effects:\\nVolcanic materials enrich the soil fertility that promotes agricultural activities. The hot volcanic region helps in generating geothermal energy.\\n\\nNegative effects:\\nVolcanic eruption causes Earthquakes, flash floods, mud slide and rock fall. Lava can travel very far and burn, bury, or damage anything in its path.\" },\n              ]\n            }\n          },\n          { id:\"g2\", unit:\"Unit 2\", title:\"Lithosphere – II Exogenetic Processes\", month:\"July\",\n            questions:{\n              mcq:[\n                { q:\"The disintegration or decomposition of rocks is generally called as __________.\", options:[\"weathering\",\"erosion\",\"transportation\",\"deposition\"], correct:0 },\n                { q:\"The process of the levelling up of land by means of natural agents.\", options:[\"aggradation\",\"degradation\",\"gradation\",\"none\"], correct:2 },\n                { q:\"__________ is seen in the lower course of the river.\", options:[\"Rapids\",\"Alluvial fan\",\"Delta\",\"Gorges\"], correct:2 },\n                { q:\"Karst topography is formed due to the action of __________.\", options:[\"Glacier\",\"Wind\",\"Sea waves\",\"Ground water\"], correct:3 },\n                { q:\"Which one of the following is not a depositional feature of a glacier?\", options:[\"cirque\",\"Moraines\",\"Drumlins\",\"Eskers\"], correct:0 },\n                { q:\"Deposits of fine silt blown by wind is called as __________.\", options:[\"Loess\",\"Barchans\",\"Hamada\",\"Ripples\"], correct:0 },\n                { q:\"Stacks are formed by __________.\", options:[\"Wave erosion\",\"River erosion\",\"Glacial erosion\",\"Wind deposition\"], correct:0 },\n                { q:\"__________ erosion is responsible for the formation of cirque.\", options:[\"wind\",\"glacier\",\"river\",\"underground water\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"g3\", unit:\"Unit 3\", title:\"Atmosphere\", month:\"July\",\n            questions:{\n              mcq:[\n                { q:\"__________ is the most important gas for the survival of living organisms.\", options:[\"Helium\",\"carbon dioxide\",\"oxygen\",\"methane\"], correct:2 },\n                { q:\"The lowest layer of the atmosphere is __________.\", options:[\"Troposphere\",\"Stratosphere\",\"Exosphere\",\"Mesosphere\"], correct:0 },\n                { q:\"__________ reflects radio waves.\", options:[\"Exosphere\",\"Ionosphere\",\"Mesosphere\",\"Stratosphere\"], correct:1 },\n                { q:\"The process of change of state of water from gaseous to liquid state is called __________.\", options:[\"Precipitation\",\"evaporation\",\"transpiration\",\"condensation\"], correct:3 },\n                { q:\"The __________ is the chief energy source of the Earth.\", options:[\"Sun\",\"Moon\",\"Stars\",\"Clouds\"], correct:0 },\n                { q:\"All types of clouds are found in the __________.\", options:[\"Troposphere\",\"Ionosphere\",\"Mesosphere\",\"Exosphere\"], correct:0 },\n                { q:\"__________ clouds are called 'Sheep clouds'.\", options:[\"Alto-cumulus\",\"Alto-Stratus\",\"Nimbo-stratus\",\"Cirro-stratus\"], correct:0 },\n                { q:\"The Monsoons are __________.\", options:[\"prevailing winds\",\"periodic winds\",\"local winds\",\"none of the above\"], correct:1 },\n                { q:\"Dew in the form of ice crystals is called __________.\", options:[\"frost\",\"fog\",\"mist\",\"sleet\"], correct:0 },\n                { q:\"__________ is called the eye of the storm/cyclone.\", options:[\"Pressure\",\"wind\",\"cyclones\",\"snow\"], correct:0 },\n                { q:\"The vertical movement of air is called __________.\", options:[\"Wind\",\"storm\",\"Air current\",\"drift\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"g4\", unit:\"Unit 4\", title:\"Hydrosphere\", month:\"August\",\n            questions:{\n              mcq:[\n                { q:\"The temperature of the ocean waters generally __________ at greater depth.\", options:[\"increases\",\"decreases\",\"remains constant\",\"none of the above\"], correct:1 },\n                { q:\"Ocean currents are produced due to __________.\", options:[\"rotation of earth\",\"variation in temperature\",\"earth's movement\",\"all the above\"], correct:3 },\n                { q:\"Which of the following indicates the correct sequence of the topography beneath the surface of the sea?\", options:[\"Continental shelf-Continental slope-Sea plain-Sea trench\",\"Continental slope-Continental shelf-Sea plain-Sea trench\",\"Sea plain-Continental slope-Continental shelf-Sea trench\",\"Continental slope-Sea plain-Continental shelf-Sea trench\"], correct:0 },\n                { q:\"The oceanic ridge comes into existence due to __________.\", options:[\"convergence of tectonic plates\",\"divergence of tectonic plates\",\"lateral movements of plates\",\"stearing of plates\"], correct:1 },\n                { q:\"Which of the following is NOT correctly matched?\", options:[\"Gulf Stream - Pacific Ocean\",\"Labrador current - North Atlantic Ocean\",\"Canary current - Mediterranean Sea\",\"Mozambique current - Indian Ocean\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"g5\", unit:\"Unit 5\", title:\"Biosphere\", month:\"August\",\n            questions:{\n              mcq:[\n                { q:\"The coldest biome on Earth is __________.\", options:[\"Tundra\",\"Taiga\",\"Desert\",\"Oceans\"], correct:0 },\n                { q:\"This is the smallest unit of biosphere.\", options:[\"Ecosystems\",\"Biome\",\"Environment\",\"None of the above\"], correct:0 },\n                { q:\"Nutrients are recycled in the atmosphere with the help of certain micro organisms, referred to as __________.\", options:[\"Producers\",\"Decomposers\",\"Consumers\",\"None of the above\"], correct:1 },\n                { q:\"To which climatic conditions are Xerophytic plants specifically adapted to?\", options:[\"Saline and sandy\",\"Limited moisture availability\",\"Cold temperature\",\"Humid\"], correct:1 },\n                { q:\"Why is the usage of rainforest biomes for large scale agriculture unsustainable?\", options:[\"because it is too wet\",\"because the temperature is too warm\",\"because the soil is too thin\",\"because the soil is poor\"], correct:3 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"g6\", unit:\"Unit 6\", title:\"Man and Environment\", month:\"October\",\n            questions:{\n              mcq:[\n                { q:\"All external influences and factors that affect the growth and development of living organisms is __________.\", options:[\"Environment\",\"Ecosystem\",\"Biotic factors\",\"Abiotic factors\"], correct:0 },\n                { q:\"The 'World Population Day' is observed on __________ every year.\", options:[\"August 11th\",\"September 11th\",\"July 11th\",\"January 11th\"], correct:2 },\n                { q:\"The statistical study of human population is __________.\", options:[\"Demography\",\"Morphology\",\"Etymology\",\"Seismography\"], correct:0 },\n                { q:\"The extraction of valuable minerals and other geological minerals from the mines, is __________.\", options:[\"Fishing\",\"Lumbering\",\"Mining\",\"Agriculture\"], correct:2 },\n                { q:\"The Secondary sector of the economy produces __________ from raw materials.\", options:[\"Semi finished goods\",\"Finished goods\",\"Economic goods\",\"raw materials\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"g7\", unit:\"Unit 7\", title:\"Mapping Skills\", month:\"November\",\n            questions:{\n              mcq:[\n                { q:\"__________ indicates the purpose or theme of the map.\", options:[\"Title\",\"Scale\",\"Direction\",\"Legend\"], correct:0 },\n                { q:\"Standard symbols that are used in maps to convey a definite meaning are called __________.\", options:[\"conventional signs and symbols\",\"coordinates\",\"grid references\",\"directions\"], correct:0 },\n                { q:\"GPS consists of a constellation of __________ satellites.\", options:[\"7\",\"24\",\"32\",\"64\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"g8\", unit:\"Unit 8\", title:\"Disaster Management: Responding to Disasters\", month:\"January\",\n            questions:{\n              mcq:[\n                { q:\"One among the following is NOT the first responder in case of a disaster.\", options:[\"police officers\",\"firefighters\",\"insurance agents\",\"emergency medical technicians\"], correct:2 },\n                { q:\"'Drop, Cover, Hold' is a mock drill for __________.\", options:[\"Fire\",\"Earthquake\",\"Tsunami\",\"Riot\"], correct:1 },\n                { q:\"When you happen to see a fire break out, you will make a call to __________.\", options:[\"114\",\"112\",\"115\",\"118\"], correct:1 },\n                { q:\"Which of the following statements is untrue?\", options:[\"'Stop, Drop, Roll' is for fire\",\"'Drop, Cover, Hold' is for an earthquake\",\"'If sea water recedes back, run to higher places' is for flood\",\"'If gunshots are heard, drop to the ground and cover the head with hand' is for riot\"], correct:2 },\n                { q:\"Which of the following statements belongs to responding to earthquake?\", options:[\"Avoid any place where police or security forces action is in progress\",\"Know the height of your street above sea level\",\"Stay away from glass, windows, outside doors and walls and anything that could fall\",\"Before opening a door, feel it with the back of your hand\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n        ]\n      },\n      \"Civics\": {\n        icon:\"🏛️\",\n        lessons: [\n          {\n            id:\"c1\", unit:\"Unit 1\", title:\"Forms of Government and Democracy\", month:\"June\",\n            questions:{\n              mcq:[\n                {\n                  q:\"A system of government in which one person reigns supreme, usually a king or queen, is called ________.\",\n                  options:[\"Autocracy\",\"Monarchy\",\"Democracy\",\"Republic\"],\n                  correct:1\n                },\n                {\n                  q:\"A system of government with absolute power.\",\n                  options:[\"Aristocracy\",\"Theocracy\",\"Democracy\",\"Autocracy\"],\n                  correct:3\n                },\n                {\n                  q:\"Former Soviet Union is an example for ________.\",\n                  options:[\"Aristocracy\",\"Theocracy\",\"Oligarchy\",\"Republic\"],\n                  correct:2\n                },\n                {\n                  q:\"Select the odd one.\",\n                  options:[\"India\",\"USA\",\"France\",\"Vatican\"],\n                  correct:3\n                },\n                {\n                  q:\"Abraham Lincoln was the President of the ________.\",\n                  options:[\"USA\",\"UK\",\"USSR\",\"India\"],\n                  correct:0\n                },\n                {\n                  q:\"Kudavolai system was followed by\",\n                  options:[\"Cheras\",\"Pandyas\",\"Cholas\",\"Kalabhras\"],\n                  correct:2\n                },\n                {\n                  q:\"Direct Democracy in olden times existed\",\n                  options:[\"In the republics of ancient India\",\"Among the USA\",\"In the city-state of ancient Greece\",\"Among the UK\"],\n                  correct:2\n                },\n                {\n                  q:\"From which language was the term \\\"Democracy\\\" derived?\",\n                  options:[\"Greek\",\"Latin\",\"Persian\",\"Arabic\"],\n                  correct:0\n                },\n                {\n                  q:\"In democracy the final authority rests with\",\n                  options:[\"The Parliament\",\"The People\",\"The council of Ministers\",\"The President\"],\n                  correct:1\n                },\n                {\n                  q:\"Which one of the country has Presidential form of government?\",\n                  options:[\"India\",\"Britain\",\"Canada\",\"USA\"],\n                  correct:3\n                },\n                {\n                  q:\"The largest democratic country in the world is\",\n                  options:[\"Canada\",\"India\",\"USA\",\"China\"],\n                  correct:1\n                },\n                {\n                  q:\"Assertion (A): Direct democracy is practised in Switzerland.\\nReason (R): People directly participates in decision making.\",\n                  options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"],\n                  correct:0\n                },\n                {\n                  q:\"Assertion (A): India has parliamentary form of democracy.\\nReason (R): Indian parliament comprises two houses.\",\n                  options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"],\n                  correct:0\n                },\n                {\n                  q:\"The meaning of Franchise is\",\n                  options:[\"Right to elect\",\"Right to vote for the poor\",\"Right to vote\",\"Right to vote for the rich\"],\n                  correct:2\n                },\n                {\n                  q:\"The grant of universal franchise creates\",\n                  options:[\"Social equality\",\"Economic equality\",\"Political equality\",\"Legal equality\"],\n                  correct:2\n                },\n                {\n                  q:\"Prime Minister of India is appointed by\",\n                  options:[\"Lok Sabha\",\"Rajya Sabha\",\"Speaker\",\"President\"],\n                  correct:3\n                },\n                {\n                  q:\"The President of India can nominate\",\n                  options:[\"12 members to Lok Sabha\",\"2 members of Rajya Sabha\",\"12 members to Rajya Sabha\",\"14 members to Rajya Sabha\"],\n                  correct:2\n                },\n                {\n                  q:\"The First general elections after independence in India were held in\",\n                  options:[\"1948-49\",\"1951-52\",\"1957-58\",\"1947-48\"],\n                  correct:1\n                },\n              ],\n              fill:[\n                { sentence:\"The Constitution of India was finally adopted on ___.\", answers:[\"26 November 1949\"] },\n                { sentence:\"The two types of democracy are ___ and ___.\", answers:[\"Direct\",\"Indirect\"] },\n                { sentence:\"An example for direct democracy is ___.\", answers:[\"Ancient Greek city-states\"] },\n                { sentence:\"India has a ___ form of democracy.\", answers:[\"Parliamentary\"] },\n                { sentence:\"___ was the first Prime Minister of independent India.\", answers:[\"Jawaharlal Nehru\"] },\n                { sentence:\"The first general elections were held in British India in the year ___.\", answers:[\"1920\"] },\n                { sentence:\"The Parliament House in India was designed by ___ and ___.\", answers:[\"Edwin Lutyens\",\"Herbert Baker\"] },\n              ],\n              match:[\n                {\n                  q:\"Match the terms with their definitions\",\n                  left:[\"Autocracy\",\"Right to vote\",\"Chanakya\",\"Theocracy\"],\n                  right:[\"18\",\"Arthashastra\",\"Vatican\",\"North Korea\"],\n                  correct:[3,0,1,2]\n                }\n              ],\n              brief:[\n                {\n                  q:\"Give Abraham Lincoln's definition for democracy.\",\n                  answer:\"Abraham Lincoln, one of the Presidents of USA, defines democracy as a government of the people, by the people and for the people.\",\n                },\n                {\n                  q:\"Mention the forms of democracy.\",\n                  answer:\"Forms of Democratic government\\n\\n1. Parliamentary form of government\\n2. Presidential form of government\",\n                },\n              ],\n              truefalse:[], reasons:[],\n              distinguish:[\n                {\n                  q:\"Distinguish between Direct Democracy and Indirect Democracy.\",\n                  termA:\"Direct Democracy\",\n                  answerA:\"When the people themselves directly express their will on public affairs, the type of government is called pure or direct democracy.\",\n                  termB:\"Indirect Democracy\",\n                  answerB:\"When the people express their will on public affairs through their elected representatives, the type of government is called indirect or representative democracy.\"\n                }\n              ],\n              paragraph:[\n                {\n                  q:\"What are the challenges to Indian democracy? Explain.\",\n                  answer:\"The challenges to Indian democracy are:\\n\\n1. Illiteracy\\n2. Poverty\\n3. Gender discrimination\\n4. Regionalism\\n5. Casteism, communalism and religious fundamentalism\\n6. Corruption\\n7. Criminalisation of politics\\n8. Political violence\"\n                },\n                {\n                  q:\"Explain the conditions necessary for the success of democracy in India.\",\n                  answer:\"The following conditions are necessary for the success of democracy in India:\\n\\n1. Empowerment of the poor and illiterates to enjoy the goodness of democracy.\\n2. An impartial and efficient press to form public opinion.\\n3. Presence of strong public opinion.\\n4. Feeling of tolerance and communal harmony among the people.\\n5. Powerful and responsible opposition.\"\n                }\n              ]\n            }\n          },\n          { id:\"c2\", unit:\"Unit 2\", title:\"Election, Political Parties and Pressure Groups\", month:\"July\",\n            questions:{\n              mcq:[\n                { q:\"India has adapted the electoral system followed in the __________.\", options:[\"USA\",\"United Kingdom\",\"Canada\",\"Russia\"], correct:1 },\n                { q:\"The Election Commission of India is a/an __________.\", options:[\"Independent body\",\"Statutory body\",\"Private body\",\"Public corporation\"], correct:0 },\n                { q:\"Which Article of the Constitution provides for an Election Commission?\", options:[\"Article 280\",\"Article 315\",\"Article 324\",\"Article 325\"], correct:2 },\n                { q:\"Which part of the constitution of India says about the election commission?\", options:[\"Part III\",\"Part XV\",\"Part XX\",\"Part XXII\"], correct:1 },\n                { q:\"Who accords recognition to various political parties as national or regional parties?\", options:[\"The President\",\"The Election Commission\",\"The Parliament\",\"The President in consultation with the Election Commission\"], correct:1 },\n                { q:\"Assertion (A): Indian Constitution provides for an independent Election Commission. Reason (R): To ensure free and fair elections in the country.\", options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"], correct:0 },\n                { q:\"NOTA was introduced in the year __________.\", options:[\"2012\",\"2013\",\"2014\",\"2015\"], correct:1 },\n                { q:\"The term pressure groups originated in __________.\", options:[\"USA\",\"UK\",\"USSR\",\"India\"], correct:0 },\n                { q:\"Assertion (A): A large number of pressure groups exist in India. Reason (R): Pressure Groups are not developed in India to the same extent as in the USA.\", options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"c3\", unit:\"Unit 3\", title:\"Human Rights\", month:\"Aug–Sep\",\n            questions:{\n              mcq:[\n                { q:\"According to the UNO a child is a person who has not completed the age of __________ years.\", options:[\"12\",\"14\",\"16\",\"18\"], correct:3 },\n                { q:\"Kailash Satyarthi and Malala have been awarded Nobel Prize for __________.\", options:[\"Literature\",\"Peace\",\"Physics\",\"Economics\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"c4\", unit:\"Unit 4\", title:\"Forms of Government\", month:\"October\",\n            questions:{ mcq:[], fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[] }\n          },\n          { id:\"c5\", unit:\"Unit 5\", title:\"Local Self Government\", month:\"November\",\n            questions:{\n              mcq:[\n                { q:\"Which committee was appointed by the planning commission in 1985?\", options:[\"Balwant Rai Mehta\",\"Ashok Mehta\",\"G V K Rao\",\"L M Singhvi\"], correct:2 },\n                { q:\"The Uthiramerur stone inscription shows evidences of prevalent local self government during the __________ period in Tamil Nadu.\", options:[\"Chola\",\"Chera\",\"Pandiya\",\"Pallava\"], correct:0 },\n                { q:\"The 73rd and 74th constitutional Amendment Acts, was enacted during the year __________.\", options:[\"1992\",\"1995\",\"1997\",\"1990\"], correct:0 },\n                { q:\"__________ act as the inspector of Village Panchayat.\", options:[\"Commissioner\",\"District Collector\",\"Councillors\",\"Mayor\"], correct:1 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"c6\", unit:\"Unit 6\", title:\"Road safety\", month:\"January\",\n            questions:{ mcq:[], fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[] }\n          },\n        ]\n      },\n      \"Economics\": {\n        icon:\"💹\",\n        lessons: [\n          { id:\"e1\", unit:\"Unit 1\", title:\"Understanding Development: Perspectives, Measurement and Sustainability\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"Assertion (A): Development increases the quality of life. Reason (R): People will have higher incomes, better education, better health and nutrition, less poverty.\", options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"], correct:0 },\n                { q:\"The term 'Human resources' refers to __________.\", options:[\"investment on poor people\",\"expenditure on agriculture\",\"investment on assets\",\"collective abilities of people\"], correct:3 },\n                { q:\"For comparing development between countries, their __________ is considered to be one of the most important attributes.\", options:[\"growth\",\"income\",\"expenditure\",\"savings\"], correct:1 },\n                { q:\"__________ is considered a true measure of national income.\", options:[\"GNP\",\"GDP\",\"NNP\",\"NDP\"], correct:2 },\n                { q:\"The __________ income is also called per capita income.\", options:[\"average\",\"total\",\"people\",\"monthly\"], correct:0 },\n                { q:\"Which one of the following country is not a G-8 country?\", options:[\"Japan\",\"Canada\",\"Russia\",\"India\"], correct:3 },\n                { q:\"Which one of the following country is not a member of SAARC?\", options:[\"India\",\"Pakistan\",\"China\",\"Bhutan\"], correct:2 },\n                { q:\"Assertion (A): The Net National Product (NNP) is considered as a true measure of national output. Reason (R): It is also known as national income.\", options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"], correct:0 },\n                { q:\"Assertion (A): Human resource is necessary for the progress of any country. Reason (R): Investment in education and health of people can result in a high rate of returns in the future for a country.\", options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"], correct:0 },\n                { q:\"The Human Development Index (HDI) does not take into account the following dimension in its calculation.\", options:[\"Gender\",\"Health\",\"Education\",\"Income\"], correct:0 },\n                { q:\"Among the following states which state has the literacy rate (2011) higher than national average?\", options:[\"Andhra Pradesh\",\"Uttar Pradesh\",\"Tamil Nadu\",\"None of these\"], correct:2 },\n                { q:\"Sex-ratio means __________.\", options:[\"the ratio between adult-male and adult-female in a population\",\"the ratio between female and male in a population\",\"the relationship between male of female\",\"the number of females per thousand males\"], correct:3 },\n                { q:\"Inter-generational equality is ensured under the process of __________.\", options:[\"Industrial progress\",\"Economic development\",\"Sustainable development\",\"Economic growth\"], correct:2 },\n                { q:\"Find the odd one.\", options:[\"Solar energy\",\"Wind energy\",\"Paper\",\"Natural gas\"], correct:2 },\n                { q:\"__________ is the state with highest installed solar capacity in India.\", options:[\"Tamil Nadu\",\"West Bengal\",\"Kerala\",\"Andhra Pradesh\"], correct:0 },\n                { q:\"__________ resources are those which will get exhausted after years of use.\", options:[\"Natural\",\"Renewable\",\"Non-Renewable\",\"New\"], correct:2 },\n                { q:\"Thermal plant emits large quantity of __________, which pollutes the environment.\", options:[\"Oxygen\",\"Nitrogen\",\"Carbon\",\"Carbon dioxide\"], correct:3 },\n              ],\n              fill:[\n                { sentence:\"Economic progress of any country is known as ___.\", answers:[\"Economic development\"] },\n                { sentence:\"The head quarters of HRD Ministry is in ___.\", answers:[\"New Delhi\"] },\n                { sentence:\"The state having the highest literacy rate in India is ___.\", answers:[\"Kerala\"] },\n                { sentence:\"Human Development Report of the world is prepared and released by ___.\", answers:[\"UNDP\"] },\n                { sentence:\"Groundwater is an example of ___ resource.\", answers:[\"Renewable\"] },\n                { sentence:\"The book An Uncertain Glory was written by ___.\", answers:[\"Amartya Sen\",\"Prof. Amartya Sen\"] },\n              ],\n              match:[\n                {\n                  q:\"Match the terms with their descriptions\",\n                  left:[\"Development\",\"Human resource\",\"Solar energy\",\"1972\"],\n                  right:[\"Wild life Protection Act\",\"Renewable resources\",\"Part of daily life\",\"Education\"],\n                  correct:[2,3,1,0]\n                }\n              ],\n              brief:[\n                { q:\"What do you mean by development?\", answer:\"The word 'development' is used widely. It refers to the progress of a particular field or a particular person. Similarly, the economic progress of a country is known as 'economic development'.\" },\n                { q:\"What are the indicators of development?\", answer:\"The major indicators to measure the level of economic development are Net National Product (NNP), Per Capita Income (PCI), Purchasing Power Parity (PPP) and Human Development Index (HDI).\" },\n                { q:\"Why is NNP not considered a useful measure to compare a country's development with other countries?\", answer:\"The Net National Product (NNP) is considered as a true measure of national output.\\n\\nFor measuring a country's development, its income is considered to be one of the most important factors.\" },\n                { q:\"Why is human resource considered the foremost resource of any country?\", answer:\"Human resource development means the development of a person's physical and mental abilities through education, health care and training.\" },\n                { q:\"Expand the following: PPP, HDI\", answer:\"PPP: Purchasing Power Parity\\nHDI: Human Development Index\" },\n                { q:\"Expand the following: NNP, PCI\", answer:\"NNP: Net National Product\\nPCI: Per Capita Income\" },\n                { q:\"What is 'Solar Power'?\", answer:\"Solar power is the conversion of energy from sunlight into electricity either directly using photovoltaic cells or indirectly using concentrated solar power.\" },\n              ],\n              truefalse:[], reasons:[],\n              distinguish:[\n                {\n                  termA:\"Renewable Resources\", termB:\"Non-renewable Resources\",\n                  answerA:\"Renewable resources are pollution free and environment friendly.\\n\\nThese resources take a short time for renewal.\\n\\nExample: Solar energy, wind energy, water, wood, paper.\",\n                  answerB:\"Non-renewable resources pollute and damage the environment.\\n\\nMillions of years are needed for the formation of these resources.\\n\\nExample: Metals, glass, fossil fuels (coal, petroleum, natural gas, diesel).\"\n                }\n              ],\n              paragraph:[\n                { q:\"Discuss the policies for sustainable development.\", answer:\"To achieve real sustainability, we need to balance economic, social and environmental sustainability in equal harmony.\\n\\nIndia depends on thermal and hydro power plants to meet its power needs. Both these sources have an adverse environmental impact.\\n\\nThermal power plants emit large quantities of carbon dioxide, which pollute the environment.\" },\n                { q:\"Describe in detail the environmental policies in India.\", answer:\"Environmental policies in India have evolved considerably over the past three decades. These policies have covered a wide range of issues such as air, water pollution, waste management and biodiversity conservation.\\n\\nThe Supreme Court of India has interpreted and introduced new changes in environmental protection through a series of directions and judgements.\" },\n                { q:\"Mention any five environmental acts and their action.\", answer:\"1. National Green Tribunal Act, 2010 — Environmental protection and conservation of forests and other natural resources.\\n2. Biological Diversity Act, 2002 — Conservation of biological diversity.\\n3. The Environment (Protection) Act, 1986 — Providing for the protection and improvement of the environment.\\n4. Forest (Conservation) Act, 1980 — Check deforestation and encourage afforestation of non-forest areas.\\n5. Wildlife Protection Act, 1972 — Providing protection to wild animals and birds.\" },\n              ]\n            }\n          },\n          { id:\"e2\", unit:\"Unit 2\", title:\"Employment in India and Tamil Nadu\", month:\"July\",\n            questions:{\n              mcq:[\n                { q:\"We take age group __________ years for computation of the workforce.\", options:[\"12–60\",\"15–60\",\"21–65\",\"5–14\"], correct:1 },\n                { q:\"Which is the correct sequence of various sectors in GDP of India in the descending order?\", options:[\"Primary sector, Secondary sector, Tertiary sector\",\"Primary sector, Tertiary sector, Secondary sector\",\"Tertiary sector, Secondary sector, Primary sector\",\"Secondary sector, Tertiary sector, Primary sector\"], correct:2 },\n                { q:\"Which one of the following sectors is the largest employer in India?\", options:[\"Primary Sector\",\"Secondary Sector\",\"Tertiary Sector\",\"Public sector\"], correct:0 },\n                { q:\"Which one of the following is not in Primary Sector?\", options:[\"Agriculture\",\"Manufacturing\",\"Mining\",\"Fishery\"], correct:1 },\n                { q:\"Which one of the following is not in the Secondary Sector?\", options:[\"Construction\",\"Manufacturing\",\"Small Scale Industry\",\"Forestry\"], correct:3 },\n                { q:\"Tertiary Sector include/s __________.\", options:[\"Transport\",\"Insurance\",\"Banking\",\"All of these\"], correct:3 },\n                { q:\"Which sector is not included in the occupational pattern?\", options:[\"Primary sector\",\"Secondary sector\",\"Tertiary sector\",\"Private sector\"], correct:3 },\n                { q:\"Which Delhi Sultan of medieval India formed 'Employment Bureau' to solve the unemployment problem?\", options:[\"Muhamad Bin Tugluq\",\"Allauddin Khilji\",\"Feroz Shah Tugluq\",\"Balban\"], correct:0 },\n                { q:\"__________ sector is registered and follows government rules.\", options:[\"Agriculture\",\"Organised\",\"Unorganised\",\"Private\"], correct:1 },\n                { q:\"__________ sector provides job security and higher wages.\", options:[\"Public sector\",\"Organised sector\",\"Unorganised sector\",\"Private sector\"], correct:1 },\n                { q:\"Find the odd one __________.\", options:[\"Banking\",\"Railways\",\"Insurance\",\"Small Scale Industry\"], correct:3 },\n                { q:\"The sectors are classified into Public and Private sectors on the basis of __________.\", options:[\"number of workers employed\",\"nature of economic activity\",\"ownership of enterprises\",\"employment conditions\"], correct:2 },\n                { q:\"Assertion (A): The unorganised sector of the economy characterised by the household manufacturing activity and small-scale industry. Reason (R): Jobs here are low paid and often not regular.\", options:[\"Both (A) and (R) are true and (R) explains (A)\",\"Both (A) and (R) are true and (R) does not explain (A)\",\"(A) is correct and (R) is false\",\"(A) is false and (R) is true\"], correct:0 },\n                { q:\"People who employ workers and pay rewards for their work is termed as __________.\", options:[\"employee\",\"employer\",\"labour\",\"caretaker\"], correct:1 },\n                { q:\"__________ continues to be the largest employer in Tamil Nadu.\", options:[\"Agriculture\",\"Manufacturing\",\"Banking\",\"Small Scale Industry\"], correct:0 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"e3\", unit:\"Unit 3\", title:\"Money and Credit\", month:\"October\",\n            questions:{\n              mcq:[\n                { q:\"Certain metals like __________ (gold/iron) were used as a medium of exchange during ancient times.\", options:[\"gold\",\"silver\",\"iron\",\"copper\"], correct:0 },\n                { q:\"The Head Quarters of the RBI is at __________ (Chennai/Mumbai).\", options:[\"Chennai\",\"Mumbai\",\"Delhi\",\"Kolkata\"], correct:1 },\n                { q:\"International trade is carried on in terms of __________ (US Dollars/Pounds).\", options:[\"US Dollars\",\"Pounds\",\"Euros\",\"Yen\"], correct:0 },\n                { q:\"The currency of Japan is __________.\", options:[\"Yen\",\"Yuan\",\"Ringgit\",\"Dollar\"], correct:0 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"e4\", unit:\"Unit 4\", title:\"Agriculture in Tamil Nadu\", month:\"November\",\n            questions:{\n              mcq:[\n                { q:\"Irrigated land surface out of cultivable land is __________.\", options:[\"27%\",\"57%\",\"28%\",\"49%\"], correct:1 },\n                { q:\"Out of the following, which is NOT a food crop?\", options:[\"Bajra\",\"Ragi\",\"Maize\",\"Coconut\"], correct:3 },\n                { q:\"The productivity of paddy during the year 2014-2015 was __________.\", options:[\"3,039 kg\",\"4,429 kg\",\"2,775 kg\",\"3,519 kg\"], correct:1 },\n                { q:\"Both agricultural productivity and food productivity has __________.\", options:[\"decreased\",\"not stable\",\"remained stable\",\"increased\"], correct:3 },\n                { q:\"The Northeast monsoon period in Tamil Nadu is __________.\", options:[\"August – October\",\"September – November\",\"October – December\",\"November – January\"], correct:2 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n          { id:\"e5\", unit:\"Unit 5\", title:\"Migration\", month:\"January\",\n            questions:{\n              mcq:[\n                { q:\"According to the 2011 census, the total population of India was __________.\", options:[\"121 crore\",\"221 crore\",\"102 crore\",\"100 crore\"], correct:0 },\n                { q:\"__________ has recorded the maximum number of emigrants.\", options:[\"Ramanathapuram\",\"Coimbatore\",\"Chennai\",\"Vellore\"], correct:2 },\n                { q:\"During 2015, __________ of illiterates were migrants from Tamil Nadu.\", options:[\"7%\",\"175%\",\"23%\",\"9%\"], correct:0 },\n                { q:\"The poorer sections of the population migrate __________.\", options:[\"as a survival strategy\",\"to improve their living standards\",\"as a service\",\"to get experience\"], correct:0 },\n              ],\n              fill:[], match:[], brief:[], truefalse:[], reasons:[], distinguish:[], paragraph:[]\n            }\n          },\n        ]\n      }\n    }\n  },\n  \"English\": {\n    icon: \"📘\",\n    parts: {\n      \"Prose\": {\n        icon: \"📖\",\n        lessons: [\n          {\n            id:\"ep1\", unit:\"Unit 1\", title:\"Learning the Game\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"The Paralympic games are for _________.\", options:[\"children\",\"disabled people\",\"women\",\"senior citizens\"], correct:1 },\n                { q:\"The Paralympic games usually happen _________.\", options:[\"in Greece\",\"every four years\",\"after the Olympic Games\",\"every two years\"], correct:1 },\n                { q:\"The first true Paralympic Games happened in Rome in _________.\", options:[\"1960\",\"1952\",\"1848\",\"1972\"], correct:0 },\n                { q:\"In 394 BCE, the _________ stopped the Greek Olympic Games, because they didn't like them.\", options:[\"Romans\",\"Greeks\",\"British\",\"French\"], correct:0 },\n                { q:\"_________ was a doctor at the Stoke Mandeville hospital in England.\", options:[\"Pierre de Coubertin\",\"Sir Ludwig Guttmann\",\"Natalie du Toit\",\"Sachin Tendulkar\"], correct:1 },\n              ],\n              fill:[],\n              match:[\n                { q:\"Match the words with their Synonyms\",\n                  left:[\"ease\",\"evolve\",\"excess\",\"survive\",\"immense\"],\n                  right:[\"effortless\",\"progress\",\"surplus\",\"endure\",\"great\"],\n                  correct:[0,1,2,3,4] },\n                { q:\"Match the words with their Antonyms\",\n                  left:[\"concentrate\",\"inevitable\",\"occasional\",\"complete\",\"insane\"],\n                  right:[\"distract\",\"preventable\",\"continual\",\"incomplete\",\"wise\"],\n                  correct:[0,1,2,3,4] },\n              ],\n              brief:[\n                { q:\"What was coach Achrekar's first impression on Sachin?\", answer:\"Coach Achrekar's first impression on Sachin was that he was too young to play and suggested to bring him back when he was a little older.\" },\n                { q:\"Why did Sachin feel that the schedule of the camp was 'rigorous'?\", answer:\"Sachin felt it rigorous because his cricket practice was between 7:30 a.m and 10:30 a.m in the morning and again in the afternoon which continued till evening.\" },\n                { q:\"What did serve as a very personal coaching manual to Sachin?\", answer:\"Ajit, the brother of Sachin, gave a note to him containing some thoughts about batting; it served as a very personal coaching manual.\" },\n                { q:\"Why was Sachin asked to change the school?\", answer:\"The new English school in Bandra did not have cricket facilities. So he was asked to change the school.\" },\n                { q:\"What was the condition laid down by Sachin's father for changing the school?\", answer:\"The condition laid down by Sachin's father for changing the school was that Sachin should assure that he was really serious about playing cricket.\" },\n                { q:\"How did the act with the one rupee coin help Sachin become a good cricketer?\", answer:\"Winning the one rupee coin used to give him a lot of satisfaction and taught him how to concentrate even when physically drained. This type of training motivated him to become a better cricketer.\" },\n                { q:\"What did help Sachin build his physical and mental stamina?\", answer:\"The training that Sachin underwent during the summer leave of 60 days helped him build up his physical and mental stamina.\" },\n                { q:\"Which incident triggered the coach to be angry on Sachin?\", answer:\"One day Sachin bunked his daily evening practice and went to watch an inter-school cricket match. This made the coach angry with Sachin.\" },\n                { q:\"Why do you think Achrekar punished Sachin?\", answer:\"Achrekar punished Sachin to make him the best cricketer in the world.\" },\n                { q:\"'I owe myself to him' - What does Sachin mean by this?\", answer:\"Sachin became the world's best cricketer because of the training given by his coach Achrekar; without him he would not have become the cricketer he is now. So Sachin dedicates himself to his coach.\" },\n              ],\n              truefalse:[], reasons:[], distinguish:[],\n              paragraph:[\n                { q:\"'Achrekar was a sincere coach.' Substantiate. (120–150 words)\", answer:\"Achrekar was the best cricket coach of his time. He started coaching Sachin on seeing his batting. He challenged Tendulkar by placing a one rupee coin over the stumps — Sachin earned it if he remained unbowled. When Sachin did anything wrong, Achrekar punished him to refine him further. He found out the hidden talent of Sachin and moulded him carefully. He cared for him deeply. It was his far-sightedness which assured that one day Sachin would become a world famous cricketer. He was a strict disciplinarian too. When Sachin missed practice to watch a cricket match, Achrekar scolded him and told him that one day people from across the world would come to watch him play. It was the sincerity and dedication of Ramakant Achrekar that gifted a 'Kohinoor' called Sachin Tendulkar to the world of cricket.\" },\n                { q:\"Narrate in your own words the hardships undergone by Sachin to become a great cricketer. (120–150 words)\", answer:\"Sachin went through a tough time to reach his position of fame and name. Though the schedule was rigorous, he never gave up. He managed with a single set of cricket clothes. He had changed schools on his coach's suggestion. His day began at 7:30 a.m. and ended late in the evening. He would be completely exhausted by the end of the day, yet he built his physical and mental stamina through this rigorous training. He had to travel forty minutes by bus carrying a heavy kit bag, and bus conductors would embarrass him by asking him to buy two tickets. Whenever Sachin made any mistake, he was punished. But he took it positively, which helped him refine himself. All these hardships kept him simple and humble even after reaching the pinnacle of glory.\" },\n                { q:\"Quote the sentences you find most inspiring from 'Learning the Game'. How do they inspire you? Explain. (120–150 words)\", answer:\"I am most inspired by two sentences from the lesson. First, 'Don't waste your time playing insane games with these kids. Cricket is waiting for you at the nets.' This shows how Achrekar kept Sachin focused on his goal. It teaches us that we must not be distracted by unimportant activities when we have a bigger purpose to fulfil. Second, 'I owe myself to him.' This sentence shows Sachin's deep gratitude towards his coach. Even after becoming the greatest cricketer in the world, Sachin remained humble and gave full credit to his teacher. This inspires me to be grateful to those who guide and support us. These two sentences remind me that focus, hard work, and gratitude are the key qualities needed to become truly great in any field.\" },\n              ]\n            }\n          },\n        ]\n      },\n      \"Poem\": {\n        icon: \"📜\",\n        lessons: [\n          {\n            id:\"epo1\", unit:\"Unit 1\", title:\"Stopping by Woods on a Snowy Evening\", month:\"June\",\n            questions:{\n              mcq:[\n                { q:\"To whom do the woods belong?\", options:[\"The poet\",\"A farmer near the lake\",\"A person whose house is in the village\",\"The horse's owner\"], correct:2 },\n                { q:\"Why does the horse shake his harness bells?\", options:[\"He is happy\",\"He wants to rest\",\"He thinks the poet has made a mistake\",\"He sees a farmhouse\"], correct:2 },\n                { q:\"What sounds does the poet hear in the woods?\", options:[\"Birds singing and water flowing\",\"Wind and downy snowflakes\",\"The horse neighing loudly\",\"Bells and drums\"], correct:1 },\n                { q:\"Why does the poet say 'And miles to go before I sleep' twice?\", options:[\"He forgot he already said it\",\"To show he is tired\",\"To stress that he has many duties left to fulfil\",\"To describe the distance to the village\"], correct:2 },\n                { q:\"Where was the poet standing?\", options:[\"Near a farmhouse\",\"Between the woods and a frozen lake\",\"At the village gate\",\"On top of a hill\"], correct:1 },\n                { q:\"What is the rhyme scheme of the first stanza?\", options:[\"abab\",\"aabb\",\"aaba\",\"abba\"], correct:2 },\n                { q:\"'My little horse must think it queer' — what figure of speech is used here?\", options:[\"Simile\",\"Metaphor\",\"Personification\",\"Alliteration\"], correct:2 },\n                { q:\"What does 'promises to keep' symbolise?\", options:[\"A marriage promise\",\"Worldly duties and commitments\",\"A promise to return to the woods\",\"A promise made to the horse\"], correct:1 },\n              ],\n              fill:[\n                { sentence:\"After a long travel the poet entered a ___.\", answers:[\"forest\"] },\n                { sentence:\"He realized that the owner of the wood lived in a ___.\", answers:[\"village\"] },\n                { sentence:\"The horse would think it very ___ to stop near the woods.\", answers:[\"queer\"] },\n                { sentence:\"The poet was actually standing between the woods and ___.\", answers:[\"a frozen lake\"] },\n                { sentence:\"The time was ___.\", answers:[\"the darkest evening of the year\"] },\n                { sentence:\"The horse indicated that the poet has made a ___ by shaking its head.\", answers:[\"mistake\"] },\n                { sentence:\"The poet felt that the woods are lovely, ___ and ___.\", answers:[\"dark\",\"deep\"] },\n                { sentence:\"He suddenly realized that he had worldly ___ which would not allow him to ___ in the woods for a long time.\", answers:[\"promises\",\"stay\"] },\n              ],\n              match:[], \n              brief:[\n                { q:\"What information does the poet highlight about the season and the time of the day in the poem?\", answer:\"The poem is set in winter. The woods are filled with snow and the lakes are frozen. The poet sees the darkest evening of that particular year, which tells us it is night time in winter.\" },\n                { q:\"In which way is the reaction of the speaker different from that of the horse? What does it convey?\", answer:\"The poet stops b
